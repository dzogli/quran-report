t": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Суровы к неверным» расходится с 60:8 и 29:46."}, {"n": "Что сказано: Когда пришла к ним книга от Аллаха, подтверждающая то, что с ними, они не уверовали: ⟦и проклятие Аллаха — на неверных⟧.\nВ чём проблема: проклятие обращено к тем, кто не принял Коран. Вопрос о том, что считать ⟦неверием⟧: непринятие нового откровения.", "c": null, "x": [], "refs": ["2:89"], "parts": [{"ref": "2:89", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَلَمَّا جَآءَهُمْ كِتَٰبٌۭ مِّنْ عِندِ ٱللَّهِ مُصَدِّقٌۭ لِّمَا مَعَهُمْ وَكَانُوا۟ مِن قَبْلُ يَسْتَفْتِحُونَ عَلَى ٱلَّذِينَ كَفَرُوا۟ فَلَمَّا جَآءَهُم مَّا عَرَفُوا۟ كَفَرُوا۟ بِهِۦ ۚ فَلَعْنَةُ ٱللَّهِ عَلَى ٱلْكَٰفِرِينَ ﴿89﴾", "ru": "А когда пришло к ним писание, от Аллаха, подтверждающее истинность того, что с ними, - а еще прежде они просили победы против тех, которые были неверные, - так когда пришло к ним то, что они знали, они не уверовали в это. Проклятие же Аллаха над неверующими!"}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Проклятие непринявшим откровение."}, {"refs": ["60:8", "29:46", "22:17", "109:6"], "parts": [{"ref": "60:8", "sura": "Al-Mumtahana", "sura_ar": "سُورَةُ المُمۡتَحنَةِ", "type": "Medinan", "ar": "لَّا يَنْهَىٰكُمُ ٱللَّهُ عَنِ ٱلَّذِينَ لَمْ يُقَٰتِلُوكُمْ فِى ٱلدِّينِ وَلَمْ يُخْرِجُوكُم مِّن دِيَٰرِكُمْ أَن تَبَرُّوهُمْ وَتُقْسِطُوٓا۟ إِلَيْهِمْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُقْسِطِينَ ﴿8﴾", "ru": "Не дает вам Аллах запрета о тех, которые не сражались с вами из-за религии и не изгоняли вас из ваших жилищ, благодетельствовать им и быть справедливыми к ним, - ведь Аллах любит справедливых!"}, {"ref": "29:46", "sura": "Al-Ankaboot", "sura_ar": "سُورَةُ العَنكَبُوتِ", "type": "Meccan", "ar": "۞ وَلَا تُجَٰدِلُوٓا۟ أَهْلَ ٱلْكِتَٰبِ إِلَّا بِٱلَّتِى هِىَ أَحْسَنُ إِلَّا ٱلَّذِينَ ظَلَمُوا۟ مِنْهُمْ ۖ وَقُولُوٓا۟ ءَامَنَّا بِٱلَّذِىٓ أُنزِلَ إِلَيْنَا وَأُنزِلَ إِلَيْكُمْ وَإِلَٰهُنَا وَإِلَٰهُكُمْ وَٰحِدٌۭ وَنَحْنُ لَهُۥ مُسْلِمُونَ ﴿46﴾", "ru": "И не препирайтесь с обладателями книги, иначе как чем-нибудь лучшим, кроме тех из них, которые несправедливы, и говорите: \"Мы уверовали в то, что ниспослано нам и ниспослано вам. И наш Бог и ваш Бог един, и мы Ему предаемся\"."}, {"ref": "22:17", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَادُوا۟ وَٱلصَّٰبِـِٔينَ وَٱلنَّصَٰرَىٰ وَٱلْمَجُوسَ وَٱلَّذِينَ أَشْرَكُوٓا۟ إِنَّ ٱللَّهَ يَفْصِلُ بَيْنَهُمْ يَوْمَ ٱلْقِيَٰمَةِ ۚ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ شَهِيدٌ ﴿17﴾", "ru": "Поистине, те, которые уверовали, и те, которые стали иудеями и сабии, и христиане, и маги, и те, которые придают сотоварищей, - ведь Аллах различит их в день воскресения. Поистине, Аллах о всякой вещи свидетель!"}, {"ref": "109:6", "sura": "Al-Kaafiroon", "sura_ar": "سُورَةُ الكَافِرُونَ", "type": "Meccan", "ar": "لَكُمْ دِينُكُمْ وَلِىَ دِينِ ﴿6﴾", "ru": "У вас - ваша вера, и у меня - моя вера!\""}], "n": "Что сказано: ⟦Не запрещает вам Аллах благодетельствовать тем, кто не сражался с вами из-за религии, и быть справедливыми к ним⟧ (60:8); ⟦не препирайтесь с обладателями книги иначе как лучшим… наш Бог и ваш Бог — един⟧ (29:46); иудеи, сабии, христиане, маги и многобожники: «Аллах различит их в день воскресения» (22:17); «У вас — ваша вера, и у меня — моя вера» (109:6).\nВ чём проблема: эти аяты показывают, что в Коране есть и терпимость. Они нужны для объективности. Но критики отмечают: (1) они противоречат аятам о вражде и войне (9:5, 9:29, 98:6, 60:4); (2) традиция считает часть из них отменёнными (насх); (3) 109:6 в классическом толковании отменён ⟦аятом меча⟧. Верующие: смотрят на обстоятельства.", "c": null, "x": ["9:5", "9:29", "98:6", "60:4", "2:106"], "t": "Контраргументы: аяты о добром отношении к иноверцам", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Это возражение верующих: аяты о терпимости. Они есть в тексте, и их надо называть, но в 9:5 и 9:29 сказано иначе."}], "summary": ["Сильная пара: 3:85 против 2:62 и 5:69.", "Нужно называть 60:8 и 2:62 как возражение верующих."]}, {"id": "jews", "title": "Иудеи (сыны Исраила)", "icon": "✡", "group": "Люди и общество", "intro": "Как Коран описывает иудеев: обвинения в искажении Писания, нарушении завета, убийстве пророков, проклятия и превращение в обезьян. В тексте часть претензий адресована конкретным событиям из прошлого, часть — иудеям как общности.", "verses": [{"refs": ["2:65", "5:60", "7:166"], "parts": [{"ref": "2:65", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَلَقَدْ عَلِمْتُمُ ٱلَّذِينَ ٱعْتَدَوْا۟ مِنكُمْ فِى ٱلسَّبْتِ فَقُلْنَا لَهُمْ كُونُوا۟ قِرَدَةً خَٰسِـِٔينَ ﴿65﴾", "ru": "Вы знаете тех из вас, которые нарушили субботу, и Мы сказали им: \"Будьте обезьянами презренными!\""}, {"ref": "5:60", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "قُلْ هَلْ أُنَبِّئُكُم بِشَرٍّۢ مِّن ذَٰلِكَ مَثُوبَةً عِندَ ٱللَّهِ ۚ مَن لَّعَنَهُ ٱللَّهُ وَغَضِبَ عَلَيْهِ وَجَعَلَ مِنْهُمُ ٱلْقِرَدَةَ وَٱلْخَنَازِيرَ وَعَبَدَ ٱلطَّٰغُوتَ ۚ أُو۟لَٰٓئِكَ شَرٌّۭ مَّكَانًۭا وَأَضَلُّ عَن سَوَآءِ ٱلسَّبِيلِ ﴿60﴾", "ru": "Скажи: \"Не сообщить ли мне вам более злостное, чем это, по награде у Аллаха? Тот, кого проклял Аллах и на кого разгневался, и сделал из них обезьян и свиней, и кто поклонялся тагуту. Эти - злостнее по месту и более сбившиеся с ровного пути\"."}, {"ref": "7:166", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "فَلَمَّا عَتَوْا۟ عَن مَّا نُهُوا۟ عَنْهُ قُلْنَا لَهُمْ كُونُوا۟ قِرَدَةً خَٰسِـِٔينَ ﴿166﴾", "ru": "Когда же они преступили то, что им запрещали, Мы сказали им: \" Будьте обезьянами презренными!\""}], "n": "Что сказано: Нарушившим субботу Бог сказал: «Будьте обезьянами презренными!» (2:65; 7:166); о тех, на кого Он разгневался: «сделал из них обезьян и свиней» (5:60).\nВ чём проблема: (1) Если буквально — это превращение людей в животных, чего не бывает; Коран не говорит ⟦как будто⟧. (2) Некоторые толкователи понимают метафорически (⟦стали подобны обезьянам по нраву⟧), но в тексте этого нет. (3) Слова обращены к целому народу и стали оскорбительным клише. (4) Наказание потомков противоречит 6:164.", "c": null, "x": ["6:164"], "t": "«Будьте обезьянами презренными»", "at": "зависит от перевода или толкования", "pw": "средний", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. «Обезьяны презренные» — буквальное или образное прочтение. Вывод зависит от толкования."}, {"refs": ["2:61", "3:112", "5:13", "5:64", "5:78", "4:160-161", "2:90"], "parts": [{"ref": "2:61", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قُلْتُمْ يَٰمُوسَىٰ لَن نَّصْبِرَ عَلَىٰ طَعَامٍۢ وَٰحِدٍۢ فَٱدْعُ لَنَا رَبَّكَ يُخْرِجْ لَنَا مِمَّا تُنۢبِتُ ٱلْأَرْضُ مِنۢ بَقْلِهَا وَقِثَّآئِهَا وَفُومِهَا وَعَدَسِهَا وَبَصَلِهَا ۖ قَالَ أَتَسْتَبْدِلُونَ ٱلَّذِى هُوَ أَدْنَىٰ بِٱلَّذِى هُوَ خَيْرٌ ۚ ٱهْبِطُوا۟ مِصْرًۭا فَإِنَّ لَكُم مَّا سَأَلْتُمْ ۗ وَضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ وَٱلْمَسْكَنَةُ وَبَآءُو بِغَضَبٍۢ مِّنَ ٱللَّهِ ۗ ذَٰلِكَ بِأَنَّهُمْ كَانُوا۟ يَكْفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَيَقْتُلُونَ ٱلنَّبِيِّۦنَ بِغَيْرِ ٱلْحَقِّ ۗ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ ﴿61﴾", "ru": "И вот вы сказали: \"О Муса! Мы не можем стерпеть одинаковой пищи. Воззови ради нас к твоему Господу, пусть Он изведет нам то, что произращает земля из своих овощей, кабачков, чесноку, чечевицы и луку\". Сказал он: \"Неужели вы просите заменить тем, что ниже, то, что лучше? Спуститесь в Египет, и вот - для вас то, что вы просите\". И воздвигнуто было над ними унижение и бедность. И оказались они под гневом Аллаха. Это - за то, что они не уверовали в знамения Аллаха и избивали пророков без справедливости! Это - за то, что они ослушались и были преступниками!"}, {"ref": "3:112", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "ضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ أَيْنَ مَا ثُقِفُوٓا۟ إِلَّا بِحَبْلٍۢ مِّنَ ٱللَّهِ وَحَبْلٍۢ مِّنَ ٱلنَّاسِ وَبَآءُو بِغَضَبٍۢ مِّنَ ٱللَّهِ وَضُرِبَتْ عَلَيْهِمُ ٱلْمَسْكَنَةُ ۚ ذَٰلِكَ بِأَنَّهُمْ كَانُوا۟ يَكْفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَيَقْتُلُونَ ٱلْأَنۢبِيَآءَ بِغَيْرِ حَقٍّۢ ۚ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ ﴿112﴾", "ru": "Поражены они унижением, где бы ни находились, если только не с вервью Аллаха и не с вервью людей. Они оказались под гневом Аллаха, и поражены они бедностью. Это - за то, что они не веровали в знамения Аллаха и избивали пророков без права. Это - за то, что они ослушались и были преступниками."}, {"ref": "5:13", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "فَبِمَا نَقْضِهِم مِّيثَٰقَهُمْ لَعَنَّٰهُمْ وَجَعَلْنَا قُلُوبَهُمْ قَٰسِيَةًۭ ۖ يُحَرِّفُونَ ٱلْكَلِمَ عَن مَّوَاضِعِهِۦ ۙ وَنَسُوا۟ حَظًّۭا مِّمَّا ذُكِّرُوا۟ بِهِۦ ۚ وَلَا تَزَالُ تَطَّلِعُ عَلَىٰ خَآئِنَةٍۢ مِّنْهُمْ إِلَّا قَلِيلًۭا مِّنْهُمْ ۖ فَٱعْفُ عَنْهُمْ وَٱصْفَحْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُحْسِنِينَ ﴿13﴾", "ru": "И за то, что они нарушили свой договор, Мы их прокляли и сделали сердца их жестокими: они искажают слова, (переставляя их) с их мест. И забыли они часть того, что им было упомянуто. И ты не престаешь узнавать об измене с их стороны, кроме немногих их них. Прости же и извини, - ведь Аллах любит добродеющих!"}, {"ref": "5:64", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَقَالَتِ ٱلْيَهُودُ يَدُ ٱللَّهِ مَغْلُولَةٌ ۚ غُلَّتْ أَيْدِيهِمْ وَلُعِنُوا۟ بِمَا قَالُوا۟ ۘ بَلْ يَدَاهُ مَبْسُوطَتَانِ يُنفِقُ كَيْفَ يَشَآءُ ۚ وَلَيَزِيدَنَّ كَثِيرًۭا مِّنْهُم مَّآ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ طُغْيَٰنًۭا وَكُفْرًۭا ۚ وَأَلْقَيْنَا بَيْنَهُمُ ٱلْعَدَٰوَةَ وَٱلْبَغْضَآءَ إِلَىٰ يَوْمِ ٱلْقِيَٰمَةِ ۚ كُلَّمَآ أَوْقَدُوا۟ نَارًۭا لِّلْحَرْبِ أَطْفَأَهَا ٱللَّهُ ۚ وَيَسْعَوْنَ فِى ٱلْأَرْضِ فَسَادًۭا ۚ وَٱللَّهُ لَا يُحِبُّ ٱلْمُفْسِدِينَ ﴿64﴾", "ru": "И сказали иудеи: \"Рука Аллаха привязана!\" У них руки связаны, и прокляты они за то, что говорили. Нет! Руки у Него распростерты: расходует Он, как желает. И конечно, у многих из них низведенное тебе от твоего Господа только увеличивает заблуждение и неверие. Мы бросили между ними вражду и ненависть до дня воскресения. Как только они зажгут огонь для войны, тушит его Аллах. И стремятся они по земле с нечестием, а Аллах не любит распространяющих нечестие!"}, {"ref": "5:78", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "لُعِنَ ٱلَّذِينَ كَفَرُوا۟ مِنۢ بَنِىٓ إِسْرَٰٓءِيلَ عَلَىٰ لِسَانِ دَاوُۥدَ وَعِيسَى ٱبْنِ مَرْيَمَ ۚ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ ﴿78﴾", "ru": "Прокляты те из сынов Исраила, которые не веровали языком Дауда и Исы, сына Марйам! Это - за то, что они ослушались и были преступны."}, {"ref": "4:160-161", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "فَبِظُلْمٍۢ مِّنَ ٱلَّذِينَ هَادُوا۟ حَرَّمْنَا عَلَيْهِمْ طَيِّبَٰتٍ أُحِلَّتْ لَهُمْ وَبِصَدِّهِمْ عَن سَبِيلِ ٱللَّهِ كَثِيرًۭا ﴿160﴾ وَأَخْذِهِمُ ٱلرِّبَوٰا۟ وَقَدْ نُهُوا۟ عَنْهُ وَأَكْلِهِمْ أَمْوَٰلَ ٱلنَّاسِ بِٱلْبَٰطِلِ ۚ وَأَعْتَدْنَا لِلْكَٰفِرِينَ مِنْهُمْ عَذَابًا أَلِيمًۭا ﴿161﴾", "ru": "(160) и вот, за несправедливость тех, которые исповедуют иудейство, Мы запретили им блага, которые были им разрешены, и за отвращение ими многих от пути Аллаха, (161) и за то, что они брали рост, хотя это было им запрещено, и пожирали имущество людей попусту, Мы и приготовили неверным из них мучительное наказание."}, {"ref": "2:90", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "بِئْسَمَا ٱشْتَرَوْا۟ بِهِۦٓ أَنفُسَهُمْ أَن يَكْفُرُوا۟ بِمَآ أَنزَلَ ٱللَّهُ بَغْيًا أَن يُنَزِّلَ ٱللَّهُ مِن فَضْلِهِۦ عَلَىٰ مَن يَشَآءُ مِنْ عِبَادِهِۦ ۖ فَبَآءُو بِغَضَبٍ عَلَىٰ غَضَبٍۢ ۚ وَلِلْكَٰفِرِينَ عَذَابٌۭ مُّهِينٌۭ ﴿90﴾", "ru": "Плохо то, что они купили за свои души, чтобы им не веровать в то, что ниспослал Аллах, из зависти, что Аллах ниспосылает от Своей милости кому пожелает из Своих рабов! И навлекли они на себя гнев на гнев. Поистине, для неверных - наказание унизительное!"}], "n": "Что сказано: Иудеи ⟦поражены унижением и бедностью и оказались под гневом Аллаха⟧ (2:61; 3:112); ⟦за то, что они нарушили договор, Мы их прокляли и сделали сердца их жестокими⟧ (5:13); ⟦Мы возбудили среди них вражду и ненависть до дня воскресения⟧ (5:64); «прокляты те из сынов Исраила, которые не веровали» (5:78); запреты Торы — наказание (4:160); ⟦навлекли гнев на гнев⟧ (2:90).\nВ чём проблема: (1) Проклятие и «унижение» описаны как постоянное состояние народа («где бы ни находились»), независимо от личных поступков. (2) Бог Сам ⟦сделал сердца жестокими⟧ (5:13) — то есть, как в разделе ⟦Предопределение⟧, причина неверия — действие Бога. (3) Вражда «до дня воскресения» названа делом Бога (5:64).\nКак отвечают верующие: аяты относятся к конкретным грехам прошлых поколений (убийство пророков, нарушение договора); критики отвечают, что формулировки охватывают весь народ.", "c": null, "x": ["6:164", "2:7"], "t": "Проклятия, унижение и вражда", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Проклятие целому народу расходится с личной ответственностью (6:164)."}, {"n": "Что сказано: ⟦Горе тем, которые пишут писание своими руками, а потом говорят: Это от Аллаха, чтобы купить за это небольшую цену⟧.\nВ чём проблема: обвинение в подлоге писаний. Но в 5:68 людям Писания велено ⟦установить прямо Тору и Евангелие⟧, в 10:94 сказано ⟦спроси тех, кто читает писание до тебя⟧, в 2:41 Коран ⟦подтверждает⟧ то, что у них есть. Если Тора и Евангелие подделаны — ссылаться на них бессмысленно; если подлинны — почему Коран им противоречит (4:157, 5:116)? Это центральный вопрос.", "c": null, "x": ["5:68", "10:94", "2:41", "4:157"], "refs": ["2:79"], "parts": [{"ref": "2:79", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "فَوَيْلٌۭ لِّلَّذِينَ يَكْتُبُونَ ٱلْكِتَٰبَ بِأَيْدِيهِمْ ثُمَّ يَقُولُونَ هَٰذَا مِنْ عِندِ ٱللَّهِ لِيَشْتَرُوا۟ بِهِۦ ثَمَنًۭا قَلِيلًۭا ۖ فَوَيْلٌۭ لَّهُم مِّمَّا كَتَبَتْ أَيْدِيهِمْ وَوَيْلٌۭ لَّهُم مِّمَّا يَكْسِبُونَ ﴿79﴾", "ru": "Горе же тем, которые пишут писание своими руками, о потом говорят: \"Это от Аллаха\", - чтобы купить за это небольшую цену! Горе же им за то, что написали их руки, и горе им за то, что они приобретают!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Обвинение в подлоге писаний, а 5:68 велит «установить Тору». Если Тора подделана, непонятно, как ей следовать. Верующие говорят о частных искажениях."}, {"n": "Что сказано: «Слышал Аллах речи тех, которые говорили: Ведь Аллах беден, а мы богаты».\nВ чём проблема: иудеям приписана фраза, которой нет в Торе и известных иудейских источниках. Критики видят искажение чужих взглядов; в тексте не названо, кто так сказал.", "c": "В иудаизме такого утверждения нет; критики считают это искажением чужих взглядов.", "x": [], "refs": ["3:181"], "parts": [{"ref": "3:181", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "لَّقَدْ سَمِعَ ٱللَّهُ قَوْلَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ فَقِيرٌۭ وَنَحْنُ أَغْنِيَآءُ ۘ سَنَكْتُبُ مَا قَالُوا۟ وَقَتْلَهُمُ ٱلْأَنۢبِيَآءَ بِغَيْرِ حَقٍّۢ وَنَقُولُ ذُوقُوا۟ عَذَابَ ٱلْحَرِيقِ ﴿181﴾", "ru": "Слышал Аллах речи тех, которые говорили: \"Ведь Аллах беден, а мы богаты\". Мы запишем то, что они говорили, и избиение ими пророков без права и скажем: \"Вкусите наказание огня!\""}], "t": null, "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Приписанная иудеям фраза неизвестна по их источникам. Формулировать: «критики указывают»."}, {"n": "Что сказано: ⟦Ты, конечно, найдёшь, что более всех людей сильны ненавистью к уверовавшим иудеи и многобожники, и найдёшь, что ближе всех по любви к уверовавшим — те, кто говорит: Мы — христиане⟧.\nВ чём проблема: обобщение по народу. При этом христиане здесь названы близкими, а в 5:72-73 — неверными: в нескольких аятах подряд разные оценки одной общины.", "c": null, "x": ["5:72-75"], "refs": ["5:82"], "parts": [{"ref": "5:82", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "۞ لَتَجِدَنَّ أَشَدَّ ٱلنَّاسِ عَدَٰوَةًۭ لِّلَّذِينَ ءَامَنُوا۟ ٱلْيَهُودَ وَٱلَّذِينَ أَشْرَكُوا۟ ۖ وَلَتَجِدَنَّ أَقْرَبَهُم مَّوَدَّةًۭ لِّلَّذِينَ ءَامَنُوا۟ ٱلَّذِينَ قَالُوٓا۟ إِنَّا نَصَٰرَىٰ ۚ ذَٰلِكَ بِأَنَّ مِنْهُمْ قِسِّيسِينَ وَرُهْبَانًۭا وَأَنَّهُمْ لَا يَسْتَكْبِرُونَ ﴿82﴾", "ru": "Ты, конечно, найдешь, что более всех людей сильны ненавистью к уверовавшим иудеи и многобожники, и ты, конечно, найдешь, что самые близкие по любви к уверовавшим те, которые говорили: \"Мы - христиане!\" Это - потому, что среди них есть иереи и монахи и что они не превозносятся."}], "t": null, "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Христиане названы близкими, а в 5:72-73 неверными."}, {"n": "Что сказано: ⟦Подобие тех, кому было дано нести Тору, а они её не понесли, — как подобие осла, который несёт книги⟧.\nВ чём проблема: оскорбительное сравнение людей с ослом — по вере и поведению. Критики: сравнения людей с животными (см. 8:22, 25:44) несовместимы с речью высшего существа.", "c": null, "x": ["8:22"], "refs": ["62:5"], "parts": [{"ref": "62:5", "sura": "Al-Jumu'a", "sura_ar": "سُورَةُ الجُمُعَةِ", "type": "Medinan", "ar": "مَثَلُ ٱلَّذِينَ حُمِّلُوا۟ ٱلتَّوْرَىٰةَ ثُمَّ لَمْ يَحْمِلُوهَا كَمَثَلِ ٱلْحِمَارِ يَحْمِلُ أَسْفَارًۢا ۚ بِئْسَ مَثَلُ ٱلْقَوْمِ ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِ ٱللَّهِ ۚ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ ﴿5﴾", "ru": "Те, кому было дано нести Тору, а они ее не понесли, подобен ослу, который несет книги. Скверно подобие людей, которые считали ложью знамения Аллаха! Аллах не ведет людей неправедных!"}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Сравнение с ослом. Этическая претензия."}, {"n": "Что сказано: ⟦Иудеи сказали: Узайр — сын Аллаха. И христиане сказали: Мессия — сын Аллаха… Пусть поразит их Аллах!⟧\nВ чём проблема: (1) Нет известной иудейской группы, называвшей Эзру (Узайра) ⟦сыном Бога⟧; в иудейских источниках такого учения нет. (2) Заканчивается проклятием обеим общинам.\nКак отвечают верующие: мусульманские толкователи ссылаются на отдельные группы в Аравии; доказательств нет.", "c": "Исторически нет свидетельств, что иудеи считали Узайра (Ездру) ⟦сыном Бога⟧; см. раздел о противоречиях.", "x": ["5:17"], "refs": ["9:30"], "parts": [{"ref": "9:30", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "وَقَالَتِ ٱلْيَهُودُ عُزَيْرٌ ٱبْنُ ٱللَّهِ وَقَالَتِ ٱلنَّصَٰرَى ٱلْمَسِيحُ ٱبْنُ ٱللَّهِ ۖ ذَٰلِكَ قَوْلُهُم بِأَفْوَٰهِهِمْ ۖ يُضَٰهِـُٔونَ قَوْلَ ٱلَّذِينَ كَفَرُوا۟ مِن قَبْلُ ۚ قَٰتَلَهُمُ ٱللَّهُ ۚ أَنَّىٰ يُؤْفَكُونَ ﴿30﴾", "ru": "И сказали иудеи: \"Узайр - сын Аллаха\". И сказали христиане: \"Мессия - сын Аллаха\". Эти слова в их устах похожи на слова тех, которые не веровали раньше. Пусть поразит их Аллах! До чего они отвращены!"}], "t": null, "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Нет известной иудейской группы с таким учением. Формулировать: «критики указывают»."}], "summary": ["Сильнее всего 2:79 против 5:68, 10:94.", "Утверждения о том, что иудеи говорили то-то (3:181, 9:30), проверяемы; пишите «критики указывают»."]}, {"id": "christians", "title": "Христиане и учение о Троице", "icon": "✝", "group": "Люди и общество", "intro": "Что Коран говорит о христианах и христианской вере: отрицание Троицы, распятия и божественности Иисуса, а также описание Троицы, не совпадающее с христианским учением.", "verses": [{"n": "Что сказано: «С тех, которые говорят: Мы — христиане!, Мы взяли завет. И они забыли часть того, что им было упомянуто, и Мы возбудили среди них вражду и ненависть до дня воскресения».\nВ чём проблема: вражда между христианами приписана действию Бога («Мы возбудили»), как в 5:64 для иудеев. Бог Сам вызывает вражду, а потом наказывает; ср. ⟦Предопределение⟧.", "c": null, "x": ["5:64"], "refs": ["5:14"], "parts": [{"ref": "5:14", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَمِنَ ٱلَّذِينَ قَالُوٓا۟ إِنَّا نَصَٰرَىٰٓ أَخَذْنَا مِيثَٰقَهُمْ فَنَسُوا۟ حَظًّۭا مِّمَّا ذُكِّرُوا۟ بِهِۦ فَأَغْرَيْنَا بَيْنَهُمُ ٱلْعَدَاوَةَ وَٱلْبَغْضَآءَ إِلَىٰ يَوْمِ ٱلْقِيَٰمَةِ ۚ وَسَوْفَ يُنَبِّئُهُمُ ٱللَّهُ بِمَا كَانُوا۟ يَصْنَعُونَ ﴿14﴾", "ru": "И с тех, которые говорят: \"Мы - христиане!\" - Мы взяли завет. И они забыли часть того, что им было упомянуто, и Мы возбудили среди них вражду и ненависть до дня воскресения. А потом сообщит им Аллах, что они совершали!"}], "t": null, "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Вражда приписана Богу."}, {"n": "Что сказано: ⟦Не веруют те, которые говорят, что Аллах — это Мессия, сын Марйам. Скажи: Кто властен чем-нибудь у Аллаха, если Он захочет погубить Мессию, сына Марйам, и его мать, и всех, кто на земле?⟧\nВ чём проблема: христианам приписано утверждение ⟦Бог — это Мессия⟧; для христиан Иисус — не ⟦весь Бог⟧, а второе лицо Троицы. Довод ⟦Бог может погубить Мессию⟧ не отвечает на христианскую позицию.", "c": null, "x": ["5:72-75"], "refs": ["5:17"], "parts": [{"ref": "5:17", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "لَّقَدْ كَفَرَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ هُوَ ٱلْمَسِيحُ ٱبْنُ مَرْيَمَ ۚ قُلْ فَمَن يَمْلِكُ مِنَ ٱللَّهِ شَيْـًٔا إِنْ أَرَادَ أَن يُهْلِكَ ٱلْمَسِيحَ ٱبْنَ مَرْيَمَ وَأُمَّهُۥ وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ۗ وَلِلَّهِ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا ۚ يَخْلُقُ مَا يَشَآءُ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿17﴾", "ru": "Не веруют те, которые говорят, что Аллах - это Мессия, сын Марйам. Скажи: \"Кто же властен чем-нибудь у Аллаха, если Он захочет погубить Мессию, сына Марйам, и его мать, и тех, кто на земле, всех?\" Аллаху принадлежит власть над небесами и землей и тем, что между ними. Он творит то, что желает: ведь Аллах над всякой вещью властен!"}], "t": null, "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. «Бог — это Мессия» не совпадает с христианским учением. Критики указывают на неточность."}, {"n": "Что сказано: ⟦Не веровали те, которые говорили: Ведь Аллах — Мессия, сын Марйам… Не веровали те, которые говорили: Ведь Аллах — третий из трёх… Мессия — только посланник… он и его мать ели пищу⟧.\nВ чём проблема: Коран критикует тезис ⟦Бог — это Мессия⟧ и ⟦Бог — третий из трёх⟧ как христианские. Но христианское учение говорит о Троице — Отце, Сыне и Святом Духе, а не ⟦Бог, Иисус, Мария⟧ (так в 5:116). Довод «ели пищу» не отвечает христианам, которые признают человеческую природу Иисуса.", "c": "В христианском учении Троица — Отец, Сын и Святой Дух, а не Бог, Иисус и Мария.", "x": ["5:116", "4:171"], "refs": ["5:72-75"], "parts": [{"ref": "5:72-75", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "لَقَدْ كَفَرَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ هُوَ ٱلْمَسِيحُ ٱبْنُ مَرْيَمَ ۖ وَقَالَ ٱلْمَسِيحُ يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱعْبُدُوا۟ ٱللَّهَ رَبِّى وَرَبَّكُمْ ۖ إِنَّهُۥ مَن يُشْرِكْ بِٱللَّهِ فَقَدْ حَرَّمَ ٱللَّهُ عَلَيْهِ ٱلْجَنَّةَ وَمَأْوَىٰهُ ٱلنَّارُ ۖ وَمَا لِلظَّٰلِمِينَ مِنْ أَنصَارٍۢ ﴿72﴾ لَّقَدْ كَفَرَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ ثَالِثُ ثَلَٰثَةٍۢ ۘ وَمَا مِنْ إِلَٰهٍ إِلَّآ إِلَٰهٌۭ وَٰحِدٌۭ ۚ وَإِن لَّمْ يَنتَهُوا۟ عَمَّا يَقُولُونَ لَيَمَسَّنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْهُمْ عَذَابٌ أَلِيمٌ ﴿73﴾ أَفَلَا يَتُوبُونَ إِلَى ٱللَّهِ وَيَسْتَغْفِرُونَهُۥ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ ﴿74﴾ مَّا ٱلْمَسِيحُ ٱبْنُ مَرْيَمَ إِلَّا رَسُولٌۭ قَدْ خَلَتْ مِن قَبْلِهِ ٱلرُّسُلُ وَأُمُّهُۥ صِدِّيقَةٌۭ ۖ كَانَا يَأْكُلَانِ ٱلطَّعَامَ ۗ ٱنظُرْ كَيْفَ نُبَيِّنُ لَهُمُ ٱلْءَايَٰتِ ثُمَّ ٱنظُرْ أَنَّىٰ يُؤْفَكُونَ ﴿75﴾", "ru": "(72) Не веровали те, которые говорили: \"Ведь Аллах - Мессия, сын Марйам\". А Мессия сказал: \"О сыны Исраила! Поклоняйтесь Аллаху, Господу моему и Господу вашему!\" Ведь, кто придает Аллаху сотоварищей, тому Аллах запретил рай. Убежищем для него - огонь, и нет для неправедных помощников! (73) Не веровали те, которые говорили: \"Ведь Аллах - третий из трех\", - тогда как нет другого божества, кроме единого Бога. А если они не удержатся от того, что говорят, то коснется тех из них, которые не уверовали, мучительное наказание. (74) Неужели они не обратятся к Аллаху и не попросят у Него прощения? Ведь Аллах - прощающий, милостивый! (75) Мессия, сын Марйам, - только посланник, прошли уже до него посланники, а мать его - праведница. Оба они ели пищу. Посмотри, как разъясняем Мы им знамения; потом посмотри, до чего они отвращены!"}], "t": null, "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Троица описана иначе, чем в учении. Критики указывают; верующие говорят о конкретных группах."}, {"refs": ["19:88-93", "112:1-4", "4:171"], "parts": [{"ref": "19:88-93", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "وَقَالُوا۟ ٱتَّخَذَ ٱلرَّحْمَٰنُ وَلَدًۭا ﴿88﴾ لَّقَدْ جِئْتُمْ شَيْـًٔا إِدًّۭا ﴿89﴾ تَكَادُ ٱلسَّمَٰوَٰتُ يَتَفَطَّرْنَ مِنْهُ وَتَنشَقُّ ٱلْأَرْضُ وَتَخِرُّ ٱلْجِبَالُ هَدًّا ﴿90﴾ أَن دَعَوْا۟ لِلرَّحْمَٰنِ وَلَدًۭا ﴿91﴾ وَمَا يَنۢبَغِى لِلرَّحْمَٰنِ أَن يَتَّخِذَ وَلَدًا ﴿92﴾ إِن كُلُّ مَن فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ إِلَّآ ءَاتِى ٱلرَّحْمَٰنِ عَبْدًۭا ﴿93﴾", "ru": "(88) И говорят они: \"Взял Себе Милосердный сына\". (89) Вы совершили вещь гнусную. (90) Небеса готовы распасться от этого, и земля разверзнуться, горы пасть прахом (91) оттого, что они приписали Милосердному сына. (92) Не подобает Милосердному брать Себе сына. (93) Всякий, кто в небесах и на земле, приходит к Милосердному только как раб;"}, {"ref": "112:1-4", "sura": "Al-Ikhlaas", "sura_ar": "سُورَةُ الإِخۡلَاصِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ هُوَ ٱللَّهُ أَحَدٌ ﴿1﴾ ٱللَّهُ ٱلصَّمَدُ ﴿2﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿3﴾ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ ﴿4﴾", "ru": "(1) Скажи: \"Он - Аллах - един, (2) Аллах, вечный; (3) не родил и не был рожден, (4) и не был Ему равным ни один!\""}, {"ref": "4:171", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَٰٓأَهْلَ ٱلْكِتَٰبِ لَا تَغْلُوا۟ فِى دِينِكُمْ وَلَا تَقُولُوا۟ عَلَى ٱللَّهِ إِلَّا ٱلْحَقَّ ۚ إِنَّمَا ٱلْمَسِيحُ عِيسَى ٱبْنُ مَرْيَمَ رَسُولُ ٱللَّهِ وَكَلِمَتُهُۥٓ أَلْقَىٰهَآ إِلَىٰ مَرْيَمَ وَرُوحٌۭ مِّنْهُ ۖ فَـَٔامِنُوا۟ بِٱللَّهِ وَرُسُلِهِۦ ۖ وَلَا تَقُولُوا۟ ثَلَٰثَةٌ ۚ ٱنتَهُوا۟ خَيْرًۭا لَّكُمْ ۚ إِنَّمَا ٱللَّهُ إِلَٰهٌۭ وَٰحِدٌۭ ۖ سُبْحَٰنَهُۥٓ أَن يَكُونَ لَهُۥ وَلَدٌۭ ۘ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ وَكَفَىٰ بِٱللَّهِ وَكِيلًۭا ﴿171﴾", "ru": "О обладатели писания! Не излишествуйте в вашей религии и не говорите против Аллаха ничего, кроме истины. Ведь Мессия, Иса, сын Марйам, - только посланник Аллаха и Его слово, которое Он бросил Марйам, и дух Его. Веруйте же в Аллаха и Его посланников и не говорите - три ! Удержитесь, это - лучшее для вас, Поистине, Аллах - только единый бог. Достохвальнее Он того, чтобы у Него был ребенок. Ему - то, что в небесах, и то, что на земле. Довольно Аллаха как поручителя!"}], "n": "Что сказано: «И говорят они: Взял Себе Милосердный сына. Вы совершили вещь гнусную. Небеса готовы распасться» (19:88-90); ⟦Он не родил и не был рождён⟧ (112:3); ⟦не говорите: три! Аллах — только единый Бог, достохвальнее Он того, чтобы у Него был ребёнок⟧ (4:171).\nВ чём проблема: Коран отвергает идею «сына» как телесное ⟦рождение⟧. Но христианское учение говорит о Сыне как о вечном, а не рождённом по плоти. Критики: возражение направлено против того, чего христиане не утверждают. Вдобавок в 5:116 Троица описана как Бог, Иисус и Мария.", "c": null, "x": ["5:116", "5:72-75"], "t": "Отрицание «сына» Бога", "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Отрицание «рождения» Сына не отвечает христианскому учению. Критики указывают."}], "summary": ["Описание учения о Троице не совпадает с христианским (5:72-75, 5:116).", "Верующие отвечают: речь о конкретных группах."]}, {"id": "apostasy", "title": "Вероотступники и лицемеры", "icon": "☠", "group": "Люди и общество", "intro": "Аяты о тех, кто отходит от ислама или лицемерит. В этих аятах угроза обращена к будущей жизни; прямого указания на земную казнь за отступничество в них нет, но в аятах 4:89 и 33:61 содержатся приказы убивать; классическое право опиралось на них.", "verses": [{"n": "Что сказано: «Если кто из вас отпадает от вашей религии и умрёт неверным, у таких тщетны их деяния в ближайшей и будущей жизни! Эти — обитатели огня, они в нём вечно пребывают!»\nВ чём проблема: здесь отступнику угрожает только наказание в будущей жизни; земного наказания нет. Но 4:89 велит убивать ⟦отвернувшихся⟧ — две разные позиции в одном Коране. Классическое право выбрало вторую.", "c": null, "x": ["4:89", "2:256", "18:29"], "refs": ["2:217"], "parts": [{"ref": "2:217", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "يَسْـَٔلُونَكَ عَنِ ٱلشَّهْرِ ٱلْحَرَامِ قِتَالٍۢ فِيهِ ۖ قُلْ قِتَالٌۭ فِيهِ كَبِيرٌۭ ۖ وَصَدٌّ عَن سَبِيلِ ٱللَّهِ وَكُفْرٌۢ بِهِۦ وَٱلْمَسْجِدِ ٱلْحَرَامِ وَإِخْرَاجُ أَهْلِهِۦ مِنْهُ أَكْبَرُ عِندَ ٱللَّهِ ۚ وَٱلْفِتْنَةُ أَكْبَرُ مِنَ ٱلْقَتْلِ ۗ وَلَا يَزَالُونَ يُقَٰتِلُونَكُمْ حَتَّىٰ يَرُدُّوكُمْ عَن دِينِكُمْ إِنِ ٱسْتَطَٰعُوا۟ ۚ وَمَن يَرْتَدِدْ مِنكُمْ عَن دِينِهِۦ فَيَمُتْ وَهُوَ كَافِرٌۭ فَأُو۟لَٰٓئِكَ حَبِطَتْ أَعْمَٰلُهُمْ فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ ۖ وَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَٰلِدُونَ ﴿217﴾", "ru": "Спрашивают они тебя о запретном месяце - сражении в нем. Скажи: \"Сражение в нем велико, а отвращение от пути Аллаха, неверие в него и запретную мечеть и изгнание оттуда ее обитателей - еще больше пред Аллахом: ведь соблазн - больше, чем убиение!\" А они не перестанут сражаться с вами, пока не отвратят вас от вашей религии, если смогут. А если кто из вас отпадает от вашей религии и умрет неверным, у таких - тщетны их деяния в ближайшей и будущей жизни! Эти - обитатели огня, они в нем вечно пребывают!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Отступнику угрожает лишь будущая кара, а 4:89 велит убивать. Две позиции в одном тексте; решение традиции — вторая."}, {"refs": ["3:86-87", "4:137", "9:66"], "parts": [{"ref": "3:86-87", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "كَيْفَ يَهْدِى ٱللَّهُ قَوْمًۭا كَفَرُوا۟ بَعْدَ إِيمَٰنِهِمْ وَشَهِدُوٓا۟ أَنَّ ٱلرَّسُولَ حَقٌّۭ وَجَآءَهُمُ ٱلْبَيِّنَٰتُ ۚ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ ﴿86﴾ أُو۟لَٰٓئِكَ جَزَآؤُهُمْ أَنَّ عَلَيْهِمْ لَعْنَةَ ٱللَّهِ وَٱلْمَلَٰٓئِكَةِ وَٱلنَّاسِ أَجْمَعِينَ ﴿87﴾", "ru": "(86) Как Аллах будет вести прямым путем людей, которые отрекались после того, как они уверовали и засвидетельствовали, что посланник - истина, и пришли к ним ясные знамения? Поистине, Аллах не ведет людей неправедных! (87) Этим воздаяние - в том, что на них - проклятие Аллаха, и ангелов, и всех людей."}, {"ref": "4:137", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ ءَامَنُوا۟ ثُمَّ كَفَرُوا۟ ثُمَّ ءَامَنُوا۟ ثُمَّ كَفَرُوا۟ ثُمَّ ٱزْدَادُوا۟ كُفْرًۭا لَّمْ يَكُنِ ٱللَّهُ لِيَغْفِرَ لَهُمْ وَلَا لِيَهْدِيَهُمْ سَبِيلًۢا ﴿137﴾", "ru": "Поистине, те, которые уверовали, а потом отреклись, потом опять уверовали, потом открылись, потом усилили неверие, - не таков Аллах, чтобы простить им или повести их по пути."}, {"ref": "9:66", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "لَا تَعْتَذِرُوا۟ قَدْ كَفَرْتُم بَعْدَ إِيمَٰنِكُمْ ۚ إِن نَّعْفُ عَن طَآئِفَةٍۢ مِّنكُمْ نُعَذِّبْ طَآئِفَةًۢ بِأَنَّهُمْ كَانُوا۟ مُجْرِمِينَ ﴿66﴾", "ru": "Не извиняйтесь! Вы оказались неверными, после того как уверовали. Если Мы простим одной партии вас, то накажем другую партию за то, что они были грешниками."}], "n": "Что сказано: ⟦Как Аллах будет вести прямым путём людей, которые отреклись после того, как уверовали… на них — проклятие Аллаха, ангелов и всех людей⟧ (3:86-87); уверовали, отреклись, снова уверовали, снова отреклись — «не таков Аллах, чтобы простить им» (4:137); «Не извиняйтесь! Вы оказались неверными, после того как уверовали» (9:66).\nВ чём проблема: (1) вечное проклятие за смену взглядов; (2) в 4:137 прощение исключено, а в 39:53 сказано: ⟦Аллах прощает грехи полностью⟧; (3) в 9:66 ⟦неверием⟧ названы слова, сказанные ⟦играя и шутя⟧ (в контексте — насмешки над религией); (4) земного наказания здесь нет, но в 4:89 есть приказ убивать ⟦отвернувшихся⟧.", "c": null, "x": ["39:53", "4:89", "2:256"], "t": "Отречение от веры", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Вечное проклятие и 4:137 против прощения (39:53)."}, {"refs": ["4:145", "9:74", "9:101", "63:4"], "parts": [{"ref": "4:145", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِنَّ ٱلْمُنَٰفِقِينَ فِى ٱلدَّرْكِ ٱلْأَسْفَلِ مِنَ ٱلنَّارِ وَلَن تَجِدَ لَهُمْ نَصِيرًا ﴿145﴾", "ru": "Поистине, лицемеры - в нижнем слое огня, и никогда не найдешь ты для них помощника, -"}, {"ref": "9:74", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَحْلِفُونَ بِٱللَّهِ مَا قَالُوا۟ وَلَقَدْ قَالُوا۟ كَلِمَةَ ٱلْكُفْرِ وَكَفَرُوا۟ بَعْدَ إِسْلَٰمِهِمْ وَهَمُّوا۟ بِمَا لَمْ يَنَالُوا۟ ۚ وَمَا نَقَمُوٓا۟ إِلَّآ أَنْ أَغْنَىٰهُمُ ٱللَّهُ وَرَسُولُهُۥ مِن فَضْلِهِۦ ۚ فَإِن يَتُوبُوا۟ يَكُ خَيْرًۭا لَّهُمْ ۖ وَإِن يَتَوَلَّوْا۟ يُعَذِّبْهُمُ ٱللَّهُ عَذَابًا أَلِيمًۭا فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ ۚ وَمَا لَهُمْ فِى ٱلْأَرْضِ مِن وَلِىٍّۢ وَلَا نَصِيرٍۢ ﴿74﴾", "ru": "Они клянутся Аллахом, что не говорили , когда они уже сказали слово неверия и стали неверными после своего ислама. И задумали они то, чего не достигли, и мстят они только за то, что обогатил их Аллах и Его посланник от Своей щедрости. И если они обратятся, - будет лучше для них, а если отвернутся, - накажет их Аллах мучительным наказанием в ближайшей жизни и в будущей. Нет им на земле ни заступника, ни помощника!"}, {"ref": "9:101", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "وَمِمَّنْ حَوْلَكُم مِّنَ ٱلْأَعْرَابِ مُنَٰفِقُونَ ۖ وَمِنْ أَهْلِ ٱلْمَدِينَةِ ۖ مَرَدُوا۟ عَلَى ٱلنِّفَاقِ لَا تَعْلَمُهُمْ ۖ نَحْنُ نَعْلَمُهُمْ ۚ سَنُعَذِّبُهُم مَّرَّتَيْنِ ثُمَّ يُرَدُّونَ إِلَىٰ عَذَابٍ عَظِيمٍۢ ﴿101﴾", "ru": "А среди бедуинов, что вокруг вас, и жителей Медины есть лицемеры; они - упрямы в лицемерии. Ты их не знаешь, Мы их знаем. Мы их накажем дважды, потом они будут возвращены к великому наказанию."}, {"ref": "63:4", "sura": "Al-Munaafiqoon", "sura_ar": "سُورَةُ المُنَافِقُونَ", "type": "Medinan", "ar": "۞ وَإِذَا رَأَيْتَهُمْ تُعْجِبُكَ أَجْسَامُهُمْ ۖ وَإِن يَقُولُوا۟ تَسْمَعْ لِقَوْلِهِمْ ۖ كَأَنَّهُمْ خُشُبٌۭ مُّسَنَّدَةٌۭ ۖ يَحْسَبُونَ كُلَّ صَيْحَةٍ عَلَيْهِمْ ۚ هُمُ ٱلْعَدُوُّ فَٱحْذَرْهُمْ ۚ قَٰتَلَهُمُ ٱللَّهُ ۖ أَنَّىٰ يُؤْفَكُونَ ﴿4﴾", "ru": "А когда ты их увидишь, тебя восхищают их фигуры. Если они говорят, ты слушаешь их слова, точно они столпы приставленные. Они принимают всякий крик - против них. Они - враги, берегись же их! Пусть Аллах их поразит, до чего они обольщены!"}], "n": "Что сказано: Лицемеры — «в нижнем слое огня» (4:145); «сказали слово неверия и стали неверными после своего ислама» (9:74); ⟦Мы дважды накажем их, потом они будут возвращены к великому наказанию⟧ (9:101); «они — враги, берегись же их! Пусть Аллах их поразит» (63:4).\nВ чём проблема: лицемерие — внутреннее состояние, его трудно доказать, а наказание за него самое тяжёлое (⟦нижний слой огня⟧). В 9:101 признано: «Ты их не знаешь, Мы их знаем» — то есть Пророк не знает, кто лицемер; как же их определять? Это создаёт условия для произвольных обвинений.", "c": null, "x": ["33:61"], "t": "Лицемеры", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Лицемерие трудно доказать, а наказание самое тяжёлое; 9:101 признаёт, что Пророк не знает лицемеров."}, {"n": "Что сказано: «Кто отказался от Аллаха после веры в Него — кроме тех, которые вынуждены, а сердце их спокойно в вере, — только тот, кто открыл неверию свою грудь, на них — гнев Аллаха».\nВ чём проблема: допущено отречение на словах под принуждением (такийя), если сердце остаётся верующим. Но в 9:66 ⟦неверием⟧ названы слова, сказанные в шутку. Критерии — слова или сердце — применяются непоследовательно.", "c": null, "x": ["3:28", "9:66"], "refs": ["16:106"], "parts": [{"ref": "16:106", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "مَن كَفَرَ بِٱللَّهِ مِنۢ بَعْدِ إِيمَٰنِهِۦٓ إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُۥ مُطْمَئِنٌّۢ بِٱلْإِيمَٰنِ وَلَٰكِن مَّن شَرَحَ بِٱلْكُفْرِ صَدْرًۭا فَعَلَيْهِمْ غَضَبٌۭ مِّنَ ٱللَّهِ وَلَهُمْ عَذَابٌ عَظِيمٌۭ ﴿106﴾", "ru": "Кто отказался от Аллаха после веры в Него - кроме тех, которые вынуждены, а сердце их спокойно в вере - только тот, кто открыл неверию свою грудь, на них - гнев Аллаха, им - наказание великое."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Отречение на словах допущено, а 9:66 называет неверием слова в шутку. Критерии непоследовательны."}, {"refs": ["10:90-92", "4:18", "40:84-85", "39:53", "25:70"], "parts": [{"ref": "10:90-92", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "۞ وَجَٰوَزْنَا بِبَنِىٓ إِسْرَٰٓءِيلَ ٱلْبَحْرَ فَأَتْبَعَهُمْ فِرْعَوْنُ وَجُنُودُهُۥ بَغْيًۭا وَعَدْوًا ۖ حَتَّىٰٓ إِذَآ أَدْرَكَهُ ٱلْغَرَقُ قَالَ ءَامَنتُ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا ٱلَّذِىٓ ءَامَنَتْ بِهِۦ بَنُوٓا۟ إِسْرَٰٓءِيلَ وَأَنَا۠ مِنَ ٱلْمُسْلِمِينَ ﴿90﴾ ءَآلْـَٰٔنَ وَقَدْ عَصَيْتَ قَبْلُ وَكُنتَ مِنَ ٱلْمُفْسِدِينَ ﴿91﴾ فَٱلْيَوْمَ نُنَجِّيكَ بِبَدَنِكَ لِتَكُونَ لِمَنْ خَلْفَكَ ءَايَةًۭ ۚ وَإِنَّ كَثِيرًۭا مِّنَ ٱلنَّاسِ عَنْ ءَايَٰتِنَا لَغَٰفِلُونَ ﴿92﴾", "ru": "(90) И перевели Мы сынов Исраила через море, а Фираун и его войска погнались за ними коварно и враждебно. А когда его настиг потоп, он сказал: \"Верую, что нет божества, кроме того, в кого веруют сыны Исраила, и я - из числа предавшихся!\" (91) Да, теперь! А раньше ты ослушался и был распространителем нечестия. (92) И сегодня Мы спасаем тебя с твоим телом, чтобы ты был знамением для тех, кто за тобой. Поистине, многие из людей Нашими знамениями небрегут!"}, {"ref": "4:18", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَلَيْسَتِ ٱلتَّوْبَةُ لِلَّذِينَ يَعْمَلُونَ ٱلسَّيِّـَٔاتِ حَتَّىٰٓ إِذَا حَضَرَ أَحَدَهُمُ ٱلْمَوْتُ قَالَ إِنِّى تُبْتُ ٱلْـَٰٔنَ وَلَا ٱلَّذِينَ يَمُوتُونَ وَهُمْ كُفَّارٌ ۚ أُو۟لَٰٓئِكَ أَعْتَدْنَا لَهُمْ عَذَابًا أَلِيمًۭا ﴿18﴾", "ru": "Но нет обращения к тем, которые совершают дурное, а когда предстанет пред кем-нибудь из них смерть, он говорит: \"Я обращаюсь теперь\"... И к тем, которые умирает, будучи неверными. Этим мы приготовили наказание мучительное."}, {"ref": "40:84-85", "sura": "Ghafir", "sura_ar": "سُورَةُ غَافِرٍ", "type": "Meccan", "ar": "فَلَمَّا رَأَوْا۟ بَأْسَنَا قَالُوٓا۟ ءَامَنَّا بِٱللَّهِ وَحْدَهُۥ وَكَفَرْنَا بِمَا كُنَّا بِهِۦ مُشْرِكِينَ ﴿84﴾ فَلَمْ يَكُ يَنفَعُهُمْ إِيمَٰنُهُمْ لَمَّا رَأَوْا۟ بَأْسَنَا ۖ سُنَّتَ ٱللَّهِ ٱلَّتِى قَدْ خَلَتْ فِى عِبَادِهِۦ ۖ وَخَسِرَ هُنَالِكَ ٱلْكَٰفِرُونَ ﴿85﴾", "ru": "(84) И когда они увидели Нашу мощь, то сказали: \"Уверовали мы в Аллаха единого и отреклись от того, что Ему придавали в товарищи!\" (85) Но не помогла им их вера, когда они увидели Нашу мощь, по установлению Аллаха, которое свершилось над Его рабами. И в убытке остались там неверующие!"}, {"ref": "39:53", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "۞ قُلْ يَٰعِبَادِىَ ٱلَّذِينَ أَسْرَفُوا۟ عَلَىٰٓ أَنفُسِهِمْ لَا تَقْنَطُوا۟ مِن رَّحْمَةِ ٱللَّهِ ۚ إِنَّ ٱللَّهَ يَغْفِرُ ٱلذُّنُوبَ جَمِيعًا ۚ إِنَّهُۥ هُوَ ٱلْغَفُورُ ٱلرَّحِيمُ ﴿53﴾", "ru": "Скажи: \"О рабы Мои, которые преступили против самих себя, не отчаивайтесь в милости Аллаха! Поистине, Аллах прощает грехи полностью: ведь Он - прощающий, милостивый!"}, {"ref": "25:70", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "إِلَّا مَن تَابَ وَءَامَنَ وَعَمِلَ عَمَلًۭا صَٰلِحًۭا فَأُو۟لَٰٓئِكَ يُبَدِّلُ ٱللَّهُ سَيِّـَٔاتِهِمْ حَسَنَٰتٍۢ ۗ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًۭا ﴿70﴾", "ru": "кроме тех, кто обратился и уверовал и творил дело доброе, - этим Аллах заменит их злые деяния благими; поистине, Аллах прощающ, милосерд!"}], "n": "Что сказано: Фараон при гибели говорит: «Верую, что нет божества, кроме того, в кого веруют сыны Исраила, и я — из числа предавшихся!» Ответ: «Да, теперь! А раньше ты ослушался и был распространителем нечестия… Сегодня Мы спасаем тебя с твоим телом, чтобы ты был знамением для тех, кто за тобой» (10:90-92). Тот же принцип в 4:18: нет обращения тем, кто совершает дурное, «а когда предстанет пред кем-нибудь из них смерть, он говорит: 'Я обращаюсь теперь'». В 40:85: «не помогла им их вера, когда они увидели Нашу мощь». А в 39:53: «Аллах прощает грехи полностью».\nВ чём проблема: (1) Принцип ⟦покаяние в момент смерти не принимается⟧ в Коране последователен (10:91, 4:18, 40:85). Он не противоречит 39:53, где речь о живых («не отчаивайтесь»). Поэтому как противоречие это слабое место. (2) Остаётся этический вопрос: если вера Фараона на пороге смерти искренна, а Бог знает сердца, то отказ принимать её — вопрос о милосердии; верующие ответят, что вера ⟦когда увидели мощь⟧ — вынужденная и потому не засчитывается. (3) Фраза «спасаем тебя с твоим телом» (10:92) обычно понимается как сохранение тела; независимых данных в пользу истории Исхода критики не находят, и эту часть следует формулировать осторожно (⟦критики указывают, что подтверждений в египетских источниках нет⟧).\nКак отвечают верующие: покаяние, вызванное страхом перед неминуемой гибелью, а не свободным выбором, не засчитывается; а в живых Бог прощает полностью (39:53).", "c": null, "x": ["2:34"], "t": "Покаяние Фараона отвергнуто в последний момент", "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Покаяние Фараона отвергнуто на пороге смерти. Согласуется с 4:18 и 40:85."}], "summary": ["Сильная пара: 2:217 против 4:89.", "Фараон (10:90-92) — слабый довод."]}, {"id": "critic", "title": "Критика, сомнение и вопросы", "icon": "🚫", "group": "Люди и общество", "intro": "Как Коран относится к вопросам, спорам и критике самого текста и Пророка. Для критиков эти аяты показывают запрет на сомнение и желание защитить текст угрозами.", "verses": [{"refs": ["5:101-102", "22:8-9", "40:35", "47:24"], "parts": [{"ref": "5:101-102", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَسْـَٔلُوا۟ عَنْ أَشْيَآءَ إِن تُبْدَ لَكُمْ تَسُؤْكُمْ وَإِن تَسْـَٔلُوا۟ عَنْهَا حِينَ يُنَزَّلُ ٱلْقُرْءَانُ تُبْدَ لَكُمْ عَفَا ٱللَّهُ عَنْهَا ۗ وَٱللَّهُ غَفُورٌ حَلِيمٌۭ ﴿101﴾ قَدْ سَأَلَهَا قَوْمٌۭ مِّن قَبْلِكُمْ ثُمَّ أَصْبَحُوا۟ بِهَا كَٰفِرِينَ ﴿102﴾", "ru": "(101) О вы, которые уверовали! Не спрашивайте о вещах, которые огорчат вас, если откроются вам. А если вы спросите о них, когда низводится Коран, они откроются вам. Аллах простил за них: ведь Аллах - прощающий, кроткий. (102) Спрашивали о них люди до вас; потом оказались неверующими в них."}, {"ref": "22:8-9", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "وَمِنَ ٱلنَّاسِ مَن يُجَٰدِلُ فِى ٱللَّهِ بِغَيْرِ عِلْمٍۢ وَلَا هُدًۭى وَلَا كِتَٰبٍۢ مُّنِيرٍۢ ﴿8﴾ ثَانِىَ عِطْفِهِۦ لِيُضِلَّ عَن سَبِيلِ ٱللَّهِ ۖ لَهُۥ فِى ٱلدُّنْيَا خِزْىٌۭ ۖ وَنُذِيقُهُۥ يَوْمَ ٱلْقِيَٰمَةِ عَذَابَ ٱلْحَرِيقِ ﴿9﴾", "ru": "(8) И среди людей есть такой, кто препирается об Аллахе без знания, и без руководства, и освещающей книги, (9) отворачивая свою шею, чтобы сбить с пути Аллаха. Для него в ближайшем мире - позор, а в день восстания Мы заставим его вкусить наказание огня."}, {"ref": "40:35", "sura": "Ghafir", "sura_ar": "سُورَةُ غَافِرٍ", "type": "Meccan", "ar": "ٱلَّذِينَ يُجَٰدِلُونَ فِىٓ ءَايَٰتِ ٱللَّهِ بِغَيْرِ سُلْطَٰنٍ أَتَىٰهُمْ ۖ كَبُرَ مَقْتًا عِندَ ٱللَّهِ وَعِندَ ٱلَّذِينَ ءَامَنُوا۟ ۚ كَذَٰلِكَ يَطْبَعُ ٱللَّهُ عَلَىٰ كُلِّ قَلْبِ مُتَكَبِّرٍۢ جَبَّارٍۢ ﴿35﴾", "ru": "Те, которые препираются о знамениях Аллах без власти, данной им, - велика к этому ненависть у Аллаха и у тех, которые уверовали! Так Аллах запечатал сердце каждого превозносящегося, тирана!"}, {"ref": "47:24", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "أَفَلَا يَتَدَبَّرُونَ ٱلْقُرْءَانَ أَمْ عَلَىٰ قُلُوبٍ أَقْفَالُهَآ ﴿24﴾", "ru": "Разве они не подумают о Коране? Или на сердцах бывают их затворы?"}], "n": "Что сказано: «Не спрашивайте о вещах, которые огорчат вас, если откроются вам»; о таких вещах спрашивали «до вас» люди, ⟦а потом они стали неверными по отношению к ним⟧ (5:101-102); кто «препирается об Аллахе без знания», тому позор в ближайшей жизни (22:8-9); ⟦препирающиеся о знамениях Аллаха без власти — велика к этому ненависть у Аллаха⟧ (40:35); «Разве они не подумают о Коране? Или на сердцах бывают их затворы?» (47:24).\nВ чём проблема: вопросы и споры о религии связаны с угрозой неверия и гнева Бога. Но Коран призывает размышлять (47:24, 4:82) и ⟦спросить знающих⟧ (16:43). Неясно, где граница между законным вопросом и запретным спором. Критики видят в этом защиту текста от проверки.", "c": null, "x": ["4:82", "16:43"], "t": "Вопросы и споры о знамениях", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Запрет вопросов и призыв размышлять (47:24) стоят рядом. Граница не определена."}, {"refs": ["4:140", "6:68", "9:12", "33:57-58"], "parts": [{"ref": "4:140", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَقَدْ نَزَّلَ عَلَيْكُمْ فِى ٱلْكِتَٰبِ أَنْ إِذَا سَمِعْتُمْ ءَايَٰتِ ٱللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُوا۟ مَعَهُمْ حَتَّىٰ يَخُوضُوا۟ فِى حَدِيثٍ غَيْرِهِۦٓ ۚ إِنَّكُمْ إِذًۭا مِّثْلُهُمْ ۗ إِنَّ ٱللَّهَ جَامِعُ ٱلْمُنَٰفِقِينَ وَٱلْكَٰفِرِينَ فِى جَهَنَّمَ جَمِيعًا ﴿140﴾", "ru": "Аллах уже низвел вам в писании, что когда вы слушаете знамения Аллаха, в которые не веруют и над которыми издеваются, то не сидите вместе с ними, пока они не погрузятся в другой рассказ: ведь тогда вы подобны им. Поистине, Аллах соберет лицемеров и неверных всех в геенне!"}, {"ref": "6:68", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَإِذَا رَأَيْتَ ٱلَّذِينَ يَخُوضُونَ فِىٓ ءَايَٰتِنَا فَأَعْرِضْ عَنْهُمْ حَتَّىٰ يَخُوضُوا۟ فِى حَدِيثٍ غَيْرِهِۦ ۚ وَإِمَّا يُنسِيَنَّكَ ٱلشَّيْطَٰنُ فَلَا تَقْعُدْ بَعْدَ ٱلذِّكْرَىٰ مَعَ ٱلْقَوْمِ ٱلظَّٰلِمِينَ ﴿68﴾", "ru": "А когда ты увидишь тех, которые погружаются в пучину пустословия о Наших знамениях, то отвернись от них, пока они не погрузятся в какой-нибудь другой рассказ. И если сатана заставит тебя забыть, то ты после напоминания не сиди с людьми неправедными."}, {"ref": "9:12", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "وَإِن نَّكَثُوٓا۟ أَيْمَٰنَهُم مِّنۢ بَعْدِ عَهْدِهِمْ وَطَعَنُوا۟ فِى دِينِكُمْ فَقَٰتِلُوٓا۟ أَئِمَّةَ ٱلْكُفْرِ ۙ إِنَّهُمْ لَآ أَيْمَٰنَ لَهُمْ لَعَلَّهُمْ يَنتَهُونَ ﴿12﴾", "ru": "А если они нарушили свои клятвы после договора и поносили вашу религию, то сражайтесь с имамами неверия, - ведь нет клятв для них, - может быть, они удержатся!"}, {"ref": "33:57-58", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ يُؤْذُونَ ٱللَّهَ وَرَسُولَهُۥ لَعَنَهُمُ ٱللَّهُ فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ وَأَعَدَّ لَهُمْ عَذَابًۭا مُّهِينًۭا ﴿57﴾ وَٱلَّذِينَ يُؤْذُونَ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ بِغَيْرِ مَا ٱكْتَسَبُوا۟ فَقَدِ ٱحْتَمَلُوا۟ بُهْتَٰنًۭا وَإِثْمًۭا مُّبِينًۭا ﴿58﴾", "ru": "(57) Поистине, те, которые причиняют обиду Аллаху и Его посланнику, - проклял их Аллах в жизни здешней и будущей и приготовил им наказание унизительное. (58) А те, которые причиняют обиду верующим (мужчинам) и верующим (женщинам) без того, чтобы они это заслужили, - они берут на себя ложь и явный грех."}], "n": "Что сказано: Когда над знамениями Аллаха глумятся, ⟦не сидите с ними, пока они не перейдут к другому разговору⟧ (4:140); ⟦отвернись от погружающихся в пустословие о Наших знамениях⟧ (6:68); тех, кто ⟦поносил вашу религию⟧ после договора, — «сражайтесь с имамами неверия» (9:12); ⟦причиняющих обиду Аллаху и Его посланнику проклял Аллах⟧ (33:57).\nВ чём проблема: отвернуться от критики — мягкая мера, но в 9:12 ⟦поношение религии⟧ входит в причины войны, а в 33:57 ⟦обида⟧ Пророка наказуема проклятием. Грань между критикой и поношением не определена.", "c": null, "x": ["9:61"], "t": "Критика религии как повод уйти, проклясть и воевать", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Критика религии как повод уйти, а в 9:12 как повод к войне."}], "summary": ["В тексте нет прямого запрета критики, но граница с «поношением» не определена."]}, {"id": "ethics", "title": "Месть, клятвы и ложь", "icon": "⚖", "group": "Люди и общество", "intro": "Нормы о мести, расторжении клятв и допустимости скрывать убеждения. Включает и аяты, которые часто цитируют как гуманные, вместе с оговорками, содержащимися в самом тексте.", "verses": [{"refs": ["2:194", "16:126", "42:40-41"], "parts": [{"ref": "2:194", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱلشَّهْرُ ٱلْحَرَامُ بِٱلشَّهْرِ ٱلْحَرَامِ وَٱلْحُرُمَٰتُ قِصَاصٌۭ ۚ فَمَنِ ٱعْتَدَىٰ عَلَيْكُمْ فَٱعْتَدُوا۟ عَلَيْهِ بِمِثْلِ مَا ٱعْتَدَىٰ عَلَيْكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ مَعَ ٱلْمُتَّقِينَ ﴿194﴾", "ru": "Запретный месяц - за запретный месяц. И запреты - Возмездие. Кто же преступает против вас, - то и вы преступайте против него подобно тому, как он преступил против вас. И бойтесь Аллаха и знайте, что Аллах - с богобоязненными!"}, {"ref": "16:126", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَإِنْ عَاقَبْتُمْ فَعَاقِبُوا۟ بِمِثْلِ مَا عُوقِبْتُم بِهِۦ ۖ وَلَئِن صَبَرْتُمْ لَهُوَ خَيْرٌۭ لِّلصَّٰبِرِينَ ﴿126﴾", "ru": "И если вы наказываете, то наказывайте подобным тому, чем вы были наказаны. А если терпите, то это - лучше для терпеливых."}, {"ref": "42:40-41", "sura": "Ash-Shura", "sura_ar": "سُورَةُ الشُّورَىٰ", "type": "Meccan", "ar": "وَجَزَٰٓؤُا۟ سَيِّئَةٍۢ سَيِّئَةٌۭ مِّثْلُهَا ۖ فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُۥ عَلَى ٱللَّهِ ۚ إِنَّهُۥ لَا يُحِبُّ ٱلظَّٰلِمِينَ ﴿40﴾ وَلَمَنِ ٱنتَصَرَ بَعْدَ ظُلْمِهِۦ فَأُو۟لَٰٓئِكَ مَا عَلَيْهِم مِّن سَبِيلٍ ﴿41﴾", "ru": "(40) И воздаянием зла - зло, подобное ему. Но кто простит и уладит, - награда его у Аллаха. Он ведь не любит несправедливых! (41) А кто ищет помощи после обиды, то к ним нет пути."}], "n": "Что сказано: ⟦Кто преступает против вас, то и вы преступайте против него подобно тому, как он преступил⟧ (2:194); «если вы наказываете, то наказывайте подобным тому, чем вы были наказаны; а если терпите, то это лучше» (16:126); ⟦воздаяние зла — зло, подобное ему. Но кто простит и уладит, награда его у Аллаха⟧ (42:40).\nВ чём проблема: Коран признаёт право на равную месть и называет прощение лучшим. Но в 41:34 (⟦отклоняй тем, что лучше⟧) звучит другой принцип — отвечать добром. Для читателя вопрос: что обязательно — равная месть или добрый ответ. Единого правила Коран не даёт.", "c": null, "x": ["41:34", "23:96"], "t": "Месть дозволена", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Равная месть и призыв отвечать добром (41:34) без выбора между ними."}, {"n": "Что сказано: «По этой причине предписали Мы сынам Исраила: кто убил душу не за душу или не за порчу на земле, тот как будто бы убил людей всех, а кто оживил её, тот как будто бы оживил людей всех».\nВ чём проблема: это один из самых цитируемых ⟦гуманных⟧ аятов. Но (1) он содержит оговорку «не за порчу на земле», то есть убийство за «порчу» допустимо (см. 5:33); (2) предписание адресовано «сынам Исраила», а не мусульманам напрямую.", "c": null, "x": ["5:33"], "refs": ["5:32"], "parts": [{"ref": "5:32", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "مِنْ أَجْلِ ذَٰلِكَ كَتَبْنَا عَلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنَّهُۥ مَن قَتَلَ نَفْسًۢا بِغَيْرِ نَفْسٍ أَوْ فَسَادٍۢ فِى ٱلْأَرْضِ فَكَأَنَّمَا قَتَلَ ٱلنَّاسَ جَمِيعًۭا وَمَنْ أَحْيَاهَا فَكَأَنَّمَآ أَحْيَا ٱلنَّاسَ جَمِيعًۭا ۚ وَلَقَدْ جَآءَتْهُمْ رُسُلُنَا بِٱلْبَيِّنَٰتِ ثُمَّ إِنَّ كَثِيرًۭا مِّنْهُم بَعْدَ ذَٰلِكَ فِى ٱلْأَرْضِ لَمُسْرِفُونَ ﴿32﴾", "ru": "По этой причине предписали Мы сынам Исраила: кто убил душу не за душу или не за порчу на земле, тот как будто бы убил людей всех, А кто оживил ее, тот как будто бы оживил людей всех. Приходили к ним Наши посланники с ясными знамениями. Потом многие из них после этого по земле излишествовали."}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Гуманный аят с оговоркой «за порчу» (5:33). Честное возражение, но слабое."}, {"n": "Что сказано: ⟦Пусть верующие не берут близкими неверных помимо верующих… кроме как если вы остерегаетесь от них осторожностью⟧.\nВ чём проблема: допущено скрывать убеждения (⟦такийя⟧) под угрозой, то есть притворяться. Но в 9:66 слова в шутку названы неверием, а в 16:106 принуждённый на слова допускается. Границы ⟦осторожности⟧ не определены.", "c": null, "x": ["16:106", "9:66"], "refs": ["3:28"], "parts": [{"ref": "3:28", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "لَّا يَتَّخِذِ ٱلْمُؤْمِنُونَ ٱلْكَٰفِرِينَ أَوْلِيَآءَ مِن دُونِ ٱلْمُؤْمِنِينَ ۖ وَمَن يَفْعَلْ ذَٰلِكَ فَلَيْسَ مِنَ ٱللَّهِ فِى شَىْءٍ إِلَّآ أَن تَتَّقُوا۟ مِنْهُمْ تُقَىٰةًۭ ۗ وَيُحَذِّرُكُمُ ٱللَّهُ نَفْسَهُۥ ۗ وَإِلَى ٱللَّهِ ٱلْمَصِيرُ ﴿28﴾", "ru": "Пусть верующие не берут себе близкими неверных помимо верующих. А кто сделает это, у того с Аллахом нет ничего общего, если вы только не будете опасаться их страхом. Аллах предостерегает вас от самого Себя, и к Аллаху - возвращение\"."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Допущено скрывать убеждения, а 9:66 называет неверием слова в шутку."}, {"refs": ["66:2", "5:89"], "parts": [{"ref": "66:2", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ ﴿2﴾", "ru": "Аллах установил для вас разрешение ваших клятв. Аллах - наш покровитель; Он - знающий, мудрый."}, {"ref": "5:89", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "لَا يُؤَاخِذُكُمُ ٱللَّهُ بِٱللَّغْوِ فِىٓ أَيْمَٰنِكُمْ وَلَٰكِن يُؤَاخِذُكُم بِمَا عَقَّدتُّمُ ٱلْأَيْمَٰنَ ۖ فَكَفَّٰرَتُهُۥٓ إِطْعَامُ عَشَرَةِ مَسَٰكِينَ مِنْ أَوْسَطِ مَا تُطْعِمُونَ أَهْلِيكُمْ أَوْ كِسْوَتُهُمْ أَوْ تَحْرِيرُ رَقَبَةٍۢ ۖ فَمَن لَّمْ يَجِدْ فَصِيَامُ ثَلَٰثَةِ أَيَّامٍۢ ۚ ذَٰلِكَ كَفَّٰرَةُ أَيْمَٰنِكُمْ إِذَا حَلَفْتُمْ ۚ وَٱحْفَظُوٓا۟ أَيْمَٰنَكُمْ ۚ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمْ ءَايَٰتِهِۦ لَعَلَّكُمْ تَشْكُرُونَ ﴿89﴾", "ru": "Аллах не взыскивает с вас за легкомыслие в ваших клятвах, но Он взыскивает с вас за то, что вы связываете клятвы. Искуплением этого - накормить десять бедняков средним из того, чем вы кормите свои семьи, или одеть их, или освободить раба. А кто не найдет, то - пост трех дней. Это - искупление ваших клятв, которыми вы поклялись. Охраняйте же ваши клятвы! Так разъясняет Аллах вам Свои знамения, - может быть, вы будете благодарны!"}], "n": "Что сказано: «Аллах установил для вас разрешение ваших клятв» (66:2); нарушение клятвы искупается: накормить десять бедняков, одеть их, освободить раба или три дня поститься (5:89).\nВ чём проблема: в 16:91 сказано: ⟦не нарушайте клятв после их закрепления⟧, а в 16:94 осуждено использование клятв для обмана; здесь же клятву можно расторгнуть, заплатив искупление. 66:2 следует за 66:1, где Пророк запретил себе дозволенное ⟦чтобы угодить жёнам⟧: Бог разрешает ему нарушить клятву.", "c": null, "x": ["16:91", "66:1"], "t": "Клятвы можно расторгнуть", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Клятвы можно расторгнуть, а 16:91 запрещает их нарушать. Условие искупления есть."}], "summary": ["Равная месть и добрый ответ — две нормы без выбора между ними.", "5:32 — честное возражение, но с оговоркой."]}, {"id": "muhammad", "title": "Особые права и упрёки Пророку", "icon": "☪", "group": "Пророк, Коран и текст", "intro": "Аяты, в которых Бог напрямую решает личные вопросы Мухаммада и закрепляет за ним привилегии, недоступные остальным мусульманам.", "verses": [{"n": "Что сказано: Мухаммад говорил Зайду, у которого была жена Зайнаб: «Удержи при себе свою жену», ⟦и скрывал в себе то, что Аллах обнаружит, и боялся людей⟧; затем: ⟦Когда Зайд покончил с ней, Мы женили тебя на ней, чтобы не было на верующих греха в отношении жён их приёмных сыновей⟧.\nВ чём проблема: Бог в тексте Корана прямо оформляет брак Пророка с женой его приёмного сына, ранее считавшегося запретным. Критики видят удобное совпадение личного желания и откровения; сам аят говорит, что Пророк ⟦скрывал в себе⟧ и «боялся людей». Цепочка 33:4-5, 33:40 подготовила этот шаг.\nКак отвечают верующие: аят отменяет обычай, по которому приёмный сын приравнивался к родному.", "c": "Традиционно — отмена обычая усыновления; критики видят в аяте удобное ⟦откровение⟧ по личному вопросу.", "x": ["33:4", "33:5", "33:40"], "refs": ["33:37"], "parts": [{"ref": "33:37", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "وَإِذْ تَقُولُ لِلَّذِىٓ أَنْعَمَ ٱللَّهُ عَلَيْهِ وَأَنْعَمْتَ عَلَيْهِ أَمْسِكْ عَلَيْكَ زَوْجَكَ وَٱتَّقِ ٱللَّهَ وَتُخْفِى فِى نَفْسِكَ مَا ٱللَّهُ مُبْدِيهِ وَتَخْشَى ٱلنَّاسَ وَٱللَّهُ أَحَقُّ أَن تَخْشَىٰهُ ۖ فَلَمَّا قَضَىٰ زَيْدٌۭ مِّنْهَا وَطَرًۭا زَوَّجْنَٰكَهَا لِكَىْ لَا يَكُونَ عَلَى ٱلْمُؤْمِنِينَ حَرَجٌۭ فِىٓ أَزْوَٰجِ أَدْعِيَآئِهِمْ إِذَا قَضَوْا۟ مِنْهُنَّ وَطَرًۭا ۚ وَكَانَ أَمْرُ ٱللَّهِ مَفْعُولًۭا ﴿37﴾", "ru": "И вот ты говорил тому, кого облагодетельствовал Аллах и кого ты облагодетельствовал: \"Удержи при себе свою жену и побойся Аллаха!\" И ты скрывал в своей душе то, что обнаруживал Аллах и боялся людей, а между тем Аллаха следует больше бояться. Когда же Зайд удовлетворил свое желание по отношению к ней, Мы женили тебя на ней, чтобы для верующих не было стеснения с женами их приемышей, когда они удовлетворят свои желания. Дело Аллаха свершается!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Откровение оформляет брак Пророка с женой его приёмного сына. Вывод о выгоде Пророка — допущение, но в тексте он «боялся людей»."}, {"refs": ["33:50", "33:52", "33:53"], "parts": [{"ref": "33:50", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ إِنَّآ أَحْلَلْنَا لَكَ أَزْوَٰجَكَ ٱلَّٰتِىٓ ءَاتَيْتَ أُجُورَهُنَّ وَمَا مَلَكَتْ يَمِينُكَ مِمَّآ أَفَآءَ ٱللَّهُ عَلَيْكَ وَبَنَاتِ عَمِّكَ وَبَنَاتِ عَمَّٰتِكَ وَبَنَاتِ خَالِكَ وَبَنَاتِ خَٰلَٰتِكَ ٱلَّٰتِى هَاجَرْنَ مَعَكَ وَٱمْرَأَةًۭ مُّؤْمِنَةً إِن وَهَبَتْ نَفْسَهَا لِلنَّبِىِّ إِنْ أَرَادَ ٱلنَّبِىُّ أَن يَسْتَنكِحَهَا خَالِصَةًۭ لَّكَ مِن دُونِ ٱلْمُؤْمِنِينَ ۗ قَدْ عَلِمْنَا مَا فَرَضْنَا عَلَيْهِمْ فِىٓ أَزْوَٰجِهِمْ وَمَا مَلَكَتْ أَيْمَٰنُهُمْ لِكَيْلَا يَكُونَ عَلَيْكَ حَرَجٌۭ ۗ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًۭا ﴿50﴾", "ru": "О пророк, Мы разрешили тебе твоими женами тех, которым ты дал их награду, и тех, которыми овладела твоя десница из того, что даровал Аллах тебе в добычу, и дочерей твоего дяди со стороны отца, и дочерей твоих теток со стороны отца, и дочерей твоего дяди со стороны матери, и дочерей твоих теток со стороны матери, которые выселились вместе с тобой, и верующую женщину, если она отдала самое себя пророку, если пророк пожелает жениться на ней, - исключительно для тебя, помимо верующих. Мы знаем, что Мы установили для них относительно их жен и того, чем овладели десницы их, для того. чтобы не было на тебе стеснения. Аллах - прощающ. милосерд!"}, {"ref": "33:52", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "لَّا يَحِلُّ لَكَ ٱلنِّسَآءُ مِنۢ بَعْدُ وَلَآ أَن تَبَدَّلَ بِهِنَّ مِنْ أَزْوَٰجٍۢ وَلَوْ أَعْجَبَكَ حُسْنُهُنَّ إِلَّا مَا مَلَكَتْ يَمِينُكَ ۗ وَكَانَ ٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ رَّقِيبًۭا ﴿52﴾", "ru": "После этого тебе не дозволяется больше женщины и заменять их другими женами, хотя бы тебя поражала их красота, если не теми, которыми овладела десница твоя. Аллах надзирает за всякой вещью!"}, {"ref": "33:53", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَدْخُلُوا۟ بُيُوتَ ٱلنَّبِىِّ إِلَّآ أَن يُؤْذَنَ لَكُمْ إِلَىٰ طَعَامٍ غَيْرَ نَٰظِرِينَ إِنَىٰهُ وَلَٰكِنْ إِذَا دُعِيتُمْ فَٱدْخُلُوا۟ فَإِذَا طَعِمْتُمْ فَٱنتَشِرُوا۟ وَلَا مُسْتَـْٔنِسِينَ لِحَدِيثٍ ۚ إِنَّ ذَٰلِكُمْ كَانَ يُؤْذِى ٱلنَّبِىَّ فَيَسْتَحْىِۦ مِنكُمْ ۖ وَٱللَّهُ لَا يَسْتَحْىِۦ مِنَ ٱلْحَقِّ ۚ وَإِذَا سَأَلْتُمُوهُنَّ مَتَٰعًۭا فَسْـَٔلُوهُنَّ مِن وَرَآءِ حِجَابٍۢ ۚ ذَٰلِكُمْ أَطْهَرُ لِقُلُوبِكُمْ وَقُلُوبِهِنَّ ۚ وَمَا كَانَ لَكُمْ أَن تُؤْذُوا۟ رَسُولَ ٱللَّهِ وَلَآ أَن تَنكِحُوٓا۟ أَزْوَٰجَهُۥ مِنۢ بَعْدِهِۦٓ أَبَدًا ۚ إِنَّ ذَٰلِكُمْ كَانَ عِندَ ٱللَّهِ عَظِيمًا ﴿53﴾", "ru": "О те, которые уверовали! Не входите в дома пророка, если только не будет разрешена вам еда, не дожидаясь ее времени. Но когда вас позовут, то входите, а когда покушаете, то расходитесь, не вступая дружески в беседу. Это с вашей стороны удручает пророка, но он стыдится вас, а Аллах не стыдится истины. А когда просите их о какой-нибудь утвари, то просите их через завесу. Это вам чище для ваших сердец и их сердец. Не следует вам удручать посланника Аллаха и никогда не жениться на его женах после него. Это с вашей стороны велико у Аллаха."}], "n": "Что сказано: Пророку разрешены жёны с брачным даром, пленницы из добычи, двоюродные сёстры и ⟦верующая женщина, если она отдала самоё себя пророку — исключительно для тебя, помимо верующих⟧ (33:50); «после этого тебе не дозволяется больше женщины» (33:52); в его дом нельзя входить без приглашения, говорить с жёнами надо ⟦из-за завесы⟧, а ⟦жениться на его вдовах — никогда⟧ (33:53).\nВ чём проблема: (1) У остальных верующих — не более четырёх жён (4:3), а у Пророка — привилегия без лимита. (2) Через пару аятов она ограничена (33:52): Бог меняет собственное разрешение (насх). (3) Правила личного быта одного человека оформлены как откровение, а запрет вдовам выходить замуж («никогда») лишает женщин права на новую жизнь.", "c": null, "x": ["4:3", "2:106"], "t": "Браки Пророка: особые правила", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Привилегия без лимита, позднее ограничена."}, {"refs": ["33:28", "66:1", "66:3-5"], "parts": [{"ref": "33:28", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ قُل لِّأَزْوَٰجِكَ إِن كُنتُنَّ تُرِدْنَ ٱلْحَيَوٰةَ ٱلدُّنْيَا وَزِينَتَهَا فَتَعَالَيْنَ أُمَتِّعْكُنَّ وَأُسَرِّحْكُنَّ سَرَاحًۭا جَمِيلًۭا ﴿28﴾", "ru": "О пророк, скажи твоим женам: \"Если вы желаете ближней жизни и ее прикрас, то приходите: я дам вам насладиться и отпущу вас прекрасным способом."}, {"ref": "66:1", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ ﴿1﴾", "ru": "О, пророк, почему ты запрещаешь то, что разрешил тебе Аллах, домогаясь расположения своих жен? А Аллах - прощающий, милостивый!"}, {"ref": "66:3-5", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "وَإِذْ أَسَرَّ ٱلنَّبِىُّ إِلَىٰ بَعْضِ أَزْوَٰجِهِۦ حَدِيثًۭا فَلَمَّا نَبَّأَتْ بِهِۦ وَأَظْهَرَهُ ٱللَّهُ عَلَيْهِ عَرَّفَ بَعْضَهُۥ وَأَعْرَضَ عَنۢ بَعْضٍۢ ۖ فَلَمَّا نَبَّأَهَا بِهِۦ قَالَتْ مَنْ أَنۢبَأَكَ هَٰذَا ۖ قَالَ نَبَّأَنِىَ ٱلْعَلِيمُ ٱلْخَبِيرُ ﴿3﴾ إِن تَتُوبَآ إِلَى ٱللَّهِ فَقَدْ صَغَتْ قُلُوبُكُمَا ۖ وَإِن تَظَٰهَرَا عَلَيْهِ فَإِنَّ ٱللَّهَ هُوَ مَوْلَىٰهُ وَجِبْرِيلُ وَصَٰلِحُ ٱلْمُؤْمِنِينَ ۖ وَٱلْمَلَٰٓئِكَةُ بَعْدَ ذَٰلِكَ ظَهِيرٌ ﴿4﴾ عَسَىٰ رَبُّهُۥٓ إِن طَلَّقَكُنَّ أَن يُبْدِلَهُۥٓ أَزْوَٰجًا خَيْرًۭا مِّنكُنَّ مُسْلِمَٰتٍۢ مُّؤْمِنَٰتٍۢ قَٰنِتَٰتٍۢ تَٰٓئِبَٰتٍ عَٰبِدَٰتٍۢ سَٰٓئِحَٰتٍۢ ثَيِّبَٰتٍۢ وَأَبْكَارًۭا ﴿5﴾", "ru": "(3) И вот Пророк сообщил втайне какой-то из своих жен новость. А когда она передала это и Аллах ему открыл, то часть он сообщил, а от части уклонился. А когда он сообщил ей про это, она сказала: \"Кто сообщил тебе это?\" Он сказал: \"Сообщил мне знающий, ведающий\". (4) Если вы обе обратитесь к Аллаху... , ведь склонились ваши сердца. А если открыто будете противиться ему... , то ведь Аллах - его защитник, и Джибрил, и праведный из верующих, и ангелы после этого - помощники. (5) Может быть, его Господь, если он даст вам развод, заменит ему женами лучшими, чем вы - предавшимися, верующими, благочестивыми, обращающимися, поклоняющимися, паломничающими, вдовами и девицами."}], "n": "Что сказано: Пророку велено предложить жёнам выбор — ⟦ближняя жизнь и её прикрасы⟧ или Аллах с посланником (33:28); ⟦О Пророк! Почему ты запрещаешь то, что Аллах дозволил тебе, стремясь угодить своим жёнам?⟧ (66:1); Пророк по секрету сказал жене новость, она разболтала, Бог открыл ему это, и далее: ⟦если он разведётся с вами, Господь заменит вас лучшими жёнами⟧ (66:3-5).\nВ чём проблема: Бог (в тексте Корана) вмешивается в частную ссору жён Пророка, угрожает им разводом и ⟦заменой⟧. Вопрос: зачем Священная книга включает бытовой семейный конфликт и не отражает ли это интересы самого Пророка.", "c": null, "x": ["33:37"], "t": "Семейные споры Пророка решаются откровением", "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Бытовой семейный конфликт в откровении."}, {"refs": ["8:1", "8:41", "59:6-7"], "parts": [{"ref": "8:1", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَسْـَٔلُونَكَ عَنِ ٱلْأَنفَالِ ۖ قُلِ ٱلْأَنفَالُ لِلَّهِ وَٱلرَّسُولِ ۖ فَٱتَّقُوا۟ ٱللَّهَ وَأَصْلِحُوا۟ ذَاتَ بَيْنِكُمْ ۖ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥٓ إِن كُنتُم مُّؤْمِنِينَ ﴿1﴾", "ru": "Они спрашивают тебя о добыче. Скажи: \"Добыча принадлежит Аллаху и посланнику; бойтесь же Аллаха, упорядочите между собой и повинуйтесь Аллаху и Его посланнику, если вы веруете!\""}, {"ref": "8:41", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "۞ وَٱعْلَمُوٓا۟ أَنَّمَا غَنِمْتُم مِّن شَىْءٍۢ فَأَنَّ لِلَّهِ خُمُسَهُۥ وَلِلرَّسُولِ وَلِذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ إِن كُنتُمْ ءَامَنتُم بِٱللَّهِ وَمَآ أَنزَلْنَا عَلَىٰ عَبْدِنَا يَوْمَ ٱلْفُرْقَانِ يَوْمَ ٱلْتَقَى ٱلْجَمْعَانِ ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ ﴿41﴾", "ru": "И знайте, что если вы взяли что-либо в добычу, то Аллаху - пятая часть, и посланнику, и родственникам, и сиротам, и бедным, и путнику, если вы уверовали в Аллаха и в то, что Мы низвели Нашему рабу в день различения, в день, когда встретились два сборища. Поистине, Аллах мощен над всякой вещью!"}, {"ref": "59:6-7", "sura": "Al-Hashr", "sura_ar": "سُورَةُ الحَشۡرِ", "type": "Medinan", "ar": "وَمَآ أَفَآءَ ٱللَّهُ عَلَىٰ رَسُولِهِۦ مِنْهُمْ فَمَآ أَوْجَفْتُمْ عَلَيْهِ مِنْ خَيْلٍۢ وَلَا رِكَابٍۢ وَلَٰكِنَّ ٱللَّهَ يُسَلِّطُ رُسُلَهُۥ عَلَىٰ مَن يَشَآءُ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿6﴾ مَّآ أَفَآءَ ٱللَّهُ عَلَىٰ رَسُولِهِۦ مِنْ أَهْلِ ٱلْقُرَىٰ فَلِلَّهِ وَلِلرَّسُولِ وَلِذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ كَىْ لَا يَكُونَ دُولَةًۢ بَيْنَ ٱلْأَغْنِيَآءِ مِنكُمْ ۚ وَمَآ ءَاتَىٰكُمُ ٱلرَّسُولُ فَخُذُوهُ وَمَا نَهَىٰكُمْ عَنْهُ فَٱنتَهُوا۟ ۚ وَٱتَّقُوا۟ ٱللَّهَ ۖ إِنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ ﴿7﴾", "ru": "(6) И что дал Аллах в добычу о них Своему посланнику, для этого не приходилось вам гнать ни коней, ни верблюдов, но Аллах дает власть Своим посланникам, над кем хочет. Аллах мощен над каждой вещью! (7) Что дал Аллах в добычу посланнику Своему от обитателей селений, - то принадлежит Аллаху, и посланнику, и близким, и сиротам, и бедным, и путнику, чтобы не оказалось это распределением между богатыми у вас. И что даровал вам посланник, то берите, а что он вам запретил, от того удержитесь. И бойтесь Аллаха, ведь Аллах силен наказанием!"}], "n": "Что сказано: «Добыча принадлежит Аллаху и посланнику» (8:1); ⟦пятая часть — Аллаху, посланнику, родственникам, сиротам, бедным и путнику⟧ (8:41); имущество, взятое без боя, — ⟦Аллаху, посланнику, близким, сиротам, бедным⟧ (59:7).\nВ чём проблема: Пророк и его родственники указаны получателями доли. Кроме того, 8:1 говорит, что вся добыча принадлежит Аллаху и посланнику, а 8:41 — что лишь пятая часть: нужно согласовывать.", "c": null, "x": ["8:69"], "t": "Доля Пророка в добыче", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Вся добыча Аллаху и посланнику» (8:1) и «пятая часть» (8:41) расходятся; верующие говорят, что 8:1 общее, а 8:41 уточняет."}, {"refs": ["48:2", "47:19", "93:7"], "parts": [{"ref": "48:2", "sura": "Al-Fath", "sura_ar": "سُورَةُ الفَتۡحِ", "type": "Medinan", "ar": "لِّيَغْفِرَ لَكَ ٱللَّهُ مَا تَقَدَّمَ مِن ذَنۢبِكَ وَمَا تَأَخَّرَ وَيُتِمَّ نِعْمَتَهُۥ عَلَيْكَ وَيَهْدِيَكَ صِرَٰطًۭا مُّسْتَقِيمًۭا ﴿2﴾", "ru": "чтобы Аллах простил тебе то, что предшествовало из твоих грехов и что было позже, и чтобы завершил Свою милость тебе и повел тебя прямым путем,"}, {"ref": "47:19", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "فَٱعْلَمْ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا ٱللَّهُ وَٱسْتَغْفِرْ لِذَنۢبِكَ وَلِلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ ۗ وَٱللَّهُ يَعْلَمُ مُتَقَلَّبَكُمْ وَمَثْوَىٰكُمْ ﴿19﴾", "ru": "Знай же, что нет божества, кроме Аллаха, и проси прощения твоему греху и для верующих - мужчин и женщин. И Аллах знает и место вашего действия и ваше пристанище!"}, {"ref": "93:7", "sura": "Ad-Dhuhaa", "sura_ar": "سُورَةُ الضُّحَىٰ", "type": "Meccan", "ar": "وَوَجَدَكَ ضَآلًّۭا فَهَدَىٰ ﴿7﴾", "ru": "И нашел тебя заблудшим - и направил на путь?"}], "n": "Что сказано: «Чтобы Аллах простил тебе то, что предшествовало из твоих грехов и что было позже» (48:2); «Проси прощения твоему греху» (47:19); ⟦Он нашёл тебя заблудшим — и направил на путь⟧ (93:7).\nВ чём проблема: прямо названы ⟦грехи⟧ Пророка, причём и будущие (авансом), а до откровения он — ⟦заблудший⟧. Это спорит с учением о безгрешности пророков, на котором строится его авторитет (см. 33:36).\nКак отвечают верующие: ⟦заблудший⟧ — ⟦не знавший пути⟧ (42:52); «грех» — малая оплошность.", "c": null, "x": ["42:52", "33:36"], "t": "«Грехи» и «заблуждение» Пророка", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Грехи» Пророка и «заблудший» расходятся с учением о безгрешности пророков (вне Корана)."}, {"refs": ["80:1-10", "9:43", "17:73-75"], "parts": [{"ref": "80:1-10", "sura": "Abasa", "sura_ar": "سُورَةُ عَبَسَ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ عَبَسَ وَتَوَلَّىٰٓ ﴿1﴾ أَن جَآءَهُ ٱلْأَعْمَىٰ ﴿2﴾ وَمَا يُدْرِيكَ لَعَلَّهُۥ يَزَّكَّىٰٓ ﴿3﴾ أَوْ يَذَّكَّرُ فَتَنفَعَهُ ٱلذِّكْرَىٰٓ ﴿4﴾ أَمَّا مَنِ ٱسْتَغْنَىٰ ﴿5﴾ فَأَنتَ لَهُۥ تَصَدَّىٰ ﴿6﴾ وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ ﴿7﴾ وَأَمَّا مَن جَآءَكَ يَسْعَىٰ ﴿8﴾ وَهُوَ يَخْشَىٰ ﴿9﴾ فَأَنتَ عَنْهُ تَلَهَّىٰ ﴿10﴾", "ru": "(1) Он нахмурился и отвернулся (2) от того, что подошел к нему слепой (3) А что дало тебе знать, - может быть, он очистится, (4) или станет поминать увещевание, и поможет ему воспоминание. (5) А вот тот, кто богат, (6) к нему ты поворачиваешься. (7) хотя и не на тебе лежит, что он не очищается. (8) А тот, кто приходит к тебе со тщанием (9) и испытывает страх, - (10) ты от него отвлекаешься."}, {"ref": "9:43", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "عَفَا ٱللَّهُ عَنكَ لِمَ أَذِنتَ لَهُمْ حَتَّىٰ يَتَبَيَّنَ لَكَ ٱلَّذِينَ صَدَقُوا۟ وَتَعْلَمَ ٱلْكَٰذِبِينَ ﴿43﴾", "ru": "Пусть простит тебе Аллах! Почему ты дозволил им прежде, чем выяснились пред тобой те, которые говорили правду, и ты узнал лжецов?"}, {"ref": "17:73-75", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "وَإِن كَادُوا۟ لَيَفْتِنُونَكَ عَنِ ٱلَّذِىٓ أَوْحَيْنَآ إِلَيْكَ لِتَفْتَرِىَ عَلَيْنَا غَيْرَهُۥ ۖ وَإِذًۭا لَّٱتَّخَذُوكَ خَلِيلًۭا ﴿73﴾ وَلَوْلَآ أَن ثَبَّتْنَٰكَ لَقَدْ كِدتَّ تَرْكَنُ إِلَيْهِمْ شَيْـًۭٔا قَلِيلًا ﴿74﴾ إِذًۭا لَّأَذَقْنَٰكَ ضِعْفَ ٱلْحَيَوٰةِ وَضِعْفَ ٱلْمَمَاتِ ثُمَّ لَا تَجِدُ لَكَ عَلَيْنَا نَصِيرًۭا ﴿75﴾", "ru": "(73) И близки они были к тому, чтобы соблазнить тебя от того, что Мы внушили тебе, чтобы ты измыслил на Нас другое. А тогда они взяли бы тебя своим другом. (74) И если бы Мы тебя не подкрепили, - ты был близок склониться к ним хотя бы немного. (75) Тогда Мы дали бы тебе вкусить вдвойне и в жизни и в смерти. Потом ты не найдешь против Нас помощника!"}], "n": "Что сказано: Пророк «нахмурился и отвернулся», когда к нему подошёл слепой человек, занимаясь знатными (80:1-10); «Пусть простит тебе Аллах! Почему ты дозволил им прежде, чем выяснились пред тобой те, которые говорили правду?» (9:43); «Если бы Мы тебя не подкрепили, ты был близок склониться к ним хотя бы немного; тогда Мы дали бы тебе вкусить вдвойне и в жизни и в смерти» (17:74-75).\nВ чём проблема: Бог признаёт, что Пророк допустил ошибку, и был близок к уступке врагам. Это спорит с идеей безошибочного пророка, но одновременно показывает честность текста. Критики спрашивают: откуда авторы могли это знать.", "c": null, "x": ["8:67-68"], "t": "Бог упрекает Пророка", "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Упрёк Пророку. Текст признаёт ошибку Пророка."}, {"n": "Что сказано: ⟦Не посылали Мы до тебя никакого посланника или пророка без того, чтобы, когда он предавался мечтам, сатана не бросил в его мечты чего-либо; но Аллах уничтожает то, что бросает сатана, потом утверждает Свои знамения⟧.\nВ чём проблема: Коран сам признаёт, что сатана может вмешиваться в мысли и слова пророков, а Бог потом ⟦уничтожает⟧ вставленное. Критики спрашивают: как отличить слова Бога от вмешательства сатаны, если ⟦уничтожено⟧ не названо. Это ставит под вопрос надёжность откровения.", "c": "Традиция позже связала аят с ⟦сатанинскими аятами⟧; здесь приводится только сам текст.", "x": ["4:82"], "refs": ["22:52"], "parts": [{"ref": "22:52", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "وَمَآ أَرْسَلْنَا مِن قَبْلِكَ مِن رَّسُولٍۢ وَلَا نَبِىٍّ إِلَّآ إِذَا تَمَنَّىٰٓ أَلْقَى ٱلشَّيْطَٰنُ فِىٓ أُمْنِيَّتِهِۦ فَيَنسَخُ ٱللَّهُ مَا يُلْقِى ٱلشَّيْطَٰنُ ثُمَّ يُحْكِمُ ٱللَّهُ ءَايَٰتِهِۦ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌۭ ﴿52﴾", "ru": "И не посылали Мы до тебя никакого посланника или пророка без того, чтобы, когда он предавался мечтам, сатана не бросил в его мечты чего-либо, но Аллах стирает то, что бросает сатана, потом Аллах утверждает Свои знамения, - ведь Аллах - знающий, мудрый!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Сатана вмешивается в слова пророков. Критерия различия в тексте нет."}, {"refs": ["4:80", "33:36", "4:65", "33:56", "24:63", "49:2", "58:12"], "parts": [{"ref": "4:80", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "مَّن يُطِعِ ٱلرَّسُولَ فَقَدْ أَطَاعَ ٱللَّهَ ۖ وَمَن تَوَلَّىٰ فَمَآ أَرْسَلْنَٰكَ عَلَيْهِمْ حَفِيظًۭا ﴿80﴾", "ru": "Кто повинуется посланнику, тот повинуется Аллаху. А кто отворачивается... то Мы не посылали тебя хранителем над ними."}, {"ref": "33:36", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "وَمَا كَانَ لِمُؤْمِنٍۢ وَلَا مُؤْمِنَةٍ إِذَا قَضَى ٱللَّهُ وَرَسُولُهُۥٓ أَمْرًا أَن يَكُونَ لَهُمُ ٱلْخِيَرَةُ مِنْ أَمْرِهِمْ ۗ وَمَن يَعْصِ ٱللَّهَ وَرَسُولَهُۥ فَقَدْ ضَلَّ ضَلَٰلًۭا مُّبِينًۭا ﴿36﴾", "ru": "Не бывает ни для верующего, ни для верующей, когда решил Аллах и Его посланник дело, выбора в их деле. А кто не слушается Аллаха и Его посланника, тот попал в явное заблуждение."}, {"ref": "4:65", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّىٰ يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لَا يَجِدُوا۟ فِىٓ أَنفُسِهِمْ حَرَجًۭا مِّمَّا قَضَيْتَ وَيُسَلِّمُوا۟ تَسْلِيمًۭا ﴿65﴾", "ru": "Но нет - клянусь твоим Господом! - не уверуют они, пока не сделают тебя судьей в том, что запутано между ними. Потом не найдут они в самих себе затруднения о том, что ты решил, и подчинятся полностью."}, {"ref": "33:56", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "إِنَّ ٱللَّهَ وَمَلَٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِىِّ ۚ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ صَلُّوا۟ عَلَيْهِ وَسَلِّمُوا۟ تَسْلِيمًا ﴿56﴾", "ru": "Поистине, Аллах и его ангелы благословляют пророка! О вы, которые уверовали! Совершайте молитвы над ними и приветствуйте приветствием."}, {"ref": "24:63", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "لَّا تَجْعَلُوا۟ دُعَآءَ ٱلرَّسُولِ بَيْنَكُمْ كَدُعَآءِ بَعْضِكُم بَعْضًۭا ۚ قَدْ يَعْلَمُ ٱللَّهُ ٱلَّذِينَ يَتَسَلَّلُونَ مِنكُمْ لِوَاذًۭا ۚ فَلْيَحْذَرِ ٱلَّذِينَ يُخَالِفُونَ عَنْ أَمْرِهِۦٓ أَن تُصِيبَهُمْ فِتْنَةٌ أَوْ يُصِيبَهُمْ عَذَابٌ أَلِيمٌ ﴿63﴾", "ru": "Не делайте обращения к посланнику среди вас такими же, как обращение вас друг к другу. Аллах знает тех из вас, которые пробираются, ища убежища. Пусть берегутся те, которые нарушают Его приказ, чтобы их не постигло испытание или не
