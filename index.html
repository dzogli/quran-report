едний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Покаяние через убийство соплеменников. Кто кого убивал, в тексте не сказано; довод умеренный."}, {"n": "Что сказано: Хидр (⟦раб из Наших рабов⟧) и Муса идут вместе; встречают мальчика, и Хидр его убивает. Муса говорит: «Неужели ты убил чистую душу без отмщения за душу? Ты сделал вещь непохвальную!»\nВ чём проблема: убийство ребёнка, который никого не убивал, в рассказе осуждается Мусой — но Хидр, действовавший, как ⟦раб Аллаха⟧, не наказывается. При этом Коран запрещает убийство: 6:151 и 17:33.", "c": null, "x": ["18:80-81", "6:151", "17:33"], "refs": ["18:74"], "parts": [{"ref": "18:74", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "فَٱنطَلَقَا حَتَّىٰٓ إِذَا لَقِيَا غُلَٰمًۭا فَقَتَلَهُۥ قَالَ أَقَتَلْتَ نَفْسًۭا زَكِيَّةًۢ بِغَيْرِ نَفْسٍۢ لَّقَدْ جِئْتَ شَيْـًۭٔا نُّكْرًۭا ﴿74﴾", "ru": "И пошли они; а когда встретили мальчика и тот его убил, то он сказал: \"Неужели ты убил чистую душу без отмщения за душу? Ты сделал вещь непохвальную!\""}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Хидр убивает мальчика, а убийство без права запрещено (6:151). Но в 18:80-81 дано объяснение; это история, а не прямое противоречие."}, {"n": "Что сказано: Объяснение Хидра: ⟦Что касается мальчика, то родители его были верующими, и мы боялись, что он обречёт их переносить непокорность и неверие; мы хотели, чтобы Господь дал им взамен лучшего⟧.\nВ чём проблема: ребёнка убили за грех, которого он ещё не совершил (он мог бы стать неверным). Это противоречит 6:164 (⟦не понесёт носящая ноши другой⟧) и 17:33. Критики: убийство оправдано предсказанием.\nКак отвечают верующие: мусульманские толкователи: пример знания Бога, недоступного людям.", "c": "Мусульманские толкователи видят здесь пример знания Бога, недоступного людям; критики — оправдание убийства за грех, которого ещё нет.", "x": ["6:164", "17:33", "18:74"], "refs": ["18:80-81"], "parts": [{"ref": "18:80-81", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَأَمَّا ٱلْغُلَٰمُ فَكَانَ أَبَوَاهُ مُؤْمِنَيْنِ فَخَشِينَآ أَن يُرْهِقَهُمَا طُغْيَٰنًۭا وَكُفْرًۭا ﴿80﴾ فَأَرَدْنَآ أَن يُبْدِلَهُمَا رَبُّهُمَا خَيْرًۭا مِّنْهُ زَكَوٰةًۭ وَأَقْرَبَ رُحْمًۭا ﴿81﴾", "ru": "(80) Что касается мальчика, то родители его были верующими, и мы боялись, что он обречет их переносить непокорность и неверие. (81) И мы хотели, чтобы Господь дал им взамен лучшего, чем он, по чистоте и более близкого по милосердию."}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Ребёнка убили за грех, которого он не совершил; расходится с 6:164. В рассказе есть объяснение, и вывод зависит от того, принимать ли его."}, {"n": "Что сказано: Ибрахим видит во сне: «закалываю тебя в жертву». Сын отвечает: «делай, что тебе приказано». Бог говорит: ⟦Ты оправдал видение. Это — явное испытание. И искупили Мы его великой жертвой⟧.\nВ чём проблема: готовность убить собственного ребёнка по сну подана как образец веры. Критики: если Бог приказывает убить, а потом запрещает (6:151, 17:31), то в чём смысл. Жертва заменена только в последний момент.\nКак отвечают верующие: аят описывает испытание, которое не привело к убийству.", "c": null, "x": ["6:151", "17:31"], "refs": ["37:102-107"], "parts": [{"ref": "37:102-107", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "فَلَمَّا بَلَغَ مَعَهُ ٱلسَّعْىَ قَالَ يَٰبُنَىَّ إِنِّىٓ أَرَىٰ فِى ٱلْمَنَامِ أَنِّىٓ أَذْبَحُكَ فَٱنظُرْ مَاذَا تَرَىٰ ۚ قَالَ يَٰٓأَبَتِ ٱفْعَلْ مَا تُؤْمَرُ ۖ سَتَجِدُنِىٓ إِن شَآءَ ٱللَّهُ مِنَ ٱلصَّٰبِرِينَ ﴿102﴾ فَلَمَّآ أَسْلَمَا وَتَلَّهُۥ لِلْجَبِينِ ﴿103﴾ وَنَٰدَيْنَٰهُ أَن يَٰٓإِبْرَٰهِيمُ ﴿104﴾ قَدْ صَدَّقْتَ ٱلرُّءْيَآ ۚ إِنَّا كَذَٰلِكَ نَجْزِى ٱلْمُحْسِنِينَ ﴿105﴾ إِنَّ هَٰذَا لَهُوَ ٱلْبَلَٰٓؤُا۟ ٱلْمُبِينُ ﴿106﴾ وَفَدَيْنَٰهُ بِذِبْحٍ عَظِيمٍۢ ﴿107﴾", "ru": "(102) А когда он дошел до труда вместе с ним, он сказал: \"Сынок мой, вижу я во сне, что закалываю тебя в жертву, и посмотри, что ты думаешь\". Он сказал: \"Отец мой, делай, что тебе приказано; ты найдешь меня, если пожелает Аллах, терпеливым\". (103) И когда они оба предались Аллаху и тот поверг его на лоб, (104) и воззвали Мы к нему: \"О Ибрахим! (105) Ты оправдал видение\". Так Мы вознаграждаем добродеющих! (106) Поистине, это - явное испытание. (107) И искупили Мы его великою жертвой."}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Приказ принести сына в жертву по сну. Это испытание, закончившееся заменой; этический довод опирается на допущение."}, {"refs": ["2:190", "2:192", "4:90", "8:61", "9:4", "9:6"], "parts": [{"ref": "2:190", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَقَٰتِلُوا۟ فِى سَبِيلِ ٱللَّهِ ٱلَّذِينَ يُقَٰتِلُونَكُمْ وَلَا تَعْتَدُوٓا۟ ۚ إِنَّ ٱللَّهَ لَا يُحِبُّ ٱلْمُعْتَدِينَ ﴿190﴾", "ru": "И сражайтесь на пути Аллаха с теми, кто сражается с вами, но не преступайте, - поистине, Аллах не любит преступающих!"}, {"ref": "2:192", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "فَإِنِ ٱنتَهَوْا۟ فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ ﴿192﴾", "ru": "Если же они удержатся, то... ведь Аллах - прощающий, милосердный!"}, {"ref": "4:90", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِلَّا ٱلَّذِينَ يَصِلُونَ إِلَىٰ قَوْمٍۭ بَيْنَكُمْ وَبَيْنَهُم مِّيثَٰقٌ أَوْ جَآءُوكُمْ حَصِرَتْ صُدُورُهُمْ أَن يُقَٰتِلُوكُمْ أَوْ يُقَٰتِلُوا۟ قَوْمَهُمْ ۚ وَلَوْ شَآءَ ٱللَّهُ لَسَلَّطَهُمْ عَلَيْكُمْ فَلَقَٰتَلُوكُمْ ۚ فَإِنِ ٱعْتَزَلُوكُمْ فَلَمْ يُقَٰتِلُوكُمْ وَأَلْقَوْا۟ إِلَيْكُمُ ٱلسَّلَمَ فَمَا جَعَلَ ٱللَّهُ لَكُمْ عَلَيْهِمْ سَبِيلًۭا ﴿90﴾", "ru": "кроме тех, которые связаны с народом, между которым и вами есть союз; или они пришли к вам, а груди их стеснены, чтобы сражаться с вами или сражаться с их народом. А если бы Аллах хотел, Он дал бы им власть над вами, и они бы сражались с вами. А если они отойдут от вас, не сражаясь с вами, и предложат вам мир, то Аллах не дает вам никакого пути против них."}, {"ref": "8:61", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "۞ وَإِن جَنَحُوا۟ لِلسَّلْمِ فَٱجْنَحْ لَهَا وَتَوَكَّلْ عَلَى ٱللَّهِ ۚ إِنَّهُۥ هُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ ﴿61﴾", "ru": "А если они склонятся к миру, то склонись и ты к нему и полагайся на Аллаха: ведь Он - слышащий, знающий!"}, {"ref": "9:4", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "إِلَّا ٱلَّذِينَ عَٰهَدتُّم مِّنَ ٱلْمُشْرِكِينَ ثُمَّ لَمْ يَنقُصُوكُمْ شَيْـًۭٔا وَلَمْ يُظَٰهِرُوا۟ عَلَيْكُمْ أَحَدًۭا فَأَتِمُّوٓا۟ إِلَيْهِمْ عَهْدَهُمْ إِلَىٰ مُدَّتِهِمْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَّقِينَ ﴿4﴾", "ru": "кроме тех многобожников, с которыми вы заключили союз, а потом они ни в чем пред вами его не нарушали и никому не помогали против вас! Завершите же договор до их срока: ведь Аллах любит богобоязненных!"}, {"ref": "9:6", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "وَإِنْ أَحَدٌۭ مِّنَ ٱلْمُشْرِكِينَ ٱسْتَجَارَكَ فَأَجِرْهُ حَتَّىٰ يَسْمَعَ كَلَٰمَ ٱللَّهِ ثُمَّ أَبْلِغْهُ مَأْمَنَهُۥ ۚ ذَٰلِكَ بِأَنَّهُمْ قَوْمٌۭ لَّا يَعْلَمُونَ ﴿6﴾", "ru": "А если кто-нибудь из многобожников просил у тебя убежища, то приюти его, пока он не услышит слова Аллаха. Потом доставь его в безопасное для него место. Это - потому, что они - люди, которые не знают."}], "n": "Что сказано: «Сражайтесь на пути Аллаха с теми, кто сражается с вами, но не преступайте» (2:190); ⟦если они удержатся, то ведь Аллах — прощающий⟧ (2:192); не трогать тех, кто ⟦связан союзом⟧ или не хочет воевать (4:90); ⟦если они склонятся к миру, склонись и ты⟧ (8:61); договорникам, не нарушившим союза, — соблюдать договор до срока (9:4); многобожнику, просящему убежища, — дать убежище, пока он не услышит слово Аллаха, и доставить в безопасное место (9:6).\nВ чём проблема: эти аяты показывают, что в Коране есть и ограничения: воевать только с воюющими, прекращать при просьбе о мире, защищать просящих убежища. Они важны для справедливой оценки. Но критики замечают, что (1) 9:5 и 9:29 приказывают воевать без условия, (2) по классическому учению часть этих аятов отменена (насх), (3) 9:6 даёт убежище лишь ⟦пока не услышит слово Аллаха⟧ — то есть с целью обращения.\nКак отвечают верующие: именно на эти аяты опираются современные мусульманские богословы, говоря о мирной природе ислама.", "c": null, "x": ["2:106", "9:5", "9:29"], "t": "Контраргументы: аяты, ограничивающие насилие", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Это возражение верующих: аяты, которые ограничивают войну (2:190, 8:61). Они есть в тексте, и в докладе их надо называть; вопрос в том, почему тогда есть аяты без ограничения."}, {"refs": ["2:279"], "parts": [{"ref": "2:279", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "فَإِن لَّمْ تَفْعَلُوا۟ فَأْذَنُوا۟ بِحَرْبٍۢ مِّنَ ٱللَّهِ وَرَسُولِهِۦ ۖ وَإِن تُبْتُمْ فَلَكُمْ رُءُوسُ أَمْوَٰلِكُمْ لَا تَظْلِمُونَ وَلَا تُظْلَمُونَ ﴿279﴾", "ru": "Если же вы этого не сделаете, то услышьте про войну от Аллаха и Его посланника. А если обратитесь, то вам - ваш капитал. Не обижайте, и вы не будете обижены!"}], "n": "Что сказано: ⟦Если же вы этого не сделаете (не оставите ростовщичество), то услышьте про войну от Аллаха и Его посланника⟧.\nВ чём проблема: финансовое нарушение (взимание роста) наказывается объявлением войны от Бога и Пророка. Соразмерность: ростовщичество приравнено к вооружённому конфликту; в аяте не сказано, что это значит на практике.", "c": null, "x": ["2:275"], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Ростовщичество приравнено к войне против Бога. Смысл фразы неясен."}], "summary": ["Самые сильные: 9:5, 9:29, 4:89 против 2:256 и 2:217.", "Условие обороны названо только в части аятов (2:190, 22:39).", "Верующие ссылаются на контекст войн VII века; этот ответ надо называть.", "Слабые места: приказы, где контекст или перевод «фитна» неясен."]}, {"id": "jihad", "title": "Джихад: награды, угрозы и добыча", "icon": "🏹", "group": "Насилие и жестокость", "intro": "Награды за войну, угрозы уклоняющимся и правила дележа добычи. Показывает, что война в Коране мотивируется не только защитой, но и наградой в этом мире (добыча) и в будущем (рай).", "verses": [{"refs": ["2:154", "3:169"], "parts": [{"ref": "2:154", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَلَا تَقُولُوا۟ لِمَن يُقْتَلُ فِى سَبِيلِ ٱللَّهِ أَمْوَٰتٌۢ ۚ بَلْ أَحْيَآءٌۭ وَلَٰكِن لَّا تَشْعُرُونَ ﴿154﴾", "ru": "Не говорите о тех, которых убивают на пути Аллаха: \"Мертвые!\" Нет, живые! Но вы не чувствуете."}, {"ref": "3:169", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَلَا تَحْسَبَنَّ ٱلَّذِينَ قُتِلُوا۟ فِى سَبِيلِ ٱللَّهِ أَمْوَٰتًۢا ۚ بَلْ أَحْيَآءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ ﴿169﴾", "ru": "И никак не считай тех, которые убиты на пути Аллаха, мертвыми. Нет, живые! Они у своего Господа получают удел,"}], "n": "Что сказано: Убитых «на пути Аллаха» нельзя называть мёртвыми: «Нет, живые! Но вы не чувствуете» (2:154); они ⟦живы у своего Господа и получают удел⟧ (3:169).\nВ чём проблема: награда за смерть в бою — сильный стимул идти на смерть. Кроме того, аят утверждает, что погибшие «живы», хотя в 3:185 сказано ⟦всякая душа вкусит смерть⟧ и в 39:30 — ⟦ты умрёшь, и они умрут⟧: между ⟦живыми⟧ и ⟦умершими⟧ не объяснена разница.\nКак отвечают верующие: традиция говорит о жизни иного рода; в самом тексте это не раскрыто.", "c": null, "x": ["4:74", "3:185"], "t": "Погибшие в бою «живы»", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Погибшие названы «живыми», хотя в 3:185 «всякая душа вкусит смерть». Объясняется другой жизнью; довод умеренный."}, {"refs": ["4:74", "4:95", "61:10-13"], "parts": [{"ref": "4:74", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "۞ فَلْيُقَٰتِلْ فِى سَبِيلِ ٱللَّهِ ٱلَّذِينَ يَشْرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا بِٱلْءَاخِرَةِ ۚ وَمَن يُقَٰتِلْ فِى سَبِيلِ ٱللَّهِ فَيُقْتَلْ أَوْ يَغْلِبْ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًۭا ﴿74﴾", "ru": "Пусть же сражаются на пути Аллаха те, которые покупают за ближайшую жизнь будущую! И если кто сражается на пути Аллаха и будет убит или победит, Мы дадим ему великую награду."}, {"ref": "4:95", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "لَّا يَسْتَوِى ٱلْقَٰعِدُونَ مِنَ ٱلْمُؤْمِنِينَ غَيْرُ أُو۟لِى ٱلضَّرَرِ وَٱلْمُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ ۚ فَضَّلَ ٱللَّهُ ٱلْمُجَٰهِدِينَ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ عَلَى ٱلْقَٰعِدِينَ دَرَجَةًۭ ۚ وَكُلًّۭا وَعَدَ ٱللَّهُ ٱلْحُسْنَىٰ ۚ وَفَضَّلَ ٱللَّهُ ٱلْمُجَٰهِدِينَ عَلَى ٱلْقَٰعِدِينَ أَجْرًا عَظِيمًۭا ﴿95﴾", "ru": "Не равняются сидящие из верующих, не испытывающие вреда, и усердствующие на пути Аллаха своим имуществом и своими душами. Дал Аллах преимущество усердствующим своим имуществом и своими душами перед сидящими на степень. Всем обещал Аллах благо, а усердствующим Аллах дал преимущество перед сидящим в великой награде,"}, {"ref": "61:10-13", "sura": "As-Saff", "sura_ar": "سُورَةُ الصَّفِّ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ ﴿10﴾ تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ ﴿11﴾ يَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَيُدْخِلْكُمْ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ وَمَسَٰكِنَ طَيِّبَةًۭ فِى جَنَّٰتِ عَدْنٍۢ ۚ ذَٰلِكَ ٱلْفَوْزُ ٱلْعَظِيمُ ﴿12﴾ وَأُخْرَىٰ تُحِبُّونَهَا ۖ نَصْرٌۭ مِّنَ ٱللَّهِ وَفَتْحٌۭ قَرِيبٌۭ ۗ وَبَشِّرِ ٱلْمُؤْمِنِينَ ﴿13﴾", "ru": "(10) О вы, которые уверовали! Не указать ли мне вам на торговлю, которая спасет вас от мучительного наказания? (11) Вы веруете в Аллаха и Его посланника, боретесь на пути Аллаха своим имуществом и своими душами. Это лучше для вас, если вы знаете! (12) Он простит тогда вам ваши грехи и введет вас в сады, где внизу текут реки, и в жилища благие в садах вечности. Это - великая прибыль! (13) И другое, что вы любите: помощь от Аллаха и близкая победа. И обрадуй же верующих!"}], "n": "Что сказано: «Кто сражается на пути Аллаха и будет убит или победит — Мы дадим ему великую награду» (4:74); Бог «дал преимущество» воюющим перед «сидящими» (4:95); вера и борьба имуществом и душами названы ⟦торговлей⟧, которая спасёт от мучений и даст ⟦скорую победу⟧ (61:10-13).\nВ чём проблема: награда обещана и за победу, и за смерть: верующий в выигрыше при любом исходе боя. Тех, кто не идёт воевать, Бог объявляет менее достойными. Война подана как ⟦выгодная сделка⟧. Критики: система мотивирует насилие обещанием рая.", "c": null, "x": ["9:111"], "t": "Награды воюющим", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Награда обещана и за победу, и за смерть. Это претензия о побуждении к насилию наградой, но текст говорит прямо; довод этический."}, {"refs": ["4:94", "48:19-20"], "parts": [{"ref": "4:94", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا ضَرَبْتُمْ فِى سَبِيلِ ٱللَّهِ فَتَبَيَّنُوا۟ وَلَا تَقُولُوا۟ لِمَنْ أَلْقَىٰٓ إِلَيْكُمُ ٱلسَّلَٰمَ لَسْتَ مُؤْمِنًۭا تَبْتَغُونَ عَرَضَ ٱلْحَيَوٰةِ ٱلدُّنْيَا فَعِندَ ٱللَّهِ مَغَانِمُ كَثِيرَةٌۭ ۚ كَذَٰلِكَ كُنتُم مِّن قَبْلُ فَمَنَّ ٱللَّهُ عَلَيْكُمْ فَتَبَيَّنُوٓا۟ ۚ إِنَّ ٱللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًۭا ﴿94﴾", "ru": "О вы, которые уверовали! Когда отправляетесь по пути Аллаха, то различайте и не говорите тому, кто предложит вам мир: \"Ты не верующий\", - домогаясь случайностей жизни ближней. Ведь у Аллаха - обильная добыча. Таковы были вы раньше, но Аллах оказал вам милость. Различайте же: поистине, Аллах сведущ в том, что вы делаете!"}, {"ref": "48:19-20", "sura": "Al-Fath", "sura_ar": "سُورَةُ الفَتۡحِ", "type": "Medinan", "ar": "وَمَغَانِمَ كَثِيرَةًۭ يَأْخُذُونَهَا ۗ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًۭا ﴿19﴾ وَعَدَكُمُ ٱللَّهُ مَغَانِمَ كَثِيرَةًۭ تَأْخُذُونَهَا فَعَجَّلَ لَكُمْ هَٰذِهِۦ وَكَفَّ أَيْدِىَ ٱلنَّاسِ عَنكُمْ وَلِتَكُونَ ءَايَةًۭ لِّلْمُؤْمِنِينَ وَيَهْدِيَكُمْ صِرَٰطًۭا مُّسْتَقِيمًۭا ﴿20﴾", "ru": "(19) и обильную добычу, которую они возьмут. Аллах - великий, мудрый! (20) Обещал вам Аллах обильную добычу, которую вы возьмете, и ускорил Он вам это, и удержал руки людей от вас для того, чтобы это было знамением для верующих и Он вывел бы вас на прямую дорогу."}], "n": "Что сказано: Верующим говорят не отвергать предложившего мир словами «ты не верующий», «домогаясь случайностей жизни ближней: ведь у Аллаха — обильная добыча» (4:94); ⟦Аллах обещал вам обильную добычу, которую вы возьмёте⟧ (48:20).\nВ чём проблема: добыча открыто названа наградой за походы. Аят 4:94 сам признаёт, что соблазн добычи мог влиять на решение — убить ли того, кто уже предложил мир. Это не согласуется с утверждением, что война ведётся только ради Бога.", "c": null, "x": ["8:41", "8:1"], "t": "Добыча как мотив", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Добыча упомянута как соблазн, и она же названа наградой."}, {"n": "Что сказано: В 8:65 — двадцать терпеливых победят двести (1:10); в 8:66 — «Ныне облегчил вам Аллах; Он знает, что у вас есть слабость»: сто терпеливых победят двести (1:2).\nВ чём проблема: Бог за одну строку меняет число и объясняет это тем, что ⟦знает слабость⟧. Но Он знал её и раньше (всеведение). Это пример ⟦насх⟧ (отмены) внутри двух соседних аятов, что трудно совместить с 6:115 ⟦нет изменителя словам Его⟧.", "c": null, "x": ["2:106", "6:115"], "refs": ["8:65-66"], "parts": [{"ref": "8:65-66", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ حَرِّضِ ٱلْمُؤْمِنِينَ عَلَى ٱلْقِتَالِ ۚ إِن يَكُن مِّنكُمْ عِشْرُونَ صَٰبِرُونَ يَغْلِبُوا۟ مِا۟ئَتَيْنِ ۚ وَإِن يَكُن مِّنكُم مِّا۟ئَةٌۭ يَغْلِبُوٓا۟ أَلْفًۭا مِّنَ ٱلَّذِينَ كَفَرُوا۟ بِأَنَّهُمْ قَوْمٌۭ لَّا يَفْقَهُونَ ﴿65﴾ ٱلْـَٰٔنَ خَفَّفَ ٱللَّهُ عَنكُمْ وَعَلِمَ أَنَّ فِيكُمْ ضَعْفًۭا ۚ فَإِن يَكُن مِّنكُم مِّا۟ئَةٌۭ صَابِرَةٌۭ يَغْلِبُوا۟ مِا۟ئَتَيْنِ ۚ وَإِن يَكُن مِّنكُمْ أَلْفٌۭ يَغْلِبُوٓا۟ أَلْفَيْنِ بِإِذْنِ ٱللَّهِ ۗ وَٱللَّهُ مَعَ ٱلصَّٰبِرِينَ ﴿66﴾", "ru": "(65) О пророк! Побуждай верующих к сражению. Если будет среди вас двадцать терпеливых, то они победят две сотни; а если будет среди вас сотня, то они победят тысячу тех, которые не веруют, за то, что они народ не понимающий. (66) Ныне облегчил вам Аллах; Он знает, что у вас есть слабость. А если будет среди вас сотня терпеливая, то они победят двести, а если будет среди вас тысяча, то они победят две тысячи с дозволения Аллаха: ведь Аллах - с терпеливыми!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Число в соседних аятах меняется, и причина названа: «Он знает слабость». Это пример изменения решения внутри двух аятов, спорит с 6:115."}, {"n": "Что сказано: «Ни одному пророку не годилось иметь пленных, пока он не производил избиения на земле… Если бы не писание от Аллаха, которое пришло раньше, то коснулось бы вас за то, что вы взяли, великое наказание».\nВ чём проблема: Бог упрекает Пророка и верующих за то, что они взяли выкуп вместо «избиения на земле» (убийства пленных). Это прямое предпочтение убийства. Но 47:4 разрешает выкуп, а 8:70 говорит пленным: ⟦если Аллах узнает про добро в ваших сердцах, Он простит вам⟧. Аяты согласованы плохо.", "c": "Один из самых жёстких аятов о пленных: убийство противопоставлено выкупу.", "x": ["47:4", "8:70"], "refs": ["8:67-68"], "parts": [{"ref": "8:67-68", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "مَا كَانَ لِنَبِىٍّ أَن يَكُونَ لَهُۥٓ أَسْرَىٰ حَتَّىٰ يُثْخِنَ فِى ٱلْأَرْضِ ۚ تُرِيدُونَ عَرَضَ ٱلدُّنْيَا وَٱللَّهُ يُرِيدُ ٱلْءَاخِرَةَ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌۭ ﴿67﴾ لَّوْلَا كِتَٰبٌۭ مِّنَ ٱللَّهِ سَبَقَ لَمَسَّكُمْ فِيمَآ أَخَذْتُمْ عَذَابٌ عَظِيمٌۭ ﴿68﴾", "ru": "(67) Ни одному пророку не годилось иметь пленных, пока он не производил избиения на земле. Вы стремитесь к случайностям ближайшего мира, а Аллах желает будущего. Аллах - великий, мудрый! (68) Если бы не писание от Аллаха, которое пришло раньше, то коснулось бы вас за то, что вы взяли, великое наказание."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Бог упрекает за выкуп, а в 47:4 выкуп разрешён. Пара аятов, которые расходятся; довод умеренный."}, {"refs": ["9:38-39", "8:15-16", "9:41", "48:16"], "parts": [{"ref": "9:38-39", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ مَا لَكُمْ إِذَا قِيلَ لَكُمُ ٱنفِرُوا۟ فِى سَبِيلِ ٱللَّهِ ٱثَّاقَلْتُمْ إِلَى ٱلْأَرْضِ ۚ أَرَضِيتُم بِٱلْحَيَوٰةِ ٱلدُّنْيَا مِنَ ٱلْءَاخِرَةِ ۚ فَمَا مَتَٰعُ ٱلْحَيَوٰةِ ٱلدُّنْيَا فِى ٱلْءَاخِرَةِ إِلَّا قَلِيلٌ ﴿38﴾ إِلَّا تَنفِرُوا۟ يُعَذِّبْكُمْ عَذَابًا أَلِيمًۭا وَيَسْتَبْدِلْ قَوْمًا غَيْرَكُمْ وَلَا تَضُرُّوهُ شَيْـًۭٔا ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ ﴿39﴾", "ru": "(38) О вы, которые уверовали! Почему, когда говорят вам: \"Выступайте по пути Аллаха\", вы тяжело припадаете к земле? Разве вы довольны ближней жизнью больше последней? Ведь достояние ближней жизни в сравнении с будущей - ничтожно. (39) Если вы не выступите, накажет вас Аллах мучительным наказанием и заменит вас другим народом. А вы ни в чем не причините Ему вреда: ведь Аллах мощен над всякой вещью!"}, {"ref": "8:15-16", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا لَقِيتُمُ ٱلَّذِينَ كَفَرُوا۟ زَحْفًۭا فَلَا تُوَلُّوهُمُ ٱلْأَدْبَارَ ﴿15﴾ وَمَن يُوَلِّهِمْ يَوْمَئِذٍۢ دُبُرَهُۥٓ إِلَّا مُتَحَرِّفًۭا لِّقِتَالٍ أَوْ مُتَحَيِّزًا إِلَىٰ فِئَةٍۢ فَقَدْ بَآءَ بِغَضَبٍۢ مِّنَ ٱللَّهِ وَمَأْوَىٰهُ جَهَنَّمُ ۖ وَبِئْسَ ٱلْمَصِيرُ ﴿16﴾", "ru": "(15) О те, которые уверовали! Когда вы встретите тех, кто не веровал, в движении, то не обращайте к ним тыл. (16) А кто обратит к ним в тот день тыл, если не для поворота к битве или для присоединения к отряду, тот навлечет на себя гнев Аллаха. Убежище для него - геенна, и скверно это возвращение!"}, {"ref": "9:41", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "ٱنفِرُوا۟ خِفَافًۭا وَثِقَالًۭا وَجَٰهِدُوا۟ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ فِى سَبِيلِ ٱللَّهِ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ ﴿41﴾", "ru": "Выступайте легкими и тяжелыми и боритесь своими имуществами и душами на пути Аллаха! Это - лучшее для вас, если вы знаете!"}, {"ref": "48:16", "sura": "Al-Fath", "sura_ar": "سُورَةُ الفَتۡحِ", "type": "Medinan", "ar": "قُل لِّلْمُخَلَّفِينَ مِنَ ٱلْأَعْرَابِ سَتُدْعَوْنَ إِلَىٰ قَوْمٍ أُو۟لِى بَأْسٍۢ شَدِيدٍۢ تُقَٰتِلُونَهُمْ أَوْ يُسْلِمُونَ ۖ فَإِن تُطِيعُوا۟ يُؤْتِكُمُ ٱللَّهُ أَجْرًا حَسَنًۭا ۖ وَإِن تَتَوَلَّوْا۟ كَمَا تَوَلَّيْتُم مِّن قَبْلُ يُعَذِّبْكُمْ عَذَابًا أَلِيمًۭا ﴿16﴾", "ru": "Скажи оставленным из бедуинов: \"Вы будете призваны на народ, обладающий великой яростью. Вы будете сражаться с ними, или они предадутся. И если вы будете повиноваться, тогда Аллах дарует вам хорошую награду, а если отвернетесь, как отвернулись раньше, Он накажет вас мучительным наказанием\"."}], "n": "Что сказано: Не вышедших на войну ждут ⟦мучительное наказание⟧ и замена «другим народом» (9:39); тот, кто ⟦обратил тыл⟧ в бою, ⟦навлёк гнев Аллаха, и обиталище его — геенна⟧ (8:16); «выступайте лёгкими и тяжёлыми» (9:41); тем, кто остался дома, говорят: вас позовут воевать с ⟦народом великой ярости⟧: «вы будете сражаться с ними, или они предадутся» (48:16).\nВ чём проблема: за отказ воевать и за бегство обещан не земной штраф, а вечное наказание. В 48:16 противнику предложен выбор ⟦сражаться или предаться⟧ (то есть принять ислам). Критики: угроза адом за уклонение от войны превращает обязанность в религиозное принуждение.", "c": null, "x": ["4:95", "2:216", "9:5"], "t": "Угрозы тем, кто не воюет", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Угроза наказанием за отказ воевать. Этическая претензия: обязанность превращена в религиозный долг под угрозой."}], "summary": ["Награда за смерть в бою и добыча — этическая претензия, текстуально прямая.", "Сильнее всего пара 8:67-68 и 47:4 о пленных."]}, {"id": "punish", "title": "Жестокие наказания", "icon": "⛓", "group": "Насилие и жестокость", "intro": "Телесные и калечащие наказания, а также неравенство в правовых нормах (свободный/раб, мужчина/женщина).", "verses": [{"n": "Что сказано: ⟦Воздаяние тех, которые воюют с Аллахом и Его посланником и стараются на земле вызвать нечестие, — что они будут убиты, или распяты, или будут отсечены у них руки и ноги накрест, или будут они изгнаны из земли⟧.\nВ чём проблема: (1) Формулировка расплывчата (⟦нечестие на земле⟧). (2) Ровно такое же наказание в 7:124, 20:71, 26:49 угрожает Фараон, которого Коран осуждает. (3) Раскаяние смягчает (5:34), но только ⟦прежде, чем вы получили власть над ними⟧.", "c": "Классические юристы относили к разбою на дорогах.", "x": ["7:124", "5:34"], "refs": ["5:33"], "parts": [{"ref": "5:33", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "إِنَّمَا جَزَٰٓؤُا۟ ٱلَّذِينَ يُحَارِبُونَ ٱللَّهَ وَرَسُولَهُۥ وَيَسْعَوْنَ فِى ٱلْأَرْضِ فَسَادًا أَن يُقَتَّلُوٓا۟ أَوْ يُصَلَّبُوٓا۟ أَوْ تُقَطَّعَ أَيْدِيهِمْ وَأَرْجُلُهُم مِّنْ خِلَٰفٍ أَوْ يُنفَوْا۟ مِنَ ٱلْأَرْضِ ۚ ذَٰلِكَ لَهُمْ خِزْىٌۭ فِى ٱلدُّنْيَا ۖ وَلَهُمْ فِى ٱلْءَاخِرَةِ عَذَابٌ عَظِيمٌ ﴿33﴾", "ru": "Действительно, воздаяние тех, которые воюют с Аллахом и Его посланником и стараются на земле вызвать нечестие, в том, что они будут убиты, или распяты, или будут отсечены у них руки и ноги накрест, или будут они изгнаны из земли. Это для них - позор в ближайшей жизни, а в последней для них - великое наказание, -"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Те же наказания («накрест») названы у Фараона (7:124) и у Бога — совпадение, которое стоит отметить."}, {"n": "Что сказано: «Вору и воровке — отсекайте их руки в воздаяние за то, что они приобрели».\nВ чём проблема: калечащее наказание за кражу, без различия по размеру кражи и без оговорки о нужде или голоде в самом аяте (в 5:39 — раскаяние). Современные страны, применяющие этот закон, подвергаются критике за несоразмерность.\nКак отвечают верующие: юристы вводят ограничения (минимальная стоимость, условия доказательства).", "c": "Юристы вводили ограничения (минимальная сумма — нисаб, условия доказательства), но сама норма применяется и сегодня в ряде стран.", "x": ["5:39"], "refs": ["5:38"], "parts": [{"ref": "5:38", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَٱلسَّارِقُ وَٱلسَّارِقَةُ فَٱقْطَعُوٓا۟ أَيْدِيَهُمَا جَزَآءًۢ بِمَا كَسَبَا نَكَٰلًۭا مِّنَ ٱللَّهِ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌۭ ﴿38﴾", "ru": "Вору и воровке отсекайте их руки в воздаяние за то, что они приобрели, как устрашение от Аллаха. Поистине, Аллах - великий, мудрый!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Отсечение руки без различия по размеру кражи. Этическая претензия; в 5:39 есть раскаяние."}, {"n": "Что сказано: ⟦Прелюбодея и прелюбодейку — побивайте каждого из них сотней ударов. Пусть не овладевает вами жалость к ним в религии Аллаха. И пусть присутствует при их наказании группа верующих⟧.\nВ чём проблема: (1) публичное телесное наказание за личное деяние; (2) жалость прямо запрещена; (3) в 4:15 за то же ранее предписано заключение женщин ⟦до смерти⟧, то есть норма менялась; (4) доказать преступление по 24:4 — четыре свидетеля, то есть практически невозможно.", "c": null, "x": ["24:4", "4:15"], "refs": ["24:2"], "parts": [{"ref": "24:2", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "ٱلزَّانِيَةُ وَٱلزَّانِى فَٱجْلِدُوا۟ كُلَّ وَٰحِدٍۢ مِّنْهُمَا مِا۟ئَةَ جَلْدَةٍۢ ۖ وَلَا تَأْخُذْكُم بِهِمَا رَأْفَةٌۭ فِى دِينِ ٱللَّهِ إِن كُنتُمْ تُؤْمِنُونَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ ۖ وَلْيَشْهَدْ عَذَابَهُمَا طَآئِفَةٌۭ مِّنَ ٱلْمُؤْمِنِينَ ﴿2﴾", "ru": "Прелюбодея и прелюбодейку - побивайте каждого из них сотней ударов. Пусть не овладевает вами жалость к ним в религии Аллаха, если вы веруете в Аллаха и в последний день. И пусть присутствует при их наказании группа верующих."}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Сто плетей, жалость запрещена. Этическая претензия; часть норм смягчена традицией."}, {"n": "Что сказано: ⟦Те, которые обвиняют честных женщин, потом не приводят четырёх свидетелей, — отхлестайте их восьмьюдесятью ударами и не принимайте от них свидетельства никогда⟧.\nВ чём проблема: четыре свидетеля почти невозможны, поэтому жертва насилия, если не может их привести, сама рискует быть обвинённой в клевете (80 плетей и вечный запрет на свидетельство).", "c": null, "x": ["24:2", "24:6-9"], "refs": ["24:4"], "parts": [{"ref": "24:4", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَٱلَّذِينَ يَرْمُونَ ٱلْمُحْصَنَٰتِ ثُمَّ لَمْ يَأْتُوا۟ بِأَرْبَعَةِ شُهَدَآءَ فَٱجْلِدُوهُمْ ثَمَٰنِينَ جَلْدَةًۭ وَلَا تَقْبَلُوا۟ لَهُمْ شَهَٰدَةً أَبَدًۭا ۚ وَأُو۟لَٰٓئِكَ هُمُ ٱلْفَٰسِقُونَ ﴿4﴾", "ru": "А те, которые бросают обвинение в целомудренных, а потом не приведут четырех свидетелей, - побейте их восемьюдесятью ударами и не принимайте от них свидетельства никогда; это - распутники,"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Четыре свидетеля почти недостижимы, поэтому жертва рискует быть обвинённой в клевете. Довод основан на практических последствиях."}, {"n": "Что сказано: ⟦Предписано вам возмездие за убитых: свободный за свободного, раб за раба, женщина за женщину⟧.\nВ чём проблема: ценность жизни зависит от статуса: по буквальному чтению свободного нельзя казнить за раба, а мужчину — за женщину. Закон закрепляет неравенство людей. Мусульманские школы расходятся в применении.", "c": null, "x": ["5:45"], "refs": ["2:178"], "parts": [{"ref": "2:178", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلْقِصَاصُ فِى ٱلْقَتْلَى ۖ ٱلْحُرُّ بِٱلْحُرِّ وَٱلْعَبْدُ بِٱلْعَبْدِ وَٱلْأُنثَىٰ بِٱلْأُنثَىٰ ۚ فَمَنْ عُفِىَ لَهُۥ مِنْ أَخِيهِ شَىْءٌۭ فَٱتِّبَاعٌۢ بِٱلْمَعْرُوفِ وَأَدَآءٌ إِلَيْهِ بِإِحْسَٰنٍۢ ۗ ذَٰلِكَ تَخْفِيفٌۭ مِّن رَّبِّكُمْ وَرَحْمَةٌۭ ۗ فَمَنِ ٱعْتَدَىٰ بَعْدَ ذَٰلِكَ فَلَهُۥ عَذَابٌ أَلِيمٌۭ ﴿178﴾", "ru": "О те, которые уверовали! Предписано вам возмездие за убитых: свободный - за свободного, и раб - за раба, и женщина - за женщину. А кому будет прощено что-нибудь его братом, то - следование по обычаю и возмещение ему во благе. Это - облегчение от Господа вашего и милость; а кто преступит после этого, для него - наказание болезненное!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Ценность жизни зависит от статуса. Спорно, как читать аят; этическая претензия."}, {"n": "Что сказано: ⟦Мы предписали им в ней (Торе): душа за душу, глаз за глаз, нос за нос, ухо за ухо, зуб за зуб, и раны — возмездие. А кто пожертвует (простит) — это ему искупление⟧.\nВ чём проблема: Коран цитирует закон Торы как норму, не критикуя. Возмездие — это ответное увечье; а в 41:34 (⟦отклоняй тем, что лучше⟧) говорится о другом принципе. Само прощение названо ⟦искуплением⟧ — это смягчающий момент.", "c": "В тексте говорится о Торе; допускает прощение ⟦как милостыню⟧.", "x": ["2:178", "41:34", "42:40-41"], "refs": ["5:45"], "parts": [{"ref": "5:45", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَكَتَبْنَا عَلَيْهِمْ فِيهَآ أَنَّ ٱلنَّفْسَ بِٱلنَّفْسِ وَٱلْعَيْنَ بِٱلْعَيْنِ وَٱلْأَنفَ بِٱلْأَنفِ وَٱلْأُذُنَ بِٱلْأُذُنِ وَٱلسِّنَّ بِٱلسِّنِّ وَٱلْجُرُوحَ قِصَاصٌۭ ۚ فَمَن تَصَدَّقَ بِهِۦ فَهُوَ كَفَّارَةٌۭ لَّهُۥ ۚ وَمَن لَّمْ يَحْكُم بِمَآ أَنزَلَ ٱللَّهُ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ ﴿45﴾", "ru": "И предписали Мы им в ней, что душа - за душу, и око - за око, и нос - за нос, и ухо - за ухо, и зуб - за зуб, и раны - отмщение. А кто пожертвует это милостыней, то это - искупление за него. А кто судит не потому, что низвел Аллах, те - несправедливы."}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Закон возмездия назван нормой Торы; в тексте есть и прощение."}, {"n": "Что сказано: ⟦Тех из ваших женщин, которые совершат мерзость, — призовите против них четырёх свидетелей из вас, и если они засвидетельствуют, то удерживайте их в домах, пока не упокоит их смерть⟧.\nВ чём проблема: пожизненное домашнее заключение для женщин без суда в современном смысле. Традиция считает аят отменённым 24:2 (сто плетей): то есть Бог поменял предписание.", "c": "Многие толкователи считают этот аят отменённым 24:2.", "x": ["24:2", "2:106"], "refs": ["4:15"], "parts": [{"ref": "4:15", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَٱلَّٰتِى يَأْتِينَ ٱلْفَٰحِشَةَ مِن نِّسَآئِكُمْ فَٱسْتَشْهِدُوا۟ عَلَيْهِنَّ أَرْبَعَةًۭ مِّنكُمْ ۖ فَإِن شَهِدُوا۟ فَأَمْسِكُوهُنَّ فِى ٱلْبُيُوتِ حَتَّىٰ يَتَوَفَّىٰهُنَّ ٱلْمَوْتُ أَوْ يَجْعَلَ ٱللَّهُ لَهُنَّ سَبِيلًۭا ﴿15﴾", "ru": "А те из ваших женщин, которые совершат мерзость, - возьмите в свидетели против них четырех из вас. И если они засвидетельствуют, то держите их в домах, пока не упокоит их смерть или Аллах устроит для них путь."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Заключение женщин «до смерти» затем заменено 24:2. Это пример изменения нормы (насх)."}, {"refs": ["7:124", "20:71", "26:49"], "parts": [{"ref": "7:124", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "لَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُم مِّنْ خِلَٰفٍۢ ثُمَّ لَأُصَلِّبَنَّكُمْ أَجْمَعِينَ ﴿124﴾", "ru": "Я отрублю вам руки и ноги накрест, потом распну вас всех!\""}, {"ref": "20:71", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "قَالَ ءَامَنتُمْ لَهُۥ قَبْلَ أَنْ ءَاذَنَ لَكُمْ ۖ إِنَّهُۥ لَكَبِيرُكُمُ ٱلَّذِى عَلَّمَكُمُ ٱلسِّحْرَ ۖ فَلَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُم مِّنْ خِلَٰفٍۢ وَلَأُصَلِّبَنَّكُمْ فِى جُذُوعِ ٱلنَّخْلِ وَلَتَعْلَمُنَّ أَيُّنَآ أَشَدُّ عَذَابًۭا وَأَبْقَىٰ ﴿71﴾", "ru": "Сказал он: \"Неужели вы уверовали в Него раньше, чем я дозволил вам; он, конечно, ваш старший, который научил вас колдовству. Я отрублю вам руки и ноги накрест, распну вас на стволах пальм, узнаете вы тогда, кто из нас сильнее наказанием и более длителен\"."}, {"ref": "26:49", "sura": "Ash-Shu'araa", "sura_ar": "سُورَةُ الشُّعَرَاءِ", "type": "Meccan", "ar": "قَالَ ءَامَنتُمْ لَهُۥ قَبْلَ أَنْ ءَاذَنَ لَكُمْ ۖ إِنَّهُۥ لَكَبِيرُكُمُ ٱلَّذِى عَلَّمَكُمُ ٱلسِّحْرَ فَلَسَوْفَ تَعْلَمُونَ ۚ لَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُم مِّنْ خِلَٰفٍۢ وَلَأُصَلِّبَنَّكُمْ أَجْمَعِينَ ﴿49﴾", "ru": "Сказал: \"Разве вы уверовали в Него, прежде чем я разрешил вам: он, конечно, ваш старший, который научил вас колдовству, и вы узнаете. Я отсеку вам руки и ноги накрест и распну вас всех!\""}], "n": "Что сказано: Фараон трижды угрожает уверовавшим колдунам: «Я отрублю вам руки и ноги накрест, потом распну вас всех!» (7:124; 20:71; 26:49).\nВ чём проблема: Коран приводит это как пример злодеяния Фараона. Но в 5:33 то же самое — убийство, распятие, ⟦отсечение руки и ноги накрест⟧ — Бог назначает ⟦воюющим против Аллаха и посланника⟧. Получается, что одна и та же формула наказания у Фараона — тирания, а у Бога — закон. Критики видят здесь двойной стандарт.\nКак отвечают верующие: верующие: в 5:33 наказание за конкретное преступление (разбой и мятеж), а у Фараона — за веру.", "c": null, "x": ["5:33"], "t": "Наказание «руки и ноги накрест»", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Фараон угрожает «руки и ноги накрест», а в 5:33 то же назначает Бог. Совпадение формулировки стоит отметить."}, {"n": "Что сказано: Муж, обвиняющий жену в измене без свидетелей: ⟦свидетельство каждого из них — четыре свидетельства Аллахом, что он правдив, а пятое — что проклятие Аллаха на нём, если он лжец. И отклоняется от неё наказание, если она засвидетельствует четырьмя свидетельствами Аллахом, что он лжец⟧.\nВ чём проблема: слово мужа без доказательств приравнено к четырём клятвам; жена может избежать наказания встречными клятвами. Процедура не симметрична: у жены нет права обвинить мужа таким образом.", "c": null, "x": ["24:4"], "refs": ["24:6-9"], "parts": [{"ref": "24:6-9", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَٱلَّذِينَ يَرْمُونَ أَزْوَٰجَهُمْ وَلَمْ يَكُن لَّهُمْ شُهَدَآءُ إِلَّآ أَنفُسُهُمْ فَشَهَٰدَةُ أَحَدِهِمْ أَرْبَعُ شَهَٰدَٰتٍۭ بِٱللَّهِ ۙ إِنَّهُۥ لَمِنَ ٱلصَّٰدِقِينَ ﴿6﴾ وَٱلْخَٰمِسَةُ أَنَّ لَعْنَتَ ٱللَّهِ عَلَيْهِ إِن كَانَ مِنَ ٱلْكَٰذِبِينَ ﴿7﴾ وَيَدْرَؤُا۟ عَنْهَا ٱلْعَذَابَ أَن تَشْهَدَ أَرْبَعَ شَهَٰدَٰتٍۭ بِٱللَّهِ ۙ إِنَّهُۥ لَمِنَ ٱلْكَٰذِبِينَ ﴿8﴾ وَٱلْخَٰمِسَةَ أَنَّ غَضَبَ ٱللَّهِ عَلَيْهَآ إِن كَانَ مِنَ ٱلصَّٰدِقِينَ ﴿9﴾", "ru": "(6) А те, которые бросают обвинения в своих жен и у них нет свидетелей, кроме самих себя, то свидетельство каждого из них - четыре свидетельства Аллахом, что он правдив, (7) а пятое, - что проклятие Аллаха на нем, если он лжец. (8) И отклоняется от нее наказание, если она засвидетельствует четырьмя свидетельствует Аллахом, что он лжец, (9) а пятым, - что гнев Аллаха на ней, если он правдив."}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Клятвы мужа и жены неравны."}], "summary": ["Наказания названы прямо; спор идёт о соразмерности и о применимости.", "Любопытная пара: те же наказания у Фараона (7:124) и в 5:33."]}, {"id": "hell", "title": "Ад и проклятия", "icon": "🔥", "group": "Насилие и жестокость", "intro": "Образы вечных мучений, в которых наказание за неверие описывается как бесконечное и физически жестокое.", "verses": [{"refs": ["4:56", "22:19-21", "14:16-17", "70:15-18", "74:26-29"], "parts": [{"ref": "4:56", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِنَا سَوْفَ نُصْلِيهِمْ نَارًۭا كُلَّمَا نَضِجَتْ جُلُودُهُم بَدَّلْنَٰهُمْ جُلُودًا غَيْرَهَا لِيَذُوقُوا۟ ٱلْعَذَابَ ۗ إِنَّ ٱللَّهَ كَانَ عَزِيزًا حَكِيمًۭا ﴿56﴾", "ru": "Поистине, тех, которые не веровали в Наши знамения, Мы сожжем в огне! Всякий раз, как сготовится их кожа, Мы заменим им другой кожей, чтобы они вкусили наказания. Поистине, Аллах - великий, мудрый!"}, {"ref": "22:19-21", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "۞ هَٰذَانِ خَصْمَانِ ٱخْتَصَمُوا۟ فِى رَبِّهِمْ ۖ فَٱلَّذِينَ كَفَرُوا۟ قُطِّعَتْ لَهُمْ ثِيَابٌۭ مِّن نَّارٍۢ يُصَبُّ مِن فَوْقِ رُءُوسِهِمُ ٱلْحَمِيمُ ﴿19﴾ يُصْهَرُ بِهِۦ مَا فِى بُطُونِهِمْ وَٱلْجُلُودُ ﴿20﴾ وَلَهُم مَّقَٰمِعُ مِنْ حَدِيدٍۢ ﴿21﴾", "ru": "(19) Вот - два врага, которые враждовали об их господе; тем, которые не веровали, выкроены одежды из огня, проливается на их головы кипяток. (20) Растапливается от этого то, что у них в утробах, и (их) кожи. (21) Для них есть железные крючья."}, {"ref": "14:16-17", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "مِّن وَرَآئِهِۦ جَهَنَّمُ وَيُسْقَىٰ مِن مَّآءٍۢ صَدِيدٍۢ ﴿16﴾ يَتَجَرَّعُهُۥ وَلَا يَكَادُ يُسِيغُهُۥ وَيَأْتِيهِ ٱلْمَوْتُ مِن كُلِّ مَكَانٍۢ وَمَا هُوَ بِمَيِّتٍۢ ۖ وَمِن وَرَآئِهِۦ عَذَابٌ غَلِيظٌۭ ﴿17﴾", "ru": "(16) Позади его - геенна, и будут его поить водой гнойной. (17) Он лакает ее, но едва проглатывает, и приходит к нему смерть со всех мест, но он не мертв, а позади его - суровое наказание."}, {"ref": "70:15-18", "sura": "Al-Ma'aarij", "sura_ar": "سُورَةُ المَعَارِجِ", "type": "Meccan", "ar": "كَلَّآ ۖ إِنَّهَا لَظَىٰ ﴿15﴾ نَزَّاعَةًۭ لِّلشَّوَىٰ ﴿16﴾ تَدْعُوا۟ مَنْ أَدْبَرَ وَتَوَلَّىٰ ﴿17﴾ وَجَمَعَ فَأَوْعَىٰٓ ﴿18﴾", "ru": "(15) Так нет, ведь это - огонь, (16) схвативши за скальп, (17) призывает тех, кто отвратился и повернулся, (18) кто собрал и скопил."}, {"ref": "74:26-29", "sura": "Al-Muddaththir", "sura_ar": "سُورَةُ المُدَّثِّرِ", "type": "Meccan", "ar": "سَأُصْلِيهِ سَقَرَ ﴿26﴾ وَمَآ أَدْرَىٰكَ مَا سَقَرُ ﴿27﴾ لَا تُبْقِى وَلَا تَذَرُ ﴿28﴾ لَوَّاحَةٌۭ لِّلْبَشَرِ ﴿29﴾", "ru": "(26) Сожгу я его в сакаре! (27) А что даст тебе знать, что такое сакар? (28) Не оставляет он и не покидает - (29) сжигатель кожи."}], "n": "Что сказано: ⟦Всякий раз, как сгорит их кожа, Мы заменим её другой кожей, чтобы они вкусили мучение⟧ (4:56); над головами льют кипяток, он растапливает внутренности и кожу, и железные палицы (22:19-21); ⟦едва проглатывает… смерть приходит к нему со всех мест, но он не умирает⟧ (14:17); огонь ⟦схватит за скальп⟧ (70:16); «сжигатель кожи» (74:29).\nВ чём проблема: три вопроса. (1) Соразмерность: за конечную жизнь — бесконечная пытка, а Бог назван ⟦милосердным⟧ (1:3) и ⟦предначертал для самого Себя милость⟧ (6:12). (2) Бог Сам запечатывает сердца неверных (2:7, 6:110), а потом мучит за неверие. (3) Цель названа не исправление, а ⟦чтобы вкусили мучение⟧; смерть как избавление недоступна.\nКак отвечают верующие: наказание справедливо за отвержение; вечность в 6:128 и 11:107 оговорена ⟦если не пожелает Аллах иного⟧.", "c": null, "x": ["2:7", "6:110", "6:128", "11:107", "4:169"], "t": "Физические мучения в аду", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Конечная жизнь и бесконечная пытка при том, что Бог назван милосердным. Это философское возражение; в тексте оно не разрешено."}, {"refs": ["44:43-46", "37:62-67", "56:51-56", "78:21-30", "88:2-7"], "parts": [{"ref": "44:43-46", "sura": "Ad-Dukhaan", "sura_ar": "سُورَةُ الدُّخَانِ", "type": "Meccan", "ar": "إِنَّ شَجَرَتَ ٱلزَّقُّومِ ﴿43﴾ طَعَامُ ٱلْأَثِيمِ ﴿44﴾ كَٱلْمُهْلِ يَغْلِى فِى ٱلْبُطُونِ ﴿45﴾ كَغَلْىِ ٱلْحَمِيمِ ﴿46﴾", "ru": "(43) Ведь дерево заккум - (44) пища для грешника. (45) Как медь, - кипит оно в животах, (46) точно кипит кипяток."}, {"ref": "37:62-67", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "أَذَٰلِكَ خَيْرٌۭ نُّزُلًا أَمْ شَجَرَةُ ٱلزَّقُّومِ ﴿62﴾ إِنَّا جَعَلْنَٰهَا فِتْنَةًۭ لِّلظَّٰلِمِينَ ﴿63﴾ إِنَّهَا شَجَرَةٌۭ تَخْرُجُ فِىٓ أَصْلِ ٱلْجَحِيمِ ﴿64﴾ طَلْعُهَا كَأَنَّهُۥ رُءُوسُ ٱلشَّيَٰطِينِ ﴿65﴾ فَإِنَّهُمْ لَءَاكِلُونَ مِنْهَا فَمَالِـُٔونَ مِنْهَا ٱلْبُطُونَ ﴿66﴾ ثُمَّ إِنَّ لَهُمْ عَلَيْهَا لَشَوْبًۭا مِّنْ حَمِيمٍۢ ﴿67﴾", "ru": "(62) Это лучше, как угощение, или дерево заккум? (63) Мы ведь сделали его соблазном для обидчиков. (64) Это ведь дерево, которое выходит из корня геенны. (65) Плоды его точно головы дияволов. (66) И они едят его и наполняют им животы. (67) А потом есть вода для них, горячее питье из кипятка."}, {"ref": "56:51-56", "sura": "Al-Waaqia", "sura_ar": "سُورَةُ الوَاقِعَةِ", "type": "Meccan", "ar": "ثُمَّ إِنَّكُمْ أَيُّهَا ٱلضَّآلُّونَ ٱلْمُكَذِّبُونَ ﴿51﴾ لَءَاكِلُونَ مِن شَجَرٍۢ مِّن زَقُّومٍۢ ﴿52﴾ فَمَالِـُٔونَ مِنْهَا ٱلْبُطُونَ ﴿53﴾ فَشَٰرِبُونَ عَلَيْهِ مِنَ ٱلْحَمِيمِ ﴿54﴾ فَشَٰرِبُونَ شُرْبَ ٱلْهِيمِ ﴿55﴾ هَٰذَا نُزُلُهُمْ يَوْمَ ٱلدِّينِ ﴿56﴾", "ru": "(51) Потом, поистине, вы - заблудшие, обвиняющие во лжи, (52) будете есть с дерева заккум (53) и наполнять им животы, (54) и пить за этим кипяток, (55) и пить, как пьют истомленные жаждой\". (56) Это - угощение их в день суда."}, {"ref": "78:21-30", "sura": "An-Naba", "sura_ar": "سُورَةُ النَّبَإِ", "type": "Meccan", "ar": "إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًۭا ﴿21﴾ لِّلطَّٰغِينَ مَـَٔابًۭا ﴿22﴾ لَّٰبِثِينَ فِيهَآ أَحْقَابًۭا ﴿23﴾ لَّا يَذُوقُونَ فِيهَا بَرْدًۭا وَلَا شَرَابًا ﴿24﴾ إِلَّا حَمِيمًۭا وَغَسَّاقًۭا ﴿25﴾ جَزَآءًۭ وِفَاقًا ﴿26﴾ إِنَّهُمْ كَانُوا۟ لَا يَرْجُونَ حِسَابًۭا ﴿27﴾ وَكَذَّبُوا۟ بِـَٔايَٰتِنَا كِذَّابًۭا ﴿28﴾ وَكُلَّ شَىْءٍ أَحْصَيْنَٰهُ كِتَٰبًۭا ﴿29﴾ فَذُوقُوا۟ فَلَن نَّزِيدَكُمْ إِلَّا عَذَابًا ﴿30﴾", "ru": "(21) Поистине, геенна - есть засада, (22) для преступивших - место возврата, (23) в котором они пробудут века, (24) не вкушая там ни прохлады, ни питья, (25) кроме кипятку и гною, (26) воздаяние соответственное. (27) Ведь они не надеялись на расчет (28) и считали ложью Наши знамения лживо. (29) И каждую вещь Мы сочли, записав. (30) Вкусите же, Мы не прибавим вам ничего, кроме наказания!"}, {"ref": "88:2-7", "sura": "Al-Ghaashiya", "sura_ar": "سُورَةُ الغَاشِيَةِ", "type": "Meccan", "ar": "وُجُوهٌۭ يَوْمَئِذٍ خَٰشِعَةٌ ﴿2﴾ عَامِلَةٌۭ نَّاصِبَةٌۭ ﴿3﴾ تَصْلَىٰ نَارًا حَامِيَةًۭ ﴿4﴾ تُسْقَىٰ مِنْ عَيْنٍ ءَانِيَةٍۢ ﴿5﴾ لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍۢ ﴿6﴾ لَّا يُسْمِنُ وَلَا يُغْنِى مِن جُوعٍۢ ﴿7﴾", "ru": "(2) Лица в тот день униженные, (3) трудящиеся, работающие, (4) горят в огне пылающем, (5) поятся из источника кипящего. (6) Нет у них пищи, кроме дари, (7) он не утучняет и от голода не избавляет."}], "n": "Что сказано: Дерево Заккум «выходит из корня геенны», его плоды ⟦точно головы дьяволов⟧, пища грешника ⟦кипит в животах как медь⟧ (44:43-46; 37:62-67); питьё — кипяток и гной; еды нет «кроме дари» (колючки) (88:6); «Вкусите же: Мы не прибавим вам ничего, кроме наказания» (78:30).\nВ чём проблема: (1) В 37:63 дерево названо ⟦соблазном (искушением) для обидчиков⟧ — то есть создано, чтобы мучить и испытывать. (2) ⟦Головы дьяволов⟧ — образ существ, которых никто не видел. (3) 78:30 исключает помилование: «ничего, кроме наказания». Сравните 39:53: ⟦Аллах прощает грехи полностью⟧.", "c": null, "x": ["39:53", "6:128"], "t": "Пища и питьё ада", "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. Образы пищи ада не проверяемы."}, {"n": "Что сказано: ⟦Скажи: Истина — от вашего Господа; кто хочет — пусть верует, а кто хочет — пусть не верует. Мы приготовили для неправедных огонь… если они взывают о помощи, им помогут водой, подобной расплавленной меди, она обжигает лица⟧.\nВ чём проблема: в одном аяте провозглашена свобода выбора и обещана пытка за ⟦неправильный⟧ выбор. А в 6:39, 14:4, 76:30 Бог Сам определяет, кто будет верить. Это главное внутреннее противоречие по вопросу свободы воли.", "c": null, "x": ["76:30", "6:39", "14:4"], "refs": ["18:29"], "parts": [{"ref": "18:29", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَقُلِ ٱلْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَآءَ فَلْيُؤْمِن وَمَن شَآءَ فَلْيَكْفُرْ ۚ إِنَّآ أَعْتَدْنَا لِلظَّٰلِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا ۚ وَإِن يَسْتَغِيثُوا۟ يُغَاثُوا۟ بِمَآءٍۢ كَٱلْمُهْلِ يَشْوِى ٱلْوُجُوهَ ۚ بِئْسَ ٱلشَّرَابُ وَسَآءَتْ مُرْتَفَقًا ﴿29﴾", "ru": "И скажи: \"Истина - от вашего Господа: кто хочет, пусть верует, а кто хочет, пусть не верует\". Мы приготовили несправедливым огонь, навес которого окружит их; а если они воззовут о помощи, им помогут водой, подобной расплавленному металлу, которая опаляет лица. Скверно питье, и плохо убежище!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Кто хочет — пусть верует» и угроза огнём рядом с тем, что Бог определяет веру (14:4, 76:30). Это главное напряжение вокруг свободы воли (4:82); верующие отвечают различием «желать» и «одобрять»."}, {"n": "Что сказано: ⟦Погибли руки Абу Лахаба, и погиб он! Не помогло ему его достояние. Он будет гореть в пламенном огне, и жена его — носительница дров; на её шее — верёвка из пальмовых волокон⟧.\nВ чём проблема: сура проклинает конкретных людей по имени (в традиции — дядя и тётка Мухаммада) и заранее называет их судьбу — огонь. Критики: если судьба объявлена заранее, у Абу Лахаба нет шанса уверовать (иначе ⟦пророчество⟧ окажется ложным). Это спорит с 18:29 (⟦кто хочет — пусть верует⟧) и 2:256.\nКак отвечают верующие: Бог знал, что он не уверует, — это предсказание.", "c": "Один из примеров, где конкретные люди проклинаются по имени.", "x": ["18:29", "2:256"], "refs": ["111:1-5"], "parts": [{"ref": "111:1-5", "sura": "Al-Masad", "sura_ar": "سُورَةُ المَسَدِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ تَبَّتْ يَدَآ أَبِى لَهَبٍۢ وَتَبَّ ﴿1﴾ مَآ أَغْنَىٰ عَنْهُ مَالُهُۥ وَمَا كَسَبَ ﴿2﴾ سَيَصْلَىٰ نَارًۭا ذَاتَ لَهَبٍۢ ﴿3﴾ وَٱمْرَأَتُهُۥ حَمَّالَةَ ٱلْحَطَبِ ﴿4﴾ فِى جِيدِهَا حَبْلٌۭ مِّن مَّسَدٍۭ ﴿5﴾", "ru": "(1) Пусть пропадут обе руки Абу Лахаба, а сам он пропал! (2) Не помогло ему его богатство и то, что он приобрел. (3) Будет он гореть в огне с пламенем (4) и жена его (тоже) - носильщица дров, (5) на шее у нее - (только) веревка из пальмовых волокон."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Судьба Абу Лахаба названа заранее, значит, у него нет выбора. Это допущение, не прямой вывод текста."}, {"n": "Что сказано: «Возьмите его и свяжите! Потом в огне адском сожгите! Потом в цепь, длина которой семьдесят локтей, его поместите! Ведь он не верил в Аллаха великого и не побуждал накормить бедняка».\nВ чём проблема: наказание описано как серия: связать — сжечь — заковать. Вина названа двойная: неверие и отсутствие побуждения кормить бедного. Вопрос соразмерности: бездействие по отношению к бедному поставлено рядом с неверием.", "c": null, "x": [], "refs": ["69:30-34"], "parts": [{"ref": "69:30-34", "sura": "Al-Haaqqa", "sura_ar": "سُورَةُ الحَاقَّةِ", "type": "Meccan", "ar": "خُذُوهُ فَغُلُّوهُ ﴿30﴾ ثُمَّ ٱلْجَحِيمَ صَلُّوهُ ﴿31﴾ ثُمَّ فِى سِلْسِلَةٍۢ ذَرْعُهَا سَبْعُونَ ذِرَاعًۭا فَٱسْلُكُوهُ ﴿32﴾ إِنَّهُۥ كَانَ لَا يُؤْمِنُ بِٱللَّهِ ٱلْعَظِيمِ ﴿33﴾ وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ ﴿34﴾", "ru": "(30) \"Возьмите его и свяжите! (31) Потом в огне адском сожгите! (32) Потом в цепь, длина которой семьдесят локтей, его поместите! (33) Ведь он не верил в Аллаха великого, (34) и не побуждал накормить бедняка."}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Вина «не побуждал кормить бедного» поставлена рядом с неверием."}, {"refs": ["8:50", "47:27"], "parts": [{"ref": "8:50", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَلَوْ تَرَىٰٓ إِذْ يَتَوَفَّى ٱلَّذِينَ كَفَرُوا۟ ۙ ٱلْمَلَٰٓئِكَةُ يَضْرِبُونَ وُجُوهَهُمْ وَأَدْبَٰرَهُمْ وَذُوقُوا۟ عَذَابَ ٱلْحَرِيقِ ﴿50﴾", "ru": "Если бы ты видел, как завершают жизнь тех, которые не веровали, ангелы - бьют их по лицу и по спинам: \"Вкусите наказание пожара!\""}, {"ref": "47:27", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "فَكَيْفَ إِذَا تَوَفَّتْهُمُ ٱلْمَلَٰٓئِكَةُ يَضْرِبُونَ وُجُوهَهُمْ وَأَدْبَٰرَهُمْ ﴿27﴾", "ru": "И как же, когда их упокоят ангелы, они будут бить их по лицам и хребтам!"}], "n": "Что сказано: Ангелы при смерти неверных ⟦бьют их по лицам и по спинам⟧ (8:50); «когда их упокоят ангелы, они будут бить их по лицам и хребтам» (47:27).\nВ чём проблема: наказание начинается в момент смерти, до Дня суда, на котором, по другим аятам, решается судьба (напр., 39:68-71). Тогда зачем суд? Традиция объясняет это жизнью в могиле; в Коране этого нет.", "c": null, "x": ["39:68"], "t": "Избиение ангелами в момент смерти", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Наказание в момент смерти, а суд только позже. Объяснения в Коране нет; довод умеренный."}, {"refs": ["73:12-13", "14:49-50", "40:70-72", "25:13-14", "39:16"], "parts": [{"ref": "73:12-13", "sura": "Al-Muzzammil", "sura_ar": "سُورَةُ المُزَّمِّلِ", "type": "Meccan", "ar": "إِنَّ لَدَيْنَآ أَنكَالًۭا وَجَحِيمًۭا ﴿12﴾ وَطَعَامًۭا ذَا غُصَّةٍۢ وَعَذَابًا أَلِيمًۭا ﴿13﴾", "ru": "(12) Поистине, у Нас ведь оковы и огонь, (13) и еда удавляющая, и наказание мучительное"}, {"ref": "14:49-50", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "وَتَرَى ٱلْمُجْرِمِينَ يَوْمَئِذٍۢ مُّقَرَّنِينَ فِى ٱلْأَصْفَادِ ﴿49﴾ سَرَابِيلُهُم مِّن قَطِرَانٍۢ وَتَغْشَىٰ وُجُوهَهُمُ ٱلنَّارُ ﴿50﴾", "ru": "(49) И увидишь ты грешников в тот день, связанных цепями. (50) Одеяние их из смолы, лица их покрывает огонь,"}, {"ref": "40:70-72", "sura": "Ghafir", "sura_ar": "سُورَةُ غَافِرٍ", "type": "Meccan", "ar": "ٱلَّذِينَ كَذَّبُوا۟ بِٱلْكِتَٰبِ وَبِمَآ أَرْسَلْنَا بِهِۦ رُسُلَنَا ۖ فَسَوْفَ يَعْلَمُونَ ﴿70﴾ إِذِ ٱلْأَغْلَٰلُ فِىٓ أَعْنَٰقِهِمْ وَٱلسَّلَٰسِلُ يُسْحَبُونَ ﴿71﴾ فِى ٱلْحَمِيمِ ثُمَّ فِى ٱلنَّارِ يُسْجَرُونَ ﴿72﴾", "ru": "(70) те, которые считают ложью книгу и то, с чем Мы послали Наших посланников, но они узнают, (71) когда оковы у них на шее и путы - их будут влачить (72) в кипяток, а потом в огонь, где их разожгут."}, {"ref": "25:13-14", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "وَإِذَآ أُلْقُوا۟ مِنْهَا مَكَانًۭا ضَيِّقًۭا مُّقَرَّنِينَ دَعَوْا۟ هُنَالِكَ ثُبُورًۭا ﴿13﴾ لَّا تَدْعُوا۟ ٱلْيَوْمَ ثُبُورًۭا وَٰحِدًۭا وَٱدْعُوا۟ ثُبُورًۭا كَثِيرًۭا ﴿14﴾", "ru": "(13) А когда брошены они будут там в место тесное связанными, они призовут там гибель. (14) Не призывайте сегодня одну гибель, а зовите много гибелей!"}, {"ref": "39:16", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "لَهُم مِّن فَوْقِهِمْ ظُلَلٌۭ مِّنَ ٱلنَّارِ وَمِن تَحْتِهِمْ ظُلَلٌۭ ۚ ذَٰلِكَ يُخَوِّفُ ٱللَّهُ بِهِۦ عِبَادَهُۥ ۚ يَٰعِبَادِ فَٱتَّقُونِ ﴿16﴾", "ru": "Для них над ними навесы из огня и под ними навесы\". Этим страшит Аллах Своих рабов; о рабы Мои, бойтесь Меня!"}], "n": "Что сказано: Оковы, огонь, «еда удавляющая» (73:12-13); грешники в цепях, одежда из смолы, лица в огне (14:49-50); цепи на шее, влачение в кипяток, потом сожжение (40:71-72); тесное место, мольба о гибели и ответ «зовите много гибелей» (25:13-14); «над ними навесы из огня и под ними навесы. Этим страшит Аллах Своих рабов» (39:16).\nВ чём проблема: (1) Цель названа прямо — ⟦страшить⟧ (39:16). (2) В 25:14 просьба о смерти отвергнута: избавление недоступно. (3) В 40:70 причина — «считают ложью книгу», то есть отрицание книги наказывается пытками. Критики: это угроза вместо доказательства.", "c": null, "x": ["2:7"], "t": "Цепи, оковы, огненные навесы", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Цель мучений названа «страшить». Этическая претензия."}, {"refs": ["32:13", "11:119", "50:30"], "parts": [{"ref": "32:13", "sura": "As-Sajda", "sura_ar": "سُورَةُ السَّجۡدَةِ", "type": "Meccan", "ar": "وَلَوْ شِئْنَا لَءَاتَيْنَا كُلَّ نَفْسٍ هُدَىٰهَا وَلَٰكِنْ حَقَّ ٱلْقَوْلُ مِنِّى لَأَمْلَأَنَّ جَهَنَّمَ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ أَجْمَعِينَ ﴿13﴾", "ru": "Если бы Мы пожелали, Мы бы всякой душе дали прямой путь, но правдиво было слово Мое: \"Наполню Я геенну гениями и людьми вместе!\""}, {"ref": "11:119", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "إِلَّا مَن رَّحِمَ رَبُّكَ ۚ وَلِذَٰلِكَ خَلَقَهُمْ ۗ وَتَمَّتْ كَلِمَةُ رَبِّكَ لَأَمْلَأَنَّ جَهَنَّمَ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ أَجْمَعِينَ ﴿119﴾", "ru": "кроме тех, кого помиловал твой Господь. Для этого Он их создал. и исполнилось речение Господа твоего: \"Наполню Я геенну духами и людьми вместе\"."}, {"ref": "50:30", "sura": "Qaaf", "sura_ar": "سُورَةُ قٓ", "type": "Meccan", "ar": "يَوْمَ نَقُولُ لِجَهَنَّمَ هَلِ ٱمْتَلَأْتِ وَتَقُولُ هَلْ مِن مَّزِيدٍۢ ﴿30﴾", "ru": "В тот день скажем Мы геенне: \"Полна ли ты стала?\" - и скажет она: \"Нет ли добавки?\""}], "n": "Что сказано: ⟦Если бы Мы пожелали, Мы бы всякой душе дали прямой путь, но правдиво было слово Моё: наполню Я геенну джиннами и людьми вместе⟧ (32:13); «Для этого Он их создал… наполню Я геенну духами и людьми вместе» (11:119); на вопрос «Полна ли ты стала?» геенна отвечает: «Нет ли добавки?» (50:30).\nВ чём проблема: Бог не дал всем прямой путь, потому что заранее решил заполнить ад. В 11:119 сказано «для этого Он их создал». Это спорит с 51:56 (⟦Я создал джиннов и людей только для поклонения Мне⟧) и с 18:29. А в 50:30 ад описан как существо, которому всегда мало.", "c": null, "x": ["51:56", "7:179", "18:29"], "t": "Ад создан, чтобы быть заполненным", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Для этого Он их создал» (11:119) и 51:56 «созданы для поклонения» расходятся. Одна из самых заметных пар по предопределению."}, {"refs": ["15:43-44", "74:26-31", "39:71", "40:76"], "parts": [{"ref": "15:43-44", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "وَإِنَّ جَهَنَّمَ لَمَوْعِدُهُمْ أَجْمَعِينَ ﴿43﴾ لَهَا سَبْعَةُ أَبْوَٰبٍۢ لِّكُلِّ بَابٍۢ مِّنْهُمْ جُزْءٌۭ مَّقْسُومٌ ﴿44﴾", "ru": "(43) и поистине, геенна - место, им назначенное всем! (44) У нее - семь врат, и у каждых врат из них - отдельная часть."}, {"ref": "74:26-31", "sura": "Al-Muddaththir", "sura_ar": "سُورَةُ المُدَّثِّرِ", "type": "Meccan", "ar": "سَأُصْلِيهِ سَقَرَ ﴿26﴾ وَمَآ أَدْرَىٰكَ مَا سَقَرُ ﴿27﴾ لَا تُبْقِى وَلَا تَذَرُ ﴿28﴾ لَوَّاحَةٌۭ لِّلْبَشَرِ ﴿29﴾ عَلَيْهَا تِسْعَةَ عَشَرَ ﴿30﴾ وَمَا جَعَلْنَآ أَصْحَٰبَ ٱلنَّارِ إِلَّا مَلَٰٓئِكَةًۭ ۙ وَمَا جَعَلْنَا عِدَّتَهُمْ إِلَّا فِتْنَةًۭ لِّلَّذِينَ كَفَرُوا۟ لِيَسْتَيْقِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ وَيَزْدَادَ ٱلَّذِينَ ءَامَنُوٓا۟ إِيمَٰنًۭا ۙ وَلَا يَرْتَابَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ وَٱلْمُؤْمِنُونَ ۙ وَلِيَقُولَ ٱلَّذِينَ فِى قُلُوبِهِم مَّرَضٌۭ وَٱلْكَٰفِرُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلًۭا ۚ كَذَٰلِكَ يُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَمَا يَعْلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَ ۚ وَمَا هِىَ إِلَّا ذِكْرَىٰ لِلْبَشَرِ ﴿31﴾", "ru": "(26) Сожгу я его в сакаре! (27) А что даст тебе знать, что такое сакар? (28) Не оставляет он и не покидает - (29) сжигатель кожи. (30) Над ним - девятнадцать. (31) Сделали Мы властителями огня только ангелов и сделали число их только испытанием для тех, которые не веруют, чтобы удостоверились те, кому дана книга, и усилили те, которые веруют, веру. И не сомневались те, кому дана книга, и верующие. И сказали те, в сердцах которых болезнь, и неверующие: \"Что такое хотел Аллах этим, как притчей?\" Так вводит в заблуждение Аллах, кого хочет, и ведет прямым путем, кого хочет, и никто не знает воинств Господа твоего, кроме Него, а это - лишь напоминание людям."}, {"ref": "39:71", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "وَسِيقَ ٱلَّذِينَ كَفَرُوٓا۟ إِلَىٰ جَهَنَّمَ زُمَرًا ۖ حَتَّىٰٓ إِذَا جَآءُوهَا فُتِحَتْ أَبْوَٰبُهَا وَقَالَ لَهُمْ خَزَنَتُهَآ أَلَمْ يَأْتِكُمْ رُسُلٌۭ مِّنكُمْ يَتْلُونَ عَلَيْكُمْ ءَايَٰتِ رَبِّكُمْ وَيُنذِرُونَكُمْ لِقَآءَ يَوْمِكُمْ هَٰذَا ۚ قَالُوا۟ بَلَىٰ وَلَٰكِنْ حَقَّتْ كَلِمَةُ ٱلْعَذَابِ عَلَى ٱلْكَٰفِرِينَ ﴿71﴾", "ru": "И погонят тех, которые не веровали, в геенну толпами; а когда они придут, открыты будут двери ее, и скажут им хранители ее: \"Разве к вам не приходили посланники из вас, которые читали вам знамения вашего Господа и которые предупреждали вас о встрече с этим вашим днем?\" Они сказали: \"Да!\" Но оправдалось слово наказания над неверными!"}, {"ref": "40:76", "sura": "Ghafir", "sura_ar": "سُورَةُ غَافِرٍ", "type": "Meccan", "ar": "ٱدْخُلُوٓا۟ أَبْوَٰبَ جَهَنَّمَ خَٰلِدِينَ فِيهَا ۖ فَبِئْسَ مَثْوَى ٱلْمُتَكَبِّرِينَ ﴿76﴾", "ru": "Входите во врата геенны для вечного пребывания там! Скверно местопребывание превозносящихся!"}], "n": "Что сказано: «У нее — семь врат, и у каждых врат из них — отдельная часть» (15:44). «Над ним — девятнадцать» (74:30). «Сделали Мы властителями огня только ангелов и сделали число их только испытанием для тех, которые не веруют» (74:31). Врата упомянуты и в 39:71 («открыты будут двери ее») и 40:76 («Входите во врата геенны»).\nВ чём проблема: числа в тексте названы, но не объяснены: что значит «семь врат» и «девятнадцать» (стражей), в тексте не сказано, и в 74:31 число названо «испытанием» для неверующих. Прямого противоречия между семью вратами и девятнадцатью стражами нет: это разные вещи. Это пример того, что в Коране заданы числа без пояснения, и это можно ставить в вопрос о ⟦ясности⟧ книги (3:7), но не более. \nКак отвечают верующие: число стражей названо испытанием: смысл в том, чтобы проверить веру, а не в арифметике; о семи вратах толкователи говорят как о разрядах мучений.", "c": null, "x": ["3:7", "74:31"], "t": "Семь врат ада и девятнадцать стражей", "at": "зависит от перевода или толкования", "pw": "слабый", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. «Семь врат» и «девятнадцать» — разные вещи. Числа не объяснены (74:31), но как довод это слабо."}], "summary": ["Главное напряжение: 18:29 и 14:4/76:30 — свобода выбора и пытка за выбор.", "Вечные муки и милосердие (1:3) — вопрос философский.", "Числа (7 врат, 19 стражей) не объяснены и как довод слабые."]}, {"id": "god", "title": "Бог: хитрость, месть, гнев", "icon": "⚡", "group": "Насилие и жестокость", "intro": "Как Коран описывает действия Бога: «хитрость», «козни», ловушки для неверных, истребление целых народов, отсрочка с целью умножить грех. Слово «макр» в арабском может означать и «замысел», поэтому часть переводчиков смягчает; перевод Крачковского передаёт его как «хитрость».", "verses": [{"refs": ["3:54", "8:30", "27:50-51", "86:15-16", "7:182-183", "68:44-45"], "parts": [{"ref": "3:54", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَمَكَرُوا۟ وَمَكَرَ ٱللَّهُ ۖ وَٱللَّهُ خَيْرُ ٱلْمَٰكِرِينَ ﴿54﴾", "ru": "И хитрили они, и хитрил Аллах, а Аллах - лучший из хитрецов."}, {"ref": "8:30", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَإِذْ يَمْكُرُ بِكَ ٱلَّذِينَ كَفَرُوا۟ لِيُثْبِتُوكَ أَوْ يَقْتُلُوكَ أَوْ يُخْرِجُوكَ ۚ وَيَمْكُرُونَ وَيَمْكُرُ ٱللَّهُ ۖ وَٱللَّهُ خَيْرُ ٱلْمَٰكِرِينَ ﴿30﴾", "ru": "Вот ухищряются против тебя те, которые не веруют, чтобы задержать тебя или умертвить, или изгнать. Они ухищряются, и ухищряется Аллах. А ведь Аллах - лучший из ухищряющихся!"}, {"ref": "27:50-51", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "وَمَكَرُوا۟ مَكْرًۭا وَمَكَرْنَا مَكْرًۭا وَهُمْ لَا يَشْعُرُونَ ﴿50﴾ فَٱنظُرْ كَيْفَ كَانَ عَٰقِبَةُ مَكْرِهِمْ أَنَّا دَمَّرْنَٰهُمْ وَقَوْمَهُمْ أَجْمَعِينَ ﴿51﴾", "ru": "(50) Они замышляли хитрость, и Мы замышляли хитрость, а они и не знали. (51) Посмотри же, каков был конец их хитрости! Мы погубили их и их народ - всех."}, {"ref": "86:15-16", "sura": "At-Taariq", "sura_ar": "سُورَةُ الطَّارِقِ", "type": "Meccan", "ar": "إِنَّهُمْ يَكِيدُونَ كَيْدًۭا ﴿15﴾ وَأَكِيدُ كَيْدًۭا ﴿16﴾", "ru": "(15) Они ведь замышляют хитрость. (16) И Я замышляю хитрость."}, {"ref": "7:182-183", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا سَنَسْتَدْرِجُهُم مِّنْ حَيْثُ لَا يَعْلَمُونَ ﴿182﴾ وَأُمْلِى لَهُمْ ۚ إِنَّ كَيْدِى مَتِينٌ ﴿183﴾", "ru": "(182) А тех, которые считали ложью Наши знамения, Мы низведем так, что они не узнают. (183) И Я даю им отсрочку: ведь Моя хитрость - прочна."}, {"ref": "68:44-45", "sura": "Al-Qalam", "sura_ar": "سُورَةُ القَلَمِ", "type": "Meccan", "ar": "فَذَرْنِى وَمَن يُكَذِّبُ بِهَٰذَا ٱلْحَدِيثِ ۖ سَنَسْتَدْرِجُهُم مِّنْ حَيْثُ لَا يَعْلَمُونَ ﴿44﴾ وَأُمْلِى لَهُمْ ۚ إِنَّ كَيْدِى مَتِينٌ ﴿45﴾", "ru": "(44) Оставь же Меня с тем, кто считает ложью этот рассказ; мы постепенно сведем их, так что они не узнают. (45) И отсрочу Я им, но ведь кознь Моя крепка."}], "n": "Что сказано: «И хитрили они, и хитрил Аллах, а Аллах — лучший из хитрецов» (3:54; 8:30); ⟦Они замышляют хитрость, и Я замышляю хитрость⟧ (86:15-16); ⟦Мы низведём их так, что они не узнают. И Я даю им отсрочку: ведь Моя хитрость — прочна⟧ (7:182-183; 68:44-45).\nВ чём проблема: Бог открыто называет Себя ⟦хитрецом⟧ и описывает тайное ведение людей к гибели «так, что они не узнают». Критики: хитрость и обман несовместимы с представлением о высшей праведности.\nКак отвечают верующие: в арабском слово ⟦макр⟧ может значить ⟦замысел, план⟧; другие переводчики выбирают «замышлял». Но Крачковский (и другие) передают его как «хитрость».", "c": null, "x": ["4:142", "2:15"], "t": "Хитрость и козни Бога", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. «Лучший из хитрецов» читается как хитрость или как замысел. Вывод зависит от перевода."}, {"refs": ["4:142", "2:15"], "parts": [{"ref": "4:142", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِنَّ ٱلْمُنَٰفِقِينَ يُخَٰدِعُونَ ٱللَّهَ وَهُوَ خَٰدِعُهُمْ وَإِذَا قَامُوٓا۟ إِلَى ٱلصَّلَوٰةِ قَامُوا۟ كُسَالَىٰ يُرَآءُونَ ٱلنَّاسَ وَلَا يَذْكُرُونَ ٱللَّهَ إِلَّا قَلِيلًۭا ﴿142﴾", "ru": "Поистине, лицемеры пытаются обмануть Аллаха, тогда как Он обманывает их! А когда они встают на молитву, то встают ленивыми, делая вид пред людьми, и вспоминают Аллаха, только мало,"}, {"ref": "2:15", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِى طُغْيَٰنِهِمْ يَعْمَهُونَ ﴿15﴾", "ru": "Аллах поиздевается над ними и усилит их заблуждение, в котором они скитаются слепо!"}], "n": "Что сказано: «Лицемеры пытаются обмануть Аллаха, тогда как Он обманывает их» (4:142); «Аллах поиздевается над ними и усилит их заблуждение, в котором они скитаются слепо» (2:15).\nВ чём проблема: Бог назван обманывающим и издевающимся. В 2:15 Он ещё и ⟦усиливает заблуждение⟧ — то есть увеличивает их вину, чтобы потом наказать; ср. раздел ⟦Предопределение⟧.\nКак отвечают верующие: это ⟦ответное действие⟧ на их обман; слова остаются, но смысл смягчается.", "c": null, "x": ["2:7", "6:110"], "t": "Обман и насмешка", "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. «Обманывает Аллаха, и Он обманет их» — ответная форма."}, {"n": "Что сказано: Неверные не должны считать, что продление жизни им — благо: ⟦Мы продлеваем им только для того, чтобы они умножили грех; им — наказание унизительное⟧ (в переводе Крачковского аят передан сбивчиво).\nВ чём проблема: по тексту Бог продлевает жизнь неверным именно для того, чтобы они совершили больше грехов и получили большее наказание. Вопрос: кто причина греха.", "c": null, "x": ["17:16", "7:182-183"], "refs": ["3:178"], "parts": [{"ref": "3:178", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَلَا يَحْسَبَنَّ ٱلَّذِينَ كَفَرُوٓا۟ أَنَّمَا نُمْلِى لَهُمْ خَيْرٌۭ لِّأَنفُسِهِمْ ۚ إِنَّمَا نُمْلِى لَهُمْ لِيَزْدَادُوٓا۟ إِثْمًۭا ۚ وَلَهُمْ عَذَابٌۭ مُّهِينٌۭ ﴿178﴾", "ru": "И пусть не считают никак те, которые не веровали, что то, что Мы им продлеваем, - во благо для них грехе, и для них - наказание унизительное!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Бог продлевает жизнь неверным, «чтобы они умножили грехи». Это прямо следует из текста; вопрос в том, как согласовать с 18:29."}, {"n": "Что сказано: «Когда Мы желали погубить селение, Мы отдавали приказ одарённым благами в нём, и они творили нечестие там; тогда оправдывалось над ним слово, и уничтожали Мы его совершенно».\nВ чём проблема: Бог желает погубить селение, приказывает богатым, они грешат, и тогда Он разрушает. Получается, что Он Сам запускает грех ради наказания.\nКак отвечают верующие: толкователи читают «приказ» как ⟦увеличил их число⟧ (по другому чтению глагола), что смягчает смысл.", "c": "Критики: Бог сам вызывает грех, чтобы затем наказать. Традиционное объяснение — приказ в смысле ⟦увеличиваем число⟧; смысл спорен.", "x": ["3:178"], "refs": ["17:16"], "parts": [{"ref": "17:16", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "وَإِذَآ أَرَدْنَآ أَن نُّهْلِكَ قَرْيَةً أَمَرْنَا مُتْرَفِيهَا فَفَسَقُوا۟ فِيهَا فَحَقَّ عَلَيْهَا ٱلْقَوْلُ فَدَمَّرْنَٰهَا تَدْمِيرًۭا ﴿16﴾", "ru": "А когда Мы желали погубить селение, Мы отдавали приказ одаренным благами в нем, и они творили нечестие там; тогда оправдывалось над ним слово, и уничтожали Мы его совершенно."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Бог «желает погубить» селение, затем наказывает. Смысл «приказали» спорен; довод умеренный."}, {"refs": ["11:102", "29:40", "91:14-15"], "parts": [{"ref": "11:102", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "وَكَذَٰلِكَ أَخْذُ رَبِّكَ إِذَآ أَخَذَ ٱلْقُرَىٰ وَهِىَ ظَٰلِمَةٌ ۚ إِنَّ أَخْذَهُۥٓ أَلِيمٌۭ شَدِيدٌ ﴿102﴾", "ru": "Такова хватка твоего Господа, когда Он схватил селения, которые были неправедны. Поистине, хватка Его мучительна, сильна!"}, {"ref": "29:40", "sura": "Al-Ankaboot", "sura_ar": "سُورَةُ العَنكَبُوتِ", "type": "Meccan", "ar": "فَكُلًّا أَخَذْنَا بِذَنۢبِهِۦ ۖ فَمِنْهُم مَّنْ أَرْسَلْنَا عَلَيْهِ حَاصِبًۭا وَمِنْهُم مَّنْ أَخَذَتْهُ ٱلصَّيْحَةُ وَمِنْهُم مَّنْ خَسَفْنَا بِهِ ٱلْأَرْضَ وَمِنْهُم مَّنْ أَغْرَقْنَا ۚ وَمَا كَانَ ٱللَّهُ لِيَظْلِمَهُمْ وَلَٰكِن كَانُوٓا۟ أَنفُسَهُمْ يَظْلِمُونَ ﴿40﴾", "ru": "И всех Мы взяли за их грех: на некоторых из них Мы послали вихрь, некоторых постиг вопль, некоторых из них Мы заставили поглотить землю, некоторых Мы потопили. Аллах не был таким, чтобы их тиранить, но они сами себя тиранили!"}, {"ref": "91:14-15", "sura": "Ash-Shams", "sura_ar": "سُورَةُ الشَّمۡسِ", "type": "Meccan", "ar": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا ﴿14﴾ وَلَا يَخَافُ عُقْبَٰهَا ﴿15﴾", "ru": "(14) И сочли они его лжецом и подрезали ее, и истребил их Господь их за их прегрешение и уравнял это, (15) не страшась последствий этого."}], "n": "Что сказано: «Такова хватка твоего Господа, когда Он схватил селения, которые были неправедны» (11:102); одних Он погубил вихрем, других — воплем, третьих — поглощением землёй, четвёртых — потопом (29:40); народ Самуд ⟦истреблён⟧, «не страшась последствий» (91:14-15).\nВ чём проблема: массовые казни целых народов, в которых были дети и невиновные (Коран не оговаривает их исключение). Принцип личной ответственности (6:164) здесь не соблюдён; в 91:15 Бог описан как ⟦не страшащийся последствий⟧. Народ Самуд уничтожен за убийство верблюдицы.\nКак отвечают верующие: это наказание за упорное отрицание после предупреждения посланником.", "c": null, "x": ["6:164"], "t": "Истребление целых народов", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Истребление народов без оговорки о невиновных. Этическая претензия."}], "summary": ["«Хитрость» Бога — вопрос перевода слова «макр».", "Продление жизни неверным ради грехов (3:178) — довод опирается на текст."]}, {"id": "fate", "title": "Предопределение и запечатанные сердца", "icon": "⛓", "group": "Насилие и жестокость", "intro": "Аяты, где Бог сам вводит людей в заблуждение, «запечатывает» их сердца и создаёт для геенны — а затем наказывает за неверие. Они противоречат свободе выбора (18:29, 76:3) и логике наказания.", "verses": [{"refs": ["2:6-7", "6:25", "36:8-10", "45:23", "4:155", "6:110"], "parts": [{"ref": "2:6-7", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ سَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ ﴿6﴾ خَتَمَ ٱللَّهُ عَلَىٰ قُلُوبِهِمْ وَعَلَىٰ سَمْعِهِمْ ۖ وَعَلَىٰٓ أَبْصَٰرِهِمْ غِشَٰوَةٌۭ ۖ وَلَهُمْ عَذَابٌ عَظِيمٌۭ ﴿7﴾", "ru": "(6) Поистине, те, которые не уверовали, - все равно им, увещевал ты их или не увещевал, - они не веруют. (7) Наложил печать Аллах на сердца их и на слух, а на взорах их - завеса. Для них - великое наказание!"}, {"ref": "6:25", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَمِنْهُم مَّن يَسْتَمِعُ إِلَيْكَ ۖ وَجَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَن يَفْقَهُوهُ وَفِىٓ ءَاذَانِهِمْ وَقْرًۭا ۚ وَإِن يَرَوْا۟ كُلَّ ءَايَةٍۢ لَّا يُؤْمِنُوا۟ بِهَا ۚ حَتَّىٰٓ إِذَا جَآءُوكَ يُجَٰدِلُونَكَ يَقُولُ ٱلَّذِينَ كَفَرُوٓا۟ إِنْ هَٰذَآ إِلَّآ أَسَٰطِيرُ ٱلْأَوَّلِينَ ﴿25﴾", "ru": "Среди них есть такие, что прислушиваются к тебе, но Мы положили на сердца их покровы, чтобы они не поняли его, а в уши их - глухоту. Хотя они и не видят всякое знамение, но не верят в него. А когда они приходят к тебе, препираются, то говорят те, которые не веровали: \"Это - только сказки первых!\""}, {"ref": "36:8-10", "sura": "Yaseen", "sura_ar": "سُورَةُ يسٓ", "type": "Meccan", "ar": "إِنَّا جَعَلْنَا فِىٓ أَعْنَٰقِهِمْ أَغْلَٰلًۭا فَهِىَ إِلَى ٱلْأَذْقَانِ فَهُم مُّقْمَحُونَ ﴿8﴾ وَجَعَلْنَا مِنۢ بَيْنِ أَيْدِيهِمْ سَدًّۭا وَمِنْ خَلْفِهِمْ سَدًّۭا فَأَغْشَيْنَٰهُمْ فَهُمْ لَا يُبْصِرُونَ ﴿9﴾ وَسَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ ﴿10﴾", "ru": "(8) Мы поместили на шее у них оковы до подбородка, и они вынуждены поднять головы. (9) Мы устроили перед ними преграду и позади их преграду и закрыли их, и они не видят. (10) И одинаково для них, увещаешь ты их или не увещаешь: они не веруют."}, {"ref": "45:23", "sura": "Al-Jaathiya", "sura_ar": "سُورَةُ الجَاثِيَةِ", "type": "Meccan", "ar": "أَفَرَءَيْتَ مَنِ ٱتَّخَذَ إِلَٰهَهُۥ هَوَىٰهُ وَأَضَلَّهُ ٱللَّهُ عَلَىٰ عِلْمٍۢ وَخَتَمَ عَلَىٰ سَمْعِهِۦ وَقَلْبِهِۦ وَجَعَلَ عَلَىٰ بَصَرِهِۦ غِشَٰوَةًۭ فَمَن يَهْدِيهِ مِنۢ بَعْدِ ٱللَّهِ ۚ أَفَلَا تَذَكَّرُونَ ﴿23﴾", "ru": "Разве ты не видел того, кто взял своим богом страсть, и Аллах сбил его с пути при Своем знании и положил печать на его слух и сердце, а на его зрение положил завесу. Кто же его поведет после Аллаха? Разве вы не опомнитесь?"}, {"ref": "4:155", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "فَبِمَا نَقْضِهِم مِّيثَٰقَهُمْ وَكُفْرِهِم بِـَٔايَٰتِ ٱللَّهِ وَقَتْلِهِمُ ٱلْأَنۢبِيَآءَ بِغَيْرِ حَقٍّۢ وَقَوْلِهِمْ قُلُوبُنَا غُلْفٌۢ ۚ بَلْ طَبَعَ ٱللَّهُ عَلَيْهَا بِكُفْرِهِمْ فَلَا يُؤْمِنُونَ إِلَّا قَلِيلًۭا ﴿155﴾", "ru": "И за то, что они нарушили их завет, и не веровали в знамения Аллаха и избивали пророков без права, и говорили: \"Сердца наши не обрезаны\". (Нет! Аллах наложил печать на них за их неверие, и веруют они только мало),"}, {"ref": "6:110", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَنُقَلِّبُ أَفْـِٔدَتَهُمْ وَأَبْصَٰرَهُمْ كَمَا لَمْ يُؤْمِنُوا۟ بِهِۦٓ أَوَّلَ مَرَّةٍۢ وَنَذَرُهُمْ فِى طُغْيَٰنِهِمْ يَعْمَهُونَ ﴿110﴾", "ru": "И Мы переворачиваем сердца их и взоры, как они не уверовали в это в первый раз, и оставляем их скитаться слепо в своем заблуждении."}], "n": "Что сказано: «Наложил печать Аллах на сердца их и на слух, а на взорах их — завеса» (2:7); «Мы положили на сердца их покровы, чтобы они не поняли его» (6:25); оковы на шеях, преграда спереди и сзади: «одинаково для них, увещаешь ты их или не увещаешь: они не веруют» (36:8-10); «Аллах сбил его с пути при Своём знании и положил печать на его слух и сердце» (45:23); «Мы переворачиваем сердца их и взоры» (6:110).\nВ чём проблема: если Бог Сам лишает человека способности понять и уверовать, то наказание за неверие несправедливо. В 4:155 печать названа следствием («за их неверие»), а в 6:25 и 45:23 — причиной: что от чего зависит, неясно. В Коране есть и противоположные аяты — свобода выбора: 18:29 (⟦кто хочет — пусть верует⟧), 2:286 (⟦Аллах не возлагает на душу ничего, кроме возможного для неё⟧), 4:79 (⟦что дурное — от самого себя⟧), 41:46 (⟦твой Господь не обидчик для рабов⟧).\nКак отвечают верующие: мусульманские богословы предложили теории ⟦приобретения⟧ (человек ⟦приобретает⟧ действие, которое создаёт Бог) и др.; в самом тексте решения нет.", "c": null, "x": ["18:29", "2:286", "4:79", "41:46"], "t": "Бог запечатывает сердца", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Бог запечатывает сердца неверных, а потом их наказывает. В 4:155 печать названа следствием, в 6:25 причиной. Главное напряжение по свободе воли; верующие отвечают различием «желать» и «одобрять»."}, {"refs": ["2:26", "4:88", "6:39", "6:125", "14:4", "16:93", "10:99-100", "11:34"], "parts": [{"ref": "2:26", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "۞ إِنَّ ٱللَّهَ لَا يَسْتَحْىِۦٓ أَن يَضْرِبَ مَثَلًۭا مَّا بَعُوضَةًۭ فَمَا فَوْقَهَا ۚ فَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ فَيَعْلَمُونَ أَنَّهُ ٱلْحَقُّ مِن رَّبِّهِمْ ۖ وَأَمَّا ٱلَّذِينَ كَفَرُوا۟ فَيَقُولُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلًۭا ۘ يُضِلُّ بِهِۦ كَثِيرًۭا وَيَهْدِى بِهِۦ كَثِيرًۭا ۚ وَمَا يُضِلُّ بِهِۦٓ إِلَّا ٱلْفَٰسِقِينَ ﴿26﴾", "ru": "Поистине, Аллах не смущается приводить некоей притчей комара и то, что больше этого. А те, которые веровали, знают, что это - истина от их Господа. Те же, которые неверны, скажут: \"Что желает Аллах этим, как притчей?\" Он вводит этим в заблуждение многих и ведет прямым путем многих. Но сбивает Он этим только распутных,"}, {"ref": "4:88", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "۞ فَمَا لَكُمْ فِى ٱلْمُنَٰفِقِينَ فِئَتَيْنِ وَٱللَّهُ أَرْكَسَهُم بِمَا كَسَبُوٓا۟ ۚ أَتُرِيدُونَ أَن تَهْدُوا۟ مَنْ أَضَلَّ ٱللَّهُ ۖ وَمَن يُضْلِلِ ٱللَّهُ فَلَن تَجِدَ لَهُۥ سَبِيلًۭا ﴿88﴾", "ru": "Почему же вы в отношении лицемеров - две партии? Аллах низверг их за то, что они приобрели. Не хотите ли вы вывести на прямой путь тех, кого сбил Аллах? Ведь, если кого Аллах сбил, для того не найдешь дороги!"}, {"ref": "6:39", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا صُمٌّۭ وَبُكْمٌۭ فِى ٱلظُّلُمَٰتِ ۗ مَن يَشَإِ ٱللَّهُ يُضْلِلْهُ وَمَن يَشَأْ يَجْعَلْهُ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ ﴿39﴾", "ru": "А те, которые считали ложью Наши знамения, - гл
