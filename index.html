<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Критический доклад о Коране — по разделам</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3dfd6;--accent:#8a2b1f;--quote:#fbf8f1;--side:#efebe2}
[data-theme=dark]{--bg:#141416;--panel:#1c1c20;--ink:#ececee;--mute:#9a9aa3;--line:#2c2c33;--accent:#e08a74;--quote:#222228;--side:#18181b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Georgia,"Times New Roman",serif}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;font-family:system-ui,Segoe UI,Arial,sans-serif}
aside h1{font:700 15px/1.3 system-ui;margin:0 6px 4px;letter-spacing:.3px}
aside .sub{margin:0 6px 14px;color:var(--mute);font-size:12.5px}
nav button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:8px;font:500 14px system-ui;cursor:pointer}
nav button:hover{background:rgba(128,128,128,.14)}
nav button.on{background:var(--accent);color:#fff}
[data-theme=dark] nav button.on{color:#141416}
.gh{margin:14px 10px 4px;font:700 11px system-ui;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
nav .ic{width:22px;text-align:center;font-size:16px}
nav .ct{margin-left:auto;font-size:12px;opacity:.7}
.tools{margin:16px 6px 0;display:grid;gap:8px;font:13px system-ui}
.tools label{display:flex;gap:8px;align-items:center;cursor:pointer}
main{padding:34px clamp(16px,4vw,56px) 80px;max-width:980px;width:100%}
h2{font:700 30px/1.2 Georgia,serif;margin:0 0 8px}
.intro{color:var(--mute);margin:0 0 22px;max-width:70ch;border-left:3px solid var(--accent);padding-left:14px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:15px system-ui;margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ref{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;font:600 14px system-ui;margin-bottom:10px}
.ref .r{color:var(--accent);font-size:16px}
.ref .s{color:var(--mute);font-weight:400}
.ref .tag{margin-left:auto;font:11px system-ui;border:1px solid var(--line);padding:2px 8px;border-radius:99px;color:var(--mute)}
.ar{direction:rtl;text-align:right;font:26px/2.1 "Amiri","Scheherazade New","Traditional Arabic","Noto Naskh Arabic","Segoe UI",serif;background:var(--quote);border-radius:10px;padding:10px 16px;margin:0 0 10px}
.ru{background:var(--quote);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 16px;margin:0 0 12px;font-size:17.5px;font-style:italic}
.n{margin:0 0 6px}
.n b,.c b{font:700 11.5px system-ui;text-transform:uppercase;letter-spacing:.5px;display:block}
.n b{color:var(--accent)}
.c{margin:8px 0 0;color:var(--mute);font-size:14.5px;border-top:1px dashed var(--line);padding-top:8px}
.copy{border:1px solid var(--line);background:none;color:var(--mute);font:12px system-ui;padding:2px 8px;border-radius:6px;cursor:pointer}
.copy:hover{color:var(--ink)}
.hide-ar .ar{display:none}.hide-c .c{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:22px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:system-ui}
.tile:hover{border-color:var(--accent)}
.tile .big{font-size:26px}
.tile .t{font-weight:700;margin:4px 0 2px}.tile .k{color:var(--mute);font-size:13px}
.gtitle{font:700 14px system-ui;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin:26px 0 0}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:0 0 16px;font-size:15px}
.note h3{margin:0 0 6px;font:700 15px system-ui}
.note ul{margin:6px 0 0 18px;padding:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px;font-family:system-ui}
.pager button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;font:14px system-ui}
.menu{display:none}
mark{background:#ffe27a;color:#000;padding:0 2px;border-radius:3px}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;inset:0 25% 0 0;z-index:5;height:100vh;transform:translateX(-100%);transition:.2s;box-shadow:4px 0 20px rgba(0,0,0,.3)}
 aside.open{transform:none}
 .menu{display:block;position:sticky;top:0;z-index:4;width:100%;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px system-ui;text-align:left}
 .ar{font-size:22px}
}
@media print{aside,.menu,.search,.pager,.copy{display:none!important}.app{display:block}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<button class="menu" id="menu">☰ Разделы</button>
<div class="app">
<aside id="side">
  <h1>Критический доклад о Коране</h1>
  <p class="sub">Только текст Корана. Дословные аяты по темам</p>
  <nav id="nav"></nav>
  <div class="tools">
    <label><input type="checkbox" id="tAr" checked> Арабский оригинал</label>
    <label><input type="checkbox" id="tC" checked> Контекст / как объясняют</label>
    <label><input type="checkbox" id="tTheme"> Тёмная тема</label>
  </div>
</aside>
<main id="main"></main>
</div>
<script>
const DATA = [{"id": "violence", "title": "Война и насилие против неверных", "icon": "⚔", "group": "Насилие и жестокость", "intro": "Аяты, которые содержат прямые призывы убивать, сражаться и устрашать противников. Большинство относится к мединскому периоду (после 622 г.), когда община Мухаммада вела военные действия. Обратите внимание на формулы, не привязанные к конкретному событию в самом тексте («где бы ни нашли», «пока не исчезнет смута»).", "verses": [{"ref": "2:191", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْ وَأَخْرِجُوهُم مِّنْ حَيْثُ أَخْرَجُوكُمْ ۚ وَٱلْفِتْنَةُ أَشَدُّ مِنَ ٱلْقَتْلِ ۚ وَلَا تُقَٰتِلُوهُمْ عِندَ ٱلْمَسْجِدِ ٱلْحَرَامِ حَتَّىٰ يُقَٰتِلُوكُمْ فِيهِ ۖ فَإِن قَٰتَلُوكُمْ فَٱقْتُلُوهُمْ ۗ كَذَٰلِكَ جَزَآءُ ٱلْكَٰفِرِينَ ﴿191﴾", "ru": "И убивайте их, где встретите, и изгоняйте их оттуда, откуда они изгнали вас: ведь соблазн - хуже, чем убиение! И не сражайтесь с ними у запретной мечети, пока они не станут сражаться там с вами. Если же они будут сражаться с вами, то убивайте их: таково воздаяние неверных!", "n": "Приказ убивать противников где бы вы их ни встретили и изгонять. Сама формулировка в тексте не ограничена конкретным сражением.", "c": "Контекст — конфликт с курайшитами; соседние аяты 2:190 и 2:192–193 ограничивают: сражаться с теми, кто сражается."}, {"ref": "2:216", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "كُتِبَ عَلَيْكُمُ ٱلْقِتَالُ وَهُوَ كُرْهٌۭ لَّكُمْ ۖ وَعَسَىٰٓ أَن تَكْرَهُوا۟ شَيْـًۭٔا وَهُوَ خَيْرٌۭ لَّكُمْ ۖ وَعَسَىٰٓ أَن تُحِبُّوا۟ شَيْـًۭٔا وَهُوَ شَرٌّۭ لَّكُمْ ۗ وَٱللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ ﴿216﴾", "ru": "Предписано вам сражение, а оно ненавистно для вас. И может быть, вы ненавидите что-нибудь, а оно для вас благо, и может быть, вы любите что-нибудь, а оно для вас зло, - поистине, Аллах знает, а вы не знаете!", "n": "Война объявлена предписанной (обязательной), а нелюбовь к ней названа ошибкой самих верующих.", "c": "Многие толкователи относят к конкретной обороне общины; другие видят в нём общий принцип джихада."}, {"ref": "8:12", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "إِذْ يُوحِى رَبُّكَ إِلَى ٱلْمَلَٰٓئِكَةِ أَنِّى مَعَكُمْ فَثَبِّتُوا۟ ٱلَّذِينَ ءَامَنُوا۟ ۚ سَأُلْقِى فِى قُلُوبِ ٱلَّذِينَ كَفَرُوا۟ ٱلرُّعْبَ فَٱضْرِبُوا۟ فَوْقَ ٱلْأَعْنَاقِ وَٱضْرِبُوا۟ مِنْهُمْ كُلَّ بَنَانٍۢ ﴿12﴾", "ru": "Вот внушил Господь твой ангелам: \"Я - с вами, укрепите тех, которые уверовали! Я брошу в сердца тех, которые не веровали, страх; бейте же их по шеям, бейте их по всем пальцам!\"", "n": "Бог внушает ужас неверным; ангелам и верующим приказано бить по шеям и по всем пальцам.", "c": "Описание битвы при Бадре (624 г.)."}, {"ref": "8:39", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَقَٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌۭ وَيَكُونَ ٱلدِّينُ كُلُّهُۥ لِلَّهِ ۚ فَإِنِ ٱنتَهَوْا۟ فَإِنَّ ٱللَّهَ بِمَا يَعْمَلُونَ بَصِيرٌۭ ﴿39﴾", "ru": "И сражайтесь с ними, пока не будет искушения, и религия вся будет принадлежать Аллаху\". А если они удержатся... ведь Аллах видит то, что они делают!", "n": "Сражаться, пока не исчезнет смута и вся религия не будет принадлежать Аллаху — цель войны сформулирована как господство одной религии.", "c": "Часть толкователей понимает смуту (фитна) как гонения на мусульман; классическое право использовало аят как основание наступательного джихада."}, {"ref": "8:60", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَأَعِدُّوا۟ لَهُم مَّا ٱسْتَطَعْتُم مِّن قُوَّةٍۢ وَمِن رِّبَاطِ ٱلْخَيْلِ تُرْهِبُونَ بِهِۦ عَدُوَّ ٱللَّهِ وَعَدُوَّكُمْ وَءَاخَرِينَ مِن دُونِهِمْ لَا تَعْلَمُونَهُمُ ٱللَّهُ يَعْلَمُهُمْ ۚ وَمَا تُنفِقُوا۟ مِن شَىْءٍۢ فِى سَبِيلِ ٱللَّهِ يُوَفَّ إِلَيْكُمْ وَأَنتُمْ لَا تُظْلَمُونَ ﴿60﴾", "ru": "И приготовьте для них, сколько можете, силы и отрядов конницы; ими вы устрашите врага Аллаха, и вашего врага, и других, помимо них; вы их не знаете, Аллах знает их. И что бы вы ни издержали на пути Аллаха, будет полностью возмещено вам, и вы не будете обижены.", "n": "Приказ готовить силу, чтобы устрашать врагов.", "c": null}, {"ref": "9:5", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "فَإِذَا ٱنسَلَخَ ٱلْأَشْهُرُ ٱلْحُرُمُ فَٱقْتُلُوا۟ ٱلْمُشْرِكِينَ حَيْثُ وَجَدتُّمُوهُمْ وَخُذُوهُمْ وَٱحْصُرُوهُمْ وَٱقْعُدُوا۟ لَهُمْ كُلَّ مَرْصَدٍۢ ۚ فَإِن تَابُوا۟ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَءَاتَوُا۟ ٱلزَّكَوٰةَ فَخَلُّوا۟ سَبِيلَهُمْ ۚ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ ﴿5﴾", "ru": "А когда кончатся месяцы запретные, то избивайте многобожников, где их найдете, захватывайте их, осаждайте, устраивайте засаду против них во всяком скрытом месте! Если они обратились и выполняли молитву и давали очищение, то освободите им дорогу: ведь Аллах - прощающий, милосердный!", "n": "Так называемый аят меча: убивать многобожников, где бы ни нашли, брать в плен, устраивать засады — пока не примут намаз и закят. Классические комментаторы (напр., ат-Табари) считали, что он отменяет множество более мягких аятов.", "c": "Апологеты указывают на 9:4 и 9:6 (договорники не затрагиваются, просящим защиты — убежище) и на конкретное нарушение договоров арабскими племенами."}, {"ref": "9:29", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "قَٰتِلُوا۟ ٱلَّذِينَ لَا يُؤْمِنُونَ بِٱللَّهِ وَلَا بِٱلْيَوْمِ ٱلْءَاخِرِ وَلَا يُحَرِّمُونَ مَا حَرَّمَ ٱللَّهُ وَرَسُولُهُۥ وَلَا يَدِينُونَ دِينَ ٱلْحَقِّ مِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ حَتَّىٰ يُعْطُوا۟ ٱلْجِزْيَةَ عَن يَدٍۢ وَهُمْ صَٰغِرُونَ ﴿29﴾", "ru": "Сражайтесь с теми, кто не верует в Аллаха и в последний день, не запрещает того, что запретил Аллах и Его посланник, и не подчиняется религии истинной - из тех, которым ниспослано писание, пока они не дадут откупа своей рукой, будучи униженными.", "n": "Сражаться с людьми Писания (христианами и иудеями), пока они не дадут джизью собственноручно, будучи униженными.", "c": "Классическое право: налог в обмен на защиту и право сохранять веру; формулировка об унижении трактовалась по-разному."}, {"ref": "9:73", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ جَٰهِدِ ٱلْكُفَّارَ وَٱلْمُنَٰفِقِينَ وَٱغْلُظْ عَلَيْهِمْ ۚ وَمَأْوَىٰهُمْ جَهَنَّمُ ۖ وَبِئْسَ ٱلْمَصِيرُ ﴿73﴾", "ru": "О пророк! Борись с неверными и лицемерами и будь жесток к ним. Их убежище - геенна, и скверно это возвращение!", "n": "Пророку приказано вести борьбу с неверными и лицемерами и быть к ним суровым. Аят повторён почти дословно в 66:9.", "c": null}, {"ref": "9:123", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ قَٰتِلُوا۟ ٱلَّذِينَ يَلُونَكُم مِّنَ ٱلْكُفَّارِ وَلْيَجِدُوا۟ فِيكُمْ غِلْظَةًۭ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ مَعَ ٱلْمُتَّقِينَ ﴿123﴾", "ru": "О вы, которые уверовали! Сражайтесь с теми из неверных, которые близки к вам. И пусть они найдут в вас суровость. И знайте, что Аллах - с богобоязненными!", "n": "Приказ сражаться с неверными, которые рядом с вами, и проявлять к ним «суровость».", "c": "Контекст — расширение границ и подавление соседних племён."}, {"ref": "47:4", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "فَإِذَا لَقِيتُمُ ٱلَّذِينَ كَفَرُوا۟ فَضَرْبَ ٱلرِّقَابِ حَتَّىٰٓ إِذَآ أَثْخَنتُمُوهُمْ فَشُدُّوا۟ ٱلْوَثَاقَ فَإِمَّا مَنًّۢا بَعْدُ وَإِمَّا فِدَآءً حَتَّىٰ تَضَعَ ٱلْحَرْبُ أَوْزَارَهَا ۚ ذَٰلِكَ وَلَوْ يَشَآءُ ٱللَّهُ لَٱنتَصَرَ مِنْهُمْ وَلَٰكِن لِّيَبْلُوَا۟ بَعْضَكُم بِبَعْضٍۢ ۗ وَٱلَّذِينَ قُتِلُوا۟ فِى سَبِيلِ ٱللَّهِ فَلَن يُضِلَّ أَعْمَٰلَهُمْ ﴿4﴾", "ru": "А когда вы встретите тех, которые не уверовали, то - удар мечом по шее; а когда произведете великое избиение их, то укрепляйте узы. Либо милость потом, либо выкуп, пока война не сложит своих нош. Так! А если бы пожелал Аллах, Он помог бы Себе против них, но (это для того,) чтобы одних испытать другими. А у тех, которые убиты на пути Аллаха, - никогда Он не собьет с пути их деяний:", "n": "При встрече с неверными — по шеям; пока не подавят их, затем пленение и выкуп.", "c": "Описание правил войны в раннем мединском обществе."}, {"ref": "4:89", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَدُّوا۟ لَوْ تَكْفُرُونَ كَمَا كَفَرُوا۟ فَتَكُونُونَ سَوَآءًۭ ۖ فَلَا تَتَّخِذُوا۟ مِنْهُمْ أَوْلِيَآءَ حَتَّىٰ يُهَاجِرُوا۟ فِى سَبِيلِ ٱللَّهِ ۚ فَإِن تَوَلَّوْا۟ فَخُذُوهُمْ وَٱقْتُلُوهُمْ حَيْثُ وَجَدتُّمُوهُمْ ۖ وَلَا تَتَّخِذُوا۟ مِنْهُمْ وَلِيًّۭا وَلَا نَصِيرًا ﴿89﴾", "ru": "Они хотели бы, чтобы вы оказались неверными, как были неверными они, и вы бы оказались одинаковыми. Не берите же из них друзей, пока не выселятся по пути Аллаха; если же они отвратятся, то схватывайте их и убивайте, где бы ни нашли их. И не берите из них ни друзей, ни помощников,", "n": "Против тех, кто отвернётся (по традиции — отступников): хватайте их и убивайте, где найдёте.", "c": "Классическое право на основании этого аята предписывает казнь за вероотступничество; современные богословы спорят о границах (отступники-предатели против обычных отступников)."}, {"ref": "33:61", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "مَّلْعُونِينَ ۖ أَيْنَمَا ثُقِفُوٓا۟ أُخِذُوا۟ وَقُتِّلُوا۟ تَقْتِيلًۭا ﴿61﴾", "ru": "проклятыми. Где они не будут встречены, они будут схвачены и перебиты избиением,", "n": "О лицемерах: где бы их ни нашли, будут схвачены и убиты безжалостно.", "c": null}, {"ref": "9:111", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "۞ إِنَّ ٱللَّهَ ٱشْتَرَىٰ مِنَ ٱلْمُؤْمِنِينَ أَنفُسَهُمْ وَأَمْوَٰلَهُم بِأَنَّ لَهُمُ ٱلْجَنَّةَ ۚ يُقَٰتِلُونَ فِى سَبِيلِ ٱللَّهِ فَيَقْتُلُونَ وَيُقْتَلُونَ ۖ وَعْدًا عَلَيْهِ حَقًّۭا فِى ٱلتَّوْرَىٰةِ وَٱلْإِنجِيلِ وَٱلْقُرْءَانِ ۚ وَمَنْ أَوْفَىٰ بِعَهْدِهِۦ مِنَ ٱللَّهِ ۚ فَٱسْتَبْشِرُوا۟ بِبَيْعِكُمُ ٱلَّذِى بَايَعْتُم بِهِۦ ۚ وَذَٰلِكَ هُوَ ٱلْفَوْزُ ٱلْعَظِيمُ ﴿111﴾", "ru": "Поистине, Аллах купил у верующих их души и их достояние за то, что им - рай! Они сражаются на пути Аллаха, убивают и бывают убиты, согласно обещанию от Него истинному в Торе, Евангелии и Коране. Кто же более верен в своем завете, чем Аллах? Радуйтесь же своей торговле, которую вы заключили с Ним! Это ведь - великий успех!", "n": "Бог «купил» у верующих их души и имущество за рай; «они сражаются на пути Аллаха, убивают и бывают убиты».", "c": null}, {"ref": "2:193", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَقَٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌۭ وَيَكُونَ ٱلدِّينُ لِلَّهِ ۖ فَإِنِ ٱنتَهَوْا۟ فَلَا عُدْوَٰنَ إِلَّا عَلَى ٱلظَّٰلِمِينَ ﴿193﴾", "ru": "И сражайтесь с ними, пока не будет больше искушения, а (вся) религия будет принадлежать Аллаху. А если они удержатся, то нет вражды, кроме как к неправедным!", "n": "Цель войны сформулирована как «пока не будет больше искушения, а вся религия будет принадлежать Аллаху» — дословно как в 8:39.", "c": null}, {"ref": "4:76", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "ٱلَّذِينَ ءَامَنُوا۟ يُقَٰتِلُونَ فِى سَبِيلِ ٱللَّهِ ۖ وَٱلَّذِينَ كَفَرُوا۟ يُقَٰتِلُونَ فِى سَبِيلِ ٱلطَّٰغُوتِ فَقَٰتِلُوٓا۟ أَوْلِيَآءَ ٱلشَّيْطَٰنِ ۖ إِنَّ كَيْدَ ٱلشَّيْطَٰنِ كَانَ ضَعِيفًا ﴿76﴾", "ru": "Те, которые уверовали, сражаются на пути Аллаха, а те, которые не веруют, сражаются на пути тагута. Сражайтесь же с друзьями сатаны; ведь козни сатаны слабы!", "n": "Верующие сражаются «на пути Аллаха», неверные — «на пути тагута»; приказ: «Сражайтесь же с друзьями сатаны».", "c": null}, {"ref": "4:91", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "سَتَجِدُونَ ءَاخَرِينَ يُرِيدُونَ أَن يَأْمَنُوكُمْ وَيَأْمَنُوا۟ قَوْمَهُمْ كُلَّ مَا رُدُّوٓا۟ إِلَى ٱلْفِتْنَةِ أُرْكِسُوا۟ فِيهَا ۚ فَإِن لَّمْ يَعْتَزِلُوكُمْ وَيُلْقُوٓا۟ إِلَيْكُمُ ٱلسَّلَمَ وَيَكُفُّوٓا۟ أَيْدِيَهُمْ فَخُذُوهُمْ وَٱقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْ ۚ وَأُو۟لَٰٓئِكُمْ جَعَلْنَا لَكُمْ عَلَيْهِمْ سُلْطَٰنًۭا مُّبِينًۭا ﴿91﴾", "ru": "Вы найдете других, которые захотят быть верными вам и верными своему народу. Всякий раз как их повернут к мятежу, они будут ввергнуты туда. И если они не отойдут от вас, и не предложат вам мира, и не удержат своих рук, то берите их и избивайте, где бы ни встречали вы их. Над этими Мы дали вам явную власть!", "n": "О тех, кто не предлагает мира и не удерживает рук: «берите их и избивайте, где бы ни встречали вы их».", "c": null}, {"ref": "8:17", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "فَلَمْ تَقْتُلُوهُمْ وَلَٰكِنَّ ٱللَّهَ قَتَلَهُمْ ۚ وَمَا رَمَيْتَ إِذْ رَمَيْتَ وَلَٰكِنَّ ٱللَّهَ رَمَىٰ ۚ وَلِيُبْلِىَ ٱلْمُؤْمِنِينَ مِنْهُ بَلَآءً حَسَنًا ۚ إِنَّ ٱللَّهَ سَمِيعٌ عَلِيمٌۭ ﴿17﴾", "ru": "Не вы их убивали, но Аллах убивал их, и не ты бросил, когда бросил, но Аллах бросил, чтобы испытать верующих хорошим испытанием от Него. Поистине, Аллах - слышащий, сведущий!", "n": "«Не вы их убивали, но Аллах убивал их»: убийство в бою приписано Богу — снимает вопрос о личной ответственности.", "c": null}, {"ref": "8:57", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "فَإِمَّا تَثْقَفَنَّهُمْ فِى ٱلْحَرْبِ فَشَرِّدْ بِهِم مَّنْ خَلْفَهُمْ لَعَلَّهُمْ يَذَّكَّرُونَ ﴿57﴾", "ru": "Если ты застанешь их в битве, то прогони ими тех, которые позади них, - может быть, они вспомнят!", "n": "«Если ты застанешь их в битве, то прогони ими тех, которые позади них» — наказание одних для устрашения остальных.", "c": null}, {"ref": "9:14", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "قَٰتِلُوهُمْ يُعَذِّبْهُمُ ٱللَّهُ بِأَيْدِيكُمْ وَيُخْزِهِمْ وَيَنصُرْكُمْ عَلَيْهِمْ وَيَشْفِ صُدُورَ قَوْمٍۢ مُّؤْمِنِينَ ﴿14﴾", "ru": "Сражайтесь с ними, - накажет их Аллах вашими руками, и опозорит их, и поможет вам против них, и исцелит грудь у людей верующих,", "n": "Сражайтесь с ними: Аллах накажет их вашими руками, опозорит их… и исцелит груди верующих — месть как лечение.", "c": null}, {"ref": "9:36", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "إِنَّ عِدَّةَ ٱلشُّهُورِ عِندَ ٱللَّهِ ٱثْنَا عَشَرَ شَهْرًۭا فِى كِتَٰبِ ٱللَّهِ يَوْمَ خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ مِنْهَآ أَرْبَعَةٌ حُرُمٌۭ ۚ ذَٰلِكَ ٱلدِّينُ ٱلْقَيِّمُ ۚ فَلَا تَظْلِمُوا۟ فِيهِنَّ أَنفُسَكُمْ ۚ وَقَٰتِلُوا۟ ٱلْمُشْرِكِينَ كَآفَّةًۭ كَمَا يُقَٰتِلُونَكُمْ كَآفَّةًۭ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ مَعَ ٱلْمُتَّقِينَ ﴿36﴾", "ru": "Поистине, число месяцев у Аллаха - двенадцать месяцев в писании Аллаха в тот день, как Он сотворил небеса и землю. Из них - четыре запретных, это - стойкая религия: не причиняйте же в них зла самим себе и сражайтесь все с многобожниками, как они все сражаются с вами. И знайте, что Аллах - с богобоязненными!", "n": "«Сражайтесь все с многобожниками, как они все сражаются с вами» (приказ без указания на конкретный конфликт).", "c": null}, {"ref": "22:39", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "أُذِنَ لِلَّذِينَ يُقَٰتَلُونَ بِأَنَّهُمْ ظُلِمُوا۟ ۚ وَإِنَّ ٱللَّهَ عَلَىٰ نَصْرِهِمْ لَقَدِيرٌ ﴿39﴾", "ru": "Дозволено тем, с которыми сражаются, за то, что они обижены... Поистине, Аллах может помочь им, -", "n": "«Дозволено тем, с которыми сражаются, за то, что они обижены…» — разрешение на войну в ответ на обиду; в других аятах говорится о терпении и борьбе словом (25:52).", "c": null}, {"ref": "25:52", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "فَلَا تُطِعِ ٱلْكَٰفِرِينَ وَجَٰهِدْهُم بِهِۦ جِهَادًۭا كَبِيرًۭا ﴿52﴾", "ru": "Не повинуйся же неверным и борись с ними этим великой борьбой!", "n": "«Не повинуйся же неверным и борись с ними этим великой борьбой!» — борьба (джихад) здесь понимается как убеждение Кораном; в мединских аятах борьба предписана оружием.", "c": null}, {"ref": "33:26", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "وَأَنزَلَ ٱلَّذِينَ ظَٰهَرُوهُم مِّنْ أَهْلِ ٱلْكِتَٰبِ مِن صَيَاصِيهِمْ وَقَذَفَ فِى قُلُوبِهِمُ ٱلرُّعْبَ فَرِيقًۭا تَقْتُلُونَ وَتَأْسِرُونَ فَرِيقًۭا ﴿26﴾", "ru": "И вывел Он тех из людей писания, которые помогли им, из их укреплений и вверг в их сердца страх; одну часть вы перебьете и возьмете в плен другую часть.", "n": "О людях Писания, помогавших врагам: «одну часть вы перебьёте и возьмёте в плен другую часть». В тексте племя не названо.", "c": null}, {"ref": "59:5", "sura": "Al-Hashr", "sura_ar": "سُورَةُ الحَشۡرِ", "type": "Medinan", "ar": "مَا قَطَعْتُم مِّن لِّينَةٍ أَوْ تَرَكْتُمُوهَا قَآئِمَةً عَلَىٰٓ أُصُولِهَا فَبِإِذْنِ ٱللَّهِ وَلِيُخْزِىَ ٱلْفَٰسِقِينَ ﴿5﴾", "ru": "Что вы ссекли из пальм или оставили стоящим на своих корнях, - то по соизволению Аллаха и чтобы Он посрамил нечестивых.", "n": "Вырубка пальм врагов разрешена: «Что вы ссекли из пальм или оставили стоящим на своих корнях, — то по соизволению Аллаха».", "c": null}, {"ref": "2:54", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِۦ يَٰقَوْمِ إِنَّكُمْ ظَلَمْتُمْ أَنفُسَكُم بِٱتِّخَاذِكُمُ ٱلْعِجْلَ فَتُوبُوٓا۟ إِلَىٰ بَارِئِكُمْ فَٱقْتُلُوٓا۟ أَنفُسَكُمْ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ عِندَ بَارِئِكُمْ فَتَابَ عَلَيْكُمْ ۚ إِنَّهُۥ هُوَ ٱلتَّوَّابُ ٱلرَّحِيمُ ﴿54﴾", "ru": "И вот сказал Муса своему народу: \"О народ мой! Вы самим себе причинили несправедливость, взяв себе тельца. Обратитесь же к вашему Творцу и убейте самих себя; это - лучше для вас пред вашим Творцом. И Он обратился к вам: ведь Он - обращающийся, милосердный!\"", "n": "Муса приказывает народу, поклонявшемуся тельцу: «убейте самих себя; это — лучше для вас пред вашим Творцом»; после этого Бог «обратился» к ним — смертная казнь за идолопоклонство.", "c": null}, {"ref": "18:74", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "فَٱنطَلَقَا حَتَّىٰٓ إِذَا لَقِيَا غُلَٰمًۭا فَقَتَلَهُۥ قَالَ أَقَتَلْتَ نَفْسًۭا زَكِيَّةًۢ بِغَيْرِ نَفْسٍۢ لَّقَدْ جِئْتَ شَيْـًۭٔا نُّكْرًۭا ﴿74﴾", "ru": "И пошли они; а когда встретили мальчика и тот его убил, то он сказал: \"Неужели ты убил чистую душу без отмщения за душу? Ты сделал вещь непохвальную!\"", "n": "Хидр (в тексте безымянный раб из Наших рабов) убивает встречного мальчика; Муса возмущается: «Неужели ты убил чистую душу без отмщения за душу?»", "c": null}, {"ref": "18:80-81", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَأَمَّا ٱلْغُلَٰمُ فَكَانَ أَبَوَاهُ مُؤْمِنَيْنِ فَخَشِينَآ أَن يُرْهِقَهُمَا طُغْيَٰنًۭا وَكُفْرًۭا ﴿80﴾ فَأَرَدْنَآ أَن يُبْدِلَهُمَا رَبُّهُمَا خَيْرًۭا مِّنْهُ زَكَوٰةًۭ وَأَقْرَبَ رُحْمًۭا ﴿81﴾", "ru": "(80) Что касается мальчика, то родители его были верующими, и мы боялись, что он обречет их переносить непокорность и неверие. (81) И мы хотели, чтобы Господь дал им взамен лучшего, чем он, по чистоте и более близкого по милосердию.", "n": "Объяснение: родители мальчика были верующими, «и мы боялись, что он обречёт их переносить непокорность и неверие» — убийство ребёнка оправдано тем, что он мог бы стать неверным.", "c": "Мусульманские толкователи видят здесь пример знания Бога, недоступного людям; критики — оправдание убийства за грех, которого ещё нет."}, {"ref": "37:102-107", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "فَلَمَّا بَلَغَ مَعَهُ ٱلسَّعْىَ قَالَ يَٰبُنَىَّ إِنِّىٓ أَرَىٰ فِى ٱلْمَنَامِ أَنِّىٓ أَذْبَحُكَ فَٱنظُرْ مَاذَا تَرَىٰ ۚ قَالَ يَٰٓأَبَتِ ٱفْعَلْ مَا تُؤْمَرُ ۖ سَتَجِدُنِىٓ إِن شَآءَ ٱللَّهُ مِنَ ٱلصَّٰبِرِينَ ﴿102﴾ فَلَمَّآ أَسْلَمَا وَتَلَّهُۥ لِلْجَبِينِ ﴿103﴾ وَنَٰدَيْنَٰهُ أَن يَٰٓإِبْرَٰهِيمُ ﴿104﴾ قَدْ صَدَّقْتَ ٱلرُّءْيَآ ۚ إِنَّا كَذَٰلِكَ نَجْزِى ٱلْمُحْسِنِينَ ﴿105﴾ إِنَّ هَٰذَا لَهُوَ ٱلْبَلَٰٓؤُا۟ ٱلْمُبِينُ ﴿106﴾ وَفَدَيْنَٰهُ بِذِبْحٍ عَظِيمٍۢ ﴿107﴾", "ru": "(102) А когда он дошел до труда вместе с ним, он сказал: \"Сынок мой, вижу я во сне, что закалываю тебя в жертву, и посмотри, что ты думаешь\". Он сказал: \"Отец мой, делай, что тебе приказано; ты найдешь меня, если пожелает Аллах, терпеливым\". (103) И когда они оба предались Аллаху и тот поверг его на лоб, (104) и воззвали Мы к нему: \"О Ибрахим! (105) Ты оправдал видение\". Так Мы вознаграждаем добродеющих! (106) Поистине, это - явное испытание. (107) И искупили Мы его великою жертвой.", "n": "Ибрахим видит во сне: «закалываю тебя в жертву»; сын отвечает: «делай, что тебе приказано»; Бог говорит: «Ты оправдал видение», и заменяет жертву. Готовность убить ребёнка по сну представлена как «явное испытание».", "c": null}]}, {"id": "jihad", "title": "Джихад: награды, угрозы и добыча", "icon": "🏹", "group": "Насилие и жестокость", "intro": "Награды за войну, угрозы уклоняющимся и правила дележа добычи. Показывает, что война в Коране мотивируется не только защитой, но и наградой в этом мире (добыча) и в будущем (рай).", "verses": [{"ref": "2:154", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَلَا تَقُولُوا۟ لِمَن يُقْتَلُ فِى سَبِيلِ ٱللَّهِ أَمْوَٰتٌۢ ۚ بَلْ أَحْيَآءٌۭ وَلَٰكِن لَّا تَشْعُرُونَ ﴿154﴾", "ru": "Не говорите о тех, которых убивают на пути Аллаха: \"Мертвые!\" Нет, живые! Но вы не чувствуете.", "n": "Не говорите о тех, кого убивают на пути Аллаха: мёртвые! Нет, живые!.", "c": null}, {"ref": "3:169", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَلَا تَحْسَبَنَّ ٱلَّذِينَ قُتِلُوا۟ فِى سَبِيلِ ٱللَّهِ أَمْوَٰتًۢا ۚ بَلْ أَحْيَآءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ ﴿169﴾", "ru": "И никак не считай тех, которые убиты на пути Аллаха, мертвыми. Нет, живые! Они у своего Господа получают удел,", "n": "Убитые «на пути Аллаха» живы у своего Господа и получают удел.", "c": null}, {"ref": "4:74", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "۞ فَلْيُقَٰتِلْ فِى سَبِيلِ ٱللَّهِ ٱلَّذِينَ يَشْرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا بِٱلْءَاخِرَةِ ۚ وَمَن يُقَٰتِلْ فِى سَبِيلِ ٱللَّهِ فَيُقْتَلْ أَوْ يَغْلِبْ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًۭا ﴿74﴾", "ru": "Пусть же сражаются на пути Аллаха те, которые покупают за ближайшую жизнь будущую! И если кто сражается на пути Аллаха и будет убит или победит, Мы дадим ему великую награду.", "n": "«Кто сражается на пути Аллаха, и будет убит или победит, — Мы дадим ему великую награду»: награда обещана и за победу, и за смерть.", "c": null}, {"ref": "4:95", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "لَّا يَسْتَوِى ٱلْقَٰعِدُونَ مِنَ ٱلْمُؤْمِنِينَ غَيْرُ أُو۟لِى ٱلضَّرَرِ وَٱلْمُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ ۚ فَضَّلَ ٱللَّهُ ٱلْمُجَٰهِدِينَ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ عَلَى ٱلْقَٰعِدِينَ دَرَجَةًۭ ۚ وَكُلًّۭا وَعَدَ ٱللَّهُ ٱلْحُسْنَىٰ ۚ وَفَضَّلَ ٱللَّهُ ٱلْمُجَٰهِدِينَ عَلَى ٱلْقَٰعِدِينَ أَجْرًا عَظِيمًۭا ﴿95﴾", "ru": "Не равняются сидящие из верующих, не испытывающие вреда, и усердствующие на пути Аллаха своим имуществом и своими душами. Дал Аллах преимущество усердствующим своим имуществом и своими душами перед сидящими на степень. Всем обещал Аллах благо, а усердствующим Аллах дал преимущество перед сидящим в великой награде,", "n": "«Не равняются сидящие из верующих, не испытывающие вреда, и усердствующие на пути Аллаха своим имуществом и своими душами»: Бог дал преимущество усердствующим… перед сидящими на степень.", "c": null}, {"ref": "4:94", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا ضَرَبْتُمْ فِى سَبِيلِ ٱللَّهِ فَتَبَيَّنُوا۟ وَلَا تَقُولُوا۟ لِمَنْ أَلْقَىٰٓ إِلَيْكُمُ ٱلسَّلَٰمَ لَسْتَ مُؤْمِنًۭا تَبْتَغُونَ عَرَضَ ٱلْحَيَوٰةِ ٱلدُّنْيَا فَعِندَ ٱللَّهِ مَغَانِمُ كَثِيرَةٌۭ ۚ كَذَٰلِكَ كُنتُم مِّن قَبْلُ فَمَنَّ ٱللَّهُ عَلَيْكُمْ فَتَبَيَّنُوٓا۟ ۚ إِنَّ ٱللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًۭا ﴿94﴾", "ru": "О вы, которые уверовали! Когда отправляетесь по пути Аллаха, то различайте и не говорите тому, кто предложит вам мир: \"Ты не верующий\", - домогаясь случайностей жизни ближней. Ведь у Аллаха - обильная добыча. Таковы были вы раньше, но Аллах оказал вам милость. Различайте же: поистине, Аллах сведущ в том, что вы делаете!", "n": "Верующим сказано не отвергать веру предлагающих мир, «домогаясь случайностей жизни ближней. Ведь у Аллаха — обильная добыча».", "c": null}, {"ref": "8:15-16", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا لَقِيتُمُ ٱلَّذِينَ كَفَرُوا۟ زَحْفًۭا فَلَا تُوَلُّوهُمُ ٱلْأَدْبَارَ ﴿15﴾ وَمَن يُوَلِّهِمْ يَوْمَئِذٍۢ دُبُرَهُۥٓ إِلَّا مُتَحَرِّفًۭا لِّقِتَالٍ أَوْ مُتَحَيِّزًا إِلَىٰ فِئَةٍۢ فَقَدْ بَآءَ بِغَضَبٍۢ مِّنَ ٱللَّهِ وَمَأْوَىٰهُ جَهَنَّمُ ۖ وَبِئْسَ ٱلْمَصِيرُ ﴿16﴾", "ru": "(15) О те, которые уверовали! Когда вы встретите тех, кто не веровал, в движении, то не обращайте к ним тыл. (16) А кто обратит к ним в тот день тыл, если не для поворота к битве или для присоединения к отряду, тот навлечет на себя гнев Аллаха. Убежище для него - геенна, и скверно это возвращение!", "n": "«Не обращайте к ним тыл»: бегство с поля боя — навлечение гнева Аллаха и геенны (8:16).", "c": null}, {"ref": "8:65-66", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ حَرِّضِ ٱلْمُؤْمِنِينَ عَلَى ٱلْقِتَالِ ۚ إِن يَكُن مِّنكُمْ عِشْرُونَ صَٰبِرُونَ يَغْلِبُوا۟ مِا۟ئَتَيْنِ ۚ وَإِن يَكُن مِّنكُم مِّا۟ئَةٌۭ يَغْلِبُوٓا۟ أَلْفًۭا مِّنَ ٱلَّذِينَ كَفَرُوا۟ بِأَنَّهُمْ قَوْمٌۭ لَّا يَفْقَهُونَ ﴿65﴾ ٱلْـَٰٔنَ خَفَّفَ ٱللَّهُ عَنكُمْ وَعَلِمَ أَنَّ فِيكُمْ ضَعْفًۭا ۚ فَإِن يَكُن مِّنكُم مِّا۟ئَةٌۭ صَابِرَةٌۭ يَغْلِبُوا۟ مِا۟ئَتَيْنِ ۚ وَإِن يَكُن مِّنكُمْ أَلْفٌۭ يَغْلِبُوٓا۟ أَلْفَيْنِ بِإِذْنِ ٱللَّهِ ۗ وَٱللَّهُ مَعَ ٱلصَّٰبِرِينَ ﴿66﴾", "ru": "(65) О пророк! Побуждай верующих к сражению. Если будет среди вас двадцать терпеливых, то они победят две сотни; а если будет среди вас сотня, то они победят тысячу тех, которые не веруют, за то, что они народ не понимающий. (66) Ныне облегчил вам Аллах; Он знает, что у вас есть слабость. А если будет среди вас сотня терпеливая, то они победят двести, а если будет среди вас тысяча, то они победят две тысячи с дозволения Аллаха: ведь Аллах - с терпеливыми!", "n": "Двадцать терпеливых победят двести; затем «ныне облегчил вам Аллах»: сто победят двести. Бог сначала приказывает неравное соотношение, затем меняет его.", "c": null}, {"ref": "8:67-68", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "مَا كَانَ لِنَبِىٍّ أَن يَكُونَ لَهُۥٓ أَسْرَىٰ حَتَّىٰ يُثْخِنَ فِى ٱلْأَرْضِ ۚ تُرِيدُونَ عَرَضَ ٱلدُّنْيَا وَٱللَّهُ يُرِيدُ ٱلْءَاخِرَةَ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌۭ ﴿67﴾ لَّوْلَا كِتَٰبٌۭ مِّنَ ٱللَّهِ سَبَقَ لَمَسَّكُمْ فِيمَآ أَخَذْتُمْ عَذَابٌ عَظِيمٌۭ ﴿68﴾", "ru": "(67) Ни одному пророку не годилось иметь пленных, пока он не производил избиения на земле. Вы стремитесь к случайностям ближайшего мира, а Аллах желает будущего. Аллах - великий, мудрый! (68) Если бы не писание от Аллаха, которое пришло раньше, то коснулось бы вас за то, что вы взяли, великое наказание.", "n": "«Ни одному пророку не годилось иметь пленных, пока он не производил избиения на земле»; затем: «Если бы не писание от Аллаха, которое пришло раньше, то коснулось бы вас за то, что вы взяли, великое наказание».", "c": "Один из самых жёстких аятов о пленных: убийство противопоставлено выкупу."}, {"ref": "9:38-39", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ مَا لَكُمْ إِذَا قِيلَ لَكُمُ ٱنفِرُوا۟ فِى سَبِيلِ ٱللَّهِ ٱثَّاقَلْتُمْ إِلَى ٱلْأَرْضِ ۚ أَرَضِيتُم بِٱلْحَيَوٰةِ ٱلدُّنْيَا مِنَ ٱلْءَاخِرَةِ ۚ فَمَا مَتَٰعُ ٱلْحَيَوٰةِ ٱلدُّنْيَا فِى ٱلْءَاخِرَةِ إِلَّا قَلِيلٌ ﴿38﴾ إِلَّا تَنفِرُوا۟ يُعَذِّبْكُمْ عَذَابًا أَلِيمًۭا وَيَسْتَبْدِلْ قَوْمًا غَيْرَكُمْ وَلَا تَضُرُّوهُ شَيْـًۭٔا ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ ﴿39﴾", "ru": "(38) О вы, которые уверовали! Почему, когда говорят вам: \"Выступайте по пути Аллаха\", вы тяжело припадаете к земле? Разве вы довольны ближней жизнью больше последней? Ведь достояние ближней жизни в сравнении с будущей - ничтожно. (39) Если вы не выступите, накажет вас Аллах мучительным наказанием и заменит вас другим народом. А вы ни в чем не причините Ему вреда: ведь Аллах мощен над всякой вещью!", "n": "Угроза уклоняющимся: «Если вы не выступите, накажет вас Аллах мучительным наказанием и заменит вас другим народом».", "c": null}, {"ref": "9:41", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "ٱنفِرُوا۟ خِفَافًۭا وَثِقَالًۭا وَجَٰهِدُوا۟ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ فِى سَبِيلِ ٱللَّهِ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ ﴿41﴾", "ru": "Выступайте легкими и тяжелыми и боритесь своими имуществами и душами на пути Аллаха! Это - лучшее для вас, если вы знаете!", "n": "Приказ выступать «лёгкими и тяжёлыми» и бороться имуществом и душами.", "c": null}, {"ref": "48:16", "sura": "Al-Fath", "sura_ar": "سُورَةُ الفَتۡحِ", "type": "Medinan", "ar": "قُل لِّلْمُخَلَّفِينَ مِنَ ٱلْأَعْرَابِ سَتُدْعَوْنَ إِلَىٰ قَوْمٍ أُو۟لِى بَأْسٍۢ شَدِيدٍۢ تُقَٰتِلُونَهُمْ أَوْ يُسْلِمُونَ ۖ فَإِن تُطِيعُوا۟ يُؤْتِكُمُ ٱللَّهُ أَجْرًا حَسَنًۭا ۖ وَإِن تَتَوَلَّوْا۟ كَمَا تَوَلَّيْتُم مِّن قَبْلُ يُعَذِّبْكُمْ عَذَابًا أَلِيمًۭا ﴿16﴾", "ru": "Скажи оставленным из бедуинов: \"Вы будете призваны на народ, обладающий великой яростью. Вы будете сражаться с ними, или они предадутся. И если вы будете повиноваться, тогда Аллах дарует вам хорошую награду, а если отвернетесь, как отвернулись раньше, Он накажет вас мучительным наказанием\".", "n": "Оставшимся дома бедуинам: «Вы будете призваны на народ, обладающий великой яростью. Вы будете сражаться с ними, или они предадутся».", "c": null}, {"ref": "48:19-20", "sura": "Al-Fath", "sura_ar": "سُورَةُ الفَتۡحِ", "type": "Medinan", "ar": "وَمَغَانِمَ كَثِيرَةًۭ يَأْخُذُونَهَا ۗ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًۭا ﴿19﴾ وَعَدَكُمُ ٱللَّهُ مَغَانِمَ كَثِيرَةًۭ تَأْخُذُونَهَا فَعَجَّلَ لَكُمْ هَٰذِهِۦ وَكَفَّ أَيْدِىَ ٱلنَّاسِ عَنكُمْ وَلِتَكُونَ ءَايَةًۭ لِّلْمُؤْمِنِينَ وَيَهْدِيَكُمْ صِرَٰطًۭا مُّسْتَقِيمًۭا ﴿20﴾", "ru": "(19) и обильную добычу, которую они возьмут. Аллах - великий, мудрый! (20) Обещал вам Аллах обильную добычу, которую вы возьмете, и ускорил Он вам это, и удержал руки людей от вас для того, чтобы это было знамением для верующих и Он вывел бы вас на прямую дорогу.", "n": null, "c": null}, {"ref": "61:10-13", "sura": "As-Saff", "sura_ar": "سُورَةُ الصَّفِّ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ ﴿10﴾ تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ ﴿11﴾ يَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَيُدْخِلْكُمْ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ وَمَسَٰكِنَ طَيِّبَةًۭ فِى جَنَّٰتِ عَدْنٍۢ ۚ ذَٰلِكَ ٱلْفَوْزُ ٱلْعَظِيمُ ﴿12﴾ وَأُخْرَىٰ تُحِبُّونَهَا ۖ نَصْرٌۭ مِّنَ ٱللَّهِ وَفَتْحٌۭ قَرِيبٌۭ ۗ وَبَشِّرِ ٱلْمُؤْمِنِينَ ﴿13﴾", "ru": "(10) О вы, которые уверовали! Не указать ли мне вам на торговлю, которая спасет вас от мучительного наказания? (11) Вы веруете в Аллаха и Его посланника, боретесь на пути Аллаха своим имуществом и своими душами. Это лучше для вас, если вы знаете! (12) Он простит тогда вам ваши грехи и введет вас в сады, где внизу текут реки, и в жилища благие в садах вечности. Это - великая прибыль! (13) И другое, что вы любите: помощь от Аллаха и близкая победа. И обрадуй же верующих!", "n": "Вера и борьба имуществом и душами — торговля, приносящая спасение от мучения и скорую победу.", "c": null}]}, {"id": "punish", "title": "Жестокие наказания", "icon": "⛓", "group": "Насилие и жестокость", "intro": "Телесные и калечащие наказания, а также неравенство в правовых нормах (свободный/раб, мужчина/женщина).", "verses": [{"ref": "5:33", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "إِنَّمَا جَزَٰٓؤُا۟ ٱلَّذِينَ يُحَارِبُونَ ٱللَّهَ وَرَسُولَهُۥ وَيَسْعَوْنَ فِى ٱلْأَرْضِ فَسَادًا أَن يُقَتَّلُوٓا۟ أَوْ يُصَلَّبُوٓا۟ أَوْ تُقَطَّعَ أَيْدِيهِمْ وَأَرْجُلُهُم مِّنْ خِلَٰفٍ أَوْ يُنفَوْا۟ مِنَ ٱلْأَرْضِ ۚ ذَٰلِكَ لَهُمْ خِزْىٌۭ فِى ٱلدُّنْيَا ۖ وَلَهُمْ فِى ٱلْءَاخِرَةِ عَذَابٌ عَظِيمٌ ﴿33﴾", "ru": "Действительно, воздаяние тех, которые воюют с Аллахом и Его посланником и стараются на земле вызвать нечестие, в том, что они будут убиты, или распяты, или будут отсечены у них руки и ноги накрест, или будут они изгнаны из земли. Это для них - позор в ближайшей жизни, а в последней для них - великое наказание, -", "n": "Для воюющих против Аллаха и посланника и распространяющих нечестие — казнь, распятие, отсечение руки и ноги накрест или изгнание.", "c": "Классические юристы относили к разбою на дорогах."}, {"ref": "5:38", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَٱلسَّارِقُ وَٱلسَّارِقَةُ فَٱقْطَعُوٓا۟ أَيْدِيَهُمَا جَزَآءًۢ بِمَا كَسَبَا نَكَٰلًۭا مِّنَ ٱللَّهِ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌۭ ﴿38﴾", "ru": "Вору и воровке отсекайте их руки в воздаяние за то, что они приобрели, как устрашение от Аллаха. Поистине, Аллах - великий, мудрый!", "n": "Вору и воровке — отсечь руки «в воздаяние за то, что они приобрели».", "c": "Юристы вводили ограничения (минимальная сумма — нисаб, условия доказательства), но сама норма применяется и сегодня в ряде стран."}, {"ref": "24:2", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "ٱلزَّانِيَةُ وَٱلزَّانِى فَٱجْلِدُوا۟ كُلَّ وَٰحِدٍۢ مِّنْهُمَا مِا۟ئَةَ جَلْدَةٍۢ ۖ وَلَا تَأْخُذْكُم بِهِمَا رَأْفَةٌۭ فِى دِينِ ٱللَّهِ إِن كُنتُمْ تُؤْمِنُونَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ ۖ وَلْيَشْهَدْ عَذَابَهُمَا طَآئِفَةٌۭ مِّنَ ٱلْمُؤْمِنِينَ ﴿2﴾", "ru": "Прелюбодея и прелюбодейку - побивайте каждого из них сотней ударов. Пусть не овладевает вами жалость к ним в религии Аллаха, если вы веруете в Аллаха и в последний день. И пусть присутствует при их наказании группа верующих.", "n": "Прелюбодеям — по сто ударов плетью; приказ не проявлять жалости, наказание должно проходить публично.", "c": null}, {"ref": "24:4", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَٱلَّذِينَ يَرْمُونَ ٱلْمُحْصَنَٰتِ ثُمَّ لَمْ يَأْتُوا۟ بِأَرْبَعَةِ شُهَدَآءَ فَٱجْلِدُوهُمْ ثَمَٰنِينَ جَلْدَةًۭ وَلَا تَقْبَلُوا۟ لَهُمْ شَهَٰدَةً أَبَدًۭا ۚ وَأُو۟لَٰٓئِكَ هُمُ ٱلْفَٰسِقُونَ ﴿4﴾", "ru": "А те, которые бросают обвинение в целомудренных, а потом не приведут четырех свидетелей, - побейте их восемьюдесятью ударами и не принимайте от них свидетельства никогда; это - распутники,", "n": "Обвинившим честных женщин в прелюбодеянии без четырёх свидетелей — 80 плетей и вечный запрет на свидетельство. Бремя доказательства для жертвы насилия на практике оказывается тяжёлым.", "c": null}, {"ref": "2:178", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلْقِصَاصُ فِى ٱلْقَتْلَى ۖ ٱلْحُرُّ بِٱلْحُرِّ وَٱلْعَبْدُ بِٱلْعَبْدِ وَٱلْأُنثَىٰ بِٱلْأُنثَىٰ ۚ فَمَنْ عُفِىَ لَهُۥ مِنْ أَخِيهِ شَىْءٌۭ فَٱتِّبَاعٌۢ بِٱلْمَعْرُوفِ وَأَدَآءٌ إِلَيْهِ بِإِحْسَٰنٍۢ ۗ ذَٰلِكَ تَخْفِيفٌۭ مِّن رَّبِّكُمْ وَرَحْمَةٌۭ ۗ فَمَنِ ٱعْتَدَىٰ بَعْدَ ذَٰلِكَ فَلَهُۥ عَذَابٌ أَلِيمٌۭ ﴿178﴾", "ru": "О те, которые уверовали! Предписано вам возмездие за убитых: свободный - за свободного, и раб - за раба, и женщина - за женщину. А кому будет прощено что-нибудь его братом, то - следование по обычаю и возмещение ему во благе. Это - облегчение от Господа вашего и милость; а кто преступит после этого, для него - наказание болезненное!", "n": "Закон возмездия закрепляет неравенство: свободный за свободного, раб за раба, женщина за женщину.", "c": null}, {"ref": "5:45", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَكَتَبْنَا عَلَيْهِمْ فِيهَآ أَنَّ ٱلنَّفْسَ بِٱلنَّفْسِ وَٱلْعَيْنَ بِٱلْعَيْنِ وَٱلْأَنفَ بِٱلْأَنفِ وَٱلْأُذُنَ بِٱلْأُذُنِ وَٱلسِّنَّ بِٱلسِّنِّ وَٱلْجُرُوحَ قِصَاصٌۭ ۚ فَمَن تَصَدَّقَ بِهِۦ فَهُوَ كَفَّارَةٌۭ لَّهُۥ ۚ وَمَن لَّمْ يَحْكُم بِمَآ أَنزَلَ ٱللَّهُ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ ﴿45﴾", "ru": "И предписали Мы им в ней, что душа - за душу, и око - за око, и нос - за нос, и ухо - за ухо, и зуб - за зуб, и раны - отмщение. А кто пожертвует это милостыней, то это - искупление за него. А кто судит не потому, что низвел Аллах, те - несправедливы.", "n": "Принцип талиона: душа за душу, глаз за глаз, нос за нос, ухо за ухо, зуб за зуб.", "c": "В тексте говорится о Торе; допускает прощение как милостыню."}, {"ref": "4:15", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَٱلَّٰتِى يَأْتِينَ ٱلْفَٰحِشَةَ مِن نِّسَآئِكُمْ فَٱسْتَشْهِدُوا۟ عَلَيْهِنَّ أَرْبَعَةًۭ مِّنكُمْ ۖ فَإِن شَهِدُوا۟ فَأَمْسِكُوهُنَّ فِى ٱلْبُيُوتِ حَتَّىٰ يَتَوَفَّىٰهُنَّ ٱلْمَوْتُ أَوْ يَجْعَلَ ٱللَّهُ لَهُنَّ سَبِيلًۭا ﴿15﴾", "ru": "А те из ваших женщин, которые совершат мерзость, - возьмите в свидетели против них четырех из вас. И если они засвидетельствуют, то держите их в домах, пока не упокоит их смерть или Аллах устроит для них путь.", "n": "Женщин, совершивших «мерзость», — удерживайте в домах, пока не упокоит их смерть — пожизненное заключение без суда в современном понимании.", "c": "Многие толкователи считают этот аят отменённым 24:2."}, {"ref": "7:124", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "لَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُم مِّنْ خِلَٰفٍۢ ثُمَّ لَأُصَلِّبَنَّكُمْ أَجْمَعِينَ ﴿124﴾", "ru": "Я отрублю вам руки и ноги накрест, потом распну вас всех!\"", "n": "Фараон угрожает: «Я отрублю вам руки и ноги накрест, потом распну вас всех!» — та же формула, что в 5:33 как наказание воюющим против Аллаха.", "c": "Повтор: 20:71 и 26:49. Критики отмечают, что Коран приводит это как зло Фараона, но затем само использует то же наказание."}, {"ref": "20:71", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "قَالَ ءَامَنتُمْ لَهُۥ قَبْلَ أَنْ ءَاذَنَ لَكُمْ ۖ إِنَّهُۥ لَكَبِيرُكُمُ ٱلَّذِى عَلَّمَكُمُ ٱلسِّحْرَ ۖ فَلَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُم مِّنْ خِلَٰفٍۢ وَلَأُصَلِّبَنَّكُمْ فِى جُذُوعِ ٱلنَّخْلِ وَلَتَعْلَمُنَّ أَيُّنَآ أَشَدُّ عَذَابًۭا وَأَبْقَىٰ ﴿71﴾", "ru": "Сказал он: \"Неужели вы уверовали в Него раньше, чем я дозволил вам; он, конечно, ваш старший, который научил вас колдовству. Я отрублю вам руки и ноги накрест, распну вас на стволах пальм, узнаете вы тогда, кто из нас сильнее наказанием и более длителен\".", "n": "Фараон: «Я отрублю вам руки и ноги накрест…» — снова та же формула.", "c": null}, {"ref": "26:49", "sura": "Ash-Shu'araa", "sura_ar": "سُورَةُ الشُّعَرَاءِ", "type": "Meccan", "ar": "قَالَ ءَامَنتُمْ لَهُۥ قَبْلَ أَنْ ءَاذَنَ لَكُمْ ۖ إِنَّهُۥ لَكَبِيرُكُمُ ٱلَّذِى عَلَّمَكُمُ ٱلسِّحْرَ فَلَسَوْفَ تَعْلَمُونَ ۚ لَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُم مِّنْ خِلَٰفٍۢ وَلَأُصَلِّبَنَّكُمْ أَجْمَعِينَ ﴿49﴾", "ru": "Сказал: \"Разве вы уверовали в Него, прежде чем я разрешил вам: он, конечно, ваш старший, который научил вас колдовству, и вы узнаете. Я отсеку вам руки и ноги накрест и распну вас всех!\"", "n": "Третий случай той же угрозы Фараона колдунам, уверовавшим в Бога Мусы.", "c": null}, {"ref": "24:6-9", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَٱلَّذِينَ يَرْمُونَ أَزْوَٰجَهُمْ وَلَمْ يَكُن لَّهُمْ شُهَدَآءُ إِلَّآ أَنفُسُهُمْ فَشَهَٰدَةُ أَحَدِهِمْ أَرْبَعُ شَهَٰدَٰتٍۭ بِٱللَّهِ ۙ إِنَّهُۥ لَمِنَ ٱلصَّٰدِقِينَ ﴿6﴾ وَٱلْخَٰمِسَةُ أَنَّ لَعْنَتَ ٱللَّهِ عَلَيْهِ إِن كَانَ مِنَ ٱلْكَٰذِبِينَ ﴿7﴾ وَيَدْرَؤُا۟ عَنْهَا ٱلْعَذَابَ أَن تَشْهَدَ أَرْبَعَ شَهَٰدَٰتٍۭ بِٱللَّهِ ۙ إِنَّهُۥ لَمِنَ ٱلْكَٰذِبِينَ ﴿8﴾ وَٱلْخَٰمِسَةَ أَنَّ غَضَبَ ٱللَّهِ عَلَيْهَآ إِن كَانَ مِنَ ٱلصَّٰدِقِينَ ﴿9﴾", "ru": "(6) А те, которые бросают обвинения в своих жен и у них нет свидетелей, кроме самих себя, то свидетельство каждого из них - четыре свидетельства Аллахом, что он правдив, (7) а пятое, - что проклятие Аллаха на нем, если он лжец. (8) И отклоняется от нее наказание, если она засвидетельствует четырьмя свидетельствует Аллахом, что он лжец, (9) а пятым, - что гнев Аллаха на ней, если он правдив.", "n": "Если муж обвиняет жену в измене без свидетелей, он клянётся четыре раза и пятый — что на нём проклятие, если лжёт; жена избегает наказания встречной клятвой. Свидетелей он не обязан приводить.", "c": null}]}, {"id": "hell", "title": "Ад и проклятия", "icon": "🔥", "group": "Насилие и жестокость", "intro": "Образы вечных мучений, в которых наказание за неверие описывается как бесконечное и физически жестокое.", "verses": [{"ref": "4:56", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِنَا سَوْفَ نُصْلِيهِمْ نَارًۭا كُلَّمَا نَضِجَتْ جُلُودُهُم بَدَّلْنَٰهُمْ جُلُودًا غَيْرَهَا لِيَذُوقُوا۟ ٱلْعَذَابَ ۗ إِنَّ ٱللَّهَ كَانَ عَزِيزًا حَكِيمًۭا ﴿56﴾", "ru": "Поистине, тех, которые не веровали в Наши знамения, Мы сожжем в огне! Всякий раз, как сготовится их кожа, Мы заменим им другой кожей, чтобы они вкусили наказания. Поистине, Аллах - великий, мудрый!", "n": "Неверующих ждёт огонь: всякий раз, как сгорит их кожа, Мы заменим её другой кожей, чтобы они вкусили мучение.", "c": null}, {"ref": "22:19-21", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "۞ هَٰذَانِ خَصْمَانِ ٱخْتَصَمُوا۟ فِى رَبِّهِمْ ۖ فَٱلَّذِينَ كَفَرُوا۟ قُطِّعَتْ لَهُمْ ثِيَابٌۭ مِّن نَّارٍۢ يُصَبُّ مِن فَوْقِ رُءُوسِهِمُ ٱلْحَمِيمُ ﴿19﴾ يُصْهَرُ بِهِۦ مَا فِى بُطُونِهِمْ وَٱلْجُلُودُ ﴿20﴾ وَلَهُم مَّقَٰمِعُ مِنْ حَدِيدٍۢ ﴿21﴾", "ru": "(19) Вот - два врага, которые враждовали об их господе; тем, которые не веровали, выкроены одежды из огня, проливается на их головы кипяток. (20) Растапливается от этого то, что у них в утробах, и (их) кожи. (21) Для них есть железные крючья.", "n": "Для неверных скроены одежды из огня, над головами польют кипяток, им растопится то, что у них в животах, и кожа, а для них — железные палицы.", "c": null}, {"ref": "14:16-17", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "مِّن وَرَآئِهِۦ جَهَنَّمُ وَيُسْقَىٰ مِن مَّآءٍۢ صَدِيدٍۢ ﴿16﴾ يَتَجَرَّعُهُۥ وَلَا يَكَادُ يُسِيغُهُۥ وَيَأْتِيهِ ٱلْمَوْتُ مِن كُلِّ مَكَانٍۢ وَمَا هُوَ بِمَيِّتٍۢ ۖ وَمِن وَرَآئِهِۦ عَذَابٌ غَلِيظٌۭ ﴿17﴾", "ru": "(16) Позади его - геенна, и будут его поить водой гнойной. (17) Он лакает ее, но едва проглатывает, и приходит к нему смерть со всех мест, но он не мертв, а позади его - суровое наказание.", "n": "Питьё из гнойной воды: неверный будет глотать её, но почти не проглотит; смерть будет приходить к нему со всех сторон, но он не умрёт.", "c": null}, {"ref": "44:43-46", "sura": "Ad-Dukhaan", "sura_ar": "سُورَةُ الدُّخَانِ", "type": "Meccan", "ar": "إِنَّ شَجَرَتَ ٱلزَّقُّومِ ﴿43﴾ طَعَامُ ٱلْأَثِيمِ ﴿44﴾ كَٱلْمُهْلِ يَغْلِى فِى ٱلْبُطُونِ ﴿45﴾ كَغَلْىِ ٱلْحَمِيمِ ﴿46﴾", "ru": "(43) Ведь дерево заккум - (44) пища для грешника. (45) Как медь, - кипит оно в животах, (46) точно кипит кипяток.", "n": "Дерево заккум — пища грешника: как расплавленный металл, оно будет кипеть в животах, как бурление кипятка.", "c": null}, {"ref": "18:29", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَقُلِ ٱلْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَآءَ فَلْيُؤْمِن وَمَن شَآءَ فَلْيَكْفُرْ ۚ إِنَّآ أَعْتَدْنَا لِلظَّٰلِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا ۚ وَإِن يَسْتَغِيثُوا۟ يُغَاثُوا۟ بِمَآءٍۢ كَٱلْمُهْلِ يَشْوِى ٱلْوُجُوهَ ۚ بِئْسَ ٱلشَّرَابُ وَسَآءَتْ مُرْتَفَقًا ﴿29﴾", "ru": "И скажи: \"Истина - от вашего Господа: кто хочет, пусть верует, а кто хочет, пусть не верует\". Мы приготовили несправедливым огонь, навес которого окружит их; а если они воззовут о помощи, им помогут водой, подобной расплавленному металлу, которая опаляет лица. Скверно питье, и плохо убежище!", "n": "Неверных ждёт огонь; когда они попросят воды, им подадут воду подобную расплавленному металлу, которая обожжёт лица.", "c": null}, {"ref": "111:1-5", "sura": "Al-Masad", "sura_ar": "سُورَةُ المَسَدِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ تَبَّتْ يَدَآ أَبِى لَهَبٍۢ وَتَبَّ ﴿1﴾ مَآ أَغْنَىٰ عَنْهُ مَالُهُۥ وَمَا كَسَبَ ﴿2﴾ سَيَصْلَىٰ نَارًۭا ذَاتَ لَهَبٍۢ ﴿3﴾ وَٱمْرَأَتُهُۥ حَمَّالَةَ ٱلْحَطَبِ ﴿4﴾ فِى جِيدِهَا حَبْلٌۭ مِّن مَّسَدٍۭ ﴿5﴾", "ru": "(1) Пусть пропадут обе руки Абу Лахаба, а сам он пропал! (2) Не помогло ему его богатство и то, что он приобрел. (3) Будет он гореть в огне с пламенем (4) и жена его (тоже) - носильщица дров, (5) на шее у нее - (только) веревка из пальмовых волокон.", "n": "Сура Пальмовые волокна: проклятие личного дяди Мухаммада Абу Лахаба и его жены; их ждёт пламенный огонь, а на шее жены — верёвка из волокон.", "c": "Один из примеров, где конкретные люди проклинаются по имени."}, {"ref": "14:49-50", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "وَتَرَى ٱلْمُجْرِمِينَ يَوْمَئِذٍۢ مُّقَرَّنِينَ فِى ٱلْأَصْفَادِ ﴿49﴾ سَرَابِيلُهُم مِّن قَطِرَانٍۢ وَتَغْشَىٰ وُجُوهَهُمُ ٱلنَّارُ ﴿50﴾", "ru": "(49) И увидишь ты грешников в тот день, связанных цепями. (50) Одеяние их из смолы, лица их покрывает огонь,", "n": null, "c": null}, {"ref": "37:62-67", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "أَذَٰلِكَ خَيْرٌۭ نُّزُلًا أَمْ شَجَرَةُ ٱلزَّقُّومِ ﴿62﴾ إِنَّا جَعَلْنَٰهَا فِتْنَةًۭ لِّلظَّٰلِمِينَ ﴿63﴾ إِنَّهَا شَجَرَةٌۭ تَخْرُجُ فِىٓ أَصْلِ ٱلْجَحِيمِ ﴿64﴾ طَلْعُهَا كَأَنَّهُۥ رُءُوسُ ٱلشَّيَٰطِينِ ﴿65﴾ فَإِنَّهُمْ لَءَاكِلُونَ مِنْهَا فَمَالِـُٔونَ مِنْهَا ٱلْبُطُونَ ﴿66﴾ ثُمَّ إِنَّ لَهُمْ عَلَيْهَا لَشَوْبًۭا مِّنْ حَمِيمٍۢ ﴿67﴾", "ru": "(62) Это лучше, как угощение, или дерево заккум? (63) Мы ведь сделали его соблазном для обидчиков. (64) Это ведь дерево, которое выходит из корня геенны. (65) Плоды его точно головы дияволов. (66) И они едят его и наполняют им животы. (67) А потом есть вода для них, горячее питье из кипятка.", "n": "Дерево Заккум «выходит из корня геенны», «плоды его точно головы дияволов»; грешники будут им наполнять животы.", "c": null}, {"ref": "56:51-56", "sura": "Al-Waaqia", "sura_ar": "سُورَةُ الوَاقِعَةِ", "type": "Meccan", "ar": "ثُمَّ إِنَّكُمْ أَيُّهَا ٱلضَّآلُّونَ ٱلْمُكَذِّبُونَ ﴿51﴾ لَءَاكِلُونَ مِن شَجَرٍۢ مِّن زَقُّومٍۢ ﴿52﴾ فَمَالِـُٔونَ مِنْهَا ٱلْبُطُونَ ﴿53﴾ فَشَٰرِبُونَ عَلَيْهِ مِنَ ٱلْحَمِيمِ ﴿54﴾ فَشَٰرِبُونَ شُرْبَ ٱلْهِيمِ ﴿55﴾ هَٰذَا نُزُلُهُمْ يَوْمَ ٱلدِّينِ ﴿56﴾", "ru": "(51) Потом, поистине, вы - заблудшие, обвиняющие во лжи, (52) будете есть с дерева заккум (53) и наполнять им животы, (54) и пить за этим кипяток, (55) и пить, как пьют истомленные жаждой\". (56) Это - угощение их в день суда.", "n": "Заблудшие будут есть Заккум, наполнять им животы и пить кипяток, как пьют жаждущие верблюды.", "c": null}, {"ref": "69:30-34", "sura": "Al-Haaqqa", "sura_ar": "سُورَةُ الحَاقَّةِ", "type": "Meccan", "ar": "خُذُوهُ فَغُلُّوهُ ﴿30﴾ ثُمَّ ٱلْجَحِيمَ صَلُّوهُ ﴿31﴾ ثُمَّ فِى سِلْسِلَةٍۢ ذَرْعُهَا سَبْعُونَ ذِرَاعًۭا فَٱسْلُكُوهُ ﴿32﴾ إِنَّهُۥ كَانَ لَا يُؤْمِنُ بِٱللَّهِ ٱلْعَظِيمِ ﴿33﴾ وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ ﴿34﴾", "ru": "(30) \"Возьмите его и свяжите! (31) Потом в огне адском сожгите! (32) Потом в цепь, длина которой семьдесят локтей, его поместите! (33) Ведь он не верил в Аллаха великого, (34) и не побуждал накормить бедняка.", "n": "Приказ ангелам: Схватите его и закуйте, потом в геенне сожгите, потом в цепь длиной в семьдесят локтей введите — за неверие и за то, что не побуждал кормить бедняка.", "c": null}, {"ref": "73:12-13", "sura": "Al-Muzzammil", "sura_ar": "سُورَةُ المُزَّمِّلِ", "type": "Meccan", "ar": "إِنَّ لَدَيْنَآ أَنكَالًۭا وَجَحِيمًۭا ﴿12﴾ وَطَعَامًۭا ذَا غُصَّةٍۢ وَعَذَابًا أَلِيمًۭا ﴿13﴾", "ru": "(12) Поистине, у Нас ведь оковы и огонь, (13) и еда удавляющая, и наказание мучительное", "n": "Для неверных — «оковы и огонь, и еда удавляющая, и наказание мучительное».", "c": null}, {"ref": "74:26-29", "sura": "Al-Muddaththir", "sura_ar": "سُورَةُ المُدَّثِّرِ", "type": "Meccan", "ar": "سَأُصْلِيهِ سَقَرَ ﴿26﴾ وَمَآ أَدْرَىٰكَ مَا سَقَرُ ﴿27﴾ لَا تُبْقِى وَلَا تَذَرُ ﴿28﴾ لَوَّاحَةٌۭ لِّلْبَشَرِ ﴿29﴾", "ru": "(26) Сожгу я его в сакаре! (27) А что даст тебе знать, что такое сакар? (28) Не оставляет он и не покидает - (29) сжигатель кожи.", "n": null, "c": null}, {"ref": "78:21-30", "sura": "An-Naba", "sura_ar": "سُورَةُ النَّبَإِ", "type": "Meccan", "ar": "إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًۭا ﴿21﴾ لِّلطَّٰغِينَ مَـَٔابًۭا ﴿22﴾ لَّٰبِثِينَ فِيهَآ أَحْقَابًۭا ﴿23﴾ لَّا يَذُوقُونَ فِيهَا بَرْدًۭا وَلَا شَرَابًا ﴿24﴾ إِلَّا حَمِيمًۭا وَغَسَّاقًۭا ﴿25﴾ جَزَآءًۭ وِفَاقًا ﴿26﴾ إِنَّهُمْ كَانُوا۟ لَا يَرْجُونَ حِسَابًۭا ﴿27﴾ وَكَذَّبُوا۟ بِـَٔايَٰتِنَا كِذَّابًۭا ﴿28﴾ وَكُلَّ شَىْءٍ أَحْصَيْنَٰهُ كِتَٰبًۭا ﴿29﴾ فَذُوقُوا۟ فَلَن نَّزِيدَكُمْ إِلَّا عَذَابًا ﴿30﴾", "ru": "(21) Поистине, геенна - есть засада, (22) для преступивших - место возврата, (23) в котором они пробудут века, (24) не вкушая там ни прохлады, ни питья, (25) кроме кипятку и гною, (26) воздаяние соответственное. (27) Ведь они не надеялись на расчет (28) и считали ложью Наши знамения лживо. (29) И каждую вещь Мы сочли, записав. (30) Вкусите же, Мы не прибавим вам ничего, кроме наказания!", "n": "Геенна — «засада»; неверные «пробудут века», не вкушая «ни прохлады, ни питья, кроме кипятку и гною — воздаяние соответственное»; итог: «Вкусите же, Мы не прибавим вам ничего, кроме наказания!»", "c": null}, {"ref": "88:2-7", "sura": "Al-Ghaashiya", "sura_ar": "سُورَةُ الغَاشِيَةِ", "type": "Meccan", "ar": "وُجُوهٌۭ يَوْمَئِذٍ خَٰشِعَةٌ ﴿2﴾ عَامِلَةٌۭ نَّاصِبَةٌۭ ﴿3﴾ تَصْلَىٰ نَارًا حَامِيَةًۭ ﴿4﴾ تُسْقَىٰ مِنْ عَيْنٍ ءَانِيَةٍۢ ﴿5﴾ لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍۢ ﴿6﴾ لَّا يُسْمِنُ وَلَا يُغْنِى مِن جُوعٍۢ ﴿7﴾", "ru": "(2) Лица в тот день униженные, (3) трудящиеся, работающие, (4) горят в огне пылающем, (5) поятся из источника кипящего. (6) Нет у них пищи, кроме дари, (7) он не утучняет и от голода не избавляет.", "n": "Лица грешников «униженные, трудящиеся, работающие, горят в огне пылающем, поятся из источника кипящего. Нет у них пищи, кроме дари» (колючий кустарник).", "c": null}, {"ref": "70:15-18", "sura": "Al-Ma'aarij", "sura_ar": "سُورَةُ المَعَارِجِ", "type": "Meccan", "ar": "كَلَّآ ۖ إِنَّهَا لَظَىٰ ﴿15﴾ نَزَّاعَةًۭ لِّلشَّوَىٰ ﴿16﴾ تَدْعُوا۟ مَنْ أَدْبَرَ وَتَوَلَّىٰ ﴿17﴾ وَجَمَعَ فَأَوْعَىٰٓ ﴿18﴾", "ru": "(15) Так нет, ведь это - огонь, (16) схвативши за скальп, (17) призывает тех, кто отвратился и повернулся, (18) кто собрал и скопил.", "n": null, "c": null}, {"ref": "47:15", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "مَّثَلُ ٱلْجَنَّةِ ٱلَّتِى وُعِدَ ٱلْمُتَّقُونَ ۖ فِيهَآ أَنْهَٰرٌۭ مِّن مَّآءٍ غَيْرِ ءَاسِنٍۢ وَأَنْهَٰرٌۭ مِّن لَّبَنٍۢ لَّمْ يَتَغَيَّرْ طَعْمُهُۥ وَأَنْهَٰرٌۭ مِّنْ خَمْرٍۢ لَّذَّةٍۢ لِّلشَّٰرِبِينَ وَأَنْهَٰرٌۭ مِّنْ عَسَلٍۢ مُّصَفًّۭى ۖ وَلَهُمْ فِيهَا مِن كُلِّ ٱلثَّمَرَٰتِ وَمَغْفِرَةٌۭ مِّن رَّبِّهِمْ ۖ كَمَنْ هُوَ خَٰلِدٌۭ فِى ٱلنَّارِ وَسُقُوا۟ مَآءً حَمِيمًۭا فَقَطَّعَ أَمْعَآءَهُمْ ﴿15﴾", "ru": "Образ сада, который обещан богобоязненным: там - реки из воды не портящейся и реки из молока, вкус которого не меняется, и реки из вина, приятного для пьющих, и реки из меду очищенного. И для них там всякие плоды и прощение от их Господа. ...Как тот, кто вечно пребывает в огне и кого поят кипящей водой, и она рассекает их внутренности.", "n": "В аду кипящая вода «рассекает их внутренности» (в сравнении с садом из рек молока, вина и мёда).", "c": null}, {"ref": "8:50", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَلَوْ تَرَىٰٓ إِذْ يَتَوَفَّى ٱلَّذِينَ كَفَرُوا۟ ۙ ٱلْمَلَٰٓئِكَةُ يَضْرِبُونَ وُجُوهَهُمْ وَأَدْبَٰرَهُمْ وَذُوقُوا۟ عَذَابَ ٱلْحَرِيقِ ﴿50﴾", "ru": "Если бы ты видел, как завершают жизнь тех, которые не веровали, ангелы - бьют их по лицу и по спинам: \"Вкусите наказание пожара!\"", "n": "Ангелы при смерти неверных «бьют их по лицу и по спинам»; тот же образ в 47:27.", "c": null}, {"ref": "39:16", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "لَهُم مِّن فَوْقِهِمْ ظُلَلٌۭ مِّنَ ٱلنَّارِ وَمِن تَحْتِهِمْ ظُلَلٌۭ ۚ ذَٰلِكَ يُخَوِّفُ ٱللَّهُ بِهِۦ عِبَادَهُۥ ۚ يَٰعِبَادِ فَٱتَّقُونِ ﴿16﴾", "ru": "Для них над ними навесы из огня и под ними навесы\". Этим страшит Аллах Своих рабов; о рабы Мои, бойтесь Меня!", "n": "Для грешников «над ними навесы из огня и под ними навесы».", "c": null}, {"ref": "40:70-72", "sura": "Ghafir", "sura_ar": "سُورَةُ غَافِرٍ", "type": "Meccan", "ar": "ٱلَّذِينَ كَذَّبُوا۟ بِٱلْكِتَٰبِ وَبِمَآ أَرْسَلْنَا بِهِۦ رُسُلَنَا ۖ فَسَوْفَ يَعْلَمُونَ ﴿70﴾ إِذِ ٱلْأَغْلَٰلُ فِىٓ أَعْنَٰقِهِمْ وَٱلسَّلَٰسِلُ يُسْحَبُونَ ﴿71﴾ فِى ٱلْحَمِيمِ ثُمَّ فِى ٱلنَّارِ يُسْجَرُونَ ﴿72﴾", "ru": "(70) те, которые считают ложью книгу и то, с чем Мы послали Наших посланников, но они узнают, (71) когда оковы у них на шее и путы - их будут влачить (72) в кипяток, а потом в огонь, где их разожгут.", "n": "Кипяток, затем в огне их будут сжигать.", "c": null}, {"ref": "32:13", "sura": "As-Sajda", "sura_ar": "سُورَةُ السَّجۡدَةِ", "type": "Meccan", "ar": "وَلَوْ شِئْنَا لَءَاتَيْنَا كُلَّ نَفْسٍ هُدَىٰهَا وَلَٰكِنْ حَقَّ ٱلْقَوْلُ مِنِّى لَأَمْلَأَنَّ جَهَنَّمَ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ أَجْمَعِينَ ﴿13﴾", "ru": "Если бы Мы пожелали, Мы бы всякой душе дали прямой путь, но правдиво было слово Мое: \"Наполню Я геенну гениями и людьми вместе!\"", "n": "Правдиво было слово Моё: Наполню Я геенну гениями (джиннами) и людьми вместе! — решение Бога заранее заполнить ад (то же в 11:119).", "c": null}, {"ref": "50:30", "sura": "Qaaf", "sura_ar": "سُورَةُ قٓ", "type": "Meccan", "ar": "يَوْمَ نَقُولُ لِجَهَنَّمَ هَلِ ٱمْتَلَأْتِ وَتَقُولُ هَلْ مِن مَّزِيدٍۢ ﴿30﴾", "ru": "В тот день скажем Мы геенне: \"Полна ли ты стала?\" - и скажет она: \"Нет ли добавки?\"", "n": "Бог говорит геенне: «Полна ли ты стала?» — и она отвечает: «Нет ли добавки?»", "c": null}, {"ref": "25:13-14", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "وَإِذَآ أُلْقُوا۟ مِنْهَا مَكَانًۭا ضَيِّقًۭا مُّقَرَّنِينَ دَعَوْا۟ هُنَالِكَ ثُبُورًۭا ﴿13﴾ لَّا تَدْعُوا۟ ٱلْيَوْمَ ثُبُورًۭا وَٰحِدًۭا وَٱدْعُوا۟ ثُبُورًۭا كَثِيرًۭا ﴿14﴾", "ru": "(13) А когда брошены они будут там в место тесное связанными, они призовут там гибель. (14) Не призывайте сегодня одну гибель, а зовите много гибелей!", "n": "Брошенные «в место тесное связанными» призовут гибель; им ответят: «Не призывайте сегодня одну гибель, а зовите много гибелей!»", "c": null}]}, {"id": "god", "title": "Бог: хитрость, месть, гнев", "icon": "⚡", "group": "Насилие и жестокость", "intro": "Как Коран описывает действия Бога: «хитрость», «козни», ловушки для неверных, истребление целых народов, отсрочка с целью умножить грех. Слово «макр» в арабском может означать и «замысел», поэтому часть переводчиков смягчает; перевод Крачковского передаёт его как «хитрость».", "verses": [{"ref": "3:54", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَمَكَرُوا۟ وَمَكَرَ ٱللَّهُ ۖ وَٱللَّهُ خَيْرُ ٱلْمَٰكِرِينَ ﴿54﴾", "ru": "И хитрили они, и хитрил Аллах, а Аллах - лучший из хитрецов.", "n": null, "c": "Другие переводчики пишут замышляли; критики видят в аяте прямое приписывание Богу хитрости."}, {"ref": "8:30", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَإِذْ يَمْكُرُ بِكَ ٱلَّذِينَ كَفَرُوا۟ لِيُثْبِتُوكَ أَوْ يَقْتُلُوكَ أَوْ يُخْرِجُوكَ ۚ وَيَمْكُرُونَ وَيَمْكُرُ ٱللَّهُ ۖ وَٱللَّهُ خَيْرُ ٱلْمَٰكِرِينَ ﴿30﴾", "ru": "Вот ухищряются против тебя те, которые не веруют, чтобы задержать тебя или умертвить, или изгнать. Они ухищряются, и ухищряется Аллах. А ведь Аллах - лучший из ухищряющихся!", "n": "О неверных: «Они ухищряются, и ухищряется Аллах. А ведь Аллах — лучший из ухищряющихся» (в тексте о заговоре против Пророка).", "c": null}, {"ref": "4:142", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِنَّ ٱلْمُنَٰفِقِينَ يُخَٰدِعُونَ ٱللَّهَ وَهُوَ خَٰدِعُهُمْ وَإِذَا قَامُوٓا۟ إِلَى ٱلصَّلَوٰةِ قَامُوا۟ كُسَالَىٰ يُرَآءُونَ ٱلنَّاسَ وَلَا يَذْكُرُونَ ٱللَّهَ إِلَّا قَلِيلًۭا ﴿142﴾", "ru": "Поистине, лицемеры пытаются обмануть Аллаха, тогда как Он обманывает их! А когда они встают на молитву, то встают ленивыми, делая вид пред людьми, и вспоминают Аллаха, только мало,", "n": null, "c": null}, {"ref": "2:15", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِى طُغْيَٰنِهِمْ يَعْمَهُونَ ﴿15﴾", "ru": "Аллах поиздевается над ними и усилит их заблуждение, в котором они скитаются слепо!", "n": null, "c": null}, {"ref": "7:182-183", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا سَنَسْتَدْرِجُهُم مِّنْ حَيْثُ لَا يَعْلَمُونَ ﴿182﴾ وَأُمْلِى لَهُمْ ۚ إِنَّ كَيْدِى مَتِينٌ ﴿183﴾", "ru": "(182) А тех, которые считали ложью Наши знамения, Мы низведем так, что они не узнают. (183) И Я даю им отсрочку: ведь Моя хитрость - прочна.", "n": "Мы низведём их так, что они не узнают. И Я даю им отсрочку: ведь Моя хитрость — прочна.", "c": null}, {"ref": "86:15-16", "sura": "At-Taariq", "sura_ar": "سُورَةُ الطَّارِقِ", "type": "Meccan", "ar": "إِنَّهُمْ يَكِيدُونَ كَيْدًۭا ﴿15﴾ وَأَكِيدُ كَيْدًۭا ﴿16﴾", "ru": "(15) Они ведь замышляют хитрость. (16) И Я замышляю хитрость.", "n": null, "c": null}, {"ref": "27:50-51", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "وَمَكَرُوا۟ مَكْرًۭا وَمَكَرْنَا مَكْرًۭا وَهُمْ لَا يَشْعُرُونَ ﴿50﴾ فَٱنظُرْ كَيْفَ كَانَ عَٰقِبَةُ مَكْرِهِمْ أَنَّا دَمَّرْنَٰهُمْ وَقَوْمَهُمْ أَجْمَعِينَ ﴿51﴾", "ru": "(50) Они замышляли хитрость, и Мы замышляли хитрость, а они и не знали. (51) Посмотри же, каков был конец их хитрости! Мы погубили их и их народ - всех.", "n": null, "c": null}, {"ref": "3:178", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَلَا يَحْسَبَنَّ ٱلَّذِينَ كَفَرُوٓا۟ أَنَّمَا نُمْلِى لَهُمْ خَيْرٌۭ لِّأَنفُسِهِمْ ۚ إِنَّمَا نُمْلِى لَهُمْ لِيَزْدَادُوٓا۟ إِثْمًۭا ۚ وَلَهُمْ عَذَابٌۭ مُّهِينٌۭ ﴿178﴾", "ru": "И пусть не считают никак те, которые не веровали, что то, что Мы им продлеваем, - во благо для них грехе, и для них - наказание унизительное!", "n": "Продление жизни неверным Бог не называет милостью: в тексте — «для них — наказание унизительное».", "c": null}, {"ref": "17:16", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "وَإِذَآ أَرَدْنَآ أَن نُّهْلِكَ قَرْيَةً أَمَرْنَا مُتْرَفِيهَا فَفَسَقُوا۟ فِيهَا فَحَقَّ عَلَيْهَا ٱلْقَوْلُ فَدَمَّرْنَٰهَا تَدْمِيرًۭا ﴿16﴾", "ru": "А когда Мы желали погубить селение, Мы отдавали приказ одаренным благами в нем, и они творили нечестие там; тогда оправдывалось над ним слово, и уничтожали Мы его совершенно.", "n": null, "c": "Критики: Бог сам вызывает грех, чтобы затем наказать. Традиционное объяснение — приказ в смысле увеличиваем число; смысл спорен."}, {"ref": "11:102", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "وَكَذَٰلِكَ أَخْذُ رَبِّكَ إِذَآ أَخَذَ ٱلْقُرَىٰ وَهِىَ ظَٰلِمَةٌ ۚ إِنَّ أَخْذَهُۥٓ أَلِيمٌۭ شَدِيدٌ ﴿102﴾", "ru": "Такова хватка твоего Господа, когда Он схватил селения, которые были неправедны. Поистине, хватка Его мучительна, сильна!", "n": null, "c": null}, {"ref": "29:40", "sura": "Al-Ankaboot", "sura_ar": "سُورَةُ العَنكَبُوتِ", "type": "Meccan", "ar": "فَكُلًّا أَخَذْنَا بِذَنۢبِهِۦ ۖ فَمِنْهُم مَّنْ أَرْسَلْنَا عَلَيْهِ حَاصِبًۭا وَمِنْهُم مَّنْ أَخَذَتْهُ ٱلصَّيْحَةُ وَمِنْهُم مَّنْ خَسَفْنَا بِهِ ٱلْأَرْضَ وَمِنْهُم مَّنْ أَغْرَقْنَا ۚ وَمَا كَانَ ٱللَّهُ لِيَظْلِمَهُمْ وَلَٰكِن كَانُوٓا۟ أَنفُسَهُمْ يَظْلِمُونَ ﴿40﴾", "ru": "И всех Мы взяли за их грех: на некоторых из них Мы послали вихрь, некоторых постиг вопль, некоторых из них Мы заставили поглотить землю, некоторых Мы потопили. Аллах не был таким, чтобы их тиранить, но они сами себя тиранили!", "n": "Одних Бог погубил бурей с камнями, других — криком, третьих — землетрясением, четвёртых — потоплением: перечень массовых казней целых народов.", "c": null}, {"ref": "91:14-15", "sura": "Ash-Shams", "sura_ar": "سُورَةُ الشَّمۡسِ", "type": "Meccan", "ar": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا ﴿14﴾ وَلَا يَخَافُ عُقْبَٰهَا ﴿15﴾", "ru": "(14) И сочли они его лжецом и подрезали ее, и истребил их Господь их за их прегрешение и уравнял это, (15) не страшась последствий этого.", "n": "О народе Самуд: «истребил их Господь их за их прегрешение и уравнял это, не страшась последствий этого».", "c": null}, {"ref": "68:44-45", "sura": "Al-Qalam", "sura_ar": "سُورَةُ القَلَمِ", "type": "Meccan", "ar": "فَذَرْنِى وَمَن يُكَذِّبُ بِهَٰذَا ٱلْحَدِيثِ ۖ سَنَسْتَدْرِجُهُم مِّنْ حَيْثُ لَا يَعْلَمُونَ ﴿44﴾ وَأُمْلِى لَهُمْ ۚ إِنَّ كَيْدِى مَتِينٌ ﴿45﴾", "ru": "(44) Оставь же Меня с тем, кто считает ложью этот рассказ; мы постепенно сведем их, так что они не узнают. (45) И отсрочу Я им, но ведь кознь Моя крепка.", "n": null, "c": null}]}, {"id": "fate", "title": "Предопределение и запечатанные сердца", "icon": "⛓", "group": "Насилие и жестокость", "intro": "Аяты, где Бог сам вводит людей в заблуждение, «запечатывает» их сердца и создаёт для геенны — а затем наказывает за неверие. Они противоречат свободе выбора (18:29, 76:3) и логике наказания.", "verses": [{"ref": "2:6-7", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ سَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ ﴿6﴾ خَتَمَ ٱللَّهُ عَلَىٰ قُلُوبِهِمْ وَعَلَىٰ سَمْعِهِمْ ۖ وَعَلَىٰٓ أَبْصَٰرِهِمْ غِشَٰوَةٌۭ ۖ وَلَهُمْ عَذَابٌ عَظِيمٌۭ ﴿7﴾", "ru": "(6) Поистине, те, которые не уверовали, - все равно им, увещевал ты их или не увещевал, - они не веруют. (7) Наложил печать Аллах на сердца их и на слух, а на взорах их - завеса. Для них - великое наказание!", "n": null, "c": null}, {"ref": "2:26", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "۞ إِنَّ ٱللَّهَ لَا يَسْتَحْىِۦٓ أَن يَضْرِبَ مَثَلًۭا مَّا بَعُوضَةًۭ فَمَا فَوْقَهَا ۚ فَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ فَيَعْلَمُونَ أَنَّهُ ٱلْحَقُّ مِن رَّبِّهِمْ ۖ وَأَمَّا ٱلَّذِينَ كَفَرُوا۟ فَيَقُولُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلًۭا ۘ يُضِلُّ بِهِۦ كَثِيرًۭا وَيَهْدِى بِهِۦ كَثِيرًۭا ۚ وَمَا يُضِلُّ بِهِۦٓ إِلَّا ٱلْفَٰسِقِينَ ﴿26﴾", "ru": "Поистине, Аллах не смущается приводить некоей притчей комара и то, что больше этого. А те, которые веровали, знают, что это - истина от их Господа. Те же, которые неверны, скажут: \"Что желает Аллах этим, как притчей?\" Он вводит этим в заблуждение многих и ведет прямым путем многих. Но сбивает Он этим только распутных,", "n": "Бог приводит притчу, вводит этим в заблуждение многих и ведёт многих; о мелком примере (комар) — 2:26.", "c": null}, {"ref": "4:88", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "۞ فَمَا لَكُمْ فِى ٱلْمُنَٰفِقِينَ فِئَتَيْنِ وَٱللَّهُ أَرْكَسَهُم بِمَا كَسَبُوٓا۟ ۚ أَتُرِيدُونَ أَن تَهْدُوا۟ مَنْ أَضَلَّ ٱللَّهُ ۖ وَمَن يُضْلِلِ ٱللَّهُ فَلَن تَجِدَ لَهُۥ سَبِيلًۭا ﴿88﴾", "ru": "Почему же вы в отношении лицемеров - две партии? Аллах низверг их за то, что они приобрели. Не хотите ли вы вывести на прямой путь тех, кого сбил Аллах? Ведь, если кого Аллах сбил, для того не найдешь дороги!", "n": "«Не хотите ли вы вывести на прямой путь тех, кого сбил Аллах?» — и дальше: кого Аллах сбил, тому ты не найдёшь пути.", "c": null}, {"ref": "4:155", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "فَبِمَا نَقْضِهِم مِّيثَٰقَهُمْ وَكُفْرِهِم بِـَٔايَٰتِ ٱللَّهِ وَقَتْلِهِمُ ٱلْأَنۢبِيَآءَ بِغَيْرِ حَقٍّۢ وَقَوْلِهِمْ قُلُوبُنَا غُلْفٌۢ ۚ بَلْ طَبَعَ ٱللَّهُ عَلَيْهَا بِكُفْرِهِمْ فَلَا يُؤْمِنُونَ إِلَّا قَلِيلًۭا ﴿155﴾", "ru": "И за то, что они нарушили их завет, и не веровали в знамения Аллаха и избивали пророков без права, и говорили: \"Сердца наши не обрезаны\". (Нет! Аллах наложил печать на них за их неверие, и веруют они только мало),", "n": null, "c": null}, {"ref": "6:25", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَمِنْهُم مَّن يَسْتَمِعُ إِلَيْكَ ۖ وَجَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَن يَفْقَهُوهُ وَفِىٓ ءَاذَانِهِمْ وَقْرًۭا ۚ وَإِن يَرَوْا۟ كُلَّ ءَايَةٍۢ لَّا يُؤْمِنُوا۟ بِهَا ۚ حَتَّىٰٓ إِذَا جَآءُوكَ يُجَٰدِلُونَكَ يَقُولُ ٱلَّذِينَ كَفَرُوٓا۟ إِنْ هَٰذَآ إِلَّآ أَسَٰطِيرُ ٱلْأَوَّلِينَ ﴿25﴾", "ru": "Среди них есть такие, что прислушиваются к тебе, но Мы положили на сердца их покровы, чтобы они не поняли его, а в уши их - глухоту. Хотя они и не видят всякое знамение, но не верят в него. А когда они приходят к тебе, препираются, то говорят те, которые не веровали: \"Это - только сказки первых!\"", "n": null, "c": null}, {"ref": "6:39", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا صُمٌّۭ وَبُكْمٌۭ فِى ٱلظُّلُمَٰتِ ۗ مَن يَشَإِ ٱللَّهُ يُضْلِلْهُ وَمَن يَشَأْ يَجْعَلْهُ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ ﴿39﴾", "ru": "А те, которые считали ложью Наши знамения, - глухи, немы, во мраке. Кого желает Аллах, того сбивает с пути, а кого желает, того помещает на прямой дороге.", "n": null, "c": null}, {"ref": "6:110", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَنُقَلِّبُ أَفْـِٔدَتَهُمْ وَأَبْصَٰرَهُمْ كَمَا لَمْ يُؤْمِنُوا۟ بِهِۦٓ أَوَّلَ مَرَّةٍۢ وَنَذَرُهُمْ فِى طُغْيَٰنِهِمْ يَعْمَهُونَ ﴿110﴾", "ru": "И Мы переворачиваем сердца их и взоры, как они не уверовали в это в первый раз, и оставляем их скитаться слепо в своем заблуждении.", "n": null, "c": null}, {"ref": "6:125", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "فَمَن يُرِدِ ٱللَّهُ أَن يَهْدِيَهُۥ يَشْرَحْ صَدْرَهُۥ لِلْإِسْلَٰمِ ۖ وَمَن يُرِدْ أَن يُضِلَّهُۥ يَجْعَلْ صَدْرَهُۥ ضَيِّقًا حَرَجًۭا كَأَنَّمَا يَصَّعَّدُ فِى ٱلسَّمَآءِ ۚ كَذَٰلِكَ يَجْعَلُ ٱللَّهُ ٱلرِّجْسَ عَلَى ٱلَّذِينَ لَا يُؤْمِنُونَ ﴿125﴾", "ru": "Кого пожелает Аллах вести прямо, уширяет тому грудь для ислама, а кого пожелает сбить с пути, делает грудь его узкой, тесной, как будто бы он поднимается на небо. Так Аллах направляет наказание на тех, которые не веруют!", "n": null, "c": null}, {"ref": "7:178-179", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "مَن يَهْدِ ٱللَّهُ فَهُوَ ٱلْمُهْتَدِى ۖ وَمَن يُضْلِلْ فَأُو۟لَٰٓئِكَ هُمُ ٱلْخَٰسِرُونَ ﴿178﴾ وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيرًۭا مِّنَ ٱلْجِنِّ وَٱلْإِنسِ ۖ لَهُمْ قُلُوبٌۭ لَّا يَفْقَهُونَ بِهَا وَلَهُمْ أَعْيُنٌۭ لَّا يُبْصِرُونَ بِهَا وَلَهُمْ ءَاذَانٌۭ لَّا يَسْمَعُونَ بِهَآ ۚ أُو۟لَٰٓئِكَ كَٱلْأَنْعَٰمِ بَلْ هُمْ أَضَلُّ ۚ أُو۟لَٰٓئِكَ هُمُ ٱلْغَٰفِلُونَ ﴿179﴾", "ru": "(178) Кого ведет Аллах, тот идет по прямому пути; а кого Он сбивает, те - понесшие убыток. (179) Мы сотворили для геенны много джиннов и людей: у них сердца, которыми они не понимают, глаза, которыми они не видят, уши, которыми не слышат. Они - как скоты, даже более заблудшие. Они - находящиеся в невнимательности.", "n": "«Кого ведёт Аллах, тот идёт по прямому пути; а кого Он сбивает, те — понёсшие убыток. Мы сотворили для геенны много джиннов и людей… Они — как скоты, даже более заблудшие».", "c": null}, {"ref": "10:99-100", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "وَلَوْ شَآءَ رَبُّكَ لَءَامَنَ مَن فِى ٱلْأَرْضِ كُلُّهُمْ جَمِيعًا ۚ أَفَأَنتَ تُكْرِهُ ٱلنَّاسَ حَتَّىٰ يَكُونُوا۟ مُؤْمِنِينَ ﴿99﴾ وَمَا كَانَ لِنَفْسٍ أَن تُؤْمِنَ إِلَّا بِإِذْنِ ٱللَّهِ ۚ وَيَجْعَلُ ٱلرِّجْسَ عَلَى ٱلَّذِينَ لَا يَعْقِلُونَ ﴿100﴾", "ru": "(99) А если бы пожелал твой Господь, тогда уверовали бы все, кто на земле, целиком. Разве ж ты вынудишь людей к тому, что они станут верующими? (100) Не придется душе уверовать, иначе как с соизволения Аллаха. И возложит Он наказание на тех, которые не разумеют.", "n": "Если бы пожелал твой Господь, тогда уверовали бы все, кто на земле, целиком. Разве ж ты вынудишь людей к тому, чтобы они стали верующими? Не придётся душе уверовать, иначе как с соизволения Аллаха.", "c": null}, {"ref": "11:34", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "وَلَا يَنفَعُكُمْ نُصْحِىٓ إِنْ أَرَدتُّ أَنْ أَنصَحَ لَكُمْ إِن كَانَ ٱللَّهُ يُرِيدُ أَن يُغْوِيَكُمْ ۚ هُوَ رَبُّكُمْ وَإِلَيْهِ تُرْجَعُونَ ﴿34﴾", "ru": "И не поможет вам мой совет, если я пожелаю посоветовать вам, если Аллах пожелает вас сбить. Он - ваш Господь, и к Нему вы будете возвращены\".", "n": "Нух говорит: «Не поможет вам мой совет… если Аллах пожелает вас сбить».", "c": null}, {"ref": "14:4", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "وَمَآ أَرْسَلْنَا مِن رَّسُولٍ إِلَّا بِلِسَانِ قَوْمِهِۦ لِيُبَيِّنَ لَهُمْ ۖ فَيُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ ﴿4﴾", "ru": "Мы отправляли посланников только с языком их народа, чтобы они разъясняли им. Аллах сводит с пути, кого пожелает, и ведет, кого желает. Он - великий, мудрый!", "n": null, "c": null}, {"ref": "16:93", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَلَوْ شَآءَ ٱللَّهُ لَجَعَلَكُمْ أُمَّةًۭ وَٰحِدَةًۭ وَلَٰكِن يُضِلُّ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَلَتُسْـَٔلُنَّ عَمَّا كُنتُمْ تَعْمَلُونَ ﴿93﴾", "ru": "А если бы Аллах пожелал, Он сделал бы вас одним народом. Однако, Он сбивает, кого хочет, и ведет прямым путем, кого хочет, и будете вы спрошены о том, что творили.", "n": null, "c": null}, {"ref": "36:8-10", "sura": "Yaseen", "sura_ar": "سُورَةُ يسٓ", "type": "Meccan", "ar": "إِنَّا جَعَلْنَا فِىٓ أَعْنَٰقِهِمْ أَغْلَٰلًۭا فَهِىَ إِلَى ٱلْأَذْقَانِ فَهُم مُّقْمَحُونَ ﴿8﴾ وَجَعَلْنَا مِنۢ بَيْنِ أَيْدِيهِمْ سَدًّۭا وَمِنْ خَلْفِهِمْ سَدًّۭا فَأَغْشَيْنَٰهُمْ فَهُمْ لَا يُبْصِرُونَ ﴿9﴾ وَسَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ ﴿10﴾", "ru": "(8) Мы поместили на шее у них оковы до подбородка, и они вынуждены поднять головы. (9) Мы устроили перед ними преграду и позади их преграду и закрыли их, и они не видят. (10) И одинаково для них, увещаешь ты их или не увещаешь: они не веруют.", "n": "Оковы на шеях, преграда впереди и позади; «одинаково для них, увещаешь ты их или не увещаешь: они не веруют».", "c": null}, {"ref": "45:23", "sura": "Al-Jaathiya", "sura_ar": "سُورَةُ الجَاثِيَةِ", "type": "Meccan", "ar": "أَفَرَءَيْتَ مَنِ ٱتَّخَذَ إِلَٰهَهُۥ هَوَىٰهُ وَأَضَلَّهُ ٱللَّهُ عَلَىٰ عِلْمٍۢ وَخَتَمَ عَلَىٰ سَمْعِهِۦ وَقَلْبِهِۦ وَجَعَلَ عَلَىٰ بَصَرِهِۦ غِشَٰوَةًۭ فَمَن يَهْدِيهِ مِنۢ بَعْدِ ٱللَّهِ ۚ أَفَلَا تَذَكَّرُونَ ﴿23﴾", "ru": "Разве ты не видел того, кто взял своим богом страсть, и Аллах сбил его с пути при Своем знании и положил печать на его слух и сердце, а на его зрение положил завесу. Кто же его поведет после Аллаха? Разве вы не опомнитесь?", "n": "О том, кто взял своим богом страсть: «Аллах сбил его с пути при Своём знании и положил печать на его слух и сердце, а на его зрение положил завесу».", "c": null}, {"ref": "57:22", "sura": "Al-Hadid", "sura_ar": "سُورَةُ الحَدِيدِ", "type": "Medinan", "ar": "مَآ أَصَابَ مِن مُّصِيبَةٍۢ فِى ٱلْأَرْضِ وَلَا فِىٓ أَنفُسِكُمْ إِلَّا فِى كِتَٰبٍۢ مِّن قَبْلِ أَن نَّبْرَأَهَآ ۚ إِنَّ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٌۭ ﴿22﴾", "ru": "Ничто не постигает из событий на земле или в ваших душах, без того чтобы его не было в писании раньше, чем Мы создадим это. Поистине, это легко для Аллаха! -", "n": null, "c": null}, {"ref": "76:30", "sura": "Al-Insaan", "sura_ar": "سُورَةُ الإِنسَانِ", "type": "Medinan", "ar": "وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ ۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿30﴾", "ru": "Но не пожелаете вы, если не пожелает Аллах, - поистине, Аллах - мудрый, знающий!", "n": null, "c": "Противоречит 18:29 кто хочет — пусть уверует, а кто хочет — пусть не верует."}]}, {"id": "women", "title": "Положение женщин", "icon": "♀", "group": "Люди и общество", "intro": "Нормы о браке, свидетельстве, наследстве и семейном праве, в которых права мужчины и женщины различаются.", "verses": [{"ref": "4:34", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "ٱلرِّجَالُ قَوَّٰمُونَ عَلَى ٱلنِّسَآءِ بِمَا فَضَّلَ ٱللَّهُ بَعْضَهُمْ عَلَىٰ بَعْضٍۢ وَبِمَآ أَنفَقُوا۟ مِنْ أَمْوَٰلِهِمْ ۚ فَٱلصَّٰلِحَٰتُ قَٰنِتَٰتٌ حَٰفِظَٰتٌۭ لِّلْغَيْبِ بِمَا حَفِظَ ٱللَّهُ ۚ وَٱلَّٰتِى تَخَافُونَ نُشُوزَهُنَّ فَعِظُوهُنَّ وَٱهْجُرُوهُنَّ فِى ٱلْمَضَاجِعِ وَٱضْرِبُوهُنَّ ۖ فَإِنْ أَطَعْنَكُمْ فَلَا تَبْغُوا۟ عَلَيْهِنَّ سَبِيلًا ۗ إِنَّ ٱللَّهَ كَانَ عَلِيًّۭا كَبِيرًۭا ﴿34﴾", "ru": "Мужья стоят над женами за то, что Аллах дал одним преимущество перед другими, и за то, что они расходуют из своего имущества. И порядочные женщины - благоговейны, сохраняют тайное в том, что хранит Аллах. А тех, непокорности которых вы боитесь, увещайте и покидайте их на ложах и ударяйте их. И если они повинятся вам, то не ищите пути против них, - поистине, Аллах возвышен, велик!", "n": "Мужья «стоят над» женами; тех, чьей непокорности боятся, нужно увещать, покидать на ложах и ударять (в других переводах — бить).", "c": "Часть современных толкователей предлагает понимать бить символически (тронуть зубочисткой); классическая традиция допускала побои без нанесения увечий."}, {"ref": "2:223", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "نِسَآؤُكُمْ حَرْثٌۭ لَّكُمْ فَأْتُوا۟ حَرْثَكُمْ أَنَّىٰ شِئْتُمْ ۖ وَقَدِّمُوا۟ لِأَنفُسِكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّكُم مُّلَٰقُوهُ ۗ وَبَشِّرِ ٱلْمُؤْمِنِينَ ﴿223﴾", "ru": "Ваши жены - нива для вас, ходите на вашу ниву, когда пожелаете и уготовывайте для самих себя, и бойтесь Аллаха, и знайте, что вы его встретите, - и обрадуй верующих!", "n": null, "c": null}, {"ref": "2:228", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱلْمُطَلَّقَٰتُ يَتَرَبَّصْنَ بِأَنفُسِهِنَّ ثَلَٰثَةَ قُرُوٓءٍۢ ۚ وَلَا يَحِلُّ لَهُنَّ أَن يَكْتُمْنَ مَا خَلَقَ ٱللَّهُ فِىٓ أَرْحَامِهِنَّ إِن كُنَّ يُؤْمِنَّ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ ۚ وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِى ذَٰلِكَ إِنْ أَرَادُوٓا۟ إِصْلَٰحًۭا ۚ وَلَهُنَّ مِثْلُ ٱلَّذِى عَلَيْهِنَّ بِٱلْمَعْرُوفِ ۚ وَلِلرِّجَالِ عَلَيْهِنَّ دَرَجَةٌۭ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌ ﴿228﴾", "ru": "А разведенные выжидают сами с собой три периода, и не разреша
