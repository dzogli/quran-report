ухи, немы, во мраке. Кого желает Аллах, того сбивает с пути, а кого желает, того помещает на прямой дороге."}, {"ref": "6:125", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "فَمَن يُرِدِ ٱللَّهُ أَن يَهْدِيَهُۥ يَشْرَحْ صَدْرَهُۥ لِلْإِسْلَٰمِ ۖ وَمَن يُرِدْ أَن يُضِلَّهُۥ يَجْعَلْ صَدْرَهُۥ ضَيِّقًا حَرَجًۭا كَأَنَّمَا يَصَّعَّدُ فِى ٱلسَّمَآءِ ۚ كَذَٰلِكَ يَجْعَلُ ٱللَّهُ ٱلرِّجْسَ عَلَى ٱلَّذِينَ لَا يُؤْمِنُونَ ﴿125﴾", "ru": "Кого пожелает Аллах вести прямо, уширяет тому грудь для ислама, а кого пожелает сбить с пути, делает грудь его узкой, тесной, как будто бы он поднимается на небо. Так Аллах направляет наказание на тех, которые не веруют!"}, {"ref": "14:4", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "وَمَآ أَرْسَلْنَا مِن رَّسُولٍ إِلَّا بِلِسَانِ قَوْمِهِۦ لِيُبَيِّنَ لَهُمْ ۖ فَيُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ ﴿4﴾", "ru": "Мы отправляли посланников только с языком их народа, чтобы они разъясняли им. Аллах сводит с пути, кого пожелает, и ведет, кого желает. Он - великий, мудрый!"}, {"ref": "16:93", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَلَوْ شَآءَ ٱللَّهُ لَجَعَلَكُمْ أُمَّةًۭ وَٰحِدَةًۭ وَلَٰكِن يُضِلُّ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَلَتُسْـَٔلُنَّ عَمَّا كُنتُمْ تَعْمَلُونَ ﴿93﴾", "ru": "А если бы Аллах пожелал, Он сделал бы вас одним народом. Однако, Он сбивает, кого хочет, и ведет прямым путем, кого хочет, и будете вы спрошены о том, что творили."}, {"ref": "10:99-100", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "وَلَوْ شَآءَ رَبُّكَ لَءَامَنَ مَن فِى ٱلْأَرْضِ كُلُّهُمْ جَمِيعًا ۚ أَفَأَنتَ تُكْرِهُ ٱلنَّاسَ حَتَّىٰ يَكُونُوا۟ مُؤْمِنِينَ ﴿99﴾ وَمَا كَانَ لِنَفْسٍ أَن تُؤْمِنَ إِلَّا بِإِذْنِ ٱللَّهِ ۚ وَيَجْعَلُ ٱلرِّجْسَ عَلَى ٱلَّذِينَ لَا يَعْقِلُونَ ﴿100﴾", "ru": "(99) А если бы пожелал твой Господь, тогда уверовали бы все, кто на земле, целиком. Разве ж ты вынудишь людей к тому, что они станут верующими? (100) Не придется душе уверовать, иначе как с соизволения Аллаха. И возложит Он наказание на тех, которые не разумеют."}, {"ref": "11:34", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "وَلَا يَنفَعُكُمْ نُصْحِىٓ إِنْ أَرَدتُّ أَنْ أَنصَحَ لَكُمْ إِن كَانَ ٱللَّهُ يُرِيدُ أَن يُغْوِيَكُمْ ۚ هُوَ رَبُّكُمْ وَإِلَيْهِ تُرْجَعُونَ ﴿34﴾", "ru": "И не поможет вам мой совет, если я пожелаю посоветовать вам, если Аллах пожелает вас сбить. Он - ваш Господь, и к Нему вы будете возвращены\"."}], "n": "Что сказано: «Аллах сводит с пути, кого пожелает, и ведёт, кого желает» (14:4; так же 16:93, 6:39); «Кого пожелает Аллах вести прямо, уширяет тому грудь для ислама, а кого пожелает сбить с пути, делает грудь его узкой, тесной, как будто бы он поднимается на небо» (6:125); «Не придётся душе уверовать иначе как с соизволения Аллаха» (10:100); Нух: ⟦Не поможет вам мой совет, если Аллах пожелает вас сбить⟧ (11:34).\nВ чём проблема: вера и неверие поставлены в зависимость от желания Бога, и всё же неверных ждёт ад. Критики: либо Бог не всесилен (люди выбирают сами), либо Он несправедлив (наказывает за то, что Сам определил).\nКак отвечают верующие: в 2:26 сказано, что Он ⟦вводит в заблуждение только нечестивых⟧ — то есть уже выбравших. Но 6:125 и 10:100 так не объясняются.", "c": null, "x": ["18:29", "2:7", "4:79"], "t": "Бог сводит с пути, кого хочет", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Бог сводит с пути, кого хочет», и неверных ждёт ад. Напряжение с 18:29."}, {"refs": ["7:178-179", "57:22", "76:30"], "parts": [{"ref": "7:178-179", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "مَن يَهْدِ ٱللَّهُ فَهُوَ ٱلْمُهْتَدِى ۖ وَمَن يُضْلِلْ فَأُو۟لَٰٓئِكَ هُمُ ٱلْخَٰسِرُونَ ﴿178﴾ وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيرًۭا مِّنَ ٱلْجِنِّ وَٱلْإِنسِ ۖ لَهُمْ قُلُوبٌۭ لَّا يَفْقَهُونَ بِهَا وَلَهُمْ أَعْيُنٌۭ لَّا يُبْصِرُونَ بِهَا وَلَهُمْ ءَاذَانٌۭ لَّا يَسْمَعُونَ بِهَآ ۚ أُو۟لَٰٓئِكَ كَٱلْأَنْعَٰمِ بَلْ هُمْ أَضَلُّ ۚ أُو۟لَٰٓئِكَ هُمُ ٱلْغَٰفِلُونَ ﴿179﴾", "ru": "(178) Кого ведет Аллах, тот идет по прямому пути; а кого Он сбивает, те - понесшие убыток. (179) Мы сотворили для геенны много джиннов и людей: у них сердца, которыми они не понимают, глаза, которыми они не видят, уши, которыми не слышат. Они - как скоты, даже более заблудшие. Они - находящиеся в невнимательности."}, {"ref": "57:22", "sura": "Al-Hadid", "sura_ar": "سُورَةُ الحَدِيدِ", "type": "Medinan", "ar": "مَآ أَصَابَ مِن مُّصِيبَةٍۢ فِى ٱلْأَرْضِ وَلَا فِىٓ أَنفُسِكُمْ إِلَّا فِى كِتَٰبٍۢ مِّن قَبْلِ أَن نَّبْرَأَهَآ ۚ إِنَّ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٌۭ ﴿22﴾", "ru": "Ничто не постигает из событий на земле или в ваших душах, без того чтобы его не было в писании раньше, чем Мы создадим это. Поистине, это легко для Аллаха! -"}, {"ref": "76:30", "sura": "Al-Insaan", "sura_ar": "سُورَةُ الإِنسَانِ", "type": "Medinan", "ar": "وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ ۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿30﴾", "ru": "Но не пожелаете вы, если не пожелает Аллах, - поистине, Аллах - мудрый, знающий!"}], "n": "Что сказано: «Мы сотворили для геенны много джиннов и людей» (7:179); всякое несчастье ⟦записано в писании раньше, чем Мы создадим это⟧ (57:22); ⟦Вы не пожелаете, если не пожелает Аллах⟧ (76:30; так же 81:29).\nВ чём проблема: если часть людей создана для ада, а всё записано заранее, то свободная воля человека иллюзорна, а ответственность под вопросом. Спорит с 18:29 и с 4:79 (⟦что дурное — от самого себя⟧); с 51:56 (созданы, чтобы поклоняться).", "c": null, "x": ["51:56", "18:29", "4:79"], "t": "Всё записано заранее", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Для геенны сотворены многие». Не согласуется с 51:56 и 18:29."}], "summary": ["Три сильные карточки: 2:7, 2:26, 7:178-179 против 18:29.", "Верующие отвечают различием «желать» и «одобрять».", "Это главная философская проблема Корана."]}, {"id": "women", "title": "Положение женщин", "icon": "♀", "group": "Люди и общество", "intro": "Нормы о браке, свидетельстве, наследстве и семейном праве, в которых права мужчины и женщины различаются.", "verses": [{"n": "Что сказано: «Мужья стоят над жёнами… А тех, непокорности которых вы боитесь, увещайте, и покидайте их на ложах, и ударяйте их. И если они повинятся вам, то не ищите пути против них».\nВ чём проблема: насилие над женой допущено как последняя мера воспитания; для мужа подобных мер в Коране нет. Слово «ударяйте» (в других переводах — ⟦бейте⟧) прямо стоит в тексте; современные богословы стараются смягчить смысл (символический удар), но слово при этом не меняется. Кроме того, «стоят над» закрепляет иерархию.\nКак отвечают верующие: классическая традиция допускала побои без нанесения увечий; другие читают ⟦удалить⟧ или ⟦оставить⟧.", "c": "Часть современных толкователей предлагает понимать ⟦бить⟧ символически (тронуть зубочисткой); классическая традиция допускала побои без нанесения увечий.", "x": ["2:228", "4:128"], "refs": ["4:34"], "parts": [{"ref": "4:34", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "ٱلرِّجَالُ قَوَّٰمُونَ عَلَى ٱلنِّسَآءِ بِمَا فَضَّلَ ٱللَّهُ بَعْضَهُمْ عَلَىٰ بَعْضٍۢ وَبِمَآ أَنفَقُوا۟ مِنْ أَمْوَٰلِهِمْ ۚ فَٱلصَّٰلِحَٰتُ قَٰنِتَٰتٌ حَٰفِظَٰتٌۭ لِّلْغَيْبِ بِمَا حَفِظَ ٱللَّهُ ۚ وَٱلَّٰتِى تَخَافُونَ نُشُوزَهُنَّ فَعِظُوهُنَّ وَٱهْجُرُوهُنَّ فِى ٱلْمَضَاجِعِ وَٱضْرِبُوهُنَّ ۖ فَإِنْ أَطَعْنَكُمْ فَلَا تَبْغُوا۟ عَلَيْهِنَّ سَبِيلًا ۗ إِنَّ ٱللَّهَ كَانَ عَلِيًّۭا كَبِيرًۭا ﴿34﴾", "ru": "Мужья стоят над женами за то, что Аллах дал одним преимущество перед другими, и за то, что они расходуют из своего имущества. И порядочные женщины - благоговейны, сохраняют тайное в том, что хранит Аллах. А тех, непокорности которых вы боитесь, увещайте и покидайте их на ложах и ударяйте их. И если они повинятся вам, то не ищите пути против них, - поистине, Аллах возвышен, велик!"}], "t": null, "at": "зависит от перевода или толкования", "pw": "средний", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. В аяте стоит слово «ударяйте». Спорят о том, что оно значит, но слово в тексте есть, а для мужа аналогичной меры нет."}, {"n": "Что сказано: «Ваши жёны — нива для вас, ходите на вашу ниву, когда пожелаете».\nВ чём проблема: жена сравнена с полем, которое муж ⟦возделывает⟧ когда захочет; согласие жены в аяте не упомянуто. Критики видят объективацию женщины; апологеты — образ плодородия и разрешение поз.", "c": null, "x": ["2:222"], "refs": ["2:223"], "parts": [{"ref": "2:223", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "نِسَآؤُكُمْ حَرْثٌۭ لَّكُمْ فَأْتُوا۟ حَرْثَكُمْ أَنَّىٰ شِئْتُمْ ۖ وَقَدِّمُوا۟ لِأَنفُسِكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّكُم مُّلَٰقُوهُ ۗ وَبَشِّرِ ٱلْمُؤْمِنِينَ ﴿223﴾", "ru": "Ваши жены - нива для вас, ходите на вашу ниву, когда пожелаете и уготовывайте для самих себя, и бойтесь Аллаха, и знайте, что вы его встретите, - и обрадуй верующих!"}], "t": null, "at": "зависит от перевода или толкования", "pw": "слабый", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. Образ «поле» двусмысленен."}, {"n": "Что сказано: Разведённые женщины ждут три цикла; ⟦у них — права, подобные обязанностям по обычаю, а у мужчин над ними — степень⟧.\nВ чём проблема: аят говорит о равных правах ⟦по обычаю⟧, но тут же закрепляет «степень» мужчин. Слово не определено: одни толкователи видят в нём право мужа вернуть жену в срок ожидания, другие — превосходство. Это основание для неравенства в семье (см. 4:34).", "c": null, "x": ["4:34"], "refs": ["2:228"], "parts": [{"ref": "2:228", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱلْمُطَلَّقَٰتُ يَتَرَبَّصْنَ بِأَنفُسِهِنَّ ثَلَٰثَةَ قُرُوٓءٍۢ ۚ وَلَا يَحِلُّ لَهُنَّ أَن يَكْتُمْنَ مَا خَلَقَ ٱللَّهُ فِىٓ أَرْحَامِهِنَّ إِن كُنَّ يُؤْمِنَّ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ ۚ وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِى ذَٰلِكَ إِنْ أَرَادُوٓا۟ إِصْلَٰحًۭا ۚ وَلَهُنَّ مِثْلُ ٱلَّذِى عَلَيْهِنَّ بِٱلْمَعْرُوفِ ۚ وَلِلرِّجَالِ عَلَيْهِنَّ دَرَجَةٌۭ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌ ﴿228﴾", "ru": "А разведенные выжидают сами с собой три периода, и не разрешается то, что сотворил Аллах с их утробами, если они веруют в Аллаха и в последний день. А мужьям их - достойнее их вернуть при этом, если они желают умиротворения. И для них - то же самое, что и на них, согласно принятому. Мужьям над ними - степень. Поистине, Аллах - великий, мудрый!"}], "t": null, "at": "зависит от перевода или толкования", "pw": "средний", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. «Степень» мужчин; смысл слова в тексте не определён."}, {"n": "Что сказано: Для долгового документа нужны два свидетеля-мужчины, ⟦а если нет двух мужчин — то один мужчина и две женщины из тех, кого вы одобряете, чтобы если одна из них ошибётся, напомнила другая⟧.\nВ чём проблема: свидетельство двух женщин приравнено к одному мужчине, и причина названа прямо — женщина ⟦ошибётся⟧. Это закрепляет неравенство и объясняет его меньшей надёжностью женщины.\nКак отвечают верующие: аят касается долговых документов; в VII веке женщины имели меньше торгового опыта.", "c": "Традиционное объяснение — меньший опыт женщин в торговле в VII веке; критики видят здесь закреплённое неравенство.", "x": ["4:11", "24:4"], "refs": ["2:282"], "parts": [{"ref": "2:282", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰٓ أَجَلٍۢ مُّسَمًّۭى فَٱكْتُبُوهُ ۚ وَلْيَكْتُب بَّيْنَكُمْ كَاتِبٌۢ بِٱلْعَدْلِ ۚ وَلَا يَأْبَ كَاتِبٌ أَن يَكْتُبَ كَمَا عَلَّمَهُ ٱللَّهُ ۚ فَلْيَكْتُبْ وَلْيُمْلِلِ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ وَلَا يَبْخَسْ مِنْهُ شَيْـًۭٔا ۚ فَإِن كَانَ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ سَفِيهًا أَوْ ضَعِيفًا أَوْ لَا يَسْتَطِيعُ أَن يُمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهُۥ بِٱلْعَدْلِ ۚ وَٱسْتَشْهِدُوا۟ شَهِيدَيْنِ مِن رِّجَالِكُمْ ۖ فَإِن لَّمْ يَكُونَا رَجُلَيْنِ فَرَجُلٌۭ وَٱمْرَأَتَانِ مِمَّن تَرْضَوْنَ مِنَ ٱلشُّهَدَآءِ أَن تَضِلَّ إِحْدَىٰهُمَا فَتُذَكِّرَ إِحْدَىٰهُمَا ٱلْأُخْرَىٰ ۚ وَلَا يَأْبَ ٱلشُّهَدَآءُ إِذَا مَا دُعُوا۟ ۚ وَلَا تَسْـَٔمُوٓا۟ أَن تَكْتُبُوهُ صَغِيرًا أَوْ كَبِيرًا إِلَىٰٓ أَجَلِهِۦ ۚ ذَٰلِكُمْ أَقْسَطُ عِندَ ٱللَّهِ وَأَقْوَمُ لِلشَّهَٰدَةِ وَأَدْنَىٰٓ أَلَّا تَرْتَابُوٓا۟ ۖ إِلَّآ أَن تَكُونَ تِجَٰرَةً حَاضِرَةًۭ تُدِيرُونَهَا بَيْنَكُمْ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَلَّا تَكْتُبُوهَا ۗ وَأَشْهِدُوٓا۟ إِذَا تَبَايَعْتُمْ ۚ وَلَا يُضَآرَّ كَاتِبٌۭ وَلَا شَهِيدٌۭ ۚ وَإِن تَفْعَلُوا۟ فَإِنَّهُۥ فُسُوقٌۢ بِكُمْ ۗ وَٱتَّقُوا۟ ٱللَّهَ ۖ وَيُعَلِّمُكُمُ ٱللَّهُ ۗ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌۭ ﴿282﴾", "ru": "О вы, которые уверовали! Если берете в долг между собой на определенный срок, то записывайте это. И пусть записывает между вами писец по справедливости. И пусть не отказывается писец написать так, как научил его Аллах, и пусть он пишет, и пусть диктует тот, на котором обязательство. И пусть он боится Аллаха, Господа своего, и пусть не убавляет там ничего. А если тот, на ком обязательство, малоумен или слаб, или не может сам диктовать, то пусть диктует его близкий по справедливости. И берите в свидетели двух из ваших мужчин. А если не будет двух мужчин, то - мужчину и двух женщин, на которых вы согласны, как свидетелей, чтобы если собьется одна, то напомнила бы ей другая. И пусть не отказываются свидетели, когда их зовут; и пусть не наскучивает вам записывать его - малым или большим - до его срока. Это - справедливее пред Аллахом, и прямее для свидетельства, и ближе, чтобы вам не сомневаться. Разве только, если это будет торговлей наличной, которую вы обращаете между собой, - тогда на вас не будет греха, что вы не запишете этого. И ставьте свидетелей, когда уславливаетесь между собой, и не должно причинять неприятности писцу и свидетелю; а если сделаете, то это - распутство у вас. И бойтесь Аллаха; поистине, Аллах вас учит, и Аллах знает о всякой вещи!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Показание двух женщин равно одному мужчине, причина названа в тексте («ошибётся»). Прямая этическая претензия."}, {"n": "Что сказано: ⟦Завещает вам Аллах относительно ваших детей: сыну — доля, подобная доле двух дочерей⟧.\nВ чём проблема: женщина наследует вдвое меньше брата. Помимо неравенства, у доли в 4:11-12 и 4:176 есть арифметическая проблема: в ряде случаев доли в сумме больше единицы (см. карточку ⟦Арифметика наследства⟧).\nКак отвечают верующие: мужчина обязан содержать семью, женщина — нет.", "c": "Апологеты указывают на то, что мужчина обязан содержать семью.", "x": ["4:12", "4:176"], "refs": ["4:11"], "parts": [{"ref": "4:11", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يُوصِيكُمُ ٱللَّهُ فِىٓ أَوْلَٰدِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ ٱلْأُنثَيَيْنِ ۚ فَإِن كُنَّ نِسَآءًۭ فَوْقَ ٱثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ ۖ وَإِن كَانَتْ وَٰحِدَةًۭ فَلَهَا ٱلنِّصْفُ ۚ وَلِأَبَوَيْهِ لِكُلِّ وَٰحِدٍۢ مِّنْهُمَا ٱلسُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُۥ وَلَدٌۭ ۚ فَإِن لَّمْ يَكُن لَّهُۥ وَلَدٌۭ وَوَرِثَهُۥٓ أَبَوَاهُ فَلِأُمِّهِ ٱلثُّلُثُ ۚ فَإِن كَانَ لَهُۥٓ إِخْوَةٌۭ فَلِأُمِّهِ ٱلسُّدُسُ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصِى بِهَآ أَوْ دَيْنٍ ۗ ءَابَآؤُكُمْ وَأَبْنَآؤُكُمْ لَا تَدْرُونَ أَيُّهُمْ أَقْرَبُ لَكُمْ نَفْعًۭا ۚ فَرِيضَةًۭ مِّنَ ٱللَّهِ ۗ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿11﴾", "ru": "Завещает вам Аллах относительно ваших детей: сыну - долю, подобную доле двух дочерей. А если они (дети)- женщины, числом больше двух, то им - две трети того, что он оставил, а если одна, то ей - половина. А родителям его, каждому из двух - одна шестая того, что он оставил, если у него есть ребенок. А если у него нет ребенка и ему наследуют его родители, то матери - одна треть. А если есть у него братья, то матери - одна шестая после завещанного, которой он завещает, или долга. Родители ваши или ваши сыновья - вы не знаете, кто из них ближе вам по пользе, как установлено Аллахом. Поистине, Аллах знающ, мудр!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Доля женщины вдвое меньше. Правило названо прямо; спорят о справедливости, а не о смысле."}, {"n": "Что сказано: ⟦Женитесь на тех, кто приятен вам из женщин, по две, по три, по четыре. А если вы боитесь, что не будете справедливы, то — на одной или на тех, кем овладели ваши десницы⟧.\nВ чём проблема: мужчине разрешено до четырёх жён, женщине — один муж. Условие — справедливость, но в 4:129 прямо сказано: ⟦вы никогда не сможете быть справедливыми между жёнами, как бы вы ни хотели⟧. Разрешение зависит от условия, которое Коран сам называет невыполнимым.\nКак отвечают верующие: справедливость относят к материальному содержанию, а не к чувствам.", "c": "Условие справедливости в 4:129 считают почти невыполнимым; на практике правило действует.", "x": ["4:129", "4:24", "23:5-6"], "refs": ["4:3"], "parts": [{"ref": "4:3", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَإِنْ خِفْتُمْ أَلَّا تُقْسِطُوا۟ فِى ٱلْيَتَٰمَىٰ فَٱنكِحُوا۟ مَا طَابَ لَكُم مِّنَ ٱلنِّسَآءِ مَثْنَىٰ وَثُلَٰثَ وَرُبَٰعَ ۖ فَإِنْ خِفْتُمْ أَلَّا تَعْدِلُوا۟ فَوَٰحِدَةً أَوْ مَا مَلَكَتْ أَيْمَٰنُكُمْ ۚ ذَٰلِكَ أَدْنَىٰٓ أَلَّا تَعُولُوا۟ ﴿3﴾", "ru": "А если вы боитесь, что не будете справедливы с сиротами, то женитесь на тех, что приятны вам, женщинах - и двух, и трех, и четырех. А если боитесь, что не будете справедливы, то - на одной или на тех, которыми овладели ваши десницы. Это - ближе, чтобы не уклониться"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Многоженство при условии справедливости, а 4:129 говорит, что справедливыми быть нельзя. Условие невыполнимо по самому тексту; верующие отвечают, что 4:129 о чувствах."}, {"n": "Что сказано: О сроке ожидания после развода: ⟦Для тех из ваших жён, которые уже отчаялись в месячных, — если сомневаетесь, их срок — три месяца; и для тех, у которых ещё не было месячных⟧.\nВ чём проблема: срок ожидания установлен для женщин, «у которых ещё не было месячных», то есть для девочек до половой зрелости. Раз развод и срок ожидания предусмотрены для них, значит, предполагается, что такие девочки могли состоять в браке. Коран нигде не устанавливает минимального возраста для брака.\nКак отвечают верующие: современные толкователи оспаривают такое прочтение; классические комментаторы понимали аят именно так.", "c": "Современные апологеты оспаривают такое прочтение; но оно было общепринятым в классической традиции.", "x": ["4:3"], "refs": ["65:4"], "parts": [{"ref": "65:4", "sura": "At-Talaaq", "sura_ar": "سُورَةُ الطَّلَاقِ", "type": "Medinan", "ar": "وَٱلَّٰٓـِٔى يَئِسْنَ مِنَ ٱلْمَحِيضِ مِن نِّسَآئِكُمْ إِنِ ٱرْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَٰثَةُ أَشْهُرٍۢ وَٱلَّٰٓـِٔى لَمْ يَحِضْنَ ۚ وَأُو۟لَٰتُ ٱلْأَحْمَالِ أَجَلُهُنَّ أَن يَضَعْنَ حَمْلَهُنَّ ۚ وَمَن يَتَّقِ ٱللَّهَ يَجْعَل لَّهُۥ مِنْ أَمْرِهِۦ يُسْرًۭا ﴿4﴾", "ru": "А те из ваших жен, которые уже отчаялись в месячных - если вы сомневаетесь, то их срок - три месяца, как и для тех, у которых еще не было месячных; а у которых ноша - их срок , чтобы они сложили свою ношу. Кто боится Аллаха, тому Он устроит в Своем деле легкость."}], "t": null, "at": "зависит от перевода или толкования", "pw": "средний", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. Срок ожидания для не имевших месячных; толкование спорно."}, {"n": "Что сказано: ⟦Развод — дважды: либо удержать по обычаю, либо отпустить с добром. Вам не дозволено брать из того, что вы им дали… если только они не боятся, что не будут соблюдать границы Аллаха; тогда нет греха на них обоих в том, чем она выкупится⟧.\nВ чём проблема: муж разводится одностороннее; жена, желающая уйти, должна ⟦выкупиться⟧ (вернуть дар). Права на развод неравны: у мужа — право, у жены — плата.", "c": null, "x": ["2:228"], "refs": ["2:229"], "parts": [{"ref": "2:229", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱلطَّلَٰقُ مَرَّتَانِ ۖ فَإِمْسَاكٌۢ بِمَعْرُوفٍ أَوْ تَسْرِيحٌۢ بِإِحْسَٰنٍۢ ۗ وَلَا يَحِلُّ لَكُمْ أَن تَأْخُذُوا۟ مِمَّآ ءَاتَيْتُمُوهُنَّ شَيْـًٔا إِلَّآ أَن يَخَافَآ أَلَّا يُقِيمَا حُدُودَ ٱللَّهِ ۖ فَإِنْ خِفْتُمْ أَلَّا يُقِيمَا حُدُودَ ٱللَّهِ فَلَا جُنَاحَ عَلَيْهِمَا فِيمَا ٱفْتَدَتْ بِهِۦ ۗ تِلْكَ حُدُودُ ٱللَّهِ فَلَا تَعْتَدُوهَا ۚ وَمَن يَتَعَدَّ حُدُودَ ٱللَّهِ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ ﴿229﴾", "ru": "Развод двукратен: после него - либо удержать, согласно обычаю, либо отпустить с благодеянием. И не дозволяется вам брать из того, что вы им даровали, ничего. Разве только они оба боятся не выполнить ограничений Аллаха. А если вы боитесь, что они не выполнят ограничений Аллаха, то не будет греха над ними в том, чем она себя выкупит. Таковы границы Аллаха, не преступайте же их, а если кто преступает границы Аллаха, те - неправедные."}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Развод по воле мужа, выкуп со стороны жены. Этическая претензия."}, {"n": "Что сказано: «Те из вас, что упокоятся и оставят жён, — они выжидают сами с собой четыре месяца и десять».\nВ чём проблема: срок траура/ожидания установлен только для вдов; для вдовца такого срока нет. Кроме того, 2:240 даёт иное правило для вдов — год содержания: два аята одной суры не согласованы (см. ⟦Отмена аятов⟧).", "c": null, "x": ["2:240"], "refs": ["2:234"], "parts": [{"ref": "2:234", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱلَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجًۭا يَتَرَبَّصْنَ بِأَنفُسِهِنَّ أَرْبَعَةَ أَشْهُرٍۢ وَعَشْرًۭا ۖ فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَلَا جُنَاحَ عَلَيْكُمْ فِيمَا فَعَلْنَ فِىٓ أَنفُسِهِنَّ بِٱلْمَعْرُوفِ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌۭ ﴿234﴾", "ru": "А те из вас, что упокоятся и оставят жен, - они выжидают сами с собой четыре месяца и десять. А когда они достигнут своего предела, то нет греха над вами в том, что они будут делать сами с собой согласно обычаю. Поистине, Аллах - сведущ в том, что вы делаете!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Срок только для вдов, а для вдовцов нет. Этическая претензия."}, {"n": "Что сказано: ⟦Вам — половина того, что оставили ваши супруги, если у них нет ребёнка… А им — четверть того, что вы оставили, если у вас нет ребёнка⟧.\nВ чём проблема: муж наследует вдвое больше, чем жена (1/2 против 1/4; при детях — 1/4 против 1/8). Кроме того, в сочетании с 4:11 и 4:176 в ряде случаев доли в сумме превышают единицу — см. ⟦Арифметика наследства⟧.", "c": null, "x": ["4:11", "4:176"], "refs": ["4:12"], "parts": [{"ref": "4:12", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "۞ وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَٰجُكُمْ إِن لَّمْ يَكُن لَّهُنَّ وَلَدٌۭ ۚ فَإِن كَانَ لَهُنَّ وَلَدٌۭ فَلَكُمُ ٱلرُّبُعُ مِمَّا تَرَكْنَ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصِينَ بِهَآ أَوْ دَيْنٍۢ ۚ وَلَهُنَّ ٱلرُّبُعُ مِمَّا تَرَكْتُمْ إِن لَّمْ يَكُن لَّكُمْ وَلَدٌۭ ۚ فَإِن كَانَ لَكُمْ وَلَدٌۭ فَلَهُنَّ ٱلثُّمُنُ مِمَّا تَرَكْتُم ۚ مِّنۢ بَعْدِ وَصِيَّةٍۢ تُوصُونَ بِهَآ أَوْ دَيْنٍۢ ۗ وَإِن كَانَ رَجُلٌۭ يُورَثُ كَلَٰلَةً أَوِ ٱمْرَأَةٌۭ وَلَهُۥٓ أَخٌ أَوْ أُخْتٌۭ فَلِكُلِّ وَٰحِدٍۢ مِّنْهُمَا ٱلسُّدُسُ ۚ فَإِن كَانُوٓا۟ أَكْثَرَ مِن ذَٰلِكَ فَهُمْ شُرَكَآءُ فِى ٱلثُّلُثِ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصَىٰ بِهَآ أَوْ دَيْنٍ غَيْرَ مُضَآرٍّۢ ۚ وَصِيَّةًۭ مِّنَ ٱللَّهِ ۗ وَٱللَّهُ عَلِيمٌ حَلِيمٌۭ ﴿12﴾", "ru": "И вам - половина того, что оставили ваши супруги, если у них нет ребенка. А если у них есть ребенок, то вам - четверть того, что они оставили после завещанного, которое они завещают, или долга. А им - четверть того, что оставили вы, если у вас нет ребенка. А если у вас есть ребенок, то им - одна восьмая того, что оставили вы после завещанного, которое вы завещаете, или долга. А если мужчина бывает наследником по боковой линии, или женщина, и у него есть брат или сестра, то каждому из них обоих - одна шестая. А если их больше этого, то они - соучастники в трети после завещанного, которое он завещает, или долга, не причиняя вреда, по завету от Аллаха. Поистине, Аллах - знающий, кроткий!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Муж наследует вдвое больше жены. Правило названо прямо."}, {"n": "Что сказано: «Не разрешается вам наследовать женам по принуждению. И не препятствуйте им уносить часть того, что вы им даровали, разве что они совершат мерзость очевидную».\nВ чём проблема: аят запрещает наследовать жён «по принуждению», то есть показывает, что жён наследовали как имущество. Он же допускает стеснять жену, ⟦если совершила мерзость очевидную⟧ — то есть можно ущемлять в имущественных правах.", "c": null, "x": ["4:15"], "refs": ["4:19"], "parts": [{"ref": "4:19", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا يَحِلُّ لَكُمْ أَن تَرِثُوا۟ ٱلنِّسَآءَ كَرْهًۭا ۖ وَلَا تَعْضُلُوهُنَّ لِتَذْهَبُوا۟ بِبَعْضِ مَآ ءَاتَيْتُمُوهُنَّ إِلَّآ أَن يَأْتِينَ بِفَٰحِشَةٍۢ مُّبَيِّنَةٍۢ ۚ وَعَاشِرُوهُنَّ بِٱلْمَعْرُوفِ ۚ فَإِن كَرِهْتُمُوهُنَّ فَعَسَىٰٓ أَن تَكْرَهُوا۟ شَيْـًۭٔا وَيَجْعَلَ ٱللَّهُ فِيهِ خَيْرًۭا كَثِيرًۭا ﴿19﴾", "ru": "О вы, которые уверовали! Не разрешается вам наследовать женам по принуждению. И не препятствуйте им уносить часть того, что вы им даровали, разве что они совершат мерзость очевидную. Обходитесь с ними достойно. Если же вы их ненавидите, то, может быть, что-либо вам и ненавистно, а Аллах устроил в этом великое благо."}], "t": null, "at": "расходится с историей или Библией", "pw": "слабый", "cl": "Вывод: возможное расхождение с историческими данными, подтверждений недостаточно. Аят запрещает наследовать жён по принуждению. Показывает старый обычай."}, {"n": "Что сказано: ⟦Скажи верующим женщинам: пусть потупляют взоры, охраняют свои члены, не показывают украшений, кроме видимого, пусть набрасывают покрывала на разрезы на груди… или тем, чем овладели их десницы⟧.\nВ чём проблема: для мужчин (24:30) требование ограничено ⟦потупить взор⟧; основное бремя скромности — на женщине. В списке тех, перед кем можно не скрывать украшений, названы ⟦те, кем овладели их десницы⟧ (рабы).", "c": null, "x": ["24:30", "33:59"], "refs": ["24:31"], "parts": [{"ref": "24:31", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَقُل لِّلْمُؤْمِنَٰتِ يَغْضُضْنَ مِنْ أَبْصَٰرِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا مَا ظَهَرَ مِنْهَا ۖ وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَىٰ جُيُوبِهِنَّ ۖ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا لِبُعُولَتِهِنَّ أَوْ ءَابَآئِهِنَّ أَوْ ءَابَآءِ بُعُولَتِهِنَّ أَوْ أَبْنَآئِهِنَّ أَوْ أَبْنَآءِ بُعُولَتِهِنَّ أَوْ إِخْوَٰنِهِنَّ أَوْ بَنِىٓ إِخْوَٰنِهِنَّ أَوْ بَنِىٓ أَخَوَٰتِهِنَّ أَوْ نِسَآئِهِنَّ أَوْ مَا مَلَكَتْ أَيْمَٰنُهُنَّ أَوِ ٱلتَّٰبِعِينَ غَيْرِ أُو۟لِى ٱلْإِرْبَةِ مِنَ ٱلرِّجَالِ أَوِ ٱلطِّفْلِ ٱلَّذِينَ لَمْ يَظْهَرُوا۟ عَلَىٰ عَوْرَٰتِ ٱلنِّسَآءِ ۖ وَلَا يَضْرِبْنَ بِأَرْجُلِهِنَّ لِيُعْلَمَ مَا يُخْفِينَ مِن زِينَتِهِنَّ ۚ وَتُوبُوٓا۟ إِلَى ٱللَّهِ جَمِيعًا أَيُّهَ ٱلْمُؤْمِنُونَ لَعَلَّكُمْ تُفْلِحُونَ ﴿31﴾", "ru": "И скажи [женщинам] верующим: пусть они потупляют свои взоры, и охраняют свои члены, и пусть не показывают своих украшений, разве только то, что видно из них, пусть набрасывают свои покрывала на разрезы на груди, пусть не показывают своих украшений, разве только своим мужьям, или своим отцам, или отцам своих мужей, или своим сыновьям, или сыновьям своих мужей, или своим братьям, или сыновьям своих братьев, или сыновьям своих сестер, или своим женщинам, или тем, чем овладели их десницы, или слугам из мужчин, которые не обладают желанием, или детям, которые не постигли наготы женщин; и пусть не бьют своими ногами, так чтобы узнавали, какие они скрывают украшения. Обратитесь все к Аллаху, о верующие, - может быть, вы окажетесь счастливыми!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Основное бремя скромности лежит на женщине. Этическая претензия."}, {"n": "Что сказано: Жёнам Пророка: ⟦Пребывайте в своих домах и не украшайтесь украшениями первого невежества⟧.\nВ чём проблема: ограничение выхода из дома адресовано жёнам Пророка, но на практике распространяется на всех женщин. В самом тексте это частное правило; вопрос — общая ли это норма.", "c": null, "x": ["33:59"], "refs": ["33:33"], "parts": [{"ref": "33:33", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "وَقَرْنَ فِى بُيُوتِكُنَّ وَلَا تَبَرَّجْنَ تَبَرُّجَ ٱلْجَٰهِلِيَّةِ ٱلْأُولَىٰ ۖ وَأَقِمْنَ ٱلصَّلَوٰةَ وَءَاتِينَ ٱلزَّكَوٰةَ وَأَطِعْنَ ٱللَّهَ وَرَسُولَهُۥٓ ۚ إِنَّمَا يُرِيدُ ٱللَّهُ لِيُذْهِبَ عَنكُمُ ٱلرِّجْسَ أَهْلَ ٱلْبَيْتِ وَيُطَهِّرَكُمْ تَطْهِيرًۭا ﴿33﴾", "ru": "Пребывайте в своих домах и не украшайтесь украшениями первого неведения. Выстаивайте молитву, давайте очищение и повинуйтесь Аллаху и Его посланнику. Аллах хочет удалить скверну от вас, семьи его дома и очистить вас очищением."}], "t": null, "at": "зависит от перевода или толкования", "pw": "слабый", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. Правило адресовано жёнам Пророка; вопрос об общей норме."}, {"n": "Что сказано: ⟦О пророк, скажи твоим жёнам, дочерям и женщинам верующих: пусть сближают на себе свои покрывала. Это лучше, чем их узнают; и не испытают они оскорбления⟧.\nВ чём проблема: причина покрывала названа прямо: чтобы женщин ⟦узнавали⟧ и ⟦не оскорбляли⟧. Защита от домогательств возложена на женщину (её одежду), а не на тех, кто оскорбляет. Критики видят логику ⟦вина жертвы⟧.\nКак отвечают верующие: это мера безопасности для женщин Медины.", "c": null, "x": ["24:31"], "refs": ["33:59"], "parts": [{"ref": "33:59", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ قُل لِّأَزْوَٰجِكَ وَبَنَاتِكَ وَنِسَآءِ ٱلْمُؤْمِنِينَ يُدْنِينَ عَلَيْهِنَّ مِن جَلَٰبِيبِهِنَّ ۚ ذَٰلِكَ أَدْنَىٰٓ أَن يُعْرَفْنَ فَلَا يُؤْذَيْنَ ۗ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًۭا ﴿59﴾", "ru": "О пророк, скажи твоим женам, дочерям и женщинам верующих, пусть они сближают на себе свои покрывала. Это лучше, чем их узнают; и не испытают они оскорбления. Аллах прощающ, милосерд!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Причина покрывала названа в тексте: «чтобы узнавали». Этическая претензия."}, {"n": "Что сказано: «Разве же тот, кто выращен в украшениях и кто в препирательстве не ясен?»\nВ чём проблема: о дочерях, которых многобожники приписывали Богу: женщина описана как существо украшений и неясной речи. Аят направлен против идолопоклонников, но использует уничижительный образ.", "c": "Аят направлен против идолопоклонников, но использует уничижительный образ женщины.", "x": ["53:21-22"], "refs": ["43:18"], "parts": [{"ref": "43:18", "sura": "Az-Zukhruf", "sura_ar": "سُورَةُ الزُّخۡرُفِ", "type": "Meccan", "ar": "أَوَمَن يُنَشَّؤُا۟ فِى ٱلْحِلْيَةِ وَهُوَ فِى ٱلْخِصَامِ غَيْرُ مُبِينٍۢ ﴿18﴾", "ru": "Разве же тот, кто выращен в украшениях и кто в препирательстве, не ясен?"}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Женщина описана как существо украшений в споре с многобожниками."}, {"n": "Что сказано: Многобожникам: «Неужели у вас — мужчины, а у Него — женщины? Это тогда — разделение обидное!»\nВ чём проблема: довод против приписывания Богу дочерей построен на том, что иметь дочерей — ⟦несправедливое⟧ положение; а в 16:58-59 рождение дочери описано как позор для отца. Коран осуждает идолопоклонников, но использует их же шкалу ценностей.", "c": null, "x": ["43:18"], "refs": ["53:21-22"], "parts": [{"ref": "53:21-22", "sura": "An-Najm", "sura_ar": "سُورَةُ النَّجۡمِ", "type": "Meccan", "ar": "أَلَكُمُ ٱلذَّكَرُ وَلَهُ ٱلْأُنثَىٰ ﴿21﴾ تِلْكَ إِذًۭا قِسْمَةٌۭ ضِيزَىٰٓ ﴿22﴾", "ru": "(21) Неужели у вас - мужчины, а у Него - женщины? (22) Это тогда - разделение обидное!"}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Довод строится на шкале ценностей многобожников."}], "summary": ["Сильные: 4:34, 2:282, 4:11, 4:3 с 4:129 — текст прямой.", "Слабые: 2:223, 2:222, 33:33 — зависят от толкования.", "Положительные нормы (права наследования, мехр) надо называть для баланса."]}, {"id": "family", "title": "Брак, родство и семья", "icon": "♡", "group": "Люди и общество", "intro": "Нормы о том, на ком можно и нельзя жениться, о приёмных детях и о разводе. Отдельно в разделе «Особые права и упрёки Пророку» — его собственные браки.", "verses": [{"n": "Что сказано: ⟦Не женитесь на тех, на ком женились ваши отцы, кроме того, что было. Это — мерзость и гнусность, и скверный путь⟧.\nВ чём проблема: аят показывает, что у арабов такие браки были, и запрещает их, прощая прошлые. Вопрос: если это «мерзость», почему прошлое прощено; и почему в списке 4:23 не названы двоюродные сёстры.", "c": null, "x": ["4:23"], "refs": ["4:22"], "parts": [{"ref": "4:22", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَلَا تَنكِحُوا۟ مَا نَكَحَ ءَابَآؤُكُم مِّنَ ٱلنِّسَآءِ إِلَّا مَا قَدْ سَلَفَ ۚ إِنَّهُۥ كَانَ فَٰحِشَةًۭ وَمَقْتًۭا وَسَآءَ سَبِيلًا ﴿22﴾", "ru": "Не женитесь на тех женщинах, на которых были женаты ваши отцы, разве только это произошло раньше. Поистине, это - мерзость и отвращение и скверно как путь!"}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Запрет браков с женой отца и прощение прошлого."}, {"n": "Что сказано: Запрещено жениться на матерях, дочерях, сёстрах, тётках, племянницах, ⟦молочных⟧ матерях и сёстрах, тёщах, падчерицах, жёнах родных сыновей и на двух сёстрах одновременно.\nВ чём проблема: двоюродные сёстры в список не входят (33:50 их прямо разрешает). Современная генетика связывает такие браки с повышенным риском наследственных болезней — а Коран их не ограничивает. ⟦Молочное родство⟧ расширяет круг запретов, но не объяснено.\nКак отвечают верующие: в VII веке браки между двоюродными были нормой.", "c": "В VII веке браки между двоюродными были нормой; ⟦молочное⟧ родство расширяет круг запретов.", "x": ["33:50"], "refs": ["4:23"], "parts": [{"ref": "4:23", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "حُرِّمَتْ عَلَيْكُمْ أُمَّهَٰتُكُمْ وَبَنَاتُكُمْ وَأَخَوَٰتُكُمْ وَعَمَّٰتُكُمْ وَخَٰلَٰتُكُمْ وَبَنَاتُ ٱلْأَخِ وَبَنَاتُ ٱلْأُخْتِ وَأُمَّهَٰتُكُمُ ٱلَّٰتِىٓ أَرْضَعْنَكُمْ وَأَخَوَٰتُكُم مِّنَ ٱلرَّضَٰعَةِ وَأُمَّهَٰتُ نِسَآئِكُمْ وَرَبَٰٓئِبُكُمُ ٱلَّٰتِى فِى حُجُورِكُم مِّن نِّسَآئِكُمُ ٱلَّٰتِى دَخَلْتُم بِهِنَّ فَإِن لَّمْ تَكُونُوا۟ دَخَلْتُم بِهِنَّ فَلَا جُنَاحَ عَلَيْكُمْ وَحَلَٰٓئِلُ أَبْنَآئِكُمُ ٱلَّذِينَ مِنْ أَصْلَٰبِكُمْ وَأَن تَجْمَعُوا۟ بَيْنَ ٱلْأُخْتَيْنِ إِلَّا مَا قَدْ سَلَفَ ۗ إِنَّ ٱللَّهَ كَانَ غَفُورًۭا رَّحِيمًۭا ﴿23﴾", "ru": "И запрещены вам ваши матери, и ваши дочери, и ваши сестры, и ваши тетки по отцу и матери, и дочери брата, и дочери сестры, и ваши матери, которые вас вскормили, и ваши сестры по кормлению, и матери ваших жен, и ваши воспитанницы, которые под вашим покровительством от ваших жен, к которым вы уже вошли; а если вы еще не вошли к ним, то нет греха на вас; и жены ваших сыновей, которые от ваших чресел; и - объединять двух сестер, если это не было раньше. Поистине, Аллах прощающ, милосерд!"}], "t": null, "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. Двоюродные в список не включены; вывод о здоровье не из текста."}, {"refs": ["33:4", "33:5", "33:40", "33:6"], "parts": [{"ref": "33:4", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "مَّا جَعَلَ ٱللَّهُ لِرَجُلٍۢ مِّن قَلْبَيْنِ فِى جَوْفِهِۦ ۚ وَمَا جَعَلَ أَزْوَٰجَكُمُ ٱلَّٰٓـِٔى تُظَٰهِرُونَ مِنْهُنَّ أُمَّهَٰتِكُمْ ۚ وَمَا جَعَلَ أَدْعِيَآءَكُمْ أَبْنَآءَكُمْ ۚ ذَٰلِكُمْ قَوْلُكُم بِأَفْوَٰهِكُمْ ۖ وَٱللَّهُ يَقُولُ ٱلْحَقَّ وَهُوَ يَهْدِى ٱلسَّبِيلَ ﴿4﴾", "ru": "Не устроил Аллах для человека двух сердец внутри, и не сделал ваших жен, которых вы называете хребтом матери, вашими матерями , и не сделал ваших приемышей вашими сыновьями. Это - только ваши слова в ваших устах, а Аллах говорит истину, и Он ведет по пути."}, {"ref": "33:5", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "ٱدْعُوهُمْ لِءَابَآئِهِمْ هُوَ أَقْسَطُ عِندَ ٱللَّهِ ۚ فَإِن لَّمْ تَعْلَمُوٓا۟ ءَابَآءَهُمْ فَإِخْوَٰنُكُمْ فِى ٱلدِّينِ وَمَوَٰلِيكُمْ ۚ وَلَيْسَ عَلَيْكُمْ جُنَاحٌۭ فِيمَآ أَخْطَأْتُم بِهِۦ وَلَٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْ ۚ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًا ﴿5﴾", "ru": "Возводите их к их отцам, это - более справедливее у Аллаха, а если не знаете их отцов, то это - ваши братья в вере и ваши близкие. Нет на вас греха, в чем вы ошиблись, а только в том, что замышляли ваши сердца. Аллах - прощающий, милосердный!"}, {"ref": "33:40", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "مَّا كَانَ مُحَمَّدٌ أَبَآ أَحَدٍۢ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ ٱللَّهِ وَخَاتَمَ ٱلنَّبِيِّۦنَ ۗ وَكَانَ ٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمًۭا ﴿40﴾", "ru": "Мухаммад не был отцом кого-либо из ваших мужчин, а только - посланником Аллаха и пророков. Аллах знает всякую вещь!"}, {"ref": "33:6", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "ٱلنَّبِىُّ أَوْلَىٰ بِٱلْمُؤْمِنِينَ مِنْ أَنفُسِهِمْ ۖ وَأَزْوَٰجُهُۥٓ أُمَّهَٰتُهُمْ ۗ وَأُو۟لُوا۟ ٱلْأَرْحَامِ بَعْضُهُمْ أَوْلَىٰ بِبَعْضٍۢ فِى كِتَٰبِ ٱللَّهِ مِنَ ٱلْمُؤْمِنِينَ وَٱلْمُهَٰجِرِينَ إِلَّآ أَن تَفْعَلُوٓا۟ إِلَىٰٓ أَوْلِيَآئِكُم مَّعْرُوفًۭا ۚ كَانَ ذَٰلِكَ فِى ٱلْكِتَٰبِ مَسْطُورًۭا ﴿6﴾", "ru": "Пророк ближе в верующим, чем они сами, а супруги его - их матери. И обладатели родства - одни ближе к другим по книге Аллаха, чем верующие и чем мухаджиры. Разве вы сделаете добро своим близким? Это в книге начертано."}], "n": "Что сказано: ⟦Не сделал Он ваших приёмышей вашими сыновьями⟧ (33:4); называйте их по отцам (33:5); ⟦Мухаммад — не отец никому из ваших мужчин⟧ (33:40); жёны Пророка — «матери» верующих (33:6).\nВ чём проблема: эти аяты образуют цепочку, подготавливающую и оправдывающую 33:37, где Бог женит Мухаммада на Зайнаб, бывшей жене его приёмного сына Зайда. Прежде такой брак считался недопустимым. Критики видят совпадение личной выгоды Пророка и божественного решения; верующие — отмену обычая усыновления. Вопрос: надо ли было отменять обычай именно на примере личной жизни Пророка.", "c": null, "x": ["33:37"], "t": "Усыновление отменено — и Пророк женится на жене приёмного сына", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Цепочка аятов подготавливает 33:37. Вывод о совпадении выгоды Пророка — допущение."}, {"refs": ["2:221", "5:5"], "parts": [{"ref": "2:221", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَلَا تَنكِحُوا۟ ٱلْمُشْرِكَٰتِ حَتَّىٰ يُؤْمِنَّ ۚ وَلَأَمَةٌۭ مُّؤْمِنَةٌ خَيْرٌۭ مِّن مُّشْرِكَةٍۢ وَلَوْ أَعْجَبَتْكُمْ ۗ وَلَا تُنكِحُوا۟ ٱلْمُشْرِكِينَ حَتَّىٰ يُؤْمِنُوا۟ ۚ وَلَعَبْدٌۭ مُّؤْمِنٌ خَيْرٌۭ مِّن مُّشْرِكٍۢ وَلَوْ أَعْجَبَكُمْ ۗ أُو۟لَٰٓئِكَ يَدْعُونَ إِلَى ٱلنَّارِ ۖ وَٱللَّهُ يَدْعُوٓا۟ إِلَى ٱلْجَنَّةِ وَٱلْمَغْفِرَةِ بِإِذْنِهِۦ ۖ وَيُبَيِّنُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَ ﴿221﴾", "ru": "Не женитесь на многобожницах, пока они не уверуют: конечно, верующая рабыня лучше многобожницы, хотя бы она и восторгала вас. И не выдавайте замуж за многобожников, пока они не уверуют: конечно, верующий раб - лучше многобожника, хотя бы он и восторгал вас. Эти зовут к огню, а Аллах зовет к раю и прощению со Своего дозволения и разъясняет Свои знамения людям, - может быть, они опомнятся!"}, {"ref": "5:5", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "ٱلْيَوْمَ أُحِلَّ لَكُمُ ٱلطَّيِّبَٰتُ ۖ وَطَعَامُ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ حِلٌّۭ لَّكُمْ وَطَعَامُكُمْ حِلٌّۭ لَّهُمْ ۖ وَٱلْمُحْصَنَٰتُ مِنَ ٱلْمُؤْمِنَٰتِ وَٱلْمُحْصَنَٰتُ مِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ مِن قَبْلِكُمْ إِذَآ ءَاتَيْتُمُوهُنَّ أُجُورَهُنَّ مُحْصِنِينَ غَيْرَ مُسَٰفِحِينَ وَلَا مُتَّخِذِىٓ أَخْدَانٍۢ ۗ وَمَن يَكْفُرْ بِٱلْإِيمَٰنِ فَقَدْ حَبِطَ عَمَلُهُۥ وَهُوَ فِى ٱلْءَاخِرَةِ مِنَ ٱلْخَٰسِرِينَ ﴿5﴾", "ru": "Сегодня разрешены вам блага; и пища тех, кому даровано писание, разрешается вам и ваша пища разрешается им. И целомудренные из верующих и целомудренные из тех, кому даровано писание до вас, если вы им дали их вознаграждение, будучи целомудренными, не распутничая и не беря наложниц. А если кто отрекся от веры, то у него - дело тщетно, и он в последней жизни - в числе потерпевших убыток\"."}], "n": "Что сказано: ⟦Не женитесь на многобожницах, пока они не уверуют: верующая рабыня лучше многобожницы⟧ (2:221); мужчинам разрешены ⟦целомудренные из тех, кому дано писание⟧ (5:5). Обратное (мусульманка за христианина) в тексте не разрешено.\nВ чём проблема: (1) Граница между ⟦многобожниками⟧ (запрещено) и ⟦людьми Писания⟧ (разрешено) неясна: в 5:73 христиане названы неверными. (2) Разрешение дано только мужчине; запрет для женщины в аятах не назван. (3) Вера определяет, на ком можно жениться.", "c": null, "x": ["5:73"], "t": "Браки с иноверцами", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Граница между «многобожниками» и «людьми Писания» неясна."}, {"n": "Что сказано: «Прелюбодей женится только на прелюбодейке или многобожнице, а прелюбодейка — на ней женится только прелюбодей или многобожник. И запрещено это для верующих».\nВ чём проблема: верующим запрещён брак с человеком, осуждённым за внебрачную связь; такой человек приравнен к многобожнику. Раскаяние в этом аяте не оговорено.", "c": null, "x": [], "refs": ["24:3"], "parts": [{"ref": "24:3", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "ٱلزَّانِى لَا يَنكِحُ إِلَّا زَانِيَةً أَوْ مُشْرِكَةًۭ وَٱلزَّانِيَةُ لَا يَنكِحُهَآ إِلَّا زَانٍ أَوْ مُشْرِكٌۭ ۚ وَحُرِّمَ ذَٰلِكَ عَلَى ٱلْمُؤْمِنِينَ ﴿3﴾", "ru": "Прелюбодей женится только на прелюбодейке или многобожнице, а прелюбодейка - на ней женится только прелюбодей или многобожник. И запрещено это для верующих."}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Запрет брака с блудником."}, {"n": "Что сказано: Трижды разведённая жена не дозволена мужу, ⟦пока она не выйдет замуж за другого мужа⟧.\nВ чём проблема: на этом основан обычай ⟦халяля⟧ (фиктивный брак для возврата жены): женщина становится средством для оформления возвращения. В самом аяте условие стоит как правило; к злоупотреблению аят не обязывает, но допускает.", "c": null, "x": [], "refs": ["2:230"], "parts": [{"ref": "2:230", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "فَإِن طَلَّقَهَا فَلَا تَحِلُّ لَهُۥ مِنۢ بَعْدُ حَتَّىٰ تَنكِحَ زَوْجًا غَيْرَهُۥ ۗ فَإِن طَلَّقَهَا فَلَا جُنَاحَ عَلَيْهِمَآ أَن يَتَرَاجَعَآ إِن ظَنَّآ أَن يُقِيمَا حُدُودَ ٱللَّهِ ۗ وَتِلْكَ حُدُودُ ٱللَّهِ يُبَيِّنُهَا لِقَوْمٍۢ يَعْلَمُونَ ﴿230﴾", "ru": "Если же он дал развод ей (в третий раз), то не разрешается она ему после, пока не выйдет она за другого мужа, а если тот дал ей развод, то нет греха над ними, что они вернутся, если думают выполнить ограничения Аллаха. И вот границы Аллаха; Он разъясняет их людям, которые обладают знанием."}], "t": null, "at": "зависит от перевода или толкования", "pw": "слабый", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. «Халяль» не следует из аята."}, {"n": "Что сказано: ⟦Они спрашивают тебя о месячных. Скажи: это — страдание (вред). Сторонитесь женщин во время месячных и не приближайтесь к ним, пока они не очистятся⟧.\nВ чём проблема: естественное физиологическое состояние названо ⟦страданием (вредом)⟧, а женщина в этот период — тем, от чего нужно ⟦сторониться⟧. Критики видят стигматизацию тела; современные богословы толкуют как заботу о женщине.", "c": null, "x": ["2:223"], "refs": ["2:222"], "parts": [{"ref": "2:222", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَيَسْـَٔلُونَكَ عَنِ ٱلْمَحِيضِ ۖ قُلْ هُوَ أَذًۭى فَٱعْتَزِلُوا۟ ٱلنِّسَآءَ فِى ٱلْمَحِيضِ ۖ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ يَطْهُرْنَ ۖ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ ٱللَّهُ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلتَّوَّٰبِينَ وَيُحِبُّ ٱلْمُتَطَهِّرِينَ ﴿222﴾", "ru": "Они спрашивают тебя о менструациях. Скажи: \"Это - страдание\". Отдаляйтесь же от женщин при менструациях и не приближайтесь к ним, пока они не очистятся. А когда они очистятся, то приходите к ним так, как приказал вам Аллах. Поистине, Аллах любит обращающихся и любит очищающихся!"}], "t": null, "at": "зависит от перевода или толкования", "pw": "слабый", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. «Страдание» допускает толкование как заботу."}, {"n": "Что сказано: ⟦Никогда вы не будете в состоянии быть справедливыми между жёнами, хотя бы и хотели⟧.\nВ чём проблема: 4:3 разрешает много жён при условии справедливости, а 4:129 сразу говорит, что достичь её нельзя. Значит, условие разрешения невыполнимо — внутреннее противоречие.\nКак отвечают верующие: справедливость — в содержании, а не в чувствах.", "c": "Традиция: справедливость относится к материальному содержанию, а не к чувствам.", "x": ["4:3"], "refs": ["4:129"], "parts": [{"ref": "4:129", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَلَن تَسْتَطِيعُوٓا۟ أَن تَعْدِلُوا۟ بَيْنَ ٱلنِّسَآءِ وَلَوْ حَرَصْتُمْ ۖ فَلَا تَمِيلُوا۟ كُلَّ ٱلْمَيْلِ فَتَذَرُوهَا كَٱلْمُعَلَّقَةِ ۚ وَإِن تُصْلِحُوا۟ وَتَتَّقُوا۟ فَإِنَّ ٱللَّهَ كَانَ غَفُورًۭا رَّحِيمًۭا ﴿129﴾", "ru": "И никогда вы не в состоянии быть справедливыми между женами, хотя бы и хотели этого. Не уклоняйтесь же всем уклонением, чтобы не оставить ее точно висящей. А если вы уладите и будете богобоязненными, то, поистине, Аллах прощающ, милосерд!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Условие 4:3 названо в самом Коране невыполнимым. Внутреннее противоречие по тексту, но верующие говорят о чувствах."}, {"refs": ["4:24"], "parts": [{"ref": "4:24", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "۞ وَٱلْمُحْصَنَٰتُ مِنَ ٱلنِّسَآءِ إِلَّا مَا مَلَكَتْ أَيْمَٰنُكُمْ ۖ كِتَٰبَ ٱللَّهِ عَلَيْكُمْ ۚ وَأُحِلَّ لَكُم مَّا وَرَآءَ ذَٰلِكُمْ أَن تَبْتَغُوا۟ بِأَمْوَٰلِكُم مُّحْصِنِينَ غَيْرَ مُسَٰفِحِينَ ۚ فَمَا ٱسْتَمْتَعْتُم بِهِۦ مِنْهُنَّ فَـَٔاتُوهُنَّ أُجُورَهُنَّ فَرِيضَةًۭ ۚ وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا تَرَٰضَيْتُم بِهِۦ مِنۢ بَعْدِ ٱلْفَرِيضَةِ ۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿24﴾", "ru": "И - замужние из женщин, если ими не овладели ваши десницы по писанию Аллаха над вами. И разрешено вам в том, что за этим, искать своим имуществом, соблюдая целомудрие, не распутничая. А за то, чем вы пользуетесь от них, давайте им их награду по установлению. И нет греха над вами, в чем вы согласитесь между собой после установления. Поистине, Аллах - знающий, мудрый!"}], "n": "Что сказано: «А за то, чем вы пользуетесь от них, давайте им их награду по установлению. И нет греха над вами, в чём вы согласитесь между собой после установления» (4:24).\nВ чём проблема: в переводе Крачковского фраза о ⟦пользовании⟧ и ⟦награде⟧ не уточняет, о чём идёт речь. Одни толкователи (в основном суннитские) понимают её как обычный брак с выплатой брачного дара; другие (шиитские) — как временный брак (мут'а), который предусматривает оговорённый срок и плату. Текст аята сам слов ⟦срок⟧ или ⟦временный⟧ не содержит; в других аятах (например, 23:5-6) сказано о сохранении целомудрия, и предмет спора в том, какое прочтение глагола верное. Поэтому довод о ⟦разрешении временного брака в Коране⟧ опирается на спорное толкование слова, а не на ясный текст. Поэтому аят следует приводить как предмет разногласий между школами, а не как однозначное разрешение. Для докладов о положении наложниц (первая часть аята про ⟦замужних⟧ и «ваши десницы») см. карточку ⟦Рабыни как законные партнёрши⟧ в разделе ⟦Рабство⟧.\nКак отвечают верующие: суннитские толкователи видят здесь обычный брак с мехром (брачным даром), шиитские — временный брак; в тексте нет слов, которые решают спор.", "c": null, "x": ["23:5-6", "4:25", "2:229"], "t": "4:24: «за то, чем вы пользуетесь от них, давайте им их награду»", "at": "зависит от перевода или толкования", "pw": "слабый", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. «Пользуетесь от них» читают по-разному (брак или временный брак)."}], "summary": ["Сильное внутреннее: 4:3 и 4:129.", "Остальное — этические и толковательные вопросы.", "4:24 — слабый довод (спор о слове)."]}, {"id": "slavery", "title": "Рабство и наложницы", "icon": "⛓", "group": "Люди и общество", "intro": "Коран признаёт институт рабства и допускает сексуальные отношения с рабынями. Он же поощряет освобождение рабов (напр., 24:33, 90:13), но самого института не отменяет.", "verses": [{"n": "Что сказано: Пророку разрешены жёны с брачным даром, ⟦те, кем овладела твоя десница из добычи⟧, двоюродные сёстры и ⟦верующая женщина, если она отдала самоё себя пророку, если пожелает пророк жениться на ней, — исключительно для тебя, помимо верующих⟧.\nВ чём проблема: у остальных верующих — не более четырёх жён (4:3), у Пророка — привилегия без лимита (позднее ограничена 33:52). Привилегия, которую Бог закрепил за одним человеком.", "c": "Традиционно — особая привилегия, ограниченная 33:52.", "x": ["4:3", "33:52", "33:53"], "refs": ["33:50"], "parts": [{"ref": "33:50", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ إِنَّآ أَحْلَلْنَا لَكَ أَزْوَٰجَكَ ٱلَّٰتِىٓ ءَاتَيْتَ أُجُورَهُنَّ وَمَا مَلَكَتْ يَمِينُكَ مِمَّآ أَفَآءَ ٱللَّهُ عَلَيْكَ وَبَنَاتِ عَمِّكَ وَبَنَاتِ عَمَّٰتِكَ وَبَنَاتِ خَالِكَ وَبَنَاتِ خَٰلَٰتِكَ ٱلَّٰتِى هَاجَرْنَ مَعَكَ وَٱمْرَأَةًۭ مُّؤْمِنَةً إِن وَهَبَتْ نَفْسَهَا لِلنَّبِىِّ إِنْ أَرَادَ ٱلنَّبِىُّ أَن يَسْتَنكِحَهَا خَالِصَةًۭ لَّكَ مِن دُونِ ٱلْمُؤْمِنِينَ ۗ قَدْ عَلِمْنَا مَا فَرَضْنَا عَلَيْهِمْ فِىٓ أَزْوَٰجِهِمْ وَمَا مَلَكَتْ أَيْمَٰنُهُمْ لِكَيْلَا يَكُونَ عَلَيْكَ حَرَجٌۭ ۗ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًۭا ﴿50﴾", "ru": "О пророк, Мы разрешили тебе твоими женами тех, которым ты дал их награду, и тех, которыми овладела твоя десница из того, что даровал Аллах тебе в добычу, и дочерей твоего дяди со стороны отца, и дочерей твоих теток со стороны отца, и дочерей твоего дяди со стороны матери, и дочерей твоих теток со стороны матери, которые выселились вместе с тобой, и верующую женщину, если она отдала самое себя пророку, если пророк пожелает жениться на ней, - исключительно для тебя, помимо верующих. Мы знаем, что Мы установили для них относительно их жен и того, чем овладели десницы их, для того. чтобы не было на тебе стеснения. Аллах - прощающ. милосерд!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Привилегия Пророка без лимита жён позднее ограничена. Этическая претензия."}, {"refs": ["23:5-6", "70:29-30", "4:24"], "parts": [{"ref": "23:5-6", "sura": "Al-Muminoon", "sura_ar": "سُورَةُ المُؤۡمِنُونَ", "type": "Meccan", "ar": "وَٱلَّذِينَ هُمْ لِفُرُوجِهِمْ حَٰفِظُونَ ﴿5﴾ إِلَّا عَلَىٰٓ أَزْوَٰجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَٰنُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ ﴿6﴾", "ru": "(5) которые хранят свои члены, (6) (кроме как от своих жен и того, чем овладела десница их, - ведь они не встретят упрека,"}, {"ref": "70:29-30", "sura": "Al-Ma'aarij", "sura_ar": "سُورَةُ المَعَارِجِ", "type": "Meccan", "ar": "وَٱلَّذِينَ هُمْ لِفُرُوجِهِمْ حَٰفِظُونَ ﴿29﴾ إِلَّا عَلَىٰٓ أَزْوَٰجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَٰنُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ ﴿30﴾", "ru": "(29) и тех, которые охраняют свои члены (30) только для своих жен или для того, чем овладели их десницы: они ведь не заслуживают порицания."}, {"ref": "4:24", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "۞ وَٱلْمُحْصَنَٰتُ مِنَ ٱلنِّسَآءِ إِلَّا مَا مَلَكَتْ أَيْمَٰنُكُمْ ۖ كِتَٰبَ ٱللَّهِ عَلَيْكُمْ ۚ وَأُحِلَّ لَكُم مَّا وَرَآءَ ذَٰلِكُمْ أَن تَبْتَغُوا۟ بِأَمْوَٰلِكُم مُّحْصِنِينَ غَيْرَ مُسَٰفِحِينَ ۚ فَمَا ٱسْتَمْتَعْتُم بِهِۦ مِنْهُنَّ فَـَٔاتُوهُنَّ أُجُورَهُنَّ فَرِيضَةًۭ ۚ وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا تَرَٰضَيْتُم بِهِۦ مِنۢ بَعْدِ ٱلْفَرِيضَةِ ۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿24﴾", "ru": "И - замужние из женщин, если ими не овладели ваши десницы по писанию Аллаха над вами. И разрешено вам в том, что за этим, искать своим имуществом, соблюдая целомудрие, не распутничая. А за то, чем вы пользуетесь от них, давайте им их награду по установлению. И нет греха над вами, в чем вы согласитесь между собой после установления. Поистине, Аллах - знающий, мудрый!"}], "n": "Что сказано: Верующие берегут целомудрие, ⟦кроме как со своими жёнами и теми, кем овладели их десницы, — тогда они не заслуживают порицания⟧ (23:5-6; 70:29-30); замужних женщин нельзя брать, ⟦кроме тех, кем овладели ваши десницы⟧ (4:24).\nВ чём проблема: рабыня (в том числе пленница, у которой есть муж) приравнена к законной партнёрше хозяина. В тексте нет упоминания согласия женщины; в 4:24 даже замужество не защищает пленницу. Коран не отменяет рабство и не ограничивает такие отношения (хотя поощряет освобождение: 24:33, 90:13).", "c": null, "x": ["33:50", "24:33"], "t": "Рабыни как законные партнёрши", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Рабыни приравнены к законным партнёршам без упоминания согласия; рабство не отменено. Прямо следует из текста."}, {"n": "Что сказано: Кто не может жениться на свободной, может на рабынях-⟦девушках⟧ с согласия хозяев; рабыням за прелюбодеяние — половина наказания свободных.\nВ чём проблема: рабыня оценена как менее значимая и распоряжается ею хозяин; наказание вдвое меньше, чем свободной (то есть ценность тела и чести разная).", "c": null, "x": ["24:2"], "refs": ["4:25"], "parts": [{"ref": "4:25", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَمَن لَّمْ يَسْتَطِعْ مِنكُمْ طَوْلًا أَن يَنكِحَ ٱلْمُحْصَنَٰتِ ٱلْمُؤْمِنَٰتِ فَمِن مَّا مَلَكَتْ أَيْمَٰنُكُم مِّن فَتَيَٰتِكُمُ ٱلْمُؤْمِنَٰتِ ۚ وَٱللَّهُ أَعْلَمُ بِإِيمَٰنِكُم ۚ بَعْضُكُم مِّنۢ بَعْضٍۢ ۚ فَٱنكِحُوهُنَّ بِإِذْنِ أَهْلِهِنَّ وَءَاتُوهُنَّ أُجُورَهُنَّ بِٱلْمَعْرُوفِ مُحْصَنَٰتٍ غَيْرَ مُسَٰفِحَٰتٍۢ وَلَا مُتَّخِذَٰتِ أَخْدَانٍۢ ۚ فَإِذَآ أُحْصِنَّ فَإِنْ أَتَيْنَ بِفَٰحِشَةٍۢ فَعَلَيْهِنَّ نِصْفُ مَا عَلَى ٱلْمُحْصَنَٰتِ مِنَ ٱلْعَذَابِ ۚ ذَٰلِكَ لِمَنْ خَشِىَ ٱلْعَنَتَ مِنكُمْ ۚ وَأَن تَصْبِرُوا۟ خَيْرٌۭ لَّكُمْ ۗ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ ﴿25﴾", "ru": "А кто из вас не обладает достатком, чтобы жениться на охраняемых верующих, то - из тех, которыми овладели десницы ваши, из ваших верующих рабынь. Поистине, Аллах лучше знает вашу веру. Вы - одни от других. Женитесь же на них с дозволения их семей и давайте им их плату с достоинством, - целомудренным, не распутничающим и не берущим приятелей. И если они были целомудренны... А если совершат мерзость, то им - половина того, что целомудренным, из наказания. Это - тем из вас, кто боится тягости. А если вы будете терпеливы, то это - лучше для вас. Поистине, Аллах - прощающий, милосердный!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Рабыня оценена как менее значимая. Этическая претензия."}, {"n": "Что сказано: «Ешьте же то, что вы взяли в добычу дозволенным, благим».\nВ чём проблема: добыча включает людей (пленных) и их имущество, и Бог называет её ⟦дозволенной и благой⟧. Рядом 8:67 упрекает за пленных вместо ⟦избиения⟧, а 8:70 говорит пленным о прощении — аяты согласованы плохо.", "c": null, "x": ["8:67-68", "8:70"], "refs": ["8:69"], "parts": [{"ref": "8:69", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "فَكُلُوا۟ مِمَّا غَنِمْتُمْ حَلَٰلًۭا طَيِّبًۭا ۚ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ ﴿69﴾", "ru": "Ешьте же то, что вы взяли в добычу дозволенным, благим, и бойтесь Аллаха: поистине, Аллах прощающ, милосерд!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Люди названы частью добычи."}, {"refs": ["16:75", "16:71", "30:28"], "parts": [{"ref": "16:75", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "۞ ضَرَبَ ٱللَّهُ مَثَلًا عَبْدًۭا مَّمْلُوكًۭا لَّا يَقْدِرُ عَلَىٰ شَىْءٍۢ وَمَن رَّزَقْنَٰهُ مِنَّا رِزْقًا حَسَنًۭا فَهُوَ يُنفِقُ مِنْهُ سِرًّۭا وَجَهْرًا ۖ هَلْ يَسْتَوُۥنَ ۚ ٱلْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ ﴿75﴾", "ru": "Приводит Аллах притчей раба - невольника, который не может ничего, и того, кого Мы наделили от Себя хорошим уделом, и он расходует из него тайно и явно. Разве они одинаковы? Хвала Аллаху! Но большая часть их не знает!"}, {"ref": "16:71", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَٱللَّهُ فَضَّلَ بَعْضَكُمْ عَلَىٰ بَعْضٍۢ فِى ٱلرِّزْقِ ۚ فَمَا ٱلَّذِينَ فُضِّلُوا۟ بِرَآدِّى رِزْقِهِمْ عَلَىٰ مَا مَلَكَتْ أَيْمَٰنُهُمْ فَهُمْ فِيهِ سَوَآءٌ ۚ أَفَبِنِعْمَةِ ٱللَّهِ يَجْحَدُونَ ﴿71﴾", "ru": "Аллах дал вам преимущество одним перед другими в жизненном уделе. но те, которым дано преимущество не вернут своей доли тем, кем овладела их десница, чтобы они оказались в этом равными. Неужели они отрицают милость Аллаха?"}, {"ref": "30:28", "sura": "Ar-Room", "sura_ar": "سُورَةُ الرُّومِ", "type": "Meccan", "ar": "ضَرَبَ لَكُم مَّثَلًۭا مِّنْ أَنفُسِكُمْ ۖ هَل لَّكُم مِّن مَّا مَلَكَتْ أَيْمَٰنُكُم مِّن شُرَكَآءَ فِى مَا رَزَقْنَٰكُمْ فَأَنتُمْ فِيهِ سَوَآءٌۭ تَخَافُونَهُمْ كَخِيفَتِكُمْ أَنفُسَكُمْ ۚ كَذَٰلِكَ نُفَصِّلُ ٱلْءَايَٰتِ لِقَوْمٍۢ يَعْقِلُونَ ﴿28﴾", "ru": "Он приводит вам пример из вас самих. Есть ли у вас из тех, кем овладели ваши десницы, сотоварищи в том, чем Мы вас наделили, и вы в этом равны? Боитесь ли вы их так, как боитесь самих себя? Так разъясняем Мы знамения для людей, которые разумны!"}], "n": "Что сказано: Раб, который ⟦ничем не распоряжается⟧ (16:75); Аллах дал ⟦преимущество одним перед другими в уделе⟧, но господа ⟦не вернут своей доли тем, кем овладела их десница, чтобы они оказались равными⟧ (16:71); «Есть ли у вас из тех, кем овладели ваши десницы, сотоварищи в том, чем Мы вас наделили, и вы в этом равны?» (30:28).\nВ чём проблема: Коран использует отношения ⟦хозяин — раб⟧ как естественные примеры для объяснения устройства мира и не осуждает их. Неравенство выдано за установление Бога. Рабство воспринимается как данность и даже как проявление божественного порядка.", "c": null, "x": [], "t": "Рабство как естественная иерархия в притчах", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Рабство подано как естественный порядок. Этическая претензия."}, {"n": "Что сказано: За случайное убийство верующего — «освобождение верующего раба» и вира.\nВ чём проблема: институт рабства принят как данность, освобождение — искупление. Положительная сторона — освобождение поощряется (24:33, 90:13); отрицательная — рабство не отменено.", "c": null, "x": ["24:33"], "refs": ["4:92"], "parts": [{"ref": "4:92", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَمَا كَانَ لِمُؤْمِنٍ أَن يَقْتُلَ مُؤْمِنًا إِلَّا خَطَـًۭٔا ۚ وَمَن قَتَلَ مُؤْمِنًا خَطَـًۭٔا فَتَحْرِيرُ رَقَبَةٍۢ مُّؤْمِنَةٍۢ وَدِيَةٌۭ مُّسَلَّمَةٌ إِلَىٰٓ أَهْلِهِۦٓ إِلَّآ أَن يَصَّدَّقُوا۟ ۚ فَإِن كَانَ مِن قَوْمٍ عَدُوٍّۢ لَّكُمْ وَهُوَ مُؤْمِنٌۭ فَتَحْرِيرُ رَقَبَةٍۢ مُّؤْمِنَةٍۢ ۖ وَإِن كَانَ مِن قَوْمٍۭ بَيْنَكُمْ وَبَيْنَهُم مِّيثَٰقٌۭ فَدِيَةٌۭ مُّسَلَّمَةٌ إِلَىٰٓ أَهْلِهِۦ وَتَحْرِيرُ رَقَبَةٍۢ مُّؤْمِنَةٍۢ ۖ فَمَن لَّمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ تَوْبَةًۭ مِّنَ ٱللَّهِ ۗ وَكَانَ ٱللَّهُ عَلِيمًا حَكِيمًۭا ﴿92﴾", "ru": "Не следует верующему убивать верующего, разве только по ошибке. А кто убьет верующего по ошибке, то - освобождение верующего раба и пеня, вручаемая его семье, если они не раздадут ее милостынею. А если он из народа враждебного вам и верующий, то - освобождение верующего раба. А если он из народа, между которым и вами договор, то - пеня, вручаемая его семье, и освобождение верующего раба. Кто же не найдет, то - пост двух месяцев последовательных как покаяние пред Аллахом. Поистине, Аллах - знающий, мудрый!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Рабство принято как данность; освобождение поощряется."}, {"n": "Что сказано: «Не принуждайте ваших девушек к распутству, если они хотят целомудрия»; рабов, просящих «записи» (о свободе), — записывать, «если знаете, что в них есть добро».\nВ чём проблема: запрет принуждения действует только если рабыня ⟦хочет целомудрия⟧; сам институт не отменён, а освобождение поставлено в зависимость от оценки хозяина (⟦есть в них добро⟧).", "c": "Запрет принуждения относится только к ⟦хотящим целомудрия⟧; сам институт рабства не отменён.", "x": ["4:25"], "refs": ["24:33"], "parts": [{"ref": "24:33", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَلْيَسْتَعْفِفِ ٱلَّذِينَ لَا يَجِدُونَ نِكَاحًا حَتَّىٰ يُغْنِيَهُمُ ٱللَّهُ مِن فَضْلِهِۦ ۗ وَٱلَّذِينَ يَبْتَغُونَ ٱلْكِتَٰبَ مِمَّا مَلَكَتْ أَيْمَٰنُكُمْ فَكَاتِبُوهُمْ إِنْ عَلِمْتُمْ فِيهِمْ خَيْرًۭا ۖ وَءَاتُوهُم مِّن مَّالِ ٱللَّهِ ٱلَّذِىٓ ءَاتَىٰكُمْ ۚ وَلَا تُكْرِهُوا۟ فَتَيَٰتِكُمْ عَلَى ٱلْبِغَآءِ إِنْ أَرَدْنَ تَحَصُّنًۭا لِّتَبْتَغُوا۟ عَرَضَ ٱلْحَيَوٰةِ ٱلدُّنْيَا ۚ وَمَن يُكْرِههُّنَّ فَإِنَّ ٱللَّهَ مِنۢ بَعْدِ إِكْرَٰهِهِنَّ غَفُورٌۭ رَّحِيمٌۭ ﴿33﴾", "ru": "И пусть будут воздержаны те, которые не находят возможности брака, пока не обогатит их Аллах Своей щедростью. А те, которые хотят записи (о свободе), из тех, которыми овладели десницы ваши, - записывайте их, если знаете, что в них есть добро, и давайте им из достояния Аллаха то, что Он дал вам; и не принуждайте ваших девушек к распутству, если они хотят целомудрия, стремясь к случайностям жизни ближней. А кто их вынудит... то ведь Аллах и после принуждения их - прощающий, милосердный!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Запрет принуждения только для «хотящей целомудрия». Этическая претензия."}], "summary": ["Рабство в Коране принято как данность; освобождение поощряется.", "Сильнее всего 23:5-6: рабыни как партнёрши без упоминания согласия."]}, {"id": "others", "title": "Многобожники и неверные", "icon": "✋", "group": "Люди и общество", "intro": "Как Коран говорит о людях другой веры: приказы дистанцироваться, оскорбительные характеристики, угрозы и проклятия.", "verses": [{"n": "Что сказано: ⟦Кто ищет не ислама как религии, от того не будет принято, и он в последней жизни окажется в числе потерпевших убыток⟧.\nВ чём проблема: объявлено, что принимается только ислам. Но в 2:62 и 5:69 иудеям, христианам и сабиям, ⟦которые уверовали в Аллаха и последний день и творили благое⟧, обещана награда без требования принять ислам. Часть толкователей считает, что 2:62 отменён 3:85; но 5:69 — другой аят, а отмена выглядит попыткой согласовать.", "c": null, "x": ["2:62", "5:69", "22:17", "3:19"], "refs": ["3:85"], "parts": [{"ref": "3:85", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَمَن يَبْتَغِ غَيْرَ ٱلْإِسْلَٰمِ دِينًۭا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِى ٱلْءَاخِرَةِ مِنَ ٱلْخَٰسِرِينَ ﴿85﴾", "ru": "Кто же ищет не ислама как религии, от того не будет принято, и он в последней жизни окажется в числе потерпевших убыток."}], "t": null, "at": "внутреннее противоречие", "pw": "сильный", "cl": "Вывод: прямое противоречие внутри текста, вопреки 4:82, где Коран утверждает, что противоречий в нём нет. «Не будет принято» ничего, кроме ислама, а в 2:62 награда людям Писания. Явное расхождение двух аятов (4:82); часть толкователей говорит об отмене."}, {"refs": ["3:28", "3:118", "4:144", "5:51", "5:57", "60:1", "60:4"], "parts": [{"ref": "3:28", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "لَّا يَتَّخِذِ ٱلْمُؤْمِنُونَ ٱلْكَٰفِرِينَ أَوْلِيَآءَ مِن دُونِ ٱلْمُؤْمِنِينَ ۖ وَمَن يَفْعَلْ ذَٰلِكَ فَلَيْسَ مِنَ ٱللَّهِ فِى شَىْءٍ إِلَّآ أَن تَتَّقُوا۟ مِنْهُمْ تُقَىٰةًۭ ۗ وَيُحَذِّرُكُمُ ٱللَّهُ نَفْسَهُۥ ۗ وَإِلَى ٱللَّهِ ٱلْمَصِيرُ ﴿28﴾", "ru": "Пусть верующие не берут себе близкими неверных помимо верующих. А кто сделает это, у того с Аллахом нет ничего общего, если вы только не будете опасаться их страхом. Аллах предостерегает вас от самого Себя, и к Аллаху - возвращение\"."}, {"ref": "3:118", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ بِطَانَةًۭ مِّن دُونِكُمْ لَا يَأْلُونَكُمْ خَبَالًۭا وَدُّوا۟ مَا عَنِتُّمْ قَدْ بَدَتِ ٱلْبَغْضَآءُ مِنْ أَفْوَٰهِهِمْ وَمَا تُخْفِى صُدُورُهُمْ أَكْبَرُ ۚ قَدْ بَيَّنَّا لَكُمُ ٱلْءَايَٰتِ ۖ إِن كُنتُمْ تَعْقِلُونَ ﴿118﴾", "ru": "О вы, которые уверовали! Не берите себе близких друзей, кроме вас самих. Они не преминут вам вредить, они хотели бы того, чтобы вы попали бы в беду. Обнаружилась ненависть из их уст, а то, что скрывают их груди больше. Мы разъяснили вам знамения, если вы разумны!"}, {"ref": "4:144", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ ٱلْكَٰفِرِينَ أَوْلِيَآءَ مِن دُونِ ٱلْمُؤْمِنِينَ ۚ أَتُرِيدُونَ أَن تَجْعَلُوا۟ لِلَّهِ عَلَيْكُمْ سُلْطَٰنًۭا مُّبِينًا ﴿144﴾", "ru": "О вы, которые уверовали! Не берите неверных друзьями вместо верующих. Разве вы хотите дать Аллаху ясный довод против вас?"}, {"ref": "5:51", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "۞ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ ٱلْيَهُودَ وَٱلنَّصَٰرَىٰٓ أَوْلِيَآءَ ۘ بَعْضُهُمْ أَوْلِيَآءُ بَعْضٍۢ ۚ وَمَن يَتَوَلَّهُم مِّنكُمْ فَإِنَّهُۥ مِنْهُمْ ۗ إِنَّ ٱللَّهَ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ ﴿51﴾", "ru": "О вы, которые уверовали! Не берите иудеев и христиан друзьями: они - друзья один другому. А если кто из вас берет их себе в друзья, тот и сам из них. Поистине, Аллах не ведет людей неправедных!"}, {"ref": "5:57", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ ٱلَّذِينَ ٱتَّخَذُوا۟ دِينَكُمْ هُزُوًۭا وَلَعِبًۭا مِّنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ مِن قَبْلِكُمْ وَٱلْكُفَّارَ أَوْلِيَآءَ ۚ وَٱتَّقُوا۟ ٱللَّهَ إِن كُنتُم مُّؤْمِنِينَ ﴿57﴾", "ru": "О вы, которые уверовали! Не берите друзьями тех, которые вашу религию принимают как насмешку и забаву, из тех, кому до вас даровано писание, и неверных. Бойтесь же Аллаха, если вы верующие!"}, {"ref": "60:1", "sura": "Al-Mumtahana", "sura_ar": "سُورَةُ المُمۡتَحنَةِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ عَدُوِّى وَعَدُوَّكُمْ أَوْلِيَآءَ تُلْقُونَ إِلَيْهِم بِٱلْمَوَدَّةِ وَقَدْ كَفَرُوا۟ بِمَا جَآءَكُم مِّنَ ٱلْحَقِّ يُخْرِجُونَ ٱلرَّسُولَ وَإِيَّاكُمْ ۙ أَن تُؤْمِنُوا۟ بِٱللَّهِ رَبِّكُمْ إِن كُنتُمْ خَرَجْتُمْ جِهَٰدًۭا فِى سَبِيلِى وَٱبْتِغَآءَ مَرْضَاتِى ۚ تُسِرُّونَ إِلَيْهِم بِٱلْمَوَدَّةِ وَأَنَا۠ أَعْلَمُ بِمَآ أَخْفَيْتُمْ وَمَآ أَعْلَنتُمْ ۚ وَمَن يَفْعَلْهُ مِنكُمْ فَقَدْ ضَلَّ سَوَآءَ ٱلسَّبِيلِ ﴿1﴾", "ru": "О вы, которые уверовали! Не берите друзьями Моего и вашего врага. Вы обращаетесь к ним с любовью, а они уверовали в то, что пришло к вам из истины. Они изгоняют посланника и вас за то, что вы веруете в Аллаха, Господа вашего. Когда вы вышли бороться на пути Моем и искать Моего благословения, вы скрывали к ним любовь. А Я лучше знаю, что вы скрывали и что вы обнаруживали. Кто сделает это из вас, тот уже сбился с верной дороги."}, {"ref": "60:4", "sura": "Al-Mumtahana", "sura_ar": "سُورَةُ المُمۡتَحنَةِ", "type": "Medinan", "ar": "قَدْ كَانَتْ لَكُمْ أُسْوَةٌ حَسَنَةٌۭ فِىٓ إِبْرَٰهِيمَ وَٱلَّذِينَ مَعَهُۥٓ إِذْ قَالُوا۟ لِقَوْمِهِمْ إِنَّا بُرَءَٰٓؤُا۟ مِنكُمْ وَمِمَّا تَعْبُدُونَ مِن دُونِ ٱللَّهِ كَفَرْنَا بِكُمْ وَبَدَا بَيْنَنَا وَبَيْنَكُمُ ٱلْعَدَٰوَةُ وَٱلْبَغْضَآءُ أَبَدًا حَتَّىٰ تُؤْمِنُوا۟ بِٱللَّهِ وَحْدَهُۥٓ إِلَّا قَوْلَ إِبْرَٰهِيمَ لِأَبِيهِ لَأَسْتَغْفِرَنَّ لَكَ وَمَآ أَمْلِكُ لَكَ مِنَ ٱللَّهِ مِن شَىْءٍۢ ۖ رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ ٱلْمَصِيرُ ﴿4﴾", "ru": "Был вам хороший пример в Ибрахиме и тех, кто был с ним. Вот сказали они своему народу: \"Мы не причастны к вам и к тому, чему вы поклоняетесь помимо Аллаха. Мы не веруем в вас. Началась между вами и нами ненависть и вражда навсегда, пока вы не уверуете в Аллаха единого... \" Если только не слова Ибрахима своему отцу: \"Я буду просить прощения для тебя; я не владею для тебя у Аллаха ничем. Господи наш, на Тебя мы положились и к Тебе обратились, и к Тебе возвращение!"}], "n": "Что сказано: ⟦Пусть верующие не берут близкими неверных помимо верующих⟧ (3:28); не берите «близких друзей, кроме вас самих» (3:118); не берите друзьями иудеев и христиан: ⟦кто из вас берёт их друзьями, тот из них⟧ (5:51); не берите друзьями «Моего и вашего врага» (60:1); Ибрахим: ⟦Между нами и вами — вражда и ненависть навсегда, пока вы не уверуете в Аллаха одного⟧ (60:4).\nВ чём проблема: дружба запрещена по признаку веры, а вражда объявлена «навсегда». Но в Коране есть и противоположные места: 60:8 (⟦Аллах не запрещает вам благодетельствовать тем, кто не сражался с вами, и быть справедливыми к ним⟧), 5:5 (пища и браки с людьми Писания), 29:46 (⟦не препирайтесь с обладателями книги иначе как лучшим способом⟧). Единого ответа нет.\nКак отвечают верующие: 60:8 относят к тем, кто не воюет с мусульманами.", "c": null, "x": ["60:8", "5:5", "29:46"], "t": "Запрет дружбы с неверными", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Запрет дружбы с неверными расходится с 60:8 и 5:5."}, {"n": "Что сказано: ⟦О вы, которые уверовали! Многобожники — только нечисты, пусть не приближаются они к запретной мечети после этого года⟧.\nВ чём проблема: люди названы ⟦нечистыми⟧ (наджас) по признаку веры, и им запрещён доступ в священное место. Но в 9:6 многобожнику, просящему убежища, велено дать приют.", "c": null, "x": ["9:6"], "refs": ["9:28"], "parts": [{"ref": "9:28", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِنَّمَا ٱلْمُشْرِكُونَ نَجَسٌۭ فَلَا يَقْرَبُوا۟ ٱلْمَسْجِدَ ٱلْحَرَامَ بَعْدَ عَامِهِمْ هَٰذَا ۚ وَإِنْ خِفْتُمْ عَيْلَةًۭ فَسَوْفَ يُغْنِيكُمُ ٱللَّهُ مِن فَضْلِهِۦٓ إِن شَآءَ ۚ إِنَّ ٱللَّهَ عَلِيمٌ حَكِيمٌۭ ﴿28﴾", "ru": "О вы, которые уверовали! Ведь многобожники - нечистота. Пусть же они не приближаются к мечети священной после этого года! А если вы боитесь недостатка, то обогатит вас Аллах от Своей щедрости, если пожелает. Поистине, Аллах - знающий, мудрый!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Нечистые» и запрет доступа расходятся с 9:6."}, {"n": "Что сказано: ⟦Поистине, те, которые не веровали из людей писания и многобожников, — в огне геенны, пребывая в нём вечно. Они — наихудшие из творений⟧.\nВ чём проблема: все неверные — и люди Писания (иудеи и христиане), и многобожники — объединены в одну категорию ⟦наихудших тварей⟧. Это расходится с 2:62 и 5:69, где людям Писания дана надежда, и с 60:8.", "c": null, "x": ["2:62", "5:69", "60:8"], "refs": ["98:6"], "parts": [{"ref": "98:6", "sura": "Al-Bayyina", "sura_ar": "سُورَةُ البَيِّنَةِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ فِى نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآ ۚ أُو۟لَٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ ﴿6﴾", "ru": "Поистине, те из обладателей писания и многобожников, которые не уверовали, - в огне геенны, - вечно пребывая там. Они - худшие из тварей."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Наихудшие твари» расходятся с 2:62 и 60:8."}, {"refs": ["8:55", "8:22", "25:44", "47:12", "2:171"], "parts": [{"ref": "8:55", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "إِنَّ شَرَّ ٱلدَّوَآبِّ عِندَ ٱللَّهِ ٱلَّذِينَ كَفَرُوا۟ فَهُمْ لَا يُؤْمِنُونَ ﴿55﴾", "ru": "Поистине, злейшие из животных у Аллаха - те, которые не веровали, и они не веруют, -"}, {"ref": "8:22", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "۞ إِنَّ شَرَّ ٱلدَّوَآبِّ عِندَ ٱللَّهِ ٱلصُّمُّ ٱلْبُكْمُ ٱلَّذِينَ لَا يَعْقِلُونَ ﴿22﴾", "ru": "Худшие из животных пред Аллахом - глухие, немые, которые не разумеют."}, {"ref": "25:44", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "أَمْ تَحْسَبُ أَنَّ أَكْثَرَهُمْ يَسْمَعُونَ أَوْ يَعْقِلُونَ ۚ إِنْ هُمْ إِلَّا كَٱلْأَنْعَٰمِ ۖ بَلْ هُمْ أَضَلُّ سَبِيلًا ﴿44﴾", "ru": "Или ты думаешь, что большинство слышит или разумеет? Они ведь только - как скоты и даже больше сбились с пути."}, {"ref": "47:12", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "إِنَّ ٱللَّهَ يُدْخِلُ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ ۖ وَٱلَّذِينَ كَفَرُوا۟ يَتَمَتَّعُونَ وَيَأْكُلُونَ كَمَا تَأْكُلُ ٱلْأَنْعَٰمُ وَٱلنَّارُ مَثْوًۭى لَّهُمْ ﴿12﴾", "ru": "Поистине, Аллах введет тех, которые уверовали и творили благие дела, в сады, где внизу текут реки. А те, которые не уверовали, наслаждаются и едят, как животные, и огонь - местопребывание их!"}, {"ref": "2:171", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَمَثَلُ ٱلَّذِينَ كَفَرُوا۟ كَمَثَلِ ٱلَّذِى يَنْعِقُ بِمَا لَا يَسْمَعُ إِلَّا دُعَآءًۭ وَنِدَآءًۭ ۚ صُمٌّۢ بُكْمٌ عُمْىٌۭ فَهُمْ لَا يَعْقِلُونَ ﴿171﴾", "ru": "Те, которые не веруют, подобны тому, который кричит на тех, что не слышат ничего, кроме зова и призыва: глухи, немы, слепы, - они и не разумеют!"}], "n": "Что сказано: «Худшие из животных пред Аллахом — глухие, немые, которые не разумеют» (8:22); ⟦наихудшие из животных — те, кто не уверовал⟧ (8:55); ⟦они только как скоты и даже больше сбились с пути⟧ (25:44); ⟦наслаждаются и едят, как едят скоты⟧ (47:12); неверные «глухи, немы, слепы» (2:171).\nВ чём проблема: людей, не принявших ислам, Коран называет ⟦худшими животными⟧. Это прямое уничижение по признаку веры. Кроме того, неверные описаны как неспособные слышать и понимать, но в 2:7 и 6:25 Бог Сам лишил их этой способности. Получается: Бог лишает людей слуха и разума, а потом называет их ⟦хуже животных⟧.", "c": null, "x": ["2:7", "6:25"], "t": "Неверные приравнены к животным", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Неверные названы «худшими животными». Этическая претензия."}, {"n": "Что сказано: ⟦Мы вселим ужас в сердца тех, которые не веровали, за то, что они приобщили к Аллаху то, чему Он не низвёл власти⟧.\nВ чём проблема: Бог лично внушает страх (как в 8:12), используя ужас как оружие. Причина названа — приобщение сотоварищей.", "c": null, "x": ["8:12"], "refs": ["3:151"], "parts": [{"ref": "3:151", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "سَنُلْقِى فِى قُلُوبِ ٱلَّذِينَ كَفَرُوا۟ ٱلرُّعْبَ بِمَآ أَشْرَكُوا۟ بِٱللَّهِ مَا لَمْ يُنَزِّلْ بِهِۦ سُلْطَٰنًۭا ۖ وَمَأْوَىٰهُمُ ٱلنَّارُ ۚ وَبِئْسَ مَثْوَى ٱلظَّٰلِمِينَ ﴿151﴾", "ru": "Мы ввергнем в сердца тех, которые не веровали, ужас за то, что они придавали Аллаху в сотоварищи то, к чему Он не ниспослал никакой власти. Убежище их - огонь, и скверно пребывание нечестивых!"}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Бог внушает страх."}, {"n": "Что сказано: «Мухаммад — посланник Аллаха, и те, которые с ним, — яростны против неверных, милостивы между собой».\nВ чём проблема: идеал верующего описан как ⟦ярость к неверным⟧ и милосердие лишь к своим. Спорит с 60:8 и 29:46, где велено быть справедливыми и ⟦лучшим образом⟧ спорить с людьми Писания.", "c": null, "x": ["60:8", "29:46"], "refs": ["48:29"], "parts": [{"ref": "48:29", "sura": "Al-Fath", "sura_ar": "سُورَةُ الفَتۡحِ", "type": "Medinan", "ar": "مُّحَمَّدٌۭ رَّسُولُ ٱللَّهِ ۚ وَٱلَّذِينَ مَعَهُۥٓ أَشِدَّآءُ عَلَى ٱلْكُفَّارِ رُحَمَآءُ بَيْنَهُمْ ۖ تَرَىٰهُمْ رُكَّعًۭا سُجَّدًۭا يَبْتَغُونَ فَضْلًۭا مِّنَ ٱللَّهِ وَرِضْوَٰنًۭا ۖ سِيمَاهُمْ فِى وُجُوهِهِم مِّنْ أَثَرِ ٱلسُّجُودِ ۚ ذَٰلِكَ مَثَلُهُمْ فِى ٱلتَّوْرَىٰةِ ۚ وَمَثَلُهُمْ فِى ٱلْإِنجِيلِ كَزَرْعٍ أَخْرَجَ شَطْـَٔهُۥ فَـَٔازَرَهُۥ فَٱسْتَغْلَظَ فَٱسْتَوَىٰ عَلَىٰ سُوقِهِۦ يُعْجِبُ ٱلزُّرَّاعَ لِيَغِيظَ بِهِمُ ٱلْكُفَّارَ ۗ وَعَدَ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ مِنْهُم مَّغْفِرَةًۭ وَأَجْرًا عَظِيمًۢا ﴿29﴾", "ru": "Мухаммад - посланник Аллаха, и те, которые с ним, - яростны против неверных, милостивы между собой. Ты видишь их преклоняющимися, падающими ниц. Они ищут милости от Аллаха и благоволения. Приметы их - на их лицах от следов падения ниц. Таков образ их в Торе, но в Евангелии образ их - посев, который извел свой побег и укрепил его; он стал твердым и выровнялся на стебле, восхищая сеятелей, - чтобы разъярить ими неверных. Обещал Аллах тем из них, которые уверовали и творили благое, прощение и великую награду!"}], "t": null, "a
