"slavery", "4:92", "средний"]]}, {"t": "Запрет жестоких и унижающих наказаний (ст. 5)", "x": "Отсечение рук, распятие, публичные плети, возмездие членовредительством, наказание зависит от статуса (2:178).", "l": [["punish", "5:33", "средний"], ["punish", "5:38", "средний"], ["punish", "24:2", "средний"], ["punish", "2:178", "средний"]]}, {"t": "Свобода слова и критики (ст. 19)", "x": "Критика религии обозначена как повод покинуть собрание (4:140) и среди причин войны (9:12); вопросы о религии связаны с угрозой неверия (5:101-102).", "l": [["critic", "4:140", "средний"], ["critic", "5:101-102", "средний"]]}, {"t": "Справедливый суд (ст. 10, 11)", "x": "Четыре свидетеля для обвинения в блуде, иначе — 80 плетей обвинителю (24:4); приговор «лицемерам» при непроверяемом основании (33:61).", "l": [["punish", "24:4", "средний"], ["violence", "33:61", "средний"]]}], "after": "Общий вывод по блоку: ряд норм текста, понятых буквально, не согласуется с принципами равенства, свободы совести и запрета жестоких наказаний. Это расхождение не зависит от доказательства противоречий внутри текста: оно следует из самих формулировок."}, {"h": "4. Расхождения с наукой, историей и Библией", "p": ["Здесь выводы осторожнее: ссылки на внешние данные формулируются как «критики указывают», потому что у верующих есть образное или частное прочтение. Сильным пунктом остаётся только то, что проверяемо по самому тексту."], "items": [{"t": "Хаман при Фараоне (28:38) и «сестра Харуна» (19:28)", "x": "Хаман в Библии — вельможа персидского царя (книга Есфирь), Харун и Имран жили на много веков раньше Марии. Критики указывают на смешение имён и эпох; верующие понимают как совпадение имён и оборот «из рода».", "l": [["history", "28:38", "средний"], ["history", "19:28", "средний"]]}, {"t": "Обещание рая за бой в Торе и Евангелии (9:111)", "x": "Утверждение проверяемо: такого обещания в Евангелиях не находят.", "l": [["violence", "9:111", "средний"]]}, {"t": "Описание Троицы (5:73, 5:116) и чудес Исы (3:49)", "x": "Троица описана иначе, чем в христианском учении; чудеса Исы совпадают с апокрифами, а не с каноническими Евангелиями.", "l": [["history", "5:116", "средний"], ["odd", "3:49", "средний"]]}, {"t": "Картина мира (18:86, 21:32, 16:15, 2:22)", "x": "Солнце закатывается в источник, небо — твёрдая крыша, горы удерживают землю от колебаний, земля — ковёр. Апологеты читают как образы; текст сам этого не оговаривает.", "l": [["cosmos", "18:86", "средний"], ["cosmos", "21:32", "средний"], ["cosmos", "16:15", "средний"]]}, {"t": "Сотворение за шесть дней и порядок творения", "x": "Количество и порядок дней неодинаковы в 41:9-12, 7:54 и 79:27-30; возраст Вселенной с шестью «днями» согласуется только при толковании «дня» как эпохи.", "l": [["contradictions", "41:9-12", "средний"], ["cosmos", "32:4", "средний"]]}]}, {"h": "5. Общий вывод: как такой текст может восприниматься и влиять на людей", "p": ["Предмет оценки — свойства текста, а не люди. Подавляющее большинство верующих читает Коран через комментарии и школу, смягчающие многие нормы. Но вопрос в том, что делает книга с читателем, который читает её напрямую или в выборочной подаче.", "(1) Безусловные формулировки. Часть приказов о насилии (9:5, 9:29, 9:123, 4:89) не содержит в самом аяте ограничения на конкретных противников или условие нападения. Читатель, не знающий контекста, воспринимает их как общее правило.", "(2) Отсутствие встроенного механизма согласования. Противоречащие аяты (2:256 и 9:5, 2:217 и 4:89) стоят рядом без указания, какой действует. Список отмен лежит вне текста, поэтому выбор аята определяется тем, кто читает и кому доверяет. Это делает текст пригодным и для миролюбивого, и для насильственного прочтения.", "(3) Религиозное обоснование насилия. Убийство в бою приписано Богу (8:17), награда за смерть названа раем и вечной жизнью (4:74, 9:111, 2:154), добыча — законной наградой (8:69). Для человека в состоянии кризиса и без критической подготовки это готовая система оправданий и мотивации.", "(4) Деление людей по вере. Иноверцы названы «наихудшими тварями», «нечистыми», «худшими животными» (98:6, 9:28, 8:55), а колеблющиеся внутри общины — «лицемерами», подлежащими суровости (9:73). Такое деление ослабляет сочувствие к «чужим» и создаёт повод для насилия внутри общины.", "(5) Закрытость от проверки. Сомнение и вопросы связаны с угрозой неверия и гнева Бога (5:101-102), критика — с поводом покинуть собрание и войны (4:140, 9:12), а доказательство божественного происхождения основано на самом тексте (2:23-24). Читателю труднее выработать критическое отношение.", "(6) Положение в обществе. Нормы о женщинах, рабстве, отступниках и телесных наказаниях при буквальном применении расходятся с принципами равенства и прав человека (блок 3). Для детей и подростков, воспитываемых в закрытой среде, такая картина мира может восприниматься как норма.", "Эти риски усиливаются у людей с неокрепшим мышлением: подростков, людей в кризисе, без образования и вне диалога с критически мыслящими. Публично известно, что вооружённые группировки ссылаются на аяты о войне (9:5, 9:29, 8:12, 47:4); вес этого фактора относительно других (политики, экономики, обстоятельств) — вопрос социологии, и в докладе он не оценивается.", "Предлагаемые выводы для обсуждения: (а) изучение текста должно включать исторический и критический разбор, а не только заучивание; (б) нормы, противоречащие правам человека, не должны применяться на основании религиозного авторитета, и приоритет остаётся за светским правом, защищающим человека; (в) воспитание детей не должно строиться на безусловных приказах и делении людей по вере без объяснения контекста; (г) публичный разговор о тексте должен быть открытым, а критика текста не должна приравниваться к преследованию людей."]}, {"h": "6. Главные контраргументы верующих и ответ на них", "obj": true}, {"h": "7. Что проверено и границы выводов", "p": ["Проверено: все приведённые цитаты сверены с текстом перевода Крачковского (проверка автоматическая: недословная цитата помечается пересказом); ссылки между карточками проверены. Не проверено: Коран не читался подряд целиком, новые материалы собирались по ключевым словам, поэтому пропуски возможны.", "Требуют сверки по первоисточникам: все сопоставления с Библией и историей (Хаман и книга Есфирь, «сестра Харуна», обещание в Евангелиях, Троица и апокрифы, Исход); значения арабских слов (фитна, макр, дараба, нафс); утверждения о позиции школ и об отмене аятов. Ответы верующих пересказаны обобщённо, без ссылок на конкретных толкователей.", "Оценки силы — суждения автора разбора. Для обсуждения с учёными важно, что слабые карточки (в первую очередь вопросы лексики, образных выражений и пробелов текста) показывают неоднозначность текста, но не опровергают его; их удобно использовать как иллюстрации, а не как основание для главных выводов."]}], "obj": [["Контекст войн VII века.", "Аяты о войне даны в условиях конфликта; верующие ссылаются на 2:190, 22:39, 9:4, 9:6, 60:8.", "Условие нападения названо не во всех аятах (9:5, 9:29, 9:36, 9:123); в тексте нет правила, какие аяты ограничены контекстом, а какие общие."], ["Отмена (насх): поздние аяты отменяют ранние.", "Противоречия объясняются хронологией откровения.", "Список отменённых аятов в Коране отсутствует, он составлен позднее; сам принцип спорит с 6:115, а порядок аятов в тексте не хронологический. Объяснение признаёт сам факт расхождения."], ["Метафора и образная речь.", "Образы Бога, космоса и ада понимаются как образные.", "Текст не указывает, какие места образные, а какие буквальные; выбор прочтения произволен и подбирается под результат."], ["Особенности арабского языка.", "Слова вроде «фитна», «дараба», «макр» многозначны.", "Тогда перевод нельзя считать однозначным, и приказ, который может быть понят как насилие, остаётся допустимым прочтением."], ["Различие «желать» и «одобрять».", "Бог допускает неверие, но не одобряет его (39:7).", "Тем не менее 6:149, 10:99, 16:93 говорят, что Бог мог бы повести всех и не пожелал; вопрос ответственности остаётся."], ["Коран как чудо, не нуждающееся во внешних доказательствах.", "Неподражаемость текста (2:23-24) — доказательство.", "Доказательство опирается на сам текст; критерия сравнения нет, а знамений Пророку не посылают (17:59)."], ["Большинство мусульман читает Коран мирно.", "Нормы смягчены традицией, школами и светским правом.", "Это верно, и мы не оцениваем людей. Но смягчение лежит вне текста, а текст остаётся доступным для буквального прочтения."]]};
const $ = s => document.querySelector(s);
const total = DATA.reduce((a,s)=>a+s.verses.length,0);
const esc = t => (t||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let cur = "home", q = "", fT = "", fP = "";
const TYPES = ["внутреннее противоречие","расходится с наукой","расходится с историей или Библией","этическая претензия","зависит от перевода или толкования"];
const fOk = v => (!fT||v.at===fT)&&(!fP||v.pw===fP);
const fOn = () => !!(fT||fP);

const GROUPS = [...new Set(DATA.map(s=>s.group))];
function navBtn(i){return `<button data-id="${i.id}" class="${i.id===cur&&q.length<2?"on":""}"><span class="ic">${i.icon}</span><span>${i.title}</span><span class="ct">${i.n}</span></button>`}
function buildNav(){
  let h = navBtn({id:"home",icon:"⌂",title:"Начало и методика",n:total}) + navBtn({id:"top",icon:"★",title:"Главные выводы",n:"★"});
  GROUPS.forEach(g=>{
    h += `<div class="gh">${g}</div>` + DATA.filter(s=>s.group===g).map(s=>navBtn({id:s.id,icon:s.icon,title:s.title,n:s.verses.length})).join("");
  });
  $("#nav").innerHTML = h;
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.id));
}

function ital(e){return e.replace(/⟦(.+?)⟧/g,"<i class=\"par\">$1</i>")}
function hl(t){
  const e = esc(t);
  if(q.length<2) return ital(e);
  const re = new RegExp("("+esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return ital(e.replace(re,"<mark>$1</mark>"));
}

function findCard(r,sid){
  let s=DATA.find(s=>s.id===sid&&s.verses.some(v=>v.refs.includes(r)));
  if(!s) s=DATA.find(s=>s.verses.some(v=>v.refs.includes(r)));
  if(!s) return null;
  return {s, v:s.verses.find(v=>v.refs.includes(r))};
}
function cid(sid,v){return "v-"+sid+"-"+v.refs[0].replace(/[:-]/g,"_")}
function refChip(r,sid){return findCard(r,sid)?`<a href="#" class="chip" data-goto="${r}" data-from="${sid}">${r}</a>`:`<a href="#" class="chip off" data-peek="${r}">${r}</a>`}
function partHtml(p,multi){
  const [s,a]=p.ref.split(":");
  return `<div class="part">
  <div class="ref"><span class="r">Сура ${s}, аят ${a}</span><span class="s">${p.sura} · ${p.sura_ar}</span><span class="tag">${p.type==="Meccan"?"Мекканская":"Мединская"}</span></div>
  <div class="ar" lang="ar">${p.ar}</div>
  <blockquote class="ru" style="margin-left:0">${multi?hl(p.ru):hl(p.ru)}</blockquote></div>`;
}
function card(v, secTitle, sid){
  const multi=v.parts.length>1;
  return `<article class="card" id="${cid(sid,v)}">
  ${v.t?`<h3 class="ct">${esc(v.t)}</h3>`:""}
  ${v.at?`<div class="badges"><span class="bd t">${esc(v.at)}</span><span class="bd p-${v.pw}">Сила: ${esc(v.pw)}</span></div>`:""}
  ${secTitle?`<div class="stag">${esc(secTitle)}</div>`:""}
  ${v.parts.map(p=>partHtml(p,multi)).join("")}
  ${v.n?`<p class="n"><b>В чём вопрос</b>${hl(v.n)}</p>`:""}
  ${v.x&&v.x.length?`<p class="x"><b>См. также</b>${v.x.map(r=>refChip(r,sid)).join(" ")}</p>`:""}
  ${v.cl?`<p class="cl">${hl(v.cl)}</p>`:""}
  ${v.c?`<p class="c"><b>Контекст / как отвечают</b>${hl(v.c)}</p>`:""}
  <div class="foot"><button class="copy" data-copy="${sid}|${v.refs[0]}">копировать</button></div>
  </article>`;
}

function home(){
  return `<h2>Критический доклад о Коране</h2>
  <p class="intro">Сборник аятов, сгруппированных по темам: насилие и жестокость, положение женщин, рабство, отношение к иноверцам, внутренние противоречия, особое положение Пророка, утверждения, расходящиеся с наукой. В каждой карточке — дословный текст (арабский оригинал и русский перевод), объяснение «в чём вопрос» и ссылки на связанные аяты. Похожие места объединены в одну карточку с общим разбором. Всего ${total} карточек в ${DATA.length} разделах.</p>
  ${GROUPS.map(g=>`<h3 class="gtitle">${g}</h3><div class="grid">${DATA.filter(s=>s.group===g).map(s=>`<div class="tile" data-id="${s.id}"><div class="big">${s.icon}</div><div class="t">${s.title}</div><div class="k">${s.verses.length} карточек</div></div>`).join("")}</div>`).join("")}
  <div class="note"><h3>Источник текстов</h3>Только Коран, без хадисов и других источников. Арабский текст — по Усмановскому списку (Tanzil), русский — перевод И. Ю. Крачковского (в общественном достоянии). Тексты загружены автоматически из открытой базы alquran.cloud, а не набраны вручную; нумерация аятов общепринятая. Если аят приведён диапазоном (например, 22:19-21), номера внутри текста указаны в скобках.</div>
  <div class="note"><h3>Как читать</h3><ul>
  <li><b>Рамка с курсивом</b> — дословный перевод аята.</li>
  <li><b>В чём вопрос</b> — простым языком: «Что сказано», «В чём проблема» и «Как отвечают верующие». Если аят спорит с другими аятами, они названы.</li>
  <li><b>См. также</b> — ссылки на другие аяты (противоречащие, повторяющие, поясняющие). Если такой аят есть в сборнике, ссылка кликабельна; пунктирные ссылки — аяты вне сборки: по клику показывается их текст. Всё, что в кавычках «…», — дословная цитата из того же перевода; <i class="par">курсив с пунктиром</i> — пересказ смысла (не дословно).</li>
  <li><b>Тип аргумента и сила</b> (значки над карточкой) и строка <b>Вывод</b>: тип — внутреннее противоречие, расхождение с наукой, с историей или Библией, этическая претензия либо зависимость от перевода/толкования; сила — сильный (два аята прямо противоречат или утверждение проверяемо и неверно по самому тексту), средний, слабый (опирается на неоднозначный перевод или допущение; такой довод легко оспорить). Фильтр по типу и силе — в меню слева. Сводка — на странице «Главные выводы».</li>
  <li><b>Контекст / как отвечают</b> — как этот аят объясняют сами мусульманские богословы и что сказано в соседних аятах; встречается не у всех карточек. Блок можно отключить в меню слева.</li>
  <li>Переводы отличаются: у Кулиева, Османова, Пороховой и др. формулировки иные. Для серьёзной работы сверяйте аяты по нескольким переводам.</li></ul></div>
  <div class="note"><h3>Что важно учитывать</h3><ul>
  <li>Многие аяты связаны с войнами VII века; в тексте не всегда есть оговорка об обстоятельствах, и именно это обсуждают богословы.</li>
  <li>Исламская традиция использует доктрину отмены (насх) и науку тафсира (комментарий). Критику стоит сопоставлять с ними, чтобы её нельзя было отвести как «вырванную из контекста».</li>
  <li>Апологеты толкуют антинаучные утверждения как метафоры; критики — что текст говорит буквально. Оба прочтения приведены.</li>
  <li>Один и тот же аят может встречаться в нескольких разделах, если он относится к нескольким темам.</li>
  <li>Раздел «Основы» показывает, что даёт сам Коран по вопросам «кто мусульманин», «кто говорит» и «образ Бога». Здесь же видно, чего в Коране нет (например, перечня «пяти столпов» как списка).</li></ul></div>`;
}

function pager(id){
  const ids=["home",...DATA.map(s=>s.id)], i=ids.indexOf(id);
  const t=x=>x==="home"?"Начало":DATA.find(s=>s.id===x).title;
  return `<div class="pager">${i>0?`<button data-id="${ids[i-1]}">← ${t(ids[i-1])}</button>`:"<span></span>"}${i<ids.length-1?`<button data-id="${ids[i+1]}">${t(ids[i+1])} →</button>`:""}</div>`;
}
function section(s){
  const vs=s.verses.filter(fOk);
  const sum=s.summary&&s.summary.length?`<div class="sum"><h3>Итог раздела</h3><ul>${s.summary.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  return `<h2>${s.icon} ${s.title}</h2><p class="intro">${esc(s.intro)}</p>${fOn()?`<p class="intro">Фильтр: показано ${vs.length} из ${s.verses.length}.</p>`:""}${vs.map(v=>card(v,null,s.id)).join("")}${sum}${pager(s.id)}`;
}
function searchResults(){
  const ql=q.toLowerCase(); let out="",n=0;
  DATA.forEach(s=>s.verses.forEach(v=>{
    if(!fOk(v)) return;
    if((v.parts.map(p=>p.ru).join(" ")+" "+(v.n||"")+" "+(v.c||"")+" "+(v.t||"")+" "+v.refs.join(" ")).toLowerCase().includes(ql)){out+=card(v,s.title,s.id);n++;}
  }));
  return `<h2>Поиск: «${esc(q)}»</h2><p class="intro">Найдено фрагментов: ${n}</p>${out||"<p>Ничего не найдено.</p>"}`;
}

function filtered(){
  let out="",n=0;
  DATA.forEach(s=>s.verses.forEach(v=>{if(fOk(v)){out+=card(v,s.title,s.id);n++}}));
  return `<h2>Фильтр карточек</h2><p class="intro">Тип: ${fT||"любой"}; сила: ${fP||"любая"}. Найдено: ${n}</p>${out||"<p>Ничего не найдено.</p>"}`;
}
function topPage(){
  const cnt=p=>DATA.reduce((a,s)=>a+s.verses.filter(v=>v.pw===p).length,0);
  const chip=l=>`<a href="#" class="chip" data-goto="${l[1]}" data-from="${l[0]}">${l[1]}</a><span class="bd p-${l[2]}">${l[2]}</span> `;
  let h=`<h2>★ Главные выводы</h2><p class="intro">Всего карточек: ${total}; по принятым критериям «сильных» — ${cnt("сильный")}, «средних» — ${cnt("средний")}, «слабых» — ${cnt("слабый")}.</p>`;
  TOP.blocks.forEach(b=>{
    h+=`<h3 class="gtitle">${esc(b.h)}</h3>`;
    (b.p||[]).forEach(p=>h+=`<div class="note">${esc(p)}</div>`);
    (b.items||[]).forEach((it,i)=>h+=`<div class="note"><h3>${i+1}. ${esc(it.t)}</h3>${esc(it.x)}<div class="toprow" style="margin:8px 0 0">${it.l.map(chip).join("")}</div></div>`);
    if(b.after) h+=`<div class="note"><b>${esc(b.after)}</b></div>`;
    if(b.obj) TOP.obj.forEach(o=>h+=`<div class="note"><h3>${esc(o[0])}</h3><p style="margin:4px 0"><i>Аргумент верующих:</i> ${esc(o[1])}</p><p style="margin:4px 0"><i>Ответ:</i> ${esc(o[2])}</p></div>`);
  });
  return h;
}
function render(){
  const m=$("#main");
  const body = q.length>=2 ? searchResults() : (cur==="home"?(fOn()?filtered():home()):cur==="top"?topPage():section(DATA.find(s=>s.id===cur)));
  m.innerHTML = `<input class="search" id="q" placeholder="Поиск по всем аятам и комментариям (например: убивайте, женщины, солнце)…" value="${esc(q).replace(/"/g,"&quot;")}">`+body;
  const inp=$("#q");
  inp.oninput=e=>{q=e.target.value.trim();render();const i=$("#q");i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  m.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>go(b.dataset.id));
  m.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
    const [sid,r]=b.dataset.copy.split("|");const f=findCard(r,sid);const v=f.v;
    try{navigator.clipboard.writeText("Коран "+v.refs.join(", ")+" — "+v.parts.map(p=>p.ru).join(" "))}catch(e){}
    b.textContent="скопировано";setTimeout(()=>b.textContent="копировать",1200)});
  m.querySelectorAll("[data-peek]").forEach(a=>a.onclick=e=>{e.preventDefault();
    const r=a.dataset.peek,x=EXTRA[r],p=a.closest(".x");let box=p.querySelector(".peek");
    if(box&&box.dataset.r===r){box.remove();return}
    if(box)box.remove();
    box=document.createElement("div");box.className="peek";box.dataset.r=r;
    box.innerHTML=`<b>${r}</b> — ${x?esc(x.ru):"текст недоступен"}`;p.appendChild(box)});
  m.querySelectorAll("[data-goto]").forEach(a=>a.onclick=e=>{e.preventDefault();goRef(a.dataset.goto,a.dataset.from)});
  buildNav();
}
function goRef(ref,from){
  const f=findCard(ref,from); if(!f) return;
  const s=f.s; if(!fOk(f.v)){fT="";fP="";$("#fType").value="";$("#fPow").value=""} cur=s.id;q="";location.hash=s.id;render();
  const el=document.getElementById(cid(s.id,f.v));
  if(el){el.scrollIntoView({block:"start"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),2200)}
  $("#side").classList.remove("open");
}
function go(id){cur=id;q="";location.hash=id;render();window.scrollTo(0,0);$("#side").classList.remove("open")}

$("#tAr").onchange=e=>document.body.classList.toggle("hide-ar",!e.target.checked);
$("#tC").onchange=e=>document.body.classList.toggle("hide-c",!e.target.checked);
$("#tTheme").onchange=e=>document.documentElement.dataset.theme=e.target.checked?"dark":"";
$("#menu").onclick=()=>$("#side").classList.toggle("open");
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==cur&&(h==="home"||h==="top"||DATA.some(s=>s.id===h))){cur=h;q="";render()}});
{const h=location.hash.slice(1);if(h&&(h==="top"||DATA.some(s=>s.id===h)))cur=h}
TYPES.forEach(x=>{const o=document.createElement("option");o.textContent=x;$("#fType").appendChild(o)});
$("#fType").onchange=e=>{fT=e.target.value;render()};
$("#fPow").onchange=e=>{fP=e.target.value;render()};
render();
</script>
</body>
</html>
