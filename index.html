<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Критический доклад о Коране — по разделам</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3dfd6;--accent:#8a2b1f;--quote:#fbf8f1;--side:#efebe2}
[data-theme=dark]{--bg:#141416;--panel:#1c1c20;--ink:#ececee;--mute:#9a9aa3;--line:#2c2c33;--accent:#e08a74;--quote:#222228;--side:#18181b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Georgia,"Times New Roman",serif}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;font-family:system-ui,Segoe UI,Arial,sans-serif}
aside h1{font:700 15px/1.3 system-ui;margin:0 6px 4px;letter-spacing:.3px}
aside .sub{margin:0 6px 14px;color:var(--mute);font-size:12.5px}
nav button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:8px;font:500 14px system-ui;cursor:pointer}
nav button:hover{background:rgba(128,128,128,.14)}
nav button.on{background:var(--accent);color:#fff}
[data-theme=dark] nav button.on{color:#141416}
.gh{margin:14px 10px 4px;font:700 11px system-ui;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
nav .ic{width:22px;text-align:center;font-size:16px}
nav .ct{margin-left:auto;font-size:12px;opacity:.7}
.tools{margin:16px 6px 0;display:grid;gap:8px;font:13px system-ui}
.tools label{display:flex;gap:8px;align-items:center;cursor:pointer}
main{padding:34px clamp(16px,4vw,56px) 80px;max-width:980px;width:100%}
h2{font:700 30px/1.2 Georgia,serif;margin:0 0 8px}
.intro{color:var(--mute);margin:0 0 22px;max-width:70ch;border-left:3px solid var(--accent);padding-left:14px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:15px system-ui;margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ref{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;font:600 14px system-ui;margin-bottom:10px}
.ref .r{color:var(--accent);font-size:16px}
.ref .s{color:var(--mute);font-weight:400}
.ref .tag{margin-left:auto;font:11px system-ui;border:1px solid var(--line);padding:2px 8px;border-radius:99px;color:var(--mute)}
.ar{direction:rtl;text-align:right;font:26px/2.1 "Amiri","Scheherazade New","Traditional Arabic","Noto Naskh Arabic","Segoe UI",serif;background:var(--quote);border-radius:10px;padding:10px 16px;margin:0 0 10px}
.ru{background:var(--quote);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 16px;margin:0 0 12px;font-size:17.5px;font-style:italic}
.n{margin:0 0 6px}
.n b,.c b{font:700 11.5px system-ui;text-transform:uppercase;letter-spacing:.5px;display:block}
.n b{color:var(--accent)}
.c{margin:8px 0 0;color:var(--mute);font-size:14.5px;border-top:1px dashed var(--line);padding-top:8px}
.x{margin:6px 0 0;font:13px system-ui;color:var(--mute)}
.x b{font:700 11.5px system-ui;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
i.par{font-style:italic;color:inherit;border-bottom:1px dotted var(--mute)}
.chip{display:inline-block;margin:0 4px 4px 0;padding:2px 9px;border:1px solid var(--line);border-radius:99px;color:var(--accent);text-decoration:none;font-weight:600}
.chip:hover{background:var(--accent);color:#fff}
.chip.off{color:var(--mute);font-weight:500;border-style:dashed}
.peek{margin:6px 0 2px;padding:8px 12px;border-left:3px solid var(--mute);background:var(--quote);border-radius:0 8px 8px 0;font:italic 15px Georgia,serif;color:var(--ink)}
.peek b{display:inline;font:700 12px system-ui;font-style:normal;color:var(--accent);text-transform:none;letter-spacing:0}
.chip.off:hover{background:var(--line);color:var(--ink)}
.flash{animation:fl 2.2s ease}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 1px 2px rgba(0,0,0,.04)}}
.n{white-space:pre-line}
.ct{font:700 19px/1.3 Georgia,serif;margin:0 0 10px;color:var(--ink)}
.stag{font:11px system-ui;color:var(--mute);margin:-4px 0 8px}
.part{margin:0 0 6px;padding:0 0 4px}
.part+.part{border-top:1px dashed var(--line);padding-top:10px}
.part .ref .r{font-size:14px}
.foot{margin-top:8px;text-align:right}
.copy{border:1px solid var(--line);background:none;color:var(--mute);font:12px system-ui;padding:2px 8px;border-radius:6px;cursor:pointer}
.copy:hover{color:var(--ink)}
.hide-ar .ar{display:none}.hide-c .c{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:22px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:system-ui}
.tile:hover{border-color:var(--accent)}
.tile .big{font-size:26px}
.tile .t{font-weight:700;margin:4px 0 2px}.tile .k{color:var(--mute);font-size:13px}
.gtitle{font:700 14px system-ui;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin:26px 0 0}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:0 0 16px;font-size:15px}
.note h3{margin:0 0 6px;font:700 15px system-ui}
.note ul{margin:6px 0 0 18px;padding:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px;font-family:system-ui}
.pager button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;font:14px system-ui}
.menu{display:none}
mark{background:#ffe27a;color:#000;padding:0 2px;border-radius:3px}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;inset:0 25% 0 0;z-index:5;height:100vh;transform:translateX(-100%);transition:.2s;box-shadow:4px 0 20px rgba(0,0,0,.3)}
 aside.open{transform:none}
 .menu{display:block;position:sticky;top:0;z-index:4;width:100%;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px system-ui;text-align:left}
 .ar{font-size:22px}
}
@media print{aside,.menu,.search,.pager,.copy{display:none!important}.app{display:block}.card{break-inside:avoid;box-shadow:none}}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;font:600 11.5px system-ui}
.bd{padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.bd.t{color:var(--ink)}
.bd.p-сильный{background:#8a2b1f;color:#fff;border-color:#8a2b1f}
.bd.p-средний{background:#c98a1b;color:#fff;border-color:#c98a1b}
.bd.p-слабый{background:#6b7a6b;color:#fff;border-color:#6b7a6b}
[data-theme=dark] .bd.p-сильный{background:#e08a74;color:#141416;border-color:#e08a74}
[data-theme=dark] .bd.p-средний{background:#e0b25a;color:#141416;border-color:#e0b25a}
[data-theme=dark] .bd.p-слабый{background:#8fa08f;color:#141416;border-color:#8fa08f}
.cl{margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--quote);border-radius:0 8px 8px 0;font:14.5px/1.5 system-ui}
.cl b{font:700 11.5px system-ui;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-right:6px;display:inline}
.sum{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;padding:14px 20px;margin:26px 0 0}
.sum h3{margin:0 0 6px;font:700 15px system-ui}
.sum ul{margin:6px 0 0 18px;padding:0}
.flt{display:grid;gap:6px;margin:12px 6px 0;font:13px system-ui}
.flt select{width:100%;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:13px system-ui}
.flt b{font:700 11px system-ui;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.toprow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 10px}
</style>
</head>
<body>
<button class="menu" id="menu">☰ Разделы</button>
<div class="app">
<aside id="side">
  <h1>Критический доклад о Коране</h1>
  <p class="sub">Только текст Корана. Дословные аяты по темам</p>
  <nav id="nav"></nav>
  <div class="flt"><b>Фильтр карточек</b>
    <select id="fType"><option value="">Любой тип аргумента</option></select>
    <select id="fPow"><option value="">Любая сила</option><option>сильный</option><option>средний</option><option>слабый</option></select>
  </div>
  <div class="tools">
    <label><input type="checkbox" id="tAr" checked> Арабский оригинал</label>
    <label><input type="checkbox" id="tC" checked> Контекст / как объясняют</label>
    <label><input type="checkbox" id="tTheme"> Тёмная тема</label>
  </div>
</aside>
<main id="main"></main>
</div>
<script>
const DATA = [{"id": "basics", "title": "Кто такой мусульманин и основы веры", "icon": "☪", "group": "Основы: вера, обряды и голос текста", "intro": "Что в самом Коране сказано о том, кто мусульманин, во что должен верить верующий и какие у него обязанности. Важное наблюдение для читателя: перечень «пять столпов ислама» (свидетельство веры, молитва, закят, пост, хадж) как единый список в Коране не встречается. Он составляется позднейшей традицией из отдельных предписаний, которые разбросаны по тексту. Здесь показано то, что можно найти в самом Коране, и где в нём пробелы.", "verses": [{"refs": ["3:19", "3:67", "3:52", "5:111", "10:84", "10:90", "51:35-36", "72:14", "22:78"], "parts": [{"ref": "3:19", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "إِنَّ ٱلدِّينَ عِندَ ٱللَّهِ ٱلْإِسْلَٰمُ ۗ وَمَا ٱخْتَلَفَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَهُمُ ٱلْعِلْمُ بَغْيًۢا بَيْنَهُمْ ۗ وَمَن يَكْفُرْ بِـَٔايَٰتِ ٱللَّهِ فَإِنَّ ٱللَّهَ سَرِيعُ ٱلْحِسَابِ ﴿19﴾", "ru": "Поистине, религия пред Аллахом - ислам - и разошлись те, кому было даровано писание, только после того, как пришло к ним знание, по злобе между собой. А если кто не верует в знамения Аллаха... то ведь Аллах быстр в расчете!"}, {"ref": "3:67", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "مَا كَانَ إِبْرَٰهِيمُ يَهُودِيًّۭا وَلَا نَصْرَانِيًّۭا وَلَٰكِن كَانَ حَنِيفًۭا مُّسْلِمًۭا وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ ﴿67﴾", "ru": "Ибрахим не был ни иудеем, ни христианином, а был он ханифом предавшимся и не был из многобожников."}, {"ref": "3:52", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "۞ فَلَمَّآ أَحَسَّ عِيسَىٰ مِنْهُمُ ٱلْكُفْرَ قَالَ مَنْ أَنصَارِىٓ إِلَى ٱللَّهِ ۖ قَالَ ٱلْحَوَارِيُّونَ نَحْنُ أَنصَارُ ٱللَّهِ ءَامَنَّا بِٱللَّهِ وَٱشْهَدْ بِأَنَّا مُسْلِمُونَ ﴿52﴾", "ru": "И когда Иса почувствовал в них неверие, то сказал: \"Кто мои помощники Аллаху?\" Сказали апостолы: \"Мы - помощники Аллаха. Мы уверовали в Аллаха, засвидетельствуй же, что мы - предавшиеся."}, {"ref": "5:111", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَإِذْ أَوْحَيْتُ إِلَى ٱلْحَوَارِيِّۦنَ أَنْ ءَامِنُوا۟ بِى وَبِرَسُولِى قَالُوٓا۟ ءَامَنَّا وَٱشْهَدْ بِأَنَّنَا مُسْلِمُونَ ﴿111﴾", "ru": "И вот внушил Я апостолам: \"Уверуйте в Меня и в Моего посланника!\" Они сказали: \"Мы уверовали, свидетельствуй, что мы предались!\""}, {"ref": "10:84", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "وَقَالَ مُوسَىٰ يَٰقَوْمِ إِن كُنتُمْ ءَامَنتُم بِٱللَّهِ فَعَلَيْهِ تَوَكَّلُوٓا۟ إِن كُنتُم مُّسْلِمِينَ ﴿84﴾", "ru": "И сказал Муса: \"О народ мой, если вы уверовали в Аллаха, то на Него полагайтесь, если вы предавшиеся!\""}, {"ref": "10:90", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "۞ وَجَٰوَزْنَا بِبَنِىٓ إِسْرَٰٓءِيلَ ٱلْبَحْرَ فَأَتْبَعَهُمْ فِرْعَوْنُ وَجُنُودُهُۥ بَغْيًۭا وَعَدْوًا ۖ حَتَّىٰٓ إِذَآ أَدْرَكَهُ ٱلْغَرَقُ قَالَ ءَامَنتُ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا ٱلَّذِىٓ ءَامَنَتْ بِهِۦ بَنُوٓا۟ إِسْرَٰٓءِيلَ وَأَنَا۠ مِنَ ٱلْمُسْلِمِينَ ﴿90﴾", "ru": "И перевели Мы сынов Исраила через море, а Фираун и его войска погнались за ними коварно и враждебно. А когда его настиг потоп, он сказал: \"Верую, что нет божества, кроме того, в кого веруют сыны Исраила, и я - из числа предавшихся!\""}, {"ref": "51:35-36", "sura": "Adh-Dhaariyat", "sura_ar": "سُورَةُ الذَّارِيَاتِ", "type": "Meccan", "ar": "فَأَخْرَجْنَا مَن كَانَ فِيهَا مِنَ ٱلْمُؤْمِنِينَ ﴿35﴾ فَمَا وَجَدْنَا فِيهَا غَيْرَ بَيْتٍۢ مِّنَ ٱلْمُسْلِمِينَ ﴿36﴾", "ru": "(35) И вывели Мы оттуда тех, кто был там из верующих. (36) Но Мы не нашли там больше одного дома предавшихся."}, {"ref": "72:14", "sura": "Al-Jinn", "sura_ar": "سُورَةُ الجِنِّ", "type": "Meccan", "ar": "وَأَنَّا مِنَّا ٱلْمُسْلِمُونَ وَمِنَّا ٱلْقَٰسِطُونَ ۖ فَمَنْ أَسْلَمَ فَأُو۟لَٰٓئِكَ تَحَرَّوْا۟ رَشَدًۭا ﴿14﴾", "ru": "И среди нас есть предавшие себя Аллаху, и среди нас есть отступившие; а кто предал себя, те пошли прямым путем,"}, {"ref": "22:78", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "وَجَٰهِدُوا۟ فِى ٱللَّهِ حَقَّ جِهَادِهِۦ ۚ هُوَ ٱجْتَبَىٰكُمْ وَمَا جَعَلَ عَلَيْكُمْ فِى ٱلدِّينِ مِنْ حَرَجٍۢ ۚ مِّلَّةَ أَبِيكُمْ إِبْرَٰهِيمَ ۚ هُوَ سَمَّىٰكُمُ ٱلْمُسْلِمِينَ مِن قَبْلُ وَفِى هَٰذَا لِيَكُونَ ٱلرَّسُولُ شَهِيدًا عَلَيْكُمْ وَتَكُونُوا۟ شُهَدَآءَ عَلَى ٱلنَّاسِ ۚ فَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَٱعْتَصِمُوا۟ بِٱللَّهِ هُوَ مَوْلَىٰكُمْ ۖ فَنِعْمَ ٱلْمَوْلَىٰ وَنِعْمَ ٱلنَّصِيرُ ﴿78﴾", "ru": "И усердствуйте об Аллахе достойным его усердием! Он избрал вас и не устроил для вас в религии никакой тяготы, как и в общине отца вашего, Ибрахима. Он назвал вас мусульманами раньше и в это (время), чтобы посланник был свидетелем для вас, а вы были свидетелями для людей. Выполняйте же молитву, давайте очищение и держитесь за Аллаха! Он - ваш покровитель. И прекрасен покровитель, и прекрасен помощник!"}], "n": "Что сказано: «Поистине, религия пред Аллахом — ислам» (3:19); Ибрахим — ⟦ханиф предавшийся⟧ (3:67); апостолы Исы: ⟦свидетельствуй, что мы — предавшиеся⟧ (3:52; 5:111); Муса: «если вы предавшиеся» (10:84); Фараон перед гибелью: ⟦Верую, что нет божества, кроме того, в кого веруют сыны Исраила, и я — из предавшихся⟧ (10:90); в доме Лута — ⟦один дом предавшихся⟧ (51:36); среди джиннов «есть предавшие себя Аллаху» (72:14); «Он назвал вас мусульманами раньше» (22:78).\nВ чём проблема: слово ⟦муслим⟧ (⟦предавшийся⟧) в Коране применено к Ибрахиму, Мусе, апостолам Исы, дому Лута, джиннам и даже к Фараону. То есть «ислам» — не только религия Мухаммада, а общий термин для преданности Богу. Это ставит вопрос: если ислам — религия всех пророков (3:19, 22:78), то при чём 3:85 (⟦кто ищет не ислама, от того не будет принято⟧) и 5:48 (⟦каждому из вас Мы сделали закон и путь⟧)? Вопрос границ: как отличить «ислам» как общую преданность от ислама как конкретного закона Мухаммада. Кроме того, признание Фараона в 10:90 Бог отверг (10:91: ⟦теперь?⟧).", "c": null, "x": ["3:85", "5:48", "10:91", "2:62"], "t": "Что значит «мусульманин» — слово шире одной религии", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Слово «муслим» применено и к другим пророкам, и к Фараону (10:90), значит «ислам» в Коране шире одной религии. это наблюдение о языке, и использовать его можно только как фон для 3:85."}, {"refs": ["49:14", "49:15", "33:35"], "parts": [{"ref": "49:14", "sura": "Al-Hujuraat", "sura_ar": "سُورَةُ الحُجُرَاتِ", "type": "Medinan", "ar": "۞ قَالَتِ ٱلْأَعْرَابُ ءَامَنَّا ۖ قُل لَّمْ تُؤْمِنُوا۟ وَلَٰكِن قُولُوٓا۟ أَسْلَمْنَا وَلَمَّا يَدْخُلِ ٱلْإِيمَٰنُ فِى قُلُوبِكُمْ ۖ وَإِن تُطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ لَا يَلِتْكُم مِّنْ أَعْمَٰلِكُمْ شَيْـًٔا ۚ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌ ﴿14﴾", "ru": "Сказали бедуины: \"Мы уверовали!\" Скажи: \"Вы уверовали, но говорите: \"Мы покорились\", ибо еще не вошла вера в ваши сердца. А если вы будете повиноваться Аллаху и Его посланнику, Он ни в чем не умалит ваших дел\". Поистине, Аллах прощающ, милосерд!"}, {"ref": "49:15", "sura": "Al-Hujuraat", "sura_ar": "سُورَةُ الحُجُرَاتِ", "type": "Medinan", "ar": "إِنَّمَا ٱلْمُؤْمِنُونَ ٱلَّذِينَ ءَامَنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ ثُمَّ لَمْ يَرْتَابُوا۟ وَجَٰهَدُوا۟ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ فِى سَبِيلِ ٱللَّهِ ۚ أُو۟لَٰٓئِكَ هُمُ ٱلصَّٰدِقُونَ ﴿15﴾", "ru": "Верующие - только те, которые уверовали в Аллаха и Его посланника, потом не испытывали сомнений и боролись своими имуществами и своими душами на пути Аллаха. Они - искренние."}, {"ref": "33:35", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "إِنَّ ٱلْمُسْلِمِينَ وَٱلْمُسْلِمَٰتِ وَٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ وَٱلْقَٰنِتِينَ وَٱلْقَٰنِتَٰتِ وَٱلصَّٰدِقِينَ وَٱلصَّٰدِقَٰتِ وَٱلصَّٰبِرِينَ وَٱلصَّٰبِرَٰتِ وَٱلْخَٰشِعِينَ وَٱلْخَٰشِعَٰتِ وَٱلْمُتَصَدِّقِينَ وَٱلْمُتَصَدِّقَٰتِ وَٱلصَّٰٓئِمِينَ وَٱلصَّٰٓئِمَٰتِ وَٱلْحَٰفِظِينَ فُرُوجَهُمْ وَٱلْحَٰفِظَٰتِ وَٱلذَّٰكِرِينَ ٱللَّهَ كَثِيرًۭا وَٱلذَّٰكِرَٰتِ أَعَدَّ ٱللَّهُ لَهُم مَّغْفِرَةًۭ وَأَجْرًا عَظِيمًۭا ﴿35﴾", "ru": "Поистине, мусульмане и мусульманки, верующие и верующия, обратившиеся и обратившияся, верные и верныя, покорные и покорныя, дающие и дающия милостыню, постящиеся и постящияся, хранящие свое целомудрие и хранящия, поминающие и поминающия Аллаха много, - уготовал им Аллах прощение и великую награду!"}], "n": "Что сказано: ⟦Сказали бедуины: Мы уверовали! Скажи: Вы не уверовали, но говорите: «Мы покорились⟧, ибо ещё не вошла вера в ваши сердца» (49:14); «Верующие — только те, которые уверовали в Аллаха и Его посланника, потом не испытывали сомнений и боролись своими имуществами и своими душами на пути Аллаха» (49:15); ⟦мусульмане и мусульманки, верующие и верующие…⟧ (33:35).\nВ чём проблема: Коран различает ⟦мусульманина⟧ (внешне покорившегося) и ⟦верующего⟧ (кто прошёл через веру сердца). Критерии ⟦истинной веры⟧ в 49:15 включают: не испытывать сомнений и ⟦бороться имуществом и душой⟧ (джихад). Но в 47:24 и 4:82 Коран призывает думать и размышлять. Получается, что сомнение — признак неверия (49:15), но и размышление требуется. Кроме того, нет единой процедуры, как становятся мусульманином: в 9:11 — раскаяние, молитва, закят; в 49:15 — вера без сомнений и борьба.", "c": null, "x": ["47:24", "4:82", "9:11"], "t": "Мусульманин и верующий — не одно и то же", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Коран различает «мусульманина» и «верующего». Это уточнение понятий. Для доклада важно лишь то, что критерий «истинной веры» включает джихад (49:15)."}, {"refs": ["2:285", "4:136", "2:177", "4:150-151"], "parts": [{"ref": "2:285", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ ۚ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍۢ مِّن رُّسُلِهِۦ ۚ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ ﴿285﴾", "ru": "Уверовал посланник в то, что ниспослано ему от его Господа, и верующие. Все уверовали в Аллаха, и Его ангелов, и Его писания, и Его посланников. \"Не различаем мы между кем бы то ни было из Его посланников\". Они говорят: \"Мы услышали и повинуемся! Прощение Твое, Господи наш, и к Тебе - возвращение!\""}, {"ref": "4:136", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ ءَامِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَٱلْكِتَٰبِ ٱلَّذِى نَزَّلَ عَلَىٰ رَسُولِهِۦ وَٱلْكِتَٰبِ ٱلَّذِىٓ أَنزَلَ مِن قَبْلُ ۚ وَمَن يَكْفُرْ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ وَٱلْيَوْمِ ٱلْءَاخِرِ فَقَدْ ضَلَّ ضَلَٰلًۢا بَعِيدًا ﴿136﴾", "ru": "О вы, которые уверовали! Веруйте в Аллаха и Его посланника, и писание, которые Он низвел Своему посланнику, и писание, которое Он низвел раньше. Кто не верит в Аллаха и Его ангелов, и Его писание, и Его посланников, и в последний день, тот заблудился далеким заблуждением."}, {"ref": "2:177", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "۞ لَّيْسَ ٱلْبِرَّ أَن تُوَلُّوا۟ وُجُوهَكُمْ قِبَلَ ٱلْمَشْرِقِ وَٱلْمَغْرِبِ وَلَٰكِنَّ ٱلْبِرَّ مَنْ ءَامَنَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ وَٱلْمَلَٰٓئِكَةِ وَٱلْكِتَٰبِ وَٱلنَّبِيِّۦنَ وَءَاتَى ٱلْمَالَ عَلَىٰ حُبِّهِۦ ذَوِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينَ وَٱبْنَ ٱلسَّبِيلِ وَٱلسَّآئِلِينَ وَفِى ٱلرِّقَابِ وَأَقَامَ ٱلصَّلَوٰةَ وَءَاتَى ٱلزَّكَوٰةَ وَٱلْمُوفُونَ بِعَهْدِهِمْ إِذَا عَٰهَدُوا۟ ۖ وَٱلصَّٰبِرِينَ فِى ٱلْبَأْسَآءِ وَٱلضَّرَّآءِ وَحِينَ ٱلْبَأْسِ ۗ أُو۟لَٰٓئِكَ ٱلَّذِينَ صَدَقُوا۟ ۖ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُتَّقُونَ ﴿177﴾", "ru": "Не в том благочестие, чтобы вам обращать свои лица в сторону востока и запада, а благочестие - кто уверовал в Аллаха, и в последний день, и в ангелов, и в писание, и в пророков, и давал имущество, несмотря на любовь к нему, близким, и сиротам, и беднякам, и путникам, и просящим, и на рабов, и выстаивал молитву, и давал очищение, - и исполняющие свои заветы, когда заключат, и терпеливые в несчастии и бедствии и во время беды, - это те, которые были правдивы, это они - богобоязненные."}, {"ref": "4:150-151", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ يَكْفُرُونَ بِٱللَّهِ وَرُسُلِهِۦ وَيُرِيدُونَ أَن يُفَرِّقُوا۟ بَيْنَ ٱللَّهِ وَرُسُلِهِۦ وَيَقُولُونَ نُؤْمِنُ بِبَعْضٍۢ وَنَكْفُرُ بِبَعْضٍۢ وَيُرِيدُونَ أَن يَتَّخِذُوا۟ بَيْنَ ذَٰلِكَ سَبِيلًا ﴿150﴾ أُو۟لَٰٓئِكَ هُمُ ٱلْكَٰفِرُونَ حَقًّۭا ۚ وَأَعْتَدْنَا لِلْكَٰفِرِينَ عَذَابًۭا مُّهِينًۭا ﴿151﴾", "ru": "(150) Поистине, те, которые не веруют в Аллаха и Его посланников и желают отделить Аллаха от Его посланников, говорят: \"Мы веруем в одних и не веруем в других\". И хотят найти между этим путь, - (151) они - неверующие по истине. И уготовали Мы неверным унизительное наказание!"}], "n": "Что сказано: «Все уверовали в Аллаха, и Его ангелов, и Его писания, и Его посланников» (2:285); «Веруйте в Аллаха и Его посланника, и писание… Кто не верит в Аллаха и Его ангелов, и Его писание, и Его посланников, и в последний день — тот заблудился далеким заблуждением» (4:136); благочестие — «кто уверовал в Аллаха, и в последний день, и в ангелов, и в писание, и в пророков» (2:177); те, кто ⟦веруют в одних посланников и не веруют в других⟧ — «неверующие по истине» (4:150-151).\nВ чём проблема: единого списка вероучения в Коране нет. В 2:285 нет ⟦последнего дня⟧; в 4:136 и 2:177 он есть. Нигде в этих перечнях не названо ⟦предопределение⟧ (шестой ⟦столп веры⟧ в традиции; оно есть отдельно: 54:49, 57:22). Таким образом, список ⟦шести столпов веры⟧ собран из разных аятов. Для вопроса ⟦кто мусульманин⟧ это важно: Коран не даёт одного исчерпывающего определения.", "c": null, "x": ["54:49", "57:22"], "t": "Во что должен верить верующий", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Единого перечня предметов веры в Коране нет: в 2:285 нет «последнего дня», в 4:136 он есть. Это неполнота списков; можно сказать, что «шесть столпов веры» взяты из разных мест."}, {"refs": ["47:19", "3:18", "48:29", "3:144", "33:40"], "parts": [{"ref": "47:19", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "فَٱعْلَمْ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا ٱللَّهُ وَٱسْتَغْفِرْ لِذَنۢبِكَ وَلِلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ ۗ وَٱللَّهُ يَعْلَمُ مُتَقَلَّبَكُمْ وَمَثْوَىٰكُمْ ﴿19﴾", "ru": "Знай же, что нет божества, кроме Аллаха, и проси прощения твоему греху и для верующих - мужчин и женщин. И Аллах знает и место вашего действия и ваше пристанище!"}, {"ref": "3:18", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "شَهِدَ ٱللَّهُ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا هُوَ وَٱلْمَلَٰٓئِكَةُ وَأُو۟لُوا۟ ٱلْعِلْمِ قَآئِمًۢا بِٱلْقِسْطِ ۚ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ ﴿18﴾", "ru": "Свидетельствует Аллах, что нет божества, кроме Него, и ангелы, и обладающие знанием, которые стойки в справедливости: нет божества, кроме Него, великого, мудрого!"}, {"ref": "48:29", "sura": "Al-Fath", "sura_ar": "سُورَةُ الفَتۡحِ", "type": "Medinan", "ar": "مُّحَمَّدٌۭ رَّسُولُ ٱللَّهِ ۚ وَٱلَّذِينَ مَعَهُۥٓ أَشِدَّآءُ عَلَى ٱلْكُفَّارِ رُحَمَآءُ بَيْنَهُمْ ۖ تَرَىٰهُمْ رُكَّعًۭا سُجَّدًۭا يَبْتَغُونَ فَضْلًۭا مِّنَ ٱللَّهِ وَرِضْوَٰنًۭا ۖ سِيمَاهُمْ فِى وُجُوهِهِم مِّنْ أَثَرِ ٱلسُّجُودِ ۚ ذَٰلِكَ مَثَلُهُمْ فِى ٱلتَّوْرَىٰةِ ۚ وَمَثَلُهُمْ فِى ٱلْإِنجِيلِ كَزَرْعٍ أَخْرَجَ شَطْـَٔهُۥ فَـَٔازَرَهُۥ فَٱسْتَغْلَظَ فَٱسْتَوَىٰ عَلَىٰ سُوقِهِۦ يُعْجِبُ ٱلزُّرَّاعَ لِيَغِيظَ بِهِمُ ٱلْكُفَّارَ ۗ وَعَدَ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ مِنْهُم مَّغْفِرَةًۭ وَأَجْرًا عَظِيمًۢا ﴿29﴾", "ru": "Мухаммад - посланник Аллаха, и те, которые с ним, - яростны против неверных, милостивы между собой. Ты видишь их преклоняющимися, падающими ниц. Они ищут милости от Аллаха и благоволения. Приметы их - на их лицах от следов падения ниц. Таков образ их в Торе, но в Евангелии образ их - посев, который извел свой побег и укрепил его; он стал твердым и выровнялся на стебле, восхищая сеятелей, - чтобы разъярить ими неверных. Обещал Аллах тем из них, которые уверовали и творили благое, прощение и великую награду!"}, {"ref": "3:144", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَمَا مُحَمَّدٌ إِلَّا رَسُولٌۭ قَدْ خَلَتْ مِن قَبْلِهِ ٱلرُّسُلُ ۚ أَفَإِي۟ن مَّاتَ أَوْ قُتِلَ ٱنقَلَبْتُمْ عَلَىٰٓ أَعْقَٰبِكُمْ ۚ وَمَن يَنقَلِبْ عَلَىٰ عَقِبَيْهِ فَلَن يَضُرَّ ٱللَّهَ شَيْـًۭٔا ۗ وَسَيَجْزِى ٱللَّهُ ٱلشَّٰكِرِينَ ﴿144﴾", "ru": "И Мухаммад - только посланник, до которого были посланники. Разве ж если он умрет или будет убит, вы обратитесь вспять? Кто обращается вспять, тот ни в чем не повредит Аллаху, и Аллах воздаст благодарным."}, {"ref": "33:40", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "مَّا كَانَ مُحَمَّدٌ أَبَآ أَحَدٍۢ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ ٱللَّهِ وَخَاتَمَ ٱلنَّبِيِّۦنَ ۗ وَكَانَ ٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمًۭا ﴿40﴾", "ru": "Мухаммад не был отцом кого-либо из ваших мужчин, а только - посланником Аллаха и пророков. Аллах знает всякую вещь!"}], "n": "Что сказано: «Знай же, что нет божества, кроме Аллаха» (47:19); «Свидетельствует Аллах, что нет божества, кроме Него, и ангелы, и обладающие знанием» (3:18); «Мухаммад — посланник Аллаха» (48:29); «Мухаммад — только посланник, до которого были посланники» (3:144); ⟦Мухаммад — не отец никому из ваших мужчин, но посланник Аллаха и печать пророков⟧ (33:40).\nВ чём проблема: двух частей свидетельства («нет божества, кроме Аллаха» и «Мухаммад — посланник Аллаха») в Коране нет в одной формуле: они даны в разных аятах, и нигде не сказано, что для вступления в ислам нужно произнести именно эти слова. Правило о ⟦шахаде⟧ как входе в ислам, в виде одной фразы, в тексте не найдено. Примечание: в 10:90 Фараон произносит похожее (⟦Верую, что нет божества, кроме…⟧), но Бог не принимает.", "c": null, "x": ["10:90", "10:91"], "t": "Свидетельство веры (шахада)", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Двух частей шахады («нет божества, кроме Аллаха» и «Мухаммад — посланник») в одной формуле нет. Это наблюдение о неполноте текста; противоречия не доказывает."}, {"refs": ["2:43", "11:114", "17:78", "30:17-18", "2:238", "4:103"], "parts": [{"ref": "2:43", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَٱرْكَعُوا۟ مَعَ ٱلرَّٰكِعِينَ ﴿43﴾", "ru": "И выстаивайте молитву, и давайте очищение, и кланяйтесь с поклоняющимися."}, {"ref": "11:114", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "وَأَقِمِ ٱلصَّلَوٰةَ طَرَفَىِ ٱلنَّهَارِ وَزُلَفًۭا مِّنَ ٱلَّيْلِ ۚ إِنَّ ٱلْحَسَنَٰتِ يُذْهِبْنَ ٱلسَّيِّـَٔاتِ ۚ ذَٰلِكَ ذِكْرَىٰ لِلذَّٰكِرِينَ ﴿114﴾", "ru": "Выстаивай молитву в обоих концах дня и в (близких) часах ночи. Поистине, добрые деяния удаляют дурные! Это - напоминание для помнящих."}, {"ref": "17:78", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "أَقِمِ ٱلصَّلَوٰةَ لِدُلُوكِ ٱلشَّمْسِ إِلَىٰ غَسَقِ ٱلَّيْلِ وَقُرْءَانَ ٱلْفَجْرِ ۖ إِنَّ قُرْءَانَ ٱلْفَجْرِ كَانَ مَشْهُودًۭا ﴿78﴾", "ru": "Выполняем молитву при склонении солнца к мраку ночи, а Коран - на заре. Поистине, Коран на заре имеет свидетелей!"}, {"ref": "30:17-18", "sura": "Ar-Room", "sura_ar": "سُورَةُ الرُّومِ", "type": "Meccan", "ar": "فَسُبْحَٰنَ ٱللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ ﴿17﴾ وَلَهُ ٱلْحَمْدُ فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَعَشِيًّۭا وَحِينَ تُظْهِرُونَ ﴿18﴾", "ru": "(17) Хвала же Аллаху, когда застигает вас вечер и когда застигает вас утро! (18) Ему хвала и в небесах, и на земле, и вечером, и когда вас застигает полдень!"}, {"ref": "2:238", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "حَٰفِظُوا۟ عَلَى ٱلصَّلَوَٰتِ وَٱلصَّلَوٰةِ ٱلْوُسْطَىٰ وَقُومُوا۟ لِلَّهِ قَٰنِتِينَ ﴿238﴾", "ru": "Охраняйте молитвы и молитву среднюю и стойте пред Аллахом благоговейно."}, {"ref": "4:103", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "فَإِذَا قَضَيْتُمُ ٱلصَّلَوٰةَ فَٱذْكُرُوا۟ ٱللَّهَ قِيَٰمًۭا وَقُعُودًۭا وَعَلَىٰ جُنُوبِكُمْ ۚ فَإِذَا ٱطْمَأْنَنتُمْ فَأَقِيمُوا۟ ٱلصَّلَوٰةَ ۚ إِنَّ ٱلصَّلَوٰةَ كَانَتْ عَلَى ٱلْمُؤْمِنِينَ كِتَٰبًۭا مَّوْقُوتًۭا ﴿103﴾", "ru": "А когда вы закончите молитву, то вспоминайте Аллаха - стоя, сидя и на своих боках. А когда вы успокоитесь, то выстаивайте молитву. Поистине, молитва для неверующих - предписанное в определенное время."}], "n": "Что сказано: «Выстаивайте молитву» (2:43); «Выстаивай молитву в обоих концах дня и в близких часах ночи» (11:114); ⟦Выполняй молитву при склонении солнца к мраку ночи, а Коран — на заре⟧ (17:78); ⟦Хвала Аллаху, когда застигает вас вечер, и когда застигает вас утро… и вечером, и когда вас застигает полдень⟧ (30:17-18); «Охраняйте молитвы и молитву среднюю» (2:238); ⟦молитва для верующих — предписанное в определённое время⟧ (4:103).\nВ чём проблема: Коран обязывает к молитве, но не называет число молитв (пять), их точное время, порядок движений и число частей. ⟦Пять⟧ молитв как число в тексте не названо: названы ⟦концы дня⟧, ⟦близкие часы ночи⟧, ⟦склонение солнца⟧, ⟦заря⟧, ⟦средняя молитва⟧ (откуда следует, что их больше двух). Критики: основное обязательное действие верующего Коран не описывает, и все подробности приходят из внешних источников (то есть не из Корана).", "c": null, "x": [], "t": "Молитва: что сказано и чего не сказано", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Коран велит молиться, но не называет число молитв и порядок. Это пробел текста, который восполнила традиция; в докладе указывать как «в тексте этого нет»."}, {"refs": ["9:60", "9:103", "2:177", "98:5"], "parts": [{"ref": "9:60", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "۞ إِنَّمَا ٱلصَّدَقَٰتُ لِلْفُقَرَآءِ وَٱلْمَسَٰكِينِ وَٱلْعَٰمِلِينَ عَلَيْهَا وَٱلْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِى ٱلرِّقَابِ وَٱلْغَٰرِمِينَ وَفِى سَبِيلِ ٱللَّهِ وَٱبْنِ ٱلسَّبِيلِ ۖ فَرِيضَةًۭ مِّنَ ٱللَّهِ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌۭ ﴿60﴾", "ru": "Милостыни - только для бедных, нищих, работающих над этим, - тем, у кого сердца привлечены , на выкуп рабов, должникам, на пути Аллаха, путникам, - по становлению Аллаха. Аллах - знающий, мудрый!"}, {"ref": "9:103", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "خُذْ مِنْ أَمْوَٰلِهِمْ صَدَقَةًۭ تُطَهِّرُهُمْ وَتُزَكِّيهِم بِهَا وَصَلِّ عَلَيْهِمْ ۖ إِنَّ صَلَوٰتَكَ سَكَنٌۭ لَّهُمْ ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ ﴿103﴾", "ru": "Возьми с имуществ их милостыню, которой ты очистишь и оправдаешь их. И молись над ними, ведь твоя молитва - успокоение для них, а Аллах - слышащий, знающий!"}, {"ref": "2:177", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "۞ لَّيْسَ ٱلْبِرَّ أَن تُوَلُّوا۟ وُجُوهَكُمْ قِبَلَ ٱلْمَشْرِقِ وَٱلْمَغْرِبِ وَلَٰكِنَّ ٱلْبِرَّ مَنْ ءَامَنَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ وَٱلْمَلَٰٓئِكَةِ وَٱلْكِتَٰبِ وَٱلنَّبِيِّۦنَ وَءَاتَى ٱلْمَالَ عَلَىٰ حُبِّهِۦ ذَوِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينَ وَٱبْنَ ٱلسَّبِيلِ وَٱلسَّآئِلِينَ وَفِى ٱلرِّقَابِ وَأَقَامَ ٱلصَّلَوٰةَ وَءَاتَى ٱلزَّكَوٰةَ وَٱلْمُوفُونَ بِعَهْدِهِمْ إِذَا عَٰهَدُوا۟ ۖ وَٱلصَّٰبِرِينَ فِى ٱلْبَأْسَآءِ وَٱلضَّرَّآءِ وَحِينَ ٱلْبَأْسِ ۗ أُو۟لَٰٓئِكَ ٱلَّذِينَ صَدَقُوا۟ ۖ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُتَّقُونَ ﴿177﴾", "ru": "Не в том благочестие, чтобы вам обращать свои лица в сторону востока и запада, а благочестие - кто уверовал в Аллаха, и в последний день, и в ангелов, и в писание, и в пророков, и давал имущество, несмотря на любовь к нему, близким, и сиротам, и беднякам, и путникам, и просящим, и на рабов, и выстаивал молитву, и давал очищение, - и исполняющие свои заветы, когда заключат, и терпеливые в несчастии и бедствии и во время беды, - это те, которые были правдивы, это они - богобоязненные."}, {"ref": "98:5", "sura": "Al-Bayyina", "sura_ar": "سُورَةُ البَيِّنَةِ", "type": "Medinan", "ar": "وَمَآ أُمِرُوٓا۟ إِلَّا لِيَعْبُدُوا۟ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُوا۟ ٱلصَّلَوٰةَ وَيُؤْتُوا۟ ٱلزَّكَوٰةَ ۚ وَذَٰلِكَ دِينُ ٱلْقَيِّمَةِ ﴿5﴾", "ru": "И было им повелено только поклоняться Аллаху, очищая перед Ним религию, как ханифы, выстаивать молитву, приносить очищение. Это - вера прямоты!"}], "n": "Что сказано: ⟦Милостыни — только для бедных, нищих, работающих над этим, тех, у кого сердца привлечены, на выкуп рабов, должникам, на пути Аллаха, путникам⟧ (9:60); «Возьми с имуществ их милостыню, которой ты очистишь и оправдаешь их» (9:103); ⟦давать имущество, несмотря на любовь к нему⟧ (2:177).\nВ чём проблема: Коран называет получателей (9:60), но не называет ставку (какую долю имущества отдавать) и не перечисляет облагаемое имущество; эти нормы выведены позднее. Также «на пути Аллаха» и ⟦те, у кого сердца привлечены⟧ трактуются широко (включая военные цели и подкуп); критики отмечают, что сбор поручен Пророку («возьми» — 9:103), то есть общине-государству.", "c": null, "x": [], "t": "Закят (очищающая милостыня)", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Коран называет получателей закята, но не размер. Это пробел текста, а не ошибка."}, {"refs": ["2:183", "2:185", "2:187"], "parts": [{"ref": "2:183", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ ﴿183﴾", "ru": "О те, которые уверовали! Предписан вам пост, так же как он предписан тем, кто был до вас, - может быть, вы будете богобоязненны! -"}, {"ref": "2:185", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "شَهْرُ رَمَضَانَ ٱلَّذِىٓ أُنزِلَ فِيهِ ٱلْقُرْءَانُ هُدًۭى لِّلنَّاسِ وَبَيِّنَٰتٍۢ مِّنَ ٱلْهُدَىٰ وَٱلْفُرْقَانِ ۚ فَمَن شَهِدَ مِنكُمُ ٱلشَّهْرَ فَلْيَصُمْهُ ۖ وَمَن كَانَ مَرِيضًا أَوْ عَلَىٰ سَفَرٍۢ فَعِدَّةٌۭ مِّنْ أَيَّامٍ أُخَرَ ۗ يُرِيدُ ٱللَّهُ بِكُمُ ٱلْيُسْرَ وَلَا يُرِيدُ بِكُمُ ٱلْعُسْرَ وَلِتُكْمِلُوا۟ ٱلْعِدَّةَ وَلِتُكَبِّرُوا۟ ٱللَّهَ عَلَىٰ مَا هَدَىٰكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ ﴿185﴾", "ru": "Месяц рамадан, в который ниспослан был Коран в руководство для людей и как разъяснение прямого пути и различения, - и вот, кто из вас застанет этот месяц, пусть проводит его в посту, а кто болен или в пути, то - число других дней. Аллах хочет для вас облегчения, а не хочет затруднения для вас, и чтобы вы завершили и возвеличили Аллаха за то, что Он вывел вас, - может быть, вы будите благодарны!"}, {"ref": "2:187", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "أُحِلَّ لَكُمْ لَيْلَةَ ٱلصِّيَامِ ٱلرَّفَثُ إِلَىٰ نِسَآئِكُمْ ۚ هُنَّ لِبَاسٌۭ لَّكُمْ وَأَنتُمْ لِبَاسٌۭ لَّهُنَّ ۗ عَلِمَ ٱللَّهُ أَنَّكُمْ كُنتُمْ تَخْتَانُونَ أَنفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنكُمْ ۖ فَٱلْـَٰٔنَ بَٰشِرُوهُنَّ وَٱبْتَغُوا۟ مَا كَتَبَ ٱللَّهُ لَكُمْ ۚ وَكُلُوا۟ وَٱشْرَبُوا۟ حَتَّىٰ يَتَبَيَّنَ لَكُمُ ٱلْخَيْطُ ٱلْأَبْيَضُ مِنَ ٱلْخَيْطِ ٱلْأَسْوَدِ مِنَ ٱلْفَجْرِ ۖ ثُمَّ أَتِمُّوا۟ ٱلصِّيَامَ إِلَى ٱلَّيْلِ ۚ وَلَا تُبَٰشِرُوهُنَّ وَأَنتُمْ عَٰكِفُونَ فِى ٱلْمَسَٰجِدِ ۗ تِلْكَ حُدُودُ ٱللَّهِ فَلَا تَقْرَبُوهَا ۗ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَّقُونَ ﴿187﴾", "ru": "Разрешается вам в ночь поста приближение к вашим женам: они - одеяние для вас, а вы - одеяние для них. Узнал Аллах, что вы обманываете самих себя, и обратился к вам и простил вас. А теперь прикасайтесь к ним и ищите того, что предписал Аллах. Ешьте и пейте, пока не станет различаться перед вами белая нитка и черная нитка на заре, потом выполняйте пост до ночи. И не прикасайтесь к ним, знамения людям, - может быть, они будут богобоязненны!"}], "n": "Что сказано: «Предписан вам пост, так же как он предписан тем, кто был до вас» (2:183); «Месяц Рамадан, в который ниспослан был Коран… кто из вас застанет этот месяц, пусть проводит его в посту» (2:185); в ночь поста можно приближаться к жёнам: «Узнал Аллах, что вы обманываете самих себя, и обратился к вам и простил вас» (2:187).\nВ чём проблема: (1) Пост назван ⟦предписанным тем, кто был до вас⟧; (2) 2:187 сообщает, что люди ⟦обманывали сами себя⟧ (нарушали правила), и Бог «узнал» — это пример ⟦узнавания⟧ после события (см. раздел ⟦Образ Бога⟧); (3) правила поста менялись в пределах одних аятов (2:187 смягчает предыдущие). Нет противоречия в числе дней: названо — месяц Рамадан.", "c": null, "x": ["2:106"], "t": "Пост", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Пост введён с оговорками и сменой правил (2:187). карточка нужна, чтобы сослаться на раздел «Образ Бога» (вопрос «узнавания»)."}, {"refs": ["3:97", "22:27", "2:196"], "parts": [{"ref": "3:97", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "فِيهِ ءَايَٰتٌۢ بَيِّنَٰتٌۭ مَّقَامُ إِبْرَٰهِيمَ ۖ وَمَن دَخَلَهُۥ كَانَ ءَامِنًۭا ۗ وَلِلَّهِ عَلَى ٱلنَّاسِ حِجُّ ٱلْبَيْتِ مَنِ ٱسْتَطَاعَ إِلَيْهِ سَبِيلًۭا ۚ وَمَن كَفَرَ فَإِنَّ ٱللَّهَ غَنِىٌّ عَنِ ٱلْعَٰلَمِينَ ﴿97﴾", "ru": "Там - ясные знамения для людей - место Ибрахима, и тот, кто вошел в него, безопасен. А у Аллаха - на людях обязательство хаджа к дому, - для тех, кто в состоянии совершить путь к нему. А кто не верует... то ведь Аллах - богат, превыше миров!\""}, {"ref": "22:27", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "وَأَذِّن فِى ٱلنَّاسِ بِٱلْحَجِّ يَأْتُوكَ رِجَالًۭا وَعَلَىٰ كُلِّ ضَامِرٍۢ يَأْتِينَ مِن كُلِّ فَجٍّ عَمِيقٍۢ ﴿27﴾", "ru": "И возвести среди людей о хадже: они придут к тебе пешком и на всяких тощих, которые приходят из всякой глубокой расщелины,"}, {"ref": "2:196", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَأَتِمُّوا۟ ٱلْحَجَّ وَٱلْعُمْرَةَ لِلَّهِ ۚ فَإِنْ أُحْصِرْتُمْ فَمَا ٱسْتَيْسَرَ مِنَ ٱلْهَدْىِ ۖ وَلَا تَحْلِقُوا۟ رُءُوسَكُمْ حَتَّىٰ يَبْلُغَ ٱلْهَدْىُ مَحِلَّهُۥ ۚ فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ بِهِۦٓ أَذًۭى مِّن رَّأْسِهِۦ فَفِدْيَةٌۭ مِّن صِيَامٍ أَوْ صَدَقَةٍ أَوْ نُسُكٍۢ ۚ فَإِذَآ أَمِنتُمْ فَمَن تَمَتَّعَ بِٱلْعُمْرَةِ إِلَى ٱلْحَجِّ فَمَا ٱسْتَيْسَرَ مِنَ ٱلْهَدْىِ ۚ فَمَن لَّمْ يَجِدْ فَصِيَامُ ثَلَٰثَةِ أَيَّامٍۢ فِى ٱلْحَجِّ وَسَبْعَةٍ إِذَا رَجَعْتُمْ ۗ تِلْكَ عَشَرَةٌۭ كَامِلَةٌۭ ۗ ذَٰلِكَ لِمَن لَّمْ يَكُنْ أَهْلُهُۥ حَاضِرِى ٱلْمَسْجِدِ ٱلْحَرَامِ ۚ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ ﴿196﴾", "ru": "И завершайте хадж и посещение ради Аллаха. Если вы затруднены, то - из жертвенных животных, что легко. И не брейте своих голов, пока не дойдет жертва со своего места. А если кто из вас болен или у него страдание в голове, то - выкуп постом, или милостынею, или жертвой. А когда вы в безопасности, то тому, кто пользуется посещением для хаджа, тому - то из жертвенных животных, что легко; а кто не найдет, то - пост три дня во время хаджа и семь, когда вернетесь; вот - десять полных. Это - для тех, у кого семья не находится при запретной мечети. И бойтесь Аллаха и знайте, что Аллах силен в наказании!"}], "n": "Что сказано: «У Аллаха на людях обязательство хаджа к дому, — для тех, кто в состоянии совершить путь к нему» (3:97); «Возвести среди людей о хадже: они придут к тебе пешком и на всяких тощих» (22:27); «Завершайте хадж и посещение ради Аллаха» (2:196).\nВ чём проблема: хадж назван обязательным только для тех, кто в состоянии; подробности обряда в Коране описаны фрагментарно (2:196-203, 22:27-37). Само паломничество к «дому» в Мекке связано в 2:127 и 14:37 с Ибрахимом, что исторически не подтверждено (см. ⟦Авраам в Мекке⟧).", "c": null, "x": ["2:127", "14:37"], "t": "Хадж", "at": "расходится с историей или Библией", "pw": "слабый", "cl": "Вывод: возможное расхождение с историческими данными, подтверждений недостаточно. Связь Каабы с Ибрахимом нигде вне Корана не подтверждена. Это отсутствие подтверждения, а не опровержение; формулировать осторожно."}, {"refs": ["9:11", "4:94", "9:5"], "parts": [{"ref": "9:11", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "فَإِن تَابُوا۟ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَءَاتَوُا۟ ٱلزَّكَوٰةَ فَإِخْوَٰنُكُمْ فِى ٱلدِّينِ ۗ وَنُفَصِّلُ ٱلْءَايَٰتِ لِقَوْمٍۢ يَعْلَمُونَ ﴿11﴾", "ru": "А если они обратились, и выполнили молитву, и дали очищение, то они - братья ваши в религии. Мы разъясняем знамения для людей, которые знают!"}, {"ref": "4:94", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا ضَرَبْتُمْ فِى سَبِيلِ ٱللَّهِ فَتَبَيَّنُوا۟ وَلَا تَقُولُوا۟ لِمَنْ أَلْقَىٰٓ إِلَيْكُمُ ٱلسَّلَٰمَ لَسْتَ مُؤْمِنًۭا تَبْتَغُونَ عَرَضَ ٱلْحَيَوٰةِ ٱلدُّنْيَا فَعِندَ ٱللَّهِ مَغَانِمُ كَثِيرَةٌۭ ۚ كَذَٰلِكَ كُنتُم مِّن قَبْلُ فَمَنَّ ٱللَّهُ عَلَيْكُمْ فَتَبَيَّنُوٓا۟ ۚ إِنَّ ٱللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًۭا ﴿94﴾", "ru": "О вы, которые уверовали! Когда отправляетесь по пути Аллаха, то различайте и не говорите тому, кто предложит вам мир: \"Ты не верующий\", - домогаясь случайностей жизни ближней. Ведь у Аллаха - обильная добыча. Таковы были вы раньше, но Аллах оказал вам милость. Различайте же: поистине, Аллах сведущ в том, что вы делаете!"}, {"ref": "9:5", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "فَإِذَا ٱنسَلَخَ ٱلْأَشْهُرُ ٱلْحُرُمُ فَٱقْتُلُوا۟ ٱلْمُشْرِكِينَ حَيْثُ وَجَدتُّمُوهُمْ وَخُذُوهُمْ وَٱحْصُرُوهُمْ وَٱقْعُدُوا۟ لَهُمْ كُلَّ مَرْصَدٍۢ ۚ فَإِن تَابُوا۟ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَءَاتَوُا۟ ٱلزَّكَوٰةَ فَخَلُّوا۟ سَبِيلَهُمْ ۚ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ ﴿5﴾", "ru": "А когда кончатся месяцы запретные, то избивайте многобожников, где их найдете, захватывайте их, осаждайте, устраивайте засаду против них во всяком скрытом месте! Если они обратились и выполняли молитву и давали очищение, то освободите им дорогу: ведь Аллах - прощающий, милосердный!"}], "n": "Что сказано: «А если они обратились, и выполнили молитву, и дали очищение, то они — братья ваши в религии» (9:11); «не говорите тому, кто предложит вам мир: Ты не верующий» (4:94); освободить дорогу «если они обратились и выполняли молитву и давали очищение» (9:5).\nВ чём проблема: признание ⟦братом по вере⟧ связано с внешними действиями (молитва, закят). Но в 49:14 внутренняя вера важнее слов. Нет единой процедуры. Ещё один важный момент: по 9:5 переход в ислам (с молитвой и закятом) сохранял жизнь; это показывает связь религиозного акта с вопросом войны. В 4:94 запрещено выносить приговор «ты не верующий» тому, кто предложил мир.", "c": null, "x": ["49:14"], "t": "Как признать «братом по вере»", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. В 9:5 и 9:11 сохранение жизни и «братство» связаны с внешними действиями (молитва, закят), а в 49:14 внутренняя вера важнее слов. Единого критерия, кто мусульманин, в тексте нет; противоречие мягкое."}], "summary": ["В Коране нет единого перечня «пяти столпов»; он собирается из разных аятов.", "Число молитв и ставка закята не названы в тексте; их определила традиция.", "Это наблюдение о полноте текста, а не обвинение в ошибке."]}, {"id": "speaker", "title": "Кто говорит в Коране: «Я», «Мы», «Он»", "icon": "🗣", "group": "Основы: вера, обряды и голос текста", "intro": "Бог в Коране говорит о Себе то «Я», то «Мы», то «Он», а иногда в тексте звучит голос человека, ангела или Пророка. Классическое объяснение: «Мы» — множественное число величия (как царское «мы»), а смена лица — приём арабской речи (ильтифат). Критики указывают, что смены местоимений происходят внутри одного предложения и что часть текста явно произносит не Бог. Ниже — примеры из самого текста.", "verses": [{"refs": ["6:99", "25:48", "6:114", "17:1"], "parts": [{"ref": "6:99", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَهُوَ ٱلَّذِىٓ أَنزَلَ مِنَ ٱلسَّمَآءِ مَآءًۭ فَأَخْرَجْنَا بِهِۦ نَبَاتَ كُلِّ شَىْءٍۢ فَأَخْرَجْنَا مِنْهُ خَضِرًۭا نُّخْرِجُ مِنْهُ حَبًّۭا مُّتَرَاكِبًۭا وَمِنَ ٱلنَّخْلِ مِن طَلْعِهَا قِنْوَانٌۭ دَانِيَةٌۭ وَجَنَّٰتٍۢ مِّنْ أَعْنَابٍۢ وَٱلزَّيْتُونَ وَٱلرُّمَّانَ مُشْتَبِهًۭا وَغَيْرَ مُتَشَٰبِهٍ ۗ ٱنظُرُوٓا۟ إِلَىٰ ثَمَرِهِۦٓ إِذَآ أَثْمَرَ وَيَنْعِهِۦٓ ۚ إِنَّ فِى ذَٰلِكُمْ لَءَايَٰتٍۢ لِّقَوْمٍۢ يُؤْمِنُونَ ﴿99﴾", "ru": "Он - тот, который низвел с неба воду, и Мы произвели благодаря ей рост всякой вещи; Мы вывели из нее зелень, из которой выведем зерна, сидящие в ряд; и из пальмы, из ее завязей, бывают гроздья, близко спускающиеся; выводим и сады из винограда, и маслину, и гранаты, похожие и не похожие. Посмотрите на плоды этого, когда они приносят плоды и на созревание их! Поистине, в этом - знамение для людей, которые веруют!"}, {"ref": "25:48", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "وَهُوَ ٱلَّذِىٓ أَرْسَلَ ٱلرِّيَٰحَ بُشْرًۢا بَيْنَ يَدَىْ رَحْمَتِهِۦ ۚ وَأَنزَلْنَا مِنَ ٱلسَّمَآءِ مَآءًۭ طَهُورًۭا ﴿48﴾", "ru": "Он - тот, который посылает ветры с вестью радости пред Своим милосердием, и низвели Мы с неба воду чистую,"}, {"ref": "6:114", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "أَفَغَيْرَ ٱللَّهِ أَبْتَغِى حَكَمًۭا وَهُوَ ٱلَّذِىٓ أَنزَلَ إِلَيْكُمُ ٱلْكِتَٰبَ مُفَصَّلًۭا ۚ وَٱلَّذِينَ ءَاتَيْنَٰهُمُ ٱلْكِتَٰبَ يَعْلَمُونَ أَنَّهُۥ مُنَزَّلٌۭ مِّن رَّبِّكَ بِٱلْحَقِّ ۖ فَلَا تَكُونَنَّ مِنَ ٱلْمُمْتَرِينَ ﴿114﴾", "ru": "Разве я пожелаю судьей кого-либо, кроме Аллаха? Ведь Он - тот, который ниспослал вам книгу, ясно изложенную, а те, которым Мы даровали книгу, знают, что она низведена от Господа твоего во истине. Не будь же сомневающимся!"}, {"ref": "17:1", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ سُبْحَٰنَ ٱلَّذِىٓ أَسْرَىٰ بِعَبْدِهِۦ لَيْلًۭا مِّنَ ٱلْمَسْجِدِ ٱلْحَرَامِ إِلَى ٱلْمَسْجِدِ ٱلْأَقْصَا ٱلَّذِى بَٰرَكْنَا حَوْلَهُۥ لِنُرِيَهُۥ مِنْ ءَايَٰتِنَآ ۚ إِنَّهُۥ هُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ ﴿1﴾", "ru": "Хвала тому, кто перенес ночью Своего раба из мечети неприкосновенной в мечеть отдаленнейшую, вокруг которой Мы благословили, чтобы показать ему из Наших знамений. Поистине, Он - всеслышащий, всевидящий!"}], "n": "Что сказано: «Он — тот, который низвёл с неба воду, и Мы произвели благодаря ей рост всякой вещи» (6:99); «Он — тот, который посылает ветры… и низвели Мы с неба воду чистую» (25:48); «Он — тот, который ниспослал вам книгу… а те, которым Мы даровали книгу…» (6:114); «Хвала тому, кто перенёс ночью Своего раба… чтобы показать ему из Наших знамений. Поистине, Он — всеслышащий, всевидящий!» (17:1).\nВ чём проблема: в одном предложении Бог то «Он» (третье лицо, как будто о Нём говорит кто-то другой), то «Мы». В арабской речи это допустимо (ильтифат, ⟦Мы величия⟧), но критики видят в этом следы разных голосов: рассказчик, который хвалит Бога («Хвала тому, кто перенёс»), и сам Бог («Мы благословили»). Исламская позиция: единый Бог говорит о Себе в разных формах; множественное «Мы» — почтительное, оно не означает множественности богов.", "c": null, "x": ["15:9"], "t": "«Он» и «Мы» в одном аяте", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. В одном предложении Бог говорит то «Он», то «Мы». Это место показывает смену говорящего, но арабская речь допускает такую смену (ильтифат); как довод слабый."}, {"refs": ["15:9", "2:41", "20:14", "51:56", "38:75", "16:51"], "parts": [{"ref": "15:9", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "إِنَّا نَحْنُ نَزَّلْنَا ٱلذِّكْرَ وَإِنَّا لَهُۥ لَحَٰفِظُونَ ﴿9﴾", "ru": "Ведь Мы - Мы ниспослали напоминание, и ведь Мы его охраняем."}, {"ref": "2:41", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَءَامِنُوا۟ بِمَآ أَنزَلْتُ مُصَدِّقًۭا لِّمَا مَعَكُمْ وَلَا تَكُونُوٓا۟ أَوَّلَ كَافِرٍۭ بِهِۦ ۖ وَلَا تَشْتَرُوا۟ بِـَٔايَٰتِى ثَمَنًۭا قَلِيلًۭا وَإِيَّٰىَ فَٱتَّقُونِ ﴿41﴾", "ru": "и веруйте в то, что Я ниспослал в подтверждение истинности того, что с вами. Не будьте первыми неверующими в это. И не покупайте за Мои знамения ничтожную цену и Меня бойтесь."}, {"ref": "20:14", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "إِنَّنِىٓ أَنَا ٱللَّهُ لَآ إِلَٰهَ إِلَّآ أَنَا۠ فَٱعْبُدْنِى وَأَقِمِ ٱلصَّلَوٰةَ لِذِكْرِىٓ ﴿14﴾", "ru": "Воистину, Я - Бог, нет божества, кроме Меня! Поклоняйся же Мне и совершай молитву в Мое воспоминание!"}, {"ref": "51:56", "sura": "Adh-Dhaariyat", "sura_ar": "سُورَةُ الذَّارِيَاتِ", "type": "Meccan", "ar": "وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ ﴿56﴾", "ru": "Я ведь создал джиннов и людей только, чтобы они Мне поклонялись."}, {"ref": "38:75", "sura": "Saad", "sura_ar": "سُورَةُ صٓ", "type": "Meccan", "ar": "قَالَ يَٰٓإِبْلِيسُ مَا مَنَعَكَ أَن تَسْجُدَ لِمَا خَلَقْتُ بِيَدَىَّ ۖ أَسْتَكْبَرْتَ أَمْ كُنتَ مِنَ ٱلْعَالِينَ ﴿75﴾", "ru": "Он сказал: \"О Иблис, что удержало тебя от поклонения тому, что Я создал Своими руками? Возгордился ли ты или оказался из высших?\""}, {"ref": "16:51", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "۞ وَقَالَ ٱللَّهُ لَا تَتَّخِذُوٓا۟ إِلَٰهَيْنِ ٱثْنَيْنِ ۖ إِنَّمَا هُوَ إِلَٰهٌۭ وَٰحِدٌۭ ۖ فَإِيَّٰىَ فَٱرْهَبُونِ ﴿51﴾", "ru": "И сказал Аллах: \"Не берите двух богов; ведь бог - только один, и Меня бойтесь!\""}], "n": "Что сказано: ⟦Мы ниспослали напоминание, и Мы его охраняем⟧ (15:9); «веруйте в то, что Я ниспослал» (2:41); «Воистину, Я — Бог, нет божества, кроме Меня!» (20:14); ⟦Я создал джиннов и людей только для поклонения Мне⟧ (51:56); «что удержало тебя от поклонения тому, что Я создал Своими руками?» (38:75); «И сказал Аллах: Не берите двух богов… и Меня бойтесь!» (16:51).\nВ чём проблема: в одной книге Бог о Себе — то «Мы» (величие), то «Я» (личное обращение), и в 16:51 фраза «И сказал Аллах» (третье лицо) переходит в «Меня бойтесь». Явного объяснения в тексте нет. Можно заметить, что «Я» чаще звучит в заповедях и в утверждении единственности Бога (20:14, 21:92), а «Мы» — в рассказах о творении, чудесах и ниспослании; но строгого правила нет: в 38:75 «Я создал Своими руками» стоит в рассказе о творении. Критики: если «Мы» — просто стилистика, то объяснения в тексте нет.", "c": null, "x": [], "t": "«Мы» и «Я» — Бог говорит о Себе по-разному", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Бог говорит о Себе то «Мы», то «Я», без объяснения. довод о «разных голосах» опирается на допущение."}, {"refs": ["1:2", "19:64", "37:164", "6:104", "27:91", "51:50", "42:10"], "parts": [{"ref": "1:2", "sura": "Al-Faatiha", "sura_ar": "سُورَةُ ٱلْفَاتِحَةِ", "type": "Meccan", "ar": "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ ﴿2﴾", "ru": "Хвала - Аллаху, Господу миров,"}, {"ref": "19:64", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "وَمَا نَتَنَزَّلُ إِلَّا بِأَمْرِ رَبِّكَ ۖ لَهُۥ مَا بَيْنَ أَيْدِينَا وَمَا خَلْفَنَا وَمَا بَيْنَ ذَٰلِكَ ۚ وَمَا كَانَ رَبُّكَ نَسِيًّۭا ﴿64﴾", "ru": "Нисходим мы только по повелению Господа твоего, Ему принадлежит то, что пред нами и что позади нас и что между этим. Господь твой не забывчив!"}, {"ref": "37:164", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "وَمَا مِنَّآ إِلَّا لَهُۥ مَقَامٌۭ مَّعْلُومٌۭ ﴿164﴾", "ru": "и нет среди нас никого без известного места."}, {"ref": "6:104", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "قَدْ جَآءَكُم بَصَآئِرُ مِن رَّبِّكُمْ ۖ فَمَنْ أَبْصَرَ فَلِنَفْسِهِۦ ۖ وَمَنْ عَمِىَ فَعَلَيْهَا ۚ وَمَآ أَنَا۠ عَلَيْكُم بِحَفِيظٍۢ ﴿104﴾", "ru": "Пришли к вам наглядные знамения от вашего Господа. Кто узрел, - то для самого себя; а кто слеп, - во вред самому себе. Я для вас - не хранитель!"}, {"ref": "27:91", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "إِنَّمَآ أُمِرْتُ أَنْ أَعْبُدَ رَبَّ هَٰذِهِ ٱلْبَلْدَةِ ٱلَّذِى حَرَّمَهَا وَلَهُۥ كُلُّ شَىْءٍۢ ۖ وَأُمِرْتُ أَنْ أَكُونَ مِنَ ٱلْمُسْلِمِينَ ﴿91﴾", "ru": "\"Мне повелено поклониться Господу этого города, который Он сделал запретным. Ему принадлежит все, и мне повелено быть предавшимся"}, {"ref": "51:50", "sura": "Adh-Dhaariyat", "sura_ar": "سُورَةُ الذَّارِيَاتِ", "type": "Meccan", "ar": "فَفِرُّوٓا۟ إِلَى ٱللَّهِ ۖ إِنِّى لَكُم مِّنْهُ نَذِيرٌۭ مُّبِينٌۭ ﴿50﴾", "ru": "Бегите же Аллаху: я от Него для вас увещатель явный."}, {"ref": "42:10", "sura": "Ash-Shura", "sura_ar": "سُورَةُ الشُّورَىٰ", "type": "Meccan", "ar": "وَمَا ٱخْتَلَفْتُمْ فِيهِ مِن شَىْءٍۢ فَحُكْمُهُۥٓ إِلَى ٱللَّهِ ۚ ذَٰلِكُمُ ٱللَّهُ رَبِّى عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ ﴿10﴾", "ru": "А то, в чем вы разошлись, - решение его принадлежит Аллаху. Это для вас Аллах - мой Господь, на Него я положился и к Нему обращаюсь."}], "n": "Что сказано: Первая сура — молитва людей Богу: ⟦Хвала Аллаху, Господу миров… Тебе мы поклоняемся и просим помочь⟧ (1:2-7); ангел говорит: «Нисходим мы только по повелению Господа твоего» (19:64); ангелы: ⟦нет среди нас никого без известного места; мы стоим рядами и возносим хвалу⟧ (37:164-166); Пророк: «Я для вас — не хранитель» (6:104), «Мне повелено поклониться Господу этого города» (27:91), «я от Него для вас увещатель явный» (51:50-51), «Аллах — мой Господь, на Него я положился» (42:10).\nВ чём проблема: если весь Коран — прямая речь Бога, то в нём не должно быть слов, сказанных человеком или ангелом без указания ⟦Скажи⟧. Но здесь говорит человек (1:5 — молящиеся; 42:10 — «Аллах — мой Господь»), ангел (19:64) или Пророк (27:91, 51:50). Первая сура — вообще не речь Бога, а молитва к Нему. Традиционный ответ: перед такими аятами подразумевается ⟦Скажи⟧. Критики: такого слова в тексте нет, и это указывает на то, что текст включает голос людей. Исламские учёные различают речь Бога, переданную дословно, и речь, переданную через ангела или Пророка.", "c": null, "x": ["4:82"], "t": "Кто говорит, если это не Бог", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. В тексте есть слова, которые явно произносят человек или ангел (1:5, 19:64), хотя Коран называют «речью Бога». Это проверяемое наблюдение; верующие отвечают, что это «речь Бога от лица человека»."}, {"refs": ["79:24", "28:38", "21:92", "28:30"], "parts": [{"ref": "79:24", "sura": "An-Naazi'aat", "sura_ar": "سُورَةُ النَّازِعَاتِ", "type": "Meccan", "ar": "فَقَالَ أَنَا۠ رَبُّكُمُ ٱلْأَعْلَىٰ ﴿24﴾", "ru": "и сказал: \"Я - Господь ваш высочайший!\""}, {"ref": "28:38", "sura": "Al-Qasas", "sura_ar": "سُورَةُ القَصَصِ", "type": "Meccan", "ar": "وَقَالَ فِرْعَوْنُ يَٰٓأَيُّهَا ٱلْمَلَأُ مَا عَلِمْتُ لَكُم مِّنْ إِلَٰهٍ غَيْرِى فَأَوْقِدْ لِى يَٰهَٰمَٰنُ عَلَى ٱلطِّينِ فَٱجْعَل لِّى صَرْحًۭا لَّعَلِّىٓ أَطَّلِعُ إِلَىٰٓ إِلَٰهِ مُوسَىٰ وَإِنِّى لَأَظُنُّهُۥ مِنَ ٱلْكَٰذِبِينَ ﴿38﴾", "ru": "И сказал Фираун: \"О знать, я не знаю для вас другого бога, кроме меня. Разожги мне, Хаман, огонь над глиной и устрой башню: может быть, я поднимусь к богу Мусы. Я ведь думаю, что он - лжец\"."}, {"ref": "21:92", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "إِنَّ هَٰذِهِۦٓ أُمَّتُكُمْ أُمَّةًۭ وَٰحِدَةًۭ وَأَنَا۠ رَبُّكُمْ فَٱعْبُدُونِ ﴿92﴾", "ru": "Поистине, этот ваш народ - народ единый, и Я - Господь ваш, поклоняйтесь же Мне!"}, {"ref": "28:30", "sura": "Al-Qasas", "sura_ar": "سُورَةُ القَصَصِ", "type": "Meccan", "ar": "فَلَمَّآ أَتَىٰهَا نُودِىَ مِن شَٰطِئِ ٱلْوَادِ ٱلْأَيْمَنِ فِى ٱلْبُقْعَةِ ٱلْمُبَٰرَكَةِ مِنَ ٱلشَّجَرَةِ أَن يَٰمُوسَىٰٓ إِنِّىٓ أَنَا ٱللَّهُ رَبُّ ٱلْعَٰلَمِينَ ﴿30﴾", "ru": "И когда он подошел к нему, был к нему зов с правой стороны долины в благословенной роще из кустарника: \"О Муса, Я - Аллах, Господь миров!"}], "n": "Что сказано: Фараон: «Я — Господь ваш высочайший!» (79:24); «Я не знаю для вас другого бога, кроме меня» (28:38); Бог: «Я — Господь ваш, поклоняйтесь же Мне!» (21:92); «О Муса, Я — Аллах, Господь миров» (28:30).\nВ чём проблема: одна и та же формула «Я — Господь» звучит и в устах Бога, и как богохульство Фараона. Для критиков это показывает, что в Коране голос «Я» может принадлежать разным говорящим; для верующих — что смысл определяется контекстом. Само по себе это не противоречие, но показывает, что смена лица в тексте не всегда означает смену говорящего: критерий — контекст, а не форма.", "c": null, "x": [], "t": "Фараон говорит «Я — Господь» теми же словами", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Одна и та же формула «Я — Господь» звучит у Бога и у Фараона. Это не доказывает смены говорящего: смысл задан контекстом."}], "summary": ["Смена «Я», «Мы», «Он» объяснима стилем арабской речи.", "Есть места, где говорит явно не Бог (человек, ангел).", "Довод слабый: на нём лучше не строить главные выводы."]}, {"id": "gods", "title": "Другие боги и «дочери Аллаха» в Коране", "icon": "🏛", "group": "Основы: вера, обряды и голос текста", "intro": "Упоминает ли Коран других богов? Да: он называет по именам языческие божества, пересказывает верования многобожников (в том числе то, что они сами признавали Аллаха творцом) и спорит с ними. Важно, что «Мы» в речи Бога никак не связано с этими божествами: это не упоминание других богов. Но сами аяты о чужих богах содержат вопросы.", "verses": [{"refs": ["53:19-23", "71:23", "37:125", "4:117", "4:51"], "parts": [{"ref": "53:19-23", "sura": "An-Najm", "sura_ar": "سُورَةُ النَّجۡمِ", "type": "Meccan", "ar": "أَفَرَءَيْتُمُ ٱللَّٰتَ وَٱلْعُزَّىٰ ﴿19﴾ وَمَنَوٰةَ ٱلثَّالِثَةَ ٱلْأُخْرَىٰٓ ﴿20﴾ أَلَكُمُ ٱلذَّكَرُ وَلَهُ ٱلْأُنثَىٰ ﴿21﴾ تِلْكَ إِذًۭا قِسْمَةٌۭ ضِيزَىٰٓ ﴿22﴾ إِنْ هِىَ إِلَّآ أَسْمَآءٌۭ سَمَّيْتُمُوهَآ أَنتُمْ وَءَابَآؤُكُم مَّآ أَنزَلَ ٱللَّهُ بِهَا مِن سُلْطَٰنٍ ۚ إِن يَتَّبِعُونَ إِلَّا ٱلظَّنَّ وَمَا تَهْوَى ٱلْأَنفُسُ ۖ وَلَقَدْ جَآءَهُم مِّن رَّبِّهِمُ ٱلْهُدَىٰٓ ﴿23﴾", "ru": "(19) Видели ли вы ал-Лат, и ал-Уззу, (20) и Манат - третью, иную? (21) Неужели у вас - мужчины, а у Него - женщины? (22) Это тогда - разделение обидное! (23) Они - только имена, которыми вы сами назвали, - вы и родители ваши. Аллах не посылал с ними никакого знамения. Они следуют только предположениям и тому, к чему склонны души, а к ним уже пришло от Господа их руководство."}, {"ref": "71:23", "sura": "Nooh", "sura_ar": "سُورَةُ نُوحٍ", "type": "Meccan", "ar": "وَقَالُوا۟ لَا تَذَرُنَّ ءَالِهَتَكُمْ وَلَا تَذَرُنَّ وَدًّۭا وَلَا سُوَاعًۭا وَلَا يَغُوثَ وَيَعُوقَ وَنَسْرًۭا ﴿23﴾", "ru": "и сказали они: \"Не оставляйте никак ваших богов, не оставляйте никак Вадда, и Сува, и Йагуса, и Йаука, и Насра!\""}, {"ref": "37:125", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "أَتَدْعُونَ بَعْلًۭا وَتَذَرُونَ أَحْسَنَ ٱلْخَٰلِقِينَ ﴿125﴾", "ru": "Разве вы призываете Баала и оставляете лучшего из творцов,"}, {"ref": "4:117", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِن يَدْعُونَ مِن دُونِهِۦٓ إِلَّآ إِنَٰثًۭا وَإِن يَدْعُونَ إِلَّا شَيْطَٰنًۭا مَّرِيدًۭا ﴿117﴾", "ru": "Они призывают помимо Него только женский пол; они призывают только сатану, отступника."}, {"ref": "4:51", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "أَلَمْ تَرَ إِلَى ٱلَّذِينَ أُوتُوا۟ نَصِيبًۭا مِّنَ ٱلْكِتَٰبِ يُؤْمِنُونَ بِٱلْجِبْتِ وَٱلطَّٰغُوتِ وَيَقُولُونَ لِلَّذِينَ كَفَرُوا۟ هَٰٓؤُلَآءِ أَهْدَىٰ مِنَ ٱلَّذِينَ ءَامَنُوا۟ سَبِيلًا ﴿51﴾", "ru": "Разве ты не видел тех, которым дарована часть писания, - они веруют в джибта и тагута и говорят о тех, которые не веровали: \"Эти - вернее путем, чем те, которые уверовали\"."}], "n": "Что сказано: «Видели ли вы ал-Лат и ал-Уззу и Манат — третью, иную?» (53:19-20); «Они — только имена, которыми вы сами назвали, вы и родители ваши. Аллах не посылал с ними никакого знамения» (53:23); народ Нуха: ⟦Не оставляйте никак ваших богов: не оставляйте Вадда, и Сува, и Йагуса, и Йаука, и Насра⟧ (71:23); «Разве вы призываете Баала?» (37:125); «они призывают помимо Него только женский пол» (4:117); «они веруют в джибта и тагута» (4:51).\nВ чём проблема: Коран называет по именам божеств (арабских — Лат, Узза, Манат; ханаанского — Баал; доисламских — Вадд, Сува, Йагус, Йаук, Наср) и объявляет их ⟦только именами⟧. В 4:117 они названы ⟦женским полом⟧. Таким образом, Коран не отрицает, что вокруг был многобожный культ, но объясняет его как имена без основания. Для критиков это показывает исторический контекст текста; для верующих — борьбу за единобожие.", "c": null, "x": ["53:21-22"], "t": "Названия языческих богов", "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Коран по именам называет языческих богов (Лат, Узза, Манат) и признаёт, что их почитали. Это история, а не противоречие; важно для понимания среды, не как довод против текста."}, {"refs": ["29:61", "31:25", "43:9", "39:3", "10:18"], "parts": [{"ref": "29:61", "sura": "Al-Ankaboot", "sura_ar": "سُورَةُ العَنكَبُوتِ", "type": "Meccan", "ar": "وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ وَسَخَّرَ ٱلشَّمْسَ وَٱلْقَمَرَ لَيَقُولُنَّ ٱللَّهُ ۖ فَأَنَّىٰ يُؤْفَكُونَ ﴿61﴾", "ru": "А если ты их спросишь: \"Кто сотворил небеса и землю и подчинил солнце и луну?\" - они, конечно, скажут: \"Аллах\". До чего же они обольщены!"}, {"ref": "31:25", "sura": "Luqman", "sura_ar": "سُورَةُ لُقۡمَانَ", "type": "Meccan", "ar": "وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ لَيَقُولُنَّ ٱللَّهُ ۚ قُلِ ٱلْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ ﴿25﴾", "ru": "А если ты их спросишь: \"Кто сотворил небеса и землю?\" - они, конечно, скажут: \"Аллах\". Скажи: \"Хвала Аллаху!\" - но большая часть их не знает!"}, {"ref": "43:9", "sura": "Az-Zukhruf", "sura_ar": "سُورَةُ الزُّخۡرُفِ", "type": "Meccan", "ar": "وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ لَيَقُولُنَّ خَلَقَهُنَّ ٱلْعَزِيزُ ٱلْعَلِيمُ ﴿9﴾", "ru": "А если ты их спросишь, кто сотворил небеса и землю, они, конечно, скажут: сотворил их славный, мудрый,"}, {"ref": "39:3", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "أَلَا لِلَّهِ ٱلدِّينُ ٱلْخَالِصُ ۚ وَٱلَّذِينَ ٱتَّخَذُوا۟ مِن دُونِهِۦٓ أَوْلِيَآءَ مَا نَعْبُدُهُمْ إِلَّا لِيُقَرِّبُونَآ إِلَى ٱللَّهِ زُلْفَىٰٓ إِنَّ ٱللَّهَ يَحْكُمُ بَيْنَهُمْ فِى مَا هُمْ فِيهِ يَخْتَلِفُونَ ۗ إِنَّ ٱللَّهَ لَا يَهْدِى مَنْ هُوَ كَٰذِبٌۭ كَفَّارٌۭ ﴿3﴾", "ru": "О! Аллаху - чистая вера. А те, которые взяли помощников, кроме Него: \"Мы поклоняемся им только, чтобы они приблизили нас к Аллаху близостью\". Аллах рассудит между ними в том, в чем они расходятся! Поистине, Аллах не ведет прямым путем того, кто лжив, неверен!"}, {"ref": "10:18", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "وَيَعْبُدُونَ مِن دُونِ ٱللَّهِ مَا لَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ وَيَقُولُونَ هَٰٓؤُلَآءِ شُفَعَٰٓؤُنَا عِندَ ٱللَّهِ ۚ قُلْ أَتُنَبِّـُٔونَ ٱللَّهَ بِمَا لَا يَعْلَمُ فِى ٱلسَّمَٰوَٰتِ وَلَا فِى ٱلْأَرْضِ ۚ سُبْحَٰنَهُۥ وَتَعَٰلَىٰ عَمَّا يُشْرِكُونَ ﴿18﴾", "ru": "И поклоняются они помимо Аллаха тому, что не вредит им и не помогает, и говорят: \"Это - наши заступники у Аллаха\". Скажи: \"Разве вы сообщите Аллаху о чем-либо, чего Он не знает в небесах и на земле? Хвала Ему, и превыше Он того, что они Ему придают в соучастники!\""}], "n": "Что сказано: ⟦Если ты спросишь их: Кто сотворил небеса и землю? — они, конечно, скажут: Аллах⟧ (29:61; 31:25; 43:9); «Мы поклоняемся им только, чтобы они приблизили нас к Аллаху близостью» (39:3); «Это — наши заступники у Аллаха» (10:18).\nВ чём проблема: Коран сам сообщает, что его слушатели знали Аллаха как творца и поклонялись другим богам как посредникам. Значит, «Аллах» — имя, которое существовало в доисламской Аравии; Коран не вводит нового Бога, а отвергает посредников. Критики видят в этом исторический контекст возникновения текста; верующие — доказательство единой изначальной веры (фитры) и преемственности с Ибрахимом.", "c": null, "x": [], "t": "Многобожники сами признавали Аллаха", "at": "расходится с историей или Библией", "pw": "слабый", "cl": "Вывод: возможное расхождение с историческими данными, подтверждений недостаточно. Коран сам сообщает, что многобожники знали Аллаха как творца. Значит, имя было известно в Аравии до Корана. довод слабый."}, {"refs": ["16:57", "37:149-153", "43:16-19", "52:39", "6:100", "37:158"], "parts": [{"ref": "16:57", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَيَجْعَلُونَ لِلَّهِ ٱلْبَنَٰتِ سُبْحَٰنَهُۥ ۙ وَلَهُم مَّا يَشْتَهُونَ ﴿57﴾", "ru": "И приписывают они Аллаху дочерей, - хвала Ему! - а им бывает то, чего он пожелает."}, {"ref": "37:149-153", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "فَٱسْتَفْتِهِمْ أَلِرَبِّكَ ٱلْبَنَاتُ وَلَهُمُ ٱلْبَنُونَ ﴿149﴾ أَمْ خَلَقْنَا ٱلْمَلَٰٓئِكَةَ إِنَٰثًۭا وَهُمْ شَٰهِدُونَ ﴿150﴾ أَلَآ إِنَّهُم مِّنْ إِفْكِهِمْ لَيَقُولُونَ ﴿151﴾ وَلَدَ ٱللَّهُ وَإِنَّهُمْ لَكَٰذِبُونَ ﴿152﴾ أَصْطَفَى ٱلْبَنَاتِ عَلَى ٱلْبَنِينَ ﴿153﴾", "ru": "(149) Спроси же их: \"Разве у твоего Господа дочери, а у них сыновья?\" (150) Разве Мы создали ангелов женщинами, и они видели? (151) О! Они ведь от своей лживости говорят: (152) \"Породил Бог!\" - и они лгут. (153) Разве Он предпочел дочерей перед сыновьями?"}, {"ref": "43:16-19", "sura": "Az-Zukhruf", "sura_ar": "سُورَةُ الزُّخۡرُفِ", "type": "Meccan", "ar": "أَمِ ٱتَّخَذَ مِمَّا يَخْلُقُ بَنَاتٍۢ وَأَصْفَىٰكُم بِٱلْبَنِينَ ﴿16﴾ وَإِذَا بُشِّرَ أَحَدُهُم بِمَا ضَرَبَ لِلرَّحْمَٰنِ مَثَلًۭا ظَلَّ وَجْهُهُۥ مُسْوَدًّۭا وَهُوَ كَظِيمٌ ﴿17﴾ أَوَمَن يُنَشَّؤُا۟ فِى ٱلْحِلْيَةِ وَهُوَ فِى ٱلْخِصَامِ غَيْرُ مُبِينٍۢ ﴿18﴾ وَجَعَلُوا۟ ٱلْمَلَٰٓئِكَةَ ٱلَّذِينَ هُمْ عِبَٰدُ ٱلرَّحْمَٰنِ إِنَٰثًا ۚ أَشَهِدُوا۟ خَلْقَهُمْ ۚ سَتُكْتَبُ شَهَٰدَتُهُمْ وَيُسْـَٔلُونَ ﴿19﴾", "ru": "(16) Неужели Он взял из того, что создал, дочерей, а вам предоставил сыновей? (17) А когда кого-нибудь из вас обрадуют тем, что приведено в пример для Милосердного, лицо его темнеет, и он сдерживает гнев. (18) Разве же тот, кто выращен в украшениях и кто в препирательстве, не ясен? (19) И сделали они ангелов, которые - рабы Милосердного, женщинами. Разве они были при создании их? Запишется их свидетельство, и будут они спрошены!"}, {"ref": "52:39", "sura": "At-Tur", "sura_ar": "سُورَةُ الطُّورِ", "type": "Meccan", "ar": "أَمْ لَهُ ٱلْبَنَٰتُ وَلَكُمُ ٱلْبَنُونَ ﴿39﴾", "ru": "Или у него дочери, а у вас - сыны?"}, {"ref": "6:100", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَجَعَلُوا۟ لِلَّهِ شُرَكَآءَ ٱلْجِنَّ وَخَلَقَهُمْ ۖ وَخَرَقُوا۟ لَهُۥ بَنِينَ وَبَنَٰتٍۭ بِغَيْرِ عِلْمٍۢ ۚ سُبْحَٰنَهُۥ وَتَعَٰلَىٰ عَمَّا يَصِفُونَ ﴿100﴾", "ru": "И устроили они Аллаху сотоварищей из джиннов, в то время как Он их создал, и бессмысленно приписали Ему сынов и дочерей без всякого знания. Хвала Ему, и превыше Он того, что они Ему приписывают!"}, {"ref": "37:158", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "وَجَعَلُوا۟ بَيْنَهُۥ وَبَيْنَ ٱلْجِنَّةِ نَسَبًۭا ۚ وَلَقَدْ عَلِمَتِ ٱلْجِنَّةُ إِنَّهُمْ لَمُحْضَرُونَ ﴿158﴾", "ru": "И устроили они родство между Ним и джиннами, а знают джинны, что они будут собраны."}], "n": "Что сказано: «Приписывают они Аллаху дочерей — хвала Ему!» (16:57); «Разве у твоего Господа дочери, а у них сыновья?» (37:149); «Неужели Он взял из того, что создал, дочерей, а вам предоставил сыновей?» (43:16); ⟦Они сделали ангелов, которые рабы Милосердного, женщинами⟧ (43:19); ⟦Или у Него дочери, а у вас сыновья?⟧ (52:39); ⟦устроили Аллаху сотоварищей из джиннов… приписали Ему сынов и дочерей⟧ (6:100); ⟦Они устроили между Ним и джиннами родство⟧ (37:158).\nВ чём проблема: из этих аятов видно, что у арабов-многобожников существовали представления о ⟦дочерях⟧ Аллаха (ангелах) и о ⟦родстве⟧ с джиннами. Коран спорит с ними доводом ⟦у вас сыновья, а у Него дочери — несправедливо⟧: то есть довод построен на предпочтении мужского пола (53:21-22, 16:58). Критики: Коран использует ту же шкалу ценностей, что и оппоненты. Верующие: довод бьёт по логике многобожников.", "c": null, "x": ["53:21-22", "16:58"], "t": "«Дочери Аллаха» и родство с джиннами", "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Спор с многобожниками построен на их же шкале ценностей («у вас сыновья, а у Него дочери»). Это замечание о стиле, не о противоречии."}, {"refs": ["21:22", "17:42", "23:91", "21:98", "21:101", "43:45"], "parts": [{"ref": "21:22", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "لَوْ كَانَ فِيهِمَآ ءَالِهَةٌ إِلَّا ٱللَّهُ لَفَسَدَتَا ۚ فَسُبْحَٰنَ ٱللَّهِ رَبِّ ٱلْعَرْشِ عَمَّا يَصِفُونَ ﴿22﴾", "ru": "Если бы были там боги, кроме Аллаха, то погибли бы они. Хвала Аллаху, владыке трона, превыше Он того, что они Ему приписывают!"}, {"ref": "17:42", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "قُل لَّوْ كَانَ مَعَهُۥٓ ءَالِهَةٌۭ كَمَا يَقُولُونَ إِذًۭا لَّٱبْتَغَوْا۟ إِلَىٰ ذِى ٱلْعَرْشِ سَبِيلًۭا ﴿42﴾", "ru": "Скажи: \"Если бы были вместе с Ним боги, как они говорят, тогда бы они пожелали пути к обладателю трона\"."}, {"ref": "23:91", "sura": "Al-Muminoon", "sura_ar": "سُورَةُ المُؤۡمِنُونَ", "type": "Meccan", "ar": "مَا ٱتَّخَذَ ٱللَّهُ مِن وَلَدٍۢ وَمَا كَانَ مَعَهُۥ مِنْ إِلَٰهٍ ۚ إِذًۭا لَّذَهَبَ كُلُّ إِلَٰهٍۭ بِمَا خَلَقَ وَلَعَلَا بَعْضُهُمْ عَلَىٰ بَعْضٍۢ ۚ سُبْحَٰنَ ٱللَّهِ عَمَّا يَصِفُونَ ﴿91﴾", "ru": "Аллах не брал Себе никакого сына, и не было с ним никакого божества. Иначе каждый бог унес бы то, что он сотворил, и одни из них возносились бы над другими. Хвала Аллаху, превыше Он того, что они Ему приписывают,"}, {"ref": "21:98", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "إِنَّكُمْ وَمَا تَعْبُدُونَ مِن دُونِ ٱللَّهِ حَصَبُ جَهَنَّمَ أَنتُمْ لَهَا وَٰرِدُونَ ﴿98﴾", "ru": "Поистине, вы и то, чему вы поклоняетесь помимо Аллаха, это - дрова для геенны, вы в нее войдете!"}, {"ref": "21:101", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "إِنَّ ٱلَّذِينَ سَبَقَتْ لَهُم مِّنَّا ٱلْحُسْنَىٰٓ أُو۟لَٰٓئِكَ عَنْهَا مُبْعَدُونَ ﴿101﴾", "ru": "Поистине, те, к которым раньше направилось от Нас лучшее, - те будут от нее удалены."}, {"ref": "43:45", "sura": "Az-Zukhruf", "sura_ar": "سُورَةُ الزُّخۡرُفِ", "type": "Meccan", "ar": "وَسْـَٔلْ مَنْ أَرْسَلْنَا مِن قَبْلِكَ مِن رُّسُلِنَآ أَجَعَلْنَا مِن دُونِ ٱلرَّحْمَٰنِ ءَالِهَةًۭ يُعْبَدُونَ ﴿45﴾", "ru": "Спроси тех, кто Мы посылали до тебя из Наших посланников: \"Устанавливали ли Мы помимо Милосердного богов, которым следует поклоняться?\""}], "n": "Что сказано: ⟦Если бы были там (на небесах и земле) боги, кроме Аллаха, то погибли бы они⟧ (21:22); ⟦Если бы были вместе с Ним боги, они пожелали бы пути к обладателю трона⟧ (17:42); «Аллах не брал Себе никакого сына, и не было с Ним никакого божества. Иначе каждый бог унёс бы то, что он сотворил, и одни из них возносились бы над другими» (23:91); ⟦вы и то, чему вы поклоняетесь помимо Аллаха, — дрова для геенны⟧ (21:98); но «те, к которым раньше направилось от Нас лучшее, — те будут от неё удалены» (21:101); «Устанавливали ли Мы помимо Милосердного богов?» (43:45).\nВ чём проблема: логика основана на предположении, что боги неизбежно будут воевать друг с другом (21:22, 23:91); если боги действуют согласованно (как в троичном учении или в политеизме с единым пантеоном), довод не работает. В 21:98 «то, чему вы поклоняетесь» включает и Ису, и ангелов, поэтому в 21:101 нужна оговорка: для согласованности текст требует уточнения. Критики: доказательства единобожия построены на допущениях.", "c": null, "x": ["5:116"], "t": "Доводы Корана против других богов", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Довод «если бы были боги, они бы воевали» логически не закрывает другие модели (пантеон, троица). Это слабость рассуждения, а не противоречие."}], "summary": ["Коран называет языческих богов и признаёт, что их почитали.", "Аллах как имя был известен в доисламской Аравии.", "Довод о воюющих богах (21:22) логически не закрывает другие модели."]}, {"id": "godimage", "title": "Образ Бога: тело, зрение и «узнавание»", "icon": "👁", "group": "Основы: вера, обряды и голос текста", "intro": "Как Коран описывает Самого Бога: у Него «рука», «лик», «глаза», Он «утвердился на троне» и «приходит»; в одних аятах Его нельзя увидеть, в других — увидят; несколько аятов говорят, что Он «узнаёт» что-то после события. Это важно для оценки единства и совместимости образа с утверждением «нет ничего подобного Ему» (42:11).", "verses": [{"refs": ["42:11", "112:4", "38:75", "5:64", "48:10", "55:27", "20:5", "2:210", "89:22", "68:42", "54:14"], "parts": [{"ref": "42:11", "sura": "Ash-Shura", "sura_ar": "سُورَةُ الشُّورَىٰ", "type": "Meccan", "ar": "فَاطِرُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ جَعَلَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَٰجًۭا وَمِنَ ٱلْأَنْعَٰمِ أَزْوَٰجًۭا ۖ يَذْرَؤُكُمْ فِيهِ ۚ لَيْسَ كَمِثْلِهِۦ شَىْءٌۭ ۖ وَهُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ ﴿11﴾", "ru": "Творец небес и земли; Он создал вам из самих себя пары и из животных - пары. Он сеет вас там; нет ничего подобного Ему. Он - слышащий, видящий!"}, {"ref": "112:4", "sura": "Al-Ikhlaas", "sura_ar": "سُورَةُ الإِخۡلَاصِ", "type": "Meccan", "ar": "وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ ﴿4﴾", "ru": "и не был Ему равным ни один!\""}, {"ref": "38:75", "sura": "Saad", "sura_ar": "سُورَةُ صٓ", "type": "Meccan", "ar": "قَالَ يَٰٓإِبْلِيسُ مَا مَنَعَكَ أَن تَسْجُدَ لِمَا خَلَقْتُ بِيَدَىَّ ۖ أَسْتَكْبَرْتَ أَمْ كُنتَ مِنَ ٱلْعَالِينَ ﴿75﴾", "ru": "Он сказал: \"О Иблис, что удержало тебя от поклонения тому, что Я создал Своими руками? Возгордился ли ты или оказался из высших?\""}, {"ref": "5:64", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَقَالَتِ ٱلْيَهُودُ يَدُ ٱللَّهِ مَغْلُولَةٌ ۚ غُلَّتْ أَيْدِيهِمْ وَلُعِنُوا۟ بِمَا قَالُوا۟ ۘ بَلْ يَدَاهُ مَبْسُوطَتَانِ يُنفِقُ كَيْفَ يَشَآءُ ۚ وَلَيَزِيدَنَّ كَثِيرًۭا مِّنْهُم مَّآ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ طُغْيَٰنًۭا وَكُفْرًۭا ۚ وَأَلْقَيْنَا بَيْنَهُمُ ٱلْعَدَٰوَةَ وَٱلْبَغْضَآءَ إِلَىٰ يَوْمِ ٱلْقِيَٰمَةِ ۚ كُلَّمَآ أَوْقَدُوا۟ نَارًۭا لِّلْحَرْبِ أَطْفَأَهَا ٱللَّهُ ۚ وَيَسْعَوْنَ فِى ٱلْأَرْضِ فَسَادًۭا ۚ وَٱللَّهُ لَا يُحِبُّ ٱلْمُفْسِدِينَ ﴿64﴾", "ru": "И сказали иудеи: \"Рука Аллаха привязана!\" У них руки связаны, и прокляты они за то, что говорили. Нет! Руки у Него распростерты: расходует Он, как желает. И конечно, у многих из них низведенное тебе от твоего Господа только увеличивает заблуждение и неверие. Мы бросили между ними вражду и ненависть до дня воскресения. Как только они зажгут огонь для войны, тушит его Аллах. И стремятся они по земле с нечестием, а Аллах не любит распространяющих нечестие!"}, {"ref": "48:10", "sura": "Al-Fath", "sura_ar": "سُورَةُ الفَتۡحِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ يُبَايِعُونَكَ إِنَّمَا يُبَايِعُونَ ٱللَّهَ يَدُ ٱللَّهِ فَوْقَ أَيْدِيهِمْ ۚ فَمَن نَّكَثَ فَإِنَّمَا يَنكُثُ عَلَىٰ نَفْسِهِۦ ۖ وَمَنْ أَوْفَىٰ بِمَا عَٰهَدَ عَلَيْهُ ٱللَّهَ فَسَيُؤْتِيهِ أَجْرًا عَظِيمًۭا ﴿10﴾", "ru": "Поистине, те, которые присягают тебе, присягают Аллаху. Рука Аллаха - над их руками. А кто нарушит, тот нарушает только против самого себя. А кто выполняет то, о чем заключил завет с Аллахом, тому даст Он великую награду."}, {"ref": "55:27", "sura": "Ar-Rahmaan", "sura_ar": "سُورَةُ الرَّحۡمَٰن", "type": "Medinan", "ar": "وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو ٱلْجَلَٰلِ وَٱلْإِكْرَامِ ﴿27﴾", "ru": "и остается лик твоего Господа со славой и достоинством."}, {"ref": "20:5", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "ٱلرَّحْمَٰنُ عَلَى ٱلْعَرْشِ ٱسْتَوَىٰ ﴿5﴾", "ru": "Милосердный - Он утвердился на троне."}, {"ref": "2:210", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "هَلْ يَنظُرُونَ إِلَّآ أَن يَأْتِيَهُمُ ٱللَّهُ فِى ظُلَلٍۢ مِّنَ ٱلْغَمَامِ وَٱلْمَلَٰٓئِكَةُ وَقُضِىَ ٱلْأَمْرُ ۚ وَإِلَى ٱللَّهِ تُرْجَعُ ٱلْأُمُورُ ﴿210﴾", "ru": "Неужели они ждут только, чтобы пришли к ним Аллах в сени облаков и ангелы? И решено было дело, и к Аллаху возвращаются дела."}, {"ref": "89:22", "sura": "Al-Fajr", "sura_ar": "سُورَةُ الفَجۡرِ", "type": "Meccan", "ar": "وَجَآءَ رَبُّكَ وَٱلْمَلَكُ صَفًّۭا صَفًّۭا ﴿22﴾", "ru": "и придет твой Господь и ангелы рядами,"}, {"ref": "68:42", "sura": "Al-Qalam", "sura_ar": "سُورَةُ القَلَمِ", "type": "Meccan", "ar": "يَوْمَ يُكْشَفُ عَن سَاقٍۢ وَيُدْعَوْنَ إِلَى ٱلسُّجُودِ فَلَا يَسْتَطِيعُونَ ﴿42﴾", "ru": "в тот день, когда откроются голени и призовут их поклониться, а они не будут в состоянии."}, {"ref": "54:14", "sura": "Al-Qamar", "sura_ar": "سُورَةُ القَمَرِ", "type": "Meccan", "ar": "تَجْرِى بِأَعْيُنِنَا جَزَآءًۭ لِّمَن كَانَ كُفِرَ ﴿14﴾", "ru": "чтобы плыла она на Наших глазах в воздаяние тому, кого отвергли."}], "n": "Что сказано: «Нет ничего подобного Ему» (42:11); «не был Ему равным ни один» (112:4). Но: «что удержало тебя от поклонения тому, что Я создал Своими руками?» (38:75); «Рука Аллаха — над их руками» (48:10); ⟦руки Его распростёрты⟧ (5:64); «остаётся лик твоего Господа» (55:27); ⟦Милосердный утвердился на троне⟧ (20:5); ⟦придёт Аллах в сени облаков⟧ (2:210); «придёт твой Господь и ангелы рядами» (89:22); «в тот день, когда откроются голени» (68:42); корабль ⟦плывёт на глазах Наших⟧ (54:14).\nВ чём проблема: у Бога описаны руки, лик, глаза, голень, и Он ⟦приходит⟧ и «утвердился на троне». Но «нет ничего подобного Ему». Мусульманские богословы разошлись: одни толкуют эти
