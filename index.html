у не за душу или не за порчу на земле, тот как будто бы убил людей всех, А кто оживил ее, тот как будто бы оживил людей всех. Приходили к ним Наши посланники с ясными знамениями. Потом многие из них после этого по земле излишествовали.", "n": "Кто убил душу не за душу и не за нечестие на земле — как будто убил всех людей. Часто цитируется как гуманный принцип, но содержит оговорку за нечестие на земле и адресовано «сынам Исраила».", "c": null}, {"ref": "3:28", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "لَّا يَتَّخِذِ ٱلْمُؤْمِنُونَ ٱلْكَٰفِرِينَ أَوْلِيَآءَ مِن دُونِ ٱلْمُؤْمِنِينَ ۖ وَمَن يَفْعَلْ ذَٰلِكَ فَلَيْسَ مِنَ ٱللَّهِ فِى شَىْءٍ إِلَّآ أَن تَتَّقُوا۟ مِنْهُمْ تُقَىٰةًۭ ۗ وَيُحَذِّرُكُمُ ٱللَّهُ نَفْسَهُۥ ۗ وَإِلَى ٱللَّهِ ٱلْمَصِيرُ ﴿28﴾", "ru": "Пусть верующие не берут себе близкими неверных помимо верующих. А кто сделает это, у того с Аллахом нет ничего общего, если вы только не будете опасаться их страхом. Аллах предостерегает вас от самого Себя, и к Аллаху - возвращение\".", "n": "Верующим запрещено брать неверных друзьями, кроме как если вы остерегаетесь от них осторожностью — допуск скрывать убеждения (такийя).", "c": null}, {"ref": "66:2", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ ﴿2﴾", "ru": "Аллах установил для вас разрешение ваших клятв. Аллах - наш покровитель; Он - знающий, мудрый.", "n": "«Аллах установил для вас разрешение ваших клятв» — оправдание нарушения клятв.", "c": null}, {"ref": "5:89", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "لَا يُؤَاخِذُكُمُ ٱللَّهُ بِٱللَّغْوِ فِىٓ أَيْمَٰنِكُمْ وَلَٰكِن يُؤَاخِذُكُم بِمَا عَقَّدتُّمُ ٱلْأَيْمَٰنَ ۖ فَكَفَّٰرَتُهُۥٓ إِطْعَامُ عَشَرَةِ مَسَٰكِينَ مِنْ أَوْسَطِ مَا تُطْعِمُونَ أَهْلِيكُمْ أَوْ كِسْوَتُهُمْ أَوْ تَحْرِيرُ رَقَبَةٍۢ ۖ فَمَن لَّمْ يَجِدْ فَصِيَامُ ثَلَٰثَةِ أَيَّامٍۢ ۚ ذَٰلِكَ كَفَّٰرَةُ أَيْمَٰنِكُمْ إِذَا حَلَفْتُمْ ۚ وَٱحْفَظُوٓا۟ أَيْمَٰنَكُمْ ۚ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمْ ءَايَٰتِهِۦ لَعَلَّكُمْ تَشْكُرُونَ ﴿89﴾", "ru": "Аллах не взыскивает с вас за легкомыслие в ваших клятвах, но Он взыскивает с вас за то, что вы связываете клятвы. Искуплением этого - накормить десять бедняков средним из того, чем вы кормите свои семьи, или одеть их, или освободить раба. А кто не найдет, то - пост трех дней. Это - искупление ваших клятв, которыми вы поклялись. Охраняйте же ваши клятвы! Так разъясняет Аллах вам Свои знамения, - может быть, вы будете благодарны!", "n": "Нарушение клятвы искупается: накормить десятерых бедняков, одеть их, освободить раба или поститься три дня.", "c": null}]}, {"id": "muhammad", "title": "Особые права и упрёки Пророку", "icon": "☪", "group": "Пророк, Коран и текст", "intro": "Аяты, в которых Бог напрямую решает личные вопросы Мухаммада и закрепляет за ним привилегии, недоступные остальным мусульманам.", "verses": [{"ref": "33:37", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "وَإِذْ تَقُولُ لِلَّذِىٓ أَنْعَمَ ٱللَّهُ عَلَيْهِ وَأَنْعَمْتَ عَلَيْهِ أَمْسِكْ عَلَيْكَ زَوْجَكَ وَٱتَّقِ ٱللَّهَ وَتُخْفِى فِى نَفْسِكَ مَا ٱللَّهُ مُبْدِيهِ وَتَخْشَى ٱلنَّاسَ وَٱللَّهُ أَحَقُّ أَن تَخْشَىٰهُ ۖ فَلَمَّا قَضَىٰ زَيْدٌۭ مِّنْهَا وَطَرًۭا زَوَّجْنَٰكَهَا لِكَىْ لَا يَكُونَ عَلَى ٱلْمُؤْمِنِينَ حَرَجٌۭ فِىٓ أَزْوَٰجِ أَدْعِيَآئِهِمْ إِذَا قَضَوْا۟ مِنْهُنَّ وَطَرًۭا ۚ وَكَانَ أَمْرُ ٱللَّهِ مَفْعُولًۭا ﴿37﴾", "ru": "И вот ты говорил тому, кого облагодетельствовал Аллах и кого ты облагодетельствовал: \"Удержи при себе свою жену и побойся Аллаха!\" И ты скрывал в своей душе то, что обнаруживал Аллах и боялся людей, а между тем Аллаха следует больше бояться. Когда же Зайд удовлетворил свое желание по отношению к ней, Мы женили тебя на ней, чтобы для верующих не было стеснения с женами их приемышей, когда они удовлетворят свои желания. Дело Аллаха свершается!", "n": "История с Зайнаб: она была женой приёмного сына Мухаммада Зайда; после развода Бог сам «женил» её на Пророке, чтобы устранить вину перед верующими.", "c": "Традиционно — отмена обычая усыновления; критики видят в аяте удобное откровение по личному вопросу."}, {"ref": "33:50", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ إِنَّآ أَحْلَلْنَا لَكَ أَزْوَٰجَكَ ٱلَّٰتِىٓ ءَاتَيْتَ أُجُورَهُنَّ وَمَا مَلَكَتْ يَمِينُكَ مِمَّآ أَفَآءَ ٱللَّهُ عَلَيْكَ وَبَنَاتِ عَمِّكَ وَبَنَاتِ عَمَّٰتِكَ وَبَنَاتِ خَالِكَ وَبَنَاتِ خَٰلَٰتِكَ ٱلَّٰتِى هَاجَرْنَ مَعَكَ وَٱمْرَأَةًۭ مُّؤْمِنَةً إِن وَهَبَتْ نَفْسَهَا لِلنَّبِىِّ إِنْ أَرَادَ ٱلنَّبِىُّ أَن يَسْتَنكِحَهَا خَالِصَةًۭ لَّكَ مِن دُونِ ٱلْمُؤْمِنِينَ ۗ قَدْ عَلِمْنَا مَا فَرَضْنَا عَلَيْهِمْ فِىٓ أَزْوَٰجِهِمْ وَمَا مَلَكَتْ أَيْمَٰنُهُمْ لِكَيْلَا يَكُونَ عَلَيْكَ حَرَجٌۭ ۗ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًۭا ﴿50﴾", "ru": "О пророк, Мы разрешили тебе твоими женами тех, которым ты дал их награду, и тех, которыми овладела твоя десница из того, что даровал Аллах тебе в добычу, и дочерей твоего дяди со стороны отца, и дочерей твоих теток со стороны отца, и дочерей твоего дяди со стороны матери, и дочерей твоих теток со стороны матери, которые выселились вместе с тобой, и верующую женщину, если она отдала самое себя пророку, если пророк пожелает жениться на ней, - исключительно для тебя, помимо верующих. Мы знаем, что Мы установили для них относительно их жен и того, чем овладели десницы их, для того. чтобы не было на тебе стеснения. Аллах - прощающ. милосерд!", "n": "Пророку дозволено то, чего нет у остальных: сверх четырёх жён — любое число, женщина, отдавшая себя Пророку, — только для тебя, не для остальных верующих.", "c": null}, {"ref": "33:53", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَدْخُلُوا۟ بُيُوتَ ٱلنَّبِىِّ إِلَّآ أَن يُؤْذَنَ لَكُمْ إِلَىٰ طَعَامٍ غَيْرَ نَٰظِرِينَ إِنَىٰهُ وَلَٰكِنْ إِذَا دُعِيتُمْ فَٱدْخُلُوا۟ فَإِذَا طَعِمْتُمْ فَٱنتَشِرُوا۟ وَلَا مُسْتَـْٔنِسِينَ لِحَدِيثٍ ۚ إِنَّ ذَٰلِكُمْ كَانَ يُؤْذِى ٱلنَّبِىَّ فَيَسْتَحْىِۦ مِنكُمْ ۖ وَٱللَّهُ لَا يَسْتَحْىِۦ مِنَ ٱلْحَقِّ ۚ وَإِذَا سَأَلْتُمُوهُنَّ مَتَٰعًۭا فَسْـَٔلُوهُنَّ مِن وَرَآءِ حِجَابٍۢ ۚ ذَٰلِكُمْ أَطْهَرُ لِقُلُوبِكُمْ وَقُلُوبِهِنَّ ۚ وَمَا كَانَ لَكُمْ أَن تُؤْذُوا۟ رَسُولَ ٱللَّهِ وَلَآ أَن تَنكِحُوٓا۟ أَزْوَٰجَهُۥ مِنۢ بَعْدِهِۦٓ أَبَدًا ۚ إِنَّ ذَٰلِكُمْ كَانَ عِندَ ٱللَّهِ عَظِيمًا ﴿53﴾", "ru": "О те, которые уверовали! Не входите в дома пророка, если только не будет разрешена вам еда, не дожидаясь ее времени. Но когда вас позовут, то входите, а когда покушаете, то расходитесь, не вступая дружески в беседу. Это с вашей стороны удручает пророка, но он стыдится вас, а Аллах не стыдится истины. А когда просите их о какой-нибудь утвари, то просите их через завесу. Это вам чище для ваших сердец и их сердец. Не следует вам удручать посланника Аллаха и никогда не жениться на его женах после него. Это с вашей стороны велико у Аллаха.", "n": "Верующим запрещено входить в дома Пророка без приглашения, задерживаться, а жениться на его вдовах — «никогда».", "c": null}, {"ref": "66:1", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ ﴿1﴾", "ru": "О, пророк, почему ты запрещаешь то, что разрешил тебе Аллах, домогаясь расположения своих жен? А Аллах - прощающий, милостивый!", "n": "О Пророк! Почему ты запрещаешь то, что Аллах дозволил тебе, стремясь угодить своим жёнам? — Бог вмешивается в семейную ссору.", "c": null}, {"ref": "49:2", "sura": "Al-Hujuraat", "sura_ar": "سُورَةُ الحُجُرَاتِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَرْفَعُوٓا۟ أَصْوَٰتَكُمْ فَوْقَ صَوْتِ ٱلنَّبِىِّ وَلَا تَجْهَرُوا۟ لَهُۥ بِٱلْقَوْلِ كَجَهْرِ بَعْضِكُمْ لِبَعْضٍ أَن تَحْبَطَ أَعْمَٰلُكُمْ وَأَنتُمْ لَا تَشْعُرُونَ ﴿2﴾", "ru": "О вы, которые уверовали! Не поднимайте своих голосов выше голоса пророка и не обращайтесь к нему громко с речью, как обращаетесь друг к другу, чтобы не оказались тщетными ваши дела, а вы и не знаете.", "n": "Нельзя повышать голос над голосом Пророка: иначе ваши деяния пропадут, а вы и не заметите.", "c": null}, {"ref": "33:36", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "وَمَا كَانَ لِمُؤْمِنٍۢ وَلَا مُؤْمِنَةٍ إِذَا قَضَى ٱللَّهُ وَرَسُولُهُۥٓ أَمْرًا أَن يَكُونَ لَهُمُ ٱلْخِيَرَةُ مِنْ أَمْرِهِمْ ۗ وَمَن يَعْصِ ٱللَّهَ وَرَسُولَهُۥ فَقَدْ ضَلَّ ضَلَٰلًۭا مُّبِينًۭا ﴿36﴾", "ru": "Не бывает ни для верующего, ни для верующей, когда решил Аллах и Его посланник дело, выбора в их деле. А кто не слушается Аллаха и Его посланника, тот попал в явное заблуждение.", "n": "Верующий не вправе иметь выбор, когда Бог и Его посланник решили дело.", "c": null}, {"ref": "33:28", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ قُل لِّأَزْوَٰجِكَ إِن كُنتُنَّ تُرِدْنَ ٱلْحَيَوٰةَ ٱلدُّنْيَا وَزِينَتَهَا فَتَعَالَيْنَ أُمَتِّعْكُنَّ وَأُسَرِّحْكُنَّ سَرَاحًۭا جَمِيلًۭا ﴿28﴾", "ru": "О пророк, скажи твоим женам: \"Если вы желаете ближней жизни и ее прикрас, то приходите: я дам вам насладиться и отпущу вас прекрасным способом.", "n": "Пророку приказано предложить жёнам выбор: мирская жизнь или Аллах; обидевшиеся жёны могут быть отпущены. Следом (33:30) угроза — за явный проступок наказание жёнам Пророка удвоено.", "c": null}, {"ref": "33:56", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "إِنَّ ٱللَّهَ وَمَلَٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِىِّ ۚ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ صَلُّوا۟ عَلَيْهِ وَسَلِّمُوا۟ تَسْلِيمًا ﴿56﴾", "ru": "Поистине, Аллах и его ангелы благословляют пророка! О вы, которые уверовали! Совершайте молитвы над ними и приветствуйте приветствием.", "n": "Аллах и Его ангелы благословляют Пророка; о вы, которые уверовали, благословляйте его. Бог приказывает верующим славить человека.", "c": null}, {"ref": "33:57", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ يُؤْذُونَ ٱللَّهَ وَرَسُولَهُۥ لَعَنَهُمُ ٱللَّهُ فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ وَأَعَدَّ لَهُمْ عَذَابًۭا مُّهِينًۭا ﴿57﴾", "ru": "Поистине, те, которые причиняют обиду Аллаху и Его посланнику, - проклял их Аллах в жизни здешней и будущей и приготовил им наказание унизительное.", "n": "Тех, кто обижает Аллаха и Его посланника, проклянёт Аллах в этом мире и в будущем, и им — унизительное мучение.", "c": null}, {"ref": "66:3-5", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "وَإِذْ أَسَرَّ ٱلنَّبِىُّ إِلَىٰ بَعْضِ أَزْوَٰجِهِۦ حَدِيثًۭا فَلَمَّا نَبَّأَتْ بِهِۦ وَأَظْهَرَهُ ٱللَّهُ عَلَيْهِ عَرَّفَ بَعْضَهُۥ وَأَعْرَضَ عَنۢ بَعْضٍۢ ۖ فَلَمَّا نَبَّأَهَا بِهِۦ قَالَتْ مَنْ أَنۢبَأَكَ هَٰذَا ۖ قَالَ نَبَّأَنِىَ ٱلْعَلِيمُ ٱلْخَبِيرُ ﴿3﴾ إِن تَتُوبَآ إِلَى ٱللَّهِ فَقَدْ صَغَتْ قُلُوبُكُمَا ۖ وَإِن تَظَٰهَرَا عَلَيْهِ فَإِنَّ ٱللَّهَ هُوَ مَوْلَىٰهُ وَجِبْرِيلُ وَصَٰلِحُ ٱلْمُؤْمِنِينَ ۖ وَٱلْمَلَٰٓئِكَةُ بَعْدَ ذَٰلِكَ ظَهِيرٌ ﴿4﴾ عَسَىٰ رَبُّهُۥٓ إِن طَلَّقَكُنَّ أَن يُبْدِلَهُۥٓ أَزْوَٰجًا خَيْرًۭا مِّنكُنَّ مُسْلِمَٰتٍۢ مُّؤْمِنَٰتٍۢ قَٰنِتَٰتٍۢ تَٰٓئِبَٰتٍ عَٰبِدَٰتٍۢ سَٰٓئِحَٰتٍۢ ثَيِّبَٰتٍۢ وَأَبْكَارًۭا ﴿5﴾", "ru": "(3) И вот Пророк сообщил втайне какой-то из своих жен новость. А когда она передала это и Аллах ему открыл, то часть он сообщил, а от части уклонился. А когда он сообщил ей про это, она сказала: \"Кто сообщил тебе это?\" Он сказал: \"Сообщил мне знающий, ведающий\". (4) Если вы обе обратитесь к Аллаху... , ведь склонились ваши сердца. А если открыто будете противиться ему... , то ведь Аллах - его защитник, и Джибрил, и праведный из верующих, и ангелы после этого - помощники. (5) Может быть, его Господь, если он даст вам развод, заменит ему женами лучшими, чем вы - предавшимися, верующими, благочестивыми, обращающимися, поклоняющимися, паломничающими, вдовами и девицами.", "n": "Пророк по секрету сказал одной из жён; она разболтала; Бог раскрыл ему; угроза жёнам: Если он разведётся с вами, Господь заменит вас лучшими женами — вмешательство Бога в семейную ссору.", "c": null}, {"ref": "8:1", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَسْـَٔلُونَكَ عَنِ ٱلْأَنفَالِ ۖ قُلِ ٱلْأَنفَالُ لِلَّهِ وَٱلرَّسُولِ ۖ فَٱتَّقُوا۟ ٱللَّهَ وَأَصْلِحُوا۟ ذَاتَ بَيْنِكُمْ ۖ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥٓ إِن كُنتُم مُّؤْمِنِينَ ﴿1﴾", "ru": "Они спрашивают тебя о добыче. Скажи: \"Добыча принадлежит Аллаху и посланнику; бойтесь же Аллаха, упорядочите между собой и повинуйтесь Аллаху и Его посланнику, если вы веруете!\"", "n": "Военная добыча принадлежит Аллаху и посланнику.", "c": null}, {"ref": "8:41", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "۞ وَٱعْلَمُوٓا۟ أَنَّمَا غَنِمْتُم مِّن شَىْءٍۢ فَأَنَّ لِلَّهِ خُمُسَهُۥ وَلِلرَّسُولِ وَلِذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ إِن كُنتُمْ ءَامَنتُم بِٱللَّهِ وَمَآ أَنزَلْنَا عَلَىٰ عَبْدِنَا يَوْمَ ٱلْفُرْقَانِ يَوْمَ ٱلْتَقَى ٱلْجَمْعَانِ ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ ﴿41﴾", "ru": "И знайте, что если вы взяли что-либо в добычу, то Аллаху - пятая часть, и посланнику, и родственникам, и сиротам, и бедным, и путнику, если вы уверовали в Аллаха и в то, что Мы низвели Нашему рабу в день различения, в день, когда встретились два сборища. Поистине, Аллах мощен над всякой вещью!", "n": "Пятая часть добычи — Аллаху, посланнику, его родственникам, сиротам, беднякам и путникам.", "c": null}, {"ref": "59:6-7", "sura": "Al-Hashr", "sura_ar": "سُورَةُ الحَشۡرِ", "type": "Medinan", "ar": "وَمَآ أَفَآءَ ٱللَّهُ عَلَىٰ رَسُولِهِۦ مِنْهُمْ فَمَآ أَوْجَفْتُمْ عَلَيْهِ مِنْ خَيْلٍۢ وَلَا رِكَابٍۢ وَلَٰكِنَّ ٱللَّهَ يُسَلِّطُ رُسُلَهُۥ عَلَىٰ مَن يَشَآءُ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿6﴾ مَّآ أَفَآءَ ٱللَّهُ عَلَىٰ رَسُولِهِۦ مِنْ أَهْلِ ٱلْقُرَىٰ فَلِلَّهِ وَلِلرَّسُولِ وَلِذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ كَىْ لَا يَكُونَ دُولَةًۢ بَيْنَ ٱلْأَغْنِيَآءِ مِنكُمْ ۚ وَمَآ ءَاتَىٰكُمُ ٱلرَّسُولُ فَخُذُوهُ وَمَا نَهَىٰكُمْ عَنْهُ فَٱنتَهُوا۟ ۚ وَٱتَّقُوا۟ ٱللَّهَ ۖ إِنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ ﴿7﴾", "ru": "(6) И что дал Аллах в добычу о них Своему посланнику, для этого не приходилось вам гнать ни коней, ни верблюдов, но Аллах дает власть Своим посланникам, над кем хочет. Аллах мощен над каждой вещью! (7) Что дал Аллах в добычу посланнику Своему от обитателей селений, - то принадлежит Аллаху, и посланнику, и близким, и сиротам, и бедным, и путнику, чтобы не оказалось это распределением между богатыми у вас. И что даровал вам посланник, то берите, а что он вам запретил, от того удержитесь. И бойтесь Аллаха, ведь Аллах силен наказанием!", "n": "Имущество, взятое без боя (фай), распоряжается посланник: оно принадлежит Аллаху, посланнику и ближним.", "c": null}, {"ref": "58:12", "sura": "Al-Mujaadila", "sura_ar": "سُورَةُ المُجَادلَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا نَٰجَيْتُمُ ٱلرَّسُولَ فَقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَةًۭ ۚ ذَٰلِكَ خَيْرٌۭ لَّكُمْ وَأَطْهَرُ ۚ فَإِن لَّمْ تَجِدُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌ ﴿12﴾", "ru": "О вы, которые уверовали! Когда беседуете втайне с посланником, то выдвиньте перед вашей беседой милостыню. Это лучше для вас и чище. А если не найдете... то Аллах - прощающий, милосердный!", "n": "Перед тайной беседой с Пророком — обязательная милостыня.", "c": null}, {"ref": "24:63", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "لَّا تَجْعَلُوا۟ دُعَآءَ ٱلرَّسُولِ بَيْنَكُمْ كَدُعَآءِ بَعْضِكُم بَعْضًۭا ۚ قَدْ يَعْلَمُ ٱللَّهُ ٱلَّذِينَ يَتَسَلَّلُونَ مِنكُمْ لِوَاذًۭا ۚ فَلْيَحْذَرِ ٱلَّذِينَ يُخَالِفُونَ عَنْ أَمْرِهِۦٓ أَن تُصِيبَهُمْ فِتْنَةٌ أَوْ يُصِيبَهُمْ عَذَابٌ أَلِيمٌ ﴿63﴾", "ru": "Не делайте обращения к посланнику среди вас такими же, как обращение вас друг к другу. Аллах знает тех из вас, которые пробираются, ища убежища. Пусть берегутся те, которые нарушают Его приказ, чтобы их не постигло испытание или не постигло их наказание мучительное!", "n": "Не обращайтесь к посланнику так, как друг к другу.", "c": null}, {"ref": "4:65", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّىٰ يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لَا يَجِدُوا۟ فِىٓ أَنفُسِهِمْ حَرَجًۭا مِّمَّا قَضَيْتَ وَيُسَلِّمُوا۟ تَسْلِيمًۭا ﴿65﴾", "ru": "Но нет - клянусь твоим Господом! - не уверуют они, пока не сделают тебя судьей в том, что запутано между ними. Потом не найдут они в самих себе затруднения о том, что ты решил, и подчинятся полностью.", "n": "Они не уверуют, пока не сделают его судьёй в своих спорах и не примут его решение без стеснения.", "c": null}, {"ref": "48:2", "sura": "Al-Fath", "sura_ar": "سُورَةُ الفَتۡحِ", "type": "Medinan", "ar": "لِّيَغْفِرَ لَكَ ٱللَّهُ مَا تَقَدَّمَ مِن ذَنۢبِكَ وَمَا تَأَخَّرَ وَيُتِمَّ نِعْمَتَهُۥ عَلَيْكَ وَيَهْدِيَكَ صِرَٰطًۭا مُّسْتَقِيمًۭا ﴿2﴾", "ru": "чтобы Аллах простил тебе то, что предшествовало из твоих грехов и что было позже, и чтобы завершил Свою милость тебе и повел тебя прямым путем,", "n": "«Чтобы Аллах простил тебе то, что предшествовало из твоих грехов и что было позже» — Пророку прощены и будущие грехи.", "c": null}, {"ref": "47:19", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "فَٱعْلَمْ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا ٱللَّهُ وَٱسْتَغْفِرْ لِذَنۢبِكَ وَلِلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ ۗ وَٱللَّهُ يَعْلَمُ مُتَقَلَّبَكُمْ وَمَثْوَىٰكُمْ ﴿19﴾", "ru": "Знай же, что нет божества, кроме Аллаха, и проси прощения твоему греху и для верующих - мужчин и женщин. И Аллах знает и место вашего действия и ваше пристанище!", "n": "«Проси прощения твоему греху и для верующих — мужчин и женщин» — приказ Пророку просить прощения за свой грех.", "c": null}, {"ref": "93:7", "sura": "Ad-Dhuhaa", "sura_ar": "سُورَةُ الضُّحَىٰ", "type": "Meccan", "ar": "وَوَجَدَكَ ضَآلًّۭا فَهَدَىٰ ﴿7﴾", "ru": "И нашел тебя заблудшим - и направил на путь?", "n": null, "c": null}, {"ref": "80:1-10", "sura": "Abasa", "sura_ar": "سُورَةُ عَبَسَ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ عَبَسَ وَتَوَلَّىٰٓ ﴿1﴾ أَن جَآءَهُ ٱلْأَعْمَىٰ ﴿2﴾ وَمَا يُدْرِيكَ لَعَلَّهُۥ يَزَّكَّىٰٓ ﴿3﴾ أَوْ يَذَّكَّرُ فَتَنفَعَهُ ٱلذِّكْرَىٰٓ ﴿4﴾ أَمَّا مَنِ ٱسْتَغْنَىٰ ﴿5﴾ فَأَنتَ لَهُۥ تَصَدَّىٰ ﴿6﴾ وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ ﴿7﴾ وَأَمَّا مَن جَآءَكَ يَسْعَىٰ ﴿8﴾ وَهُوَ يَخْشَىٰ ﴿9﴾ فَأَنتَ عَنْهُ تَلَهَّىٰ ﴿10﴾", "ru": "(1) Он нахмурился и отвернулся (2) от того, что подошел к нему слепой (3) А что дало тебе знать, - может быть, он очистится, (4) или станет поминать увещевание, и поможет ему воспоминание. (5) А вот тот, кто богат, (6) к нему ты поворачиваешься. (7) хотя и не на тебе лежит, что он не очищается. (8) А тот, кто приходит к тебе со тщанием (9) и испытывает страх, - (10) ты от него отвлекаешься.", "n": "Пророк «нахмурился и отвернулся», когда к нему пришёл слепой, занимаясь знатными; Бог упрекает его.", "c": null}, {"ref": "9:43", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "عَفَا ٱللَّهُ عَنكَ لِمَ أَذِنتَ لَهُمْ حَتَّىٰ يَتَبَيَّنَ لَكَ ٱلَّذِينَ صَدَقُوا۟ وَتَعْلَمَ ٱلْكَٰذِبِينَ ﴿43﴾", "ru": "Пусть простит тебе Аллах! Почему ты дозволил им прежде, чем выяснились пред тобой те, которые говорили правду, и ты узнал лжецов?", "n": "«Пусть простит тебе Аллах! Почему ты дозволил им прежде, чем выяснились пред тобой те, которые говорили правду?» — упрёк Пророку за решение.", "c": null}, {"ref": "17:73-75", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "وَإِن كَادُوا۟ لَيَفْتِنُونَكَ عَنِ ٱلَّذِىٓ أَوْحَيْنَآ إِلَيْكَ لِتَفْتَرِىَ عَلَيْنَا غَيْرَهُۥ ۖ وَإِذًۭا لَّٱتَّخَذُوكَ خَلِيلًۭا ﴿73﴾ وَلَوْلَآ أَن ثَبَّتْنَٰكَ لَقَدْ كِدتَّ تَرْكَنُ إِلَيْهِمْ شَيْـًۭٔا قَلِيلًا ﴿74﴾ إِذًۭا لَّأَذَقْنَٰكَ ضِعْفَ ٱلْحَيَوٰةِ وَضِعْفَ ٱلْمَمَاتِ ثُمَّ لَا تَجِدُ لَكَ عَلَيْنَا نَصِيرًۭا ﴿75﴾", "ru": "(73) И близки они были к тому, чтобы соблазнить тебя от того, что Мы внушили тебе, чтобы ты измыслил на Нас другое. А тогда они взяли бы тебя своим другом. (74) И если бы Мы тебя не подкрепили, - ты был близок склониться к ним хотя бы немного. (75) Тогда Мы дали бы тебе вкусить вдвойне и в жизни и в смерти. Потом ты не найдешь против Нас помощника!", "n": null, "c": null}, {"ref": "22:52", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "وَمَآ أَرْسَلْنَا مِن قَبْلِكَ مِن رَّسُولٍۢ وَلَا نَبِىٍّ إِلَّآ إِذَا تَمَنَّىٰٓ أَلْقَى ٱلشَّيْطَٰنُ فِىٓ أُمْنِيَّتِهِۦ فَيَنسَخُ ٱللَّهُ مَا يُلْقِى ٱلشَّيْطَٰنُ ثُمَّ يُحْكِمُ ٱللَّهُ ءَايَٰتِهِۦ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌۭ ﴿52﴾", "ru": "И не посылали Мы до тебя никакого посланника или пророка без того, чтобы, когда он предавался мечтам, сатана не бросил в его мечты чего-либо, но Аллах стирает то, что бросает сатана, потом Аллах утверждает Свои знамения, - ведь Аллах - знающий, мудрый!", "n": "«Не посылали Мы до тебя никакого посланника или пророка без того, чтобы, когда он предавался мечтам, сатана не бросил в его мечты чего-либо». Признание, что сатана может вмешиваться в мысли пророка.", "c": "Традиция позже связала аят с сатанинскими аятами; здесь приводится только сам текст."}, {"ref": "4:80", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "مَّن يُطِعِ ٱلرَّسُولَ فَقَدْ أَطَاعَ ٱللَّهَ ۖ وَمَن تَوَلَّىٰ فَمَآ أَرْسَلْنَٰكَ عَلَيْهِمْ حَفِيظًۭا ﴿80﴾", "ru": "Кто повинуется посланнику, тот повинуется Аллаху. А кто отворачивается... то Мы не посылали тебя хранителем над ними.", "n": null, "c": null}]}, {"id": "origin", "title": "Происхождение Корана и самообоснование", "icon": "❝", "group": "Пророк, Коран и текст", "intro": "Сам Коран упоминает возражения современников — что Мухаммад сочинил его, что ему помогали другие люди, что это «сказки первых» — и отвечает вызовом «принесите подобное», угрозой убить пророка за выдумку и утверждением о собственной ясности. Критики видят здесь замкнутый круг доказательства.", "verses": [{"ref": "2:23-24", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِن كُنتُمْ فِى رَيْبٍۢ مِّمَّا نَزَّلْنَا عَلَىٰ عَبْدِنَا فَأْتُوا۟ بِسُورَةٍۢ مِّن مِّثْلِهِۦ وَٱدْعُوا۟ شُهَدَآءَكُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَٰدِقِينَ ﴿23﴾ فَإِن لَّمْ تَفْعَلُوا۟ وَلَن تَفْعَلُوا۟ فَٱتَّقُوا۟ ٱلنَّارَ ٱلَّتِى وَقُودُهَا ٱلنَّاسُ وَٱلْحِجَارَةُ ۖ أُعِدَّتْ لِلْكَٰفِرِينَ ﴿24﴾", "ru": "(23) А если вы в сомнении относительно того, что Мы ниспослали Нашему рабу, то принесите суру, подобную этому, и призовите ваших свидетелей, помимо Аллаха, если вы правдивы. (24) Если же вы этого не сделаете, - а вы никогда этого не сделаете! - то побойтесь огня, топливом для которого люди и камни, уготованного неверным.", "n": "Если вы в сомнении о том, что Мы низвели Нашему рабу, принесите суру подобную и призовите свидетелей… А если вы не сделаете — бойтесь огня.", "c": null}, {"ref": "10:37-38", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "وَمَا كَانَ هَٰذَا ٱلْقُرْءَانُ أَن يُفْتَرَىٰ مِن دُونِ ٱللَّهِ وَلَٰكِن تَصْدِيقَ ٱلَّذِى بَيْنَ يَدَيْهِ وَتَفْصِيلَ ٱلْكِتَٰبِ لَا رَيْبَ فِيهِ مِن رَّبِّ ٱلْعَٰلَمِينَ ﴿37﴾ أَمْ يَقُولُونَ ٱفْتَرَىٰهُ ۖ قُلْ فَأْتُوا۟ بِسُورَةٍۢ مِّثْلِهِۦ وَٱدْعُوا۟ مَنِ ٱسْتَطَعْتُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَٰدِقِينَ ﴿38﴾", "ru": "(37) И не мог этот Коран быть измышленным помимо Аллаха, а только - в подтверждение истинности того, что было ниспослано до него, и в изъяснение писания, - в нем нет сомнения! - от Господа миров. (38) Может быть, они скажут: \"Измыслил он его\". Скажи: \"Приведите же суру, подобную ему, и призывайте, кого вы можете, помимо Аллаха, если вы правдивы!\"", "n": "«И не мог этот Коран быть измышленным помимо Аллаха» — и затем вызов: приведите суру, подобную ему.", "c": null}, {"ref": "11:13", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "أَمْ يَقُولُونَ ٱفْتَرَىٰهُ ۖ قُلْ فَأْتُوا۟ بِعَشْرِ سُوَرٍۢ مِّثْلِهِۦ مُفْتَرَيَٰتٍۢ وَٱدْعُوا۟ مَنِ ٱسْتَطَعْتُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَٰدِقِينَ ﴿13﴾", "ru": "Может быть, они скажут: \"Измыслил он его\". Скажи: \"Приведите же десять сур, подобных ему, измышленных, и призовите, кого вы можете, кроме Аллаха, если вы говорите правду!", "n": "Они говорят: он это измыслил. Скажи: приведите десять сур, подобных ему, измышленных.", "c": null}, {"ref": "17:88", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "قُل لَّئِنِ ٱجْتَمَعَتِ ٱلْإِنسُ وَٱلْجِنُّ عَلَىٰٓ أَن يَأْتُوا۟ بِمِثْلِ هَٰذَا ٱلْقُرْءَانِ لَا يَأْتُونَ بِمِثْلِهِۦ وَلَوْ كَانَ بَعْضُهُمْ لِبَعْضٍۢ ظَهِيرًۭا ﴿88﴾", "ru": "Скажи: \"Если бы собрались люди и джинны, чтобы сделать подобное этому Корану, они бы не создали подобного, хотя бы одни из них были другим помощниками\".", "n": "Если бы собрались люди и джинны, чтобы принести подобное этому Корану, они не принесли бы подобного.", "c": null}, {"ref": "52:33-34", "sura": "At-Tur", "sura_ar": "سُورَةُ الطُّورِ", "type": "Meccan", "ar": "أَمْ يَقُولُونَ تَقَوَّلَهُۥ ۚ بَل لَّا يُؤْمِنُونَ ﴿33﴾ فَلْيَأْتُوا۟ بِحَدِيثٍۢ مِّثْلِهِۦٓ إِن كَانُوا۟ صَٰدِقِينَ ﴿34﴾", "ru": "(33) Или они скажут: \"Измыслил Его он!\" Нет, они не веруют! (34) Пусть же они приведут подобный этому рассказ, если они говорят правду!", "n": "Они говорят: он это сочинил. Пусть принесут речь, подобную ему, если они правдивы.", "c": null}, {"ref": "16:103", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَلَقَدْ نَعْلَمُ أَنَّهُمْ يَقُولُونَ إِنَّمَا يُعَلِّمُهُۥ بَشَرٌۭ ۗ لِّسَانُ ٱلَّذِى يُلْحِدُونَ إِلَيْهِ أَعْجَمِىٌّۭ وَهَٰذَا لِسَانٌ عَرَبِىٌّۭ مُّبِينٌ ﴿103﴾", "ru": "Мы знаем, что они говорят: \"Ведь его учит только человек\". Язык того, на которого они указывают, иноземный, а это - язык арабский, ясный.", "n": "Мы знаем, что они говорят: его учит только человек. Ответ: язык, на который они указывают, — не арабский, а Коран — ясный арабский язык.", "c": null}, {"ref": "25:4-5", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "وَقَالَ ٱلَّذِينَ كَفَرُوٓا۟ إِنْ هَٰذَآ إِلَّآ إِفْكٌ ٱفْتَرَىٰهُ وَأَعَانَهُۥ عَلَيْهِ قَوْمٌ ءَاخَرُونَ ۖ فَقَدْ جَآءُو ظُلْمًۭا وَزُورًۭا ﴿4﴾ وَقَالُوٓا۟ أَسَٰطِيرُ ٱلْأَوَّلِينَ ٱكْتَتَبَهَا فَهِىَ تُمْلَىٰ عَلَيْهِ بُكْرَةًۭ وَأَصِيلًۭا ﴿5﴾", "ru": "(4) И сказали те, которые не веруют: \"Это - только ложь, которую он измыслил, а помогли ему в этом другие люди\". Они совершили несправедливость и искажение! (5) И сказали они: \"Сказки первых! Он приказал записать их для себя, и читаются они ему утром и вечером\".", "n": "«Это — только ложь, которую он измыслил, а помогли ему в этом другие люди»; он списал истории первых — они диктуются ему утром и вечером.", "c": null}, {"ref": "8:31", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَإِذَا تُتْلَىٰ عَلَيْهِمْ ءَايَٰتُنَا قَالُوا۟ قَدْ سَمِعْنَا لَوْ نَشَآءُ لَقُلْنَا مِثْلَ هَٰذَآ ۙ إِنْ هَٰذَآ إِلَّآ أَسَٰطِيرُ ٱلْأَوَّلِينَ ﴿31﴾", "ru": "И когда читаются им Наши знамения, они говорят: \" Мы уже слышали. Если бы мы желали, мы сказали бы то же самое. Это - только истории первых!\"", "n": null, "c": null}, {"ref": "69:40-47", "sura": "Al-Haaqqa", "sura_ar": "سُورَةُ الحَاقَّةِ", "type": "Meccan", "ar": "إِنَّهُۥ لَقَوْلُ رَسُولٍۢ كَرِيمٍۢ ﴿40﴾ وَمَا هُوَ بِقَوْلِ شَاعِرٍۢ ۚ قَلِيلًۭا مَّا تُؤْمِنُونَ ﴿41﴾ وَلَا بِقَوْلِ كَاهِنٍۢ ۚ قَلِيلًۭا مَّا تَذَكَّرُونَ ﴿42﴾ تَنزِيلٌۭ مِّن رَّبِّ ٱلْعَٰلَمِينَ ﴿43﴾ وَلَوْ تَقَوَّلَ عَلَيْنَا بَعْضَ ٱلْأَقَاوِيلِ ﴿44﴾ لَأَخَذْنَا مِنْهُ بِٱلْيَمِينِ ﴿45﴾ ثُمَّ لَقَطَعْنَا مِنْهُ ٱلْوَتِينَ ﴿46﴾ فَمَا مِنكُم مِّنْ أَحَدٍ عَنْهُ حَٰجِزِينَ ﴿47﴾", "ru": "(40) Поистине, это - слова посланника благородного! (41) Это не слова поэта. Мало вы веруете! (42) И не слова прорицателя. Мало вы припоминаете! (43) Ниспослание от Господа миров. (44) А если бы он изрек на Нас какие-нибудь речения, (45) Мы взяли бы его за правую руку, (46) а потом рассекли бы у него сердечную артерию, (47) и не нашлось бы среди вас ни одного, кто бы удержал от него.", "n": "«Это — слова посланника благородного… А если бы он изрёк на Нас какие-нибудь речения, Мы взяли бы его за правую руку, а потом рассекли бы у него сердечную артерию» — угроза убить пророка, если он лжёт; текст подтверждает сам себя.", "c": null}, {"ref": "29:48", "sura": "Al-Ankaboot", "sura_ar": "سُورَةُ العَنكَبُوتِ", "type": "Meccan", "ar": "وَمَا كُنتَ تَتْلُوا۟ مِن قَبْلِهِۦ مِن كِتَٰبٍۢ وَلَا تَخُطُّهُۥ بِيَمِينِكَ ۖ إِذًۭا لَّٱرْتَابَ ٱلْمُبْطِلُونَ ﴿48﴾", "ru": "Ты не читал до него никакого писания и не чертил его своей десницей; иначе пришли бы в сомнение считающие это пустым.", "n": null, "c": null}, {"ref": "11:49", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "تِلْكَ مِنْ أَنۢبَآءِ ٱلْغَيْبِ نُوحِيهَآ إِلَيْكَ ۖ مَا كُنتَ تَعْلَمُهَآ أَنتَ وَلَا قَوْمُكَ مِن قَبْلِ هَٰذَا ۖ فَٱصْبِرْ ۖ إِنَّ ٱلْعَٰقِبَةَ لِلْمُتَّقِينَ ﴿49﴾", "ru": "Это - из рассказов про сокровенное. Мы открываем их тебе; не знал их ты и твой народ до этого. Терпи же! Поистине, конец - богобоязненным!", "n": "Рассказ о Нухе: «Это — из рассказов про сокровенное. Мы открываем их тебе; не знал их ты и твой народ до этого».", "c": "Критики отмечают, что многие истории Корана имеют параллели в Библии и апокрифах."}, {"ref": "3:7", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "هُوَ ٱلَّذِىٓ أَنزَلَ عَلَيْكَ ٱلْكِتَٰبَ مِنْهُ ءَايَٰتٌۭ مُّحْكَمَٰتٌ هُنَّ أُمُّ ٱلْكِتَٰبِ وَأُخَرُ مُتَشَٰبِهَٰتٌۭ ۖ فَأَمَّا ٱلَّذِينَ فِى قُلُوبِهِمْ زَيْغٌۭ فَيَتَّبِعُونَ مَا تَشَٰبَهَ مِنْهُ ٱبْتِغَآءَ ٱلْفِتْنَةِ وَٱبْتِغَآءَ تَأْوِيلِهِۦ ۗ وَمَا يَعْلَمُ تَأْوِيلَهُۥٓ إِلَّا ٱللَّهُ ۗ وَٱلرَّٰسِخُونَ فِى ٱلْعِلْمِ يَقُولُونَ ءَامَنَّا بِهِۦ كُلٌّۭ مِّنْ عِندِ رَبِّنَا ۗ وَمَا يَذَّكَّرُ إِلَّآ أُو۟لُوا۟ ٱلْأَلْبَٰبِ ﴿7﴾", "ru": "Он - тот, кто ниспослал тебе писание; в нем есть стихи, расположенные в порядке, которые - мать книги; и другие - сходные по смыслу. Те же, в сердцах которых уклонение, - они следуют за тем, что в нем сходно, домогаясь смятения и домогаясь толкования этого. Не знает его толкования никто, кроме Аллаха. И твердые в знаниях говорят: \"Мы уверовали в него; все - от нашего Господа\". Вспоминают только обладатели разума!", "n": "В Коране есть «стихи, расположенные в порядке, которые — мать книги; и другие — сходные по смыслу»; за сходными следуют те, «в сердцах которых уклонение»; толкование их, по тексту, знает только Аллах.", "c": null}, {"ref": "12:1-2", "sura": "Yusuf", "sura_ar": "سُورَةُ يُوسُفَ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓر ۚ تِلْكَ ءَايَٰتُ ٱلْكِتَٰبِ ٱلْمُبِينِ ﴿1﴾ إِنَّآ أَنزَلْنَٰهُ قُرْءَٰنًا عَرَبِيًّۭا لَّعَلَّكُمْ تَعْقِلُونَ ﴿2﴾", "ru": "(1) Алиф лам ра. Это - знамения книги ясной. (2) Мы ниспослали ее в виде арабского Корана, - может быть, вы уразумеете!", "n": null, "c": null}, {"ref": "54:17", "sura": "Al-Qamar", "sura_ar": "سُورَةُ القَمَرِ", "type": "Meccan", "ar": "وَلَقَدْ يَسَّرْنَا ٱلْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍۢ ﴿17﴾", "ru": "И Мы облегчили Коран для поминания, но найдется ли хоть один припоминающий!", "n": null, "c": "Противоречит 3:7 о двусмысленных аятах, толкование которых знает только Бог."}, {"ref": "16:89", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَيَوْمَ نَبْعَثُ فِى كُلِّ أُمَّةٍۢ شَهِيدًا عَلَيْهِم مِّنْ أَنفُسِهِمْ ۖ وَجِئْنَا بِكَ شَهِيدًا عَلَىٰ هَٰٓؤُلَآءِ ۚ وَنَزَّلْنَا عَلَيْكَ ٱلْكِتَٰبَ تِبْيَٰنًۭا لِّكُلِّ شَىْءٍۢ وَهُدًۭى وَرَحْمَةًۭ وَبُشْرَىٰ لِلْمُسْلِمِينَ ﴿89﴾", "ru": "В тот день, когда Мы пошлем в каждом народе свидетеля против них и приведем тебя как свидетеля против этих. И ниспослали Мы тебе книгу для разъяснения всего и как прямой путь, милосердие и весть радости для мусульман.", "n": "Ниспослали Мы тебе книгу для разъяснения всякой вещи.", "c": null}, {"ref": "6:38", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ وَلَا طَٰٓئِرٍۢ يَطِيرُ بِجَنَاحَيْهِ إِلَّآ أُمَمٌ أَمْثَالُكُم ۚ مَّا فَرَّطْنَا فِى ٱلْكِتَٰبِ مِن شَىْءٍۢ ۚ ثُمَّ إِلَىٰ رَبِّهِمْ يُحْشَرُونَ ﴿38﴾", "ru": "Нет животного на земле и птицы, летающей на крыльях, которые не были бы общинами, подобными вам. Мы не упустили в книге ничего, потом к вашему Господу они будут собраны.", "n": null, "c": "Сравните с 3:7 и с доктриной отмены (2:106)."}, {"ref": "15:9", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "إِنَّا نَحْنُ نَزَّلْنَا ٱلذِّكْرَ وَإِنَّا لَهُۥ لَحَٰفِظُونَ ﴿9﴾", "ru": "Ведь Мы - Мы ниспослали напоминание, и ведь Мы его охраняем.", "n": null, "c": "Сравните с 87:6-7 и 17:86, где говорится, что Бог может заставить забыть и унести часть откровения."}]}, {"id": "contradictions", "title": "Противоречия внутри Корана", "icon": "⚖", "group": "Пророк, Коран и текст", "intro": "Места, где аяты спорят друг с другом или не совпадают с известной историей. Сам Коран в 4:82 заявляет: «Если бы он был не от Аллаха, они нашли бы в нём много противоречий». Для разрешения противоречий исламская традиция использует доктрину насх (отмена).", "verses": [{"ref": "4:82", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "أَفَلَا يَتَدَبَّرُونَ ٱلْقُرْءَانَ ۚ وَلَوْ كَانَ مِنْ عِندِ غَيْرِ ٱللَّهِ لَوَجَدُوا۟ فِيهِ ٱخْتِلَٰفًۭا كَثِيرًۭا ﴿82﴾", "ru": "Разве же они не размыслят о Коране? Ведь если бы он был не от Аллаха, то они нашли бы там много противоречий.", "n": "Само-критерий: отсутствие противоречий называется доказательством божественности текста.", "c": null}, {"ref": "2:256", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "لَآ إِكْرَاهَ فِى ٱلدِّينِ ۖ قَد تَّبَيَّنَ ٱلرُّشْدُ مِنَ ٱلْغَىِّ ۚ فَمَن يَكْفُرْ بِٱلطَّٰغُوتِ وَيُؤْمِنۢ بِٱللَّهِ فَقَدِ ٱسْتَمْسَكَ بِٱلْعُرْوَةِ ٱلْوُثْقَىٰ لَا ٱنفِصَامَ لَهَا ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ ﴿256﴾", "ru": "Нет принуждения в религии. Уже ясно отличился прямой путь от заблуждения. Кто не верует в идолопоклонство и верует в Аллаха, тот ухватился за надежную опору, для которой нет сокрушения. Поистине, Аллах - слышащий, знающий!", "n": null, "c": "Сравните с 9:5, 9:29, 8:39, 4:89."}, {"ref": "2:62", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَادُوا۟ وَٱلنَّصَٰرَىٰ وَٱلصَّٰبِـِٔينَ مَنْ ءَامَنَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ وَعَمِلَ صَٰلِحًۭا فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ ﴿62﴾", "ru": "Поистине, те, которые уверовали, и те, кто обратились в иудейство, и христиане, и сабии, которые уверовали в Аллаха и в последний день и творили благое, - им их награда у Господа их, нет над ними страха, и не будут они печальны.", "n": "Верующие, иудеи, христиане и сабии, если уверовали в Аллаха и последний день и творили благое, получат награду.", "c": "Сравните с 3:85: кто ищет иной религии, кроме ислама, — не будет принято."}, {"ref": "41:9-12", "sura": "Fussilat", "sura_ar": "سُورَةُ فُصِّلَتۡ", "type": "Meccan", "ar": "۞ قُلْ أَئِنَّكُمْ لَتَكْفُرُونَ بِٱلَّذِى خَلَقَ ٱلْأَرْضَ فِى يَوْمَيْنِ وَتَجْعَلُونَ لَهُۥٓ أَندَادًۭا ۚ ذَٰلِكَ رَبُّ ٱلْعَٰلَمِينَ ﴿9﴾ وَجَعَلَ فِيهَا رَوَٰسِىَ مِن فَوْقِهَا وَبَٰرَكَ فِيهَا وَقَدَّرَ فِيهَآ أَقْوَٰتَهَا فِىٓ أَرْبَعَةِ أَيَّامٍۢ سَوَآءًۭ لِّلسَّآئِلِينَ ﴿10﴾ ثُمَّ ٱسْتَوَىٰٓ إِلَى ٱلسَّمَآءِ وَهِىَ دُخَانٌۭ فَقَالَ لَهَا وَلِلْأَرْضِ ٱئْتِيَا طَوْعًا أَوْ كَرْهًۭا قَالَتَآ أَتَيْنَا طَآئِعِينَ ﴿11﴾ فَقَضَىٰهُنَّ سَبْعَ سَمَٰوَاتٍۢ فِى يَوْمَيْنِ وَأَوْحَىٰ فِى كُلِّ سَمَآءٍ أَمْرَهَا ۚ وَزَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَحِفْظًۭا ۚ ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ ﴿12﴾", "ru": "(9) Скажи: \"Разве вы не веруете в того, кто сотворил землю в два дня, и делаете Ему равных? Это - Господь миров! (10) И устроил Он на ней прочно стоящие сверху ее; и благословил ее и распределил на ней ее пропитание в четыре дня - равно для всех просящих. (11) Потом утвердился Он к небесам - а они были дымом - и сказал им и земле: \"Приходите добровольно или невольно!\" И сказали они: \"Мы приходим добровольно\". (12) И установил Он из них семь небес в два дня и внушил каждому небу его дело; и разукрасили Мы ближайшее небо светильниками и для охраны. Таково установление великого, мудрого\".", "n": "Творение: земля — за 2 дня, затем «в четыре дня» всё остальное на ней, затем семь небес — за 2 дня. Итого 2+4+2 = 8 дней, тогда как 7:54 и 25:59 говорят о шести.", "c": "Апологеты: «четыре дня» включают первые два (итого шесть)."}, {"ref": "7:54", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "إِنَّ رَبَّكُمُ ٱللَّهُ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ فِى سِتَّةِ أَيَّامٍۢ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ يُغْشِى ٱلَّيْلَ ٱلنَّهَارَ يَطْلُبُهُۥ حَثِيثًۭا وَٱلشَّمْسَ وَٱلْقَمَرَ وَٱلنُّجُومَ مُسَخَّرَٰتٍۭ بِأَمْرِهِۦٓ ۗ أَلَا لَهُ ٱلْخَلْقُ وَٱلْأَمْرُ ۗ تَبَارَكَ ٱللَّهُ رَبُّ ٱلْعَٰلَمِينَ ﴿54﴾", "ru": "Поистине, Господь ваш - Аллах, который создал небеса и землю в шесть дней, а потом утвердился на троне. Он закрывает ночью день, который непрестанно за ней движется... И солнце, и луну, и звезды, подчиненные Его власти. О да! Ему принадлежит и создание и власть. Благословен Аллах, Господь миров!", "n": "Бог создал небеса и землю за шесть дней.", "c": null}, {"ref": "79:27-30", "sura": "An-Naazi'aat", "sura_ar": "سُورَةُ النَّازِعَاتِ", "type": "Meccan", "ar": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا ﴿27﴾ رَفَعَ سَمْكَهَا فَسَوَّىٰهَا ﴿28﴾ وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَىٰهَا ﴿29﴾ وَٱلْأَرْضَ بَعْدَ ذَٰلِكَ دَحَىٰهَآ ﴿30﴾", "ru": "(27) Вы ли труднее для создания или небо? Он его построил, (28) воздвиг свод его и устроил, (29) омрачил ночь его и вывел зарю, (30) и землю после этого распростер,", "n": "Небо создано первым, а землю Бог «после этого распростёр» — порядок обратный 41:9–12, где земля создана раньше неба.", "c": null}, {"ref": "70:4", "sura": "Al-Ma'aarij", "sura_ar": "سُورَةُ المَعَارِجِ", "type": "Meccan", "ar": "تَعْرُجُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ إِلَيْهِ فِى يَوْمٍۢ كَانَ مِقْدَارُهُۥ خَمْسِينَ أَلْفَ سَنَةٍۢ ﴿4﴾", "ru": "Восходят ангелы и дух к Нему в день, величина которого пятьдесят тысяч лет.", "n": "День, длина которого — «пятьдесят тысяч лет».", "c": null}, {"ref": "32:5", "sura": "As-Sajda", "sura_ar": "سُورَةُ السَّجۡدَةِ", "type": "Meccan", "ar": "يُدَبِّرُ ٱلْأَمْرَ مِنَ ٱلسَّمَآءِ إِلَى ٱلْأَرْضِ ثُمَّ يَعْرُجُ إِلَيْهِ فِى يَوْمٍۢ كَانَ مِقْدَارُهُۥٓ أَلْفَ سَنَةٍۢ مِّمَّا تَعُدُّونَ ﴿5﴾", "ru": "Он распределяет Свое повеление с неба на землю, потом оно восходит к Нему в некий день, протяжение которого - тысяча лет, как вы считаете.", "n": "В другом месте День Суда равен тысяче лет.", "c": null}, {"ref": "22:47", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "وَيَسْتَعْجِلُونَكَ بِٱلْعَذَابِ وَلَن يُخْلِفَ ٱللَّهُ وَعْدَهُۥ ۚ وَإِنَّ يَوْمًا عِندَ رَبِّكَ كَأَلْفِ سَنَةٍۢ مِّمَّا تَعُدُّونَ ﴿47﴾", "ru": "Они торопят тебя с наказанием, но Аллах не изменит Своего обещания, и, поистине, день у твоего Господа, как тысяча лет из тех, что вы считаете!", "n": "Ещё одна версия: один день у Господа твоего как тысяча лет по вашему счёту.", "c": null}, {"ref": "7:107", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "فَأَلْقَىٰ عَصَاهُ فَإِذَا هِىَ ثُعْبَانٌۭ مُّبِينٌۭ ﴿107﴾", "ru": "И бросил он свой жезл, и вот, это - явно змей.", "n": "Посох Мусы превратился в явного змея (су‘бан).", "c": null}, {"ref": "20:20", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "فَأَلْقَىٰهَا فَإِذَا هِىَ حَيَّةٌۭ تَسْعَىٰ ﴿20﴾", "ru": "И бросил он его. И вот - это змея, которая ползет.", "n": "В другом рассказе посох превратился в ползущую змею (хайя).", "c": null}, {"ref": "27:10", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "وَأَلْقِ عَصَاكَ ۚ فَلَمَّا رَءَاهَا تَهْتَزُّ كَأَنَّهَا جَآنٌّۭ وَلَّىٰ مُدْبِرًۭا وَلَمْ يُعَقِّبْ ۚ يَٰمُوسَىٰ لَا تَخَفْ إِنِّى لَا يَخَافُ لَدَىَّ ٱلْمُرْسَلُونَ ﴿10﴾", "ru": "И брось свою палку!\" Когда же он увидел, что она извивается, как змея, обратился вспять и не возвратился. \"О Муса, не бойся, ведь не боятся у Меня посланные, -", "n": "В третьем — посох извивался, как будто он — джинн (джанн).", "c": null}, {"ref": "4:78", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "أَيْنَمَا تَكُونُوا۟ يُدْرِككُّمُ ٱلْمَوْتُ وَلَوْ كُنتُمْ فِى بُرُوجٍۢ مُّشَيَّدَةٍۢ ۗ وَإِن تُصِبْهُمْ حَسَنَةٌۭ يَقُولُوا۟ هَٰذِهِۦ مِنْ عِندِ ٱللَّهِ ۖ وَإِن تُصِبْهُمْ سَيِّئَةٌۭ يَقُولُوا۟ هَٰذِهِۦ مِنْ عِندِكَ ۚ قُلْ كُلٌّۭ مِّنْ عِندِ ٱللَّهِ ۖ فَمَالِ هَٰٓؤُلَآءِ ٱلْقَوْمِ لَا يَكَادُونَ يَفْقَهُونَ حَدِيثًۭا ﴿78﴾", "ru": "Где бы вы ни были, захватит вас смерть, если бы вы были даже в воздвигнутых башнях. И если постигнет их хорошее, они говорят: \"Это - от Аллаха\", а когда постигнет их дурное, они говорят: \"Это - от тебя\". Скажи: \"Все - от Аллаха\". Почему же эти люди никак не могут понять рассказа?", "n": "«Всё — от Аллаха» (и хорошее, и плохое).", "c": null}, {"ref": "4:79", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "مَّآ أَصَابَكَ مِنْ حَسَنَةٍۢ فَمِنَ ٱللَّهِ ۖ وَمَآ أَصَابَكَ مِن سَيِّئَةٍۢ فَمِن نَّفْسِكَ ۚ وَأَرْسَلْنَٰكَ لِلنَّاسِ رَسُولًۭا ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا ﴿79﴾", "ru": "Что постигло тебя из хорошего, то - от Аллаха, а что постигло из дурного, то - от самого себя. Мы послали тебя к людям посланником. и довольно Аллаха как свидетеля!", "n": "В соседнем аяте: хорошее — от Аллаха, а плохое — от самого человека. Два аята разных по смыслу; традиция пытается их согласовать.", "c": null}, {"ref": "14:4", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "وَمَآ أَرْسَلْنَا مِن رَّسُولٍ إِلَّا بِلِسَانِ قَوْمِهِۦ لِيُبَيِّنَ لَهُمْ ۖ فَيُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ ﴿4﴾", "ru": "Мы отправляли посланников только с языком их народа, чтобы они разъясняли им. Аллах сводит с пути, кого пожелает, и ведет, кого желает. Он - великий, мудрый!", "n": "Аллах вводит в заблуждение, кого пожелает, и ведёт прямым путём, кого пожелает.", "c": null}, {"ref": "18:29", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَقُلِ ٱلْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَآءَ فَلْيُؤْمِن وَمَن شَآءَ فَلْيَكْفُرْ ۚ إِنَّآ أَعْتَدْنَا لِلظَّٰلِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا ۚ وَإِن يَسْتَغِيثُوا۟ يُغَاثُوا۟ بِمَآءٍۢ كَٱلْمُهْلِ يَشْوِى ٱلْوُجُوهَ ۚ بِئْسَ ٱلشَّرَابُ وَسَآءَتْ مُرْتَفَقًا ﴿29﴾", "ru": "И скажи: \"Истина - от вашего Господа: кто хочет, пусть верует, а кто хочет, пусть не верует\". Мы приготовили несправедливым огонь, навес которого окружит их; а если они воззовут о помощи, им помогут водой, подобной расплавленному металлу, которая опаляет лица. Скверно питье, и плохо убежище!", "n": "«Скажи: истина — от вашего Господа; кто хочет — пусть верует, а кто хочет — пусть не верует» — свобода выбора против предопределения.", "c": null}, {"ref": "15:26", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "وَلَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ مِن صَلْصَٰلٍۢ مِّنْ حَمَإٍۢ مَّسْنُونٍۢ ﴿26﴾", "ru": "И Мы сотворили уже человека из звучащей, из глины, облеченной в форму.", "n": "Человек создан из звонкой глины, из чёрного ила.", "c": null}, {"ref": "3:59", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "إِنَّ مَثَلَ عِيسَىٰ عِندَ ٱللَّهِ كَمَثَلِ ءَادَمَ ۖ خَلَقَهُۥ مِن تُرَابٍۢ ثُمَّ قَالَ لَهُۥ كُن فَيَكُونُ ﴿59﴾", "ru": "Поистине, Иса пред Аллахом подобен Адаму: Он создал его из праха, потом сказал ему: \"Будь!\" - и он стал.", "n": "Адам создан «из праха».", "c": null}, {"ref": "25:54", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "وَهُوَ ٱلَّذِى خَلَقَ مِنَ ٱلْمَآءِ بَشَرًۭا فَجَعَلَهُۥ نَسَبًۭا وَصِهْرًۭا ۗ وَكَانَ رَبُّكَ قَدِيرًۭا ﴿54﴾", "ru": "И Он - тот, который создал из воды человека и сделал ему родство мужское и женское. Господь твой - могуч!", "n": "Человек создан «из воды».", "c": null}, {"ref": "96:2", "sura": "Al-Alaq", "sura_ar": "سُورَةُ العَلَقِ", "type": "Meccan", "ar": "خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ ﴿2﴾", "ru": "сотворил человека из сгустка.", "n": "Человек создан «из сгустка».", "c": "Апологеты: это разные стадии; критики: источники разные в разных местах."}, {"ref": "2:34", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ ٱسْجُدُوا۟ لِءَادَمَ فَسَجَدُوٓا۟ إِلَّآ إِبْلِيسَ أَبَىٰ وَٱسْتَكْبَرَ وَكَانَ مِنَ ٱلْكَٰفِرِينَ ﴿34﴾", "ru": "И вот, сказали Мы ангелам: \"Поклонитесь Адаму!\" И поклонились они, кроме Иблиса. Он отказался и превознесся и оказался неверующим.", "n": "Ангелам сказано поклониться Адаму; все поклонились, «кроме Иблиса».", "c": null}, {"ref": "18:50", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ ٱسْجُدُوا۟ لِءَادَمَ فَسَجَدُوٓا۟ إِلَّآ إِبْلِيسَ كَانَ مِنَ ٱلْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِۦٓ ۗ أَفَتَتَّخِذُونَهُۥ وَذُرِّيَّتَهُۥٓ أَوْلِيَآءَ مِن دُونِى وَهُمْ لَكُمْ عَدُوٌّۢ ۚ بِئْسَ لِلظَّٰلِمِينَ بَدَلًۭا ﴿50﴾", "ru": "И вот Мы сказали ангелам: \"Поклонитесь Адаму!\" И поклонились они, кроме Иблиса. Был он из джиннов и совратился с пути Господа своего. Неужели вы возьмете его и его потомство защитниками вместо Меня. Они для вас - враги. Плоха для несправедливых замена!", "n": "Иблис назван одним из джиннов — при том, что приказ был дан ангелам, а в 66:6 говорится, что ангелы не ослушиваются Аллаха.", "c": null}, {"ref": "4:157", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَقَوْلِهِمْ إِنَّا قَتَلْنَا ٱلْمَسِيحَ عِيسَى ٱبْنَ مَرْيَمَ رَسُولَ ٱللَّهِ وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَٰكِن شُبِّهَ لَهُمْ ۚ وَإِنَّ ٱلَّذِينَ ٱخْتَلَفُوا۟ فِيهِ لَفِى شَكٍّۢ مِّنْهُ ۚ مَا لَهُم بِهِۦ مِنْ عِلْمٍ إِلَّا ٱتِّبَاعَ ٱلظَّنِّ ۚ وَمَا قَتَلُوهُ يَقِينًۢا ﴿157﴾", "ru": "и за их слова: \"Мы ведь убили Мессию, Ису, сына Марйам, посланника Аллаха\" (а они не убили его и не распяли, но это только представилось им; и, поистине, те, которые разногласят об этом, - в сомнении о нем; нет у них об этом никакого знания, кроме следования за предложением. Они не убивали его, - наверное,", "n": "Про Ису: «они не убили его и не распяли», а им это показалось.", "c": null}, {"ref": "19:33", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "وَٱلسَّلَٰمُ عَلَىَّ يَوْمَ وُلِدتُّ وَيَوْمَ أَمُوتُ وَيَوْمَ أُبْعَثُ حَيًّۭا ﴿33﴾", "ru": "И мир мне в тот день, как я родился, и в день, что умру, и в день, когда буду воскрешен живым!\"", "n": "Иса говорит: И мир мне в день, как я родился, и в день, как умру, и в день, как буду воскрешён.", "c": "Традиция: умрёт в конце времён."}, {"ref": "6:115", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَتَمَّتْ كَلِمَتُ رَبِّكَ صِدْقًۭا وَعَدْلًۭا ۚ لَّا مُبَدِّلَ لِكَلِمَٰتِهِۦ ۚ وَهُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ ﴿115﴾", "ru": "И завершились словеса Господа твоего по истине и справедливости. Нет изменителя словам Его: ведь Он - слышащий, знающий!", "n": "«Нет изменителя словам Его» — Бог не меняет Своих слов.", "c": "Сравните с 2:106 и 16:101, где Бог заменяет аяты."}, {"ref": "18:27", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِن كِتَابِ رَبِّكَ ۖ لَا مُبَدِّلَ لِكَلِمَٰتِهِۦ وَلَن تَجِدَ مِن دُونِهِۦ مُلْتَحَدًۭا ﴿27﴾", "ru": "И прочитай то из книги Господа твоего, что открыто тебе; нет меняющего Его слова, и никогда ты не найдешь помимо Него защиты.", "n": "«Нет меняющего Его слова» (повторно).", "c": null}, {"ref": "6:128", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَيَوْمَ يَحْشُرُهُمْ جَمِيعًۭا يَٰمَعْشَرَ ٱلْجِنِّ قَدِ ٱسْتَكْثَرْتُم مِّنَ ٱلْإِنسِ ۖ وَقَالَ أَوْلِيَآؤُهُم مِّنَ ٱلْإِنسِ رَبَّنَا ٱسْتَمْتَعَ بَعْضُنَا بِبَعْضٍۢ وَبَلَغْنَآ أَجَلَنَا ٱلَّذِىٓ أَجَّلْتَ لَنَا ۚ قَالَ ٱلنَّارُ مَثْوَىٰكُمْ خَٰلِدِينَ فِيهَآ إِلَّا مَا شَآءَ ٱللَّهُ ۗ إِنَّ رَبَّكَ حَكِيمٌ عَلِيمٌۭ ﴿128﴾", "ru": "И в день, когда Он соберет их всех: \"О сонмище джиннов! Вы многого хотели от этих людей!\" И скажут их приятели из людей: \"Господи! Одни из нас пользовались другими, и мы дошли до нашего предела, который Ты нам назначил\". Он скажет: \"Огонь - ваше место, - для вечного пребывания в нем, - если только не пожелает Аллах иного\". Поистине, Господь твой - мудрый, знающий!", "n": "«Огонь — ваше место для вечного пребывания в нём, если только не пожелает Аллах иного» — оговорка к вечности ада.", "c": "Сравните 11:106-107 и 4:169: «вечно»."}, {"ref": "6:163", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "لَا شَرِيكَ لَهُۥ ۖ وَبِذَٰلِكَ أُمِرْتُ وَأَنَا۠ أَوَّلُ ٱلْمُسْلِمِينَ ﴿163﴾", "ru": "у которого нет сотоварища. Это мне повелено, и я - первый из предавшихся\".", "n": "Мухаммад: «Это мне повелено, и я — первый из предавшихся».", "c": null}, {"ref": "7:143", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "وَلَمَّا جَآءَ مُوسَىٰ لِمِيقَٰتِنَا وَكَلَّمَهُۥ رَبُّهُۥ قَالَ رَبِّ أَرِنِىٓ أَنظُرْ إِلَيْكَ ۚ قَالَ لَن تَرَىٰنِى وَلَٰكِنِ ٱنظُرْ إِلَى ٱلْجَبَلِ فَإِنِ ٱسْتَقَرَّ مَكَانَهُۥ فَسَوْفَ تَرَىٰنِى ۚ فَلَمَّا تَجَلَّىٰ رَبُّهُۥ لِلْجَبَلِ جَعَلَهُۥ دَكًّۭا وَخَرَّ مُوسَىٰ صَعِقًۭا ۚ فَلَمَّآ أَفَاقَ قَالَ سُبْحَٰنَكَ تُبْتُ إِلَيْكَ وَأَنَا۠ أَوَّلُ ٱلْمُؤْمِنِينَ ﴿143﴾", "ru": "И когда пришел Муса к назначенному Нами сроку и беседовал с ним Господь, он сказал: \"Господи! Дай мне посмотреть на Тебя\". Он сказал: \"Ты Меня не увидишь, но посмотри на гору; если она удержится на своем месте, то ты Меня увидишь\". А когда открылся его Господь горе, Он обратил ее в прах, и пал Муса пораженным. Когда же он оправился, то сказал: \"Хвала Тебя! Я обратился к Тебе, и я - первый уверовавший\".", "n": "Муса: «Я обратился к Тебе, и я — первый уверовавший».", "c": null}, {"ref": "39:12", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "وَأُمِرْتُ لِأَنْ أَكُونَ أَوَّلَ ٱلْمُسْلِمِينَ ﴿12﴾", "ru": "и мне повелено быть первым из мусульман\".", "n": "Мухаммад: «Мне повелено быть первым из мусульман».", "c": "Три первых мусульманина; плюс Ибрахим назван мусульманином в 3:67."}, {"ref": "6:164", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "قُلْ أَغَيْرَ ٱللَّهِ أَبْغِى رَبًّۭا وَهُوَ رَبُّ كُلِّ شَىْءٍۢ ۚ وَلَا تَكْسِبُ كُلُّ نَفْسٍ إِلَّا عَلَيْهَا ۚ وَلَا تَزِرُ وَازِرَةٌۭ وِزْرَ أُخْرَىٰ ۚ ثُمَّ إِلَىٰ رَبِّكُم مَّرْجِعُكُمْ فَيُنَبِّئُكُم بِمَا كُنتُمْ فِيهِ تَخْتَلِفُونَ ﴿164﴾", "ru": "Скажи: \"Разве другого, чем Аллах, я буду искать Господом?\" Он - Господь всего. Что каждая душа приобретает, то остается на ней, и не понесет носящая ношу другой. А потом к Господу вашему ваше возвращение, и Он сообщит вам про то, в чем вы разногласили.", "n": "Что каждая душа приобретает, то остаётся на ней, и не понесёт носящая ноши другой — личная ответственность.", "c": null}, {"ref": "8:25", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَٱتَّقُوا۟ فِتْنَةًۭ لَّا تُصِيبَنَّ ٱلَّذِينَ ظَلَمُوا۟ مِنكُمْ خَآصَّةًۭ ۖ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ ﴿25﴾", "ru": "Бойтесь испытания, которое постигнет не только тех из вас, которые несправедливы. И знайте, что Аллах силен в наказании!", "n": "«Бойтесь испытания, которое постигнет не только тех из вас, которые несправедливы» — коллективное наказание.", "c": "Противоречит 6:164."}, {"ref": "109:1-6", "sura": "Al-Kaafiroon", "sura_ar": "سُورَةُ الكَافِرُونَ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ يَٰٓأَيُّهَا ٱلْكَٰفِرُونَ ﴿1﴾ لَآ أَعْبُدُ مَا تَعْبُدُونَ ﴿2﴾ وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُ ﴿3﴾ وَلَآ أَنَا۠ عَابِدٌۭ مَّا عَبَدتُّمْ ﴿4﴾ وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُ ﴿5﴾ لَكُمْ دِينُكُمْ وَلِىَ دِينِ ﴿6﴾", "ru": "(1) Скажи: \"О вы неверные! (2) Я не стану поклоняться тому, чему вы будете поклоняться, (3) и вы не поклоняйтесь тому, чему я буду поклоняться. (4) и я не поклоняюсь тому, чему вы поклонялись, (5) и вы не поклоняетесь тому, чему я буду поклоняться! (6) У вас - ваша вера, и у меня - моя вера!\"", "n": "Вам — ваша религия, а мне — моя.", "c": "Сравните с 9:5, 9:29, 9:73."}, {"ref": "88:21-22", "sura": "Al-Ghaashiya", "sura_ar": "سُورَةُ الغَاشِيَةِ", "type": "Meccan", "ar": "فَذَكِّرْ إِنَّمَآ أَنتَ مُذَكِّرٌۭ ﴿21﴾ لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ ﴿22﴾", "ru": "(21) Напоминай же, ведь ты - только напоминатель! (22) Ты над ними - не властитель,", "n": null, "c": "Сравните с 9:5, 9:29."}, {"ref": "50:45", "sura": "Qaaf", "sura_ar": "سُورَةُ قٓ", "type": "Meccan", "ar": "نَّحْنُ أَعْلَمُ بِمَا يَقُولُونَ ۖ وَمَآ أَنتَ عَلَيْهِم بِجَبَّارٍۢ ۖ فَذَكِّرْ بِٱلْقُرْءَانِ مَن يَخَافُ وَعِيدِ ﴿45﴾", "ru": "Мы лучше знаем, что они говорят, и ты - не принудитель для них. Напоминай же Кораном тому, кто боится Моей угрозы!", "n": null, "c": null}, {"ref": "3:55", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "إِذْ قَالَ ٱللَّهُ يَٰعِيسَىٰٓ إِنِّى مُتَوَفِّيكَ وَرَافِعُكَ إِلَىَّ وَمُطَهِّرُكَ مِنَ ٱلَّذِينَ كَفَرُوا۟ وَجَاعِلُ ٱلَّذِينَ ٱتَّبَعُوكَ فَوْقَ ٱلَّذِينَ كَفَرُوٓا۟ إِلَىٰ يَوْمِ ٱلْقِيَٰمَةِ ۖ ثُمَّ إِلَىَّ مَرْجِعُكُمْ فَأَحْكُمُ بَيْنَكُمْ فِيمَا كُنتُمْ فِيهِ تَخْتَلِفُونَ ﴿55﴾", "ru": "Вот сказал Аллах: \"О Иса! Я упокою тебя, и вознесу тебя ко Мне, и очищу тебя от тех, которые не веровали, и сделаю тех, которые последовали за тобой, выше тех, которые не веровали, до дня воскресения. Потом ко Мне будет ваше возвращение, и Я рассужу между вами относительно того, в чем вы разногласили.", "n": "Бог говорит Исе: Я упокою тебя и вознесу к Себе — смерть или вознесение?", "c": null}, {"ref": "8:1", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَسْـَٔلُونَكَ عَنِ ٱلْأَنفَالِ ۖ قُلِ ٱلْأَنفَالُ لِلَّهِ وَٱلرَّسُولِ ۖ فَٱتَّقُوا۟ ٱللَّهَ وَأَصْلِحُوا۟ ذَاتَ بَيْنِكُمْ ۖ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥٓ إِن كُنتُم مُّؤْمِنِينَ ﴿1﴾", "ru": "Они спрашивают тебя о добыче. Скажи: \"Добыча принадлежит Аллаху и посланнику; бойтесь же Аллаха, упорядочите между собой и повинуйтесь Аллаху и Его посланнику, если вы веруете!\"", "n": null, "c": "Затем 8:41 делит добычу на пятую часть и остальное (бойцам), а 8:69 разрешает есть добычу."}, {"ref": "8:41", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "۞ وَٱعْلَمُوٓا۟ أَنَّمَا غَنِمْتُم مِّن شَىْءٍۢ فَأَنَّ لِلَّهِ خُمُسَهُۥ وَلِلرَّسُولِ وَلِذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ إِن كُنتُمْ ءَامَنتُم بِٱللَّهِ وَمَآ أَنزَلْنَا عَلَىٰ عَبْدِنَا يَوْمَ ٱلْفُرْقَانِ يَوْمَ ٱلْتَقَى ٱلْجَمْعَانِ ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ ﴿41﴾", "ru": "И знайте, что если вы взяли что-либо в добычу, то Аллаху - пятая часть, и посланнику, и родственникам, и сиротам, и бедным, и путнику, если вы уверовали в Аллаха и в то, что Мы низвели Нашему рабу в день различения, в день, когда встретились два сборища. Поистине, Аллах мощен над всякой вещью!", "n": "Пятая часть добычи — Аллаху, посланнику, родственникам, сиротам, бедным и путнику.", "c": "Противоречит 8:1, где вся добыча принадлежит Аллаху и посланнику."}, {"ref": "2:29", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "هُوَ ٱلَّذِى خَلَقَ لَكُم مَّا فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ ٱسْتَوَىٰٓ إِلَى ٱلسَّمَآءِ فَسَوَّىٰهُنَّ سَبْعَ سَمَٰوَٰتٍۢ ۚ وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌۭ ﴿29﴾", "ru": "Он - тот, который сотворил вам все, что на земле, потом обратился к небу и строил его из семи небес. Он о всякой вещи знающ!", "n": "Бог сотворил вам всё, что на земле, потом обратился к небу и устроил его семью небесами — земля раньше неба.", "c": "Противоречит 79:27-30 (небо раньше земли)."}]}, {"id": "abrogation", "title": "Отмена аятов (насх)", "icon": "↺", "group": "Пророк, Коран и текст", "intro": "Коран сам говорит, что Бог заменяет одни аяты другими (2:106, 16:101, 13:39, 87:6-7). Ниже — пары аятов, где предписания меняются: часть этих изменений происходит внутри соседних аятов. Вопрос критиков — почему Всеведущий меняет собственные слова и как это согласуется с 6:115 «нет изменяющего слова Его».", "verses": [{"ref": "2:106", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "۞ مَا نَنسَخْ مِنْ ءَايَةٍ أَوْ نُنسِهَا نَأْتِ بِخَيْرٍۢ مِّنْهَآ أَوْ مِثْلِهَآ ۗ أَلَمْ تَعْلَمْ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ ﴿106﴾", "ru": "Всякий раз, когда мы отменяем стих или заставляем его забыть, мы приводим лучший, чем он, или похожий на него. Разве ты не знаешь, что Аллах над любой вещью мощен?", "n": null, "c": null}, {"ref": "16:101", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَإِذَا بَدَّلْنَآ ءَايَةًۭ مَّكَانَ ءَايَةٍۢ ۙ وَٱللَّهُ أَعْلَمُ بِمَا يُنَزِّلُ قَالُوٓا۟ إِنَّمَآ أَنتَ مُفْتَرٍۭ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ ﴿101﴾", "ru": "А когда Мы заменяем одно знамение другим, - ведь Аллах лучше знает, что Он ниспосылает, - они говорят: \"Ты - только измыслитель!\" Да, большинство их не знает!", "n": null, "c": null}, {"ref": "13:39", "sura": "Ar-Ra'd", "sura_ar": "سُورَةُ الرَّعۡدِ", "type": "Medinan", "ar": "يَمْحُوا۟ ٱللَّهُ مَا يَشَآءُ وَيُثْبِتُ ۖ وَعِندَهُۥٓ أُمُّ ٱلْكِتَٰبِ ﴿39﴾", "ru": "Стирает Аллах, что желает, и утверждает; у Него - мать книги.", "n": null, "c": null}, {"ref": "17:86", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "وَلَئِن شِئْنَا لَنَذْهَبَنَّ بِٱلَّذِىٓ أَوْحَيْنَآ إِلَيْكَ ثُمَّ لَا تَجِدُ لَكَ بِهِۦ عَلَيْنَا وَكِيلًا ﴿86﴾", "ru": "Если бы Мы пожелали, Мы, конечно, унесли бы то, что открыли тебе, а потом ты бы не нашел для себя в этом против Нас покровителя,", "n": null, "c": null}, {"ref": "87:6-7", "sura": "Al-A'laa", "sura_ar": "سُورَةُ الأَعۡلَىٰ", "type": "Meccan", "ar": "سَنُقْرِئُكَ فَلَا تَنسَىٰٓ ﴿6﴾ إِلَّا مَا شَآءَ ٱللَّهُ ۚ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ ﴿7﴾", "ru": "(6) Мы дадим прочесть тебе, и ты не забудешь, (7) если не пожелает чего-нибудь Аллах, - ведь, поистине, Он знает явное и то, что скрыто!", "n": "Мы дадим тебе прочесть, и ты не забудешь, кроме того, что пожелает Аллах.", "c": null}, {"ref": "2:219", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "۞ يَسْـَٔلُونَكَ عَنِ ٱلْخَمْرِ وَٱلْمَيْسِرِ ۖ قُلْ فِيهِمَآ إِثْمٌۭ كَبِيرٌۭ وَمَنَٰفِعُ لِلنَّاسِ وَإِثْمُهُمَآ أَكْبَرُ مِن نَّفْعِهِمَا ۗ وَيَسْـَٔلُونَكَ مَاذَا يُنفِقُونَ قُلِ ٱلْعَفْوَ ۗ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمُ ٱلْءَايَٰتِ لَعَلَّكُمْ تَتَفَكَّرُونَ ﴿219﴾", "ru": "Они спрашивают тебя о вине и майсире. Скажи: \"В них обоих - великий грех и некая польза для людей, но грех их - больше пользы\". И спрашивают они тебя: что им расходовать? Скажи: \"Остаток\". Так разъясняет Аллах вам знамения, - может быть, вы подумаете", "n": "О вине и майсире: «В них обоих — великий грех и некая польза для людей, но грех их — больше пользы» — первая ступень.", "c": null}, {"ref": "4:43", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَقْرَبُوا۟ ٱلصَّلَوٰةَ وَأَنتُمْ سُكَٰرَىٰ حَتَّىٰ تَعْلَمُوا۟ مَا تَقُولُونَ وَلَا جُنُبًا إِلَّا عَابِرِى سَبِيلٍ حَتَّىٰ تَغْتَسِلُوا۟ ۚ وَإِن كُنتُم مَّرْضَىٰٓ أَوْ عَلَىٰ سَفَرٍ أَوْ جَآءَ أَحَدٌۭ مِّنكُم مِّنَ ٱلْغَآئِطِ أَوْ لَٰمَسْتُمُ ٱلنِّسَآءَ فَلَمْ تَجِدُوا۟ مَآءًۭ فَتَيَمَّمُوا۟ صَعِيدًۭا طَيِّبًۭا فَٱمْسَحُوا۟ بِوُجُوهِكُمْ وَأَيْدِيكُمْ ۗ إِنَّ ٱللَّهَ كَانَ عَفُوًّا غَفُورًا ﴿43﴾", "ru": "О вы, которые уверовали! Не приближайтесь к молитве, когда вы пьяны, пока не будете понимать, что вы говорите, или оскверненными - кроме как будучи путешественниками в дороге - пока не омоетесь. А если вы больны или в путешествии, или кто-нибудь из вас пришел из нужника, или вы прикасались к женщинам и не нашли воды, то омывайтесь чистым песком и обтирайте ваши лица и руки. Поистине, Аллах извиняющий, прощающий!", "n": "«Не приближайтесь к молитве, когда вы пьяны» — вторая ступень запрета на вино.", "c": null}, {"ref": "5:90-91", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِنَّمَا ٱلْخَمْرُ وَٱلْمَيْسِرُ وَٱلْأَنصَابُ وَٱلْأَزْلَٰمُ رِجْسٌۭ مِّنْ عَمَلِ ٱلشَّيْطَٰنِ فَٱجْتَنِبُوهُ لَعَلَّكُمْ تُفْلِحُونَ ﴿90﴾ إِنَّمَا يُرِيدُ ٱلشَّيْطَٰنُ أَن يُوقِعَ بَيْنَكُمُ ٱلْعَدَٰوَةَ وَٱلْبَغْضَآءَ فِى ٱلْخَمْرِ وَٱلْمَيْسِرِ وَيَصُدَّكُمْ عَن ذِكْرِ ٱللَّهِ وَعَنِ ٱلصَّلَوٰةِ ۖ فَهَلْ أَنتُم مُّنتَهُونَ ﴿91﴾", "ru": "(90) О вы, которые уверовали! Вино, майсир, жертвенники, стрелы - мерзость из деяния сатаны. Сторонитесь же этого, - может быть, вы окажетесь счастливыми! (91) Сатана желает заронить среди вас вражду и ненависть вином и майсиром и отклонить вас от поминания Аллаха и молитвы. Удержитесь ли вы?", "n": "«Вино, майсир, жертвенники, стрелы — мерзость из деяния сатаны. Сторонитесь же этого» — окончательный запрет.", "c": null}, {"ref": "16:67", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَمِن ثَمَرَٰتِ ٱلنَّخِيلِ وَٱلْأَعْنَٰبِ تَتَّخِذُونَ مِنْهُ سَكَرًۭا وَرِزْقًا حَسَنًا ۗ إِنَّ فِى ذَٰلِكَ لَءَايَةًۭ لِّقَوْمٍۢ يَعْقِلُونَ ﴿67﴾", "ru": "И из плодов пальм и лоз вы берете себе напиток пьянящий и хороший удел. Поистине, в этом - знамение для людей разумных!", "n": "«И из плодов пальм и лоз вы берёте себе напиток пьянящий и хороший удел» — аят, где пьянящий напиток упомянут без запрета.", "c": null}, {"ref": "2:180", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "كُتِبَ عَلَيْكُمْ إِذَا حَضَرَ أَحَدَكُمُ ٱلْمَوْتُ إِن تَرَكَ خَيْرًا ٱلْوَصِيَّةُ لِلْوَٰلِدَيْنِ وَٱلْأَقْرَبِينَ بِٱلْمَعْرُوفِ ۖ حَقًّا عَلَى ٱلْمُتَّقِينَ ﴿180﴾", "ru": "Предписано вам, когда предстанет к кому-нибудь из вас смерть, если он оставляет добро, завещание для родителей и близких по обычаю, как обязательство для верующих.", "n": "Предписано завещание родителям и ближайшим родственникам.", "c": "Отменяется 4:11-12, где доли фиксированы."}, {"ref": "4:11", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يُوصِيكُمُ ٱللَّهُ فِىٓ أَوْلَٰدِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ ٱلْأُنثَيَيْنِ ۚ فَإِن كُنَّ نِسَآءًۭ فَوْقَ ٱثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ ۖ وَإِن كَانَتْ وَٰحِدَةًۭ فَلَهَا ٱلنِّصْفُ ۚ وَلِأَبَوَيْهِ لِكُلِّ وَٰحِدٍۢ مِّنْهُمَا ٱلسُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُۥ وَلَدٌۭ ۚ فَإِن لَّمْ يَكُن لَّهُۥ وَلَدٌۭ وَوَرِثَهُۥٓ أَبَوَاهُ فَلِأُمِّهِ ٱلثُّلُثُ ۚ فَإِن كَانَ لَهُۥٓ إِخْوَةٌۭ فَلِأُمِّهِ ٱلسُّدُسُ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصِى بِهَآ أَوْ دَيْنٍ ۗ ءَابَآؤُكُمْ وَأَبْنَآؤُكُمْ لَا تَدْرُونَ أَيُّهُمْ أَقْرَبُ لَكُمْ نَفْعًۭا ۚ فَرِيضَةًۭ مِّنَ ٱللَّهِ ۗ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿11﴾", "ru": "Завещает вам Аллах относительно ваших детей: сыну - долю, подобную доле двух дочерей. А если они (дети)- женщины, числом больше двух, то им - две трети того, что он оставил, а если одна, то ей - половина. А родителям его, каждому из двух - одна шестая того, что он оставил, если у него есть ребенок. А если у него нет ребенка и ему наследуют его родители, то матери - одна треть. А если есть у него братья, то матери - одна шестая после завещанного, которой он завещает, или долга. Родители ваши или ваши сыновья - вы не знаете, кто из них ближе вам по пользе, как установлено Аллахом. Поистине, Аллах знающ, мудр!", "n": "Доли наследства установлены Богом: мужчине — как доля двух женщин.", "c": null}, {"ref": "2:234", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱلَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجًۭا يَتَرَبَّصْنَ بِأَنفُسِهِنَّ أَرْبَعَةَ أَشْهُرٍۢ وَعَشْرًۭا ۖ فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَلَا جُنَاحَ عَلَيْكُمْ فِيمَا فَعَلْنَ فِىٓ أَنفُسِهِنَّ بِٱلْمَعْرُوفِ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌۭ ﴿234﴾", "ru": "А те из вас, что упокоятся и оставят жен, - они выжидают сами с собой четыре месяца и десять. А когда они достигнут своего предела, то нет греха над вами в том, что они будут делать сами с собой согласно обычаю. Поистине, Аллах - сведущ в том, что вы делаете!", "n": "Вдовы ждут четыре месяца и десять дней.", "c": null}, {"ref": "2:240", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱلَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجًۭا وَصِيَّةًۭ لِّأَزْوَٰجِهِم مَّتَٰعًا إِلَى ٱلْحَوْلِ غَيْرَ إِخْرَاجٍۢ ۚ فَإِنْ خَرَجْنَ فَلَا جُنَاحَ عَلَيْكُمْ فِى مَا فَعَلْنَ فِىٓ أَنفُسِهِنَّ مِن مَّعْرُوفٍۢ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌۭ ﴿240﴾", "ru": "А те из вас, которые упокоятся и оставят жен, то завещание для их жен - пользование до года без понуждения уйти. А если они выйдут, то нет греха на вас в том, что они сделают сами с собой согласно принятому. Поистине, Аллах - великий, мудрый!", "n": null, "c": "Противоречит 2:234 (срок — четыре месяца и десять дней)."}, {"ref": "8:61", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "۞ وَإِن جَنَحُوا۟ لِلسَّلْمِ فَٱجْنَحْ لَهَا وَتَوَكَّلْ عَلَى ٱللَّهِ ۚ إِنَّهُۥ هُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ ﴿61﴾", "ru": "А если они склонятся к миру, то склонись и ты к нему и полагайся на Аллаха: ведь Он - слышащий, знающий!", "n": null, "c": null}, {"ref": "47:35", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "فَلَا تَهِنُوا۟ وَتَدْعُوٓا۟ إِلَى ٱلسَّلْمِ وَأَنتُمُ ٱلْأَعْلَوْنَ وَٱللَّهُ مَعَكُمْ وَلَن يَتِرَكُمْ أَعْمَٰلَكُمْ ﴿35﴾", "ru": "Не слабейте и не призывайте к миру, раз вы выше; Аллах - с вами, и не ослабит Он ваших деяний.", "n": null, "c": "Противоречит 8:61."}, {"ref": "58:12", "sura": "Al-Mujaadila", "sura_ar": "سُورَةُ المُجَادلَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا نَٰجَيْتُمُ ٱلرَّسُولَ فَقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَةًۭ ۚ ذَٰلِكَ خَيْرٌۭ لَّكُمْ وَأَطْهَرُ ۚ فَإِن لَّمْ تَجِدُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌ ﴿12﴾", "ru": "О вы, которые уверовали! Когда беседуете втайне с посланником, то выдвиньте перед вашей беседой милостыню. Это лучше для вас и чище. А если не найдете... то Аллах - прощающий, милосердный!", "n": "Перед тайной беседой с Пророком надо дать милостыню.", "c": null}, {"ref": "58:13", "sura": "Al-Mujaadila", "sura_ar": "سُورَةُ المُجَادلَةِ", "type": "Medinan", "ar": "ءَأَشْفَقْتُمْ أَن تُقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَٰتٍۢ ۚ فَإِذْ لَمْ تَفْعَلُوا۟ وَتَابَ ٱللَّهُ عَلَيْكُمْ فَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ ۚ وَٱللَّهُ خَبِيرٌۢ بِمَا تَعْمَلُونَ ﴿13﴾", "ru": "Разве вы боитесь до вашей беседы выдвинуть милостыни? Если же вы этого не сделали и Аллах обратился к вам, то выстаивайте молитву, и давайте очищение, и повинуйтесь Аллаху и Его посланнику. А Аллах сведущ в том, что вы делаете!", "n": "Вы побоялись давать милостыню перед вашей беседой? Если вы не сделали, и Аллах обратился к вам — то выстаивайте молитву — отмена предыдущего аята.", "c": null}, {"ref": "73:2-4", "sura": "Al-Muzzammil", "sura_ar": "سُورَةُ المُزَّمِّلِ", "type": "Meccan", "ar": "قُمِ ٱلَّيْلَ إِلَّا قَلِيلًۭا ﴿2﴾ نِّصْفَهُۥٓ أَوِ ٱنقُصْ مِنْهُ قَلِيلًا ﴿3﴾ أَوْ زِدْ عَلَيْهِ وَرَتِّلِ ٱلْقُرْءَانَ تَرْتِيلًا ﴿4﴾", "ru": "(2) Простаивай ночь, если не немного, - (3) половину ее, или убавь от этого немного, (4) или прибавь к этому и читай Коран чтением.", "n": "Приказ ночью выстаивать молитву — половину ночи или немного меньше.", "c": null}, {"ref": "73:20", "sura": "Al-Muzzammil", "sura_ar": "سُورَةُ المُزَّمِّلِ", "type": "Meccan", "ar": "۞ إِنَّ رَبَّكَ يَعْلَمُ أَنَّكَ تَقُومُ أَدْنَىٰ مِن ثُلُثَىِ ٱلَّيْلِ وَنِصْفَهُۥ وَثُلُثَهُۥ وَطَآئِفَةٌۭ مِّنَ ٱلَّذِينَ مَعَكَ ۚ وَٱللَّهُ يُقَدِّرُ ٱلَّيْلَ وَٱلنَّهَارَ ۚ عَلِمَ أَن لَّن تُحْصُوهُ فَتَابَ عَلَيْكُمْ ۖ فَٱقْرَءُوا۟ مَا تَيَسَّرَ مِنَ ٱلْقُرْءَانِ ۚ عَلِمَ أَن سَيَكُونُ مِنكُم مَّرْضَىٰ ۙ وَءَاخَرُونَ يَضْرِبُونَ فِى ٱلْأَرْضِ يَبْتَغُونَ مِن فَضْلِ ٱللَّهِ ۙ وَءَاخَرُونَ يُقَٰتِلُونَ فِى سَبِيلِ ٱللَّهِ ۖ فَٱقْرَءُوا۟ مَا تَيَسَّرَ مِنْهُ ۚ وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَأَقْرِضُوا۟ ٱللَّهَ قَرْضًا حَسَنًۭا ۚ وَمَا تُقَدِّمُوا۟ لِأَنفُسِكُم مِّنْ خَيْرٍۢ تَجِدُوهُ عِندَ ٱللَّهِ هُوَ خَيْرًۭا وَأَعْظَمَ أَجْرًۭا ۚ وَٱسْتَغْفِرُوا۟ ٱللَّهَ ۖ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۢ ﴿20﴾", "ru": "Поистине, Господь твой знает, что ты простаиваешь меньше, чем две трети ночи, и половину ее и треть; и люди из тех, что с тобою. И Аллах размеряет ночь и день. Знает Он, что вы не учтете этого, и обратился Он к вам. Читайте же, что легко вам из Корана. Знает Он, что будут из вас больные и другие, которые ударяют землю, выискивая милости Аллаха, и другие, которые сражаются на пути Аллаха. Читайте же, что легко вам из него, и простаивайте молитву, и приносите очистительную подать, и одолжайте Аллаху хороший заем. Что вы уготоваете вперед из добра для самих себя, найдете это у Аллаха лучшим и большим по награде, и просите прощения у Аллаха. Поистине, Аллах - прощающ, милостив!", "n": "Бог облегчил: Читайте, что вам легко.", "c": null}, {"ref": "33:50", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ إِنَّآ أَحْلَلْنَا لَكَ أَزْوَٰجَكَ ٱلَّٰتِىٓ ءَاتَيْتَ أُجُورَهُنَّ وَمَا مَلَكَتْ يَمِينُكَ مِمَّآ أَفَآءَ ٱللَّهُ عَلَيْكَ وَبَنَاتِ عَمِّكَ وَبَنَاتِ عَمَّٰتِكَ وَبَنَاتِ خَالِكَ وَبَنَاتِ خَٰلَٰتِكَ ٱلَّٰتِى هَاجَرْنَ مَعَكَ وَٱمْرَأَةًۭ مُّؤْمِنَةً إِن وَهَبَتْ نَفْسَهَا لِلنَّبِىِّ إِنْ أَرَادَ ٱلنَّبِىُّ أَن يَسْتَنكِحَهَا خَالِصَةًۭ لَّكَ مِن دُونِ ٱلْمُؤْمِنِينَ ۗ قَدْ عَلِمْنَا مَا فَرَضْنَا عَلَيْهِمْ فِىٓ أَزْوَٰجِهِمْ وَمَا مَلَكَتْ أَيْمَٰنُهُمْ لِكَيْلَا يَكُونَ عَلَيْكَ حَرَجٌۭ ۗ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًۭا ﴿50﴾", "ru": "О пророк, Мы разрешили тебе твоими женами тех, которым ты дал их награду, и тех, которыми овладела твоя десница из того, что даровал Аллах тебе в добычу, и дочерей твоего дяди со стороны отца, и дочерей твоих теток со стороны отца, и дочерей твоего дяди со стороны матери, и дочерей твоих теток со стороны матери, которые выселились вместе с тобой, и верующую женщину, если она отдала самое себя пророку, если пророк пожелает жениться на ней, - исключительно для тебя, помимо верующих. Мы знаем, что Мы установили для них относительно их жен и того, чем овладели десницы их, для того. чтобы не было на тебе стеснения. Аллах - прощающ. милосерд!", "n": "Пророку разрешено любое число жён.", "c": null}, {"ref": "33:52", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "لَّا يَحِلُّ لَكَ ٱلنِّسَآءُ مِنۢ بَعْدُ وَلَآ أَن تَبَدَّلَ بِهِنَّ مِنْ أَزْوَٰجٍۢ وَلَوْ أَعْجَبَكَ حُسْنُهُنَّ إِلَّا مَا مَلَكَتْ يَمِينُكَ ۗ وَكَانَ ٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ رَّقِيبًۭا ﴿52﴾", "ru": "После этого тебе не дозволяется больше женщины и заменять их другими женами, хотя бы тебя поражала их красота, если не теми, которыми овладела десница твоя. Аллах надзирает за всякой вещью!", "n": "После этого тебе не дозволяется больше женщин и заменять их другими женами — запрет на новые браки.", "c": null}]}, {"id": "history", "title": "Библейская и историческая путаница", "icon": "📜", "group": "Пророк, Коран и текст", "intro": "Места, где Коран называет персонажей, места и события так, что они плохо согласуются с известной историей или с книгами, которые он «подтверждает» (Тора, Евангелие). Мусульманские апологеты обычно отвечают, что речь идёт об однофамильцах или образных выражениях.", "verses": [{"ref": "19:28", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "يَٰٓأُخْتَ هَٰرُونَ مَا كَانَ أَبُوكِ ٱمْرَأَ سَوْءٍۢ وَمَا كَانَتْ أُمُّكِ بَغِيًّۭا ﴿28﴾", "ru": "О сестра Харуна, не был отец твой дурным человеком, и мать твоя не была распутницей\".", "n": "Мариам, мать Исы, названа сестрой Харуна — Харун (Аарон) жил более чем за тысячу лет до неё.", "c": "Апологеты: образное «сестра» как потомок или другой человек по имени Харун."}, {"ref": "66:12", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "وَمَرْيَمَ ٱبْنَتَ عِمْرَٰنَ ٱلَّتِىٓ أَحْصَنَتْ فَرْجَهَا فَنَفَخْنَا فِيهِ مِن رُّوحِنَا وَصَدَّقَتْ بِكَلِمَٰتِ رَبِّهَا وَكُتُبِهِۦ وَكَانَتْ مِنَ ٱلْقَٰنِتِينَ ﴿12﴾", "ru": "...И Марйам, дочь Имрана, которая сберегла свои члены, и Мы вдунули в нее от Нашего духа. И она сочла истиной слова ее Господа и Его писания и была из числа благочестивых.", "n": "Мариам названа дочерью Имрана — а в Библии Амрам — отец Моисея, Аарона и Мариам-сестры.", "c": null}, {"ref": "3:35-36", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "إِذْ قَالَتِ ٱمْرَأَتُ عِمْرَٰنَ رَبِّ إِنِّى نَذَرْتُ لَكَ مَا فِى بَطْنِى مُحَرَّرًۭا فَتَقَبَّلْ مِنِّىٓ ۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ ﴿35﴾ فَلَمَّا وَضَعَتْهَا قَالَتْ رَبِّ إِنِّى وَضَعْتُهَآ أُنثَىٰ وَٱللَّهُ أَعْلَمُ بِمَا وَضَعَتْ وَلَيْسَ ٱلذَّكَرُ كَٱلْأُنثَىٰ ۖ وَإِنِّى سَمَّيْتُهَا مَرْيَمَ وَإِنِّىٓ أُعِيذُهَا بِكَ وَذُرِّيَّتَهَا مِنَ ٱلشَّيْطَٰنِ ٱلرَّجِيمِ ﴿36﴾", "ru": "(35) Вот сказала жена Имрана: \"Господи! Я обетовала Тебе то, что у меня в утробе, освобожденным (для Тебя). Прими же от меня, - ведь Ты - слышащий, знающий\". (36) И когда она сложила ее, то сказала: \"Господи! Вот, я сложила ее - женского пола\". - А Аллах лучше знал, что она сложила, - ведь мужской пол не то, что женский. - \"И я назвала ее Марйам, и вот - я отдаю Тебе ее и ее потомство под защиту от сатаны, побиваемого камнями\".", "n": "Жена Имрана говорит о дочери, которую родила: «Я назвала её Марйам» — снова Мариам и Имран.", "c": "В Библии Мириам — сестра Моисея и Аарона; вопрос, не смешаны ли два персонажа, обсуждается веками."}, {"ref": "28:38", "sura": "Al-Qasas", "sura_ar": "سُورَةُ القَصَصِ", "type": "Meccan", "ar": "وَقَالَ فِرْعَوْنُ يَٰٓأَيُّهَا ٱلْمَلَأُ مَا عَلِمْتُ لَكُم مِّنْ إِلَٰهٍ غَيْرِى فَأَوْقِدْ لِى يَٰهَٰمَٰنُ عَلَى ٱلطِّينِ فَٱجْعَل لِّى صَرْحًۭا لَّعَلِّىٓ أَطَّلِعُ إِلَىٰٓ إِلَٰهِ مُوسَىٰ وَإِنِّى لَأَظُنُّهُۥ مِنَ ٱلْكَٰذِبِينَ ﴿38﴾", "ru": "И сказал Фираун: \"О знать, я не знаю для вас другого бога, кроме меня. Разожги мне, Хаман, огонь над глиной и устрой башню: может быть, я поднимусь к богу Мусы. Я ведь думаю, что он - лжец\".", "n": "Фараон обращается к Хаману — в Библии Аман жил при персидском царе Артаксерксе (книга Есфирь), на много столетий позже.", "c": null}, {"ref": "28:8", "sura": "Al-Qasas", "sura_ar": "سُورَةُ القَصَصِ", "type": "Meccan", "ar": "فَٱلْتَقَطَهُۥٓ ءَالُ فِرْعَوْنَ لِيَكُونَ لَهُمْ عَدُوًّۭا وَحَزَنًا ۗ إِنَّ فِرْعَوْنَ وَهَٰمَٰنَ وَجُنُودَهُمَا كَانُوا۟ خَٰطِـِٔينَ ﴿8﴾", "ru": "И подобрала его семья Фирауна, чтобы он оказался для них врагом и скорбью. Поистине, Фираун, и Хаман, и их войска были грешниками!", "n": "Фираун, Хаман и их воины были грешниками.", "c": null}, {"ref": "40:36-37", "sura": "Ghafir", "sura_ar": "سُورَةُ غَافِرٍ", "type": "Meccan", "ar": "وَقَالَ فِرْعَوْنُ يَٰهَٰمَٰنُ ٱبْنِ لِى صَرْحًۭا لَّعَلِّىٓ أَبْلُغُ ٱلْأَسْبَٰبَ ﴿36﴾ أَسْبَٰبَ ٱلسَّمَٰوَٰتِ فَأَطَّلِعَ إِلَىٰٓ إِلَٰهِ مُوسَىٰ وَإِنِّى لَأَظُنُّهُۥ كَٰذِبًۭا ۚ وَكَذَٰلِكَ زُيِّنَ لِفِرْعَوْنَ سُوٓءُ عَمَلِهِۦ وَصُدَّ عَنِ ٱلسَّبِيلِ ۚ وَمَا كَيْدُ فِرْعَوْنَ إِلَّا فِى تَبَابٍۢ ﴿37﴾", "ru": "(36) И сказал Фираун: \"О Хаман, выстрой мне башню, может быть, я дойду до путей - (37) путей небеса и поднимусь к богу Мусы; я ведь думаю, что он лжец\". Так разукрашено было Фирауну зло его деяния и сведен он с пути; и вся кознь Фирауна только в гибели!", "n": "Фараон велит Хаману: выстрой мне башню, может быть, я дойду до путей небес и поднимусь к богу Мусы — перекличка с рассказом о Вавилонской башне.", "c": null}, {"ref": "20:85-87", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "قَالَ فَإِنَّا قَدْ فَتَنَّا قَوْمَكَ مِنۢ بَعْدِكَ وَأَضَلَّهُمُ ٱلسَّامِرِىُّ ﴿85﴾ فَرَجَعَ مُوسَىٰٓ إِلَىٰ قَوْمِهِۦ غَضْبَٰنَ أَسِفًۭا ۚ قَالَ يَٰقَوْمِ أَلَمْ يَعِدْكُمْ رَبُّكُمْ وَعْدًا حَسَنًا ۚ أَفَطَالَ عَلَيْكُمُ ٱلْعَهْدُ أَمْ أَرَدتُّمْ أَن يَحِلَّ عَلَيْكُمْ غَضَبٌۭ مِّن رَّبِّكُمْ فَأَخْلَفْتُم مَّوْعِدِى ﴿86﴾ قَالُوا۟ مَآ أَخْلَفْنَا مَوْعِدَكَ بِمَلْكِنَا وَلَٰكِنَّا حُمِّلْنَآ أَوْزَارًۭا مِّن زِينَةِ ٱلْقَوْمِ فَقَذَفْنَٰهَا فَكَذَٰلِكَ أَلْقَى ٱلسَّامِرِىُّ ﴿87﴾", "ru": "(85) Сказал Он: \"Мы испытали твой народ после тебя, и их сбил с пути самирит\". (86) И вернулся Муса к своему народу гневным, печальным. Он сказал: \"О народ мой! Разве не обещал вам Господь ваш прекрасного обещания; разве долгим для вас показался завет, или вы пожелали, чтобы вас постиг гнев от вашего Господа, и вы нарушили обещание мне?\" (87) Они сказали: \"Не нарушили мы обещания тебе своей властью; нам было приказано принести ноши из украшений народа, и мы из ввергли; также вверг и самирит\";", "n": "В истории с золотым тельцом виновником назван ас-Самири (самаритянин); самаритяне как народ возникли много веков после исхода из Египта.", "c": "Апологеты: Самири — человек из рода/племени, имя не обязательно этническое."}, {"ref": "9:30", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "وَقَالَتِ ٱلْيَهُودُ عُزَيْرٌ ٱبْنُ ٱللَّهِ وَقَالَتِ ٱلنَّصَٰرَى ٱلْمَسِيحُ ٱبْنُ ٱللَّهِ ۖ ذَٰلِكَ قَوْلُهُم بِأَفْوَٰهِهِمْ ۖ يُضَٰهِـُٔونَ قَوْلَ ٱلَّذِينَ كَفَرُوا۟ مِن قَبْلُ ۚ قَٰتَلَهُمُ ٱللَّهُ ۚ أَنَّىٰ يُؤْفَكُونَ ﴿30﴾", "ru": "И сказали иудеи: \"Узайр - сын Аллаха\". И сказали христиане: \"Мессия - сын Аллаха\". Эти слова в их устах похожи на слова тех, которые не веровали раньше. Пусть поразит их Аллах! До чего они отвращены!", "n": "Иудеи названы говорящими «Узайр — сын Аллаха»; в известных иудейских источниках такого учения нет.", "c": "Апологеты указывают на отдельные группы в Аравии; доказательств нет."}, {"ref": "5:116", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ ٱللَّهُ يَٰعِيسَى ٱبْنَ مَرْيَمَ ءَأَنتَ قُلْتَ لِلنَّاسِ ٱتَّخِذُونِى وَأُمِّىَ إِلَٰهَيْنِ مِن دُونِ ٱللَّهِ ۖ قَالَ سُبْحَٰنَكَ مَا يَكُونُ لِىٓ أَنْ أَقُولَ مَا لَيْسَ لِى بِحَقٍّ ۚ إِن كُنتُ قُلْتُهُۥ فَقَدْ عَلِمْتَهُۥ ۚ تَعْلَمُ مَا فِى نَفْسِى وَلَآ أَعْلَمُ مَا فِى نَفْسِكَ ۚ إِنَّكَ أَنتَ عَلَّٰمُ ٱلْغُيُوبِ ﴿116﴾", "ru": "И вот сказал Аллах: \"О Иса, сын Марйам! Разве ты сказал людям: \"Примите меня и мою мать двумя богами кроме Аллаха?\" Он сказал: \"Хвала Тебе! Как можно мне говорить, что мне не по праву? Если я говорил, Ты это знаешь. Ты знаешь то. что у меня в душе, а я не знаю того, что у Тебя в душе: ведь Ты - ведающий скрытое.", "n": "Бог спрашивает Ису: Говорил ли ты людям: примите меня и мою мать двумя богами? — Троица понимается как Бог, Иса и Мария.", "c": "В христианском учении Троица — Отец, Сын и Святой Дух."}, {"ref": "3:67", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "مَا كَانَ إِبْرَٰهِيمُ يَهُودِيًّۭا وَلَا نَصْرَانِيًّۭا وَلَٰكِن كَانَ حَنِيفًۭا مُّسْلِمًۭا وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ ﴿67﴾", "ru": "Ибрахим не был ни иудеем, ни христианином, а был он ханифом предавшимся и не был из многобожников.", "n": "«Ибрахим не был ни иудеем, ни христианином, а был он ханифом предавшимся» (в других переводах — муслимом): слово ислам приложено к эпохе до Мухаммада.", "c": null}, {"ref": "6:74", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "۞ وَإِذْ قَالَ إِبْرَٰهِيمُ لِأَبِيهِ ءَازَرَ أَتَتَّخِذُ أَصْنَامًا ءَالِهَةً ۖ إِنِّىٓ أَرَىٰكَ وَقَوْمَكَ فِى ضَلَٰلٍۢ مُّبِينٍۢ ﴿74﴾", "ru": "Вот сказал Ибрахим отцу своему Азару: \"Неужели ты идолов превращаешь в богов? Я вижу, что ты и твой народ - в явном заблуждении\".", "n": "Ибрахим говорит своему отцу «Азару» — в Библии отца Авраама зовут Терах.", "c": null}, {"ref": "2:127", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ يَرْفَعُ إِبْرَٰهِۦمُ ٱلْقَوَاعِدَ مِنَ ٱلْبَيْتِ وَإِسْمَٰعِيلُ رَبَّنَا تَقَبَّلْ مِنَّآ ۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ ﴿127﴾
