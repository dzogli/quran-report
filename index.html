<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Критический доклад о Коране — по разделам</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3dfd6;--accent:#8a2b1f;--quote:#fbf8f1;--side:#efebe2}
[data-theme=dark]{--bg:#141416;--panel:#1c1c20;--ink:#ececee;--mute:#9a9aa3;--line:#2c2c33;--accent:#e08a74;--quote:#222228;--side:#18181b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Georgia,"Times New Roman",serif}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;font-family:system-ui,Segoe UI,Arial,sans-serif}
aside h1{font:700 15px/1.3 system-ui;margin:0 6px 4px;letter-spacing:.3px}
aside .sub{margin:0 6px 14px;color:var(--mute);font-size:12.5px}
nav button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:8px;font:500 14px system-ui;cursor:pointer}
nav button:hover{background:rgba(128,128,128,.14)}
nav button.on{background:var(--accent);color:#fff}
[data-theme=dark] nav button.on{color:#141416}
nav .ic{width:22px;text-align:center;font-size:16px}
nav .ct{margin-left:auto;font-size:12px;opacity:.7}
.tools{margin:16px 6px 0;display:grid;gap:8px;font:13px system-ui}
.tools label{display:flex;gap:8px;align-items:center;cursor:pointer}
main{padding:34px clamp(16px,4vw,56px) 80px;max-width:980px;width:100%}
h2{font:700 30px/1.2 Georgia,serif;margin:0 0 8px}
.intro{color:var(--mute);margin:0 0 22px;max-width:70ch;border-left:3px solid var(--accent);padding-left:14px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:15px system-ui;margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ref{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;font:600 14px system-ui;margin-bottom:10px}
.ref .r{color:var(--accent);font-size:16px}
.ref .s{color:var(--mute);font-weight:400}
.ref .tag{margin-left:auto;font:11px system-ui;border:1px solid var(--line);padding:2px 8px;border-radius:99px;color:var(--mute)}
.ar{direction:rtl;text-align:right;font:26px/2.1 "Amiri","Scheherazade New","Traditional Arabic","Noto Naskh Arabic","Segoe UI",serif;background:var(--quote);border-radius:10px;padding:10px 16px;margin:0 0 10px}
.ru{background:var(--quote);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 16px;margin:0 0 12px;font-size:17.5px;font-style:italic}
.n{margin:0 0 6px}
.n b,.c b{font:700 11.5px system-ui;text-transform:uppercase;letter-spacing:.5px;display:block}
.n b{color:var(--accent)}
.c{margin:8px 0 0;color:var(--mute);font-size:14.5px;border-top:1px dashed var(--line);padding-top:8px}
.copy{border:1px solid var(--line);background:none;color:var(--mute);font:12px system-ui;padding:2px 8px;border-radius:6px;cursor:pointer}
.copy:hover{color:var(--ink)}
.hide-ar .ar{display:none}.hide-c .c{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:22px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:system-ui}
.tile:hover{border-color:var(--accent)}
.tile .big{font-size:26px}
.tile .t{font-weight:700;margin:4px 0 2px}.tile .k{color:var(--mute);font-size:13px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:0 0 16px;font-size:15px}
.note h3{margin:0 0 6px;font:700 15px system-ui}
.note ul{margin:6px 0 0 18px;padding:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px;font-family:system-ui}
.pager button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;font:14px system-ui}
.menu{display:none}
mark{background:#ffe27a;color:#000;padding:0 2px;border-radius:3px}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;inset:0 25% 0 0;z-index:5;height:100vh;transform:translateX(-100%);transition:.2s;box-shadow:4px 0 20px rgba(0,0,0,.3)}
 aside.open{transform:none}
 .menu{display:block;position:sticky;top:0;z-index:4;width:100%;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px system-ui;text-align:left}
 .ar{font-size:22px}
}
@media print{aside,.menu,.search,.pager,.copy{display:none!important}.app{display:block}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<button class="menu" id="menu">☰ Разделы</button>
<div class="app">
<aside id="side">
  <h1>Критический доклад о Коране</h1>
  <p class="sub">Цитаты по разделам: насилие, жестокость, неравенство, противоречия, противоречия науке</p>
  <nav id="nav"></nav>
  <div class="tools">
    <label><input type="checkbox" id="tAr" checked> Арабский оригинал</label>
    <label><input type="checkbox" id="tC" checked> Контекст / как объясняют</label>
    <label><input type="checkbox" id="tTheme"> Тёмная тема</label>
  </div>
</aside>
<main id="main"></main>
</div>
<script>
const DATA = [{"id": "violence", "title": "Война и насилие против неверных", "icon": "⚔", "intro": "Аяты, которые содержат прямые призывы убивать, сражаться и устрашать противников. Большинство относится к мединскому периоду (после 622 г.), когда община Мухаммада вела военные действия. Обратите внимание на формулы, не привязанные к конкретному событию в самом тексте («где бы ни нашли», «пока не исчезнет смута»).", "verses": [{"ref": "2:191", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْ وَأَخْرِجُوهُم مِّنْ حَيْثُ أَخْرَجُوكُمْ ۚ وَٱلْفِتْنَةُ أَشَدُّ مِنَ ٱلْقَتْلِ ۚ وَلَا تُقَٰتِلُوهُمْ عِندَ ٱلْمَسْجِدِ ٱلْحَرَامِ حَتَّىٰ يُقَٰتِلُوكُمْ فِيهِ ۖ فَإِن قَٰتَلُوكُمْ فَٱقْتُلُوهُمْ ۗ كَذَٰلِكَ جَزَآءُ ٱلْكَٰفِرِينَ ﴿191﴾", "ru": "И убивайте их, где встретите, и изгоняйте их оттуда, откуда они изгнали вас: ведь соблазн - хуже, чем убиение! И не сражайтесь с ними у запретной мечети, пока они не станут сражаться там с вами. Если же они будут сражаться с вами, то убивайте их: таково воздаяние неверных!", "n": "Приказ убивать противников «где бы вы их ни встретили» и изгонять. Сама формулировка в тексте не ограничена конкретным сражением.", "c": "Контекст — конфликт с курайшитами; соседние аяты 2:190 и 2:192–193 ограничивают: сражаться с теми, кто сражается."}, {"ref": "2:216", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "كُتِبَ عَلَيْكُمُ ٱلْقِتَالُ وَهُوَ كُرْهٌۭ لَّكُمْ ۖ وَعَسَىٰٓ أَن تَكْرَهُوا۟ شَيْـًۭٔا وَهُوَ خَيْرٌۭ لَّكُمْ ۖ وَعَسَىٰٓ أَن تُحِبُّوا۟ شَيْـًۭٔا وَهُوَ شَرٌّۭ لَّكُمْ ۗ وَٱللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ ﴿216﴾", "ru": "Предписано вам сражение, а оно ненавистно для вас. И может быть, вы ненавидите что-нибудь, а оно для вас благо, и может быть, вы любите что-нибудь, а оно для вас зло, - поистине, Аллах знает, а вы не знаете!", "n": "Война объявлена «предписанной» (обязательной), а нелюбовь к ней названа ошибкой самих верующих.", "c": "Многие толкователи относят к конкретной обороне общины; другие видят в нём общий принцип джихада."}, {"ref": "8:12", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "إِذْ يُوحِى رَبُّكَ إِلَى ٱلْمَلَٰٓئِكَةِ أَنِّى مَعَكُمْ فَثَبِّتُوا۟ ٱلَّذِينَ ءَامَنُوا۟ ۚ سَأُلْقِى فِى قُلُوبِ ٱلَّذِينَ كَفَرُوا۟ ٱلرُّعْبَ فَٱضْرِبُوا۟ فَوْقَ ٱلْأَعْنَاقِ وَٱضْرِبُوا۟ مِنْهُمْ كُلَّ بَنَانٍۢ ﴿12﴾", "ru": "Вот внушил Господь твой ангелам: \"Я - с вами, укрепите тех, которые уверовали! Я брошу в сердца тех, которые не веровали, страх; бейте же их по шеям, бейте их по всем пальцам!\"", "n": "Бог «внушает ужас» неверным; ангелам и верующим приказано бить по шеям и по всем пальцам.", "c": "Описание битвы при Бадре (624 г.)."}, {"ref": "8:39", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَقَٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌۭ وَيَكُونَ ٱلدِّينُ كُلُّهُۥ لِلَّهِ ۚ فَإِنِ ٱنتَهَوْا۟ فَإِنَّ ٱللَّهَ بِمَا يَعْمَلُونَ بَصِيرٌۭ ﴿39﴾", "ru": "И сражайтесь с ними, пока не будет искушения, и религия вся будет принадлежать Аллаху\". А если они удержатся... ведь Аллах видит то, что они делают!", "n": "Сражаться, «пока не исчезнет смута и вся религия не будет принадлежать Аллаху» — цель войны сформулирована как господство одной религии.", "c": "Часть толкователей понимает «смуту» (фитна) как гонения на мусульман; классическое право использовало аят как основание наступательного джихада."}, {"ref": "8:60", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَأَعِدُّوا۟ لَهُم مَّا ٱسْتَطَعْتُم مِّن قُوَّةٍۢ وَمِن رِّبَاطِ ٱلْخَيْلِ تُرْهِبُونَ بِهِۦ عَدُوَّ ٱللَّهِ وَعَدُوَّكُمْ وَءَاخَرِينَ مِن دُونِهِمْ لَا تَعْلَمُونَهُمُ ٱللَّهُ يَعْلَمُهُمْ ۚ وَمَا تُنفِقُوا۟ مِن شَىْءٍۢ فِى سَبِيلِ ٱللَّهِ يُوَفَّ إِلَيْكُمْ وَأَنتُمْ لَا تُظْلَمُونَ ﴿60﴾", "ru": "И приготовьте для них, сколько можете, силы и отрядов конницы; ими вы устрашите врага Аллаха, и вашего врага, и других, помимо них; вы их не знаете, Аллах знает их. И что бы вы ни издержали на пути Аллаха, будет полностью возмещено вам, и вы не будете обижены.", "n": "Приказ готовить силу, чтобы «устрашать» врагов.", "c": null}, {"ref": "9:5", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "فَإِذَا ٱنسَلَخَ ٱلْأَشْهُرُ ٱلْحُرُمُ فَٱقْتُلُوا۟ ٱلْمُشْرِكِينَ حَيْثُ وَجَدتُّمُوهُمْ وَخُذُوهُمْ وَٱحْصُرُوهُمْ وَٱقْعُدُوا۟ لَهُمْ كُلَّ مَرْصَدٍۢ ۚ فَإِن تَابُوا۟ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَءَاتَوُا۟ ٱلزَّكَوٰةَ فَخَلُّوا۟ سَبِيلَهُمْ ۚ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ ﴿5﴾", "ru": "А когда кончатся месяцы запретные, то избивайте многобожников, где их найдете, захватывайте их, осаждайте, устраивайте засаду против них во всяком скрытом месте! Если они обратились и выполняли молитву и давали очищение, то освободите им дорогу: ведь Аллах - прощающий, милосердный!", "n": "Так называемый «аят меча»: убивать многобожников, где бы ни нашли, брать в плен, устраивать засады — пока не примут намаз и закят. Классические комментаторы (напр., ат-Табари) считали, что он отменяет множество более мягких аятов.", "c": "Апологеты указывают на 9:4 и 9:6 (договорники не затрагиваются, просящим защиты — убежище) и на конкретное нарушение договоров арабскими племенами."}, {"ref": "9:29", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "قَٰتِلُوا۟ ٱلَّذِينَ لَا يُؤْمِنُونَ بِٱللَّهِ وَلَا بِٱلْيَوْمِ ٱلْءَاخِرِ وَلَا يُحَرِّمُونَ مَا حَرَّمَ ٱللَّهُ وَرَسُولُهُۥ وَلَا يَدِينُونَ دِينَ ٱلْحَقِّ مِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ حَتَّىٰ يُعْطُوا۟ ٱلْجِزْيَةَ عَن يَدٍۢ وَهُمْ صَٰغِرُونَ ﴿29﴾", "ru": "Сражайтесь с теми, кто не верует в Аллаха и в последний день, не запрещает того, что запретил Аллах и Его посланник, и не подчиняется религии истинной - из тех, которым ниспослано писание, пока они не дадут откупа своей рукой, будучи униженными.", "n": "Сражаться с «людьми Писания» (христианами и иудеями), пока они «не дадут джизью собственноручно, будучи униженными».", "c": "Классическое право: налог в обмен на защиту и право сохранять веру; формулировка об «унижении» трактовалась по-разному."}, {"ref": "9:73", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ جَٰهِدِ ٱلْكُفَّارَ وَٱلْمُنَٰفِقِينَ وَٱغْلُظْ عَلَيْهِمْ ۚ وَمَأْوَىٰهُمْ جَهَنَّمُ ۖ وَبِئْسَ ٱلْمَصِيرُ ﴿73﴾", "ru": "О пророк! Борись с неверными и лицемерами и будь жесток к ним. Их убежище - геенна, и скверно это возвращение!", "n": "Пророку приказано вести борьбу с неверными и лицемерами и быть к ним «суровым». Аят повторён почти дословно в 66:9.", "c": null}, {"ref": "9:123", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ قَٰتِلُوا۟ ٱلَّذِينَ يَلُونَكُم مِّنَ ٱلْكُفَّارِ وَلْيَجِدُوا۟ فِيكُمْ غِلْظَةًۭ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ مَعَ ٱلْمُتَّقِينَ ﴿123﴾", "ru": "О вы, которые уверовали! Сражайтесь с теми из неверных, которые близки к вам. И пусть они найдут в вас суровость. И знайте, что Аллах - с богобоязненными!", "n": "Приказ сражаться с неверными, «которые рядом с вами», и проявлять к ним «суровость».", "c": "Контекст — расширение границ и подавление соседних племён."}, {"ref": "47:4", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "فَإِذَا لَقِيتُمُ ٱلَّذِينَ كَفَرُوا۟ فَضَرْبَ ٱلرِّقَابِ حَتَّىٰٓ إِذَآ أَثْخَنتُمُوهُمْ فَشُدُّوا۟ ٱلْوَثَاقَ فَإِمَّا مَنًّۢا بَعْدُ وَإِمَّا فِدَآءً حَتَّىٰ تَضَعَ ٱلْحَرْبُ أَوْزَارَهَا ۚ ذَٰلِكَ وَلَوْ يَشَآءُ ٱللَّهُ لَٱنتَصَرَ مِنْهُمْ وَلَٰكِن لِّيَبْلُوَا۟ بَعْضَكُم بِبَعْضٍۢ ۗ وَٱلَّذِينَ قُتِلُوا۟ فِى سَبِيلِ ٱللَّهِ فَلَن يُضِلَّ أَعْمَٰلَهُمْ ﴿4﴾", "ru": "А когда вы встретите тех, которые не уверовали, то - удар мечом по шее; а когда произведете великое избиение их, то укрепляйте узы. Либо милость потом, либо выкуп, пока война не сложит своих нош. Так! А если бы пожелал Аллах, Он помог бы Себе против них, но (это для того,) чтобы одних испытать другими. А у тех, которые убиты на пути Аллаха, - никогда Он не собьет с пути их деяний:", "n": "При встрече с неверными — «по шеям»; пока не подавят их, затем пленение и выкуп.", "c": "Описание правил войны в раннем мединском обществе."}, {"ref": "4:89", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَدُّوا۟ لَوْ تَكْفُرُونَ كَمَا كَفَرُوا۟ فَتَكُونُونَ سَوَآءًۭ ۖ فَلَا تَتَّخِذُوا۟ مِنْهُمْ أَوْلِيَآءَ حَتَّىٰ يُهَاجِرُوا۟ فِى سَبِيلِ ٱللَّهِ ۚ فَإِن تَوَلَّوْا۟ فَخُذُوهُمْ وَٱقْتُلُوهُمْ حَيْثُ وَجَدتُّمُوهُمْ ۖ وَلَا تَتَّخِذُوا۟ مِنْهُمْ وَلِيًّۭا وَلَا نَصِيرًا ﴿89﴾", "ru": "Они хотели бы, чтобы вы оказались неверными, как были неверными они, и вы бы оказались одинаковыми. Не берите же из них друзей, пока не выселятся по пути Аллаха; если же они отвратятся, то схватывайте их и убивайте, где бы ни нашли их. И не берите из них ни друзей, ни помощников,", "n": "Против тех, кто «отвернётся» (по традиции — отступников): «хватайте их и убивайте, где найдёте».", "c": "Традиционное исламское право на основании этого и хадисов предписывает казнь за вероотступничество; современные богословы спорят о границах."}, {"ref": "33:61", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "مَّلْعُونِينَ ۖ أَيْنَمَا ثُقِفُوٓا۟ أُخِذُوا۟ وَقُتِّلُوا۟ تَقْتِيلًۭا ﴿61﴾", "ru": "проклятыми. Где они не будут встречены, они будут схвачены и перебиты избиением,", "n": "О «лицемерах»: «где бы их ни нашли, будут схвачены и убиты безжалостно».", "c": null}, {"ref": "9:111", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "۞ إِنَّ ٱللَّهَ ٱشْتَرَىٰ مِنَ ٱلْمُؤْمِنِينَ أَنفُسَهُمْ وَأَمْوَٰلَهُم بِأَنَّ لَهُمُ ٱلْجَنَّةَ ۚ يُقَٰتِلُونَ فِى سَبِيلِ ٱللَّهِ فَيَقْتُلُونَ وَيُقْتَلُونَ ۖ وَعْدًا عَلَيْهِ حَقًّۭا فِى ٱلتَّوْرَىٰةِ وَٱلْإِنجِيلِ وَٱلْقُرْءَانِ ۚ وَمَنْ أَوْفَىٰ بِعَهْدِهِۦ مِنَ ٱللَّهِ ۚ فَٱسْتَبْشِرُوا۟ بِبَيْعِكُمُ ٱلَّذِى بَايَعْتُم بِهِۦ ۚ وَذَٰلِكَ هُوَ ٱلْفَوْزُ ٱلْعَظِيمُ ﴿111﴾", "ru": "Поистине, Аллах купил у верующих их души и их достояние за то, что им - рай! Они сражаются на пути Аллаха, убивают и бывают убиты, согласно обещанию от Него истинному в Торе, Евангелии и Коране. Кто же более верен в своем завете, чем Аллах? Радуйтесь же своей торговле, которую вы заключили с Ним! Это ведь - великий успех!", "n": "Бог «купил» у верующих их души и имущество за рай; «они сражаются на пути Аллаха, убивают и бывают убиты».", "c": null}]}, {"id": "punish", "title": "Жестокие наказания", "icon": "⛓", "intro": "Телесные и калечащие наказания, а также неравенство в правовых нормах (свободный/раб, мужчина/женщина).", "verses": [{"ref": "5:33", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "إِنَّمَا جَزَٰٓؤُا۟ ٱلَّذِينَ يُحَارِبُونَ ٱللَّهَ وَرَسُولَهُۥ وَيَسْعَوْنَ فِى ٱلْأَرْضِ فَسَادًا أَن يُقَتَّلُوٓا۟ أَوْ يُصَلَّبُوٓا۟ أَوْ تُقَطَّعَ أَيْدِيهِمْ وَأَرْجُلُهُم مِّنْ خِلَٰفٍ أَوْ يُنفَوْا۟ مِنَ ٱلْأَرْضِ ۚ ذَٰلِكَ لَهُمْ خِزْىٌۭ فِى ٱلدُّنْيَا ۖ وَلَهُمْ فِى ٱلْءَاخِرَةِ عَذَابٌ عَظِيمٌ ﴿33﴾", "ru": "Действительно, воздаяние тех, которые воюют с Аллахом и Его посланником и стараются на земле вызвать нечестие, в том, что они будут убиты, или распяты, или будут отсечены у них руки и ноги накрест, или будут они изгнаны из земли. Это для них - позор в ближайшей жизни, а в последней для них - великое наказание, -", "n": "Для «воюющих против Аллаха и посланника и распространяющих нечестие» — казнь, распятие, отсечение руки и ноги накрест или изгнание.", "c": "Классические юристы относили к разбою на дорогах."}, {"ref": "5:38", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَٱلسَّارِقُ وَٱلسَّارِقَةُ فَٱقْطَعُوٓا۟ أَيْدِيَهُمَا جَزَآءًۢ بِمَا كَسَبَا نَكَٰلًۭا مِّنَ ٱللَّهِ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌۭ ﴿38﴾", "ru": "Вору и воровке отсекайте их руки в воздаяние за то, что они приобрели, как устрашение от Аллаха. Поистине, Аллах - великий, мудрый!", "n": "Вору и воровке — отсечь руки «в воздаяние за то, что они приобрели».", "c": "Юристы вводили ограничения (минимальная сумма — нисаб, условия доказательства), но сама норма применяется и сегодня в ряде стран."}, {"ref": "24:2", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "ٱلزَّانِيَةُ وَٱلزَّانِى فَٱجْلِدُوا۟ كُلَّ وَٰحِدٍۢ مِّنْهُمَا مِا۟ئَةَ جَلْدَةٍۢ ۖ وَلَا تَأْخُذْكُم بِهِمَا رَأْفَةٌۭ فِى دِينِ ٱللَّهِ إِن كُنتُمْ تُؤْمِنُونَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ ۖ وَلْيَشْهَدْ عَذَابَهُمَا طَآئِفَةٌۭ مِّنَ ٱلْمُؤْمِنِينَ ﴿2﴾", "ru": "Прелюбодея и прелюбодейку - побивайте каждого из них сотней ударов. Пусть не овладевает вами жалость к ним в религии Аллаха, если вы веруете в Аллаха и в последний день. И пусть присутствует при их наказании группа верующих.", "n": "Прелюбодеям — по сто ударов плетью; приказ не проявлять жалости, наказание должно проходить публично.", "c": null}, {"ref": "24:4", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَٱلَّذِينَ يَرْمُونَ ٱلْمُحْصَنَٰتِ ثُمَّ لَمْ يَأْتُوا۟ بِأَرْبَعَةِ شُهَدَآءَ فَٱجْلِدُوهُمْ ثَمَٰنِينَ جَلْدَةًۭ وَلَا تَقْبَلُوا۟ لَهُمْ شَهَٰدَةً أَبَدًۭا ۚ وَأُو۟لَٰٓئِكَ هُمُ ٱلْفَٰسِقُونَ ﴿4﴾", "ru": "А те, которые бросают обвинение в целомудренных, а потом не приведут четырех свидетелей, - побейте их восемьюдесятью ударами и не принимайте от них свидетельства никогда; это - распутники,", "n": "Обвинившим честных женщин в прелюбодеянии без четырёх свидетелей — 80 плетей и вечный запрет на свидетельство. Бремя доказательства для жертвы насилия на практике оказывается тяжёлым.", "c": null}, {"ref": "2:178", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلْقِصَاصُ فِى ٱلْقَتْلَى ۖ ٱلْحُرُّ بِٱلْحُرِّ وَٱلْعَبْدُ بِٱلْعَبْدِ وَٱلْأُنثَىٰ بِٱلْأُنثَىٰ ۚ فَمَنْ عُفِىَ لَهُۥ مِنْ أَخِيهِ شَىْءٌۭ فَٱتِّبَاعٌۢ بِٱلْمَعْرُوفِ وَأَدَآءٌ إِلَيْهِ بِإِحْسَٰنٍۢ ۗ ذَٰلِكَ تَخْفِيفٌۭ مِّن رَّبِّكُمْ وَرَحْمَةٌۭ ۗ فَمَنِ ٱعْتَدَىٰ بَعْدَ ذَٰلِكَ فَلَهُۥ عَذَابٌ أَلِيمٌۭ ﴿178﴾", "ru": "О те, которые уверовали! Предписано вам возмездие за убитых: свободный - за свободного, и раб - за раба, и женщина - за женщину. А кому будет прощено что-нибудь его братом, то - следование по обычаю и возмещение ему во благе. Это - облегчение от Господа вашего и милость; а кто преступит после этого, для него - наказание болезненное!", "n": "Закон возмездия закрепляет неравенство: «свободный за свободного, раб за раба, женщина за женщину».", "c": null}, {"ref": "5:45", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَكَتَبْنَا عَلَيْهِمْ فِيهَآ أَنَّ ٱلنَّفْسَ بِٱلنَّفْسِ وَٱلْعَيْنَ بِٱلْعَيْنِ وَٱلْأَنفَ بِٱلْأَنفِ وَٱلْأُذُنَ بِٱلْأُذُنِ وَٱلسِّنَّ بِٱلسِّنِّ وَٱلْجُرُوحَ قِصَاصٌۭ ۚ فَمَن تَصَدَّقَ بِهِۦ فَهُوَ كَفَّارَةٌۭ لَّهُۥ ۚ وَمَن لَّمْ يَحْكُم بِمَآ أَنزَلَ ٱللَّهُ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ ﴿45﴾", "ru": "И предписали Мы им в ней, что душа - за душу, и око - за око, и нос - за нос, и ухо - за ухо, и зуб - за зуб, и раны - отмщение. А кто пожертвует это милостыней, то это - искупление за него. А кто судит не потому, что низвел Аллах, те - несправедливы.", "n": "Принцип талиона: «душа за душу, глаз за глаз, нос за нос, ухо за ухо, зуб за зуб».", "c": "В тексте говорится о Торе; допускает прощение «как милостыню»."}, {"ref": "4:15", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَٱلَّٰتِى يَأْتِينَ ٱلْفَٰحِشَةَ مِن نِّسَآئِكُمْ فَٱسْتَشْهِدُوا۟ عَلَيْهِنَّ أَرْبَعَةًۭ مِّنكُمْ ۖ فَإِن شَهِدُوا۟ فَأَمْسِكُوهُنَّ فِى ٱلْبُيُوتِ حَتَّىٰ يَتَوَفَّىٰهُنَّ ٱلْمَوْتُ أَوْ يَجْعَلَ ٱللَّهُ لَهُنَّ سَبِيلًۭا ﴿15﴾", "ru": "А те из ваших женщин, которые совершат мерзость, - возьмите в свидетели против них четырех из вас. И если они засвидетельствуют, то держите их в домах, пока не упокоит их смерть или Аллах устроит для них путь.", "n": "Женщин, совершивших «мерзость», — «удерживайте в домах, пока не упокоит их смерть» — пожизненное заключение без суда в современном понимании.", "c": "Многие толкователи считают этот аят отменённым 24:2."}]}, {"id": "women", "title": "Положение женщин", "icon": "♀", "intro": "Нормы о браке, свидетельстве, наследстве и семейном праве, в которых права мужчины и женщины различаются.", "verses": [{"ref": "4:34", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "ٱلرِّجَالُ قَوَّٰمُونَ عَلَى ٱلنِّسَآءِ بِمَا فَضَّلَ ٱللَّهُ بَعْضَهُمْ عَلَىٰ بَعْضٍۢ وَبِمَآ أَنفَقُوا۟ مِنْ أَمْوَٰلِهِمْ ۚ فَٱلصَّٰلِحَٰتُ قَٰنِتَٰتٌ حَٰفِظَٰتٌۭ لِّلْغَيْبِ بِمَا حَفِظَ ٱللَّهُ ۚ وَٱلَّٰتِى تَخَافُونَ نُشُوزَهُنَّ فَعِظُوهُنَّ وَٱهْجُرُوهُنَّ فِى ٱلْمَضَاجِعِ وَٱضْرِبُوهُنَّ ۖ فَإِنْ أَطَعْنَكُمْ فَلَا تَبْغُوا۟ عَلَيْهِنَّ سَبِيلًا ۗ إِنَّ ٱللَّهَ كَانَ عَلِيًّۭا كَبِيرًۭا ﴿34﴾", "ru": "Мужья стоят над женами за то, что Аллах дал одним преимущество перед другими, и за то, что они расходуют из своего имущества. И порядочные женщины - благоговейны, сохраняют тайное в том, что хранит Аллах. А тех, непокорности которых вы боитесь, увещайте и покидайте их на ложах и ударяйте их. И если они повинятся вам, то не ищите пути против них, - поистине, Аллах возвышен, велик!", "n": "Мужчины «стоят над» женщинами; непокорных жён нужно сначала увещевать, затем «покидать на ложах» и «ударять» (в других переводах — «бить»).", "c": "Часть современных толкователей предлагает понимать «бить» символически (тронуть зубочисткой); классическая традиция допускала побои без нанесения увечий."}, {"ref": "2:223", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "نِسَآؤُكُمْ حَرْثٌۭ لَّكُمْ فَأْتُوا۟ حَرْثَكُمْ أَنَّىٰ شِئْتُمْ ۖ وَقَدِّمُوا۟ لِأَنفُسِكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّكُم مُّلَٰقُوهُ ۗ وَبَشِّرِ ٱلْمُؤْمِنِينَ ﴿223﴾", "ru": "Ваши жены - нива для вас, ходите на вашу ниву, когда пожелаете и уготовывайте для самих себя, и бойтесь Аллаха, и знайте, что вы его встретите, - и обрадуй верующих!", "n": "«Ваши жёны — нива для вас: приходите на вашу ниву, как желаете».", "c": "Хадисы уточняют допустимость поз, но не вопрос согласия."}, {"ref": "2:228", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱلْمُطَلَّقَٰتُ يَتَرَبَّصْنَ بِأَنفُسِهِنَّ ثَلَٰثَةَ قُرُوٓءٍۢ ۚ وَلَا يَحِلُّ لَهُنَّ أَن يَكْتُمْنَ مَا خَلَقَ ٱللَّهُ فِىٓ أَرْحَامِهِنَّ إِن كُنَّ يُؤْمِنَّ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ ۚ وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِى ذَٰلِكَ إِنْ أَرَادُوٓا۟ إِصْلَٰحًۭا ۚ وَلَهُنَّ مِثْلُ ٱلَّذِى عَلَيْهِنَّ بِٱلْمَعْرُوفِ ۚ وَلِلرِّجَالِ عَلَيْهِنَّ دَرَجَةٌۭ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌ ﴿228﴾", "ru": "А разведенные выжидают сами с собой три периода, и не разрешается то, что сотворил Аллах с их утробами, если они веруют в Аллаха и в последний день. А мужьям их - достойнее их вернуть при этом, если они желают умиротворения. И для них - то же самое, что и на них, согласно принятому. Мужьям над ними - степень. Поистине, Аллах - великий, мудрый!", "n": "Для разведённых — срок ожидания; «у мужчин над ними степень».", "c": null}, {"ref": "2:282", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰٓ أَجَلٍۢ مُّسَمًّۭى فَٱكْتُبُوهُ ۚ وَلْيَكْتُب بَّيْنَكُمْ كَاتِبٌۢ بِٱلْعَدْلِ ۚ وَلَا يَأْبَ كَاتِبٌ أَن يَكْتُبَ كَمَا عَلَّمَهُ ٱللَّهُ ۚ فَلْيَكْتُبْ وَلْيُمْلِلِ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ وَلَا يَبْخَسْ مِنْهُ شَيْـًۭٔا ۚ فَإِن كَانَ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ سَفِيهًا أَوْ ضَعِيفًا أَوْ لَا يَسْتَطِيعُ أَن يُمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهُۥ بِٱلْعَدْلِ ۚ وَٱسْتَشْهِدُوا۟ شَهِيدَيْنِ مِن رِّجَالِكُمْ ۖ فَإِن لَّمْ يَكُونَا رَجُلَيْنِ فَرَجُلٌۭ وَٱمْرَأَتَانِ مِمَّن تَرْضَوْنَ مِنَ ٱلشُّهَدَآءِ أَن تَضِلَّ إِحْدَىٰهُمَا فَتُذَكِّرَ إِحْدَىٰهُمَا ٱلْأُخْرَىٰ ۚ وَلَا يَأْبَ ٱلشُّهَدَآءُ إِذَا مَا دُعُوا۟ ۚ وَلَا تَسْـَٔمُوٓا۟ أَن تَكْتُبُوهُ صَغِيرًا أَوْ كَبِيرًا إِلَىٰٓ أَجَلِهِۦ ۚ ذَٰلِكُمْ أَقْسَطُ عِندَ ٱللَّهِ وَأَقْوَمُ لِلشَّهَٰدَةِ وَأَدْنَىٰٓ أَلَّا تَرْتَابُوٓا۟ ۖ إِلَّآ أَن تَكُونَ تِجَٰرَةً حَاضِرَةًۭ تُدِيرُونَهَا بَيْنَكُمْ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَلَّا تَكْتُبُوهَا ۗ وَأَشْهِدُوٓا۟ إِذَا تَبَايَعْتُمْ ۚ وَلَا يُضَآرَّ كَاتِبٌۭ وَلَا شَهِيدٌۭ ۚ وَإِن تَفْعَلُوا۟ فَإِنَّهُۥ فُسُوقٌۢ بِكُمْ ۗ وَٱتَّقُوا۟ ٱللَّهَ ۖ وَيُعَلِّمُكُمُ ٱللَّهُ ۗ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌۭ ﴿282﴾", "ru": "О вы, которые уверовали! Если берете в долг между собой на определенный срок, то записывайте это. И пусть записывает между вами писец по справедливости. И пусть не отказывается писец написать так, как научил его Аллах, и пусть он пишет, и пусть диктует тот, на котором обязательство. И пусть он боится Аллаха, Господа своего, и пусть не убавляет там ничего. А если тот, на ком обязательство, малоумен или слаб, или не может сам диктовать, то пусть диктует его близкий по справедливости. И берите в свидетели двух из ваших мужчин. А если не будет двух мужчин, то - мужчину и двух женщин, на которых вы согласны, как свидетелей, чтобы если собьется одна, то напомнила бы ей другая. И пусть не отказываются свидетели, когда их зовут; и пусть не наскучивает вам записывать его - малым или большим - до его срока. Это - справедливее пред Аллахом, и прямее для свидетельства, и ближе, чтобы вам не сомневаться. Разве только, если это будет торговлей наличной, которую вы обращаете между собой, - тогда на вас не будет греха, что вы не запишете этого. И ставьте свидетелей, когда уславливаетесь между собой, и не должно причинять неприятности писцу и свидетелю; а если сделаете, то это - распутство у вас. И бойтесь Аллаха; поистине, Аллах вас учит, и Аллах знает о всякой вещи!", "n": "В долговом документе свидетельство двух женщин приравнивается к свидетельству одного мужчины — «если одна заблудится, другая напомнит».", "c": "Традиционное объяснение — меньший опыт женщин в торговле в VII веке; критики видят здесь закреплённое неравенство."}, {"ref": "4:11", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يُوصِيكُمُ ٱللَّهُ فِىٓ أَوْلَٰدِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ ٱلْأُنثَيَيْنِ ۚ فَإِن كُنَّ نِسَآءًۭ فَوْقَ ٱثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ ۖ وَإِن كَانَتْ وَٰحِدَةًۭ فَلَهَا ٱلنِّصْفُ ۚ وَلِأَبَوَيْهِ لِكُلِّ وَٰحِدٍۢ مِّنْهُمَا ٱلسُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُۥ وَلَدٌۭ ۚ فَإِن لَّمْ يَكُن لَّهُۥ وَلَدٌۭ وَوَرِثَهُۥٓ أَبَوَاهُ فَلِأُمِّهِ ٱلثُّلُثُ ۚ فَإِن كَانَ لَهُۥٓ إِخْوَةٌۭ فَلِأُمِّهِ ٱلسُّدُسُ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصِى بِهَآ أَوْ دَيْنٍ ۗ ءَابَآؤُكُمْ وَأَبْنَآؤُكُمْ لَا تَدْرُونَ أَيُّهُمْ أَقْرَبُ لَكُمْ نَفْعًۭا ۚ فَرِيضَةًۭ مِّنَ ٱللَّهِ ۗ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿11﴾", "ru": "Завещает вам Аллах относительно ваших детей: сыну - долю, подобную доле двух дочерей. А если они (дети)- женщины, числом больше двух, то им - две трети того, что он оставил, а если одна, то ей - половина. А родителям его, каждому из двух - одна шестая того, что он оставил, если у него есть ребенок. А если у него нет ребенка и ему наследуют его родители, то матери - одна треть. А если есть у него братья, то матери - одна шестая после завещанного, которой он завещает, или долга. Родители ваши или ваши сыновья - вы не знаете, кто из них ближе вам по пользе, как установлено Аллахом. Поистине, Аллах знающ, мудр!", "n": "Наследство: «мужчине — доля двух женщин».", "c": "Апологеты указывают на то, что мужчина обязан содержать семью."}, {"ref": "4:3", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَإِنْ خِفْتُمْ أَلَّا تُقْسِطُوا۟ فِى ٱلْيَتَٰمَىٰ فَٱنكِحُوا۟ مَا طَابَ لَكُم مِّنَ ٱلنِّسَآءِ مَثْنَىٰ وَثُلَٰثَ وَرُبَٰعَ ۖ فَإِنْ خِفْتُمْ أَلَّا تَعْدِلُوا۟ فَوَٰحِدَةً أَوْ مَا مَلَكَتْ أَيْمَٰنُكُمْ ۚ ذَٰلِكَ أَدْنَىٰٓ أَلَّا تَعُولُوا۟ ﴿3﴾", "ru": "А если вы боитесь, что не будете справедливы с сиротами, то женитесь на тех, что приятны вам, женщинах - и двух, и трех, и четырех. А если боитесь, что не будете справедливы, то - на одной или на тех, которыми овладели ваши десницы. Это - ближе, чтобы не уклониться", "n": "Разрешение многожёнства — до четырёх жён (плюс «то, чем овладели ваши десницы», см. раздел о рабстве).", "c": "Условие справедливости в 4:129 считают почти невыполнимым; на практике правило действует."}, {"ref": "65:4", "sura": "At-Talaaq", "sura_ar": "سُورَةُ الطَّلَاقِ", "type": "Medinan", "ar": "وَٱلَّٰٓـِٔى يَئِسْنَ مِنَ ٱلْمَحِيضِ مِن نِّسَآئِكُمْ إِنِ ٱرْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَٰثَةُ أَشْهُرٍۢ وَٱلَّٰٓـِٔى لَمْ يَحِضْنَ ۚ وَأُو۟لَٰتُ ٱلْأَحْمَالِ أَجَلُهُنَّ أَن يَضَعْنَ حَمْلَهُنَّ ۚ وَمَن يَتَّقِ ٱللَّهَ يَجْعَل لَّهُۥ مِنْ أَمْرِهِۦ يُسْرًۭا ﴿4﴾", "ru": "А те из ваших жен, которые уже отчаялись в месячных - если вы сомневаетесь, то их срок - три месяца, как и для тех, у которых еще не было месячных; а у которых ноша - их срок , чтобы они сложили свою ношу. Кто боится Аллаха, тому Он устроит в Своем деле легкость.", "n": "Срок ожидания после развода установлен и для тех, «у которых ещё не было месячных» — классические комментаторы понимают это как норму для девочек-подростков, состоявших в браке.", "c": "Современные апологеты оспаривают такое прочтение; но оно было общепринятым в классической традиции."}]}, {"id": "family", "title": "Брак, родство и семья", "icon": "♡", "intro": "Нормы о том, на ком можно и нельзя жениться, о приёмных детях и о разводе. Отдельно в разделе «Особые права Пророка» — его собственные браки. Возраст Аиши при браке в Коране не указан: эти сведения идут из хадисов (Бухари, Муслим), а не из текста Корана.", "verses": [{"ref": "4:22", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَلَا تَنكِحُوا۟ مَا نَكَحَ ءَابَآؤُكُم مِّنَ ٱلنِّسَآءِ إِلَّا مَا قَدْ سَلَفَ ۚ إِنَّهُۥ كَانَ فَٰحِشَةًۭ وَمَقْتًۭا وَسَآءَ سَبِيلًا ﴿22﴾", "ru": "Не женитесь на тех женщинах, на которых были женаты ваши отцы, разве только это произошло раньше. Поистине, это - мерзость и отвращение и скверно как путь!", "n": "Запрет жениться на бывших жёнах отцов («кроме того, что было»): такие браки существовали у арабов до ислама.", "c": null}, {"ref": "4:23", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "حُرِّمَتْ عَلَيْكُمْ أُمَّهَٰتُكُمْ وَبَنَاتُكُمْ وَأَخَوَٰتُكُمْ وَعَمَّٰتُكُمْ وَخَٰلَٰتُكُمْ وَبَنَاتُ ٱلْأَخِ وَبَنَاتُ ٱلْأُخْتِ وَأُمَّهَٰتُكُمُ ٱلَّٰتِىٓ أَرْضَعْنَكُمْ وَأَخَوَٰتُكُم مِّنَ ٱلرَّضَٰعَةِ وَأُمَّهَٰتُ نِسَآئِكُمْ وَرَبَٰٓئِبُكُمُ ٱلَّٰتِى فِى حُجُورِكُم مِّن نِّسَآئِكُمُ ٱلَّٰتِى دَخَلْتُم بِهِنَّ فَإِن لَّمْ تَكُونُوا۟ دَخَلْتُم بِهِنَّ فَلَا جُنَاحَ عَلَيْكُمْ وَحَلَٰٓئِلُ أَبْنَآئِكُمُ ٱلَّذِينَ مِنْ أَصْلَٰبِكُمْ وَأَن تَجْمَعُوا۟ بَيْنَ ٱلْأُخْتَيْنِ إِلَّا مَا قَدْ سَلَفَ ۗ إِنَّ ٱللَّهَ كَانَ غَفُورًۭا رَّحِيمًۭا ﴿23﴾", "ru": "И запрещены вам ваши матери, и ваши дочери, и ваши сестры, и ваши тетки по отцу и матери, и дочери брата, и дочери сестры, и ваши матери, которые вас вскормили, и ваши сестры по кормлению, и матери ваших жен, и ваши воспитанницы, которые под вашим покровительством от ваших жен, к которым вы уже вошли; а если вы еще не вошли к ним, то нет греха на вас; и жены ваших сыновей, которые от ваших чресел; и - объединять двух сестер, если это не было раньше. Поистине, Аллах прощающ, милосерд!", "n": "Перечень запретных родственниц: матери, дочери, сёстры, тётки, племянницы, «молочные» матери и сёстры, тёщи, падчерицы, жёны родных сыновей, две сестры одновременно. Двоюродные сёстры в запрет не входят (в 33:50 прямо разрешены), хотя современная генетика связывает такие браки с повышенным риском наследственных болезней.", "c": "В VII веке браки между двоюродными были нормой; «молочное» родство расширяет круг запретов."}, {"ref": "33:4", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "مَّا جَعَلَ ٱللَّهُ لِرَجُلٍۢ مِّن قَلْبَيْنِ فِى جَوْفِهِۦ ۚ وَمَا جَعَلَ أَزْوَٰجَكُمُ ٱلَّٰٓـِٔى تُظَٰهِرُونَ مِنْهُنَّ أُمَّهَٰتِكُمْ ۚ وَمَا جَعَلَ أَدْعِيَآءَكُمْ أَبْنَآءَكُمْ ۚ ذَٰلِكُمْ قَوْلُكُم بِأَفْوَٰهِكُمْ ۖ وَٱللَّهُ يَقُولُ ٱلْحَقَّ وَهُوَ يَهْدِى ٱلسَّبِيلَ ﴿4﴾", "ru": "Не устроил Аллах для человека двух сердец внутри, и не сделал ваших жен, которых вы называете хребтом матери, вашими матерями , и не сделал ваших приемышей вашими сыновьями. Это - только ваши слова в ваших устах, а Аллах говорит истину, и Он ведет по пути.", "n": "«Не сделал Он ваших приёмышей вашими сыновьями» — отмена усыновления, которая ввела новый порядок наследования и брака.", "c": null}, {"ref": "33:5", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "ٱدْعُوهُمْ لِءَابَآئِهِمْ هُوَ أَقْسَطُ عِندَ ٱللَّهِ ۚ فَإِن لَّمْ تَعْلَمُوٓا۟ ءَابَآءَهُمْ فَإِخْوَٰنُكُمْ فِى ٱلدِّينِ وَمَوَٰلِيكُمْ ۚ وَلَيْسَ عَلَيْكُمْ جُنَاحٌۭ فِيمَآ أَخْطَأْتُم بِهِۦ وَلَٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْ ۚ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًا ﴿5﴾", "ru": "Возводите их к их отцам, это - более справедливее у Аллаха, а если не знаете их отцов, то это - ваши братья в вере и ваши близкие. Нет на вас греха, в чем вы ошиблись, а только в том, что замышляли ваши сердца. Аллах - прощающий, милосердный!", "n": "Приёмных детей надо называть по отцам; «если вы не знаете их отцов — они ваши братья по религии».", "c": null}, {"ref": "33:6", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "ٱلنَّبِىُّ أَوْلَىٰ بِٱلْمُؤْمِنِينَ مِنْ أَنفُسِهِمْ ۖ وَأَزْوَٰجُهُۥٓ أُمَّهَٰتُهُمْ ۗ وَأُو۟لُوا۟ ٱلْأَرْحَامِ بَعْضُهُمْ أَوْلَىٰ بِبَعْضٍۢ فِى كِتَٰبِ ٱللَّهِ مِنَ ٱلْمُؤْمِنِينَ وَٱلْمُهَٰجِرِينَ إِلَّآ أَن تَفْعَلُوٓا۟ إِلَىٰٓ أَوْلِيَآئِكُم مَّعْرُوفًۭا ۚ كَانَ ذَٰلِكَ فِى ٱلْكِتَٰبِ مَسْطُورًۭا ﴿6﴾", "ru": "Пророк ближе в верующим, чем они сами, а супруги его - их матери. И обладатели родства - одни ближе к другим по книге Аллаха, чем верующие и чем мухаджиры. Разве вы сделаете добро своим близким? Это в книге начертано.", "n": "«Пророк ближе к верующим, чем они сами; а его жёны — их матери» — поэтому на них нельзя жениться (см. 33:53).", "c": null}, {"ref": "33:40", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "مَّا كَانَ مُحَمَّدٌ أَبَآ أَحَدٍۢ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ ٱللَّهِ وَخَاتَمَ ٱلنَّبِيِّۦنَ ۗ وَكَانَ ٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمًۭا ﴿40﴾", "ru": "Мухаммад не был отцом кого-либо из ваших мужчин, а только - посланником Аллаха и пророков. Аллах знает всякую вещь!", "n": "«Мухаммад — не отец никому из ваших мужчин» — аят стоит рядом с историей женитьбы на жене приёмного сына Зайда (33:37).", "c": null}, {"ref": "2:221", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَلَا تَنكِحُوا۟ ٱلْمُشْرِكَٰتِ حَتَّىٰ يُؤْمِنَّ ۚ وَلَأَمَةٌۭ مُّؤْمِنَةٌ خَيْرٌۭ مِّن مُّشْرِكَةٍۢ وَلَوْ أَعْجَبَتْكُمْ ۗ وَلَا تُنكِحُوا۟ ٱلْمُشْرِكِينَ حَتَّىٰ يُؤْمِنُوا۟ ۚ وَلَعَبْدٌۭ مُّؤْمِنٌ خَيْرٌۭ مِّن مُّشْرِكٍۢ وَلَوْ أَعْجَبَكُمْ ۗ أُو۟لَٰٓئِكَ يَدْعُونَ إِلَى ٱلنَّارِ ۖ وَٱللَّهُ يَدْعُوٓا۟ إِلَى ٱلْجَنَّةِ وَٱلْمَغْفِرَةِ بِإِذْنِهِۦ ۖ وَيُبَيِّنُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَ ﴿221﴾", "ru": "Не женитесь на многобожницах, пока они не уверуют: конечно, верующая рабыня лучше многобожницы, хотя бы она и восторгала вас. И не выдавайте замуж за многобожников, пока они не уверуют: конечно, верующий раб - лучше многобожника, хотя бы он и восторгал вас. Эти зовут к огню, а Аллах зовет к раю и прощению со Своего дозволения и разъясняет Свои знамения людям, - может быть, они опомнятся!", "n": "Запрет жениться на многобожницах и выдавать замуж за многобожников: верующая рабыня лучше многобожницы, «хотя бы она и восторгала вас».", "c": null}, {"ref": "5:5", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "ٱلْيَوْمَ أُحِلَّ لَكُمُ ٱلطَّيِّبَٰتُ ۖ وَطَعَامُ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ حِلٌّۭ لَّكُمْ وَطَعَامُكُمْ حِلٌّۭ لَّهُمْ ۖ وَٱلْمُحْصَنَٰتُ مِنَ ٱلْمُؤْمِنَٰتِ وَٱلْمُحْصَنَٰتُ مِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ مِن قَبْلِكُمْ إِذَآ ءَاتَيْتُمُوهُنَّ أُجُورَهُنَّ مُحْصِنِينَ غَيْرَ مُسَٰفِحِينَ وَلَا مُتَّخِذِىٓ أَخْدَانٍۢ ۗ وَمَن يَكْفُرْ بِٱلْإِيمَٰنِ فَقَدْ حَبِطَ عَمَلُهُۥ وَهُوَ فِى ٱلْءَاخِرَةِ مِنَ ٱلْخَٰسِرِينَ ﴿5﴾", "ru": "Сегодня разрешены вам блага; и пища тех, кому даровано писание, разрешается вам и ваша пища разрешается им. И целомудренные из верующих и целомудренные из тех, кому даровано писание до вас, если вы им дали их вознаграждение, будучи целомудренными, не распутничая и не беря наложниц. А если кто отрекся от веры, то у него - дело тщетно, и он в последней жизни - в числе потерпевших убыток\".", "n": "Мужчинам-мусульманам разрешены женщины из людей Писания; обратное (мусульманка и христианин) в тексте не разрешено — запрет выводится традицией.", "c": null}, {"ref": "24:3", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "ٱلزَّانِى لَا يَنكِحُ إِلَّا زَانِيَةً أَوْ مُشْرِكَةًۭ وَٱلزَّانِيَةُ لَا يَنكِحُهَآ إِلَّا زَانٍ أَوْ مُشْرِكٌۭ ۚ وَحُرِّمَ ذَٰلِكَ عَلَى ٱلْمُؤْمِنِينَ ﴿3﴾", "ru": "Прелюбодей женится только на прелюбодейке или многобожнице, а прелюбодейка - на ней женится только прелюбодей или многобожник. И запрещено это для верующих.", "n": "«Прелюбодей женится только на прелюбодейке или многобожнице… а верующим это запрещено».", "c": null}, {"ref": "2:230", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "فَإِن طَلَّقَهَا فَلَا تَحِلُّ لَهُۥ مِنۢ بَعْدُ حَتَّىٰ تَنكِحَ زَوْجًا غَيْرَهُۥ ۗ فَإِن طَلَّقَهَا فَلَا جُنَاحَ عَلَيْهِمَآ أَن يَتَرَاجَعَآ إِن ظَنَّآ أَن يُقِيمَا حُدُودَ ٱللَّهِ ۗ وَتِلْكَ حُدُودُ ٱللَّهِ يُبَيِّنُهَا لِقَوْمٍۢ يَعْلَمُونَ ﴿230﴾", "ru": "Если же он дал развод ей (в третий раз), то не разрешается она ему после, пока не выйдет она за другого мужа, а если тот дал ей развод, то нет греха над ними, что они вернутся, если думают выполнить ограничения Аллаха. И вот границы Аллаха; Он разъясняет их людям, которые обладают знанием.", "n": "Трижды разведённую нельзя вернуть мужу, пока она не выйдет за другого и не разведётся с ним — на этом основан обычай «халяла» (фиктивный брак для возврата жены).", "c": null}, {"ref": "2:222", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَيَسْـَٔلُونَكَ عَنِ ٱلْمَحِيضِ ۖ قُلْ هُوَ أَذًۭى فَٱعْتَزِلُوا۟ ٱلنِّسَآءَ فِى ٱلْمَحِيضِ ۖ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ يَطْهُرْنَ ۖ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ ٱللَّهُ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلتَّوَّٰبِينَ وَيُحِبُّ ٱلْمُتَطَهِّرِينَ ﴿222﴾", "ru": "Они спрашивают тебя о менструациях. Скажи: \"Это - страдание\". Отдаляйтесь же от женщин при менструациях и не приближайтесь к ним, пока они не очистятся. А когда они очистятся, то приходите к ним так, как приказал вам Аллах. Поистине, Аллах любит обращающихся и любит очищающихся!", "n": "О менструации: «это — страдание; удаляйтесь от женщин во время месячных и не приближайтесь к ним, пока не очистятся».", "c": null}, {"ref": "4:129", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَلَن تَسْتَطِيعُوٓا۟ أَن تَعْدِلُوا۟ بَيْنَ ٱلنِّسَآءِ وَلَوْ حَرَصْتُمْ ۖ فَلَا تَمِيلُوا۟ كُلَّ ٱلْمَيْلِ فَتَذَرُوهَا كَٱلْمُعَلَّقَةِ ۚ وَإِن تُصْلِحُوا۟ وَتَتَّقُوا۟ فَإِنَّ ٱللَّهَ كَانَ غَفُورًۭا رَّحِيمًۭا ﴿129﴾", "ru": "И никогда вы не в состоянии быть справедливыми между женами, хотя бы и хотели этого. Не уклоняйтесь же всем уклонением, чтобы не оставить ее точно висящей. А если вы уладите и будете богобоязненными, то, поистине, Аллах прощающ, милосерд!", "n": "«Вы не сможете поступать справедливо между жёнами, как бы вы ни старались» — при том, что 4:3 разрешает многожёнство именно при условии справедливости.", "c": "Традиция: справедливость относится к материальному содержанию, а не к чувствам."}]}, {"id": "slavery", "title": "Рабство и наложницы", "icon": "⛓", "intro": "Коран признаёт институт рабства и допускает сексуальные отношения с рабынями. Он же поощряет освобождение рабов (напр., 24:33, 90:13), но самого института не отменяет.", "verses": [{"ref": "4:24", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "۞ وَٱلْمُحْصَنَٰتُ مِنَ ٱلنِّسَآءِ إِلَّا مَا مَلَكَتْ أَيْمَٰنُكُمْ ۖ كِتَٰبَ ٱللَّهِ عَلَيْكُمْ ۚ وَأُحِلَّ لَكُم مَّا وَرَآءَ ذَٰلِكُمْ أَن تَبْتَغُوا۟ بِأَمْوَٰلِكُم مُّحْصِنِينَ غَيْرَ مُسَٰفِحِينَ ۚ فَمَا ٱسْتَمْتَعْتُم بِهِۦ مِنْهُنَّ فَـَٔاتُوهُنَّ أُجُورَهُنَّ فَرِيضَةًۭ ۚ وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا تَرَٰضَيْتُم بِهِۦ مِنۢ بَعْدِ ٱلْفَرِيضَةِ ۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿24﴾", "ru": "И - замужние из женщин, если ими не овладели ваши десницы по писанию Аллаха над вами. И разрешено вам в том, что за этим, искать своим имуществом, соблюдая целомудрие, не распутничая. А за то, чем вы пользуетесь от них, давайте им их награду по установлению. И нет греха над вами, в чем вы согласитесь между собой после установления. Поистине, Аллах - знающий, мудрый!", "n": "Запрет на брак с замужними женщинами, «кроме тех, которыми овладели ваши десницы» — по традиции, пленных женщин.", "c": "Хадисы связывают с пленницами из похода при Аутасе; для классических юристов пленница доступна хозяину даже при живом муже."}, {"ref": "23:5-6", "sura": "Al-Muminoon", "sura_ar": "سُورَةُ المُؤۡمِنُونَ", "type": "Meccan", "ar": "وَٱلَّذِينَ هُمْ لِفُرُوجِهِمْ حَٰفِظُونَ ﴿5﴾ إِلَّا عَلَىٰٓ أَزْوَٰجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَٰنُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ ﴿6﴾", "ru": "(5) которые хранят свои члены, (6) (кроме как от своих жен и того, чем овладела десница их, - ведь они не встретят упрека,", "n": "Верующие хранят целомудрие, «кроме как со своими жёнами и теми, которыми овладели их десницы» — то есть рабыни-наложницы приравнены к законным объектам сексуального доступа; согласие рабыни не упоминается.", "c": "Классическое право исходит из того, что собственность хозяина на рабыню даёт ему такое право."}, {"ref": "70:29-30", "sura": "Al-Ma'aarij", "sura_ar": "سُورَةُ المَعَارِجِ", "type": "Meccan", "ar": "وَٱلَّذِينَ هُمْ لِفُرُوجِهِمْ حَٰفِظُونَ ﴿29﴾ إِلَّا عَلَىٰٓ أَزْوَٰجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَٰنُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ ﴿30﴾", "ru": "(29) и тех, которые охраняют свои члены (30) только для своих жен или для того, чем овладели их десницы: они ведь не заслуживают порицания.", "n": "Те же слова повторены в суре «Ступени».", "c": null}, {"ref": "33:50", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ إِنَّآ أَحْلَلْنَا لَكَ أَزْوَٰجَكَ ٱلَّٰتِىٓ ءَاتَيْتَ أُجُورَهُنَّ وَمَا مَلَكَتْ يَمِينُكَ مِمَّآ أَفَآءَ ٱللَّهُ عَلَيْكَ وَبَنَاتِ عَمِّكَ وَبَنَاتِ عَمَّٰتِكَ وَبَنَاتِ خَالِكَ وَبَنَاتِ خَٰلَٰتِكَ ٱلَّٰتِى هَاجَرْنَ مَعَكَ وَٱمْرَأَةًۭ مُّؤْمِنَةً إِن وَهَبَتْ نَفْسَهَا لِلنَّبِىِّ إِنْ أَرَادَ ٱلنَّبِىُّ أَن يَسْتَنكِحَهَا خَالِصَةًۭ لَّكَ مِن دُونِ ٱلْمُؤْمِنِينَ ۗ قَدْ عَلِمْنَا مَا فَرَضْنَا عَلَيْهِمْ فِىٓ أَزْوَٰجِهِمْ وَمَا مَلَكَتْ أَيْمَٰنُهُمْ لِكَيْلَا يَكُونَ عَلَيْكَ حَرَجٌۭ ۗ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًۭا ﴿50﴾", "ru": "О пророк, Мы разрешили тебе твоими женами тех, которым ты дал их награду, и тех, которыми овладела твоя десница из того, что даровал Аллах тебе в добычу, и дочерей твоего дяди со стороны отца, и дочерей твоих теток со стороны отца, и дочерей твоего дяди со стороны матери, и дочерей твоих теток со стороны матери, которые выселились вместе с тобой, и верующую женщину, если она отдала самое себя пророку, если пророк пожелает жениться на ней, - исключительно для тебя, помимо верующих. Мы знаем, что Мы установили для них относительно их жен и того, чем овладели десницы их, для того. чтобы не было на тебе стеснения. Аллах - прощающ. милосерд!", "n": "Пророку особо разрешены жёны, получившие брачный дар, пленницы из добычи, двоюродные сёстры и «верующая женщина, если она отдала самое себя пророку» — «исключительно для тебя, помимо верующих».", "c": "Традиционно — особая привилегия, ограниченная 33:52."}, {"ref": "4:25", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَمَن لَّمْ يَسْتَطِعْ مِنكُمْ طَوْلًا أَن يَنكِحَ ٱلْمُحْصَنَٰتِ ٱلْمُؤْمِنَٰتِ فَمِن مَّا مَلَكَتْ أَيْمَٰنُكُم مِّن فَتَيَٰتِكُمُ ٱلْمُؤْمِنَٰتِ ۚ وَٱللَّهُ أَعْلَمُ بِإِيمَٰنِكُم ۚ بَعْضُكُم مِّنۢ بَعْضٍۢ ۚ فَٱنكِحُوهُنَّ بِإِذْنِ أَهْلِهِنَّ وَءَاتُوهُنَّ أُجُورَهُنَّ بِٱلْمَعْرُوفِ مُحْصَنَٰتٍ غَيْرَ مُسَٰفِحَٰتٍۢ وَلَا مُتَّخِذَٰتِ أَخْدَانٍۢ ۚ فَإِذَآ أُحْصِنَّ فَإِنْ أَتَيْنَ بِفَٰحِشَةٍۢ فَعَلَيْهِنَّ نِصْفُ مَا عَلَى ٱلْمُحْصَنَٰتِ مِنَ ٱلْعَذَابِ ۚ ذَٰلِكَ لِمَنْ خَشِىَ ٱلْعَنَتَ مِنكُمْ ۚ وَأَن تَصْبِرُوا۟ خَيْرٌۭ لَّكُمْ ۗ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ ﴿25﴾", "ru": "А кто из вас не обладает достатком, чтобы жениться на охраняемых верующих, то - из тех, которыми овладели десницы ваши, из ваших верующих рабынь. Поистине, Аллах лучше знает вашу веру. Вы - одни от других. Женитесь же на них с дозволения их семей и давайте им их плату с достоинством, - целомудренным, не распутничающим и не берущим приятелей. И если они были целомудренны... А если совершат мерзость, то им - половина того, что целомудренным, из наказания. Это - тем из вас, кто боится тягости. А если вы будете терпеливы, то это - лучше для вас. Поистине, Аллах - прощающий, милосердный!", "n": "Тем, кто не может жениться на свободной, разрешён брак с рабынями-«девушками» с согласия хозяев; за прелюбодеяние рабыням положена половина наказания свободной женщины.", "c": null}, {"ref": "8:69", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "فَكُلُوا۟ مِمَّا غَنِمْتُمْ حَلَٰلًۭا طَيِّبًۭا ۚ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ ﴿69﴾", "ru": "Ешьте же то, что вы взяли в добычу дозволенным, благим, и бойтесь Аллаха: поистине, Аллах прощающ, милосерд!", "n": "Разрешено «есть» из полученной добычи (включая пленных и их имущество) как «дозволенное и благое».", "c": null}, {"ref": "16:75", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "۞ ضَرَبَ ٱللَّهُ مَثَلًا عَبْدًۭا مَّمْلُوكًۭا لَّا يَقْدِرُ عَلَىٰ شَىْءٍۢ وَمَن رَّزَقْنَٰهُ مِنَّا رِزْقًا حَسَنًۭا فَهُوَ يُنفِقُ مِنْهُ سِرًّۭا وَجَهْرًا ۖ هَلْ يَسْتَوُۥنَ ۚ ٱلْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ ﴿75﴾", "ru": "Приводит Аллах притчей раба - невольника, который не может ничего, и того, кого Мы наделили от Себя хорошим уделом, и он расходует из него тайно и явно. Разве они одинаковы? Хвала Аллаху! Но большая часть их не знает!", "n": "Раб-собственность описан как существо, которое «ничем не распоряжается» — в притче сравниваются Бог и идолы.", "c": null}]}, {"id": "others", "title": "Иноверцы и неверные", "icon": "✋", "intro": "Как Коран говорит о людях другой веры: приказы дистанцироваться, оскорбительные характеристики, угрозы и проклятия.", "verses": [{"ref": "3:85", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَمَن يَبْتَغِ غَيْرَ ٱلْإِسْلَٰمِ دِينًۭا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِى ٱلْءَاخِرَةِ مِنَ ٱلْخَٰسِرِينَ ﴿85﴾", "ru": "Кто же ищет не ислама как религии, от того не будет принято, и он в последней жизни окажется в числе потерпевших убыток.", "n": "«Кто ищет иной религии, кроме ислама, — от того не будет принято» — исключительность одной религии.", "c": null}, {"ref": "3:28", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "لَّا يَتَّخِذِ ٱلْمُؤْمِنُونَ ٱلْكَٰفِرِينَ أَوْلِيَآءَ مِن دُونِ ٱلْمُؤْمِنِينَ ۖ وَمَن يَفْعَلْ ذَٰلِكَ فَلَيْسَ مِنَ ٱللَّهِ فِى شَىْءٍ إِلَّآ أَن تَتَّقُوا۟ مِنْهُمْ تُقَىٰةًۭ ۗ وَيُحَذِّرُكُمُ ٱللَّهُ نَفْسَهُۥ ۗ وَإِلَى ٱللَّهِ ٱلْمَصِيرُ ﴿28﴾", "ru": "Пусть верующие не берут себе близкими неверных помимо верующих. А кто сделает это, у того с Аллахом нет ничего общего, если вы только не будете опасаться их страхом. Аллах предостерегает вас от самого Себя, и к Аллаху - возвращение\".", "n": "Верующим запрещено брать неверных в союзники и друзья.", "c": null}, {"ref": "5:51", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "۞ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ ٱلْيَهُودَ وَٱلنَّصَٰرَىٰٓ أَوْلِيَآءَ ۘ بَعْضُهُمْ أَوْلِيَآءُ بَعْضٍۢ ۚ وَمَن يَتَوَلَّهُم مِّنكُمْ فَإِنَّهُۥ مِنْهُمْ ۗ إِنَّ ٱللَّهَ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ ﴿51﴾", "ru": "О вы, которые уверовали! Не берите иудеев и христиан друзьями: они - друзья один другому. А если кто из вас берет их себе в друзья, тот и сам из них. Поистине, Аллах не ведет людей неправедных!", "n": "Запрет «брать в друзья/покровители» иудеев и христиан: «они — друзья друг другу; кто из вас берёт их себе в друзья — тот из них».", "c": null}, {"ref": "9:28", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِنَّمَا ٱلْمُشْرِكُونَ نَجَسٌۭ فَلَا يَقْرَبُوا۟ ٱلْمَسْجِدَ ٱلْحَرَامَ بَعْدَ عَامِهِمْ هَٰذَا ۚ وَإِنْ خِفْتُمْ عَيْلَةًۭ فَسَوْفَ يُغْنِيكُمُ ٱللَّهُ مِن فَضْلِهِۦٓ إِن شَآءَ ۚ إِنَّ ٱللَّهَ عَلِيمٌ حَكِيمٌۭ ﴿28﴾", "ru": "О вы, которые уверовали! Ведь многобожники - нечистота. Пусть же они не приближаются к мечети священной после этого года! А если вы боитесь недостатка, то обогатит вас Аллах от Своей щедрости, если пожелает. Поистине, Аллах - знающий, мудрый!", "n": "Многобожники названы «нечистыми» («наджас») и допуск их к запретной мечети запрещён.", "c": null}, {"ref": "98:6", "sura": "Al-Bayyina", "sura_ar": "سُورَةُ البَيِّنَةِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ فِى نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآ ۚ أُو۟لَٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ ﴿6﴾", "ru": "Поистине, те из обладателей писания и многобожников, которые не уверовали, - в огне геенны, - вечно пребывая там. Они - худшие из тварей.", "n": "Неверные из людей Писания и многобожников «в огне геенны... они — наихудшие из тварей».", "c": null}, {"ref": "8:55", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "إِنَّ شَرَّ ٱلدَّوَآبِّ عِندَ ٱللَّهِ ٱلَّذِينَ كَفَرُوا۟ فَهُمْ لَا يُؤْمِنُونَ ﴿55﴾", "ru": "Поистине, злейшие из животных у Аллаха - те, которые не веровали, и они не веруют, -", "n": "«Наихудшие из животных у Аллаха — те, которые не уверовали».", "c": null}, {"ref": "2:65", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَلَقَدْ عَلِمْتُمُ ٱلَّذِينَ ٱعْتَدَوْا۟ مِنكُمْ فِى ٱلسَّبْتِ فَقُلْنَا لَهُمْ كُونُوا۟ قِرَدَةً خَٰسِـِٔينَ ﴿65﴾", "ru": "Вы знаете тех из вас, которые нарушили субботу, и Мы сказали им: \"Будьте обезьянами презренными!\"", "n": "Нарушившие субботу иудеи превращены Богом в «презренных обезьян».", "c": "Часть комментаторов (напр., Муджахид) понимает метафорически."}, {"ref": "5:60", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "قُلْ هَلْ أُنَبِّئُكُم بِشَرٍّۢ مِّن ذَٰلِكَ مَثُوبَةً عِندَ ٱللَّهِ ۚ مَن لَّعَنَهُ ٱللَّهُ وَغَضِبَ عَلَيْهِ وَجَعَلَ مِنْهُمُ ٱلْقِرَدَةَ وَٱلْخَنَازِيرَ وَعَبَدَ ٱلطَّٰغُوتَ ۚ أُو۟لَٰٓئِكَ شَرٌّۭ مَّكَانًۭا وَأَضَلُّ عَن سَوَآءِ ٱلسَّبِيلِ ﴿60﴾", "ru": "Скажи: \"Не сообщить ли мне вам более злостное, чем это, по награде у Аллаха? Тот, кого проклял Аллах и на кого разгневался, и сделал из них обезьян и свиней, и кто поклонялся тагуту. Эти - злостнее по месту и более сбившиеся с ровного пути\".", "n": "Некоторые из людей Писания «превращены в обезьян и свиней».", "c": null}, {"ref": "9:30", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "وَقَالَتِ ٱلْيَهُودُ عُزَيْرٌ ٱبْنُ ٱللَّهِ وَقَالَتِ ٱلنَّصَٰرَى ٱلْمَسِيحُ ٱبْنُ ٱللَّهِ ۖ ذَٰلِكَ قَوْلُهُم بِأَفْوَٰهِهِمْ ۖ يُضَٰهِـُٔونَ قَوْلَ ٱلَّذِينَ كَفَرُوا۟ مِن قَبْلُ ۚ قَٰتَلَهُمُ ٱللَّهُ ۚ أَنَّىٰ يُؤْفَكُونَ ﴿30﴾", "ru": "И сказали иудеи: \"Узайр - сын Аллаха\". И сказали христиане: \"Мессия - сын Аллаха\". Эти слова в их устах похожи на слова тех, которые не веровали раньше. Пусть поразит их Аллах! До чего они отвращены!", "n": "«Иудеи говорят: Узайр — сын Аллаха; христиане говорят: Мессия — сын Аллаха... да погубит их Аллах!»", "c": "Исторически нет свидетельств, что иудеи считали Узайра (Ездру) «сыном Бога»; см. раздел о противоречиях."}, {"ref": "5:73", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "لَّقَدْ كَفَرَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ ثَالِثُ ثَلَٰثَةٍۢ ۘ وَمَا مِنْ إِلَٰهٍ إِلَّآ إِلَٰهٌۭ وَٰحِدٌۭ ۚ وَإِن لَّمْ يَنتَهُوا۟ عَمَّا يَقُولُونَ لَيَمَسَّنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْهُمْ عَذَابٌ أَلِيمٌ ﴿73﴾", "ru": "Не веровали те, которые говорили: \"Ведь Аллах - третий из трех\", - тогда как нет другого божества, кроме единого Бога. А если они не удержатся от того, что говорят, то коснется тех из них, которые не уверовали, мучительное наказание.", "n": "Христиане, говорящие о триедином Боге, объявлены неверными и им угрожают «мучительным наказанием».", "c": null}, {"ref": "3:151", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "سَنُلْقِى فِى قُلُوبِ ٱلَّذِينَ كَفَرُوا۟ ٱلرُّعْبَ بِمَآ أَشْرَكُوا۟ بِٱللَّهِ مَا لَمْ يُنَزِّلْ بِهِۦ سُلْطَٰنًۭا ۖ وَمَأْوَىٰهُمُ ٱلنَّارُ ۚ وَبِئْسَ مَثْوَى ٱلظَّٰلِمِينَ ﴿151﴾", "ru": "Мы ввергнем в сердца тех, которые не веровали, ужас за то, что они придавали Аллаху в сотоварищи то, к чему Он не ниспослал никакой власти. Убежище их - огонь, и скверно пребывание нечестивых!", "n": "«Мы вселим ужас в сердца тех, которые не веровали».", "c": null}, {"ref": "48:29", "sura": "Al-Fath", "sura_ar": "سُورَةُ الفَتۡحِ", "type": "Medinan", "ar": "مُّحَمَّدٌۭ رَّسُولُ ٱللَّهِ ۚ وَٱلَّذِينَ مَعَهُۥٓ أَشِدَّآءُ عَلَى ٱلْكُفَّارِ رُحَمَآءُ بَيْنَهُمْ ۖ تَرَىٰهُمْ رُكَّعًۭا سُجَّدًۭا يَبْتَغُونَ فَضْلًۭا مِّنَ ٱللَّهِ وَرِضْوَٰنًۭا ۖ سِيمَاهُمْ فِى وُجُوهِهِم مِّنْ أَثَرِ ٱلسُّجُودِ ۚ ذَٰلِكَ مَثَلُهُمْ فِى ٱلتَّوْرَىٰةِ ۚ وَمَثَلُهُمْ فِى ٱلْإِنجِيلِ كَزَرْعٍ أَخْرَجَ شَطْـَٔهُۥ فَـَٔازَرَهُۥ فَٱسْتَغْلَظَ فَٱسْتَوَىٰ عَلَىٰ سُوقِهِۦ يُعْجِبُ ٱلزُّرَّاعَ لِيَغِيظَ بِهِمُ ٱلْكُفَّارَ ۗ وَعَدَ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ مِنْهُم مَّغْفِرَةًۭ وَأَجْرًا عَظِيمًۢا ﴿29﴾", "ru": "Мухаммад - посланник Аллаха, и те, которые с ним, - яростны против неверных, милостивы между собой. Ты видишь их преклоняющимися, падающими ниц. Они ищут милости от Аллаха и благоволения. Приметы их - на их лицах от следов падения ниц. Таков образ их в Торе, но в Евангелии образ их - посев, который извел свой побег и укрепил его; он стал твердым и выровнялся на стебле, восхищая сеятелей, - чтобы разъярить ими неверных. Обещал Аллах тем из них, которые уверовали и творили благое, прощение и великую награду!", "n": "Верующие описаны как «суровые к неверным и милосердные между собой».", "c": null}, {"ref": "2:89", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَلَمَّا جَآءَهُمْ كِتَٰبٌۭ مِّنْ عِندِ ٱللَّهِ مُصَدِّقٌۭ لِّمَا مَعَهُمْ وَكَانُوا۟ مِن قَبْلُ يَسْتَفْتِحُونَ عَلَى ٱلَّذِينَ كَفَرُوا۟ فَلَمَّا جَآءَهُم مَّا عَرَفُوا۟ كَفَرُوا۟ بِهِۦ ۚ فَلَعْنَةُ ٱللَّهِ عَلَى ٱلْكَٰفِرِينَ ﴿89﴾", "ru": "А когда пришло к ним писание, от Аллаха, подтверждающее истинность того, что с ними, - а еще прежде они просили победы против тех, которые были неверные, - так когда пришло к ним то, что они знали, они не уверовали в это. Проклятие же Аллаха над неверующими!", "n": "Проклятие Аллаха на неверных.", "c": null}]}, {"id": "hell", "title": "Ад и проклятия", "icon": "🔥", "intro": "Образы вечных мучений, в которых наказание за неверие описывается как бесконечное и физически жестокое.", "verses": [{"ref": "4:56", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِنَا سَوْفَ نُصْلِيهِمْ نَارًۭا كُلَّمَا نَضِجَتْ جُلُودُهُم بَدَّلْنَٰهُمْ جُلُودًا غَيْرَهَا لِيَذُوقُوا۟ ٱلْعَذَابَ ۗ إِنَّ ٱللَّهَ كَانَ عَزِيزًا حَكِيمًۭا ﴿56﴾", "ru": "Поистине, тех, которые не веровали в Наши знамения, Мы сожжем в огне! Всякий раз, как сготовится их кожа, Мы заменим им другой кожей, чтобы они вкусили наказания. Поистине, Аллах - великий, мудрый!", "n": "Неверующих ждёт огонь: «всякий раз, как сгорит их кожа, Мы заменим её другой кожей, чтобы они вкусили мучение».", "c": null}, {"ref": "22:19-21", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "۞ هَٰذَانِ خَصْمَانِ ٱخْتَصَمُوا۟ فِى رَبِّهِمْ ۖ فَٱلَّذِينَ كَفَرُوا۟ قُطِّعَتْ لَهُمْ ثِيَابٌۭ مِّن نَّارٍۢ يُصَبُّ مِن فَوْقِ رُءُوسِهِمُ ٱلْحَمِيمُ ﴿19﴾ يُصْهَرُ بِهِۦ مَا فِى بُطُونِهِمْ وَٱلْجُلُودُ ﴿20﴾ وَلَهُم مَّقَٰمِعُ مِنْ حَدِيدٍۢ ﴿21﴾", "ru": "(19) Вот - два врага, которые враждовали об их господе; тем, которые не веровали, выкроены одежды из огня, проливается на их головы кипяток. (20) Растапливается от этого то, что у них в утробах, и (их) кожи. (21) Для них есть железные крючья.", "n": "Для неверных скроены одежды из огня, над головами польют кипяток, «им растопится то, что у них в животах, и кожа», а для них — железные палицы.", "c": null}, {"ref": "14:16-17", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "مِّن وَرَآئِهِۦ جَهَنَّمُ وَيُسْقَىٰ مِن مَّآءٍۢ صَدِيدٍۢ ﴿16﴾ يَتَجَرَّعُهُۥ وَلَا يَكَادُ يُسِيغُهُۥ وَيَأْتِيهِ ٱلْمَوْتُ مِن كُلِّ مَكَانٍۢ وَمَا هُوَ بِمَيِّتٍۢ ۖ وَمِن وَرَآئِهِۦ عَذَابٌ غَلِيظٌۭ ﴿17﴾", "ru": "(16) Позади его - геенна, и будут его поить водой гнойной. (17) Он лакает ее, но едва проглатывает, и приходит к нему смерть со всех мест, но он не мертв, а позади его - суровое наказание.", "n": "Питьё из «гнойной воды»: неверный «будет глотать её, но почти не проглотит; смерть будет приходить к нему со всех сторон, но он не умрёт».", "c": null}, {"ref": "44:43-46", "sura": "Ad-Dukhaan", "sura_ar": "سُورَةُ الدُّخَانِ", "type": "Meccan", "ar": "إِنَّ شَجَرَتَ ٱلزَّقُّومِ ﴿43﴾ طَعَامُ ٱلْأَثِيمِ ﴿44﴾ كَٱلْمُهْلِ يَغْلِى فِى ٱلْبُطُونِ ﴿45﴾ كَغَلْىِ ٱلْحَمِيمِ ﴿46﴾", "ru": "(43) Ведь дерево заккум - (44) пища для грешника. (45) Как медь, - кипит оно в животах, (46) точно кипит кипяток.", "n": "Дерево заккум — «пища грешника»: «как расплавленный металл, оно будет кипеть в животах, как бурление кипятка».", "c": null}, {"ref": "18:29", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَقُلِ ٱلْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَآءَ فَلْيُؤْمِن وَمَن شَآءَ فَلْيَكْفُرْ ۚ إِنَّآ أَعْتَدْنَا لِلظَّٰلِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا ۚ وَإِن يَسْتَغِيثُوا۟ يُغَاثُوا۟ بِمَآءٍۢ كَٱلْمُهْلِ يَشْوِى ٱلْوُجُوهَ ۚ بِئْسَ ٱلشَّرَابُ وَسَآءَتْ مُرْتَفَقًا ﴿29﴾", "ru": "И скажи: \"Истина - от вашего Господа: кто хочет, пусть верует, а кто хочет, пусть не верует\". Мы приготовили несправедливым огонь, навес которого окружит их; а если они воззовут о помощи, им помогут водой, подобной расплавленному металлу, которая опаляет лица. Скверно питье, и плохо убежище!", "n": "Неверных ждёт огонь; когда они попросят воды, им подадут воду «подобную расплавленному металлу, которая обожжёт лица».", "c": null}, {"ref": "111:1-5", "sura": "Al-Masad", "sura_ar": "سُورَةُ المَسَدِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ تَبَّتْ يَدَآ أَبِى لَهَبٍۢ وَتَبَّ ﴿1﴾ مَآ أَغْنَىٰ عَنْهُ مَالُهُۥ وَمَا كَسَبَ ﴿2﴾ سَيَصْلَىٰ نَارًۭا ذَاتَ لَهَبٍۢ ﴿3﴾ وَٱمْرَأَتُهُۥ حَمَّالَةَ ٱلْحَطَبِ ﴿4﴾ فِى جِيدِهَا حَبْلٌۭ مِّن مَّسَدٍۭ ﴿5﴾", "ru": "(1) Пусть пропадут обе руки Абу Лахаба, а сам он пропал! (2) Не помогло ему его богатство и то, что он приобрел. (3) Будет он гореть в огне с пламенем (4) и жена его (тоже) - носильщица дров, (5) на шее у нее - (только) веревка из пальмовых волокон.", "n": "Сура «Пальмовые волокна»: проклятие личного дяди Мухаммада Абу Лахаба и его жены; их ждёт «пламенный огонь», а на шее жены — «верёвка из волокон».", "c": "Один из примеров, где конкретные люди проклинаются по имени."}]}, {"id": "science", "title": "Противоречия науке", "icon": "🔬", "intro": "Утверждения о природе, космосе и биологии, которые не соответствуют современным данным. Обратите внимание на то, что некоторые из них апологеты трактуют как метафоры.", "verses": [{"ref": "18:86", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَا بَلَغَ مَغْرِبَ ٱلشَّمْسِ وَجَدَهَا تَغْرُبُ فِى عَيْنٍ حَمِئَةٍۢ وَوَجَدَ عِندَهَا قَوْمًۭا ۗ قُلْنَا يَٰذَا ٱلْقَرْنَيْنِ إِمَّآ أَن تُعَذِّبَ وَإِمَّآ أَن تَتَّخِذَ فِيهِمْ حُسْنًۭا ﴿86﴾", "ru": "А когда он дошел до заката солнца, то увидел, что оно закатывается в источник зловонный, и нашел около него людей. Мы сказали: \"О Зу-л-карнайн, либо ты накажешь, либо устроишь для них милость\".", "n": "Зу-л-Карнайн дошёл до места заката солнца и увидел, что оно «закатывается в источник зловонный» (в других переводах — «тёмный», «грязный»).", "c": "Апологеты: описание с точки зрения наблюдателя; критики отмечают, что текст говорит не «кажется», а «нашёл, что оно заходит»."}, {"ref": "18:90", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَا بَلَغَ مَطْلِعَ ٱلشَّمْسِ وَجَدَهَا تَطْلُعُ عَلَىٰ قَوْمٍۢ لَّمْ نَجْعَل لَّهُم مِّن دُونِهَا سِتْرًۭا ﴿90﴾", "ru": "А когда дошел он до восхода солнца, то нашел, что оно восходит над людьми, для которых Мы не сделали от него никакой завесы.", "n": "Дошёл до места восхода солнца — оно «восходит над людьми, для которых Мы не сделали от него покрова».", "c": null}, {"ref": "36:38", "sura": "Yaseen", "sura_ar": "سُورَةُ يسٓ", "type": "Meccan", "ar": "وَٱلشَّمْسُ تَجْرِى لِمُسْتَقَرٍّۢ لَّهَا ۚ ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ ﴿38﴾", "ru": "И солнце течет к местопребыванию своему. Таково установление Славного, Мудрого!", "n": "«Солнце течёт к месту своего пребывания».", "c": "Хадис (Сахих аль-Бухари) поясняет: каждую ночь солнце падает ниц под Троном Аллаха."}, {"ref": "86:6-7", "sura": "At-Taariq", "sura_ar": "سُورَةُ الطَّارِقِ", "type": "Meccan", "ar": "خُلِقَ مِن مَّآءٍۢ دَافِقٍۢ ﴿6﴾ يَخْرُجُ مِنۢ بَيْنِ ٱلصُّلْبِ وَٱلتَّرَآئِبِ ﴿7﴾", "ru": "(6) Создан из воды изливающейся. (7) Выходит она из хребта и грудных костей.", "n": "Человек создан «из изливающейся воды, выходящей из хребта и рёбер» — не соответствует знанию о том, где образуется сперма.", "c": "Апологеты предлагают толкования с эмбриональным происхождением половых желез; критики отмечают, что текст говорит о «хребте и рёбрах», а не о почках."}, {"ref": "67:5", "sura": "Al-Mulk", "sura_ar": "سُورَةُ المُلۡكِ", "type": "Meccan", "ar": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ ﴿5﴾", "ru": "Мы украсили уже небо ближайшее светильниками, и сделали их побиением для дияволов, и уготовали им наказание огня.", "n": "Звёзды названы «светильниками» и «снарядами для шайтанов».", "c": "Классические комментаторы видят здесь метеоры, которыми «забрасывают» подслушивающих джиннов."}, {"ref": "37:6-10", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "إِنَّا زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِزِينَةٍ ٱلْكَوَاكِبِ ﴿6﴾ وَحِفْظًۭا مِّن كُلِّ شَيْطَٰنٍۢ مَّارِدٍۢ ﴿7﴾ لَّا يَسَّمَّعُونَ إِلَى ٱلْمَلَإِ ٱلْأَعْلَىٰ وَيُقْذَفُونَ مِن كُلِّ جَانِبٍۢ ﴿8﴾ دُحُورًۭا ۖ وَلَهُمْ عَذَابٌۭ وَاصِبٌ ﴿9﴾ إِلَّا مَنْ خَطِفَ ٱلْخَطْفَةَ فَأَتْبَعَهُۥ شِهَابٌۭ ثَاقِبٌۭ ﴿10﴾", "ru": "(6) Мы ведь украсили небо ближайшее украшением звезд (7) и для охраны от всякого шайтана мятежного. (8) Они не прислушиваются к верховному совету и поражаются со всех сторон (9) для отогнания, и для них - наказание мучительное. (10) кроме тех, кто урвет схватку, и преследует его поражающий светоч.", "n": "Небо украшено звёздами и «охраняется» от мятежных шайтанов; тот, кто попытается подслушать, будет настигнут «пронзающим пламенем» (метеором).", "c": null}, {"ref": "15:17-18", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "وَحَفِظْنَٰهَا مِن كُلِّ شَيْطَٰنٍۢ رَّجِيمٍ ﴿17﴾ إِلَّا مَنِ ٱسْتَرَقَ ٱلسَّمْعَ فَأَتْبَعَهُۥ شِهَابٌۭ مُّبِينٌۭ ﴿18﴾", "ru": "(17) И охранили Мы их от всякого сатаны, побиваемого камнями. (18) А если кто украдкой подслушает, то следует за ним ясный светоч.", "n": "Небо охраняется от побиваемого шайтана; подслушавшего настигнет «явный метеор» — в тексте космические явления объясняются как оружие против джиннов.", "c": null}, {"ref": "71:15-16", "sura": "Nooh", "sura_ar": "سُورَةُ نُوحٍ", "type": "Meccan", "ar": "أَلَمْ تَرَوْا۟ كَيْفَ خَلَقَ ٱللَّهُ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ﴿15﴾ وَجَعَلَ ٱلْقَمَرَ فِيهِنَّ نُورًۭا وَجَعَلَ ٱلشَّمْسَ سِرَاجًۭا ﴿16﴾", "ru": "(15) Разве вы не видите, как сотворил Аллах семь небес рядами? (16) И сделал месяц на них светом, а солнце сделал светильником.", "n": "Семь небес «ярусами»; Луна — «свет», а Солнце — «светильник» (сирадж). Луна лишь отражает свет Солнца, собственного света не имеет.", "c": null}, {"ref": "65:12", "sura": "At-Talaaq", "sura_ar": "سُورَةُ الطَّلَاقِ", "type": "Medinan", "ar": "ٱللَّهُ ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ وَمِنَ ٱلْأَرْضِ مِثْلَهُنَّ يَتَنَزَّلُ ٱلْأَمْرُ بَيْنَهُنَّ لِتَعْلَمُوٓا۟ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ وَأَنَّ ٱللَّهَ قَدْ أَحَاطَ بِكُلِّ شَىْءٍ عِلْمًۢا ﴿12﴾", "ru": "Аллах - тот, кто сотворил семь небес и из земли столько же. Нисходит повеление между ними, чтобы вы знали, что Аллах над всем мощен и что Аллах все объемлет знанием.", "n": "«Аллах — тот, кто сотворил семь небес и из земли — подобное им».", "c": null}, {"ref": "23:14", "sura": "Al-Muminoon", "sura_ar": "سُورَةُ المُؤۡمِنُونَ", "type": "Meccan", "ar": "ثُمَّ خَلَقْنَا ٱلنُّطْفَةَ عَلَقَةًۭ فَخَلَقْنَا ٱلْعَلَقَةَ مُضْغَةًۭ فَخَلَقْنَا ٱلْمُضْغَةَ عِظَٰمًۭا فَكَسَوْنَا ٱلْعِظَٰمَ لَحْمًۭا ثُمَّ أَنشَأْنَٰهُ خَلْقًا ءَاخَرَ ۚ فَتَبَارَكَ ٱللَّهُ أَحْسَنُ ٱلْخَٰلِقِينَ ﴿14﴾", "ru": "потом создали из капли сгусток крови, и создали из сгустка крови кусок мяса, создали из этого куска кости и облекли кости мясом, потом Мы вырастили его в другом творении, - благословен же Аллах, лучший из творцов!", "n": "Эмбрион: затем из сгустка создали «кусок», «кости», «облекли кости плотью» — стадии не совпадают с эмбриологией, где кости и мышцы формируются одновременно.", "c": "Часто цитируется апологетами как «научное чудо»; сторонние эмбриологи оспаривают."}, {"ref": "16:15", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَأَلْقَىٰ فِى ٱلْأَرْضِ رَوَٰسِىَ أَن تَمِيدَ بِكُمْ وَأَنْهَٰرًۭا وَسُبُلًۭا لَّعَلَّكُمْ تَهْتَدُونَ ﴿15﴾", "ru": "И бросил Он на землю прочно стоящие, чтобы она не колебалась с вами, и реки , и пути, - может быть, вы пойдете по прямой дороге! -", "n": "«Он поставил на земле незыблемые горы, чтобы она не колебалась с вами».", "c": null}, {"ref": "31:10", "sura": "Luqman", "sura_ar": "سُورَةُ لُقۡمَانَ", "type": "Meccan", "ar": "خَلَقَ ٱلسَّمَٰوَٰتِ بِغَيْرِ عَمَدٍۢ تَرَوْنَهَا ۖ وَأَلْقَىٰ فِى ٱلْأَرْضِ رَوَٰسِىَ أَن تَمِيدَ بِكُمْ وَبَثَّ فِيهَا مِن كُلِّ دَآبَّةٍۢ ۚ وَأَنزَلْنَا مِنَ ٱلسَّمَآءِ مَآءًۭ فَأَنۢبَتْنَا فِيهَا مِن كُلِّ زَوْجٍۢ كَرِيمٍ ﴿10﴾", "ru": "Он сотворил небеса без опоры, которую бы вы видели, и бросил на землю прочно стоящие, чтобы она не колебалась с вами, и рассеял там всяких животных, и низвели Мы с неба воду и взрастили на ней всякую благородную пару.", "n": "Горы «брошены» на землю, «чтобы она не качалась с вами».", "c": null}, {"ref": "21:32", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "وَجَعَلْنَا ٱلسَّمَآءَ سَقْفًۭا مَّحْفُوظًۭا ۖ وَهُمْ عَنْ ءَايَٰتِهَا مُعْرِضُونَ ﴿32﴾", "ru": "И Мы устроили небо крышей охраняемой, а они от знамений его отвращаются.", "n": "Небо — «охраняемая крыша».", "c": null}, {"ref": "22:65", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "أَلَمْ تَرَ أَنَّ ٱللَّهَ سَخَّرَ لَكُم مَّا فِى ٱلْأَرْضِ وَٱلْفُلْكَ تَجْرِى فِى ٱلْبَحْرِ بِأَمْرِهِۦ وَيُمْسِكُ ٱلسَّمَآءَ أَن تَقَعَ عَلَى ٱلْأَرْضِ إِلَّا بِإِذْنِهِۦٓ ۗ إِنَّ ٱللَّهَ بِٱلنَّاسِ لَرَءُوفٌۭ رَّحِيمٌۭ ﴿65﴾", "ru": "Разве ты не видел, что Аллах подчинил вам то, что на земле, и корабль, который течет по морю с Его повеления? И Он держит небо, чтобы оно не упало на землю иначе, как с Его дозволения. Поистине, Аллах к людям кроток, милостив!", "n": "Бог «удерживает небо, чтобы оно не упало на землю, кроме как с Его разрешения».", "c": null}, {"ref": "13:2", "sura": "Ar-Ra'd", "sura_ar": "سُورَةُ الرَّعۡدِ", "type": "Medinan", "ar": "ٱللَّهُ ٱلَّذِى رَفَعَ ٱلسَّمَٰوَٰتِ بِغَيْرِ عَمَدٍۢ تَرَوْنَهَا ۖ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۖ وَسَخَّرَ ٱلشَّمْسَ وَٱلْقَمَرَ ۖ كُلٌّۭ يَجْرِى لِأَجَلٍۢ مُّسَمًّۭى ۚ يُدَبِّرُ ٱلْأَمْرَ يُفَصِّلُ ٱلْءَايَٰتِ لَعَلَّكُم بِلِقَآءِ رَبِّكُمْ تُوقِنُونَ ﴿2﴾", "ru": "Аллах - тот, кто воздвиг небеса без опор, которые бы видели, потом утвердился на троне и подчинил солнце и луну: все течет до определенного предела. Он управляет (Своим) делом, устанавливает ясно знамения, - может быть, вы уверитесь во встрече с вашим Господом!", "n": "Небеса подняты «без видимых вам столбов».", "c": null}, {"ref": "27:18-19", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَآ أَتَوْا۟ عَلَىٰ وَادِ ٱلنَّمْلِ قَالَتْ نَمْلَةٌۭ يَٰٓأَيُّهَا ٱلنَّمْلُ ٱدْخُلُوا۟ مَسَٰكِنَكُمْ لَا يَحْطِمَنَّكُمْ سُلَيْمَٰنُ وَجُنُودُهُۥ وَهُمْ لَا يَشْعُرُونَ ﴿18﴾ فَتَبَسَّمَ ضَاحِكًۭا مِّن قَوْلِهَا وَقَالَ رَبِّ أَوْزِعْنِىٓ أَنْ أَشْكُرَ نِعْمَتَكَ ٱلَّتِىٓ أَنْعَمْتَ عَلَىَّ وَعَلَىٰ وَٰلِدَىَّ وَأَنْ أَعْمَلَ صَٰلِحًۭا تَرْضَىٰهُ وَأَدْخِلْنِى بِرَحْمَتِكَ فِى عِبَادِكَ ٱلصَّٰلِحِينَ ﴿19﴾", "ru": "(18) А когда они дошли до муравьиной долины, одна муравьиха сказала: \"О муравьи, войдите в ваше жилье, пусть не растопчет вас Сулайман и его войска, не замечая этого\". (19) Он улыбнулся, засмеявшись от ее слов, и сказал: \"Господи, внуши мне быть благодарным за Твою милость, которую Ты ниспослал мне и моим родителям, и чтобы я делал благо, которое Тебе угодно, и введи меня Твоей милостью в число рабов Твоих праведных!\"", "n": "Муравей разговаривает с другими муравьями, предупреждая о войске Сулеймана; Сулейман «улыбнулся, смеясь над её словами».", "c": null}, {"ref": "29:14", "sura": "Al-Ankaboot", "sura_ar": "سُورَةُ العَنكَبُوتِ", "type": "Meccan", "ar": "وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِۦ فَلَبِثَ فِيهِمْ أَلْفَ سَنَةٍ إِلَّا خَمْسِينَ عَامًۭا فَأَخَذَهُمُ ٱلطُّوفَانُ وَهُمْ ظَٰلِمُونَ ﴿14﴾", "ru": "Мы посылали уже Нуха к его народу, и он пребывал среди них тысячу лет без пятидесяти годов и постиг их потоп, а были они неправедными.", "n": "Нух жил среди своего народа «тысячу лет без пятидесяти».", "c": null}, {"ref": "24:45", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَٱللَّهُ خَلَقَ كُلَّ دَآبَّةٍۢ مِّن مَّآءٍۢ ۖ فَمِنْهُم مَّن يَمْشِى عَلَىٰ بَطْنِهِۦ وَمِنْهُم مَّن يَمْشِى عَلَىٰ رِجْلَيْنِ وَمِنْهُم مَّن يَمْشِى عَلَىٰٓ أَرْبَعٍۢ ۚ يَخْلُقُ ٱللَّهُ مَا يَشَآءُ ۚ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿45﴾", "ru": "Аллах сотворил всякое животное из воды. Из них есть такие, что ходят на животе, и есть из них такие, что ходят на двух ногах, и есть из них такие, что ходят на четырех. Творит Аллах, что пожелает. Ведь Аллах над всякой вещью мощен!", "n": "«Аллах сотворил каждое животное из воды».", "c": null}, {"ref": "18:25", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَلَبِثُوا۟ فِى كَهْفِهِمْ ثَلَٰثَ مِا۟ئَةٍۢ سِنِينَ وَٱزْدَادُوا۟ تِسْعًۭا ﴿25﴾", "ru": "И оставались они в пещере своей триста лет и прибавили еще девять.", "n": "Спутники пещеры «пробыли в своей пещере триста лет и ещё девять» — сон длиной 309 лет.", "c": null}, {"ref": "18:93-96", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَا بَلَغَ بَيْنَ ٱلسَّدَّيْنِ وَجَدَ مِن دُونِهِمَا قَوْمًۭا لَّا يَكَادُونَ يَفْقَهُونَ قَوْلًۭا ﴿93﴾ قَالُوا۟ يَٰذَا ٱلْقَرْنَيْنِ إِنَّ يَأْجُوجَ وَمَأْجُوجَ مُفْسِدُونَ فِى ٱلْأَرْضِ فَهَلْ نَجْعَلُ لَكَ خَرْجًا عَلَىٰٓ أَن تَجْعَلَ بَيْنَنَا وَبَيْنَهُمْ سَدًّۭا ﴿94﴾ قَالَ مَا مَكَّنِّى فِيهِ رَبِّى خَيْرٌۭ فَأَعِينُونِى بِقُوَّةٍ أَجْعَلْ بَيْنَكُمْ وَبَيْنَهُمْ رَدْمًا ﴿95﴾ ءَاتُونِى زُبَرَ ٱلْحَدِيدِ ۖ حَتَّىٰٓ إِذَا سَاوَىٰ بَيْنَ ٱلصَّدَفَيْنِ قَالَ ٱنفُخُوا۟ ۖ حَتَّىٰٓ إِذَا جَعَلَهُۥ نَارًۭا قَالَ ءَاتُونِىٓ أُفْرِغْ عَلَيْهِ قِطْرًۭا ﴿96﴾", "ru": "(93) А когда достиг до места между двумя преградами, то нашел перед ними народ, который едва мог понимать речь. (94) Они сказали: \"О Зу-л-карнайн, ведь Йаджудж и Маджудж распространяют нечестие по земле; не установить ли нам для тебя подать, чтобы ты устроил между нами и ними плотину?\" (95) Он сказал: \"То, в чем укрепил меня мой Господь, лучше; помогите же мне силой, я устрою между вами и ними преграду. (96) Принесите мне кусков железа\". А когда он сравнял между двумя склонами, сказал: \"Раздувайте!\" А когда он превратил его в огонь, сказал: \"Принесите мне, я вылью на это расплавленный металл\".", "n": "Зу-л-Карнайн нашёл людей, «почти не понимающих слов», и построил стену из железных кусков, залив её «расплавленной медью», от Йаджуджа и Маджуджа (Гога и Магога); такой стены не найдено.", "c": null}]}, {"id": "contradictions", "title": "Противоречия и анахронизмы", "icon": "⚖", "intro": "Места, где аяты спорят друг с другом или не совпадают с известной историей. Сам Коран в 4:82 заявляет: «Если бы он был не от Аллаха, они нашли бы в нём много противоречий». Для разрешения противоречий исламская традиция использует доктрину насх (отмена).", "verses": [{"ref": "4:82", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "أَفَلَا يَتَدَبَّرُونَ ٱلْقُرْءَانَ ۚ وَلَوْ كَانَ مِنْ عِندِ غَيْرِ ٱللَّهِ لَوَجَدُوا۟ فِيهِ ٱخْتِلَٰفًۭا كَثِيرًۭا ﴿82﴾", "ru": "Разве же они не размыслят о Коране? Ведь если бы он был не от Аллаха, то они нашли бы там много противоречий.", "n": "Само-критерий: отсутствие противоречий называется доказательством божественности текста.", "c": null}, {"ref": "2:106", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "۞ مَا نَنسَخْ مِنْ ءَايَةٍ أَوْ نُنسِهَا نَأْتِ بِخَيْرٍۢ مِّنْهَآ أَوْ مِثْلِهَآ ۗ أَلَمْ تَعْلَمْ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ ﴿106﴾", "ru": "Всякий раз, когда мы отменяем стих или заставляем его забыть, мы приводим лучший, чем он, или похожий на него. Разве ты не знаешь, что Аллах над любой вещью мощен?", "n": "Доктрина насх (отмены): «какой аят Мы отменяем или заставляем забыть — Мы приводим лучший или подобный ему».", "c": "Именно с её помощью мягкие аяты (напр., 2:256) объявляют отменёнными «аятом меча»."}, {"ref": "16:101", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَإِذَا بَدَّلْنَآ ءَايَةًۭ مَّكَانَ ءَايَةٍۢ ۙ وَٱللَّهُ أَعْلَمُ بِمَا يُنَزِّلُ قَالُوٓا۟ إِنَّمَآ أَنتَ مُفْتَرٍۭ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ ﴿101﴾", "ru": "А когда Мы заменяем одно знамение другим, - ведь Аллах лучше знает, что Он ниспосылает, - они говорят: \"Ты - только измыслитель!\" Да, большинство их не знает!", "n": "«Когда Мы заменяем один аят другим... они говорят: ты лжёшь!»", "c": null}, {"ref": "2:256", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "لَآ إِكْرَاهَ فِى ٱلدِّينِ ۖ قَد تَّبَيَّنَ ٱلرُّشْدُ مِنَ ٱلْغَىِّ ۚ فَمَن يَكْفُرْ بِٱلطَّٰغُوتِ وَيُؤْمِنۢ بِٱللَّهِ فَقَدِ ٱسْتَمْسَكَ بِٱلْعُرْوَةِ ٱلْوُثْقَىٰ لَا ٱنفِصَامَ لَهَا ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ ﴿256﴾", "ru": "Нет принуждения в религии. Уже ясно отличился прямой путь от заблуждения. Кто не верует в идолопоклонство и верует в Аллаха, тот ухватился за надежную опору, для которой нет сокрушения. Поистине, Аллах - слышащий, знающий!", "n": "«Нет принуждения в религии».", "c": "Сравните с 9:5, 9:29, 8:39, 4:89."}, {"ref": "2:62", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَادُوا۟ وَٱلنَّصَٰرَىٰ وَٱلصَّٰبِـِٔينَ مَنْ ءَامَنَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ وَعَمِلَ صَٰلِحًۭا فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ ﴿62﴾", "ru": "Поистине, те, которые уверовали, и те, кто обратились в иудейство, и христиане, и сабии, которые уверовали в Аллаха и в последний день и творили благое, - им их награда у Господа их, нет над ними страха, и не будут они печальны.", "n": "Верующие, иудеи, христиане и сабии, если уверовали в Аллаха и последний день и творили благое, получат награду.", "c": "Сравните с 3:85: «кто ищет иной религии, кроме ислама, — не будет принято»."}, {"ref": "41:9-12", "sura": "Fussilat", "sura_ar": "سُورَةُ فُصِّلَتۡ", "type": "Meccan", "ar": "۞ قُلْ أَئِنَّكُمْ لَتَكْفُرُونَ بِٱلَّذِى خَلَقَ ٱلْأَرْضَ فِى يَوْمَيْنِ وَتَجْعَلُونَ لَهُۥٓ أَندَادًۭا ۚ ذَٰلِكَ رَبُّ ٱلْعَٰلَمِينَ ﴿9﴾ وَجَعَلَ فِيهَا رَوَٰسِىَ مِن فَوْقِهَا وَبَٰرَكَ فِيهَا وَقَدَّرَ فِيهَآ أَقْوَٰتَهَا فِىٓ أَرْبَعَةِ أَيَّامٍۢ سَوَآءًۭ لِّلسَّآئِلِينَ ﴿10﴾ ثُمَّ ٱسْتَوَىٰٓ إِلَى ٱلسَّمَآءِ وَهِىَ دُخَانٌۭ فَقَالَ لَهَا وَلِلْأَرْضِ ٱئْتِيَا طَوْعًا أَوْ كَرْهًۭا قَالَتَآ أَتَيْنَا طَآئِعِينَ ﴿11﴾ فَقَضَىٰهُنَّ سَبْعَ سَمَٰوَاتٍۢ فِى يَوْمَيْنِ وَأَوْحَىٰ فِى كُلِّ سَمَآءٍ أَمْرَهَا ۚ وَزَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَحِفْظًۭا ۚ ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ ﴿12﴾", "ru": "(9) Скажи: \"Разве вы не веруете в того, кто сотворил землю в два дня, и делаете Ему равных? Это - Господь миров! (10) И устроил Он на ней прочно стоящие сверху ее; и благословил ее и распределил на ней ее пропитание в четыре дня - равно для всех просящих. (11) Потом утвердился Он к небесам - а они были дымом - и сказал им и земле: \"Приходите добровольно или невольно!\" И сказали они: \"Мы приходим добровольно\". (12) И установил Он из них семь небес в два дня и внушил каждому небу его дело; и разукрасили Мы ближайшее небо светильниками и для охраны. Таково установление великого, мудрого\".", "n": "Творение: земля — за 2 дня, затем «в четыре дня» всё остальное на ней, затем семь небес — за 2 дня. Итого 2+4+2 = 8 дней, тогда как 7:54 и 25:59 говорят о шести.", "c": "Апологеты: «четыре дня» включают первые два (итого шесть)."}, {"ref": "7:54", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "إِنَّ رَبَّكُمُ ٱللَّهُ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ فِى سِتَّةِ أَيَّامٍۢ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ يُغْشِى ٱلَّيْلَ ٱلنَّهَارَ يَطْلُبُهُۥ حَثِيثًۭا وَٱلشَّمْسَ وَٱلْقَمَرَ وَٱلنُّجُومَ مُسَخَّرَٰتٍۭ بِأَمْرِهِۦٓ ۗ أَلَا لَهُ ٱلْخَلْقُ وَٱلْأَمْرُ ۗ تَبَارَكَ ٱللَّهُ رَبُّ ٱلْعَٰلَمِينَ ﴿54﴾", "ru": "Поистине, Господь ваш - Аллах, который создал небеса и землю в шесть дней, а потом утвердился на троне. Он закрывает ночью день, который непрестанно за ней движется... И солнце, и луну, и звезды, по
