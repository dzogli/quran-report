 постигло их наказание мучительное!"}, {"ref": "49:2", "sura": "Al-Hujuraat", "sura_ar": "سُورَةُ الحُجُرَاتِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَرْفَعُوٓا۟ أَصْوَٰتَكُمْ فَوْقَ صَوْتِ ٱلنَّبِىِّ وَلَا تَجْهَرُوا۟ لَهُۥ بِٱلْقَوْلِ كَجَهْرِ بَعْضِكُمْ لِبَعْضٍ أَن تَحْبَطَ أَعْمَٰلُكُمْ وَأَنتُمْ لَا تَشْعُرُونَ ﴿2﴾", "ru": "О вы, которые уверовали! Не поднимайте своих голосов выше голоса пророка и не обращайтесь к нему громко с речью, как обращаетесь друг к другу, чтобы не оказались тщетными ваши дела, а вы и не знаете."}, {"ref": "58:12", "sura": "Al-Mujaadila", "sura_ar": "سُورَةُ المُجَادلَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا نَٰجَيْتُمُ ٱلرَّسُولَ فَقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَةًۭ ۚ ذَٰلِكَ خَيْرٌۭ لَّكُمْ وَأَطْهَرُ ۚ فَإِن لَّمْ تَجِدُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌ ﴿12﴾", "ru": "О вы, которые уверовали! Когда беседуете втайне с посланником, то выдвиньте перед вашей беседой милостыню. Это лучше для вас и чище. А если не найдете... то Аллах - прощающий, милосердный!"}], "n": "Что сказано: «Кто повинуется посланнику, тот повинуется Аллаху» (4:80); у верующего нет выбора, когда Бог и посланник решили дело (33:36); ⟦не веруют, пока не сделают тебя судьёй в своих спорах⟧ (4:65); ⟦Аллах и Его ангелы благословляют Пророка — благословляйте его⟧ (33:56); не обращайтесь к нему так, как друг к другу (24:63); не повышайте голос над его голосом, ⟦иначе ваши деяния пропадут⟧ (49:2); перед тайной беседой с ним — милостыня (58:12).\nВ чём проблема: послушание человеку приравнено к послушанию Богу, а неуважение к нему наказуемо потерей всех заслуг. Это спорит с самоописанием Пророка: ⟦Я только человек, посланник⟧ (17:93; 18:110).\nКак отвечают верующие: послушание посланнику — часть послушания Богу.", "c": null, "x": ["17:93", "18:110", "58:13"], "t": "Авторитет Пророка поставлен рядом с Божьим", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Послушание Пророку равно послушанию Богу, а 17:93 говорит: «только человек»."}, {"refs": ["7:188", "6:50", "46:9", "72:25-27", "3:44"], "parts": [{"ref": "7:188", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "قُل لَّآ أَمْلِكُ لِنَفْسِى نَفْعًۭا وَلَا ضَرًّا إِلَّا مَا شَآءَ ٱللَّهُ ۚ وَلَوْ كُنتُ أَعْلَمُ ٱلْغَيْبَ لَٱسْتَكْثَرْتُ مِنَ ٱلْخَيْرِ وَمَا مَسَّنِىَ ٱلسُّوٓءُ ۚ إِنْ أَنَا۠ إِلَّا نَذِيرٌۭ وَبَشِيرٌۭ لِّقَوْمٍۢ يُؤْمِنُونَ ﴿188﴾", "ru": "Скажи: \"Я не владею для самого себя ни пользой, ни вредом, если того не пожелает Аллах. Если бы я знал скрытое, я умножил бы себе всякое добро, и меня коснулось бы зло. Ведь я - только увещатель и вестник для народа, который верует\"."}, {"ref": "6:50", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "قُل لَّآ أَقُولُ لَكُمْ عِندِى خَزَآئِنُ ٱللَّهِ وَلَآ أَعْلَمُ ٱلْغَيْبَ وَلَآ أَقُولُ لَكُمْ إِنِّى مَلَكٌ ۖ إِنْ أَتَّبِعُ إِلَّا مَا يُوحَىٰٓ إِلَىَّ ۚ قُلْ هَلْ يَسْتَوِى ٱلْأَعْمَىٰ وَٱلْبَصِيرُ ۚ أَفَلَا تَتَفَكَّرُونَ ﴿50﴾", "ru": "Скажи: \"Я не говорю вам, что у меня сокровищницы Аллаха, и не знаю сокровенного, и не говорю вам, что я - ангел. Я следую только тому, что открывается мне\". Скажи: \"Разве сравнятся слепой и зрячий? Разве вы не одумаетесь?\""}, {"ref": "46:9", "sura": "Al-Ahqaf", "sura_ar": "سُورَةُ الأَحۡقَافِ", "type": "Meccan", "ar": "قُلْ مَا كُنتُ بِدْعًۭا مِّنَ ٱلرُّسُلِ وَمَآ أَدْرِى مَا يُفْعَلُ بِى وَلَا بِكُمْ ۖ إِنْ أَتَّبِعُ إِلَّا مَا يُوحَىٰٓ إِلَىَّ وَمَآ أَنَا۠ إِلَّا نَذِيرٌۭ مُّبِينٌۭ ﴿9﴾", "ru": "Скажи: \"Я - не новинка среди посланников, и не знаю я, что будет сделано со мной и с вами. Я лишь следую за тем, что мне внушено; я - только явный увещеватель\"."}, {"ref": "72:25-27", "sura": "Al-Jinn", "sura_ar": "سُورَةُ الجِنِّ", "type": "Meccan", "ar": "قُلْ إِنْ أَدْرِىٓ أَقَرِيبٌۭ مَّا تُوعَدُونَ أَمْ يَجْعَلُ لَهُۥ رَبِّىٓ أَمَدًا ﴿25﴾ عَٰلِمُ ٱلْغَيْبِ فَلَا يُظْهِرُ عَلَىٰ غَيْبِهِۦٓ أَحَدًا ﴿26﴾ إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا ﴿27﴾", "ru": "(25) Скажи: \"Я не знаю, близко ли то, что вам обещано, или Аллах установил для этого предел - (26) ведающий сокровенное; и не даст Он узнать сокровенное у Него никому, (27) кроме тех, к кому Он соблаговолил как к посланнику, и тогда Он ведет пред ним и позади его наблюдателя,"}, {"ref": "3:44", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "ذَٰلِكَ مِنْ أَنۢبَآءِ ٱلْغَيْبِ نُوحِيهِ إِلَيْكَ ۚ وَمَا كُنتَ لَدَيْهِمْ إِذْ يُلْقُونَ أَقْلَٰمَهُمْ أَيُّهُمْ يَكْفُلُ مَرْيَمَ وَمَا كُنتَ لَدَيْهِمْ إِذْ يَخْتَصِمُونَ ﴿44﴾", "ru": "Это - из рассказов о сокровенном, который Мы тебе открываем. Ты не был при них, когда они бросали свои письменные трости: который из них будет заботиться о Марйам. И ты не был при них в то время, как они препирались."}], "n": "Что сказано: «Если бы я знал скрытое, я умножил бы себе всякое добро, и меня коснулось бы зло» (7:188). «Я не говорю вам, что у меня сокровищницы Аллаха, и не знаю сокровенного, и не говорю вам, что я — ангел» (6:50). «Не знаю я, что будет сделано со мной и с вами» (46:9). «Я не знаю, близко ли то, что вам обещано» (72:25). И рядом: Бог «не даст Он узнать сокровенное у Него никому, кроме тех, к кому Он соблаговолил как к посланнику» (72:26-27).\nВ чём проблема: в тексте Пророк прямо отрицает знание сокровенного и своё всезнание. Это важно для честной картины: Коран не приписывает ему сверхзнания. Но (1) в 72:26-27 сделана оговорка для посланников, а в 3:44 Коран говорит Пророку «это — из рассказов о сокровенном, который Мы тебе открываем» — то есть в какой-то мере он знает сокровенное через откровение; (2) в 46:9 он ⟦не знает, что будет сделано⟧ с ним, а в 48:2 уже сказано, что ему прощены грехи прошлые и будущие. Критики видят тут напряжение; но оно объяснимо хронологией и различием ⟦своего знания⟧ и ⟦открытого⟧. Он полезен главным образом тем, что в тексте нет утверждений о ⟦всезнающем⟧ Пророке (в отличие от некоторых позднейших представлений).\nКак отвечают верующие: знание Пророка — только то, что открыто ему Богом; самостоятельного знания он не имеет. 72:26-27 и 3:44 это закрепляют.", "c": null, "x": ["48:2", "3:179", "27:65"], "t": "Знает ли Пророк сокровенное? Сам текст: «не знаю»", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Пророк сам заявляет, что не знает сокровенного (7:188, 6:50), но 72:26-27 делает оговорку для посланников."}], "summary": ["Сильное: 8:1 против 8:41 (вся добыча или пятая часть).", "Остальное — откровения, касающиеся быта Пророка; довод о «совпадении выгоды» — допущение."]}, {"id": "origin", "title": "Происхождение Корана и самообоснование", "icon": "❝", "group": "Пророк, Коран и текст", "intro": "Сам Коран упоминает возражения современников — что Мухаммад сочинил его, что ему помогали другие люди, что это «сказки первых» — и отвечает вызовом «принесите подобное», угрозой убить пророка за выдумку и утверждением о собственной ясности. Критики видят здесь замкнутый круг доказательства.", "verses": [{"refs": ["2:23-24", "10:37-38", "11:13", "17:88", "52:33-34"], "parts": [{"ref": "2:23-24", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِن كُنتُمْ فِى رَيْبٍۢ مِّمَّا نَزَّلْنَا عَلَىٰ عَبْدِنَا فَأْتُوا۟ بِسُورَةٍۢ مِّن مِّثْلِهِۦ وَٱدْعُوا۟ شُهَدَآءَكُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَٰدِقِينَ ﴿23﴾ فَإِن لَّمْ تَفْعَلُوا۟ وَلَن تَفْعَلُوا۟ فَٱتَّقُوا۟ ٱلنَّارَ ٱلَّتِى وَقُودُهَا ٱلنَّاسُ وَٱلْحِجَارَةُ ۖ أُعِدَّتْ لِلْكَٰفِرِينَ ﴿24﴾", "ru": "(23) А если вы в сомнении относительно того, что Мы ниспослали Нашему рабу, то принесите суру, подобную этому, и призовите ваших свидетелей, помимо Аллаха, если вы правдивы. (24) Если же вы этого не сделаете, - а вы никогда этого не сделаете! - то побойтесь огня, топливом для которого люди и камни, уготованного неверным."}, {"ref": "10:37-38", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "وَمَا كَانَ هَٰذَا ٱلْقُرْءَانُ أَن يُفْتَرَىٰ مِن دُونِ ٱللَّهِ وَلَٰكِن تَصْدِيقَ ٱلَّذِى بَيْنَ يَدَيْهِ وَتَفْصِيلَ ٱلْكِتَٰبِ لَا رَيْبَ فِيهِ مِن رَّبِّ ٱلْعَٰلَمِينَ ﴿37﴾ أَمْ يَقُولُونَ ٱفْتَرَىٰهُ ۖ قُلْ فَأْتُوا۟ بِسُورَةٍۢ مِّثْلِهِۦ وَٱدْعُوا۟ مَنِ ٱسْتَطَعْتُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَٰدِقِينَ ﴿38﴾", "ru": "(37) И не мог этот Коран быть измышленным помимо Аллаха, а только - в подтверждение истинности того, что было ниспослано до него, и в изъяснение писания, - в нем нет сомнения! - от Господа миров. (38) Может быть, они скажут: \"Измыслил он его\". Скажи: \"Приведите же суру, подобную ему, и призывайте, кого вы можете, помимо Аллаха, если вы правдивы!\""}, {"ref": "11:13", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "أَمْ يَقُولُونَ ٱفْتَرَىٰهُ ۖ قُلْ فَأْتُوا۟ بِعَشْرِ سُوَرٍۢ مِّثْلِهِۦ مُفْتَرَيَٰتٍۢ وَٱدْعُوا۟ مَنِ ٱسْتَطَعْتُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَٰدِقِينَ ﴿13﴾", "ru": "Может быть, они скажут: \"Измыслил он его\". Скажи: \"Приведите же десять сур, подобных ему, измышленных, и призовите, кого вы можете, кроме Аллаха, если вы говорите правду!"}, {"ref": "17:88", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "قُل لَّئِنِ ٱجْتَمَعَتِ ٱلْإِنسُ وَٱلْجِنُّ عَلَىٰٓ أَن يَأْتُوا۟ بِمِثْلِ هَٰذَا ٱلْقُرْءَانِ لَا يَأْتُونَ بِمِثْلِهِۦ وَلَوْ كَانَ بَعْضُهُمْ لِبَعْضٍۢ ظَهِيرًۭا ﴿88﴾", "ru": "Скажи: \"Если бы собрались люди и джинны, чтобы сделать подобное этому Корану, они бы не создали подобного, хотя бы одни из них были другим помощниками\"."}, {"ref": "52:33-34", "sura": "At-Tur", "sura_ar": "سُورَةُ الطُّورِ", "type": "Meccan", "ar": "أَمْ يَقُولُونَ تَقَوَّلَهُۥ ۚ بَل لَّا يُؤْمِنُونَ ﴿33﴾ فَلْيَأْتُوا۟ بِحَدِيثٍۢ مِّثْلِهِۦٓ إِن كَانُوا۟ صَٰدِقِينَ ﴿34﴾", "ru": "(33) Или они скажут: \"Измыслил Его он!\" Нет, они не веруют! (34) Пусть же они приведут подобный этому рассказ, если они говорят правду!"}], "n": "Что сказано: ⟦Если вы в сомнении относительно того, что Мы ниспослали Нашему рабу, то принесите суру, подобную этому… А если не сделаете — бойтесь огня⟧ (2:23-24); ⟦приведите десять сур, подобных ему⟧ (11:13); «если бы собрались люди и джинны, чтобы сделать подобное этому Корану, они бы не создали подобного» (17:88).\nВ чём проблема: (1) ⟦Неподражаемость⟧ подана как доказательство божественного происхождения, но нет критерия, как её измерить: стиль — вопрос вкуса. (2) Доказательство построено на самом тексте (круг). (3) За сомнение — угроза огнём (2:24). (4) Вызов меняется: одна сура (2:23; 10:38), десять сур (11:13), весь Коран (17:88).\nКак отвечают верующие: никто не смог ответить на вызов.", "c": null, "x": ["10:38"], "t": "Вызов: «принесите подобное»", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Вызов «принесите подобное» ссылается на сам текст: доказательство круговое."}, {"refs": ["16:103", "25:4-5", "8:31", "29:48", "11:49"], "parts": [{"ref": "16:103", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَلَقَدْ نَعْلَمُ أَنَّهُمْ يَقُولُونَ إِنَّمَا يُعَلِّمُهُۥ بَشَرٌۭ ۗ لِّسَانُ ٱلَّذِى يُلْحِدُونَ إِلَيْهِ أَعْجَمِىٌّۭ وَهَٰذَا لِسَانٌ عَرَبِىٌّۭ مُّبِينٌ ﴿103﴾", "ru": "Мы знаем, что они говорят: \"Ведь его учит только человек\". Язык того, на которого они указывают, иноземный, а это - язык арабский, ясный."}, {"ref": "25:4-5", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "وَقَالَ ٱلَّذِينَ كَفَرُوٓا۟ إِنْ هَٰذَآ إِلَّآ إِفْكٌ ٱفْتَرَىٰهُ وَأَعَانَهُۥ عَلَيْهِ قَوْمٌ ءَاخَرُونَ ۖ فَقَدْ جَآءُو ظُلْمًۭا وَزُورًۭا ﴿4﴾ وَقَالُوٓا۟ أَسَٰطِيرُ ٱلْأَوَّلِينَ ٱكْتَتَبَهَا فَهِىَ تُمْلَىٰ عَلَيْهِ بُكْرَةًۭ وَأَصِيلًۭا ﴿5﴾", "ru": "(4) И сказали те, которые не веруют: \"Это - только ложь, которую он измыслил, а помогли ему в этом другие люди\". Они совершили несправедливость и искажение! (5) И сказали они: \"Сказки первых! Он приказал записать их для себя, и читаются они ему утром и вечером\"."}, {"ref": "8:31", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَإِذَا تُتْلَىٰ عَلَيْهِمْ ءَايَٰتُنَا قَالُوا۟ قَدْ سَمِعْنَا لَوْ نَشَآءُ لَقُلْنَا مِثْلَ هَٰذَآ ۙ إِنْ هَٰذَآ إِلَّآ أَسَٰطِيرُ ٱلْأَوَّلِينَ ﴿31﴾", "ru": "И когда читаются им Наши знамения, они говорят: \" Мы уже слышали. Если бы мы желали, мы сказали бы то же самое. Это - только истории первых!\""}, {"ref": "29:48", "sura": "Al-Ankaboot", "sura_ar": "سُورَةُ العَنكَبُوتِ", "type": "Meccan", "ar": "وَمَا كُنتَ تَتْلُوا۟ مِن قَبْلِهِۦ مِن كِتَٰبٍۢ وَلَا تَخُطُّهُۥ بِيَمِينِكَ ۖ إِذًۭا لَّٱرْتَابَ ٱلْمُبْطِلُونَ ﴿48﴾", "ru": "Ты не читал до него никакого писания и не чертил его своей десницей; иначе пришли бы в сомнение считающие это пустым."}, {"ref": "11:49", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "تِلْكَ مِنْ أَنۢبَآءِ ٱلْغَيْبِ نُوحِيهَآ إِلَيْكَ ۖ مَا كُنتَ تَعْلَمُهَآ أَنتَ وَلَا قَوْمُكَ مِن قَبْلِ هَٰذَا ۖ فَٱصْبِرْ ۖ إِنَّ ٱلْعَٰقِبَةَ لِلْمُتَّقِينَ ﴿49﴾", "ru": "Это - из рассказов про сокровенное. Мы открываем их тебе; не знал их ты и твой народ до этого. Терпи же! Поистине, конец - богобоязненным!"}], "n": "Что сказано: Современники говорят: ⟦Его учит человек⟧. Ответ: ⟦Язык того, на которого указывают, иноземный, а это — язык арабский, ясный⟧ (16:103); ⟦Это — ложь, которую он измыслил, а помогли ему в этом другие люди… сказки первых, которые он списал: они диктуются ему утром и вечером⟧ (25:4-5); ⟦Мы слышали; если бы мы желали, мы сказали бы то же. Это — только истории первых⟧ (8:31). Ответ Корана: «Ты не читал до него никакого писания и не чертил его своей десницей» (29:48); «Это — из рассказов про сокровенное… не знал их ты и твой народ до этого» (11:49).\nВ чём проблема: Коран сам фиксирует главное возражение — заимствование. Ответ в 16:103 касается только языка: иноязычный учитель мог рассказывать, а Мухаммад — пересказывать по-арабски. Довод о неграмотности (29:48) нельзя проверить по тексту. Критики отмечают, что многие истории Корана (Ной, Авраам, Моисей, Иисус) имеют параллели в Библии и апокрифах.", "c": null, "x": ["25:5"], "t": "Обвинения современников и ответ Корана", "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Ответ касается только языка. Довод о неграмотности непроверяем по тексту."}, {"n": "Что сказано: «Это — слова посланника благородного… А если бы он изрёк на Нас какие-нибудь речения, Мы взяли бы его за правую руку, а потом рассекли бы у него сердечную артерию».\nВ чём проблема: угроза убить пророка, если он солжёт, подана как доказательство его честности. Но критерий непроверяем: то, что он не был убит, объявлено подтверждением. Это круговая логика (текст подтверждает сам себя).", "c": null, "x": ["10:37-38"], "refs": ["69:40-47"], "parts": [{"ref": "69:40-47", "sura": "Al-Haaqqa", "sura_ar": "سُورَةُ الحَاقَّةِ", "type": "Meccan", "ar": "إِنَّهُۥ لَقَوْلُ رَسُولٍۢ كَرِيمٍۢ ﴿40﴾ وَمَا هُوَ بِقَوْلِ شَاعِرٍۢ ۚ قَلِيلًۭا مَّا تُؤْمِنُونَ ﴿41﴾ وَلَا بِقَوْلِ كَاهِنٍۢ ۚ قَلِيلًۭا مَّا تَذَكَّرُونَ ﴿42﴾ تَنزِيلٌۭ مِّن رَّبِّ ٱلْعَٰلَمِينَ ﴿43﴾ وَلَوْ تَقَوَّلَ عَلَيْنَا بَعْضَ ٱلْأَقَاوِيلِ ﴿44﴾ لَأَخَذْنَا مِنْهُ بِٱلْيَمِينِ ﴿45﴾ ثُمَّ لَقَطَعْنَا مِنْهُ ٱلْوَتِينَ ﴿46﴾ فَمَا مِنكُم مِّنْ أَحَدٍ عَنْهُ حَٰجِزِينَ ﴿47﴾", "ru": "(40) Поистине, это - слова посланника благородного! (41) Это не слова поэта. Мало вы веруете! (42) И не слова прорицателя. Мало вы припоминаете! (43) Ниспослание от Господа миров. (44) А если бы он изрек на Нас какие-нибудь речения, (45) Мы взяли бы его за правую руку, (46) а потом рассекли бы у него сердечную артерию, (47) и не нашлось бы среди вас ни одного, кто бы удержал от него."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Критерий «убили бы» непроверяем. Доказательство круговое."}, {"refs": ["3:7", "12:1-2", "54:17", "16:89", "6:38"], "parts": [{"ref": "3:7", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "هُوَ ٱلَّذِىٓ أَنزَلَ عَلَيْكَ ٱلْكِتَٰبَ مِنْهُ ءَايَٰتٌۭ مُّحْكَمَٰتٌ هُنَّ أُمُّ ٱلْكِتَٰبِ وَأُخَرُ مُتَشَٰبِهَٰتٌۭ ۖ فَأَمَّا ٱلَّذِينَ فِى قُلُوبِهِمْ زَيْغٌۭ فَيَتَّبِعُونَ مَا تَشَٰبَهَ مِنْهُ ٱبْتِغَآءَ ٱلْفِتْنَةِ وَٱبْتِغَآءَ تَأْوِيلِهِۦ ۗ وَمَا يَعْلَمُ تَأْوِيلَهُۥٓ إِلَّا ٱللَّهُ ۗ وَٱلرَّٰسِخُونَ فِى ٱلْعِلْمِ يَقُولُونَ ءَامَنَّا بِهِۦ كُلٌّۭ مِّنْ عِندِ رَبِّنَا ۗ وَمَا يَذَّكَّرُ إِلَّآ أُو۟لُوا۟ ٱلْأَلْبَٰبِ ﴿7﴾", "ru": "Он - тот, кто ниспослал тебе писание; в нем есть стихи, расположенные в порядке, которые - мать книги; и другие - сходные по смыслу. Те же, в сердцах которых уклонение, - они следуют за тем, что в нем сходно, домогаясь смятения и домогаясь толкования этого. Не знает его толкования никто, кроме Аллаха. И твердые в знаниях говорят: \"Мы уверовали в него; все - от нашего Господа\". Вспоминают только обладатели разума!"}, {"ref": "12:1-2", "sura": "Yusuf", "sura_ar": "سُورَةُ يُوسُفَ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓر ۚ تِلْكَ ءَايَٰتُ ٱلْكِتَٰبِ ٱلْمُبِينِ ﴿1﴾ إِنَّآ أَنزَلْنَٰهُ قُرْءَٰنًا عَرَبِيًّۭا لَّعَلَّكُمْ تَعْقِلُونَ ﴿2﴾", "ru": "(1) Алиф лам ра. Это - знамения книги ясной. (2) Мы ниспослали ее в виде арабского Корана, - может быть, вы уразумеете!"}, {"ref": "54:17", "sura": "Al-Qamar", "sura_ar": "سُورَةُ القَمَرِ", "type": "Meccan", "ar": "وَلَقَدْ يَسَّرْنَا ٱلْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍۢ ﴿17﴾", "ru": "И Мы облегчили Коран для поминания, но найдется ли хоть один припоминающий!"}, {"ref": "16:89", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَيَوْمَ نَبْعَثُ فِى كُلِّ أُمَّةٍۢ شَهِيدًا عَلَيْهِم مِّنْ أَنفُسِهِمْ ۖ وَجِئْنَا بِكَ شَهِيدًا عَلَىٰ هَٰٓؤُلَآءِ ۚ وَنَزَّلْنَا عَلَيْكَ ٱلْكِتَٰبَ تِبْيَٰنًۭا لِّكُلِّ شَىْءٍۢ وَهُدًۭى وَرَحْمَةًۭ وَبُشْرَىٰ لِلْمُسْلِمِينَ ﴿89﴾", "ru": "В тот день, когда Мы пошлем в каждом народе свидетеля против них и приведем тебя как свидетеля против этих. И ниспослали Мы тебе книгу для разъяснения всего и как прямой путь, милосердие и весть радости для мусульман."}, {"ref": "6:38", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ وَلَا طَٰٓئِرٍۢ يَطِيرُ بِجَنَاحَيْهِ إِلَّآ أُمَمٌ أَمْثَالُكُم ۚ مَّا فَرَّطْنَا فِى ٱلْكِتَٰبِ مِن شَىْءٍۢ ۚ ثُمَّ إِلَىٰ رَبِّهِمْ يُحْشَرُونَ ﴿38﴾", "ru": "Нет животного на земле и птицы, летающей на крыльях, которые не были бы общинами, подобными вам. Мы не упустили в книге ничего, потом к вашему Господу они будут собраны."}], "n": "Что сказано: ⟦В нём есть стихи, расположенные в порядке, которые — мать книги; и другие — сходные по смыслу. Те, в чьих сердцах уклонение, следуют за сходным… а толкование их знает только Аллах⟧ (3:7). Но: «знамения книги ясной» (12:1-2); «Мы облегчили Коран для поминания» (54:17); ⟦ниспослали тебе книгу для разъяснения всякой вещи⟧ (16:89); «Мы не упустили в книге ничего» (6:38).\nВ чём проблема: Коран называет себя ясным и полным, но в 3:7 признаёт, что часть его ⟦сходна по смыслу⟧ и её толкование знает только Бог. Тогда ⟦разъяснение всякой вещи⟧ невозможно проверить; а утверждение ⟦всё в книге⟧ противоречит необходимости внешних источников для норм (молитвы, закята).", "c": null, "x": ["2:106"], "t": "Ясен ли Коран?", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Коран называет себя ясным и полным, но признаёт неясные места, толкование которых знает лишь Бог. Это противоречие в самоописании (4:82); верующие говорят о разных частях текста."}, {"refs": ["15:9", "87:6-7", "17:86", "13:39"], "parts": [{"ref": "15:9", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "إِنَّا نَحْنُ نَزَّلْنَا ٱلذِّكْرَ وَإِنَّا لَهُۥ لَحَٰفِظُونَ ﴿9﴾", "ru": "Ведь Мы - Мы ниспослали напоминание, и ведь Мы его охраняем."}, {"ref": "87:6-7", "sura": "Al-A'laa", "sura_ar": "سُورَةُ الأَعۡلَىٰ", "type": "Meccan", "ar": "سَنُقْرِئُكَ فَلَا تَنسَىٰٓ ﴿6﴾ إِلَّا مَا شَآءَ ٱللَّهُ ۚ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ ﴿7﴾", "ru": "(6) Мы дадим прочесть тебе, и ты не забудешь, (7) если не пожелает чего-нибудь Аллах, - ведь, поистине, Он знает явное и то, что скрыто!"}, {"ref": "17:86", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "وَلَئِن شِئْنَا لَنَذْهَبَنَّ بِٱلَّذِىٓ أَوْحَيْنَآ إِلَيْكَ ثُمَّ لَا تَجِدُ لَكَ بِهِۦ عَلَيْنَا وَكِيلًا ﴿86﴾", "ru": "Если бы Мы пожелали, Мы, конечно, унесли бы то, что открыли тебе, а потом ты бы не нашел для себя в этом против Нас покровителя,"}, {"ref": "13:39", "sura": "Ar-Ra'd", "sura_ar": "سُورَةُ الرَّعۡدِ", "type": "Medinan", "ar": "يَمْحُوا۟ ٱللَّهُ مَا يَشَآءُ وَيُثْبِتُ ۖ وَعِندَهُۥٓ أُمُّ ٱلْكِتَٰبِ ﴿39﴾", "ru": "Стирает Аллах, что желает, и утверждает; у Него - мать книги."}], "n": "Что сказано: ⟦Мы ниспослали напоминание, и Мы его охраняем⟧ (15:9); но: «Мы дадим прочесть тебе, и ты не забудешь, если не пожелает чего-нибудь Аллах» (87:6-7); ⟦если бы Мы пожелали, Мы унесли бы то, что открыли тебе⟧ (17:86); ⟦Аллах стирает, что желает, и утверждает⟧ (13:39).\nВ чём проблема: обещана охрана текста, но тут же сказано, что Бог может заставить Пророка забыть часть, стереть или унести. 2:106 и 16:101 добавляют ⟦замену⟧ аятов. Это значит, что известная нам редакция может не содержать всего, что было открыто. Спорно, что именно охраняется.", "c": null, "x": ["2:106", "16:101"], "t": "Сохранён ли Коран?", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Обещана охрана текста (15:9), но допущено, что Бог заставит забыть или стереть часть откровения (13:39, 2:106). Критики видят расхождение; верующие говорят о разных целях."}, {"refs": ["2:1", "3:1", "7:1", "10:1", "11:1", "12:1", "13:1", "14:1", "15:1", "19:1", "20:1", "36:1", "38:1", "40:1", "42:1-2", "50:1", "68:1"], "parts": [{"ref": "2:1", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓمٓ ﴿1﴾", "ru": "Алм."}, {"ref": "3:1", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓمٓ ﴿1﴾", "ru": "Алм."}, {"ref": "7:1", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓمٓصٓ ﴿1﴾", "ru": "Алиф лам мим сад."}, {"ref": "10:1", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓر ۚ تِلْكَ ءَايَٰتُ ٱلْكِتَٰبِ ٱلْحَكِيمِ ﴿1﴾", "ru": "Алиф лам ра. Это - знамения книги мудрой."}, {"ref": "11:1", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓر ۚ كِتَٰبٌ أُحْكِمَتْ ءَايَٰتُهُۥ ثُمَّ فُصِّلَتْ مِن لَّدُنْ حَكِيمٍ خَبِيرٍ ﴿1﴾", "ru": "Алиф лам ра. Писание, знамения которого утверждены, потом ясно изложены от мудрого, ведающего,"}, {"ref": "12:1", "sura": "Yusuf", "sura_ar": "سُورَةُ يُوسُفَ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓر ۚ تِلْكَ ءَايَٰتُ ٱلْكِتَٰبِ ٱلْمُبِينِ ﴿1﴾", "ru": "Алиф лам ра. Это - знамения книги ясной."}, {"ref": "13:1", "sura": "Ar-Ra'd", "sura_ar": "سُورَةُ الرَّعۡدِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓمٓر ۚ تِلْكَ ءَايَٰتُ ٱلْكِتَٰبِ ۗ وَٱلَّذِىٓ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ ٱلْحَقُّ وَلَٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يُؤْمِنُونَ ﴿1﴾", "ru": "Алиф лам мим ра. Это - знамения книги. Ведь то, что ниспослано тебе от твоего Господа, - истина, но большая часть людей не верит."}, {"ref": "14:1", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓر ۚ كِتَٰبٌ أَنزَلْنَٰهُ إِلَيْكَ لِتُخْرِجَ ٱلنَّاسَ مِنَ ٱلظُّلُمَٰتِ إِلَى ٱلنُّورِ بِإِذْنِ رَبِّهِمْ إِلَىٰ صِرَٰطِ ٱلْعَزِيزِ ٱلْحَمِيدِ ﴿1﴾", "ru": "Алиф лам ра. Писание - ниспослали Мы его тебе, чтобы ты вывел людей из мрака к свету с соизволения их Господа на путь великого, достохвального -"}, {"ref": "15:1", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓر ۚ تِلْكَ ءَايَٰتُ ٱلْكِتَٰبِ وَقُرْءَانٍۢ مُّبِينٍۢ ﴿1﴾", "ru": "Алиф лам ра. Это - знамения книги и ясного Корана."}, {"ref": "19:1", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ كٓهيعٓصٓ ﴿1﴾", "ru": "Каф ха йа айн сад"}, {"ref": "20:1", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ طه ﴿1﴾", "ru": "Та ха."}, {"ref": "36:1", "sura": "Yaseen", "sura_ar": "سُورَةُ يسٓ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يسٓ ﴿1﴾", "ru": "Йа син."}, {"ref": "38:1", "sura": "Saad", "sura_ar": "سُورَةُ صٓ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ صٓ ۚ وَٱلْقُرْءَانِ ذِى ٱلذِّكْرِ ﴿1﴾", "ru": "Сад. Клянусь Кораном, содержащим напоминание!"}, {"ref": "40:1", "sura": "Ghafir", "sura_ar": "سُورَةُ غَافِرٍ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ حمٓ ﴿1﴾", "ru": "Ха мим."}, {"ref": "42:1-2", "sura": "Ash-Shura", "sura_ar": "سُورَةُ الشُّورَىٰ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ حمٓ ﴿1﴾ عٓسٓقٓ ﴿2﴾", "ru": "(1) Ха мим. (2) Айн син каф."}, {"ref": "50:1", "sura": "Qaaf", "sura_ar": "سُورَةُ قٓ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قٓ ۚ وَٱلْقُرْءَانِ ٱلْمَجِيدِ ﴿1﴾", "ru": "Каф. Клянусь Кораном славным!"}, {"ref": "68:1", "sura": "Al-Qalam", "sura_ar": "سُورَةُ القَلَمِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ نٓ ۚ وَٱلْقَلَمِ وَمَا يَسْطُرُونَ ﴿1﴾", "ru": "Нун. Клянусь письменной тростью и тем, что пишут!"}], "n": "Что сказано: 29 сур начинаются с букв, не образующих слов: «Алиф. Лам. Мим» (2:1; 3:1; 29:1…), «Алиф. Лам. Ра» (10:1; 11:1; 12:1; 14:1; 15:1), «Ха. Мим» (40:1; 41:1; 42:1; 43:1…), «Каф. Ха. Йа. Айн. Сад» (19:1), «Та. Ха» (20:1), «Йа. Син» (36:1), «Сад» (38:1), «Айн. Син. Каф» (42:2), «Каф» (50:1), «Нун» (68:1).\nВ чём проблема: смысл этих букв в самом тексте не раскрыт. Мусульманские учёные предлагают много объяснений (названия сур, части имён Бога, начала слов, обозначения переписчиков и др.), единого объяснения нет. Но в 12:1 («Алиф. Лам. Ра. Это знамения книги ясной») Коран называет себя ⟦ясным⟧ сразу после неясных букв. Критики: книга, заявляющая о ясности, начинается с непонятного.", "c": null, "x": ["3:7"], "t": "Таинственные буквы в начале сур", "at": "зависит от перевода или толкования", "pw": "слабый", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. Смысл таинственных букв не раскрыт."}, {"refs": ["17:59", "29:50-51", "6:37", "17:90-93", "10:20"], "parts": [{"ref": "17:59", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "وَمَا مَنَعَنَآ أَن نُّرْسِلَ بِٱلْءَايَٰتِ إِلَّآ أَن كَذَّبَ بِهَا ٱلْأَوَّلُونَ ۚ وَءَاتَيْنَا ثَمُودَ ٱلنَّاقَةَ مُبْصِرَةًۭ فَظَلَمُوا۟ بِهَا ۚ وَمَا نُرْسِلُ بِٱلْءَايَٰتِ إِلَّا تَخْوِيفًۭا ﴿59﴾", "ru": "Нас удержало от того, чтобы отправить со знамениями, только то, что они сочли ложью первые. Мы вывели к самудянам верблюдицу, чтобы она дала (им) увидеть, а они поступили несправедливо с ней. Поистине, Мы посылаем с Нашими знамениями только для устрашения!"}, {"ref": "29:50-51", "sura": "Al-Ankaboot", "sura_ar": "سُورَةُ العَنكَبُوتِ", "type": "Meccan", "ar": "وَقَالُوا۟ لَوْلَآ أُنزِلَ عَلَيْهِ ءَايَٰتٌۭ مِّن رَّبِّهِۦ ۖ قُلْ إِنَّمَا ٱلْءَايَٰتُ عِندَ ٱللَّهِ وَإِنَّمَآ أَنَا۠ نَذِيرٌۭ مُّبِينٌ ﴿50﴾ أَوَلَمْ يَكْفِهِمْ أَنَّآ أَنزَلْنَا عَلَيْكَ ٱلْكِتَٰبَ يُتْلَىٰ عَلَيْهِمْ ۚ إِنَّ فِى ذَٰلِكَ لَرَحْمَةًۭ وَذِكْرَىٰ لِقَوْمٍۢ يُؤْمِنُونَ ﴿51﴾", "ru": "(50) Они сказали: \"Если бы ниспосланы были ему знамения от твоего Господа!\" Скажи: \"Знамения только у Аллаха, и я ведь только ясный увещатель\". (51) Разве не довольно им, что Мы ниспослали тебе писание, которое читается им; поистине, в этом - милость и напоминание для народа, который верует!"}, {"ref": "6:37", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَقَالُوا۟ لَوْلَا نُزِّلَ عَلَيْهِ ءَايَةٌۭ مِّن رَّبِّهِۦ ۚ قُلْ إِنَّ ٱللَّهَ قَادِرٌ عَلَىٰٓ أَن يُنَزِّلَ ءَايَةًۭ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ ﴿37﴾", "ru": "И говорят они: \"Если бы было ниспослано ему знамение от его Господа!\" Скажи: \"Аллах мощен низвести знамение, но большая часть их не знает!\""}, {"ref": "17:90-93", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "وَقَالُوا۟ لَن نُّؤْمِنَ لَكَ حَتَّىٰ تَفْجُرَ لَنَا مِنَ ٱلْأَرْضِ يَنۢبُوعًا ﴿90﴾ أَوْ تَكُونَ لَكَ جَنَّةٌۭ مِّن نَّخِيلٍۢ وَعِنَبٍۢ فَتُفَجِّرَ ٱلْأَنْهَٰرَ خِلَٰلَهَا تَفْجِيرًا ﴿91﴾ أَوْ تُسْقِطَ ٱلسَّمَآءَ كَمَا زَعَمْتَ عَلَيْنَا كِسَفًا أَوْ تَأْتِىَ بِٱللَّهِ وَٱلْمَلَٰٓئِكَةِ قَبِيلًا ﴿92﴾ أَوْ يَكُونَ لَكَ بَيْتٌۭ مِّن زُخْرُفٍ أَوْ تَرْقَىٰ فِى ٱلسَّمَآءِ وَلَن نُّؤْمِنَ لِرُقِيِّكَ حَتَّىٰ تُنَزِّلَ عَلَيْنَا كِتَٰبًۭا نَّقْرَؤُهُۥ ۗ قُلْ سُبْحَانَ رَبِّى هَلْ كُنتُ إِلَّا بَشَرًۭا رَّسُولًۭا ﴿93﴾", "ru": "(90) И сказали они: \"Не поверим мы тебе, пока ты не изведешь нам из земли источника, (91) или будет у тебя сад с пальмами и виноградом, и ты проведешь между ними каналы, (92) или спустишь на нас небо, как говоришь, кусками, или придешь с Аллахом и ангелами пред нами, (93) или будет у тебя дом из золотых украшений, или ты поднимаешься на небо. Но не уверуем мы и в твое поднятие, пока ты не спустишь нам книгу, которую мы прочитаем\". Скажи: \"Хвала Господу моему! Разве я только не человек - посланник?\""}, {"ref": "10:20", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "وَيَقُولُونَ لَوْلَآ أُنزِلَ عَلَيْهِ ءَايَةٌۭ مِّن رَّبِّهِۦ ۖ فَقُلْ إِنَّمَا ٱلْغَيْبُ لِلَّهِ فَٱنتَظِرُوٓا۟ إِنِّى مَعَكُم مِّنَ ٱلْمُنتَظِرِينَ ﴿20﴾", "ru": "И говорят они : \" Если бы было ниспослано ему знамение от его Господа!\" Скажи: \"Тайное принадлежит только Аллаху. Ждите, и я с вами ожидаю!\""}], "n": "Что сказано: Противникам, которые требуют знамения, говорят: «Нас удержало от того, чтобы отправить со знамениями, только то, что они сочли ложью первые» (17:59). «Знамения только у Аллаха, и я ведь только ясный увещатель». И следом: «Разве не довольно им, что Мы ниспослали тебе писание, которое читается им» (29:50-51). Требования уровня «пока ты не изведёшь нам из земли источника» отвергнуты словами: «Хвала Господу моему! Разве я только не человек — посланник?» (17:93). В 10:20: «Тайное принадлежит только Аллаху. Ждите».\nВ чём проблема: Коран сам фиксирует, что требования чудес современников не выполнялись; единственным ⟦знамением⟧ названа книга (29:51). Это значит, что довод в пользу божественного происхождения опирается на сам текст (см. разбор 2:23-24 в этом разделе). Тем самым подтверждается, что чудес в смысле видимых событий текст за Пророком не называет; о расколе Луны (54:1) спор идёт по прочтению аята. Здесь нужна оговорка: в 17:59 как причина названа не невозможность, а то, что прежние знамения (⟦верблюдица⟧) не помогли; в 6:37 прямо сказано, что Аллах «мощен низвести знамение». То есть Коран не отрицает возможность чуда, он лишь не приводит ни одного, подтверждённого за Пророком. Критический довод ⟦текст не называет чудес Пророка⟧ верен, но это скорее слабость доказательства, чем противоречие: верующие скажут, что Коран и есть чудо.\nКак отвечают верующие: самое большое чудо — сам Коран; требования знамений были придирками, и им отказали, потому что прежние чудеса не помогли тем, кто не хотел верить.", "c": null, "x": ["2:23-24", "54:1", "6:109"], "t": "Коран назван чудом, но «знамений» Пророку не посылают", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Коран называет себя чудом, но знамений Пророку не посылают (17:59, 29:50). Здесь слабость доказательства: проверяемого подтверждения нет."}, {"refs": ["26:224-227", "36:69", "69:41", "52:30", "21:5"], "parts": [{"ref": "26:224-227", "sura": "Ash-Shu'araa", "sura_ar": "سُورَةُ الشُّعَرَاءِ", "type": "Meccan", "ar": "وَٱلشُّعَرَآءُ يَتَّبِعُهُمُ ٱلْغَاوُۥنَ ﴿224﴾ أَلَمْ تَرَ أَنَّهُمْ فِى كُلِّ وَادٍۢ يَهِيمُونَ ﴿225﴾ وَأَنَّهُمْ يَقُولُونَ مَا لَا يَفْعَلُونَ ﴿226﴾ إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَذَكَرُوا۟ ٱللَّهَ كَثِيرًۭا وَٱنتَصَرُوا۟ مِنۢ بَعْدِ مَا ظُلِمُوا۟ ۗ وَسَيَعْلَمُ ٱلَّذِينَ ظَلَمُوٓا۟ أَىَّ مُنقَلَبٍۢ يَنقَلِبُونَ ﴿227﴾", "ru": "(224) И поэты - за ними следуют заблудшие. (225) Разве ты не видишь, что они по всем долинам бродят (226) и что они говорят то, чего не делают, (227) кроме тех, которые уверовали и творили добрые дела и поминали Аллаха много. И получили они помощь после того, как были угнетены, и узнают угнетатели, каким поворотом они обернутся!"}, {"ref": "36:69", "sura": "Yaseen", "sura_ar": "سُورَةُ يسٓ", "type": "Meccan", "ar": "وَمَا عَلَّمْنَٰهُ ٱلشِّعْرَ وَمَا يَنۢبَغِى لَهُۥٓ ۚ إِنْ هُوَ إِلَّا ذِكْرٌۭ وَقُرْءَانٌۭ مُّبِينٌۭ ﴿69﴾", "ru": "Мы не учили его стихам, и не годится это для него. Это - только напоминание и ясный Коран,"}, {"ref": "69:41", "sura": "Al-Haaqqa", "sura_ar": "سُورَةُ الحَاقَّةِ", "type": "Meccan", "ar": "وَمَا هُوَ بِقَوْلِ شَاعِرٍۢ ۚ قَلِيلًۭا مَّا تُؤْمِنُونَ ﴿41﴾", "ru": "Это не слова поэта. Мало вы веруете!"}, {"ref": "52:30", "sura": "At-Tur", "sura_ar": "سُورَةُ الطُّورِ", "type": "Meccan", "ar": "أَمْ يَقُولُونَ شَاعِرٌۭ نَّتَرَبَّصُ بِهِۦ رَيْبَ ٱلْمَنُونِ ﴿30﴾", "ru": "Или они скажут: \"Поэт, - поджидаем мы перемены судьбы над ним\"."}, {"ref": "21:5", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "بَلْ قَالُوٓا۟ أَضْغَٰثُ أَحْلَٰمٍۭ بَلِ ٱفْتَرَىٰهُ بَلْ هُوَ شَاعِرٌۭ فَلْيَأْتِنَا بِـَٔايَةٍۢ كَمَآ أُرْسِلَ ٱلْأَوَّلُونَ ﴿5﴾", "ru": "Да, они сказали: \"Пучки снов! Да, измыслил он его облыжно! Да, он поэт! Пусть же он придет к нам со знамением, как посылались первые!\""}], "n": "Что сказано: «И поэты — за ними следуют заблудшие. Разве ты не видишь, что они по всем долинам бродят и что они говорят то, чего не делают, кроме тех, которые уверовали и творили добрые дела» (26:224-227). Про Коран: «Мы не учили его стихам, и не годится это для него» (36:69); «Это не слова поэта» (69:41). Противники обвиняют: «Да, он поэт!» (21:5; 52:30).\nВ чём проблема: Коран отвергает обвинение в том, что он поэзия, и одновременно даёт общую характеристику поэтов («говорят то, чего не делают»). Тут два вопроса: (1) общее обвинение целой группы людей, где исключение для верующих («кроме тех, которые уверовали») добавлено в самом аяте; в 61:2-3 та же формула ⟦говорить то, чего не делаете⟧ направлена и против верующих; (2) Коран сам написан рифмованной ритмичной речью, и современники именно поэтому сравнивали его с поэзией. Спорить тут особо не о чем: это оценка литературного жанра, а не проверяемое утверждение. Это оценка литературного жанра, а не проверяемое утверждение.\nКак отвечают верующие: обвинение относится к языческим поэтам Мекки, которые славили идолов и лгали; исключение для верующих показывает, что осуждается не поэзия вообще.", "c": null, "x": ["61:2-3", "2:23-24"], "t": "Поэты и Коран: «за поэтами следуют заблудшие»", "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Оценка жанра, исключение в самом аяте."}], "summary": ["Самоописание: ясный и неизменный (15:9, 3:7) при признании неясных мест и замен.", "Вызов «принесите подобное» ссылается на сам текст.", "Поэты и знамения — слабые доводы."]}, {"id": "contradictions", "title": "Противоречия внутри Корана", "icon": "⚖", "group": "Пророк, Коран и текст", "intro": "Места, где аяты спорят друг с другом или не совпадают с известной историей. Сам Коран в 4:82 заявляет: «Если бы он был не от Аллаха, они нашли бы в нём много противоречий». Для разрешения противоречий исламская традиция использует доктрину насх (отмена).", "verses": [{"n": "Что сказано: ⟦Разве они не размышляют о Коране? Ведь если бы он был не от Аллаха, они нашли бы в нём много противоречий⟧.\nВ чём проблема: сам Коран предлагает критерий проверки — отсутствие противоречий. Карточки этого раздела показывают пары аятов, которые критики называют противоречащими.", "c": null, "x": ["2:106"], "refs": ["4:82"], "parts": [{"ref": "4:82", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "أَفَلَا يَتَدَبَّرُونَ ٱلْقُرْءَانَ ۚ وَلَوْ كَانَ مِنْ عِندِ غَيْرِ ٱللَّهِ لَوَجَدُوا۟ فِيهِ ٱخْتِلَٰفًۭا كَثِيرًۭا ﴿82﴾", "ru": "Разве же они не размыслят о Коране? Ведь если бы он был не от Аллаха, то они нашли бы там много противоречий."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Критерий проверки поставлен самим Кораном: «если бы он был не от Аллаха, нашли бы много противоречий». Карточки раздела проверяют это утверждение."}, {"n": "Что сказано: «Нет принуждения в религии. Уже ясно отличился прямой путь от заблуждения».\nВ чём проблема: противоречит 9:5 (убивать многобожников), 9:29 (воевать с людьми Писания), 8:39 (воевать, пока религия вся не будет Аллаха), 4:89 (убивать отвернувшихся). Традиция решает: поздние аяты ⟦отменили⟧ ранние. Критики: «нет принуждения» остаётся лишь декларацией.\nКак отвечают верующие: часть богословов считает 2:256 не отменённым и относит к вопросам веры, а не войны.", "c": "Сравните с 9:5, 9:29, 8:39, 4:89.", "x": ["9:5", "9:29", "8:39", "4:89"], "refs": ["2:256"], "parts": [{"ref": "2:256", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "لَآ إِكْرَاهَ فِى ٱلدِّينِ ۖ قَد تَّبَيَّنَ ٱلرُّشْدُ مِنَ ٱلْغَىِّ ۚ فَمَن يَكْفُرْ بِٱلطَّٰغُوتِ وَيُؤْمِنۢ بِٱللَّهِ فَقَدِ ٱسْتَمْسَكَ بِٱلْعُرْوَةِ ٱلْوُثْقَىٰ لَا ٱنفِصَامَ لَهَا ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ ﴿256﴾", "ru": "Нет принуждения в религии. Уже ясно отличился прямой путь от заблуждения. Кто не верует в идолопоклонство и верует в Аллаха, тот ухватился за надежную опору, для которой нет сокрушения. Поистине, Аллах - слышащий, знающий!"}], "t": null, "at": "внутреннее противоречие", "pw": "сильный", "cl": "Вывод: прямое противоречие внутри текста, вопреки 4:82, где Коран утверждает, что противоречий в нём нет. «Нет принуждения в религии» (2:256) расходится с приказами воевать (9:5, 9:29). Традиция решает это отменой, то есть признаёт конфликт; текст отмену не называет."}, {"n": "Что сказано: ⟦Поистине, те, которые уверовали, и те, кто стал иудеями, и христиане, и сабии, которые уверовали в Аллаха и в последний день и творили благое, — им их награда у Господа⟧.\nВ чём проблема: эта норма противоположна 3:85 (⟦кто ищет не ислама, от того не будет принято⟧). Часть толкователей считает, что 2:62 отменён 3:85; но 5:69 повторяет мысль 2:62 уже позже по хронологии (традиционно).", "c": "Сравните с 3:85: ⟦кто ищет иной религии, кроме ислама, — не будет принято⟧.", "x": ["3:85", "5:69"], "refs": ["2:62"], "parts": [{"ref": "2:62", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَادُوا۟ وَٱلنَّصَٰرَىٰ وَٱلصَّٰبِـِٔينَ مَنْ ءَامَنَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ وَعَمِلَ صَٰلِحًۭا فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ ﴿62﴾", "ru": "Поистине, те, которые уверовали, и те, кто обратились в иудейство, и христиане, и сабии, которые уверовали в Аллаха и в последний день и творили благое, - им их награда у Господа их, нет над ними страха, и не будут они печальны."}], "t": null, "at": "внутреннее противоречие", "pw": "сильный", "cl": "Вывод: прямое противоречие внутри текста, вопреки 4:82, где Коран утверждает, что противоречий в нём нет. 2:62 обещает награду людям Писания, а 3:85 не принимает ничего, кроме ислама. Явное расхождение, на которое верующие отвечают отменой."}, {"n": "Что сказано: Земля создана ⟦за два дня⟧; затем «в четыре дня» всё на ней; затем ⟦семь небес — за два дня⟧.\nВ чём проблема: два плюс четыре плюс два — восемь дней, а в 7:54 и 25:59 сказано ⟦шесть⟧. Кроме того, здесь земля создана до неба, а в 79:27-30 небо построено первым, а землю Бог ⟦после этого распростёр⟧. И 2:29 ставит землю раньше неба.\nКак отвечают верующие: «четыре дня» включают первые два; «потом» может означать ⟦а ещё⟧.", "c": "Апологеты: «четыре дня» включают первые два (итого шесть).", "x": ["7:54", "25:59", "79:27-30", "2:29"], "refs": ["41:9-12"], "parts": [{"ref": "41:9-12", "sura": "Fussilat", "sura_ar": "سُورَةُ فُصِّلَتۡ", "type": "Meccan", "ar": "۞ قُلْ أَئِنَّكُمْ لَتَكْفُرُونَ بِٱلَّذِى خَلَقَ ٱلْأَرْضَ فِى يَوْمَيْنِ وَتَجْعَلُونَ لَهُۥٓ أَندَادًۭا ۚ ذَٰلِكَ رَبُّ ٱلْعَٰلَمِينَ ﴿9﴾ وَجَعَلَ فِيهَا رَوَٰسِىَ مِن فَوْقِهَا وَبَٰرَكَ فِيهَا وَقَدَّرَ فِيهَآ أَقْوَٰتَهَا فِىٓ أَرْبَعَةِ أَيَّامٍۢ سَوَآءًۭ لِّلسَّآئِلِينَ ﴿10﴾ ثُمَّ ٱسْتَوَىٰٓ إِلَى ٱلسَّمَآءِ وَهِىَ دُخَانٌۭ فَقَالَ لَهَا وَلِلْأَرْضِ ٱئْتِيَا طَوْعًا أَوْ كَرْهًۭا قَالَتَآ أَتَيْنَا طَآئِعِينَ ﴿11﴾ فَقَضَىٰهُنَّ سَبْعَ سَمَٰوَاتٍۢ فِى يَوْمَيْنِ وَأَوْحَىٰ فِى كُلِّ سَمَآءٍ أَمْرَهَا ۚ وَزَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَحِفْظًۭا ۚ ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ ﴿12﴾", "ru": "(9) Скажи: \"Разве вы не веруете в того, кто сотворил землю в два дня, и делаете Ему равных? Это - Господь миров! (10) И устроил Он на ней прочно стоящие сверху ее; и благословил ее и распределил на ней ее пропитание в четыре дня - равно для всех просящих. (11) Потом утвердился Он к небесам - а они были дымом - и сказал им и земле: \"Приходите добровольно или невольно!\" И сказали они: \"Мы приходим добровольно\". (12) И установил Он из них семь небес в два дня и внушил каждому небу его дело; и разукрасили Мы ближайшее небо светильниками и для охраны. Таково установление великого, мудрого\"."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Дни творения (2+4+2) расходятся с шестью в 7:54; верующие считают «четыре дня» включающими первые два."}, {"n": "Что сказано: ⟦Аллах — тот, кто сотворил небеса и землю в шесть дней, потом утвердился на троне⟧.\nВ чём проблема: шесть дней; но 41:9-12 даёт сумму в восемь дней. Также повторяется в 10:3, 11:7, 25:59, 32:4, 50:38, 57:4.", "c": null, "x": ["41:9-12", "25:59", "32:4"], "refs": ["7:54"], "parts": [{"ref": "7:54", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "إِنَّ رَبَّكُمُ ٱللَّهُ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ فِى سِتَّةِ أَيَّامٍۢ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ يُغْشِى ٱلَّيْلَ ٱلنَّهَارَ يَطْلُبُهُۥ حَثِيثًۭا وَٱلشَّمْسَ وَٱلْقَمَرَ وَٱلنُّجُومَ مُسَخَّرَٰتٍۭ بِأَمْرِهِۦٓ ۗ أَلَا لَهُ ٱلْخَلْقُ وَٱلْأَمْرُ ۗ تَبَارَكَ ٱللَّهُ رَبُّ ٱلْعَٰلَمِينَ ﴿54﴾", "ru": "Поистине, Господь ваш - Аллах, который создал небеса и землю в шесть дней, а потом утвердился на троне. Он закрывает ночью день, который непрестанно за ней движется... И солнце, и луну, и звезды, подчиненные Его власти. О да! Ему принадлежит и создание и власть. Благословен Аллах, Господь миров!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Шесть дней и счёт 41:9-12."}, {"n": "Что сказано: ⟦Вас ли труднее сотворить или небо? Он построил его… а землю после этого распростёр⟧.\nВ чём проблема: небо построено до того, как землю «распростёр». Это противоречит 41:9-12 и 2:29, где земля создана раньше неба.\nКак отвечают верующие: ⟦потом⟧ означает ⟦кроме того⟧; но в 41:11 и 2:29 то же слово ставит небо после земли.", "c": null, "x": ["41:9-12", "2:29"], "refs": ["79:27-30"], "parts": [{"ref": "79:27-30", "sura": "An-Naazi'aat", "sura_ar": "سُورَةُ النَّازِعَاتِ", "type": "Meccan", "ar": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا ﴿27﴾ رَفَعَ سَمْكَهَا فَسَوَّىٰهَا ﴿28﴾ وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَىٰهَا ﴿29﴾ وَٱلْأَرْضَ بَعْدَ ذَٰلِكَ دَحَىٰهَآ ﴿30﴾", "ru": "(27) Вы ли труднее для создания или небо? Он его построил, (28) воздвиг свод его и устроил, (29) омрачил ночь его и вывел зарю, (30) и землю после этого распростер,"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Небо построено раньше «распростёртой» земли, а 41:9-12 и 2:29 дают другой порядок.: слово «распростёр» понимают как отдельное действие."}, {"n": "Что сказано: «Восходят ангелы и дух к Нему в день, величина которого пятьдесят тысяч лет».\nВ чём проблема: тот же «день» в 32:5 — тысяча лет, а в 22:47 — ⟦один день у Господа как тысяча лет⟧. Три разных величины для ⟦дня⟧ Бога.\nКак отвечают верующие: это разные дни (разные события).", "c": null, "x": ["32:5", "22:47"], "refs": ["70:4"], "parts": [{"ref": "70:4", "sura": "Al-Ma'aarij", "sura_ar": "سُورَةُ المَعَارِجِ", "type": "Meccan", "ar": "تَعْرُجُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ إِلَيْهِ فِى يَوْمٍۢ كَانَ مِقْدَارُهُۥ خَمْسِينَ أَلْفَ سَنَةٍۢ ﴿4﴾", "ru": "Восходят ангелы и дух к Нему в день, величина которого пятьдесят тысяч лет."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Три разных «дня»: тысяча, пятьдесят тысяч лет, один день как тысяча. Речь о разных событиях."}, {"n": "Что сказано: ⟦Он распределяет Своё повеление с неба на землю, потом оно восходит к Нему в некий день, протяжение которого — тысяча лет по вашему счёту⟧.\nВ чём проблема: день в тысячу лет; в 70:4 — пятьдесят тысяч лет. Оба — про ⟦восхождение⟧ повеления к Богу.", "c": null, "x": ["70:4", "22:47"], "refs": ["32:5"], "parts": [{"ref": "32:5", "sura": "As-Sajda", "sura_ar": "سُورَةُ السَّجۡدَةِ", "type": "Meccan", "ar": "يُدَبِّرُ ٱلْأَمْرَ مِنَ ٱلسَّمَآءِ إِلَى ٱلْأَرْضِ ثُمَّ يَعْرُجُ إِلَيْهِ فِى يَوْمٍۢ كَانَ مِقْدَارُهُۥٓ أَلْفَ سَنَةٍۢ مِّمَّا تَعُدُّونَ ﴿5﴾", "ru": "Он распределяет Свое повеление с неба на землю, потом оно восходит к Нему в некий день, протяжение которого - тысяча лет, как вы считаете."}], "t": null, "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. То же, что 70:4."}, {"n": "Что сказано: ⟦Один день у Господа твоего — как тысяча лет по вашему счёту⟧.\nВ чём проблема: третья величина ⟦дня⟧. См. 70:4 (пятьдесят тысяч лет) и 32:5 (тысяча лет). Отсюда сложный вопрос, как понимать ⟦шесть дней⟧ творения.", "c": null, "x": ["70:4", "32:5"], "refs": ["22:47"], "parts": [{"ref": "22:47", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "وَيَسْتَعْجِلُونَكَ بِٱلْعَذَابِ وَلَن يُخْلِفَ ٱللَّهُ وَعْدَهُۥ ۚ وَإِنَّ يَوْمًا عِندَ رَبِّكَ كَأَلْفِ سَنَةٍۢ مِّمَّا تَعُدُّونَ ﴿47﴾", "ru": "Они торопят тебя с наказанием, но Аллах не изменит Своего обещания, и, поистине, день у твоего Господа, как тысяча лет из тех, что вы считаете!"}], "t": null, "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. То же."}, {"n": "Что сказано: ⟦И бросил он свой посох, и вот он — явный змей⟧.\nВ чём проблема: в 7:107 посох — ⟦су'бан⟧ (большой змей), в 20:20 — ⟦хайя⟧ (ползущая змея), в 27:10 — ⟦извивался, как будто он — джинн (джанн)⟧. Три разных слова для одного события.\nКак отвечают верующие: арабские слова для змей пересекаются по значению.", "c": null, "x": ["20:20", "27:10"], "refs": ["7:107"], "parts": [{"ref": "7:107", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "فَأَلْقَىٰ عَصَاهُ فَإِذَا هِىَ ثُعْبَانٌۭ مُّبِينٌۭ ﴿107﴾", "ru": "И бросил он свой жезл, и вот, это - явно змей."}], "t": null, "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Три разных слова для одного и того же события (посох Мусы): расхождение лексики, свидетельствующее о том, что рассказ передан без единой редакции."}, {"n": "Что сказано: ⟦Он бросил его, и вот он — змея ползущая⟧.\nВ чём проблема: слово ⟦хайя⟧ (обычная змея) расходится с 7:107 (⟦су'бан⟧ — огромная) и 27:10 (⟦джанн⟧ — малая, быстрая).", "c": null, "x": ["7:107", "27:10"], "refs": ["20:20"], "parts": [{"ref": "20:20", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "فَأَلْقَىٰهَا فَإِذَا هِىَ حَيَّةٌۭ تَسْعَىٰ ﴿20﴾", "ru": "И бросил он его. И вот - это змея, которая ползет."}], "t": null, "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. То же."}, {"n": "Что сказано: ⟦Брось свой посох!⟧ — когда он увидел, что тот извивается, как джинн (джанн), он повернулся и не вернулся.\nВ чём проблема: слово ⟦джанн⟧ (малая быстрая змея) расходится с 7:107 (⟦су'бан⟧) и 20:20 (⟦хайя⟧).", "c": null, "x": ["7:107", "20:20"], "refs": ["27:10"], "parts": [{"ref": "27:10", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "وَأَلْقِ عَصَاكَ ۚ فَلَمَّا رَءَاهَا تَهْتَزُّ كَأَنَّهَا جَآنٌّۭ وَلَّىٰ مُدْبِرًۭا وَلَمْ يُعَقِّبْ ۚ يَٰمُوسَىٰ لَا تَخَفْ إِنِّى لَا يَخَافُ لَدَىَّ ٱلْمُرْسَلُونَ ﴿10﴾", "ru": "И брось свою палку!\" Когда же он увидел, что она извивается, как змея, обратился вспять и не возвратился. \"О Муса, не бойся, ведь не боятся у Меня посланные, -"}], "t": null, "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. То же."}, {"n": "Что сказано: «Если постигнет их хорошее, они говорят: Это — от Аллаха, а когда постигнет их дурное, они говорят: Это — от тебя. Скажи: Всё — от Аллаха».\nВ чём проблема: «всё от Аллаха» — и хорошее, и плохое. А следующий аят говорит: хорошее от Аллаха, плохое — от самого себя. Противоречие внутри двух соседних аятов.", "c": null, "x": ["4:79"], "refs": ["4:78"], "parts": [{"ref": "4:78", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "أَيْنَمَا تَكُونُوا۟ يُدْرِككُّمُ ٱلْمَوْتُ وَلَوْ كُنتُمْ فِى بُرُوجٍۢ مُّشَيَّدَةٍۢ ۗ وَإِن تُصِبْهُمْ حَسَنَةٌۭ يَقُولُوا۟ هَٰذِهِۦ مِنْ عِندِ ٱللَّهِ ۖ وَإِن تُصِبْهُمْ سَيِّئَةٌۭ يَقُولُوا۟ هَٰذِهِۦ مِنْ عِندِكَ ۚ قُلْ كُلٌّۭ مِّنْ عِندِ ٱللَّهِ ۖ فَمَالِ هَٰٓؤُلَآءِ ٱلْقَوْمِ لَا يَكَادُونَ يَفْقَهُونَ حَدِيثًۭا ﴿78﴾", "ru": "Где бы вы ни были, захватит вас смерть, если бы вы были даже в воздвигнутых башнях. И если постигнет их хорошее, они говорят: \"Это - от Аллаха\", а когда постигнет их дурное, они говорят: \"Это - от тебя\". Скажи: \"Все - от Аллаха\". Почему же эти люди никак не могут понять рассказа?"}], "t": null, "at": "внутреннее противоречие", "pw": "сильный", "cl": "Вывод: прямое противоречие внутри текста, вопреки 4:82, где Коран утверждает, что противоречий в нём нет. «Всё от Аллаха» (4:78) и «дурное — от самого себя» (4:79) в соседних аятах."}, {"n": "Что сказано: «Что постигло тебя из хорошего, то — от Аллаха, а что постигло из дурного, то — от самого себя».\nВ чём проблема: противоречит 4:78 (⟦всё от Аллаха⟧) и 57:22 (всё записано заранее). Это важная пара для вопроса о предопределении.", "c": null, "x": ["4:78", "57:22"], "refs": ["4:79"], "parts": [{"ref": "4:79", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "مَّآ أَصَابَكَ مِنْ حَسَنَةٍۢ فَمِنَ ٱللَّهِ ۖ وَمَآ أَصَابَكَ مِن سَيِّئَةٍۢ فَمِن نَّفْسِكَ ۚ وَأَرْسَلْنَٰكَ لِلنَّاسِ رَسُولًۭا ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا ﴿79﴾", "ru": "Что постигло тебя из хорошего, то - от Аллаха, а что постигло из дурного, то - от самого себя. Мы послали тебя к людям посланником. и довольно Аллаха как свидетеля!"}], "t": null, "at": "внутреннее противоречие", "pw": "сильный", "cl": "Вывод: прямое противоречие внутри текста, вопреки 4:82, где Коран утверждает, что противоречий в нём нет. Это вторая половина той же пары: оба аята стоят подряд."}, {"n": "Что сказано: «Аллах сводит с пути, кого пожелает, и ведёт, кого желает».\nВ чём проблема: противоречит 18:29 (⟦кто хочет — пусть верует⟧) и 2:256; см. раздел ⟦Предопределение⟧.", "c": null, "x": ["18:29", "2:256"], "refs": ["14:4"], "parts": [{"ref": "14:4", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "وَمَآ أَرْسَلْنَا مِن رَّسُولٍ إِلَّا بِلِسَانِ قَوْمِهِۦ لِيُبَيِّنَ لَهُمْ ۖ فَيُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ ﴿4﴾", "ru": "Мы отправляли посланников только с языком их народа, чтобы они разъясняли им. Аллах сводит с пути, кого пожелает, и ведет, кого желает. Он - великий, мудрый!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Бог сводит с пути (14:4) расходится с 18:29."}, {"n": "Что сказано: «Скажи: Истина — от вашего Господа; кто хочет — пусть верует, а кто хочет — пусть не верует».\nВ чём проблема: противоречит 14:4, 6:39, 76:30: Бог Сам определяет, кто верует. Это главное внутреннее противоречие по вопросу свободы воли.", "c": null, "x": ["14:4", "6:39", "76:30"], "refs": ["18:29"], "parts": [{"ref": "18:29", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَقُلِ ٱلْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَآءَ فَلْيُؤْمِن وَمَن شَآءَ فَلْيَكْفُرْ ۚ إِنَّآ أَعْتَدْنَا لِلظَّٰلِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا ۚ وَإِن يَسْتَغِيثُوا۟ يُغَاثُوا۟ بِمَآءٍۢ كَٱلْمُهْلِ يَشْوِى ٱلْوُجُوهَ ۚ بِئْسَ ٱلشَّرَابُ وَسَآءَتْ مُرْتَفَقًا ﴿29﴾", "ru": "И скажи: \"Истина - от вашего Господа: кто хочет, пусть верует, а кто хочет, пусть не верует\". Мы приготовили несправедливым огонь, навес которого окружит их; а если они воззовут о помощи, им помогут водой, подобной расплавленному металлу, которая опаляет лица. Скверно питье, и плохо убежище!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Кто хочет, пусть верует» против 14:4, 6:39, 76:30."}, {"refs": ["15:26", "3:59", "25:54", "96:2"], "parts": [{"ref": "15:26", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "وَلَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ مِن صَلْصَٰلٍۢ مِّنْ حَمَإٍۢ مَّسْنُونٍۢ ﴿26﴾", "ru": "И Мы сотворили уже человека из звучащей, из глины, облеченной в форму."}, {"ref": "3:59", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "إِنَّ مَثَلَ عِيسَىٰ عِندَ ٱللَّهِ كَمَثَلِ ءَادَمَ ۖ خَلَقَهُۥ مِن تُرَابٍۢ ثُمَّ قَالَ لَهُۥ كُن فَيَكُونُ ﴿59﴾", "ru": "Поистине, Иса пред Аллахом подобен Адаму: Он создал его из праха, потом сказал ему: \"Будь!\" - и он стал."}, {"ref": "25:54", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "وَهُوَ ٱلَّذِى خَلَقَ مِنَ ٱلْمَآءِ بَشَرًۭا فَجَعَلَهُۥ نَسَبًۭا وَصِهْرًۭا ۗ وَكَانَ رَبُّكَ قَدِيرًۭا ﴿54﴾", "ru": "И Он - тот, который создал из воды человека и сделал ему родство мужское и женское. Господь твой - могуч!"}, {"ref": "96:2", "sura": "Al-Alaq", "sura_ar": "سُورَةُ العَلَقِ", "type": "Meccan", "ar": "خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ ﴿2﴾", "ru": "сотворил человека из сгустка."}], "n": "Что сказано: ⟦Из звонкой глины, из чёрного ила⟧ (15:26); Адам — «из праха» (3:59); «из воды» (25:54); «из сгустка» (96:2).\nВ чём проблема: в разных местах названы разные материалы: ил, прах, вода, сгусток. Апологеты видят разные стадии (прах → глина → капля → сгусток), но в тексте они не сведены в одну последовательность и поданы как независимые описания.", "c": null, "x": [], "t": "Из чего создан человек", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Разные материалы человека — стадии или разные описания."}, {"refs": ["2:34", "18:50", "66:6"], "parts": [{"ref": "2:34", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ ٱسْجُدُوا۟ لِءَادَمَ فَسَجَدُوٓا۟ إِلَّآ إِبْلِيسَ أَبَىٰ وَٱسْتَكْبَرَ وَكَانَ مِنَ ٱلْكَٰفِرِينَ ﴿34﴾", "ru": "И вот, сказали Мы ангелам: \"Поклонитесь Адаму!\" И поклонились они, кроме Иблиса. Он отказался и превознесся и оказался неверующим."}, {"ref": "18:50", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ ٱسْجُدُوا۟ لِءَادَمَ فَسَجَدُوٓا۟ إِلَّآ إِبْلِيسَ كَانَ مِنَ ٱلْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِۦٓ ۗ أَفَتَتَّخِذُونَهُۥ وَذُرِّيَّتَهُۥٓ أَوْلِيَآءَ مِن دُونِى وَهُمْ لَكُمْ عَدُوٌّۢ ۚ بِئْسَ لِلظَّٰلِمِينَ بَدَلًۭا ﴿50﴾", "ru": "И вот Мы сказали ангелам: \"Поклонитесь Адаму!\" И поклонились они, кроме Иблиса. Был он из джиннов и совратился с пути Господа своего. Неужели вы возьмете его и его потомство защитниками вместо Меня. Они для вас - враги. Плоха для несправедливых замена!"}, {"ref": "66:6", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ قُوٓا۟ أَنفُسَكُمْ وَأَهْلِيكُمْ نَارًۭا وَقُودُهَا ٱلنَّاسُ وَٱلْحِجَارَةُ عَلَيْهَا مَلَٰٓئِكَةٌ غِلَاظٌۭ شِدَادٌۭ لَّا يَعْصُونَ ٱللَّهَ مَآ أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ ﴿6﴾", "ru": "О вы, которые уверовали! Охраняйте свои души и свои семьи от огня, растопкой для которого - люди и камни. Над ним - ангелы, грубые, сильные - не ослушиваются Аллаха в том, что Он приказал, и делают то, что им приказано."}], "n": "Что сказано: Ангелам сказано поклониться Адаму; все поклонились, «кроме Иблиса» (2:34); но ⟦Иблис был из джиннов⟧ (18:50); а ангелы «не ослушиваются Аллаха в том, что Он приказал» (66:6).\nВ чём проблема: если Иблис — один из ангелов, то 66:6 неверно (он ослушался). Если он джинн, то приказ в 2:34 адресован ангелам, а не ему — но он наказан за непослушание. Тексту нужно объяснение, почему джинн был в числе тех, кому приказали поклониться.", "c": null, "x": [], "t": "Иблис — ангел или джинн", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Иблис назван ангелом (2:34) или джинном (18:50). Вывод зависит от толкования."}, {"refs": ["4:157", "3:55", "19:33"], "parts": [{"ref": "4:157", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَقَوْلِهِمْ إِنَّا قَتَلْنَا ٱلْمَسِيحَ عِيسَى ٱبْنَ مَرْيَمَ رَسُولَ ٱللَّهِ وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَٰكِن شُبِّهَ لَهُمْ ۚ وَإِنَّ ٱلَّذِينَ ٱخْتَلَفُوا۟ فِيهِ لَفِى شَكٍّۢ مِّنْهُ ۚ مَا لَهُم بِهِۦ مِنْ عِلْمٍ إِلَّا ٱتِّبَاعَ ٱلظَّنِّ ۚ وَمَا قَتَلُوهُ يَقِينًۢا ﴿157﴾", "ru": "и за их слова: \"Мы ведь убили Мессию, Ису, сына Марйам, посланника Аллаха\" (а они не убили его и не распяли, но это только представилось им; и, поистине, те, которые разногласят об этом, - в сомнении о нем; нет у них об этом никакого знания, кроме следования за предложением. Они не убивали его, - наверное,"}, {"ref": "3:55", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "إِذْ قَالَ ٱللَّهُ يَٰعِيسَىٰٓ إِنِّى مُتَوَفِّيكَ وَرَافِعُكَ إِلَىَّ وَمُطَهِّرُكَ مِنَ ٱلَّذِينَ كَفَرُوا۟ وَجَاعِلُ ٱلَّذِينَ ٱتَّبَعُوكَ فَوْقَ ٱلَّذِينَ كَفَرُوٓا۟ إِلَىٰ يَوْمِ ٱلْقِيَٰمَةِ ۖ ثُمَّ إِلَىَّ مَرْجِعُكُمْ فَأَحْكُمُ بَيْنَكُمْ فِيمَا كُنتُمْ فِيهِ تَخْتَلِفُونَ ﴿55﴾", "ru": "Вот сказал Аллах: \"О Иса! Я упокою тебя, и вознесу тебя ко Мне, и очищу тебя от тех, которые не веровали, и сделаю тех, которые последовали за тобой, выше тех, которые не веровали, до дня воскресения. Потом ко Мне будет ваше возвращение, и Я рассужу между вами относительно того, в чем вы разногласили."}, {"ref": "19:33", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "وَٱلسَّلَٰمُ عَلَىَّ يَوْمَ وُلِدتُّ وَيَوْمَ أَمُوتُ وَيَوْمَ أُبْعَثُ حَيًّۭا ﴿33﴾", "ru": "И мир мне в тот день, как я родился, и в день, что умру, и в день, когда буду воскрешен живым!\""}], "n": "Что сказано: «Они не убили его и не распяли, но это только представилось им» (4:157); Бог говорит Исе: ⟦Я упокою тебя и вознесу к Себе⟧ (3:55); Иса: ⟦И мир мне в день, как я родился, и в день, как умру, и в день, как буду воскрешён⟧ (19:33).\nВ чём проблема: в 4:157 его не убили; в 3:55 слово «упокою» толкуют по-разному (смерть или ⟦забрать⟧); в 19:33 он говорит ⟦в день, как умру⟧. Так ли он умер или вознесён живым, ясно не сказано. Критики: аяты не согласованы.\nКак отвечают верующие: в 19:33 — будущая смерть Исы; в 3:55 — ⟦упокоение⟧ перед вознесением.", "c": null, "x": ["39:42"], "t": "Умер ли Иса", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Умер ли Иса: 4:157, 3:55 и 19:33 не согласованы. Слово «упокою» неоднозначно."}, {"n": "Что сказано: «И завершились словеса Господа твоего по истине и справедливости. Нет изменителя словам Его».\nВ чём проблема: Бог не меняет Свои слова. Но 2:106 и 16:101 говорят о замене аятов, а 13:39 — ⟦стирает, что желает⟧. Это противоречие внутри доктрины об отмене.", "c": "Сравните с 2:106 и 16:101, где Бог ⟦заменяет аяты⟧.", "x": ["2:106", "16:101", "13:39"], "refs": ["6:115"], "parts": [{"ref": "6:115", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَتَمَّتْ كَلِمَتُ رَبِّكَ صِدْقًۭا وَعَدْلًۭا ۚ لَّا مُبَدِّلَ لِكَلِمَٰتِهِۦ ۚ وَهُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ ﴿115﴾", "ru": "И завершились словеса Господа твоего по истине и справедливости. Нет изменителя словам Его: ведь Он - слышащий, знающий!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Нет изменителя словам Его» против 2:106, 16:101, 13:39."}, {"n": "Что сказано: «Нет меняющего Его слова».\nВ чём проблема: то же, что в 6:115: слова Бога не меняются. Спорит с насх (отменой аятов).", "c": null, "x": ["6:115", "2:106"], "refs": ["18:27"], "parts": [{"ref": "18:27", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِن كِتَابِ رَبِّكَ ۖ لَا مُبَدِّلَ لِكَلِمَٰتِهِۦ وَلَن تَجِدَ مِن دُونِهِۦ مُلْتَحَدًۭا ﴿27﴾", "ru": "И прочитай то из книги Господа твоего, что открыто тебе; нет меняющего Его слова, и никогда ты не найдешь помимо Него защиты."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. То же, что 6:115."}, {"n": "Что сказано: «Огонь — ваше место, для вечного пребывания в нём, если только не пожелает Аллах иного».\nВ чём проблема: «вечно», но с оговоркой, которая смягчает смысл; в 4:169 ⟦пребывая вечно навсегда⟧ без оговорки. Вопрос: вечен ли ад.", "c": "Сравните 11:106-107 и 4:169: «вечно».", "x": ["11:107", "4:169"], "refs": ["6:128"], "parts": [{"ref": "6:128", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَيَوْمَ يَحْشُرُهُمْ جَمِيعًۭا يَٰمَعْشَرَ ٱلْجِنِّ قَدِ ٱسْتَكْثَرْتُم مِّنَ ٱلْإِنسِ ۖ وَقَالَ أَوْلِيَآؤُهُم مِّنَ ٱلْإِنسِ رَبَّنَا ٱسْتَمْتَعَ بَعْضُنَا بِبَعْضٍۢ وَبَلَغْنَآ أَجَلَنَا ٱلَّذِىٓ أَجَّلْتَ لَنَا ۚ قَالَ ٱلنَّارُ مَثْوَىٰكُمْ خَٰلِدِينَ فِيهَآ إِلَّا مَا شَآءَ ٱللَّهُ ۗ إِنَّ رَبَّكَ حَكِيمٌ عَلِيمٌۭ ﴿128﴾", "ru": "И в день, когда Он соберет их всех: \"О сонмище джиннов! Вы многого хотели от этих людей!\" И скажут их приятели из людей: \"Господи! Одни из нас пользовались другими, и мы дошли до нашего предела, который Ты нам назначил\". Он скажет: \"Огонь - ваше место, - для вечного пребывания в нем, - если только не пожелает Аллах иного\". Поистине, Господь твой - мудрый, знающий!"}], "t": null, "at": "зависит от перевода или толкования", "pw": "слабый", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. «Вечно» с оговоркой «если не пожелает Бог» против 4:169."}, {"refs": ["6:163", "7:143", "39:12", "3:67"], "parts": [{"ref": "6:163", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "لَا شَرِيكَ لَهُۥ ۖ وَبِذَٰلِكَ أُمِرْتُ وَأَنَا۠ أَوَّلُ ٱلْمُسْلِمِينَ ﴿163﴾", "ru": "у которого нет сотоварища. Это мне повелено, и я - первый из предавшихся\"."}, {"ref": "7:143", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "وَلَمَّا جَآءَ مُوسَىٰ لِمِيقَٰتِنَا وَكَلَّمَهُۥ رَبُّهُۥ قَالَ رَبِّ أَرِنِىٓ أَنظُرْ إِلَيْكَ ۚ قَالَ لَن تَرَىٰنِى وَلَٰكِنِ ٱنظُرْ إِلَى ٱلْجَبَلِ فَإِنِ ٱسْتَقَرَّ مَكَانَهُۥ فَسَوْفَ تَرَىٰنِى ۚ فَلَمَّا تَجَلَّىٰ رَبُّهُۥ لِلْجَبَلِ جَعَلَهُۥ دَكًّۭا وَخَرَّ مُوسَىٰ صَعِقًۭا ۚ فَلَمَّآ أَفَاقَ قَالَ سُبْحَٰنَكَ تُبْتُ إِلَيْكَ وَأَنَا۠ أَوَّلُ ٱلْمُؤْمِنِينَ ﴿143﴾", "ru": "И когда пришел Муса к назначенному Нами сроку и беседовал с ним Господь, он сказал: \"Господи! Дай мне посмотреть на Тебя\". Он сказал: \"Ты Меня не увидишь, но посмотри на гору; если она удержится на своем месте, то ты Меня увидишь\". А когда открылся его Господь горе, Он обратил ее в прах, и пал Муса пораженным. Когда же он оправился, то сказал: \"Хвала Тебя! Я обратился к Тебе, и я - первый уверовавший\"."}, {"ref": "39:12", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "وَأُمِرْتُ لِأَنْ أَكُونَ أَوَّلَ ٱلْمُسْلِمِينَ ﴿12﴾", "ru": "и мне повелено быть первым из мусульман\"."}, {"ref": "3:67", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "مَا كَانَ إِبْرَٰهِيمُ يَهُودِيًّۭا وَلَا نَصْرَانِيًّۭا وَلَٰكِن كَانَ حَنِيفًۭا مُّسْلِمًۭا وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ ﴿67﴾", "ru": "Ибрахим не был ни иудеем, ни христианином, а был он ханифом предавшимся и не был из многобожников."}], "n": "Что сказано: Мухаммад: «Это мне повелено, и я — первый из предавшихся» (6:163); «Мне повелено быть первым из мусульман» (39:12); Муса: «Я обратился к Тебе, и я — первый уверовавший» (7:143); Ибрахим был ⟦ханифом предавшимся (мусульманином)⟧ (3:67).\nВ чём проблема: названо несколько ⟦первых⟧: Мухаммад, Муса и (в 3:67, 22:78) Ибрахим. Все не могут быть первыми. Объяснение: слово «первый» в смысле ⟦первый среди своей общины⟧, но в тексте этого нет.", "c": null, "x": ["22:78", "2:131"], "t": "Кто «первый мусульманин»", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Названо несколько «первых» мусульман; объяснимо оборотом «первый среди общины»."}, {"refs": ["6:103", "7:143", "75:22-23", "83:15"], "parts": [{"ref": "6:103", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "لَّا تُدْرِكُهُ ٱلْأَبْصَٰرُ وَهُوَ يُدْرِكُ ٱلْأَبْصَٰرَ ۖ وَهُوَ ٱللَّطِيفُ ٱلْخَبِيرُ ﴿103﴾", "ru": "Не постигает Его взоры, а Он постигает взоры; Он - проницателен, сведущ!"}, {"ref": "7:143", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "وَلَمَّا جَآءَ مُوسَىٰ لِمِيقَٰتِنَا وَكَلَّمَهُۥ رَبُّهُۥ قَالَ رَبِّ أَرِنِىٓ أَنظُرْ إِلَيْكَ ۚ قَالَ لَن تَرَىٰنِى وَلَٰكِنِ ٱنظُرْ إِلَى ٱلْجَبَلِ فَإِنِ ٱسْتَقَرَّ مَكَانَهُۥ فَسَوْفَ تَرَىٰنِى ۚ فَلَمَّا تَجَلَّىٰ رَبُّهُۥ لِلْجَبَلِ جَعَلَهُۥ دَكًّۭا وَخَرَّ مُوسَىٰ صَعِقًۭا ۚ فَلَمَّآ أَفَاقَ قَالَ سُبْحَٰنَكَ تُبْتُ إِلَيْكَ وَأَنَا۠ أَوَّلُ ٱلْمُؤْمِنِينَ ﴿143﴾", "ru": "И когда пришел Муса к назначенному Нами сроку и беседовал с ним Господь, он сказал: \"Господи! Дай мне посмотреть на Тебя\". Он сказал: \"Ты Меня не увидишь, но посмотри на гору; если она удержится на своем месте, то ты Меня увидишь\". А когда открылся его Господь горе, Он обратил ее в прах, и пал Муса пораженным. Когда же он оправился, то сказал: \"Хвала Тебя! Я обратился к Тебе, и я - первый уверовавший\"."}, {"ref": "75:22-23", "sura": "Al-Qiyaama", "sura_ar": "سُورَةُ القِيَامَةِ", "type": "Meccan", "ar": "وُجُوهٌۭ يَوْمَئِذٍۢ نَّاضِرَةٌ ﴿22﴾ إِلَىٰ رَبِّهَا نَاظِرَةٌۭ ﴿23﴾", "ru": "(22) Лица в тот день сияющие, (23) на Господа их взирающие."}, {"ref": "83:15", "sura": "Al-Mutaffifin", "sura_ar": "سُورَةُ المُطَفِّفِينَ", "type": "Meccan", "ar": "كَلَّآ إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍۢ لَّمَحْجُوبُونَ ﴿15﴾", "ru": "Так нет же! Ведь они от своего Господа в тот день будут отделены."}], "n": "Что сказано: «Не постигает Его взоры, а Он постигает взоры» (6:103); Мусе: «Ты Меня не увидишь» (7:143). Но: «Лица в тот день сияющие, на Господа их взирающие» (75:22-23); неверные ⟦будут отделены от своего Господа⟧ (83:15) — понимается как лишение Его вида.\nВ чём проблема: в одних аятах взор не может постичь Бога, в других праведники на Него ⟦взирают⟧. Мусульманские богословы спорили столетиями: одни толкуют ⟦взирать⟧ как ожидание милости, другие — как действительное видение. Критики видят прямое расхождение. Дополнительно: у Бога ⟦лик⟧ и ⟦рука⟧ (см. раздел ⟦Образ Бога⟧).", "c": null, "x": ["42:11"], "t": "Можно ли увидеть Бога", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Взор Его не постигает» против «взирают на Господа» (75:22-23). Богословы спорили столетиями."}, {"n": "Что сказано: ⟦Что каждая душа приобретает, то остаётся на ней, и не понесёт носящая ноши другой⟧.\nВ чём проблема: личная ответственность. Спорит с 8:25 (⟦бойтесь испытания, которое постигнет не только несправедливых⟧), а также с 18:80-81, где мальчика убили за будущий грех, и с 29:40 о наказании целых народов.", "c": null, "x": ["8:25", "18:80-81", "29:40"], "refs": ["6:164"], "parts": [{"ref": "6:164", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "قُلْ أَغَيْرَ ٱللَّهِ أَبْغِى رَبًّۭا وَهُوَ رَبُّ كُلِّ شَىْءٍۢ ۚ وَلَا تَكْسِبُ كُلُّ نَفْسٍ إِلَّا عَلَيْهَا ۚ وَلَا تَزِرُ وَازِرَةٌۭ وِزْرَ أُخْرَىٰ ۚ ثُمَّ إِلَىٰ رَبِّكُم مَّرْجِعُكُمْ فَيُنَبِّئُكُم بِمَا كُنتُمْ فِيهِ تَخْتَلِفُونَ ﴿164﴾", "ru": "Скажи: \"Разве другого, чем Аллах, я буду искать Господом?\" Он - Господь всего. Что каждая душа приобретает, то остается на ней, и не понесет носящая ношу другой. А потом к Господу вашему ваше возвращение, и Он сообщит вам про то, в чем вы разногласили."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Личная ответственность против коллективного наказания (8:25)."}, {"n": "Что сказано: «Бойтесь испытания, которое постигнет не только тех из вас, которые несправедливы».\nВ чём проблема: коллективное наказание: страдать будут и невиновные. Противоречит 6:164 (⟦не понесёт носящая ноши другой⟧).", "c": "Противоречит 6:164.", "x": ["6:164"], "refs": ["8:25"], "parts": [{"ref": "8:25", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَٱتَّقُوا۟ فِتْنَةًۭ لَّا تُصِيبَنَّ ٱلَّذِينَ ظَلَمُوا۟ مِنكُمْ خَآصَّةًۭ ۖ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ ﴿25﴾", "ru": "Бойтесь испытания, которое постигнет не только тех из вас, которые несправедливы. И знайте, что Аллах силен в наказании!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Вторая половина пары 6:164."}, {"n": "Что сказано: ⟦Скажи: О вы, неверные! Я не стану поклоняться тому, чему вы поклоняетесь… У вас — ваша вера, и у меня — моя вера!⟧\nВ чём проблема: формула веротерпимости; противоречит 9:5, 9:29, 8:39 и 9:73. Классическое толкование: 109 отменена ⟦аятом меча⟧. Критики: тогда ⟦ваша вера, а моя⟧ — не принцип, а временная мера.", "c": "Сравните с 9:5, 9:29, 9:73.", "x": ["9:5", "9:29", "2:256"], "refs": ["109:1-6"], "parts": [{"ref": "109:1-6", "sura": "Al-Kaafiroon", "sura_ar": "سُورَةُ الكَافِرُونَ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ يَٰٓأَيُّهَا ٱلْكَٰفِرُونَ ﴿1﴾ لَآ أَعْبُدُ مَا تَعْبُدُونَ ﴿2﴾ وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُ ﴿3﴾ وَلَآ أَنَا۠ عَابِدٌۭ مَّا عَبَدتُّمْ ﴿4﴾ وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُ ﴿5﴾ لَكُمْ دِينُكُمْ وَلِىَ دِينِ ﴿6﴾", "ru": "(1) Скажи: \"О вы неверные! (2) Я не стану поклоняться тому, чему вы будете поклоняться, (3) и вы не поклоняйтесь тому, чему я буду поклоняться. (4) и я не поклоняюсь тому, чему вы поклонялись, (5) и вы не поклоняетесь тому, чему я буду поклоняться! (6) У вас - ваша вера, и у меня - моя вера!\""}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Вам ваша вера» расходится с 9:5, 9:29.; традиция говорит об отмене."}, {"n": "Что сказано: «Напоминай же, ведь ты — только напоминатель! Ты над ними не властитель».\nВ чём проблема: Пророк не «властитель» над неверными; противоречит 9:5, 9:29, где ему приказано воевать.", "c": "Сравните с 9:5, 9:29.", "x": ["9:5", "9:29"], "refs": ["88:21-22"], "parts": [{"ref": "88:21-22", "sura": "Al-Ghaashiya", "sura_ar": "سُورَةُ الغَاشِيَةِ", "type": "Meccan", "ar": "فَذَكِّرْ إِنَّمَآ أَنتَ مُذَكِّرٌۭ ﴿21﴾ لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ ﴿22﴾", "ru": "(21) Напоминай же, ведь ты - только напоминатель! (22) Ты над ними - не властитель,"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Ты не властитель» расходится с приказами воевать."}, {"n": "Что сказано: «Мы лучше знаем, что они говорят, и ты — не принудитель для них. Напоминай же Кораном».\nВ чём проблема: «не принудитель»; противоречит 9:5, 9:29, 9:73 (⟦борись… и будь суров⟧).", "c": null, "x": ["9:5", "9:73"], "refs": ["50:45"], "parts": [{"ref": "50:45", "sura": "Qaaf", "sura_ar": "سُورَةُ قٓ", "type": "Meccan", "ar": "نَّحْنُ أَعْلَمُ بِمَا يَقُولُونَ ۖ وَمَآ أَنتَ عَلَيْهِم بِجَبَّارٍۢ ۖ فَذَكِّرْ بِٱلْقُرْءَانِ مَن يَخَافُ وَعِيدِ ﴿45﴾", "ru": "Мы лучше знаем, что они говорят, и ты - не принудитель для них. Напоминай же Кораном тому, кто боится Моей угрозы!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Ты не принудитель» расходится с 9:5, 9:29, 9:73."}, {"n": "Что сказано: «Они спрашивают тебя о добыче. Скажи: Добыча принадлежит Аллаху и посланнику».\nВ чём проблема: вся добыча принадлежит Аллаху и посланнику, но 8:41 делит иначе: пятая часть Богу, остальное — воинам. 8:69 разрешает ⟦есть⟧ добычу.", "c": "Затем 8:41 делит добычу на пятую часть и остальное (бойцам), а 8:69 разрешает есть добычу.", "x": ["8:41", "8:69"], "refs": ["8:1"], "parts": [{"ref": "8:1", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَسْـَٔلُونَكَ عَنِ ٱلْأَنفَالِ ۖ قُلِ ٱلْأَنفَالُ لِلَّهِ وَٱلرَّسُولِ ۖ فَٱتَّقُوا۟ ٱللَّهَ وَأَصْلِحُوا۟ ذَاتَ بَيْنِكُمْ ۖ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥٓ إِن كُنتُم مُّؤْمِنِينَ ﴿1﴾", "ru": "Они спрашивают тебя о добыче. Скажи: \"Добыча принадлежит Аллаху и посланнику; бойтесь же Аллаха, упорядочите между собой и повинуйтесь Аллаху и Его посланнику, если вы веруете!\""}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Вся добыча Аллаху и посланнику» и пятая часть (8:41): расхождение, но 8:41 можно читать как уточнение."}, {"n": "Что сказано: «Если вы взяли что-либо в добычу, то Аллаху — пятая часть, и посланнику, и родственникам, и сиротам, и бедным, и путнику».\nВ чём проблема: противоречит 8:1 (⟦добыча принадлежит Аллаху и посланнику⟧): либо вся, либо пятая часть.", "c": "Противоречит 8:1, где вся добыча принадлежит Аллаху и посланнику.", "x": ["8:1"], "refs": ["8:41"], "parts": [{"ref": "8:41", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "۞ وَٱعْلَمُوٓا۟ أَنَّمَا غَنِمْتُم مِّن شَىْءٍۢ فَأَنَّ لِلَّهِ خُمُسَهُۥ وَلِلرَّسُولِ وَلِذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ إِن كُنتُمْ ءَامَنتُم بِٱللَّهِ وَمَآ أَنزَلْنَا عَلَىٰ عَبْدِنَا يَوْمَ ٱلْفُرْقَانِ يَوْمَ ٱلْتَقَى ٱلْجَمْعَانِ ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ ﴿41﴾", "ru": "И знайте, что если вы взяли что-либо в добычу, то Аллаху - пятая часть, и посланнику, и родственникам, и сиротам, и бедным, и путнику, если вы уверовали в Аллаха и в то, что Мы низвели Нашему рабу в день различения, в день, когда встретились два сборища. Поистине, Аллах мощен над всякой вещью!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Вторая половина пары 8:1."}, {"n": "Что сказано: ⟦Он — тот, который сотворил вам всё, что на земле, потом обратился к небу и устроил его семью небесами⟧.\nВ чём проблема: земля создана раньше неба. В 79:27-30 небо построено до того, как землю ⟦распростёр⟧.", "c": "Противоречит 79:27-30 (небо раньше земли).", "x": ["79:27-30", "41:9-12"], "refs": ["2:29"], "parts": [{"ref": "2:29", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "هُوَ ٱلَّذِى خَلَقَ لَكُم مَّا فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ ٱسْتَوَىٰٓ إِلَى ٱلسَّمَآءِ فَسَوَّىٰهُنَّ سَبْعَ سَمَٰوَٰتٍۢ ۚ وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌۭ ﴿29﴾", "ru": "Он - тот, который сотворил вам все, что на земле, потом обратился к небу и строил его из семи небес. Он о всякой вещи знающ!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Земля создана раньше неба, а 79:27-30 даёт обратный порядок."}, {"refs": ["2:185", "97:1", "44:3", "25:32", "17:106"], "parts": [{"ref": "2:185", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "شَهْرُ رَمَضَانَ ٱلَّذِىٓ أُنزِلَ فِيهِ ٱلْقُرْءَانُ هُدًۭى لِّلنَّاسِ وَبَيِّنَٰتٍۢ مِّنَ ٱلْهُدَىٰ وَٱلْفُرْقَانِ ۚ فَمَن شَهِدَ مِنكُمُ ٱلشَّهْرَ فَلْيَصُمْهُ ۖ وَمَن كَانَ مَرِيضًا أَوْ عَلَىٰ سَفَرٍۢ فَعِدَّةٌۭ مِّنْ أَيَّامٍ أُخَرَ ۗ يُرِيدُ ٱللَّهُ بِكُمُ ٱلْيُسْرَ وَلَا يُرِيدُ بِكُمُ ٱلْعُسْرَ وَلِتُكْمِلُوا۟ ٱلْعِدَّةَ وَلِتُكَبِّرُوا۟ ٱللَّهَ عَلَىٰ مَا هَدَىٰكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ ﴿185﴾", "ru": "Месяц рамадан, в который ниспослан был Коран в руководство для людей и как разъяснение прямого пути и различения, - и вот, кто из вас застанет этот месяц, пусть проводит его в посту, а кто болен или в пути, то - число других дней. Аллах хочет для вас облегчения, а не хочет затруднения для вас, и чтобы вы завершили и возвеличили Аллаха за то, что Он вывел вас, - может быть, вы будите благодарны!"}, {"ref": "97:1", "sura": "Al-Qadr", "sura_ar": "سُورَةُ القَدۡرِ", "type": "Meccan", "ar": "بِّسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ إِنَّآ أَنزَلْنَٰهُ فِى لَيْلَةِ ٱلْقَدْرِ ﴿1﴾", "ru": "Поистине, Мы ниспослали его в ночь могущества!"}, {"ref": "44:3", "sura": "Ad-Dukhaan", "sura_ar": "سُورَةُ الدُّخَانِ", "type": "Meccan", "ar": "إِنَّآ أَنزَلْنَٰهُ فِى لَيْلَةٍۢ مُّبَٰرَكَةٍ ۚ إِنَّا كُنَّا مُنذِرِينَ ﴿3﴾", "ru": "Мы ниспослали его в ночь благословенную; поистине, Мы являемся увещателями!"}, {"ref": "25:32", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "وَقَالَ ٱلَّذِينَ كَفَرُوا۟ لَوْلَا نُزِّلَ عَلَيْهِ ٱلْقُرْءَانُ جُمْلَةًۭ وَٰحِدَةًۭ ۚ كَذَٰلِكَ لِنُثَبِّتَ بِهِۦ فُؤَادَكَ ۖ وَرَتَّلْنَٰهُ تَرْتِيلًۭا ﴿32﴾", "ru": "И сказали те, которые не веруют: \"Чтобы был ему ниспослан Коран за один раз!\" Так это - для того, чтобы укрепить им твое сердце, и Мы читали его по порядку."}, {"ref": "17:106", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡ
