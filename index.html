ется то, что сотворил Аллах с их утробами, если они веруют в Аллаха и в последний день. А мужьям их - достойнее их вернуть при этом, если они желают умиротворения. И для них - то же самое, что и на них, согласно принятому. Мужьям над ними - степень. Поистине, Аллах - великий, мудрый!", "n": "Для разведённых — срок ожидания; у мужчин над ними степень.", "c": null}, {"ref": "2:282", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰٓ أَجَلٍۢ مُّسَمًّۭى فَٱكْتُبُوهُ ۚ وَلْيَكْتُب بَّيْنَكُمْ كَاتِبٌۢ بِٱلْعَدْلِ ۚ وَلَا يَأْبَ كَاتِبٌ أَن يَكْتُبَ كَمَا عَلَّمَهُ ٱللَّهُ ۚ فَلْيَكْتُبْ وَلْيُمْلِلِ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ وَلَا يَبْخَسْ مِنْهُ شَيْـًۭٔا ۚ فَإِن كَانَ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ سَفِيهًا أَوْ ضَعِيفًا أَوْ لَا يَسْتَطِيعُ أَن يُمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهُۥ بِٱلْعَدْلِ ۚ وَٱسْتَشْهِدُوا۟ شَهِيدَيْنِ مِن رِّجَالِكُمْ ۖ فَإِن لَّمْ يَكُونَا رَجُلَيْنِ فَرَجُلٌۭ وَٱمْرَأَتَانِ مِمَّن تَرْضَوْنَ مِنَ ٱلشُّهَدَآءِ أَن تَضِلَّ إِحْدَىٰهُمَا فَتُذَكِّرَ إِحْدَىٰهُمَا ٱلْأُخْرَىٰ ۚ وَلَا يَأْبَ ٱلشُّهَدَآءُ إِذَا مَا دُعُوا۟ ۚ وَلَا تَسْـَٔمُوٓا۟ أَن تَكْتُبُوهُ صَغِيرًا أَوْ كَبِيرًا إِلَىٰٓ أَجَلِهِۦ ۚ ذَٰلِكُمْ أَقْسَطُ عِندَ ٱللَّهِ وَأَقْوَمُ لِلشَّهَٰدَةِ وَأَدْنَىٰٓ أَلَّا تَرْتَابُوٓا۟ ۖ إِلَّآ أَن تَكُونَ تِجَٰرَةً حَاضِرَةًۭ تُدِيرُونَهَا بَيْنَكُمْ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَلَّا تَكْتُبُوهَا ۗ وَأَشْهِدُوٓا۟ إِذَا تَبَايَعْتُمْ ۚ وَلَا يُضَآرَّ كَاتِبٌۭ وَلَا شَهِيدٌۭ ۚ وَإِن تَفْعَلُوا۟ فَإِنَّهُۥ فُسُوقٌۢ بِكُمْ ۗ وَٱتَّقُوا۟ ٱللَّهَ ۖ وَيُعَلِّمُكُمُ ٱللَّهُ ۗ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌۭ ﴿282﴾", "ru": "О вы, которые уверовали! Если берете в долг между собой на определенный срок, то записывайте это. И пусть записывает между вами писец по справедливости. И пусть не отказывается писец написать так, как научил его Аллах, и пусть он пишет, и пусть диктует тот, на котором обязательство. И пусть он боится Аллаха, Господа своего, и пусть не убавляет там ничего. А если тот, на ком обязательство, малоумен или слаб, или не может сам диктовать, то пусть диктует его близкий по справедливости. И берите в свидетели двух из ваших мужчин. А если не будет двух мужчин, то - мужчину и двух женщин, на которых вы согласны, как свидетелей, чтобы если собьется одна, то напомнила бы ей другая. И пусть не отказываются свидетели, когда их зовут; и пусть не наскучивает вам записывать его - малым или большим - до его срока. Это - справедливее пред Аллахом, и прямее для свидетельства, и ближе, чтобы вам не сомневаться. Разве только, если это будет торговлей наличной, которую вы обращаете между собой, - тогда на вас не будет греха, что вы не запишете этого. И ставьте свидетелей, когда уславливаетесь между собой, и не должно причинять неприятности писцу и свидетелю; а если сделаете, то это - распутство у вас. И бойтесь Аллаха; поистине, Аллах вас учит, и Аллах знает о всякой вещи!", "n": "В долговом документе свидетельство двух женщин приравнивается к свидетельству одного мужчины — если одна заблудится, другая напомнит.", "c": "Традиционное объяснение — меньший опыт женщин в торговле в VII веке; критики видят здесь закреплённое неравенство."}, {"ref": "4:11", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يُوصِيكُمُ ٱللَّهُ فِىٓ أَوْلَٰدِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ ٱلْأُنثَيَيْنِ ۚ فَإِن كُنَّ نِسَآءًۭ فَوْقَ ٱثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ ۖ وَإِن كَانَتْ وَٰحِدَةًۭ فَلَهَا ٱلنِّصْفُ ۚ وَلِأَبَوَيْهِ لِكُلِّ وَٰحِدٍۢ مِّنْهُمَا ٱلسُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُۥ وَلَدٌۭ ۚ فَإِن لَّمْ يَكُن لَّهُۥ وَلَدٌۭ وَوَرِثَهُۥٓ أَبَوَاهُ فَلِأُمِّهِ ٱلثُّلُثُ ۚ فَإِن كَانَ لَهُۥٓ إِخْوَةٌۭ فَلِأُمِّهِ ٱلسُّدُسُ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصِى بِهَآ أَوْ دَيْنٍ ۗ ءَابَآؤُكُمْ وَأَبْنَآؤُكُمْ لَا تَدْرُونَ أَيُّهُمْ أَقْرَبُ لَكُمْ نَفْعًۭا ۚ فَرِيضَةًۭ مِّنَ ٱللَّهِ ۗ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿11﴾", "ru": "Завещает вам Аллах относительно ваших детей: сыну - долю, подобную доле двух дочерей. А если они (дети)- женщины, числом больше двух, то им - две трети того, что он оставил, а если одна, то ей - половина. А родителям его, каждому из двух - одна шестая того, что он оставил, если у него есть ребенок. А если у него нет ребенка и ему наследуют его родители, то матери - одна треть. А если есть у него братья, то матери - одна шестая после завещанного, которой он завещает, или долга. Родители ваши или ваши сыновья - вы не знаете, кто из них ближе вам по пользе, как установлено Аллахом. Поистине, Аллах знающ, мудр!", "n": "Наследство: мужчине — доля двух женщин.", "c": "Апологеты указывают на то, что мужчина обязан содержать семью."}, {"ref": "4:3", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَإِنْ خِفْتُمْ أَلَّا تُقْسِطُوا۟ فِى ٱلْيَتَٰمَىٰ فَٱنكِحُوا۟ مَا طَابَ لَكُم مِّنَ ٱلنِّسَآءِ مَثْنَىٰ وَثُلَٰثَ وَرُبَٰعَ ۖ فَإِنْ خِفْتُمْ أَلَّا تَعْدِلُوا۟ فَوَٰحِدَةً أَوْ مَا مَلَكَتْ أَيْمَٰنُكُمْ ۚ ذَٰلِكَ أَدْنَىٰٓ أَلَّا تَعُولُوا۟ ﴿3﴾", "ru": "А если вы боитесь, что не будете справедливы с сиротами, то женитесь на тех, что приятны вам, женщинах - и двух, и трех, и четырех. А если боитесь, что не будете справедливы, то - на одной или на тех, которыми овладели ваши десницы. Это - ближе, чтобы не уклониться", "n": "Разрешение многожёнства — до четырёх жён (плюс то, чем овладели ваши десницы, см. раздел о рабстве).", "c": "Условие справедливости в 4:129 считают почти невыполнимым; на практике правило действует."}, {"ref": "65:4", "sura": "At-Talaaq", "sura_ar": "سُورَةُ الطَّلَاقِ", "type": "Medinan", "ar": "وَٱلَّٰٓـِٔى يَئِسْنَ مِنَ ٱلْمَحِيضِ مِن نِّسَآئِكُمْ إِنِ ٱرْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَٰثَةُ أَشْهُرٍۢ وَٱلَّٰٓـِٔى لَمْ يَحِضْنَ ۚ وَأُو۟لَٰتُ ٱلْأَحْمَالِ أَجَلُهُنَّ أَن يَضَعْنَ حَمْلَهُنَّ ۚ وَمَن يَتَّقِ ٱللَّهَ يَجْعَل لَّهُۥ مِنْ أَمْرِهِۦ يُسْرًۭا ﴿4﴾", "ru": "А те из ваших жен, которые уже отчаялись в месячных - если вы сомневаетесь, то их срок - три месяца, как и для тех, у которых еще не было месячных; а у которых ноша - их срок , чтобы они сложили свою ношу. Кто боится Аллаха, тому Он устроит в Своем деле легкость.", "n": "Срок ожидания после развода установлен и для тех, «у которых ещё не было месячных» — классические комментаторы понимают это как норму для девочек-подростков, состоявших в браке.", "c": "Современные апологеты оспаривают такое прочтение; но оно было общепринятым в классической традиции."}, {"ref": "2:229", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱلطَّلَٰقُ مَرَّتَانِ ۖ فَإِمْسَاكٌۢ بِمَعْرُوفٍ أَوْ تَسْرِيحٌۢ بِإِحْسَٰنٍۢ ۗ وَلَا يَحِلُّ لَكُمْ أَن تَأْخُذُوا۟ مِمَّآ ءَاتَيْتُمُوهُنَّ شَيْـًٔا إِلَّآ أَن يَخَافَآ أَلَّا يُقِيمَا حُدُودَ ٱللَّهِ ۖ فَإِنْ خِفْتُمْ أَلَّا يُقِيمَا حُدُودَ ٱللَّهِ فَلَا جُنَاحَ عَلَيْهِمَا فِيمَا ٱفْتَدَتْ بِهِۦ ۗ تِلْكَ حُدُودُ ٱللَّهِ فَلَا تَعْتَدُوهَا ۚ وَمَن يَتَعَدَّ حُدُودَ ٱللَّهِ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ ﴿229﴾", "ru": "Развод двукратен: после него - либо удержать, согласно обычаю, либо отпустить с благодеянием. И не дозволяется вам брать из того, что вы им даровали, ничего. Разве только они оба боятся не выполнить ограничений Аллаха. А если вы боитесь, что они не выполнят ограничений Аллаха, то не будет греха над ними в том, чем она себя выкупит. Таковы границы Аллаха, не преступайте же их, а если кто преступает границы Аллаха, те - неправедные.", "n": "Развод: муж может отпустить жену; если жена хочет уйти, она может выкупиться (вернуть дар). Права на развод у мужа и жены разные.", "c": null}, {"ref": "2:234", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱلَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجًۭا يَتَرَبَّصْنَ بِأَنفُسِهِنَّ أَرْبَعَةَ أَشْهُرٍۢ وَعَشْرًۭا ۖ فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَلَا جُنَاحَ عَلَيْكُمْ فِيمَا فَعَلْنَ فِىٓ أَنفُسِهِنَّ بِٱلْمَعْرُوفِ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌۭ ﴿234﴾", "ru": "А те из вас, что упокоятся и оставят жен, - они выжидают сами с собой четыре месяца и десять. А когда они достигнут своего предела, то нет греха над вами в том, что они будут делать сами с собой согласно обычаю. Поистине, Аллах - сведущ в том, что вы делаете!", "n": "Вдовы ждут четыре месяца и десять дней; для вдовцов подобного срока нет.", "c": null}, {"ref": "4:12", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "۞ وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَٰجُكُمْ إِن لَّمْ يَكُن لَّهُنَّ وَلَدٌۭ ۚ فَإِن كَانَ لَهُنَّ وَلَدٌۭ فَلَكُمُ ٱلرُّبُعُ مِمَّا تَرَكْنَ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصِينَ بِهَآ أَوْ دَيْنٍۢ ۚ وَلَهُنَّ ٱلرُّبُعُ مِمَّا تَرَكْتُمْ إِن لَّمْ يَكُن لَّكُمْ وَلَدٌۭ ۚ فَإِن كَانَ لَكُمْ وَلَدٌۭ فَلَهُنَّ ٱلثُّمُنُ مِمَّا تَرَكْتُم ۚ مِّنۢ بَعْدِ وَصِيَّةٍۢ تُوصُونَ بِهَآ أَوْ دَيْنٍۢ ۗ وَإِن كَانَ رَجُلٌۭ يُورَثُ كَلَٰلَةً أَوِ ٱمْرَأَةٌۭ وَلَهُۥٓ أَخٌ أَوْ أُخْتٌۭ فَلِكُلِّ وَٰحِدٍۢ مِّنْهُمَا ٱلسُّدُسُ ۚ فَإِن كَانُوٓا۟ أَكْثَرَ مِن ذَٰلِكَ فَهُمْ شُرَكَآءُ فِى ٱلثُّلُثِ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصَىٰ بِهَآ أَوْ دَيْنٍ غَيْرَ مُضَآرٍّۢ ۚ وَصِيَّةًۭ مِّنَ ٱللَّهِ ۗ وَٱللَّهُ عَلِيمٌ حَلِيمٌۭ ﴿12﴾", "ru": "И вам - половина того, что оставили ваши супруги, если у них нет ребенка. А если у них есть ребенок, то вам - четверть того, что они оставили после завещанного, которое они завещают, или долга. А им - четверть того, что оставили вы, если у вас нет ребенка. А если у вас есть ребенок, то им - одна восьмая того, что оставили вы после завещанного, которое вы завещаете, или долга. А если мужчина бывает наследником по боковой линии, или женщина, и у него есть брат или сестра, то каждому из них обоих - одна шестая. А если их больше этого, то они - соучастники в трети после завещанного, которое он завещает, или долга, не причиняя вреда, по завету от Аллаха. Поистине, Аллах - знающий, кроткий!", "n": "Муж наследует половину имущества жены (если нет детей), жена мужа — лишь четверть.", "c": null}, {"ref": "4:19", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا يَحِلُّ لَكُمْ أَن تَرِثُوا۟ ٱلنِّسَآءَ كَرْهًۭا ۖ وَلَا تَعْضُلُوهُنَّ لِتَذْهَبُوا۟ بِبَعْضِ مَآ ءَاتَيْتُمُوهُنَّ إِلَّآ أَن يَأْتِينَ بِفَٰحِشَةٍۢ مُّبَيِّنَةٍۢ ۚ وَعَاشِرُوهُنَّ بِٱلْمَعْرُوفِ ۚ فَإِن كَرِهْتُمُوهُنَّ فَعَسَىٰٓ أَن تَكْرَهُوا۟ شَيْـًۭٔا وَيَجْعَلَ ٱللَّهُ فِيهِ خَيْرًۭا كَثِيرًۭا ﴿19﴾", "ru": "О вы, которые уверовали! Не разрешается вам наследовать женам по принуждению. И не препятствуйте им уносить часть того, что вы им даровали, разве что они совершат мерзость очевидную. Обходитесь с ними достойно. Если же вы их ненавидите, то, может быть, что-либо вам и ненавистно, а Аллах устроил в этом великое благо.", "n": "«Не разрешается вам наследовать женам по принуждению» — аят свидетельствует, что жён наследовали как имущество; он же допускает стеснять их, «разве что они совершат мерзость очевидную».", "c": null}, {"ref": "24:31", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَقُل لِّلْمُؤْمِنَٰتِ يَغْضُضْنَ مِنْ أَبْصَٰرِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا مَا ظَهَرَ مِنْهَا ۖ وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَىٰ جُيُوبِهِنَّ ۖ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا لِبُعُولَتِهِنَّ أَوْ ءَابَآئِهِنَّ أَوْ ءَابَآءِ بُعُولَتِهِنَّ أَوْ أَبْنَآئِهِنَّ أَوْ أَبْنَآءِ بُعُولَتِهِنَّ أَوْ إِخْوَٰنِهِنَّ أَوْ بَنِىٓ إِخْوَٰنِهِنَّ أَوْ بَنِىٓ أَخَوَٰتِهِنَّ أَوْ نِسَآئِهِنَّ أَوْ مَا مَلَكَتْ أَيْمَٰنُهُنَّ أَوِ ٱلتَّٰبِعِينَ غَيْرِ أُو۟لِى ٱلْإِرْبَةِ مِنَ ٱلرِّجَالِ أَوِ ٱلطِّفْلِ ٱلَّذِينَ لَمْ يَظْهَرُوا۟ عَلَىٰ عَوْرَٰتِ ٱلنِّسَآءِ ۖ وَلَا يَضْرِبْنَ بِأَرْجُلِهِنَّ لِيُعْلَمَ مَا يُخْفِينَ مِن زِينَتِهِنَّ ۚ وَتُوبُوٓا۟ إِلَى ٱللَّهِ جَمِيعًا أَيُّهَ ٱلْمُؤْمِنُونَ لَعَلَّكُمْ تُفْلِحُونَ ﴿31﴾", "ru": "И скажи [женщинам] верующим: пусть они потупляют свои взоры, и охраняют свои члены, и пусть не показывают своих украшений, разве только то, что видно из них, пусть набрасывают свои покрывала на разрезы на груди, пусть не показывают своих украшений, разве только своим мужьям, или своим отцам, или отцам своих мужей, или своим сыновьям, или сыновьям своих мужей, или своим братьям, или сыновьям своих братьев, или сыновьям своих сестер, или своим женщинам, или тем, чем овладели их десницы, или слугам из мужчин, которые не обладают желанием, или детям, которые не постигли наготы женщин; и пусть не бьют своими ногами, так чтобы узнавали, какие они скрывают украшения. Обратитесь все к Аллаху, о верующие, - может быть, вы окажетесь счастливыми!", "n": "Женщинам приказано потуплять взоры, скрывать украшения и набросить покрывала на вырез; мужчинам — только потуплять взоры (24:30).", "c": null}, {"ref": "33:33", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "وَقَرْنَ فِى بُيُوتِكُنَّ وَلَا تَبَرَّجْنَ تَبَرُّجَ ٱلْجَٰهِلِيَّةِ ٱلْأُولَىٰ ۖ وَأَقِمْنَ ٱلصَّلَوٰةَ وَءَاتِينَ ٱلزَّكَوٰةَ وَأَطِعْنَ ٱللَّهَ وَرَسُولَهُۥٓ ۚ إِنَّمَا يُرِيدُ ٱللَّهُ لِيُذْهِبَ عَنكُمُ ٱلرِّجْسَ أَهْلَ ٱلْبَيْتِ وَيُطَهِّرَكُمْ تَطْهِيرًۭا ﴿33﴾", "ru": "Пребывайте в своих домах и не украшайтесь украшениями первого неведения. Выстаивайте молитву, давайте очищение и повинуйтесь Аллаху и Его посланнику. Аллах хочет удалить скверну от вас, семьи его дома и очистить вас очищением.", "n": "Жёнам Пророка: Оставайтесь в ваших домах и не выставляйтесь напоказ.", "c": null}, {"ref": "33:59", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ قُل لِّأَزْوَٰجِكَ وَبَنَاتِكَ وَنِسَآءِ ٱلْمُؤْمِنِينَ يُدْنِينَ عَلَيْهِنَّ مِن جَلَٰبِيبِهِنَّ ۚ ذَٰلِكَ أَدْنَىٰٓ أَن يُعْرَفْنَ فَلَا يُؤْذَيْنَ ۗ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًۭا ﴿59﴾", "ru": "О пророк, скажи твоим женам, дочерям и женщинам верующих, пусть они сближают на себе свои покрывала. Это лучше, чем их узнают; и не испытают они оскорбления. Аллах прощающ, милосерд!", "n": "Приказ женам, дочерям и женщинам верующих сближать на себе свои покрывала: «Это лучше, чем их узнают; и не испытают они оскорбления» — ответственность за домогательства переложена на одежду женщины.", "c": null}, {"ref": "43:18", "sura": "Az-Zukhruf", "sura_ar": "سُورَةُ الزُّخۡرُفِ", "type": "Meccan", "ar": "أَوَمَن يُنَشَّؤُا۟ فِى ٱلْحِلْيَةِ وَهُوَ فِى ٱلْخِصَامِ غَيْرُ مُبِينٍۢ ﴿18﴾", "ru": "Разве же тот, кто выращен в украшениях и кто в препирательстве, не ясен?", "n": "«Разве же тот, кто выращен в украшениях и кто в препирательстве не ясен?» (о дочерях, которых многобожники приписывали Богу): женщина описана как существо украшений и неясной речи.", "c": "Аят направлен против идолопоклонников, но использует уничижительный образ женщины."}, {"ref": "53:21-22", "sura": "An-Najm", "sura_ar": "سُورَةُ النَّجۡمِ", "type": "Meccan", "ar": "أَلَكُمُ ٱلذَّكَرُ وَلَهُ ٱلْأُنثَىٰ ﴿21﴾ تِلْكَ إِذًۭا قِسْمَةٌۭ ضِيزَىٰٓ ﴿22﴾", "ru": "(21) Неужели у вас - мужчины, а у Него - женщины? (22) Это тогда - разделение обидное!", "n": "«Неужели у вас — мужчины, а у Него — женщины? Это тогда — разделение обидное!» — женский пол используется как довод против приписывания Богу дочерей.", "c": null}]}, {"id": "family", "title": "Брак, родство и семья", "icon": "♡", "group": "Люди и общество", "intro": "Нормы о том, на ком можно и нельзя жениться, о приёмных детях и о разводе. Отдельно в разделе «Особые права и упрёки Пророку» — его собственные браки.", "verses": [{"ref": "4:22", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَلَا تَنكِحُوا۟ مَا نَكَحَ ءَابَآؤُكُم مِّنَ ٱلنِّسَآءِ إِلَّا مَا قَدْ سَلَفَ ۚ إِنَّهُۥ كَانَ فَٰحِشَةًۭ وَمَقْتًۭا وَسَآءَ سَبِيلًا ﴿22﴾", "ru": "Не женитесь на тех женщинах, на которых были женаты ваши отцы, разве только это произошло раньше. Поистине, это - мерзость и отвращение и скверно как путь!", "n": "Запрет жениться на бывших жёнах отцов (кроме того, что было): такие браки существовали у арабов до ислама.", "c": null}, {"ref": "4:23", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "حُرِّمَتْ عَلَيْكُمْ أُمَّهَٰتُكُمْ وَبَنَاتُكُمْ وَأَخَوَٰتُكُمْ وَعَمَّٰتُكُمْ وَخَٰلَٰتُكُمْ وَبَنَاتُ ٱلْأَخِ وَبَنَاتُ ٱلْأُخْتِ وَأُمَّهَٰتُكُمُ ٱلَّٰتِىٓ أَرْضَعْنَكُمْ وَأَخَوَٰتُكُم مِّنَ ٱلرَّضَٰعَةِ وَأُمَّهَٰتُ نِسَآئِكُمْ وَرَبَٰٓئِبُكُمُ ٱلَّٰتِى فِى حُجُورِكُم مِّن نِّسَآئِكُمُ ٱلَّٰتِى دَخَلْتُم بِهِنَّ فَإِن لَّمْ تَكُونُوا۟ دَخَلْتُم بِهِنَّ فَلَا جُنَاحَ عَلَيْكُمْ وَحَلَٰٓئِلُ أَبْنَآئِكُمُ ٱلَّذِينَ مِنْ أَصْلَٰبِكُمْ وَأَن تَجْمَعُوا۟ بَيْنَ ٱلْأُخْتَيْنِ إِلَّا مَا قَدْ سَلَفَ ۗ إِنَّ ٱللَّهَ كَانَ غَفُورًۭا رَّحِيمًۭا ﴿23﴾", "ru": "И запрещены вам ваши матери, и ваши дочери, и ваши сестры, и ваши тетки по отцу и матери, и дочери брата, и дочери сестры, и ваши матери, которые вас вскормили, и ваши сестры по кормлению, и матери ваших жен, и ваши воспитанницы, которые под вашим покровительством от ваших жен, к которым вы уже вошли; а если вы еще не вошли к ним, то нет греха на вас; и жены ваших сыновей, которые от ваших чресел; и - объединять двух сестер, если это не было раньше. Поистине, Аллах прощающ, милосерд!", "n": "Перечень запретных родственниц: матери, дочери, сёстры, тётки, племянницы, молочные матери и сёстры, тёщи, падчерицы, жёны родных сыновей, две сестры одновременно. Двоюродные сёстры в запрет не входят (в 33:50 прямо разрешены), хотя современная генетика связывает такие браки с повышенным риском наследственных болезней.", "c": "В VII веке браки между двоюродными были нормой; молочное родство расширяет круг запретов."}, {"ref": "33:4", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "مَّا جَعَلَ ٱللَّهُ لِرَجُلٍۢ مِّن قَلْبَيْنِ فِى جَوْفِهِۦ ۚ وَمَا جَعَلَ أَزْوَٰجَكُمُ ٱلَّٰٓـِٔى تُظَٰهِرُونَ مِنْهُنَّ أُمَّهَٰتِكُمْ ۚ وَمَا جَعَلَ أَدْعِيَآءَكُمْ أَبْنَآءَكُمْ ۚ ذَٰلِكُمْ قَوْلُكُم بِأَفْوَٰهِكُمْ ۖ وَٱللَّهُ يَقُولُ ٱلْحَقَّ وَهُوَ يَهْدِى ٱلسَّبِيلَ ﴿4﴾", "ru": "Не устроил Аллах для человека двух сердец внутри, и не сделал ваших жен, которых вы называете хребтом матери, вашими матерями , и не сделал ваших приемышей вашими сыновьями. Это - только ваши слова в ваших устах, а Аллах говорит истину, и Он ведет по пути.", "n": "Не сделал Он ваших приёмышей вашими сыновьями — отмена усыновления, которая ввела новый порядок наследования и брака.", "c": null}, {"ref": "33:5", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "ٱدْعُوهُمْ لِءَابَآئِهِمْ هُوَ أَقْسَطُ عِندَ ٱللَّهِ ۚ فَإِن لَّمْ تَعْلَمُوٓا۟ ءَابَآءَهُمْ فَإِخْوَٰنُكُمْ فِى ٱلدِّينِ وَمَوَٰلِيكُمْ ۚ وَلَيْسَ عَلَيْكُمْ جُنَاحٌۭ فِيمَآ أَخْطَأْتُم بِهِۦ وَلَٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْ ۚ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًا ﴿5﴾", "ru": "Возводите их к их отцам, это - более справедливее у Аллаха, а если не знаете их отцов, то это - ваши братья в вере и ваши близкие. Нет на вас греха, в чем вы ошиблись, а только в том, что замышляли ваши сердца. Аллах - прощающий, милосердный!", "n": "Приёмных детей надо называть по отцам; если вы не знаете их отцов — они ваши братья по религии.", "c": null}, {"ref": "33:6", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "ٱلنَّبِىُّ أَوْلَىٰ بِٱلْمُؤْمِنِينَ مِنْ أَنفُسِهِمْ ۖ وَأَزْوَٰجُهُۥٓ أُمَّهَٰتُهُمْ ۗ وَأُو۟لُوا۟ ٱلْأَرْحَامِ بَعْضُهُمْ أَوْلَىٰ بِبَعْضٍۢ فِى كِتَٰبِ ٱللَّهِ مِنَ ٱلْمُؤْمِنِينَ وَٱلْمُهَٰجِرِينَ إِلَّآ أَن تَفْعَلُوٓا۟ إِلَىٰٓ أَوْلِيَآئِكُم مَّعْرُوفًۭا ۚ كَانَ ذَٰلِكَ فِى ٱلْكِتَٰبِ مَسْطُورًۭا ﴿6﴾", "ru": "Пророк ближе в верующим, чем они сами, а супруги его - их матери. И обладатели родства - одни ближе к другим по книге Аллаха, чем верующие и чем мухаджиры. Разве вы сделаете добро своим близким? Это в книге начертано.", "n": "Пророк ближе к верующим, чем они сами; а его жёны — их матери — поэтому на них нельзя жениться (см. 33:53).", "c": null}, {"ref": "33:40", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "مَّا كَانَ مُحَمَّدٌ أَبَآ أَحَدٍۢ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ ٱللَّهِ وَخَاتَمَ ٱلنَّبِيِّۦنَ ۗ وَكَانَ ٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمًۭا ﴿40﴾", "ru": "Мухаммад не был отцом кого-либо из ваших мужчин, а только - посланником Аллаха и пророков. Аллах знает всякую вещь!", "n": "Мухаммад — не отец никому из ваших мужчин — аят стоит рядом с историей женитьбы на жене приёмного сына Зайда (33:37).", "c": null}, {"ref": "2:221", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَلَا تَنكِحُوا۟ ٱلْمُشْرِكَٰتِ حَتَّىٰ يُؤْمِنَّ ۚ وَلَأَمَةٌۭ مُّؤْمِنَةٌ خَيْرٌۭ مِّن مُّشْرِكَةٍۢ وَلَوْ أَعْجَبَتْكُمْ ۗ وَلَا تُنكِحُوا۟ ٱلْمُشْرِكِينَ حَتَّىٰ يُؤْمِنُوا۟ ۚ وَلَعَبْدٌۭ مُّؤْمِنٌ خَيْرٌۭ مِّن مُّشْرِكٍۢ وَلَوْ أَعْجَبَكُمْ ۗ أُو۟لَٰٓئِكَ يَدْعُونَ إِلَى ٱلنَّارِ ۖ وَٱللَّهُ يَدْعُوٓا۟ إِلَى ٱلْجَنَّةِ وَٱلْمَغْفِرَةِ بِإِذْنِهِۦ ۖ وَيُبَيِّنُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَ ﴿221﴾", "ru": "Не женитесь на многобожницах, пока они не уверуют: конечно, верующая рабыня лучше многобожницы, хотя бы она и восторгала вас. И не выдавайте замуж за многобожников, пока они не уверуют: конечно, верующий раб - лучше многобожника, хотя бы он и восторгал вас. Эти зовут к огню, а Аллах зовет к раю и прощению со Своего дозволения и разъясняет Свои знамения людям, - может быть, они опомнятся!", "n": "Запрет жениться на многобожницах и выдавать замуж за многобожников: верующая рабыня лучше многобожницы, «хотя бы она и восторгала вас».", "c": null}, {"ref": "5:5", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "ٱلْيَوْمَ أُحِلَّ لَكُمُ ٱلطَّيِّبَٰتُ ۖ وَطَعَامُ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ حِلٌّۭ لَّكُمْ وَطَعَامُكُمْ حِلٌّۭ لَّهُمْ ۖ وَٱلْمُحْصَنَٰتُ مِنَ ٱلْمُؤْمِنَٰتِ وَٱلْمُحْصَنَٰتُ مِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ مِن قَبْلِكُمْ إِذَآ ءَاتَيْتُمُوهُنَّ أُجُورَهُنَّ مُحْصِنِينَ غَيْرَ مُسَٰفِحِينَ وَلَا مُتَّخِذِىٓ أَخْدَانٍۢ ۗ وَمَن يَكْفُرْ بِٱلْإِيمَٰنِ فَقَدْ حَبِطَ عَمَلُهُۥ وَهُوَ فِى ٱلْءَاخِرَةِ مِنَ ٱلْخَٰسِرِينَ ﴿5﴾", "ru": "Сегодня разрешены вам блага; и пища тех, кому даровано писание, разрешается вам и ваша пища разрешается им. И целомудренные из верующих и целомудренные из тех, кому даровано писание до вас, если вы им дали их вознаграждение, будучи целомудренными, не распутничая и не беря наложниц. А если кто отрекся от веры, то у него - дело тщетно, и он в последней жизни - в числе потерпевших убыток\".", "n": "Мужчинам-мусульманам разрешены женщины из людей Писания; обратное (мусульманка и христианин) в тексте не разрешено — запрет выводится традицией.", "c": null}, {"ref": "24:3", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "ٱلزَّانِى لَا يَنكِحُ إِلَّا زَانِيَةً أَوْ مُشْرِكَةًۭ وَٱلزَّانِيَةُ لَا يَنكِحُهَآ إِلَّا زَانٍ أَوْ مُشْرِكٌۭ ۚ وَحُرِّمَ ذَٰلِكَ عَلَى ٱلْمُؤْمِنِينَ ﴿3﴾", "ru": "Прелюбодей женится только на прелюбодейке или многобожнице, а прелюбодейка - на ней женится только прелюбодей или многобожник. И запрещено это для верующих.", "n": "Прелюбодей женится только на прелюбодейке или многобожнице… а верующим это запрещено.", "c": null}, {"ref": "2:230", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "فَإِن طَلَّقَهَا فَلَا تَحِلُّ لَهُۥ مِنۢ بَعْدُ حَتَّىٰ تَنكِحَ زَوْجًا غَيْرَهُۥ ۗ فَإِن طَلَّقَهَا فَلَا جُنَاحَ عَلَيْهِمَآ أَن يَتَرَاجَعَآ إِن ظَنَّآ أَن يُقِيمَا حُدُودَ ٱللَّهِ ۗ وَتِلْكَ حُدُودُ ٱللَّهِ يُبَيِّنُهَا لِقَوْمٍۢ يَعْلَمُونَ ﴿230﴾", "ru": "Если же он дал развод ей (в третий раз), то не разрешается она ему после, пока не выйдет она за другого мужа, а если тот дал ей развод, то нет греха над ними, что они вернутся, если думают выполнить ограничения Аллаха. И вот границы Аллаха; Он разъясняет их людям, которые обладают знанием.", "n": "Трижды разведённую нельзя вернуть мужу, пока она не выйдет за другого и не разведётся с ним — на этом основан обычай халяла (фиктивный брак для возврата жены).", "c": null}, {"ref": "2:222", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَيَسْـَٔلُونَكَ عَنِ ٱلْمَحِيضِ ۖ قُلْ هُوَ أَذًۭى فَٱعْتَزِلُوا۟ ٱلنِّسَآءَ فِى ٱلْمَحِيضِ ۖ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ يَطْهُرْنَ ۖ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ ٱللَّهُ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلتَّوَّٰبِينَ وَيُحِبُّ ٱلْمُتَطَهِّرِينَ ﴿222﴾", "ru": "Они спрашивают тебя о менструациях. Скажи: \"Это - страдание\". Отдаляйтесь же от женщин при менструациях и не приближайтесь к ним, пока они не очистятся. А когда они очистятся, то приходите к ним так, как приказал вам Аллах. Поистине, Аллах любит обращающихся и любит очищающихся!", "n": "О менструации: это — страдание; удаляйтесь от женщин во время месячных и не приближайтесь к ним, пока не очистятся.", "c": null}, {"ref": "4:129", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَلَن تَسْتَطِيعُوٓا۟ أَن تَعْدِلُوا۟ بَيْنَ ٱلنِّسَآءِ وَلَوْ حَرَصْتُمْ ۖ فَلَا تَمِيلُوا۟ كُلَّ ٱلْمَيْلِ فَتَذَرُوهَا كَٱلْمُعَلَّقَةِ ۚ وَإِن تُصْلِحُوا۟ وَتَتَّقُوا۟ فَإِنَّ ٱللَّهَ كَانَ غَفُورًۭا رَّحِيمًۭا ﴿129﴾", "ru": "И никогда вы не в состоянии быть справедливыми между женами, хотя бы и хотели этого. Не уклоняйтесь же всем уклонением, чтобы не оставить ее точно висящей. А если вы уладите и будете богобоязненными, то, поистине, Аллах прощающ, милосерд!", "n": "Вы не сможете поступать справедливо между жёнами, как бы вы ни старались — при том, что 4:3 разрешает многожёнство именно при условии справедливости.", "c": "Традиция: справедливость относится к материальному содержанию, а не к чувствам."}]}, {"id": "slavery", "title": "Рабство и наложницы", "icon": "⛓", "group": "Люди и общество", "intro": "Коран признаёт институт рабства и допускает сексуальные отношения с рабынями. Он же поощряет освобождение рабов (напр., 24:33, 90:13), но самого института не отменяет.", "verses": [{"ref": "4:24", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "۞ وَٱلْمُحْصَنَٰتُ مِنَ ٱلنِّسَآءِ إِلَّا مَا مَلَكَتْ أَيْمَٰنُكُمْ ۖ كِتَٰبَ ٱللَّهِ عَلَيْكُمْ ۚ وَأُحِلَّ لَكُم مَّا وَرَآءَ ذَٰلِكُمْ أَن تَبْتَغُوا۟ بِأَمْوَٰلِكُم مُّحْصِنِينَ غَيْرَ مُسَٰفِحِينَ ۚ فَمَا ٱسْتَمْتَعْتُم بِهِۦ مِنْهُنَّ فَـَٔاتُوهُنَّ أُجُورَهُنَّ فَرِيضَةًۭ ۚ وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا تَرَٰضَيْتُم بِهِۦ مِنۢ بَعْدِ ٱلْفَرِيضَةِ ۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿24﴾", "ru": "И - замужние из женщин, если ими не овладели ваши десницы по писанию Аллаха над вами. И разрешено вам в том, что за этим, искать своим имуществом, соблюдая целомудрие, не распутничая. А за то, чем вы пользуетесь от них, давайте им их награду по установлению. И нет греха над вами, в чем вы согласитесь между собой после установления. Поистине, Аллах - знающий, мудрый!", "n": "Запрет на брак с замужними женщинами, кроме тех, которыми овладели ваши десницы — по традиции, пленных женщин.", "c": "Классические юристы выводили из аята право хозяина на пленницу и при живом муже; в самом тексте условия не названы."}, {"ref": "23:5-6", "sura": "Al-Muminoon", "sura_ar": "سُورَةُ المُؤۡمِنُونَ", "type": "Meccan", "ar": "وَٱلَّذِينَ هُمْ لِفُرُوجِهِمْ حَٰفِظُونَ ﴿5﴾ إِلَّا عَلَىٰٓ أَزْوَٰجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَٰنُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ ﴿6﴾", "ru": "(5) которые хранят свои члены, (6) (кроме как от своих жен и того, чем овладела десница их, - ведь они не встретят упрека,", "n": "Верующие хранят целомудрие, кроме как со своими жёнами и теми, которыми овладели их десницы — то есть рабыни-наложницы приравнены к законным объектам сексуального доступа; согласие рабыни не упоминается.", "c": "Классическое право исходит из того, что собственность хозяина на рабыню даёт ему такое право."}, {"ref": "70:29-30", "sura": "Al-Ma'aarij", "sura_ar": "سُورَةُ المَعَارِجِ", "type": "Meccan", "ar": "وَٱلَّذِينَ هُمْ لِفُرُوجِهِمْ حَٰفِظُونَ ﴿29﴾ إِلَّا عَلَىٰٓ أَزْوَٰجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَٰنُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ ﴿30﴾", "ru": "(29) и тех, которые охраняют свои члены (30) только для своих жен или для того, чем овладели их десницы: они ведь не заслуживают порицания.", "n": "Те же слова повторены в суре Ступени.", "c": null}, {"ref": "33:50", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ إِنَّآ أَحْلَلْنَا لَكَ أَزْوَٰجَكَ ٱلَّٰتِىٓ ءَاتَيْتَ أُجُورَهُنَّ وَمَا مَلَكَتْ يَمِينُكَ مِمَّآ أَفَآءَ ٱللَّهُ عَلَيْكَ وَبَنَاتِ عَمِّكَ وَبَنَاتِ عَمَّٰتِكَ وَبَنَاتِ خَالِكَ وَبَنَاتِ خَٰلَٰتِكَ ٱلَّٰتِى هَاجَرْنَ مَعَكَ وَٱمْرَأَةًۭ مُّؤْمِنَةً إِن وَهَبَتْ نَفْسَهَا لِلنَّبِىِّ إِنْ أَرَادَ ٱلنَّبِىُّ أَن يَسْتَنكِحَهَا خَالِصَةًۭ لَّكَ مِن دُونِ ٱلْمُؤْمِنِينَ ۗ قَدْ عَلِمْنَا مَا فَرَضْنَا عَلَيْهِمْ فِىٓ أَزْوَٰجِهِمْ وَمَا مَلَكَتْ أَيْمَٰنُهُمْ لِكَيْلَا يَكُونَ عَلَيْكَ حَرَجٌۭ ۗ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًۭا ﴿50﴾", "ru": "О пророк, Мы разрешили тебе твоими женами тех, которым ты дал их награду, и тех, которыми овладела твоя десница из того, что даровал Аллах тебе в добычу, и дочерей твоего дяди со стороны отца, и дочерей твоих теток со стороны отца, и дочерей твоего дяди со стороны матери, и дочерей твоих теток со стороны матери, которые выселились вместе с тобой, и верующую женщину, если она отдала самое себя пророку, если пророк пожелает жениться на ней, - исключительно для тебя, помимо верующих. Мы знаем, что Мы установили для них относительно их жен и того, чем овладели десницы их, для того. чтобы не было на тебе стеснения. Аллах - прощающ. милосерд!", "n": "Пророку особо разрешены жёны, получившие брачный дар, пленницы из добычи, двоюродные сёстры и верующая женщина, если она отдала самое себя пророку — «исключительно для тебя, помимо верующих».", "c": "Традиционно — особая привилегия, ограниченная 33:52."}, {"ref": "4:25", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَمَن لَّمْ يَسْتَطِعْ مِنكُمْ طَوْلًا أَن يَنكِحَ ٱلْمُحْصَنَٰتِ ٱلْمُؤْمِنَٰتِ فَمِن مَّا مَلَكَتْ أَيْمَٰنُكُم مِّن فَتَيَٰتِكُمُ ٱلْمُؤْمِنَٰتِ ۚ وَٱللَّهُ أَعْلَمُ بِإِيمَٰنِكُم ۚ بَعْضُكُم مِّنۢ بَعْضٍۢ ۚ فَٱنكِحُوهُنَّ بِإِذْنِ أَهْلِهِنَّ وَءَاتُوهُنَّ أُجُورَهُنَّ بِٱلْمَعْرُوفِ مُحْصَنَٰتٍ غَيْرَ مُسَٰفِحَٰتٍۢ وَلَا مُتَّخِذَٰتِ أَخْدَانٍۢ ۚ فَإِذَآ أُحْصِنَّ فَإِنْ أَتَيْنَ بِفَٰحِشَةٍۢ فَعَلَيْهِنَّ نِصْفُ مَا عَلَى ٱلْمُحْصَنَٰتِ مِنَ ٱلْعَذَابِ ۚ ذَٰلِكَ لِمَنْ خَشِىَ ٱلْعَنَتَ مِنكُمْ ۚ وَأَن تَصْبِرُوا۟ خَيْرٌۭ لَّكُمْ ۗ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ ﴿25﴾", "ru": "А кто из вас не обладает достатком, чтобы жениться на охраняемых верующих, то - из тех, которыми овладели десницы ваши, из ваших верующих рабынь. Поистине, Аллах лучше знает вашу веру. Вы - одни от других. Женитесь же на них с дозволения их семей и давайте им их плату с достоинством, - целомудренным, не распутничающим и не берущим приятелей. И если они были целомудренны... А если совершат мерзость, то им - половина того, что целомудренным, из наказания. Это - тем из вас, кто боится тягости. А если вы будете терпеливы, то это - лучше для вас. Поистине, Аллах - прощающий, милосердный!", "n": "Тем, кто не может жениться на свободной, разрешён брак с рабынями-девушками с согласия хозяев; за прелюбодеяние рабыням положена половина наказания свободной женщины.", "c": null}, {"ref": "8:69", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "فَكُلُوا۟ مِمَّا غَنِمْتُمْ حَلَٰلًۭا طَيِّبًۭا ۚ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ ﴿69﴾", "ru": "Ешьте же то, что вы взяли в добычу дозволенным, благим, и бойтесь Аллаха: поистине, Аллах прощающ, милосерд!", "n": "Разрешено есть из полученной добычи (включая пленных и их имущество) как дозволенное и благое.", "c": null}, {"ref": "16:75", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "۞ ضَرَبَ ٱللَّهُ مَثَلًا عَبْدًۭا مَّمْلُوكًۭا لَّا يَقْدِرُ عَلَىٰ شَىْءٍۢ وَمَن رَّزَقْنَٰهُ مِنَّا رِزْقًا حَسَنًۭا فَهُوَ يُنفِقُ مِنْهُ سِرًّۭا وَجَهْرًا ۖ هَلْ يَسْتَوُۥنَ ۚ ٱلْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ ﴿75﴾", "ru": "Приводит Аллах притчей раба - невольника, который не может ничего, и того, кого Мы наделили от Себя хорошим уделом, и он расходует из него тайно и явно. Разве они одинаковы? Хвала Аллаху! Но большая часть их не знает!", "n": "Раб-собственность описан как существо, которое ничем не распоряжается — в притче сравниваются Бог и идолы.", "c": null}, {"ref": "4:92", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَمَا كَانَ لِمُؤْمِنٍ أَن يَقْتُلَ مُؤْمِنًا إِلَّا خَطَـًۭٔا ۚ وَمَن قَتَلَ مُؤْمِنًا خَطَـًۭٔا فَتَحْرِيرُ رَقَبَةٍۢ مُّؤْمِنَةٍۢ وَدِيَةٌۭ مُّسَلَّمَةٌ إِلَىٰٓ أَهْلِهِۦٓ إِلَّآ أَن يَصَّدَّقُوا۟ ۚ فَإِن كَانَ مِن قَوْمٍ عَدُوٍّۢ لَّكُمْ وَهُوَ مُؤْمِنٌۭ فَتَحْرِيرُ رَقَبَةٍۢ مُّؤْمِنَةٍۢ ۖ وَإِن كَانَ مِن قَوْمٍۭ بَيْنَكُمْ وَبَيْنَهُم مِّيثَٰقٌۭ فَدِيَةٌۭ مُّسَلَّمَةٌ إِلَىٰٓ أَهْلِهِۦ وَتَحْرِيرُ رَقَبَةٍۢ مُّؤْمِنَةٍۢ ۖ فَمَن لَّمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ تَوْبَةًۭ مِّنَ ٱللَّهِ ۗ وَكَانَ ٱللَّهُ عَلِيمًا حَكِيمًۭا ﴿92﴾", "ru": "Не следует верующему убивать верующего, разве только по ошибке. А кто убьет верующего по ошибке, то - освобождение верующего раба и пеня, вручаемая его семье, если они не раздадут ее милостынею. А если он из народа враждебного вам и верующий, то - освобождение верующего раба. А если он из народа, между которым и вами договор, то - пеня, вручаемая его семье, и освобождение верующего раба. Кто же не найдет, то - пост двух месяцев последовательных как покаяние пред Аллахом. Поистине, Аллах - знающий, мудрый!", "n": "За убийство верующего по ошибке виновный обязан освободить верующего раба и заплатить виру; рабство как институт принято как данность.", "c": null}, {"ref": "16:71", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَٱللَّهُ فَضَّلَ بَعْضَكُمْ عَلَىٰ بَعْضٍۢ فِى ٱلرِّزْقِ ۚ فَمَا ٱلَّذِينَ فُضِّلُوا۟ بِرَآدِّى رِزْقِهِمْ عَلَىٰ مَا مَلَكَتْ أَيْمَٰنُهُمْ فَهُمْ فِيهِ سَوَآءٌ ۚ أَفَبِنِعْمَةِ ٱللَّهِ يَجْحَدُونَ ﴿71﴾", "ru": "Аллах дал вам преимущество одним перед другими в жизненном уделе. но те, которым дано преимущество не вернут своей доли тем, кем овладела их десница, чтобы они оказались в этом равными. Неужели они отрицают милость Аллаха?", "n": "«Аллах дал вам преимущество одним перед другими в жизненном уделе, но те, которым дано преимущество, не вернут своей доли тем, кем овладела их десница, чтобы они оказались в этом равными» — неравенство господ и рабов выдано за установление Бога.", "c": null}, {"ref": "30:28", "sura": "Ar-Room", "sura_ar": "سُورَةُ الرُّومِ", "type": "Meccan", "ar": "ضَرَبَ لَكُم مَّثَلًۭا مِّنْ أَنفُسِكُمْ ۖ هَل لَّكُم مِّن مَّا مَلَكَتْ أَيْمَٰنُكُم مِّن شُرَكَآءَ فِى مَا رَزَقْنَٰكُمْ فَأَنتُمْ فِيهِ سَوَآءٌۭ تَخَافُونَهُمْ كَخِيفَتِكُمْ أَنفُسَكُمْ ۚ كَذَٰلِكَ نُفَصِّلُ ٱلْءَايَٰتِ لِقَوْمٍۢ يَعْقِلُونَ ﴿28﴾", "ru": "Он приводит вам пример из вас самих. Есть ли у вас из тех, кем овладели ваши десницы, сотоварищи в том, чем Мы вас наделили, и вы в этом равны? Боитесь ли вы их так, как боитесь самих себя? Так разъясняем Мы знамения для людей, которые разумны!", "n": "Притча: «Есть ли у вас из тех, кем овладели ваши десницы, сотоварищи в том, чем Мы вас наделили, и вы в этом равны?» — иерархия господина и раба использована как естественный пример.", "c": null}, {"ref": "24:33", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَلْيَسْتَعْفِفِ ٱلَّذِينَ لَا يَجِدُونَ نِكَاحًا حَتَّىٰ يُغْنِيَهُمُ ٱللَّهُ مِن فَضْلِهِۦ ۗ وَٱلَّذِينَ يَبْتَغُونَ ٱلْكِتَٰبَ مِمَّا مَلَكَتْ أَيْمَٰنُكُمْ فَكَاتِبُوهُمْ إِنْ عَلِمْتُمْ فِيهِمْ خَيْرًۭا ۖ وَءَاتُوهُم مِّن مَّالِ ٱللَّهِ ٱلَّذِىٓ ءَاتَىٰكُمْ ۚ وَلَا تُكْرِهُوا۟ فَتَيَٰتِكُمْ عَلَى ٱلْبِغَآءِ إِنْ أَرَدْنَ تَحَصُّنًۭا لِّتَبْتَغُوا۟ عَرَضَ ٱلْحَيَوٰةِ ٱلدُّنْيَا ۚ وَمَن يُكْرِههُّنَّ فَإِنَّ ٱللَّهَ مِنۢ بَعْدِ إِكْرَٰهِهِنَّ غَفُورٌۭ رَّحِيمٌۭ ﴿33﴾", "ru": "И пусть будут воздержаны те, которые не находят возможности брака, пока не обогатит их Аллах Своей щедростью. А те, которые хотят записи (о свободе), из тех, которыми овладели десницы ваши, - записывайте их, если знаете, что в них есть добро, и давайте им из достояния Аллаха то, что Он дал вам; и не принуждайте ваших девушек к распутству, если они хотят целомудрия, стремясь к случайностям жизни ближней. А кто их вынудит... то ведь Аллах и после принуждения их - прощающий, милосердный!", "n": "«Не принуждайте ваших девушек к распутству, если они хотят целомудрия, стремясь к случайностям жизни ближней»; рабам, просящим «записи» (о свободе), — записывать, «если знаете, что в них есть добро».", "c": "Запрет принуждения относится только к хотящим целомудрия; сам институт рабства не отменён."}]}, {"id": "others", "title": "Многобожники и неверные", "icon": "✋", "group": "Люди и общество", "intro": "Как Коран говорит о людях другой веры: приказы дистанцироваться, оскорбительные характеристики, угрозы и проклятия.", "verses": [{"ref": "3:85", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَمَن يَبْتَغِ غَيْرَ ٱلْإِسْلَٰمِ دِينًۭا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِى ٱلْءَاخِرَةِ مِنَ ٱلْخَٰسِرِينَ ﴿85﴾", "ru": "Кто же ищет не ислама как религии, от того не будет принято, и он в последней жизни окажется в числе потерпевших убыток.", "n": "Кто ищет иной религии, кроме ислама, — от того не будет принято — исключительность одной религии.", "c": null}, {"ref": "3:28", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "لَّا يَتَّخِذِ ٱلْمُؤْمِنُونَ ٱلْكَٰفِرِينَ أَوْلِيَآءَ مِن دُونِ ٱلْمُؤْمِنِينَ ۖ وَمَن يَفْعَلْ ذَٰلِكَ فَلَيْسَ مِنَ ٱللَّهِ فِى شَىْءٍ إِلَّآ أَن تَتَّقُوا۟ مِنْهُمْ تُقَىٰةًۭ ۗ وَيُحَذِّرُكُمُ ٱللَّهُ نَفْسَهُۥ ۗ وَإِلَى ٱللَّهِ ٱلْمَصِيرُ ﴿28﴾", "ru": "Пусть верующие не берут себе близкими неверных помимо верующих. А кто сделает это, у того с Аллахом нет ничего общего, если вы только не будете опасаться их страхом. Аллах предостерегает вас от самого Себя, и к Аллаху - возвращение\".", "n": "Верующим запрещено брать неверных в союзники и друзья.", "c": null}, {"ref": "5:51", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "۞ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ ٱلْيَهُودَ وَٱلنَّصَٰرَىٰٓ أَوْلِيَآءَ ۘ بَعْضُهُمْ أَوْلِيَآءُ بَعْضٍۢ ۚ وَمَن يَتَوَلَّهُم مِّنكُمْ فَإِنَّهُۥ مِنْهُمْ ۗ إِنَّ ٱللَّهَ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ ﴿51﴾", "ru": "О вы, которые уверовали! Не берите иудеев и христиан друзьями: они - друзья один другому. А если кто из вас берет их себе в друзья, тот и сам из них. Поистине, Аллах не ведет людей неправедных!", "n": "Запрет брать в друзья/покровители иудеев и христиан: они — друзья друг другу; кто из вас берёт их себе в друзья — тот из них.", "c": null}, {"ref": "9:28", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِنَّمَا ٱلْمُشْرِكُونَ نَجَسٌۭ فَلَا يَقْرَبُوا۟ ٱلْمَسْجِدَ ٱلْحَرَامَ بَعْدَ عَامِهِمْ هَٰذَا ۚ وَإِنْ خِفْتُمْ عَيْلَةًۭ فَسَوْفَ يُغْنِيكُمُ ٱللَّهُ مِن فَضْلِهِۦٓ إِن شَآءَ ۚ إِنَّ ٱللَّهَ عَلِيمٌ حَكِيمٌۭ ﴿28﴾", "ru": "О вы, которые уверовали! Ведь многобожники - нечистота. Пусть же они не приближаются к мечети священной после этого года! А если вы боитесь недостатка, то обогатит вас Аллах от Своей щедрости, если пожелает. Поистине, Аллах - знающий, мудрый!", "n": "Многобожники названы нечистыми (наджас) и допуск их к запретной мечети запрещён.", "c": null}, {"ref": "98:6", "sura": "Al-Bayyina", "sura_ar": "سُورَةُ البَيِّنَةِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ فِى نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآ ۚ أُو۟لَٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ ﴿6﴾", "ru": "Поистине, те из обладателей писания и многобожников, которые не уверовали, - в огне геенны, - вечно пребывая там. Они - худшие из тварей.", "n": "Неверные из людей Писания и многобожников в огне геенны... они — наихудшие из тварей.", "c": null}, {"ref": "8:55", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "إِنَّ شَرَّ ٱلدَّوَآبِّ عِندَ ٱللَّهِ ٱلَّذِينَ كَفَرُوا۟ فَهُمْ لَا يُؤْمِنُونَ ﴿55﴾", "ru": "Поистине, злейшие из животных у Аллаха - те, которые не веровали, и они не веруют, -", "n": "Наихудшие из животных у Аллаха — те, которые не уверовали.", "c": null}, {"ref": "3:151", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "سَنُلْقِى فِى قُلُوبِ ٱلَّذِينَ كَفَرُوا۟ ٱلرُّعْبَ بِمَآ أَشْرَكُوا۟ بِٱللَّهِ مَا لَمْ يُنَزِّلْ بِهِۦ سُلْطَٰنًۭا ۖ وَمَأْوَىٰهُمُ ٱلنَّارُ ۚ وَبِئْسَ مَثْوَى ٱلظَّٰلِمِينَ ﴿151﴾", "ru": "Мы ввергнем в сердца тех, которые не веровали, ужас за то, что они придавали Аллаху в сотоварищи то, к чему Он не ниспослал никакой власти. Убежище их - огонь, и скверно пребывание нечестивых!", "n": "Мы вселим ужас в сердца тех, которые не веровали.", "c": null}, {"ref": "48:29", "sura": "Al-Fath", "sura_ar": "سُورَةُ الفَتۡحِ", "type": "Medinan", "ar": "مُّحَمَّدٌۭ رَّسُولُ ٱللَّهِ ۚ وَٱلَّذِينَ مَعَهُۥٓ أَشِدَّآءُ عَلَى ٱلْكُفَّارِ رُحَمَآءُ بَيْنَهُمْ ۖ تَرَىٰهُمْ رُكَّعًۭا سُجَّدًۭا يَبْتَغُونَ فَضْلًۭا مِّنَ ٱللَّهِ وَرِضْوَٰنًۭا ۖ سِيمَاهُمْ فِى وُجُوهِهِم مِّنْ أَثَرِ ٱلسُّجُودِ ۚ ذَٰلِكَ مَثَلُهُمْ فِى ٱلتَّوْرَىٰةِ ۚ وَمَثَلُهُمْ فِى ٱلْإِنجِيلِ كَزَرْعٍ أَخْرَجَ شَطْـَٔهُۥ فَـَٔازَرَهُۥ فَٱسْتَغْلَظَ فَٱسْتَوَىٰ عَلَىٰ سُوقِهِۦ يُعْجِبُ ٱلزُّرَّاعَ لِيَغِيظَ بِهِمُ ٱلْكُفَّارَ ۗ وَعَدَ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ مِنْهُم مَّغْفِرَةًۭ وَأَجْرًا عَظِيمًۢا ﴿29﴾", "ru": "Мухаммад - посланник Аллаха, и те, которые с ним, - яростны против неверных, милостивы между собой. Ты видишь их преклоняющимися, падающими ниц. Они ищут милости от Аллаха и благоволения. Приметы их - на их лицах от следов падения ниц. Таков образ их в Торе, но в Евангелии образ их - посев, который извел свой побег и укрепил его; он стал твердым и выровнялся на стебле, восхищая сеятелей, - чтобы разъярить ими неверных. Обещал Аллах тем из них, которые уверовали и творили благое, прощение и великую награду!", "n": "Верующие описаны как суровые к неверным и милосердные между собой.", "c": null}, {"ref": "2:89", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَلَمَّا جَآءَهُمْ كِتَٰبٌۭ مِّنْ عِندِ ٱللَّهِ مُصَدِّقٌۭ لِّمَا مَعَهُمْ وَكَانُوا۟ مِن قَبْلُ يَسْتَفْتِحُونَ عَلَى ٱلَّذِينَ كَفَرُوا۟ فَلَمَّا جَآءَهُم مَّا عَرَفُوا۟ كَفَرُوا۟ بِهِۦ ۚ فَلَعْنَةُ ٱللَّهِ عَلَى ٱلْكَٰفِرِينَ ﴿89﴾", "ru": "А когда пришло к ним писание, от Аллаха, подтверждающее истинность того, что с ними, - а еще прежде они просили победы против тех, которые были неверные, - так когда пришло к ним то, что они знали, они не уверовали в это. Проклятие же Аллаха над неверующими!", "n": "Проклятие Аллаха на неверных.", "c": null}, {"ref": "2:171", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَمَثَلُ ٱلَّذِينَ كَفَرُوا۟ كَمَثَلِ ٱلَّذِى يَنْعِقُ بِمَا لَا يَسْمَعُ إِلَّا دُعَآءًۭ وَنِدَآءًۭ ۚ صُمٌّۢ بُكْمٌ عُمْىٌۭ فَهُمْ لَا يَعْقِلُونَ ﴿171﴾", "ru": "Те, которые не веруют, подобны тому, который кричит на тех, что не слышат ничего, кроме зова и призыва: глухи, немы, слепы, - они и не разумеют!", "n": "Неверные уподоблены тому, кому кричат, а он слышит только зов и крик: глухие, немые, слепые — они не разумеют.", "c": null}, {"ref": "3:118", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ بِطَانَةًۭ مِّن دُونِكُمْ لَا يَأْلُونَكُمْ خَبَالًۭا وَدُّوا۟ مَا عَنِتُّمْ قَدْ بَدَتِ ٱلْبَغْضَآءُ مِنْ أَفْوَٰهِهِمْ وَمَا تُخْفِى صُدُورُهُمْ أَكْبَرُ ۚ قَدْ بَيَّنَّا لَكُمُ ٱلْءَايَٰتِ ۖ إِن كُنتُمْ تَعْقِلُونَ ﴿118﴾", "ru": "О вы, которые уверовали! Не берите себе близких друзей, кроме вас самих. Они не преминут вам вредить, они хотели бы того, чтобы вы попали бы в беду. Обнаружилась ненависть из их уст, а то, что скрывают их груди больше. Мы разъяснили вам знамения, если вы разумны!", "n": "Верующим запрещено брать приближёнными не из своих: они не пожалеют сил, чтобы вас испортить.", "c": null}, {"ref": "4:144", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ ٱلْكَٰفِرِينَ أَوْلِيَآءَ مِن دُونِ ٱلْمُؤْمِنِينَ ۚ أَتُرِيدُونَ أَن تَجْعَلُوا۟ لِلَّهِ عَلَيْكُمْ سُلْطَٰنًۭا مُّبِينًا ﴿144﴾", "ru": "О вы, которые уверовали! Не берите неверных друзьями вместо верующих. Разве вы хотите дать Аллаху ясный довод против вас?", "n": "Верующим запрещено брать неверных друзьями вместо верующих.", "c": null}, {"ref": "5:57", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ ٱلَّذِينَ ٱتَّخَذُوا۟ دِينَكُمْ هُزُوًۭا وَلَعِبًۭا مِّنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ مِن قَبْلِكُمْ وَٱلْكُفَّارَ أَوْلِيَآءَ ۚ وَٱتَّقُوا۟ ٱللَّهَ إِن كُنتُم مُّؤْمِنِينَ ﴿57﴾", "ru": "О вы, которые уверовали! Не берите друзьями тех, которые вашу религию принимают как насмешку и забаву, из тех, кому до вас даровано писание, и неверных. Бойтесь же Аллаха, если вы верующие!", "n": "Не берите друзьями тех из людей Писания и неверных, кто принимает вашу религию в насмешку и игру.", "c": null}, {"ref": "8:22", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "۞ إِنَّ شَرَّ ٱلدَّوَآبِّ عِندَ ٱللَّهِ ٱلصُّمُّ ٱلْبُكْمُ ٱلَّذِينَ لَا يَعْقِلُونَ ﴿22﴾", "ru": "Худшие из животных пред Аллахом - глухие, немые, которые не разумеют.", "n": "Худшие животные у Аллаха — глухие, немые, не разумеющие.", "c": null}, {"ref": "25:44", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "أَمْ تَحْسَبُ أَنَّ أَكْثَرَهُمْ يَسْمَعُونَ أَوْ يَعْقِلُونَ ۚ إِنْ هُمْ إِلَّا كَٱلْأَنْعَٰمِ ۖ بَلْ هُمْ أَضَلُّ سَبِيلًا ﴿44﴾", "ru": "Или ты думаешь, что большинство слышит или разумеет? Они ведь только - как скоты и даже больше сбились с пути.", "n": "Неверные подобны скоту, нет, они ещё более заблудшие.", "c": null}, {"ref": "47:12", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "إِنَّ ٱللَّهَ يُدْخِلُ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ ۖ وَٱلَّذِينَ كَفَرُوا۟ يَتَمَتَّعُونَ وَيَأْكُلُونَ كَمَا تَأْكُلُ ٱلْأَنْعَٰمُ وَٱلنَّارُ مَثْوًۭى لَّهُمْ ﴿12﴾", "ru": "Поистине, Аллах введет тех, которые уверовали и творили благие дела, в сады, где внизу текут реки. А те, которые не уверовали, наслаждаются и едят, как животные, и огонь - местопребывание их!", "n": "Неверные наслаждаются и едят, как едят скоты; огонь — им пристанище.", "c": null}, {"ref": "60:1", "sura": "Al-Mumtahana", "sura_ar": "سُورَةُ المُمۡتَحنَةِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ عَدُوِّى وَعَدُوَّكُمْ أَوْلِيَآءَ تُلْقُونَ إِلَيْهِم بِٱلْمَوَدَّةِ وَقَدْ كَفَرُوا۟ بِمَا جَآءَكُم مِّنَ ٱلْحَقِّ يُخْرِجُونَ ٱلرَّسُولَ وَإِيَّاكُمْ ۙ أَن تُؤْمِنُوا۟ بِٱللَّهِ رَبِّكُمْ إِن كُنتُمْ خَرَجْتُمْ جِهَٰدًۭا فِى سَبِيلِى وَٱبْتِغَآءَ مَرْضَاتِى ۚ تُسِرُّونَ إِلَيْهِم بِٱلْمَوَدَّةِ وَأَنَا۠ أَعْلَمُ بِمَآ أَخْفَيْتُمْ وَمَآ أَعْلَنتُمْ ۚ وَمَن يَفْعَلْهُ مِنكُمْ فَقَدْ ضَلَّ سَوَآءَ ٱلسَّبِيلِ ﴿1﴾", "ru": "О вы, которые уверовали! Не берите друзьями Моего и вашего врага. Вы обращаетесь к ним с любовью, а они уверовали в то, что пришло к вам из истины. Они изгоняют посланника и вас за то, что вы веруете в Аллаха, Господа вашего. Когда вы вышли бороться на пути Моем и искать Моего благословения, вы скрывали к ним любовь. А Я лучше знаю, что вы скрывали и что вы обнаруживали. Кто сделает это из вас, тот уже сбился с верной дороги.", "n": "Верующим запрещено брать врагов Моих и ваших друзьями.", "c": null}, {"ref": "60:4", "sura": "Al-Mumtahana", "sura_ar": "سُورَةُ المُمۡتَحنَةِ", "type": "Medinan", "ar": "قَدْ كَانَتْ لَكُمْ أُسْوَةٌ حَسَنَةٌۭ فِىٓ إِبْرَٰهِيمَ وَٱلَّذِينَ مَعَهُۥٓ إِذْ قَالُوا۟ لِقَوْمِهِمْ إِنَّا بُرَءَٰٓؤُا۟ مِنكُمْ وَمِمَّا تَعْبُدُونَ مِن دُونِ ٱللَّهِ كَفَرْنَا بِكُمْ وَبَدَا بَيْنَنَا وَبَيْنَكُمُ ٱلْعَدَٰوَةُ وَٱلْبَغْضَآءُ أَبَدًا حَتَّىٰ تُؤْمِنُوا۟ بِٱللَّهِ وَحْدَهُۥٓ إِلَّا قَوْلَ إِبْرَٰهِيمَ لِأَبِيهِ لَأَسْتَغْفِرَنَّ لَكَ وَمَآ أَمْلِكُ لَكَ مِنَ ٱللَّهِ مِن شَىْءٍۢ ۖ رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ ٱلْمَصِيرُ ﴿4﴾", "ru": "Был вам хороший пример в Ибрахиме и тех, кто был с ним. Вот сказали они своему народу: \"Мы не причастны к вам и к тому, чему вы поклоняетесь помимо Аллаха. Мы не веруем в вас. Началась между вами и нами ненависть и вражда навсегда, пока вы не уверуете в Аллаха единого... \" Если только не слова Ибрахима своему отцу: \"Я буду просить прощения для тебя; я не владею для тебя у Аллаха ничем. Господи наш, на Тебя мы положились и к Тебе обратились, и к Тебе возвращение!", "n": "Ибрахим и верующие своему народу: Между нами и вами — вражда и ненависть навсегда, пока вы не уверуете в Аллаха одного.", "c": null}]}, {"id": "jews", "title": "Иудеи (сыны Исраила)", "icon": "✡", "group": "Люди и общество", "intro": "Как Коран описывает иудеев: обвинения в искажении Писания, нарушении завета, убийстве пророков, проклятия и превращение в обезьян. В тексте часть претензий адресована конкретным событиям из прошлого, часть — иудеям как общности.", "verses": [{"ref": "2:65", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَلَقَدْ عَلِمْتُمُ ٱلَّذِينَ ٱعْتَدَوْا۟ مِنكُمْ فِى ٱلسَّبْتِ فَقُلْنَا لَهُمْ كُونُوا۟ قِرَدَةً خَٰسِـِٔينَ ﴿65﴾", "ru": "Вы знаете тех из вас, которые нарушили субботу, и Мы сказали им: \"Будьте обезьянами презренными!\"", "n": "Нарушившие субботу иудеи превращены Богом в презренных обезьян.", "c": "Часть комментаторов (напр., Муджахид) понимает метафорически."}, {"ref": "5:60", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "قُلْ هَلْ أُنَبِّئُكُم بِشَرٍّۢ مِّن ذَٰلِكَ مَثُوبَةً عِندَ ٱللَّهِ ۚ مَن لَّعَنَهُ ٱللَّهُ وَغَضِبَ عَلَيْهِ وَجَعَلَ مِنْهُمُ ٱلْقِرَدَةَ وَٱلْخَنَازِيرَ وَعَبَدَ ٱلطَّٰغُوتَ ۚ أُو۟لَٰٓئِكَ شَرٌّۭ مَّكَانًۭا وَأَضَلُّ عَن سَوَآءِ ٱلسَّبِيلِ ﴿60﴾", "ru": "Скажи: \"Не сообщить ли мне вам более злостное, чем это, по награде у Аллаха? Тот, кого проклял Аллах и на кого разгневался, и сделал из них обезьян и свиней, и кто поклонялся тагуту. Эти - злостнее по месту и более сбившиеся с ровного пути\".", "n": "Некоторые из людей Писания превращены в обезьян и свиней.", "c": null}, {"ref": "2:61", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قُلْتُمْ يَٰمُوسَىٰ لَن نَّصْبِرَ عَلَىٰ طَعَامٍۢ وَٰحِدٍۢ فَٱدْعُ لَنَا رَبَّكَ يُخْرِجْ لَنَا مِمَّا تُنۢبِتُ ٱلْأَرْضُ مِنۢ بَقْلِهَا وَقِثَّآئِهَا وَفُومِهَا وَعَدَسِهَا وَبَصَلِهَا ۖ قَالَ أَتَسْتَبْدِلُونَ ٱلَّذِى هُوَ أَدْنَىٰ بِٱلَّذِى هُوَ خَيْرٌ ۚ ٱهْبِطُوا۟ مِصْرًۭا فَإِنَّ لَكُم مَّا سَأَلْتُمْ ۗ وَضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ وَٱلْمَسْكَنَةُ وَبَآءُو بِغَضَبٍۢ مِّنَ ٱللَّهِ ۗ ذَٰلِكَ بِأَنَّهُمْ كَانُوا۟ يَكْفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَيَقْتُلُونَ ٱلنَّبِيِّۦنَ بِغَيْرِ ٱلْحَقِّ ۗ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ ﴿61﴾", "ru": "И вот вы сказали: \"О Муса! Мы не можем стерпеть одинаковой пищи. Воззови ради нас к твоему Господу, пусть Он изведет нам то, что произращает земля из своих овощей, кабачков, чесноку, чечевицы и луку\". Сказал он: \"Неужели вы просите заменить тем, что ниже, то, что лучше? Спуститесь в Египет, и вот - для вас то, что вы просите\". И воздвигнуто было над ними унижение и бедность. И оказались они под гневом Аллаха. Это - за то, что они не уверовали в знамения Аллаха и избивали пророков без справедливости! Это - за то, что они ослушались и были преступниками!", "n": null, "c": null}, {"ref": "2:79", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "فَوَيْلٌۭ لِّلَّذِينَ يَكْتُبُونَ ٱلْكِتَٰبَ بِأَيْدِيهِمْ ثُمَّ يَقُولُونَ هَٰذَا مِنْ عِندِ ٱللَّهِ لِيَشْتَرُوا۟ بِهِۦ ثَمَنًۭا قَلِيلًۭا ۖ فَوَيْلٌۭ لَّهُم مِّمَّا كَتَبَتْ أَيْدِيهِمْ وَوَيْلٌۭ لَّهُم مِّمَّا يَكْسِبُونَ ﴿79﴾", "ru": "Горе же тем, которые пишут писание своими руками, о потом говорят: \"Это от Аллаха\", - чтобы купить за это небольшую цену! Горе же им за то, что написали их руки, и горе им за то, что они приобретают!", "n": "Горе же тем, которые пишут писание своими руками, а потом говорят: «Это от Аллаха…»", "c": null}, {"ref": "2:90", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "بِئْسَمَا ٱشْتَرَوْا۟ بِهِۦٓ أَنفُسَهُمْ أَن يَكْفُرُوا۟ بِمَآ أَنزَلَ ٱللَّهُ بَغْيًا أَن يُنَزِّلَ ٱللَّهُ مِن فَضْلِهِۦ عَلَىٰ مَن يَشَآءُ مِنْ عِبَادِهِۦ ۖ فَبَآءُو بِغَضَبٍ عَلَىٰ غَضَبٍۢ ۚ وَلِلْكَٰفِرِينَ عَذَابٌۭ مُّهِينٌۭ ﴿90﴾", "ru": "Плохо то, что они купили за свои души, чтобы им не веровать в то, что ниспослал Аллах, из зависти, что Аллах ниспосылает от Своей милости кому пожелает из Своих рабов! И навлекли они на себя гнев на гнев. Поистине, для неверных - наказание унизительное!", "n": "Иудеи навлекли гнев на гнев.", "c": null}, {"ref": "3:112", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "ضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ أَيْنَ مَا ثُقِفُوٓا۟ إِلَّا بِحَبْلٍۢ مِّنَ ٱللَّهِ وَحَبْلٍۢ مِّنَ ٱلنَّاسِ وَبَآءُو بِغَضَبٍۢ مِّنَ ٱللَّهِ وَضُرِبَتْ عَلَيْهِمُ ٱلْمَسْكَنَةُ ۚ ذَٰلِكَ بِأَنَّهُمْ كَانُوا۟ يَكْفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَيَقْتُلُونَ ٱلْأَنۢبِيَآءَ بِغَيْرِ حَقٍّۢ ۚ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ ﴿112﴾", "ru": "Поражены они унижением, где бы ни находились, если только не с вервью Аллаха и не с вервью людей. Они оказались под гневом Аллаха, и поражены они бедностью. Это - за то, что они не веровали в знамения Аллаха и избивали пророков без права. Это - за то, что они ослушались и были преступниками.", "n": null, "c": null}, {"ref": "3:181", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "لَّقَدْ سَمِعَ ٱللَّهُ قَوْلَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ فَقِيرٌۭ وَنَحْنُ أَغْنِيَآءُ ۘ سَنَكْتُبُ مَا قَالُوا۟ وَقَتْلَهُمُ ٱلْأَنۢبِيَآءَ بِغَيْرِ حَقٍّۢ وَنَقُولُ ذُوقُوا۟ عَذَابَ ٱلْحَرِيقِ ﴿181﴾", "ru": "Слышал Аллах речи тех, которые говорили: \"Ведь Аллах беден, а мы богаты\". Мы запишем то, что они говорили, и избиение ими пророков без права и скажем: \"Вкусите наказание огня!\"", "n": null, "c": "В иудаизме такого утверждения нет; критики считают это искажением чужих взглядов."}, {"ref": "4:160-161", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "فَبِظُلْمٍۢ مِّنَ ٱلَّذِينَ هَادُوا۟ حَرَّمْنَا عَلَيْهِمْ طَيِّبَٰتٍ أُحِلَّتْ لَهُمْ وَبِصَدِّهِمْ عَن سَبِيلِ ٱللَّهِ كَثِيرًۭا ﴿160﴾ وَأَخْذِهِمُ ٱلرِّبَوٰا۟ وَقَدْ نُهُوا۟ عَنْهُ وَأَكْلِهِمْ أَمْوَٰلَ ٱلنَّاسِ بِٱلْبَٰطِلِ ۚ وَأَعْتَدْنَا لِلْكَٰفِرِينَ مِنْهُمْ عَذَابًا أَلِيمًۭا ﴿161﴾", "ru": "(160) и вот, за несправедливость тех, которые исповедуют иудейство, Мы запретили им блага, которые были им разрешены, и за отвращение ими многих от пути Аллаха, (161) и за то, что они брали рост, хотя это было им запрещено, и пожирали имущество людей попусту, Мы и приготовили неверным из них мучительное наказание.", "n": "«За несправедливость тех, которые исповедуют иудейство, Мы запретили им блага, которые были им разрешены» — запреты описаны как наказание.", "c": null}, {"ref": "5:13", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "فَبِمَا نَقْضِهِم مِّيثَٰقَهُمْ لَعَنَّٰهُمْ وَجَعَلْنَا قُلُوبَهُمْ قَٰسِيَةًۭ ۖ يُحَرِّفُونَ ٱلْكَلِمَ عَن مَّوَاضِعِهِۦ ۙ وَنَسُوا۟ حَظًّۭا مِّمَّا ذُكِّرُوا۟ بِهِۦ ۚ وَلَا تَزَالُ تَطَّلِعُ عَلَىٰ خَآئِنَةٍۢ مِّنْهُمْ إِلَّا قَلِيلًۭا مِّنْهُمْ ۖ فَٱعْفُ عَنْهُمْ وَٱصْفَحْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُحْسِنِينَ ﴿13﴾", "ru": "И за то, что они нарушили свой договор, Мы их прокляли и сделали сердца их жестокими: они искажают слова, (переставляя их) с их мест. И забыли они часть того, что им было упомянуто. И ты не престаешь узнавать об измене с их стороны, кроме немногих их них. Прости же и извини, - ведь Аллах любит добродеющих!", "n": null, "c": null}, {"ref": "5:64", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَقَالَتِ ٱلْيَهُودُ يَدُ ٱللَّهِ مَغْلُولَةٌ ۚ غُلَّتْ أَيْدِيهِمْ وَلُعِنُوا۟ بِمَا قَالُوا۟ ۘ بَلْ يَدَاهُ مَبْسُوطَتَانِ يُنفِقُ كَيْفَ يَشَآءُ ۚ وَلَيَزِيدَنَّ كَثِيرًۭا مِّنْهُم مَّآ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ طُغْيَٰنًۭا وَكُفْرًۭا ۚ وَأَلْقَيْنَا بَيْنَهُمُ ٱلْعَدَٰوَةَ وَٱلْبَغْضَآءَ إِلَىٰ يَوْمِ ٱلْقِيَٰمَةِ ۚ كُلَّمَآ أَوْقَدُوا۟ نَارًۭا لِّلْحَرْبِ أَطْفَأَهَا ٱللَّهُ ۚ وَيَسْعَوْنَ فِى ٱلْأَرْضِ فَسَادًۭا ۚ وَٱللَّهُ لَا يُحِبُّ ٱلْمُفْسِدِينَ ﴿64﴾", "ru": "И сказали иудеи: \"Рука Аллаха привязана!\" У них руки связаны, и прокляты они за то, что говорили. Нет! Руки у Него распростерты: расходует Он, как желает. И конечно, у многих из них низведенное тебе от твоего Господа только увеличивает заблуждение и неверие. Мы бросили между ними вражду и ненависть до дня воскресения. Как только они зажгут огонь для войны, тушит его Аллах. И стремятся они по земле с нечестием, а Аллах не любит распространяющих нечестие!", "n": "Иудеи сказали: «Рука Аллаха привязана!» — «У них руки связаны, и прокляты они за то, что говорили»; Мы возбудили среди них вражду и ненависть до дня воскресения.", "c": null}, {"ref": "5:78", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "لُعِنَ ٱلَّذِينَ كَفَرُوا۟ مِنۢ بَنِىٓ إِسْرَٰٓءِيلَ عَلَىٰ لِسَانِ دَاوُۥدَ وَعِيسَى ٱبْنِ مَرْيَمَ ۚ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ ﴿78﴾", "ru": "Прокляты те из сынов Исраила, которые не веровали языком Дауда и Исы, сына Марйам! Это - за то, что они ослушались и были преступны.", "n": null, "c": null}, {"ref": "5:82", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "۞ لَتَجِدَنَّ أَشَدَّ ٱلنَّاسِ عَدَٰوَةًۭ لِّلَّذِينَ ءَامَنُوا۟ ٱلْيَهُودَ وَٱلَّذِينَ أَشْرَكُوا۟ ۖ وَلَتَجِدَنَّ أَقْرَبَهُم مَّوَدَّةًۭ لِّلَّذِينَ ءَامَنُوا۟ ٱلَّذِينَ قَالُوٓا۟ إِنَّا نَصَٰرَىٰ ۚ ذَٰلِكَ بِأَنَّ مِنْهُمْ قِسِّيسِينَ وَرُهْبَانًۭا وَأَنَّهُمْ لَا يَسْتَكْبِرُونَ ﴿82﴾", "ru": "Ты, конечно, найдешь, что более всех людей сильны ненавистью к уверовавшим иудеи и многобожники, и ты, конечно, найдешь, что самые близкие по любви к уверовавшим те, которые говорили: \"Мы - христиане!\" Это - потому, что среди них есть иереи и монахи и что они не превозносятся.", "n": null, "c": null}, {"ref": "62:5", "sura": "Al-Jumu'a", "sura_ar": "سُورَةُ الجُمُعَةِ", "type": "Medinan", "ar": "مَثَلُ ٱلَّذِينَ حُمِّلُوا۟ ٱلتَّوْرَىٰةَ ثُمَّ لَمْ يَحْمِلُوهَا كَمَثَلِ ٱلْحِمَارِ يَحْمِلُ أَسْفَارًۢا ۚ بِئْسَ مَثَلُ ٱلْقَوْمِ ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِ ٱللَّهِ ۚ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ ﴿5﴾", "ru": "Те, кому было дано нести Тору, а они ее не понесли, подобен ослу, который несет книги. Скверно подобие людей, которые считали ложью знамения Аллаха! Аллах не ведет людей неправедных!", "n": "О тех, кому было дано нести Тору, а они её не понесли: «подобен ослу, который несёт книги».", "c": null}, {"ref": "7:166", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "فَلَمَّا عَتَوْا۟ عَن مَّا نُهُوا۟ عَنْهُ قُلْنَا لَهُمْ كُونُوا۟ قِرَدَةً خَٰسِـِٔينَ ﴿166﴾", "ru": "Когда же они преступили то, что им запрещали, Мы сказали им: \" Будьте обезьянами презренными!\"", "n": "Когда они возгордились, Бог сказал им: «Будьте обезьянами презренными!» (см. также 2:65, 5:60).", "c": null}, {"ref": "9:30", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "وَقَالَتِ ٱلْيَهُودُ عُزَيْرٌ ٱبْنُ ٱللَّهِ وَقَالَتِ ٱلنَّصَٰرَى ٱلْمَسِيحُ ٱبْنُ ٱللَّهِ ۖ ذَٰلِكَ قَوْلُهُم بِأَفْوَٰهِهِمْ ۖ يُضَٰهِـُٔونَ قَوْلَ ٱلَّذِينَ كَفَرُوا۟ مِن قَبْلُ ۚ قَٰتَلَهُمُ ٱللَّهُ ۚ أَنَّىٰ يُؤْفَكُونَ ﴿30﴾", "ru": "И сказали иудеи: \"Узайр - сын Аллаха\". И сказали христиане: \"Мессия - сын Аллаха\". Эти слова в их устах похожи на слова тех, которые не веровали раньше. Пусть поразит их Аллах! До чего они отвращены!", "n": "Иудеи сказали: Узайр — сын Аллаха. И христиане сказали: Мессия — сын Аллаха… Пусть поразит их Аллах!", "c": "Исторически нет свидетельств, что иудеи считали Узайра (Ездру) сыном Бога; см. раздел о противоречиях."}]}, {"id": "christians", "title": "Христиане и учение о Троице", "icon": "✝", "group": "Люди и общество", "intro": "Что Коран говорит о христианах и христианской вере: отрицание Троицы, распятия и божественности Иисуса, а также описание Троицы, не совпадающее с христианским учением.", "verses": [{"ref": "5:14", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَمِنَ ٱلَّذِينَ قَالُوٓا۟ إِنَّا نَصَٰرَىٰٓ أَخَذْنَا مِيثَٰقَهُمْ فَنَسُوا۟ حَظًّۭا مِّمَّا ذُكِّرُوا۟ بِهِۦ فَأَغْرَيْنَا بَيْنَهُمُ ٱلْعَدَاوَةَ وَٱلْبَغْضَآءَ إِلَىٰ يَوْمِ ٱلْقِيَٰمَةِ ۚ وَسَوْفَ يُنَبِّئُهُمُ ٱللَّهُ بِمَا كَانُوا۟ يَصْنَعُونَ ﴿14﴾", "ru": "И с тех, которые говорят: \"Мы - христиане!\" - Мы взяли завет. И они забыли часть того, что им было упомянуто, и Мы возбудили среди них вражду и ненависть до дня воскресения. А потом сообщит им Аллах, что они совершали!", "n": "«Мы возбудили среди них вражду и ненависть до дня воскресения» (о тех, кто называет себя христианами).", "c": null}, {"ref": "5:17", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "لَّقَدْ كَفَرَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ هُوَ ٱلْمَسِيحُ ٱبْنُ مَرْيَمَ ۚ قُلْ فَمَن يَمْلِكُ مِنَ ٱللَّهِ شَيْـًٔا إِنْ أَرَادَ أَن يُهْلِكَ ٱلْمَسِيحَ ٱبْنَ مَرْيَمَ وَأُمَّهُۥ وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ۗ وَلِلَّهِ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا ۚ يَخْلُقُ مَا يَشَآءُ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿17﴾", "ru": "Не веруют те, которые говорят, что Аллах - это Мессия, сын Марйам. Скажи: \"Кто же властен чем-нибудь у Аллаха, если Он захочет погубить Мессию, сына Марйам, и его мать, и тех, кто на земле, всех?\" Аллаху принадлежит власть над небесами и землей и тем, что между ними. Он творит то, что желает: ведь Аллах над всякой вещью властен!", "n": null, "c": null}, {"ref": "5:72-75", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "لَقَدْ كَفَرَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ هُوَ ٱلْمَسِيحُ ٱبْنُ مَرْيَمَ ۖ وَقَالَ ٱلْمَسِيحُ يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱعْبُدُوا۟ ٱللَّهَ رَبِّى وَرَبَّكُمْ ۖ إِنَّهُۥ مَن يُشْرِكْ بِٱللَّهِ فَقَدْ حَرَّمَ ٱللَّهُ عَلَيْهِ ٱلْجَنَّةَ وَمَأْوَىٰهُ ٱلنَّارُ ۖ وَمَا لِلظَّٰلِمِينَ مِنْ أَنصَارٍۢ ﴿72﴾ لَّقَدْ كَفَرَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ ثَالِثُ ثَلَٰثَةٍۢ ۘ وَمَا مِنْ إِلَٰهٍ إِلَّآ إِلَٰهٌۭ وَٰحِدٌۭ ۚ وَإِن لَّمْ يَنتَهُوا۟ عَمَّا يَقُولُونَ لَيَمَسَّنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْهُمْ عَذَابٌ أَلِيمٌ ﴿73﴾ أَفَلَا يَتُوبُونَ إِلَى ٱللَّهِ وَيَسْتَغْفِرُونَهُۥ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ ﴿74﴾ مَّا ٱلْمَسِيحُ ٱبْنُ مَرْيَمَ إِلَّا رَسُولٌۭ قَدْ خَلَتْ مِن قَبْلِهِ ٱلرُّسُلُ وَأُمُّهُۥ صِدِّيقَةٌۭ ۖ كَانَا يَأْكُلَانِ ٱلطَّعَامَ ۗ ٱنظُرْ كَيْفَ نُبَيِّنُ لَهُمُ ٱلْءَايَٰتِ ثُمَّ ٱنظُرْ أَنَّىٰ يُؤْفَكُونَ ﴿75﴾", "ru": "(72) Не веровали те, которые говорили: \"Ведь Аллах - Мессия, сын Марйам\". А Мессия сказал: \"О сыны Исраила! Поклоняйтесь Аллаху, Господу моему и Господу вашему!\" Ведь, кто придает Аллаху сотоварищей, тому Аллах запретил рай. Убежищем для него - огонь, и нет для неправедных помощников! (73) Не веровали те, которые говорили: \"Ведь Аллах - третий из трех\", - тогда как нет другого божества, кроме единого Бога. А если они не удержатся от того, что говорят, то коснется тех из них, которые не уверовали, мучительное наказание. (74) Неужели они не обратятся к Аллаху и не попросят у Него прощения? Ведь Аллах - прощающий, милостивый! (75) Мессия, сын Марйам, - только посланник, прошли уже до него посланники, а мать его - праведница. Оба они ели пищу. Посмотри, как разъясняем Мы им знамения; потом посмотри, до чего они отвращены!", "n": "Не веруют те, кто говорит: «Ведь Аллах — Мессия, сын Марйам»; Мессия и его мать «ели пищу» — довод против божественности (5:75).", "c": "В христианском учении Троица — Отец, Сын и Святой Дух, а не Бог, Иисус и Мария."}, {"ref": "19:88-93", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "وَقَالُوا۟ ٱتَّخَذَ ٱلرَّحْمَٰنُ وَلَدًۭا ﴿88﴾ لَّقَدْ جِئْتُمْ شَيْـًٔا إِدًّۭا ﴿89﴾ تَكَادُ ٱلسَّمَٰوَٰتُ يَتَفَطَّرْنَ مِنْهُ وَتَنشَقُّ ٱلْأَرْضُ وَتَخِرُّ ٱلْجِبَالُ هَدًّا ﴿90﴾ أَن دَعَوْا۟ لِلرَّحْمَٰنِ وَلَدًۭا ﴿91﴾ وَمَا يَنۢبَغِى لِلرَّحْمَٰنِ أَن يَتَّخِذَ وَلَدًا ﴿92﴾ إِن كُلُّ مَن فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ إِلَّآ ءَاتِى ٱلرَّحْمَٰنِ عَبْدًۭا ﴿93﴾", "ru": "(88) И говорят они: \"Взял Себе Милосердный сына\". (89) Вы совершили вещь гнусную. (90) Небеса готовы распасться от этого, и земля разверзнуться, горы пасть прахом (91) оттого, что они приписали Милосердному сына. (92) Не подобает Милосердному брать Себе сына. (93) Всякий, кто в небесах и на земле, приходит к Милосердному только как раб;", "n": null, "c": null}, {"ref": "112:1-4", "sura": "Al-Ikhlaas", "sura_ar": "سُورَةُ الإِخۡلَاصِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ هُوَ ٱللَّهُ أَحَدٌ ﴿1﴾ ٱللَّهُ ٱلصَّمَدُ ﴿2﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿3﴾ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ ﴿4﴾", "ru": "(1) Скажи: \"Он - Аллах - един, (2) Аллах, вечный; (3) не родил и не был рожден, (4) и не был Ему равным ни один!\"", "n": null, "c": null}]}, {"id": "apostasy", "title": "Вероотступники и лицемеры", "icon": "☠", "group": "Люди и общество", "intro": "Аяты о тех, кто отходит от ислама или лицемерит. В этих аятах угроза обращена к будущей жизни; прямого указания на земную казнь за отступничество в них нет, но в аятах 4:89 и 33:61 содержатся приказы убивать; классическое право опиралось на них.", "verses": [{"ref": "2:217", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "يَسْـَٔلُونَكَ عَنِ ٱلشَّهْرِ ٱلْحَرَامِ قِتَالٍۢ فِيهِ ۖ قُلْ قِتَالٌۭ فِيهِ كَبِيرٌۭ ۖ وَصَدٌّ عَن سَبِيلِ ٱللَّهِ وَكُفْرٌۢ بِهِۦ وَٱلْمَسْجِدِ ٱلْحَرَامِ وَإِخْرَاجُ أَهْلِهِۦ مِنْهُ أَكْبَرُ عِندَ ٱللَّهِ ۚ وَٱلْفِتْنَةُ أَكْبَرُ مِنَ ٱلْقَتْلِ ۗ وَلَا يَزَالُونَ يُقَٰتِلُونَكُمْ حَتَّىٰ يَرُدُّوكُمْ عَن دِينِكُمْ إِنِ ٱسْتَطَٰعُوا۟ ۚ وَمَن يَرْتَدِدْ مِنكُمْ عَن دِينِهِۦ فَيَمُتْ وَهُوَ كَافِرٌۭ فَأُو۟لَٰٓئِكَ حَبِطَتْ أَعْمَٰلُهُمْ فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ ۖ وَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَٰلِدُونَ ﴿217﴾", "ru": "Спрашивают они тебя о запретном месяце - сражении в нем. Скажи: \"Сражение в нем велико, а отвращение от пути Аллаха, неверие в него и запретную мечеть и изгнание оттуда ее обитателей - еще больше пред Аллахом: ведь соблазн - больше, чем убиение!\" А они не перестанут сражаться с вами, пока не отвратят вас от вашей религии, если смогут. А если кто из вас отпадает от вашей религии и умрет неверным, у таких - тщетны их деяния в ближайшей и будущей жизни! Эти - обитатели огня, они в нем вечно пребывают!", "n": null, "c": null}, {"ref": "3:86-87", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "كَيْفَ يَهْدِى ٱللَّهُ قَوْمًۭا كَفَرُوا۟ بَعْدَ إِيمَٰنِهِمْ وَشَهِدُوٓا۟ أَنَّ ٱلرَّسُولَ حَقٌّۭ وَجَآءَهُمُ ٱلْبَيِّنَٰتُ ۚ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ ﴿86﴾ أُو۟لَٰٓئِكَ جَزَآؤُهُمْ أَنَّ عَلَيْهِمْ لَعْنَةَ ٱللَّهِ وَٱلْمَلَٰٓئِكَةِ وَٱلنَّاسِ أَجْمَعِينَ ﴿87﴾", "ru": "(86) Как Аллах будет вести прямым путем людей, которые отрекались после того, как они уверовали и засвидетельствовали, что посланник - истина, и пришли к ним ясные знамения? Поистине, Аллах не ведет людей неправедных! (87) Этим воздаяние - в том, что на них - проклятие Аллаха, и ангелов, и всех людей.", "n": "Кто уверовал, потом стал неверным — Бог не поведёт; им — проклятие Аллаха, ангелов и всех людей.", "c": null}, {"ref": "4:137", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ ءَامَنُوا۟ ثُمَّ كَفَرُوا۟ ثُمَّ ءَامَنُوا۟ ثُمَّ كَفَرُوا۟ ثُمَّ ٱزْدَادُوا۟ كُفْرًۭا لَّمْ يَكُنِ ٱللَّهُ لِيَغْفِرَ لَهُمْ وَلَا لِيَهْدِيَهُمْ سَبِيلًۢا ﴿137﴾", "ru": "Поистине, те, которые уверовали, а потом отреклись, потом опять уверовали, потом открылись, потом усилили неверие, - не таков Аллах, чтобы простить им или повести их по пути.", "n": "Уверовавшие, потом отрёкшиеся, потом снова уверовавшие и снова отрёкшиеся, затем умножившие неверие — Бог их не простит.", "c": null}, {"ref": "4:145", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "إِنَّ ٱلْمُنَٰفِقِينَ فِى ٱلدَّرْكِ ٱلْأَسْفَلِ مِنَ ٱلنَّارِ وَلَن تَجِدَ لَهُمْ نَصِيرًا ﴿145﴾", "ru": "Поистине, лицемеры - в нижнем слое огня, и никогда не найдешь ты для них помощника, -", "n": null, "c": null}, {"ref": "9:66", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "لَا تَعْتَذِرُوا۟ قَدْ كَفَرْتُم بَعْدَ إِيمَٰنِكُمْ ۚ إِن نَّعْفُ عَن طَآئِفَةٍۢ مِّنكُمْ نُعَذِّبْ طَآئِفَةًۢ بِأَنَّهُمْ كَانُوا۟ مُجْرِمِينَ ﴿66﴾", "ru": "Не извиняйтесь! Вы оказались неверными, после того как уверовали. Если Мы простим одной партии вас, то накажем другую партию за то, что они были грешниками.", "n": null, "c": null}, {"ref": "9:74", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَحْلِفُونَ بِٱللَّهِ مَا قَالُوا۟ وَلَقَدْ قَالُوا۟ كَلِمَةَ ٱلْكُفْرِ وَكَفَرُوا۟ بَعْدَ إِسْلَٰمِهِمْ وَهَمُّوا۟ بِمَا لَمْ يَنَالُوا۟ ۚ وَمَا نَقَمُوٓا۟ إِلَّآ أَنْ أَغْنَىٰهُمُ ٱللَّهُ وَرَسُولُهُۥ مِن فَضْلِهِۦ ۚ فَإِن يَتُوبُوا۟ يَكُ خَيْرًۭا لَّهُمْ ۖ وَإِن يَتَوَلَّوْا۟ يُعَذِّبْهُمُ ٱللَّهُ عَذَابًا أَلِيمًۭا فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ ۚ وَمَا لَهُمْ فِى ٱلْأَرْضِ مِن وَلِىٍّۢ وَلَا نَصِيرٍۢ ﴿74﴾", "ru": "Они клянутся Аллахом, что не говорили , когда они уже сказали слово неверия и стали неверными после своего ислама. И задумали они то, чего не достигли, и мстят они только за то, что обогатил их Аллах и Его посланник от Своей щедрости. И если они обратятся, - будет лучше для них, а если отвернутся, - накажет их Аллах мучительным наказанием в ближайшей жизни и в будущей. Нет им на земле ни заступника, ни помощника!", "n": "Лицемеры сказали «слово неверия» и замыслили то, чего не достигли; им — мучительное наказание.", "c": null}, {"ref": "9:101", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "وَمِمَّنْ حَوْلَكُم مِّنَ ٱلْأَعْرَابِ مُنَٰفِقُونَ ۖ وَمِنْ أَهْلِ ٱلْمَدِينَةِ ۖ مَرَدُوا۟ عَلَى ٱلنِّفَاقِ لَا تَعْلَمُهُمْ ۖ نَحْنُ نَعْلَمُهُمْ ۚ سَنُعَذِّبُهُم مَّرَّتَيْنِ ثُمَّ يُرَدُّونَ إِلَىٰ عَذَابٍ عَظِيمٍۢ ﴿101﴾", "ru": "А среди бедуинов, что вокруг вас, и жителей Медины есть лицемеры; они - упрямы в лицемерии. Ты их не знаешь, Мы их знаем. Мы их накажем дважды, потом они будут возвращены к великому наказанию.", "n": "Лицемеры: Мы дважды накажем их, потом они будут возвращены к великому наказанию.", "c": null}, {"ref": "16:106", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "مَن كَفَرَ بِٱللَّهِ مِنۢ بَعْدِ إِيمَٰنِهِۦٓ إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُۥ مُطْمَئِنٌّۢ بِٱلْإِيمَٰنِ وَلَٰكِن مَّن شَرَحَ بِٱلْكُفْرِ صَدْرًۭا فَعَلَيْهِمْ غَضَبٌۭ مِّنَ ٱللَّهِ وَلَهُمْ عَذَابٌ عَظِيمٌۭ ﴿106﴾", "ru": "Кто отказался от Аллаха после веры в Него - кроме тех, которые вынуждены, а сердце их спокойно в вере - только тот, кто открыл неверию свою грудь, на них - гнев Аллаха, им - наказание великое.", "n": "«Кто отказался от Аллаха после веры в Него… на них — гнев Аллаха, им — наказание великое» — кроме тех, «которые вынуждены, а сердце их спокойно в вере».", "c": null}, {"ref": "63:4", "sura": "Al-Munaafiqoon", "sura_ar": "سُورَةُ المُنَافِقُونَ", "type": "Medinan", "ar": "۞ وَإِذَا رَأَيْتَهُمْ تُعْجِبُكَ أَجْسَامُهُمْ ۖ وَإِن يَقُولُوا۟ تَسْمَعْ لِقَوْلِهِمْ ۖ كَأَنَّهُمْ خُشُبٌۭ مُّسَنَّدَةٌۭ ۖ يَحْسَبُونَ كُلَّ صَيْحَةٍ عَلَيْهِمْ ۚ هُمُ ٱلْعَدُوُّ فَٱحْذَرْهُمْ ۚ قَٰتَلَهُمُ ٱللَّهُ ۖ أَنَّىٰ يُؤْفَكُونَ ﴿4﴾", "ru": "А когда ты их увидишь, тебя восхищают их фигуры. Если они говорят, ты слушаешь их слова, точно они столпы приставленные. Они принимают всякий крик - против них. Они - враги, берегись же их! Пусть Аллах их поразит, до чего они обольщены!", "n": "О лицемерах: «Они — враги, берегись же их! Пусть Аллах их поразит!»", "c": null}]}, {"id": "critic", "title": "Критика, сомнение и вопросы", "icon": "🚫", "group": "Люди и общество", "intro": "Как Коран относится к вопросам, спорам и критике самого текста и Пророка. Для критиков эти аяты показывают запрет на сомнение и желание защитить текст угрозами.", "verses": [{"ref": "5:101-102", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَسْـَٔلُوا۟ عَنْ أَشْيَآءَ إِن تُبْدَ لَكُمْ تَسُؤْكُمْ وَإِن تَسْـَٔلُوا۟ عَنْهَا حِينَ يُنَزَّلُ ٱلْقُرْءَانُ تُبْدَ لَكُمْ عَفَا ٱللَّهُ عَنْهَا ۗ وَٱللَّهُ غَفُورٌ حَلِيمٌۭ ﴿101﴾ قَدْ سَأَلَهَا قَوْمٌۭ مِّن قَبْلِكُمْ ثُمَّ أَصْبَحُوا۟ بِهَا كَٰفِرِينَ ﴿102﴾", "ru": "(101) О вы, которые уверовали! Не спрашивайте о вещах, которые огорчат вас, если откроются вам. А если вы спросите о них, когда низводится Коран, они откроются вам. Аллах простил за них: ведь Аллах - прощающий, кроткий. (102) Спрашивали о них люди до вас; потом оказались неверующими в них.", "n": "«Не спрашивайте о вещах, которые огорчат вас, если откроются вам»; а о таких вещах спрашивали «до вас» люди, а потом они стали неверными по отношению к ним (5:102).", "c": null}, {"ref": "4:140", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَقَدْ نَزَّلَ عَلَيْكُمْ فِى ٱلْكِتَٰبِ أَنْ إِذَا سَمِعْتُمْ ءَايَٰتِ ٱللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُوا۟ مَعَهُمْ حَتَّىٰ يَخُوضُوا۟ فِى حَدِيثٍ غَيْرِهِۦٓ ۚ إِنَّكُمْ إِذًۭا مِّثْلُهُمْ ۗ إِنَّ ٱللَّهَ جَامِعُ ٱلْمُنَٰفِقِينَ وَٱلْكَٰفِرِينَ فِى جَهَنَّمَ جَمِيعًا ﴿140﴾", "ru": "Аллах уже низвел вам в писании, что когда вы слушаете знамения Аллаха, в которые не веруют и над которыми издеваются, то не сидите вместе с ними, пока они не погрузятся в другой рассказ: ведь тогда вы подобны им. Поистине, Аллах соберет лицемеров и неверных всех в геенне!", "n": "Когда вы услышите, что знамения Аллаха отвергают и над ними глумятся, не сидите с ними, пока они не перейдут к другому разговору.", "c": null}, {"ref": "6:68", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَإِذَا رَأَيْتَ ٱلَّذِينَ يَخُوضُونَ فِىٓ ءَايَٰتِنَا فَأَعْرِضْ عَنْهُمْ حَتَّىٰ يَخُوضُوا۟ فِى حَدِيثٍ غَيْرِهِۦ ۚ وَإِمَّا يُنسِيَنَّكَ ٱلشَّيْطَٰنُ فَلَا تَقْعُدْ بَعْدَ ٱلذِّكْرَىٰ مَعَ ٱلْقَوْمِ ٱلظَّٰلِمِينَ ﴿68﴾", "ru": "А когда ты увидишь тех, которые погружаются в пучину пустословия о Наших знамениях, то отвернись от них, пока они не погрузятся в какой-нибудь другой рассказ. И если сатана заставит тебя забыть, то ты после напоминания не сиди с людьми неправедными.", "n": null, "c": null}, {"ref": "9:12", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "وَإِن نَّكَثُوٓا۟ أَيْمَٰنَهُم مِّنۢ بَعْدِ عَهْدِهِمْ وَطَعَنُوا۟ فِى دِينِكُمْ فَقَٰتِلُوٓا۟ أَئِمَّةَ ٱلْكُفْرِ ۙ إِنَّهُمْ لَآ أَيْمَٰنَ لَهُمْ لَعَلَّهُمْ يَنتَهُونَ ﴿12﴾", "ru": "А если они нарушили свои клятвы после договора и поносили вашу религию, то сражайтесь с имамами неверия, - ведь нет клятв для них, - может быть, они удержатся!", "n": "«Если они нарушили свои клятвы после договора и поносили вашу религию — то сражайтесь с имамами неверия»: поношение религии включено в повод к войне.", "c": null}, {"ref": "22:8-9", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "وَمِنَ ٱلنَّاسِ مَن يُجَٰدِلُ فِى ٱللَّهِ بِغَيْرِ عِلْمٍۢ وَلَا هُدًۭى وَلَا كِتَٰبٍۢ مُّنِيرٍۢ ﴿8﴾ ثَانِىَ عِطْفِهِۦ لِيُضِلَّ عَن سَبِيلِ ٱللَّهِ ۖ لَهُۥ فِى ٱلدُّنْيَا خِزْىٌۭ ۖ وَنُذِيقُهُۥ يَوْمَ ٱلْقِيَٰمَةِ عَذَابَ ٱلْحَرِيقِ ﴿9﴾", "ru": "(8) И среди людей есть такой, кто препирается об Аллахе без знания, и без руководства, и освещающей книги, (9) отворачивая свою шею, чтобы сбить с пути Аллаха. Для него в ближайшем мире - позор, а в день восстания Мы заставим его вкусить наказание огня.", "n": "«Среди людей есть такой, кто препирается об Аллахе без знания и без руководства» — такого ждёт позор в ближайшей жизни и огонь в будущей (22:9).", "c": null}, {"ref": "33:57-58", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ يُؤْذُونَ ٱللَّهَ وَرَسُولَهُۥ لَعَنَهُمُ ٱللَّهُ فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ وَأَعَدَّ لَهُمْ عَذَابًۭا مُّهِينًۭا ﴿57﴾ وَٱلَّذِينَ يُؤْذُونَ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ بِغَيْرِ مَا ٱكْتَسَبُوا۟ فَقَدِ ٱحْتَمَلُوا۟ بُهْتَٰنًۭا وَإِثْمًۭا مُّبِينًۭا ﴿58﴾", "ru": "(57) Поистине, те, которые причиняют обиду Аллаху и Его посланнику, - проклял их Аллах в жизни здешней и будущей и приготовил им наказание унизительное. (58) А те, которые причиняют обиду верующим (мужчинам) и верующим (женщинам) без того, чтобы они это заслужили, - они берут на себя ложь и явный грех.", "n": "Тех, кто обижает Аллаха и Его посланника, проклянёт Аллах; кто обижает верующих без того, чтобы они это заслужили — взял на себя клевету.", "c": null}, {"ref": "40:35", "sura": "Ghafir", "sura_ar": "سُورَةُ غَافِرٍ", "type": "Meccan", "ar": "ٱلَّذِينَ يُجَٰدِلُونَ فِىٓ ءَايَٰتِ ٱللَّهِ بِغَيْرِ سُلْطَٰنٍ أَتَىٰهُمْ ۖ كَبُرَ مَقْتًا عِندَ ٱللَّهِ وَعِندَ ٱلَّذِينَ ءَامَنُوا۟ ۚ كَذَٰلِكَ يَطْبَعُ ٱللَّهُ عَلَىٰ كُلِّ قَلْبِ مُتَكَبِّرٍۢ جَبَّارٍۢ ﴿35﴾", "ru": "Те, которые препираются о знамениях Аллах без власти, данной им, - велика к этому ненависть у Аллаха и у тех, которые уверовали! Так Аллах запечатал сердце каждого превозносящегося, тирана!", "n": "О тех, которые препираются о знамениях Аллаха без доказательства: великая ненависть у Аллаха.", "c": null}, {"ref": "47:24", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "أَفَلَا يَتَدَبَّرُونَ ٱلْقُرْءَانَ أَمْ عَلَىٰ قُلُوبٍ أَقْفَالُهَآ ﴿24﴾", "ru": "Разве они не подумают о Коране? Или на сердцах бывают их затворы?", "n": "Разве они не размышляют о Коране, или на сердцах замки?", "c": null}]}, {"id": "ethics", "title": "Месть, клятвы и ложь", "icon": "⚖", "group": "Люди и общество", "intro": "Нормы о мести, расторжении клятв и допустимости скрывать убеждения. Включает и аяты, которые часто цитируют как гуманные, вместе с оговорками, содержащимися в самом тексте.", "verses": [{"ref": "2:194", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱلشَّهْرُ ٱلْحَرَامُ بِٱلشَّهْرِ ٱلْحَرَامِ وَٱلْحُرُمَٰتُ قِصَاصٌۭ ۚ فَمَنِ ٱعْتَدَىٰ عَلَيْكُمْ فَٱعْتَدُوا۟ عَلَيْهِ بِمِثْلِ مَا ٱعْتَدَىٰ عَلَيْكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ مَعَ ٱلْمُتَّقِينَ ﴿194﴾", "ru": "Запретный месяц - за запретный месяц. И запреты - Возмездие. Кто же преступает против вас, - то и вы преступайте против него подобно тому, как он преступил против вас. И бойтесь Аллаха и знайте, что Аллах - с богобоязненными!", "n": "Кто преступил против вас, преступайте против него, как он преступил против вас.", "c": null}, {"ref": "16:126", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَإِنْ عَاقَبْتُمْ فَعَاقِبُوا۟ بِمِثْلِ مَا عُوقِبْتُم بِهِۦ ۖ وَلَئِن صَبَرْتُمْ لَهُوَ خَيْرٌۭ لِّلصَّٰبِرِينَ ﴿126﴾", "ru": "И если вы наказываете, то наказывайте подобным тому, чем вы были наказаны. А если терпите, то это - лучше для терпеливых.", "n": "Если вы наказываете, наказывайте так, как вас наказывали.", "c": null}, {"ref": "42:40-41", "sura": "Ash-Shura", "sura_ar": "سُورَةُ الشُّورَىٰ", "type": "Meccan", "ar": "وَجَزَٰٓؤُا۟ سَيِّئَةٍۢ سَيِّئَةٌۭ مِّثْلُهَا ۖ فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُۥ عَلَى ٱللَّهِ ۚ إِنَّهُۥ لَا يُحِبُّ ٱلظَّٰلِمِينَ ﴿40﴾ وَلَمَنِ ٱنتَصَرَ بَعْدَ ظُلْمِهِۦ فَأُو۟لَٰٓئِكَ مَا عَلَيْهِم مِّن سَبِيلٍ ﴿41﴾", "ru": "(40) И воздаянием зла - зло, подобное ему. Но кто простит и уладит, - награда его у Аллаха. Он ведь не любит несправедливых! (41) А кто ищет помощи после обиды, то к ним нет пути.", "n": null, "c": null}, {"ref": "5:32", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "مِنْ أَجْلِ ذَٰلِكَ كَتَبْنَا عَلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنَّهُۥ مَن قَتَلَ نَفْسًۢا بِغَيْرِ نَفْسٍ أَوْ فَسَادٍۢ فِى ٱلْأَرْضِ فَكَأَنَّمَا قَتَلَ ٱلنَّاسَ جَمِيعًۭا وَمَنْ أَحْيَاهَا فَكَأَنَّمَآ أَحْيَا ٱلنَّاسَ جَمِيعًۭا ۚ وَلَقَدْ جَآءَتْهُمْ رُسُلُنَا بِٱلْبَيِّنَٰتِ ثُمَّ إِنَّ كَثِيرًۭا مِّنْهُم بَعْدَ ذَٰلِكَ فِى ٱلْأَرْضِ لَمُسْرِفُونَ ﴿32﴾", "ru": "По этой причине предписали Мы сынам Исраила: кто убил душ
