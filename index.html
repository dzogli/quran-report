сякую вещь, которую сотворил, и начал творение человека из глины, (8) потом сделал потомство его из капли жалкой воды, (9) потом выровнял его и вдул в него от Своего духа и устроил вам слух, зрение и сердца. Мало вы благодарны!"}, {"ref": "77:20-23", "sura": "Al-Mursalaat", "sura_ar": "سُورَةُ المُرۡسَلَاتِ", "type": "Meccan", "ar": "أَلَمْ نَخْلُقكُّم مِّن مَّآءٍۢ مَّهِينٍۢ ﴿20﴾ فَجَعَلْنَٰهُ فِى قَرَارٍۢ مَّكِينٍ ﴿21﴾ إِلَىٰ قَدَرٍۢ مَّعْلُومٍۢ ﴿22﴾ فَقَدَرْنَا فَنِعْمَ ٱلْقَٰدِرُونَ ﴿23﴾", "ru": "(20) Разве Мы не создали вас из воды ничтожной (21) и поместили ее в прочном месте (22) до известного срока? (23) Мы распределили, и как прекрасны распределяющие!"}], "n": "Что сказано: ⟦Из праха, потом из капли, потом из сгустка крови, потом из куска мяса, сформованного и несформованного⟧ (22:5); ⟦Мы создали из сгустка кусок… создали кусок костями, и одели кости мясом⟧ (23:14); «в утробах ваших матерей… в трёх мраках» (39:6); из «капли жалкой воды» (32:8); из ⟦воды презренной⟧ (77:20).\nВ чём проблема: (1) Последовательность ⟦кости, затем плоть⟧ не соответствует эмбриологии: мышцы и кости начинают формироваться одновременно. Критики видят схему античной медицины (Галена). (2) «Сгусток крови» (алака) — не стадия развития эмбриона; апологеты переводят ⟦алака⟧ как ⟦прилипающее⟧. (3) ⟦Прах/глина⟧ — образ, а не научное описание. Апологеты: аят верен в общих чертах для VII века; критики: расхождения с точной эмбриологией.", "c": null, "x": [], "t": "Развитие человека", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. «Кости, затем плоть» и «алака» сопоставляют с эмбриологией."}, {"refs": ["16:66", "16:68-69"], "parts": [{"ref": "16:66", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَإِنَّ لَكُمْ فِى ٱلْأَنْعَٰمِ لَعِبْرَةًۭ ۖ نُّسْقِيكُم مِّمَّا فِى بُطُونِهِۦ مِنۢ بَيْنِ فَرْثٍۢ وَدَمٍۢ لَّبَنًا خَالِصًۭا سَآئِغًۭا لِّلشَّٰرِبِينَ ﴿66﴾", "ru": "Для вас и в (вашем) скоте - назидание. Мы поим вас из того, что у них в желудках между калом и кровью молоком чистым, приятным для пьющих."}, {"ref": "16:68-69", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَأَوْحَىٰ رَبُّكَ إِلَى ٱلنَّحْلِ أَنِ ٱتَّخِذِى مِنَ ٱلْجِبَالِ بُيُوتًۭا وَمِنَ ٱلشَّجَرِ وَمِمَّا يَعْرِشُونَ ﴿68﴾ ثُمَّ كُلِى مِن كُلِّ ٱلثَّمَرَٰتِ فَٱسْلُكِى سُبُلَ رَبِّكِ ذُلُلًۭا ۚ يَخْرُجُ مِنۢ بُطُونِهَا شَرَابٌۭ مُّخْتَلِفٌ أَلْوَٰنُهُۥ فِيهِ شِفَآءٌۭ لِّلنَّاسِ ۗ إِنَّ فِى ذَٰلِكَ لَءَايَةًۭ لِّقَوْمٍۢ يَتَفَكَّرُونَ ﴿69﴾", "ru": "(68) И внушил Господь твой пчеле: \"Устраивай в горах дома, и на деревьях и в том, что они строят; (69) потом питайся всякими плодами и ходи по путям Господа твоего со смирением\". Выходит из внутренностей их питье разного цвета, в котором лечение для людей. Поистине, в этом - знамение для людей, которые размышляют!"}], "n": "Что сказано: Молоко выходит ⟦из того, что в желудках, между калом и кровью⟧ (16:66); пчеле «внушил» Господь (16:68); из её чрева выходит питьё разных цветов — ⟦в нём исцеление для людей⟧ (16:69).\nВ чём проблема: молоко образуется в молочной железе из компонентов крови, а не ⟦между содержимым кишечника и кровью⟧ (хотя питательные вещества попадают в кровь из кишечника). Мёд не ⟦выходит из чрева⟧: пчёлы перерабатывают нектар в зобике и отрыгивают, а ⟦исцеление для людей⟧ — широкое утверждение. Апологеты: образное описание.", "c": null, "x": [], "t": "Молоко и мёд", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. Молоко «между содержимым кишечника и кровью». Апологеты видят образ."}, {"n": "Что сказано: ⟦Пусть же посмотрит человек, из чего он создан: создан из воды изливающейся, выходит она из хребта и грудных костей⟧.\nВ чём проблема: семя образуется в яичках, а не между позвоночником и рёбрами. Апологеты: ⟦хребет и рёбра⟧ — зона, где половые железы закладываются у эмбриона (а потом опускаются). Критики: аят говорит прямо о том, откуда «выходит» вода.", "c": "Апологеты предлагают толкования с эмбриональным происхождением половых желёз; но текст прямо говорит о ⟦хребте и рёбрах⟧.", "x": [], "refs": ["86:6-7"], "parts": [{"ref": "86:6-7", "sura": "At-Taariq", "sura_ar": "سُورَةُ الطَّارِقِ", "type": "Meccan", "ar": "خُلِقَ مِن مَّآءٍۢ دَافِقٍۢ ﴿6﴾ يَخْرُجُ مِنۢ بَيْنِ ٱلصُّلْبِ وَٱلتَّرَآئِبِ ﴿7﴾", "ru": "(6) Создан из воды изливающейся. (7) Выходит она из хребта и грудных костей."}], "t": null, "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. Семя «между хребтом и рёбрами». Апологеты видят зону закладки."}, {"refs": ["27:16", "27:18-19", "27:20-24", "6:38"], "parts": [{"ref": "27:16", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "وَوَرِثَ سُلَيْمَٰنُ دَاوُۥدَ ۖ وَقَالَ يَٰٓأَيُّهَا ٱلنَّاسُ عُلِّمْنَا مَنطِقَ ٱلطَّيْرِ وَأُوتِينَا مِن كُلِّ شَىْءٍ ۖ إِنَّ هَٰذَا لَهُوَ ٱلْفَضْلُ ٱلْمُبِينُ ﴿16﴾", "ru": "И унаследовал Сулайман Дауду и сказал: \"О люди, научены мы языку птиц, и даровано нам все! Поистине, это - явное преимущество!\""}, {"ref": "27:18-19", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَآ أَتَوْا۟ عَلَىٰ وَادِ ٱلنَّمْلِ قَالَتْ نَمْلَةٌۭ يَٰٓأَيُّهَا ٱلنَّمْلُ ٱدْخُلُوا۟ مَسَٰكِنَكُمْ لَا يَحْطِمَنَّكُمْ سُلَيْمَٰنُ وَجُنُودُهُۥ وَهُمْ لَا يَشْعُرُونَ ﴿18﴾ فَتَبَسَّمَ ضَاحِكًۭا مِّن قَوْلِهَا وَقَالَ رَبِّ أَوْزِعْنِىٓ أَنْ أَشْكُرَ نِعْمَتَكَ ٱلَّتِىٓ أَنْعَمْتَ عَلَىَّ وَعَلَىٰ وَٰلِدَىَّ وَأَنْ أَعْمَلَ صَٰلِحًۭا تَرْضَىٰهُ وَأَدْخِلْنِى بِرَحْمَتِكَ فِى عِبَادِكَ ٱلصَّٰلِحِينَ ﴿19﴾", "ru": "(18) А когда они дошли до муравьиной долины, одна муравьиха сказала: \"О муравьи, войдите в ваше жилье, пусть не растопчет вас Сулайман и его войска, не замечая этого\". (19) Он улыбнулся, засмеявшись от ее слов, и сказал: \"Господи, внуши мне быть благодарным за Твою милость, которую Ты ниспослал мне и моим родителям, и чтобы я делал благо, которое Тебе угодно, и введи меня Твоей милостью в число рабов Твоих праведных!\""}, {"ref": "27:20-24", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "وَتَفَقَّدَ ٱلطَّيْرَ فَقَالَ مَا لِىَ لَآ أَرَى ٱلْهُدْهُدَ أَمْ كَانَ مِنَ ٱلْغَآئِبِينَ ﴿20﴾ لَأُعَذِّبَنَّهُۥ عَذَابًۭا شَدِيدًا أَوْ لَأَا۟ذْبَحَنَّهُۥٓ أَوْ لَيَأْتِيَنِّى بِسُلْطَٰنٍۢ مُّبِينٍۢ ﴿21﴾ فَمَكَثَ غَيْرَ بَعِيدٍۢ فَقَالَ أَحَطتُ بِمَا لَمْ تُحِطْ بِهِۦ وَجِئْتُكَ مِن سَبَإٍۭ بِنَبَإٍۢ يَقِينٍ ﴿22﴾ إِنِّى وَجَدتُّ ٱمْرَأَةًۭ تَمْلِكُهُمْ وَأُوتِيَتْ مِن كُلِّ شَىْءٍۢ وَلَهَا عَرْشٌ عَظِيمٌۭ ﴿23﴾ وَجَدتُّهَا وَقَوْمَهَا يَسْجُدُونَ لِلشَّمْسِ مِن دُونِ ٱللَّهِ وَزَيَّنَ لَهُمُ ٱلشَّيْطَٰنُ أَعْمَٰلَهُمْ فَصَدَّهُمْ عَنِ ٱلسَّبِيلِ فَهُمْ لَا يَهْتَدُونَ ﴿24﴾", "ru": "(20) И он стал разыскивать птиц и сказал: \"Почему это я не вижу удода? Или он отсутствует? (21) Я накажу его наказанием сильным, или убью его, или он придет ко мне с явной властью\". (22) Тот пробыл недолго и сказал: \"Я узнал то, чего ты не знаешь, и пришел к тебе от Сабы с верным известием. (23) Я нашел женщину, которая ими правит, и даровано ей все, и у нее великий трон. (24) Я нашел, что она и ее народ поклоняются солнцу вместо Аллаха, и сатана разукрасил им их деяния и отвратил их с пути, и они не идут прямо, -"}, {"ref": "6:38", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ وَلَا طَٰٓئِرٍۢ يَطِيرُ بِجَنَاحَيْهِ إِلَّآ أُمَمٌ أَمْثَالُكُم ۚ مَّا فَرَّطْنَا فِى ٱلْكِتَٰبِ مِن شَىْءٍۢ ۚ ثُمَّ إِلَىٰ رَبِّهِمْ يُحْشَرُونَ ﴿38﴾", "ru": "Нет животного на земле и птицы, летающей на крыльях, которые не были бы общинами, подобными вам. Мы не упустили в книге ничего, потом к вашему Господу они будут собраны."}], "n": "Что сказано: Сулайман говорит: «Научены мы языку птиц» (27:16); муравей предупреждает остальных: «О муравьи, войдите в ваше жилье» (27:18); удод вступает в беседу с Сулайманом: «Я узнал то, чего ты не знаешь», сообщает о Сабе и осуждает поклонение солнцу (27:20-24); «нет животного на земле и птицы, летающей на крыльях, которые не были бы общинами, подобными вам» (6:38).\nВ чём проблема: говорящие животные, ведущие богословские рассуждения (удод осуждает ⟦поклонение солнцу вместо Аллаха⟧), нереалистичны; сюжет напоминает сказание. Апологеты: чудо Сулаймана. Аят 6:38 про ⟦общины⟧ у животных (а 6:38 — ⟦Мы ничего не упустили в книге⟧) также не подтверждён наукой.", "c": null, "x": ["3:7"], "t": "Животные разговаривают", "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. Разговор животных; чудо, не проверяется."}, {"refs": ["29:14", "18:25"], "parts": [{"ref": "29:14", "sura": "Al-Ankaboot", "sura_ar": "سُورَةُ العَنكَبُوتِ", "type": "Meccan", "ar": "وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِۦ فَلَبِثَ فِيهِمْ أَلْفَ سَنَةٍ إِلَّا خَمْسِينَ عَامًۭا فَأَخَذَهُمُ ٱلطُّوفَانُ وَهُمْ ظَٰلِمُونَ ﴿14﴾", "ru": "Мы посылали уже Нуха к его народу, и он пребывал среди них тысячу лет без пятидесяти годов и постиг их потоп, а были они неправедными."}, {"ref": "18:25", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَلَبِثُوا۟ فِى كَهْفِهِمْ ثَلَٰثَ مِا۟ئَةٍۢ سِنِينَ وَٱزْدَادُوا۟ تِسْعًۭا ﴿25﴾", "ru": "И оставались они в пещере своей триста лет и прибавили еще девять."}], "n": "Что сказано: Нух жил среди народа «тысячу лет без пятидесяти» (29:14 — 950 лет); спутники пещеры спали «триста лет и прибавили ещё девять» (18:25).\nВ чём проблема: человек не живёт 950 лет и не может проспать 309 лет без питья и еды. Это либо чудо (тогда не проверяется), либо легендарное число. Цифра 950 повторяет библейскую (Быт 9:29); сюжет о спящих в пещере сходен с христианской легендой о ⟦семи спящих отроках⟧.", "c": null, "x": [], "t": "Нереальные сроки жизни и сна", "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. 950 лет и 309 лет сна; чудо или легенда."}, {"n": "Что сказано: ⟦Аллах сотворил всякое животное из воды. Из них есть такие, что ходят на животе, и такие, что ходят на двух ногах, и такие, что ходят на четырёх⟧.\nВ чём проблема: обобщение «всякое животное из воды» можно читать буквально (животные созданы из воды) или образно (жизнь зародилась в воде). Апологеты видят совпадение с наукой; критики: в 15:26 и 3:59 человек — из глины и праха, а в 21:30 — ⟦из воды всё живое⟧: разные утверждения.", "c": null, "x": ["21:30", "15:26"], "refs": ["24:45"], "parts": [{"ref": "24:45", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَٱللَّهُ خَلَقَ كُلَّ دَآبَّةٍۢ مِّن مَّآءٍۢ ۖ فَمِنْهُم مَّن يَمْشِى عَلَىٰ بَطْنِهِۦ وَمِنْهُم مَّن يَمْشِى عَلَىٰ رِجْلَيْنِ وَمِنْهُم مَّن يَمْشِى عَلَىٰٓ أَرْبَعٍۢ ۚ يَخْلُقُ ٱللَّهُ مَا يَشَآءُ ۚ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿45﴾", "ru": "Аллах сотворил всякое животное из воды. Из них есть такие, что ходят на животе, и есть из них такие, что ходят на двух ногах, и есть из них такие, что ходят на четырех. Творит Аллах, что пожелает. Ведь Аллах над всякой вещью мощен!"}], "t": null, "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. «Из воды всякое животное»: буквальное или образное прочтение."}], "summary": ["Описание развития человека спорно сопоставляется с эмбриологией.", "Чудеса (разговор животных, 950 лет) наукой не проверяются."]}, {"id": "eschat", "title": "Конец света и воскрешение", "icon": "⏳", "group": "Природа, наука и сверхъестественное", "intro": "Описание конца света и воскрешения, связанные с космологией аятов. Критики отмечают, что в них солнце, звёзды и горы ведут себя так, как это было бы возможно только в рамках древней картины мира.", "verses": [{"n": "Что сказано: ⟦Когда солнце будет скручено, и когда звёзды облетят, и когда горы сдвинутся с мест… когда небо будет сдёрнуто, когда ад будет разожжён, и когда рай будет приближен — узнает душа, что она приготовила⟧.\nВ чём проблема: «звёзды облетят» — звёзды описаны как мелкие предметы на небосводе (как в 37:6 ⟦украшение ближнего неба⟧); на деле большинство звёзд больше Земли и находится на огромном расстоянии. ⟦Небо сдёрнуто⟧ — картина небосвода-покрывала.\nКак отвечают верующие: образ конца света.", "c": null, "x": ["21:104", "39:67"], "refs": ["81:1-14"], "parts": [{"ref": "81:1-14", "sura": "At-Takwir", "sura_ar": "سُورَةُ التَّكۡوِيرِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ إِذَا ٱلشَّمْسُ كُوِّرَتْ ﴿1﴾ وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتْ ﴿2﴾ وَإِذَا ٱلْجِبَالُ سُيِّرَتْ ﴿3﴾ وَإِذَا ٱلْعِشَارُ عُطِّلَتْ ﴿4﴾ وَإِذَا ٱلْوُحُوشُ حُشِرَتْ ﴿5﴾ وَإِذَا ٱلْبِحَارُ سُجِّرَتْ ﴿6﴾ وَإِذَا ٱلنُّفُوسُ زُوِّجَتْ ﴿7﴾ وَإِذَا ٱلْمَوْءُۥدَةُ سُئِلَتْ ﴿8﴾ بِأَىِّ ذَنۢبٍۢ قُتِلَتْ ﴿9﴾ وَإِذَا ٱلصُّحُفُ نُشِرَتْ ﴿10﴾ وَإِذَا ٱلسَّمَآءُ كُشِطَتْ ﴿11﴾ وَإِذَا ٱلْجَحِيمُ سُعِّرَتْ ﴿12﴾ وَإِذَا ٱلْجَنَّةُ أُزْلِفَتْ ﴿13﴾ عَلِمَتْ نَفْسٌۭ مَّآ أَحْضَرَتْ ﴿14﴾", "ru": "(1) Когда солнце будет скручено, (2) и когда звезды облетят. (3) и когда горы сдвинутся с мест. (4) и когда десять месяцев беременные верблюдицы будут без присмотра, (5) и когда животные соберутся. (6) и когда моря перельются, (7) и когда души соединятся, (8) и когда зарытая живьем будет спрошена, (9) за какой грех она была убита, (10) и когда свитки развернутся, (11) и когда небо будет сдернуто. (12) и когда ад будет разожжен, (13) и когда рай будет приближен, - (14) узнает душа, что она приготовила."}], "t": null, "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. Звёзды «облетят». Образ."}, {"refs": ["21:104", "39:67"], "parts": [{"ref": "21:104", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "يَوْمَ نَطْوِى ٱلسَّمَآءَ كَطَىِّ ٱلسِّجِلِّ لِلْكُتُبِ ۚ كَمَا بَدَأْنَآ أَوَّلَ خَلْقٍۢ نُّعِيدُهُۥ ۚ وَعْدًا عَلَيْنَآ ۚ إِنَّا كُنَّا فَٰعِلِينَ ﴿104﴾", "ru": "В тот день, когда Мы скрутим небо, как писец свертывает свитки; как Мы создали первое творение, так Мы его повторим по обещанию от Нас. Поистине, Мы действуем!"}, {"ref": "39:67", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "وَمَا قَدَرُوا۟ ٱللَّهَ حَقَّ قَدْرِهِۦ وَٱلْأَرْضُ جَمِيعًۭا قَبْضَتُهُۥ يَوْمَ ٱلْقِيَٰمَةِ وَٱلسَّمَٰوَٰتُ مَطْوِيَّٰتٌۢ بِيَمِينِهِۦ ۚ سُبْحَٰنَهُۥ وَتَعَٰلَىٰ عَمَّا يُشْرِكُونَ ﴿67﴾", "ru": "И не ценили они Аллаха истинной ценой, а земля вся в Его руке в день воскресения, и небеса скручены Его десницей. Хвала Ему, и превыше Он того, что они придают Ему в соучастники!"}], "n": "Что сказано: «В тот день, когда Мы скрутим небо, как писец свёртывает свитки» (21:104); «земля вся в Его руке в день воскресения, и небеса скручены Его десницей» (39:67).\nВ чём проблема: небо описано как свиток, то есть плоский материал, который можно свернуть. Кроме того, у Бога ⟦рука⟧ и ⟦десница⟧, что противоречит 42:11 (⟦нет ничего подобного Ему⟧); см. раздел ⟦Образ Бога⟧.", "c": null, "x": ["42:11"], "t": "Небо — свиток, у Бога — «рука»", "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. Небо как свиток. Образ."}, {"n": "Что сказано: «Когда падёт на них слово, Мы выведем им животное из земли, которое заговорит с ними».\nВ чём проблема: появление говорящего животного как знамения конца света — сказочный образ; не сказано, что это за существо и о чём оно скажет. Коран называет себя ⟦ясным⟧, но оставляет образ без объяснения.", "c": null, "x": ["12:1"], "refs": ["27:82"], "parts": [{"ref": "27:82", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "۞ وَإِذَا وَقَعَ ٱلْقَوْلُ عَلَيْهِمْ أَخْرَجْنَا لَهُمْ دَآبَّةًۭ مِّنَ ٱلْأَرْضِ تُكَلِّمُهُمْ أَنَّ ٱلنَّاسَ كَانُوا۟ بِـَٔايَٰتِنَا لَا يُوقِنُونَ ﴿82﴾", "ru": "А когда падет на них слово, Мы выведем им животное из земли, которое заговорит с ними - люди, которые не были убеждены в Наших знамениях."}], "t": null, "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. Говорящее животное как знамение. Образ."}, {"refs": ["2:48", "2:123", "74:48", "2:255", "20:109", "21:28", "34:23", "39:44", "53:26"], "parts": [{"ref": "2:48", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱتَّقُوا۟ يَوْمًۭا لَّا تَجْزِى نَفْسٌ عَن نَّفْسٍۢ شَيْـًۭٔا وَلَا يُقْبَلُ مِنْهَا شَفَٰعَةٌۭ وَلَا يُؤْخَذُ مِنْهَا عَدْلٌۭ وَلَا هُمْ يُنصَرُونَ ﴿48﴾", "ru": "И бойтесь дня, когда душа ничем не возместит за другую душу, и не будет принято от нее заступничество, и не будет взят от нее равновес, и не будет им оказано помощи!"}, {"ref": "2:123", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱتَّقُوا۟ يَوْمًۭا لَّا تَجْزِى نَفْسٌ عَن نَّفْسٍۢ شَيْـًۭٔا وَلَا يُقْبَلُ مِنْهَا عَدْلٌۭ وَلَا تَنفَعُهَا شَفَٰعَةٌۭ وَلَا هُمْ يُنصَرُونَ ﴿123﴾", "ru": "И бойтесь дня, когда душа ничем не возместит за другую душу, и не будет принят от нее равновес, и не поможет ей заступничество, и не будет им оказано помощи!"}, {"ref": "74:48", "sura": "Al-Muddaththir", "sura_ar": "سُورَةُ المُدَّثِّرِ", "type": "Meccan", "ar": "فَمَا تَنفَعُهُمْ شَفَٰعَةُ ٱلشَّٰفِعِينَ ﴿48﴾", "ru": "И не помогает нам заступничество заступников."}, {"ref": "2:255", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭ ۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ ﴿255﴾", "ru": "Аллах - нет божества, кроме Него, живого, сущего; не овладевает Им ни дремота, ни сон; Ему принадлежит то, что в небесах и на земле. Кто заступится пред Ним, иначе как с Его позволения? Он знает то, что было до них, и то, что будет после них, а они не постигают ничего из Его знания, кроме того, что Он пожелает. Трон Его объемлет небеса и землю, и не тяготит Его охрана их; поистине, Он - высокий, великий!"}, {"ref": "20:109", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "يَوْمَئِذٍۢ لَّا تَنفَعُ ٱلشَّفَٰعَةُ إِلَّا مَنْ أَذِنَ لَهُ ٱلرَّحْمَٰنُ وَرَضِىَ لَهُۥ قَوْلًۭا ﴿109﴾", "ru": "В тот день не поможет заступничество, кроме тех, кому позволит Милосердный и кому благоволит разрешить речь."}, {"ref": "21:28", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يَشْفَعُونَ إِلَّا لِمَنِ ٱرْتَضَىٰ وَهُم مِّنْ خَشْيَتِهِۦ مُشْفِقُونَ ﴿28﴾", "ru": "Знает Он, что было до них и что будет после них, и они не заступаются, кроме как за того, к кому Он благоволит, и они от страха пред Ним трепещут."}, {"ref": "34:23", "sura": "Saba", "sura_ar": "سُورَةُ سَبَإٍ", "type": "Meccan", "ar": "وَلَا تَنفَعُ ٱلشَّفَٰعَةُ عِندَهُۥٓ إِلَّا لِمَنْ أَذِنَ لَهُۥ ۚ حَتَّىٰٓ إِذَا فُزِّعَ عَن قُلُوبِهِمْ قَالُوا۟ مَاذَا قَالَ رَبُّكُمْ ۖ قَالُوا۟ ٱلْحَقَّ ۖ وَهُوَ ٱلْعَلِىُّ ٱلْكَبِيرُ ﴿23﴾", "ru": "Не поможет пред Ним заступничество, кроме тех, кому Он позволит. А когда страх будет удален от их сердец, они скажут: \"Что сказал ваш Господь?\" Те скажут: \"Истину, ведь Он - возвышенный, великий!\""}, {"ref": "39:44", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "قُل لِّلَّهِ ٱلشَّفَٰعَةُ جَمِيعًۭا ۖ لَّهُۥ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ ثُمَّ إِلَيْهِ تُرْجَعُونَ ﴿44﴾", "ru": "Скажи: \"Аллаху принадлежит заступничество полностью. Ему принадлежит власть над небесами и землей, потом к Нему вы будете возвращены\"."}, {"ref": "53:26", "sura": "An-Najm", "sura_ar": "سُورَةُ النَّجۡمِ", "type": "Meccan", "ar": "۞ وَكَم مِّن مَّلَكٍۢ فِى ٱلسَّمَٰوَٰتِ لَا تُغْنِى شَفَٰعَتُهُمْ شَيْـًٔا إِلَّا مِنۢ بَعْدِ أَن يَأْذَنَ ٱللَّهُ لِمَن يَشَآءُ وَيَرْضَىٰٓ ﴿26﴾", "ru": "Сколько ангелов в небесах, заступничество которых ни от чего не избавит, если только не после того, как дозволит Аллах тем, кому Он пожелает и соблаговолит!"}], "n": "Что сказано: «Не будет принято от нее заступничество» (2:48); «не поможет ей заступничество» (2:123); «не помогает нам заступничество заступников» (74:48). И с оговоркой: «Кто заступится пред Ним, иначе как с Его позволения?» (2:255); «В тот день не поможет заступничество, кроме тех, кому позволит Милосердный» (20:109; так же 34:23, 53:26). И в 39:44: «Аллаху принадлежит заступничество полностью».\nВ чём проблема: внешне это противоречие: в 2:48 и 2:123 заступничество не принимается вообще, в 2:255 и 20:109 оно возможно. Но в самом тексте есть соединяющая оговорка («иначе как с Его позволения»): первые аяты можно читать как отрицание самостоятельного заступничества, вторые — как заступничество по разрешению. Расхождение снимается оговоркой из самого текста. Остаётся другой вопрос: если решение зависит от воли Бога, то «заступничество» не меняет исход, а лишь оформляет его; и в 74:48 говорится о тех, кому заступничество не помогает. Предметно полезно только для обсуждения того, как этот набор аятов превратился позже в учение о заступничестве Пророка: сам Коран не называет Мухаммада заступником прямо.\nКак отвечают верующие: первые аяты отрицают заступничество по праву или за плату, как у язычников (которые молились идолам-посредникам, 10:18); вторые разрешают его в границах, определённых Богом.", "c": null, "x": ["10:18", "39:43"], "t": "Заступничество: «не будет принято» — и «только с позволения»", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Заступничество отрицается (2:48) и допускается «с Его позволения» (2:255). Оговорка есть в самом тексте."}], "summary": ["Образы конца света буквальны или образны — зависит от толкования.", "Заступничество: оговорка «с Его позволения» есть в тексте."]}, {"id": "paradise", "title": "Рай: награды праведников", "icon": "🌴", "group": "Природа, наука и сверхъестественное", "intro": "Описания рая: реки вина, юноши-прислужники и девы — «хури» и «сверстницы». Критики указывают на мужское обращение и на то, что для женщин праведных описания награды нет; апологеты — на духовные награды рая (например 9:72, 57:21).", "verses": [{"refs": ["2:25", "37:41-49", "38:52", "44:51-55", "55:56", "55:70-74", "56:35-38", "78:31-33"], "parts": [{"ref": "2:25", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَبَشِّرِ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمْ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ ۖ كُلَّمَا رُزِقُوا۟ مِنْهَا مِن ثَمَرَةٍۢ رِّزْقًۭا ۙ قَالُوا۟ هَٰذَا ٱلَّذِى رُزِقْنَا مِن قَبْلُ ۖ وَأُتُوا۟ بِهِۦ مُتَشَٰبِهًۭا ۖ وَلَهُمْ فِيهَآ أَزْوَٰجٌۭ مُّطَهَّرَةٌۭ ۖ وَهُمْ فِيهَا خَٰلِدُونَ ﴿25﴾", "ru": "И обрадуй тех, которые уверовали и творили благое, что для них - сады, где внизу текут реки. Всякий раз, как им даются в удел оттуда какие-нибудь плоды, они говорят: \"Это - то, что было даровано нам раньше\", - тогда как им доставлено только сходное. Для них там - супруги чистые, и они там будут пребывать вечно."}, {"ref": "37:41-49", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "أُو۟لَٰٓئِكَ لَهُمْ رِزْقٌۭ مَّعْلُومٌۭ ﴿41﴾ فَوَٰكِهُ ۖ وَهُم مُّكْرَمُونَ ﴿42﴾ فِى جَنَّٰتِ ٱلنَّعِيمِ ﴿43﴾ عَلَىٰ سُرُرٍۢ مُّتَقَٰبِلِينَ ﴿44﴾ يُطَافُ عَلَيْهِم بِكَأْسٍۢ مِّن مَّعِينٍۭ ﴿45﴾ بَيْضَآءَ لَذَّةٍۢ لِّلشَّٰرِبِينَ ﴿46﴾ لَا فِيهَا غَوْلٌۭ وَلَا هُمْ عَنْهَا يُنزَفُونَ ﴿47﴾ وَعِندَهُمْ قَٰصِرَٰتُ ٱلطَّرْفِ عِينٌۭ ﴿48﴾ كَأَنَّهُنَّ بَيْضٌۭ مَّكْنُونٌۭ ﴿49﴾", "ru": "(41) Для тех - определенный надел - (42) плоды, и они будут в почете (43) в садах благоденствия, (44) на ложах друг против друга. (45) Будет обходить их с чашей из источника (46) прозрачного, услады для пьющих. (47) Нет в нем буйства, и не будут они им изнурены. (48) У них есть потупившие взоры, глазастые, (49) точно охраняемые яйца."}, {"ref": "38:52", "sura": "Saad", "sura_ar": "سُورَةُ صٓ", "type": "Meccan", "ar": "۞ وَعِندَهُمْ قَٰصِرَٰتُ ٱلطَّرْفِ أَتْرَابٌ ﴿52﴾", "ru": "И у них есть с потупленными взорами, ровесницы."}, {"ref": "44:51-55", "sura": "Ad-Dukhaan", "sura_ar": "سُورَةُ الدُّخَانِ", "type": "Meccan", "ar": "إِنَّ ٱلْمُتَّقِينَ فِى مَقَامٍ أَمِينٍۢ ﴿51﴾ فِى جَنَّٰتٍۢ وَعُيُونٍۢ ﴿52﴾ يَلْبَسُونَ مِن سُندُسٍۢ وَإِسْتَبْرَقٍۢ مُّتَقَٰبِلِينَ ﴿53﴾ كَذَٰلِكَ وَزَوَّجْنَٰهُم بِحُورٍ عِينٍۢ ﴿54﴾ يَدْعُونَ فِيهَا بِكُلِّ فَٰكِهَةٍ ءَامِنِينَ ﴿55﴾", "ru": "(51) Поистине, богобоязненные - в месте надежном, (52) среди садов и источников, (53) облекаются они в атлас и парчу, друг против друга. (54) Так! И сопрягли Мы их с черноглазыми, большеокими. (55) Требуют они там всякие плоды в безопасности."}, {"ref": "55:56", "sura": "Ar-Rahmaan", "sura_ar": "سُورَةُ الرَّحۡمَٰن", "type": "Medinan", "ar": "فِيهِنَّ قَٰصِرَٰتُ ٱلطَّرْفِ لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ ﴿56﴾", "ru": "Там скромноокие, которых не коснулся до них ни человек, ни джинн."}, {"ref": "55:70-74", "sura": "Ar-Rahmaan", "sura_ar": "سُورَةُ الرَّحۡمَٰن", "type": "Medinan", "ar": "فِيهِنَّ خَيْرَٰتٌ حِسَانٌۭ ﴿70﴾ فَبِأَىِّ ءَالَآءِ رَبِّكُمَا تُكَذِّبَانِ ﴿71﴾ حُورٌۭ مَّقْصُورَٰتٌۭ فِى ٱلْخِيَامِ ﴿72﴾ فَبِأَىِّ ءَالَآءِ رَبِّكُمَا تُكَذِّبَانِ ﴿73﴾ لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ ﴿74﴾", "ru": "(70) В них - добротные, прекрасные, - (71) Какое же из благодеяний Господа вашего вы сочтете ложным? - (72) черноокие, скрытые в шатрах, - (73) Какое же из благодеяний Господа вашего вы сочтете ложным? (74) Не коснулся их до них ни человек, ни джинны, -"}, {"ref": "56:35-38", "sura": "Al-Waaqia", "sura_ar": "سُورَةُ الوَاقِعَةِ", "type": "Meccan", "ar": "إِنَّآ أَنشَأْنَٰهُنَّ إِنشَآءًۭ ﴿35﴾ فَجَعَلْنَٰهُنَّ أَبْكَارًا ﴿36﴾ عُرُبًا أَتْرَابًۭا ﴿37﴾ لِّأَصْحَٰبِ ٱلْيَمِينِ ﴿38﴾", "ru": "(35) Мы ведь создали их творением (36) и сделали их девственницами, (37) мужа любящими, сверстницами (38) для владык правой стороны."}, {"ref": "78:31-33", "sura": "An-Naba", "sura_ar": "سُورَةُ النَّبَإِ", "type": "Meccan", "ar": "إِنَّ لِلْمُتَّقِينَ مَفَازًا ﴿31﴾ حَدَآئِقَ وَأَعْنَٰبًۭا ﴿32﴾ وَكَوَاعِبَ أَتْرَابًۭا ﴿33﴾", "ru": "(31) Ведь для богобоязненных есть место спасения (32) сады и виноградники, (33) и полногрудые сверстницы,"}], "n": "Что сказано: ⟦Чистые супруги⟧ (2:25); ⟦целомудренные девы с потупленным взором, глазастые, точно охраняемые яйца⟧ (37:48-49); «ровесницы» (38:52); «сопрягли Мы их с черноглазыми, большеокими» (44:54); ⟦скромноокие, которых не коснулся ни человек, ни джинн⟧ (55:56); «черноокие, скрытые в шатрах» (55:72); «сделали их девственницами, мужа любящими, сверстницами» (56:36-37); «полногрудые сверстницы» (78:33).\nВ чём проблема: награда рая описана в основном для мужчин: вечные девственницы (⟦хури⟧), «сверстницы», с физическими деталями (78:33). Для праведных женщин такого описания нет: им обещаны «супруги» (36:56, 43:70) без деталей. Критики видят ориентацию текста на мужскую аудиторию и сексуальную награду; апологеты: образный язык, главная награда — довольство Аллаха (9:72).", "c": null, "x": ["9:72", "43:70", "36:56"], "t": "Спутницы праведников в раю", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Награда для праведниц не описана. Довод опирается на отсутствие описания."}, {"n": "Что сказано: ⟦Образ сада, обещанного богобоязненным: там реки из воды не портящейся, и реки из молока, вкус которого не меняется, и реки из вина, приятного для пьющих, и реки из мёда очищенного⟧.\nВ чём проблема: вино в этом мире названо ⟦мерзостью из деяния сатаны⟧ (5:90), а в раю — ⟦приятным для пьющих⟧; в 37:47 и 56:19 оно ⟦без буйства⟧ и ⟦без головной боли⟧. Вопрос: если вино — зло, как оно может быть наградой; ответ — в раю у него нет вредных свойств.", "c": "Вино запрещено в этом мире (5:90), но в раю допустимо и приятно.", "x": ["5:90-91", "37:47", "56:19"], "refs": ["47:15"], "parts": [{"ref": "47:15", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "مَّثَلُ ٱلْجَنَّةِ ٱلَّتِى وُعِدَ ٱلْمُتَّقُونَ ۖ فِيهَآ أَنْهَٰرٌۭ مِّن مَّآءٍ غَيْرِ ءَاسِنٍۢ وَأَنْهَٰرٌۭ مِّن لَّبَنٍۢ لَّمْ يَتَغَيَّرْ طَعْمُهُۥ وَأَنْهَٰرٌۭ مِّنْ خَمْرٍۢ لَّذَّةٍۢ لِّلشَّٰرِبِينَ وَأَنْهَٰرٌۭ مِّنْ عَسَلٍۢ مُّصَفًّۭى ۖ وَلَهُمْ فِيهَا مِن كُلِّ ٱلثَّمَرَٰتِ وَمَغْفِرَةٌۭ مِّن رَّبِّهِمْ ۖ كَمَنْ هُوَ خَٰلِدٌۭ فِى ٱلنَّارِ وَسُقُوا۟ مَآءً حَمِيمًۭا فَقَطَّعَ أَمْعَآءَهُمْ ﴿15﴾", "ru": "Образ сада, который обещан богобоязненным: там - реки из воды не портящейся и реки из молока, вкус которого не меняется, и реки из вина, приятного для пьющих, и реки из меду очищенного. И для них там всякие плоды и прощение от их Господа. ...Как тот, кто вечно пребывает в огне и кого поят кипящей водой, и она рассекает их внутренности."}], "t": null, "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Вино запрещено в мире и разрешено в раю: объясняется отсутствием опьянения."}, {"refs": ["52:20-24", "56:17-26", "76:19"], "parts": [{"ref": "52:20-24", "sura": "At-Tur", "sura_ar": "سُورَةُ الطُّورِ", "type": "Meccan", "ar": "مُتَّكِـِٔينَ عَلَىٰ سُرُرٍۢ مَّصْفُوفَةٍۢ ۖ وَزَوَّجْنَٰهُم بِحُورٍ عِينٍۢ ﴿20﴾ وَٱلَّذِينَ ءَامَنُوا۟ وَٱتَّبَعَتْهُمْ ذُرِّيَّتُهُم بِإِيمَٰنٍ أَلْحَقْنَا بِهِمْ ذُرِّيَّتَهُمْ وَمَآ أَلَتْنَٰهُم مِّنْ عَمَلِهِم مِّن شَىْءٍۢ ۚ كُلُّ ٱمْرِئٍۭ بِمَا كَسَبَ رَهِينٌۭ ﴿21﴾ وَأَمْدَدْنَٰهُم بِفَٰكِهَةٍۢ وَلَحْمٍۢ مِّمَّا يَشْتَهُونَ ﴿22﴾ يَتَنَٰزَعُونَ فِيهَا كَأْسًۭا لَّا لَغْوٌۭ فِيهَا وَلَا تَأْثِيمٌۭ ﴿23﴾ ۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌۭ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌۭ مَّكْنُونٌۭ ﴿24﴾", "ru": "(20) возлежа на ложах, расставленных рядами. И Мы сочетаем их с черноглазыми, большеокими. (21) А те, которые уверовали и последовало за ними их потомство в вере, - Мы приведем к ним потомство их и не сбавим из дел их ничего. Всякий человек того, что он приобрел, заложник. (22) И снабдим Мы их плодами и мясом из того, что они пожелают. (23) Они передают одни другим кубок, - нет пустословья там и побуждения к греху. (24) И обходят их юноши, точно они сокровенный жемчуг."}, {"ref": "56:17-26", "sura": "Al-Waaqia", "sura_ar": "سُورَةُ الوَاقِعَةِ", "type": "Meccan", "ar": "يَطُوفُ عَلَيْهِمْ وِلْدَٰنٌۭ مُّخَلَّدُونَ ﴿17﴾ بِأَكْوَابٍۢ وَأَبَارِيقَ وَكَأْسٍۢ مِّن مَّعِينٍۢ ﴿18﴾ لَّا يُصَدَّعُونَ عَنْهَا وَلَا يُنزِفُونَ ﴿19﴾ وَفَٰكِهَةٍۢ مِّمَّا يَتَخَيَّرُونَ ﴿20﴾ وَلَحْمِ طَيْرٍۢ مِّمَّا يَشْتَهُونَ ﴿21﴾ وَحُورٌ عِينٌۭ ﴿22﴾ كَأَمْثَٰلِ ٱللُّؤْلُؤِ ٱلْمَكْنُونِ ﴿23﴾ جَزَآءًۢ بِمَا كَانُوا۟ يَعْمَلُونَ ﴿24﴾ لَا يَسْمَعُونَ فِيهَا لَغْوًۭا وَلَا تَأْثِيمًا ﴿25﴾ إِلَّا قِيلًۭا سَلَٰمًۭا سَلَٰمًۭا ﴿26﴾", "ru": "(17) Обходят их мальчики вечно юные (18) с чашами, сосудами и кубками из текущего источника - (19) от него не страдают головной болью и ослаблением - (20) и плодами из тех, что они выберут, (21) и мясом птиц из тех, что пожелают. (22) А черноокие, большеглазые, (23) подобные жемчугу хранимому - (24) в воздаяние за то, что они делали. (25) Не услышат они там пустословия и укоров в грехе, (26) а лишь слова: \"Мир, мир!\""}, {"ref": "76:19", "sura": "Al-Insaan", "sura_ar": "سُورَةُ الإِنسَانِ", "type": "Medinan", "ar": "۞ وَيَطُوفُ عَلَيْهِمْ وِلْدَٰنٌۭ مُّخَلَّدُونَ إِذَا رَأَيْتَهُمْ حَسِبْتَهُمْ لُؤْلُؤًۭا مَّنثُورًۭا ﴿19﴾", "ru": "И обходят их отроки вечные, - когда увидишь их, сочтешь за рассыпанный жемчуг."}], "n": "Что сказано: «Обходят их юноши, точно они сокровенный жемчуг» (52:24); ⟦Обходят их мальчики вечно юные с чашами и кубками⟧ (56:17-18); «отроки вечные — когда увидишь их, сочтёшь за рассыпанный жемчуг» (76:19).\nВ чём проблема: праведникам в раю прислуживают вечные мальчики, описанные красотой («жемчуг»). Критики спрашивают, почему выбран такой образ, и как его понимать; мусульманские толкователи видят в них слуг. Внутренних пояснений в тексте нет.", "c": null, "x": [], "t": "Вечные юноши-прислужники", "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Вечные юноши-прислужники."}], "summary": ["Описание награды для женщин в раю скудно; это наблюдение, а не противоречие."]}, {"id": "odd", "title": "Странные и сомнительные утверждения", "icon": "?", "group": "Природа, наука и сверхъестественное", "intro": "Места, которые критики называют нелепыми, наивными или легендарными. Чаще всего это чудеса, пересказы древних историй и образы, которые трудно понять буквально.", "verses": [{"n": "Что сказано: Мусе велено зарезать корову; после споров о возрасте и цвете (2:68-71) убитого ударяют частью коровы, ⟦Аллах оживляет мёртвых⟧ (2:73), и он называет убийцу.\nВ чём проблема: расследование убийства решено чудом оживления; бытовые подробности (корова ⟦не старая и не молодая⟧, ⟦жёлтая, радующая смотрящих⟧) не выглядят как закон. Критики видят перекличку с Втор 21:1-9 (ритуал при найденном убитом), но с изменённым смыслом.", "c": null, "x": [], "refs": ["2:67-73"], "parts": [{"ref": "2:67-73", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِۦٓ إِنَّ ٱللَّهَ يَأْمُرُكُمْ أَن تَذْبَحُوا۟ بَقَرَةًۭ ۖ قَالُوٓا۟ أَتَتَّخِذُنَا هُزُوًۭا ۖ قَالَ أَعُوذُ بِٱللَّهِ أَنْ أَكُونَ مِنَ ٱلْجَٰهِلِينَ ﴿67﴾ قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا هِىَ ۚ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌۭ لَّا فَارِضٌۭ وَلَا بِكْرٌ عَوَانٌۢ بَيْنَ ذَٰلِكَ ۖ فَٱفْعَلُوا۟ مَا تُؤْمَرُونَ ﴿68﴾ قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا لَوْنُهَا ۚ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌۭ صَفْرَآءُ فَاقِعٌۭ لَّوْنُهَا تَسُرُّ ٱلنَّٰظِرِينَ ﴿69﴾ قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا هِىَ إِنَّ ٱلْبَقَرَ تَشَٰبَهَ عَلَيْنَا وَإِنَّآ إِن شَآءَ ٱللَّهُ لَمُهْتَدُونَ ﴿70﴾ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌۭ لَّا ذَلُولٌۭ تُثِيرُ ٱلْأَرْضَ وَلَا تَسْقِى ٱلْحَرْثَ مُسَلَّمَةٌۭ لَّا شِيَةَ فِيهَا ۚ قَالُوا۟ ٱلْـَٰٔنَ جِئْتَ بِٱلْحَقِّ ۚ فَذَبَحُوهَا وَمَا كَادُوا۟ يَفْعَلُونَ ﴿71﴾ وَإِذْ قَتَلْتُمْ نَفْسًۭا فَٱدَّٰرَْٰٔتُمْ فِيهَا ۖ وَٱللَّهُ مُخْرِجٌۭ مَّا كُنتُمْ تَكْتُمُونَ ﴿72﴾ فَقُلْنَا ٱضْرِبُوهُ بِبَعْضِهَا ۚ كَذَٰلِكَ يُحْىِ ٱللَّهُ ٱلْمَوْتَىٰ وَيُرِيكُمْ ءَايَٰتِهِۦ لَعَلَّكُمْ تَعْقِلُونَ ﴿73﴾", "ru": "(67) И вот сказал Муса своему народу: \"Вот, Аллах приказывает вам заколоть корову\". Они сказали: \"Не обращаешь ли ты нас в насмешку?\" Он сказал: \"К Аллаху я прибегаю, чтобы не оказаться глупцом!\". (68) Они сказали: \"Призови для нас твоего Господа, чтобы Он разъяснил нам, какова она\". Он сказал: \"Вот, Он говорит: \"Она - корова, не старая и не телка, средняя по возрасту между этим\". Делайте же то, что вам приказано!\" (69) Они сказали: \"Призови для нас твоего Господа, чтобы Он разъяснил нам, каков ее цвет\". Он сказал: \"Вот, Он говорит: \"Она - корова желтая, светел цвет ее, радует она смотрящих\"\". (70) Они сказали: \"Призови для нас твоего Господа, чтобы Он разъяснил нам, какова она: ведь коровы похожи для нас одна на другую, и мы будем, если пожелает Аллах, на верном пути\". (71) Он сказал: \"Вот, Он говорит: \"Она - корова не укрощенная, которая пашет землю, и не орошает пашню, она сохранена в целости, нет отметины на ней\". Они сказали: \"Теперь ты доставил истину\". И они закололи ее, хотя готовы были не сделать этого. (72) И вот вы убили душу и препирались о ней, а Аллах изводит то, что вы скрывали. (73) И Мы сказали: \"Ударьте его чем-нибудь от нее\". Так оживляет Аллах мертвых и показывает вам Его знамения, - может быть, вы уразумеете!"}], "t": null, "at": "расходится с историей или Библией", "pw": "слабый", "cl": "Вывод: возможное расхождение с историческими данными, подтверждений недостаточно. История с коровой."}, {"refs": ["2:259", "2:260"], "parts": [{"ref": "2:259", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "أَوْ كَٱلَّذِى مَرَّ عَلَىٰ قَرْيَةٍۢ وَهِىَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا قَالَ أَنَّىٰ يُحْىِۦ هَٰذِهِ ٱللَّهُ بَعْدَ مَوْتِهَا ۖ فَأَمَاتَهُ ٱللَّهُ مِا۟ئَةَ عَامٍۢ ثُمَّ بَعَثَهُۥ ۖ قَالَ كَمْ لَبِثْتَ ۖ قَالَ لَبِثْتُ يَوْمًا أَوْ بَعْضَ يَوْمٍۢ ۖ قَالَ بَل لَّبِثْتَ مِا۟ئَةَ عَامٍۢ فَٱنظُرْ إِلَىٰ طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْ ۖ وَٱنظُرْ إِلَىٰ حِمَارِكَ وَلِنَجْعَلَكَ ءَايَةًۭ لِّلنَّاسِ ۖ وَٱنظُرْ إِلَى ٱلْعِظَامِ كَيْفَ نُنشِزُهَا ثُمَّ نَكْسُوهَا لَحْمًۭا ۚ فَلَمَّا تَبَيَّنَ لَهُۥ قَالَ أَعْلَمُ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿259﴾", "ru": "Или как тот, кто проходил мимо селения, а оно было разрушено до оснований. Он сказал: \"Как оживит это Аллах, после того как оно умерло?\" И умертвил его Аллах на сто лет, потом воскресил. Он сказал: \"Сколько ты пробыл?\" Тот сказал: \"Пробыл я день или часть дня\". Он сказал: \"Нет, ты пробыл сто лет! И посмотри на твою пищу и питье, оно не испортилось. И посмотри на своего осла - для того, чтобы Нам сделать тебя знамением для людей, - посмотри на кости, как мы их поднимаем, а потом одеваем мясом\". И когда стало ему ясно, он сказал: \"Я знаю, что Аллах мощен над всякой вещью!\""}, {"ref": "2:260", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ إِبْرَٰهِۦمُ رَبِّ أَرِنِى كَيْفَ تُحْىِ ٱلْمَوْتَىٰ ۖ قَالَ أَوَلَمْ تُؤْمِن ۖ قَالَ بَلَىٰ وَلَٰكِن لِّيَطْمَئِنَّ قَلْبِى ۖ قَالَ فَخُذْ أَرْبَعَةًۭ مِّنَ ٱلطَّيْرِ فَصُرْهُنَّ إِلَيْكَ ثُمَّ ٱجْعَلْ عَلَىٰ كُلِّ جَبَلٍۢ مِّنْهُنَّ جُزْءًۭا ثُمَّ ٱدْعُهُنَّ يَأْتِينَكَ سَعْيًۭا ۚ وَٱعْلَمْ أَنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌۭ ﴿260﴾", "ru": "И вот сказал Ибрахим: \"Господи! Покажи мне, как Ты оживляешь мертвых\". Он сказал: \"А разве ты не уверовал?\" Тот сказал: \"Да! Но чтобы сердце мое успокоилось\". Сказал Он: \"Возьми же четырех птиц, собери их к себе, потом помести на каждой горе по части их, а потом позови их: они явятся к тебе стремительно, и знай, что Аллах велик и мудр!\""}], "n": "Что сказано: Прохожий у разрушенного селения спрашивает «как оживит это Аллах?»; Бог умертвил его на сто лет и воскресил; его осёл истлел, а еда ⟦не испортилась⟧ (2:259); Ибрахим просит: «Господи! Покажи мне, как Ты оживляешь мёртвых»; Бог: «А разве ты не уверовал?»; Ибрахим: «Да! Но чтобы сердце моё успокоилось» — Бог велит взять четырёх птиц, рассечь, части положить на горы и позвать их (2:260).\nВ чём проблема: сюжеты — чудеса без проверки. Критики отмечают, что и прохожий, и Ибрахим сомневаются в воскрешении; Ибрахим, пророк, признаётся, что нуждается в доказательстве. Это ставит вопрос о ⟦непогрешимой вере⟧ пророков.", "c": null, "x": [], "t": "Воскрешение: человек, осёл и птицы", "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. Сюжет-чудо."}, {"n": "Что сказано: ⟦Разве ты не видел, как поступил Господь твой с владельцами слона?… И послал Он на них птиц стаями. Бросали они в них камни из обожжённой глины. И сделал Он их точно нива со съеденными зёрнами⟧.\nВ чём проблема: птицы, бросающие камни из глины, превращают войско в ⟦ниву со съеденными зёрнами⟧. Независимых свидетельств нет; в тексте не названы дата, место и враг. Критики: описание можно читать как легенду; верующие: чудо.", "c": null, "x": [], "refs": ["105:3-5"], "parts": [{"ref": "105:3-5", "sura": "Al-Fil", "sura_ar": "سُورَةُ الفِيلِ", "type": "Meccan", "ar": "وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ ﴿3﴾ تَرْمِيهِم بِحِجَارَةٍۢ مِّن سِجِّيلٍۢ ﴿4﴾ فَجَعَلَهُمْ كَعَصْفٍۢ مَّأْكُولٍۭ ﴿5﴾", "ru": "(3) И послал Он на них птиц стаями? (4) Бросали они в них камни из обожженной глины. (5) И сделал Он их точно нива со съеденными зернами."}], "t": null, "at": "расходится с историей или Библией", "pw": "слабый", "cl": "Вывод: возможное расхождение с историческими данными, подтверждений недостаточно. Птицы с камнями: нет независимых свидетельств."}, {"refs": ["3:49", "19:29-30"], "parts": [{"ref": "3:49", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَرَسُولًا إِلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنِّى قَدْ جِئْتُكُم بِـَٔايَةٍۢ مِّن رَّبِّكُمْ ۖ أَنِّىٓ أَخْلُقُ لَكُم مِّنَ ٱلطِّينِ كَهَيْـَٔةِ ٱلطَّيْرِ فَأَنفُخُ فِيهِ فَيَكُونُ طَيْرًۢا بِإِذْنِ ٱللَّهِ ۖ وَأُبْرِئُ ٱلْأَكْمَهَ وَٱلْأَبْرَصَ وَأُحْىِ ٱلْمَوْتَىٰ بِإِذْنِ ٱللَّهِ ۖ وَأُنَبِّئُكُم بِمَا تَأْكُلُونَ وَمَا تَدَّخِرُونَ فِى بُيُوتِكُمْ ۚ إِنَّ فِى ذَٰلِكَ لَءَايَةًۭ لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ ﴿49﴾", "ru": "и сделает посланником к сынам Исраила\". - \"Я пришел к вам со знамением от вашего Господа. Я сотворю вам из глины по образу птицы и подую в нее, и станет это птицей по изволению Аллаха. Я исцелю слепого прокаженного и оживлю мертвых с дозволения Аллаха. Я сообщу вам, что вы едите и что сохраняете в ваших домах. Поистине, в этом - знамение для вас, если вы верующие!"}, {"ref": "19:29-30", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "فَأَشَارَتْ إِلَيْهِ ۖ قَالُوا۟ كَيْفَ نُكَلِّمُ مَن كَانَ فِى ٱلْمَهْدِ صَبِيًّۭا ﴿29﴾ قَالَ إِنِّى عَبْدُ ٱللَّهِ ءَاتَىٰنِىَ ٱلْكِتَٰبَ وَجَعَلَنِى نَبِيًّۭا ﴿30﴾", "ru": "(29) А она указала на него. Они сказали: \"Как мы можем говорить с тем, кто ребенок в колыбели?\" (30) Он сказал: \"Я - раб Аллаха, Он дал мне писание и сделал меня пророком."}], "n": "Что сказано: Иса ⟦создаёт из глины подобие птицы, дует на неё, и она становится птицей с дозволения Аллаха⟧ (3:49); младенцем в колыбели говорит: «Я — раб Аллаха, Он дал мне писание и сделал меня пророком» (19:29-30; 3:46).\nВ чём проблема: ни одного из этих чудес нет в канонических Евангелиях; их аналоги встречаются в апокрифах (глиняные птицы — в ⟦Евангелии детства от Фомы⟧; речь в колыбели — в ⟦Арабском Евангелии детства⟧). Критики: Коран опирается на апокрифы, а не на Евангелия, которые сам ⟦подтверждает⟧ (3:3, 5:46). Верующие: независимое откровение.", "c": null, "x": ["5:110"], "t": "Чудеса Исы, которых нет в Евангелиях", "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Чудеса Исы, которых нет в Евангелиях, но есть в апокрифах. Критики указывают на заимствование."}, {"refs": ["7:176", "68:10-13", "96:15-16"], "parts": [{"ref": "7:176", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "وَلَوْ شِئْنَا لَرَفَعْنَٰهُ بِهَا وَلَٰكِنَّهُۥٓ أَخْلَدَ إِلَى ٱلْأَرْضِ وَٱتَّبَعَ هَوَىٰهُ ۚ فَمَثَلُهُۥ كَمَثَلِ ٱلْكَلْبِ إِن تَحْمِلْ عَلَيْهِ يَلْهَثْ أَوْ تَتْرُكْهُ يَلْهَث ۚ ذَّٰلِكَ مَثَلُ ٱلْقَوْمِ ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا ۚ فَٱقْصُصِ ٱلْقَصَصَ لَعَلَّهُمْ يَتَفَكَّرُونَ ﴿176﴾", "ru": "А если бы Мы пожелали, то возвысили бы его имя. Но он приник к земле и последовал за своей страстью и подобен он собаке: если бросишься на нее, высовывает язык и, если оставишь ее, высовывает. Это - притча о людях, которые считали ложью Наши знамения. Рассказывай же рассказом, - может быть, они размыслят!"}, {"ref": "68:10-13", "sura": "Al-Qalam", "sura_ar": "سُورَةُ القَلَمِ", "type": "Meccan", "ar": "وَلَا تُطِعْ كُلَّ حَلَّافٍۢ مَّهِينٍ ﴿10﴾ هَمَّازٍۢ مَّشَّآءٍۭ بِنَمِيمٍۢ ﴿11﴾ مَّنَّاعٍۢ لِّلْخَيْرِ مُعْتَدٍ أَثِيمٍ ﴿12﴾ عُتُلٍّۭ بَعْدَ ذَٰلِكَ زَنِيمٍ ﴿13﴾", "ru": "(10) Не повинуйся же всякому любителю клятв, презренному, (11) хулителю, бродящему со сплетнями, (12) препятствующему добру, врагу, грешнику, (13) грубому, после этого безродному,"}, {"ref": "96:15-16", "sura": "Al-Alaq", "sura_ar": "سُورَةُ العَلَقِ", "type": "Meccan", "ar": "كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًۢا بِٱلنَّاصِيَةِ ﴿15﴾ نَاصِيَةٍۢ كَٰذِبَةٍ خَاطِئَةٍۢ ﴿16﴾", "ru": "(15) Так нет! Если он не удержится, Мы схватим его за хохол - (16) хохол лживый, грешный."}], "n": "Что сказано: Отвернувшийся от знамений ⟦подобен собаке: если нападёшь на неё — она высунет язык, и если оставишь — высунет язык⟧ (7:176); ⟦не повинуйся всякому любителю клятв, презренному, хулителю… грубому, после этого — безродному⟧ (68:10-13); «схватим его за хохол — хохол лживый, грешный» (96:15-16).\nВ чём проблема: Бог, называющий Себя ⟦милосердным⟧, использует бранные образы (собака; ⟦безродный⟧) и телесные угрозы (⟦схватим за хохол⟧). Критики: стиль несовместим с представлением о высшем существе; апологеты: риторика в споре с гонителями. 68:13 ⟦зиним⟧ по толкованию — ⟦безродный / рождённый вне брака⟧ (оскорбление по происхождению).", "c": null, "x": ["62:5"], "t": "Бранные образы и угрозы", "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Бранные образы. Довод о стиле."}], "summary": ["Сюжеты-чудеса; сильных доводов нет.", "Чудеса Исы (3:49) совпадают с апокрифами — критики указывают на заимствование."]}, {"id": "superstition", "title": "Джинны, магия и суеверия", "icon": "✦", "group": "Природа, наука и сверхъестественное", "intro": "Аяты о сверхъестественных существах и колдовстве, воспринимаемые в исламской традиции буквально.", "verses": [{"refs": ["113:4", "114:1-6", "2:275"], "parts": [{"ref": "113:4", "sura": "Al-Falaq", "sura_ar": "سُورَةُ الفَلَقِ", "type": "Meccan", "ar": "وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ ﴿4﴾", "ru": "от зла дующих на узлы,"}, {"ref": "114:1-6", "sura": "An-Naas", "sura_ar": "سُورَةُ النَّاسِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ ﴿1﴾ مَلِكِ ٱلنَّاسِ ﴿2﴾ إِلَٰهِ ٱلنَّاسِ ﴿3﴾ مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ ﴿4﴾ ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ ﴿5﴾ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ ﴿6﴾", "ru": "(1) Скажи: \"Прибегаю к Господу людей, (2) царю людей, (3) Богу людей, (4) от зла наущателя скрывающегося, (5) который наущает груди людей, (6) от джиннов и людей!\""}, {"ref": "2:275", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱلَّذِينَ يَأْكُلُونَ ٱلرِّبَوٰا۟ لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ ٱلَّذِى يَتَخَبَّطُهُ ٱلشَّيْطَٰنُ مِنَ ٱلْمَسِّ ۚ ذَٰلِكَ بِأَنَّهُمْ قَالُوٓا۟ إِنَّمَا ٱلْبَيْعُ مِثْلُ ٱلرِّبَوٰا۟ ۗ وَأَحَلَّ ٱللَّهُ ٱلْبَيْعَ وَحَرَّمَ ٱلرِّبَوٰا۟ ۚ فَمَن جَآءَهُۥ مَوْعِظَةٌۭ مِّن رَّبِّهِۦ فَٱنتَهَىٰ فَلَهُۥ مَا سَلَفَ وَأَمْرُهُۥٓ إِلَى ٱللَّهِ ۖ وَمَنْ عَادَ فَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَٰلِدُونَ ﴿275﴾", "ru": "Те, которые пожирают рост, восстанут только такими же, как восстанет тот, кого повергает сатана своим прикосновением. Это - за то, что они говорили: \"Ведь торговля - то же , что рост\". А Аллах разрешил торговлю и запретил рост. К кому приходит увещание от его Господа и он удержится, тому (прощено), что предшествовало: дело его принадлежит Аллаху; а кто повторит, те - обитатели огня, они в нем вечно пребывают!"}], "n": "Что сказано: ⟦Прибегаю к Господу рассвета… от зла дующих на узлы⟧ (113:1-4); «от зла наущателя скрывающегося, который наущает груди людей, от джиннов и людей» (114:4-6); берущие рост ⟦встанут, как встаёт тот, кого сатана поразил своим прикосновением и свёл с ума⟧ (2:275).\nВ чём проблема: несчастья объясняются магией «дующих на узлы» (колдуний), мысли — вмешательством «наущателя», безумие — прикосновением сатаны. Современная наука объясняет это иначе; критики видят демонологическое объяснение. Апологеты: образные формулы защиты.", "c": null, "x": ["2:102"], "t": "Колдовство и «нашёптывание» как реальные причины зла", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. Колдовство и «нашёптывание» как причины зла. Апологеты читают образно."}, {"refs": ["34:12-14", "38:36-38", "21:81", "27:38-40"], "parts": [{"ref": "34:12-14", "sura": "Saba", "sura_ar": "سُورَةُ سَبَإٍ", "type": "Meccan", "ar": "وَلِسُلَيْمَٰنَ ٱلرِّيحَ غُدُوُّهَا شَهْرٌۭ وَرَوَاحُهَا شَهْرٌۭ ۖ وَأَسَلْنَا لَهُۥ عَيْنَ ٱلْقِطْرِ ۖ وَمِنَ ٱلْجِنِّ مَن يَعْمَلُ بَيْنَ يَدَيْهِ بِإِذْنِ رَبِّهِۦ ۖ وَمَن يَزِغْ مِنْهُمْ عَنْ أَمْرِنَا نُذِقْهُ مِنْ عَذَابِ ٱلسَّعِيرِ ﴿12﴾ يَعْمَلُونَ لَهُۥ مَا يَشَآءُ مِن مَّحَٰرِيبَ وَتَمَٰثِيلَ وَجِفَانٍۢ كَٱلْجَوَابِ وَقُدُورٍۢ رَّاسِيَٰتٍ ۚ ٱعْمَلُوٓا۟ ءَالَ دَاوُۥدَ شُكْرًۭا ۚ وَقَلِيلٌۭ مِّنْ عِبَادِىَ ٱلشَّكُورُ ﴿13﴾ فَلَمَّا قَضَيْنَا عَلَيْهِ ٱلْمَوْتَ مَا دَلَّهُمْ عَلَىٰ مَوْتِهِۦٓ إِلَّا دَآبَّةُ ٱلْأَرْضِ تَأْكُلُ مِنسَأَتَهُۥ ۖ فَلَمَّا خَرَّ تَبَيَّنَتِ ٱلْجِنُّ أَن لَّوْ كَانُوا۟ يَعْلَمُونَ ٱلْغَيْبَ مَا لَبِثُوا۟ فِى ٱلْعَذَابِ ٱلْمُهِينِ ﴿14﴾", "ru": "(12) А Сулайману - ветер... утренний путь его - месяц, и вечерний путь его - месяц. Источили Мы для него ключ меди. А из джиннов - такие, что работают пред ним по повелению его Господа; кто же из них уклонится от Нашего повеления, тому Мы дадим попробовать наказание огня. (13) Делают они ему, что он пожелает, из алтарей, изображений, чаш, как цистерны, и котлов прочных. Сотворите, род Дауда, благодарность! Но немногие из Моих рабов благодарны! (14) Когда же Мы обрекли его на смерть, указало на смерть его только животное земли, которое подъело посох. А когда он упал, уразумели джинны, что если бы они знали тайное, то не оказались бы в унизительном наказании."}, {"ref": "38:36-38", "sura": "Saad", "sura_ar": "سُورَةُ صٓ", "type": "Meccan", "ar": "فَسَخَّرْنَا لَهُ ٱلرِّيحَ تَجْرِى بِأَمْرِهِۦ رُخَآءً حَيْثُ أَصَابَ ﴿36﴾ وَٱلشَّيَٰطِينَ كُلَّ بَنَّآءٍۢ وَغَوَّاصٍۢ ﴿37﴾ وَءَاخَرِينَ مُقَرَّنِينَ فِى ٱلْأَصْفَادِ ﴿38﴾", "ru": "(36) И подчинили Мы ему ветер, который течет, по его повелению, легким, куда он пожелает, - (37) и шайтанов, всякого строителя и водолаза, (38) и других, соединенных в цепях."}, {"ref": "21:81", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "وَلِسُلَيْمَٰنَ ٱلرِّيحَ عَاصِفَةًۭ تَجْرِى بِأَمْرِهِۦٓ إِلَى ٱلْأَرْضِ ٱلَّتِى بَٰرَكْنَا فِيهَا ۚ وَكُنَّا بِكُلِّ شَىْءٍ عَٰلِمِينَ ﴿81﴾", "ru": "А Сулайману - ветер, когда он, дуя, устремляется по его повелению в землю, которую Мы благословили, и Мы знали про все."}, {"ref": "27:38-40", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "قَالَ يَٰٓأَيُّهَا ٱلْمَلَؤُا۟ أَيُّكُمْ يَأْتِينِى بِعَرْشِهَا قَبْلَ أَن يَأْتُونِى مُسْلِمِينَ ﴿38﴾ قَالَ عِفْرِيتٌۭ مِّنَ ٱلْجِنِّ أَنَا۠ ءَاتِيكَ بِهِۦ قَبْلَ أَن تَقُومَ مِن مَّقَامِكَ ۖ وَإِنِّى عَلَيْهِ لَقَوِىٌّ أَمِينٌۭ ﴿39﴾ قَالَ ٱلَّذِى عِندَهُۥ عِلْمٌۭ مِّنَ ٱلْكِتَٰبِ أَنَا۠ ءَاتِيكَ بِهِۦ قَبْلَ أَن يَرْتَدَّ إِلَيْكَ طَرْفُكَ ۚ فَلَمَّا رَءَاهُ مُسْتَقِرًّا عِندَهُۥ قَالَ هَٰذَا مِن فَضْلِ رَبِّى لِيَبْلُوَنِىٓ ءَأَشْكُرُ أَمْ أَكْفُرُ ۖ وَمَن شَكَرَ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِۦ ۖ وَمَن كَفَرَ فَإِنَّ رَبِّى غَنِىٌّۭ كَرِيمٌۭ ﴿40﴾", "ru": "(38) Он сказал: \"О знать, кто из вас придет ко мне с ее троном, прежде чем они придут ко мне покорными?\" (39) Сказал Ифрит из джиннов: \"Я приду к тебе с ним, прежде чем ты встанешь со своего места; я ведь для этого силен и верен\". (40) Сказал тот, у которого было знание из книги: \"Я приду к тебе с ним, прежде чем вернется к тебе твой взор\". Когда же он увидел его утвердившимся у себя, то сказал: \"Это - из милости Господа моего, чтобы испытать меня - буду ли я благодарен или неверен. Кто благодарен, тот благодарен для самого себя, а кто неверен - Господь мой богат, милостив\"."}], "n": "Что сказано: Ветер и джинны подчинены Сулейману (34:12; 21:81); джинны делали ⟦михрабы, статуи, чаши⟧; они не знали о его смерти, пока червь не подточил его посох — и ⟦продолжали работать на мёртвого царя⟧ (34:14); дьяволы — ⟦строители и ныряльщики⟧, другие ⟦в оковах⟧ (38:37-38); ифрит из джиннов обещает принести трон царицы Сабы за мгновение (27:38-40).\nВ чём проблема: сюжет о подчинении ⟦нечистых сил⟧ человеку и переносе трона относится к мифологии. Есть и внутренняя странность: джинны, которые подслушивают небо (72:8-9), не знают, что царь умер; в 34:14 сказано, что ⟦если бы они знали сокровенное, они не пребывали бы в унизительном наказании⟧ — то есть считалось, что они знают сокровенное.", "c": null, "x": [], "t": "Сулайман, ветер и подчинённые джинны", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. Джинны и Сулайман: сюжет мифологического типа."}, {"refs": ["15:27", "55:15", "72:1-2", "72:14-15", "46:29-32", "7:27"], "parts": [{"ref": "15:27", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "وَٱلْجَآنَّ خَلَقْنَٰهُ مِن قَبْلُ مِن نَّارِ ٱلسَّمُومِ ﴿27﴾", "ru": "И гениев Мы сотворили раньше из огня знойного."}, {"ref": "55:15", "sura": "Ar-Rahmaan", "sura_ar": "سُورَةُ الرَّحۡمَٰن", "type": "Medinan", "ar": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ ﴿15﴾", "ru": "и сотворил джиннов из чистого огня."}, {"ref": "72:1-2", "sura": "Al-Jinn", "sura_ar": "سُورَةُ الجِنِّ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أُوحِىَ إِلَىَّ أَنَّهُ ٱسْتَمَعَ نَفَرٌۭ مِّنَ ٱلْجِنِّ فَقَالُوٓا۟ إِنَّا سَمِعْنَا قُرْءَانًا عَجَبًۭا ﴿1﴾ يَهْدِىٓ إِلَى ٱلرُّشْدِ فَـَٔامَنَّا بِهِۦ ۖ وَلَن نُّشْرِكَ بِرَبِّنَآ أَحَدًۭا ﴿2﴾", "ru": "(1) Скажи: \"Открыто мне, что слушал сонм джиннов, и сказали они: \"Поистине, слышали мы Коран дивный! (2) Он ведет к прямому пути. И уверовали мы в него, и никогда не предадим мы нашему Господу никого."}, {"ref": "72:14-15", "sura": "Al-Jinn", "sura_ar": "سُورَةُ الجِنِّ", "type": "Meccan", "ar": "وَأَنَّا مِنَّا ٱلْمُسْلِمُونَ وَمِنَّا ٱلْقَٰسِطُونَ ۖ فَمَنْ أَسْلَمَ فَأُو۟لَٰٓئِكَ تَحَرَّوْا۟ رَشَدًۭا ﴿14﴾ وَأَمَّا ٱلْقَٰسِطُونَ فَكَانُوا۟ لِجَهَنَّمَ حَطَبًۭا ﴿15﴾", "ru": "(14) И среди нас есть предавшие себя Аллаху, и среди нас есть отступившие; а кто предал себя, те пошли прямым путем, (15) а отступившие - они дрова для геенны\"."}, {"ref": "46:29-32", "sura": "Al-Ahqaf", "sura_ar": "سُورَةُ الأَحۡقَافِ", "type": "Meccan", "ar": "وَإِذْ صَرَفْنَآ إِلَيْكَ نَفَرًۭا مِّنَ ٱلْجِنِّ يَسْتَمِعُونَ ٱلْقُرْءَانَ فَلَمَّا حَضَرُوهُ قَالُوٓا۟ أَنصِتُوا۟ ۖ فَلَمَّا قُضِىَ وَلَّوْا۟ إِلَىٰ قَوْمِهِم مُّنذِرِينَ ﴿29﴾ قَالُوا۟ يَٰقَوْمَنَآ إِنَّا سَمِعْنَا كِتَٰبًا أُنزِلَ مِنۢ بَعْدِ مُوسَىٰ مُصَدِّقًۭا لِّمَا بَيْنَ يَدَيْهِ يَهْدِىٓ إِلَى ٱلْحَقِّ وَإِلَىٰ طَرِيقٍۢ مُّسْتَقِيمٍۢ ﴿30﴾ يَٰقَوْمَنَآ أَجِيبُوا۟ دَاعِىَ ٱللَّهِ وَءَامِنُوا۟ بِهِۦ يَغْفِرْ لَكُم مِّن ذُنُوبِكُمْ وَيُجِرْكُم مِّنْ عَذَابٍ أَلِيمٍۢ ﴿31﴾ وَمَن لَّا يُجِبْ دَاعِىَ ٱللَّهِ فَلَيْسَ بِمُعْجِزٍۢ فِى ٱلْأَرْضِ وَلَيْسَ لَهُۥ مِن دُونِهِۦٓ أَوْلِيَآءُ ۚ أُو۟لَٰٓئِكَ فِى ضَلَٰلٍۢ مُّبِينٍ ﴿32﴾", "ru": "(29) Вот, Мы направили к тебе толпу из джиннов, чтобы они выслушали Коран. Когда же они явились к этому, они сказали: \"Внимайте!\" Когда было завершено, они обратились к своему народу с увещанием. (30) Они сказали: \"О народ наш! Мы слышали книгу, ниспосланную после Мусы, подтверждающую истинность того, что ниспослано до него; она ведет к истине и прямому пути. (31) О народ наш! Отвечайте призывающему Аллаха и уверуйте в Него: Он простит вам ваши грехи и защити вас от наказания мучительного. (32) А кто не ответит призывающему Аллаха, тот не избавится от Него на земле, и нет ему помимо Него защитников. Эти - в явном заблуждении!\""}, {"ref": "7:27", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "يَٰبَنِىٓ ءَادَمَ لَا يَفْتِنَنَّكُمُ ٱلشَّيْطَٰنُ كَمَآ أَخْرَجَ أَبَوَيْكُم مِّنَ ٱلْجَنَّةِ يَنزِعُ عَنْهُمَا لِبَاسَهُمَا لِيُرِيَهُمَا سَوْءَٰتِهِمَآ ۗ إِنَّهُۥ يَرَىٰكُمْ هُوَ وَقَبِيلُهُۥ مِنْ حَيْثُ لَا تَرَوْنَهُمْ ۗ إِنَّا جَعَلْنَا ٱلشَّيَٰطِينَ أَوْلِيَآءَ لِلَّذِينَ لَا يُؤْمِنُونَ ﴿27﴾", "ru": "О сыны Адама! Пусть сатана не искусит вас, как он извел ваших родителей из рая, совлекши с них одежду, чтобы показать им их мерзость. Ведь он видит вас - он и его сонм - оттуда, откуда вы их не видите. Поистине, Мы сделали шайтанов покровителями тех, которые не веруют!"}], "n": "Что сказано: Джинны созданы ⟦из жара огня⟧ (15:27), ⟦из смеси бездымного огня⟧ (55:15); они слушали Коран и уверовали (72:1-2; 46:29-32); среди них ⟦предавшиеся Аллаху⟧ и «отступившие», и последние — ⟦растопка для геенны⟧ (72:14-15); сатана и его род ⟦видят вас оттуда, откуда вы их не видите⟧ (7:27).\nВ чём проблема: (1) Коран утверждает реальность разумных существ из огня, которых нельзя наблюдать; науке они неизвестны. (2) Существа, созданные из огня, наказываются огнём: как огонь мучает созданных из него? Апологеты: в аду иная материя; критики: объяснение придумано. (3) Джиннам приписаны вера и богословие, как людям.", "c": null, "x": [], "t": "Джинны — реальные разумные существа", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. Существа из огня, наказываемые огнём; непроверяемо."}], "summary": ["Реальность джиннов, колдовства — вопрос веры, а не логики текста.", "Довод наукой: непроверяемо."]}];
const EXTRA = {"5:48": {"ru": "И Мы низвели тебе писание с истиной для подтверждения истинности того, что ниспослано до него из писания, и для охранения его. Суди же среди них по тому, что низвел Аллах, и не следуй за их страстями в сторону от истины, которая пришла к тебе. Всякому из вас Мы устроили дорогу и путь. А если бы пожелал Аллах, то Он сделал бы вас единым народом, но... чтобы испытать вас в том, что Он даровал вам. Старайтесь же опередить друг друга в добрых делах! К Аллаху - возвращение вас всех, и Он сообщит вам то, в чем вы разногласили!", "sura": "Al-Maaida"}, "10:91": {"ru": "Да, теперь! А раньше ты ослушался и был распространителем нечестия.", "sura": "Yunus"}, "54:49": {"ru": "Поистине, Мы ведь всякую вещь сотворили по мере!", "sura": "Al-Qamar"}, "16:58": {"ru": "И когда одного из них обрадуют девочкой, лицо его делается черным, и он удручен,", "sura": "An-Nahl"}, "6:59": {"ru": "У Него - ключи тайного; знает их только Он. Знает Он, что на суше и на море; лист падает только с Его ведома, и нет зерна во мраке земли, нет свежего или сухого, чего не было бы в книге ясной.", "sura": "Al-An'aam"}, "2:263": {"ru": "Речь добрая и прощение - лучше, чем милостыня, за которой следует обида. Поистине, Аллах богат, кроток!", "sura": "Al-Baqara"}, "39:7": {"ru": "Если вы будете неверными, то Аллах не нуждается в вас, и не соблаговолит Он Своих рабов на неверие, а если вы будете благодарны, Он соблаговолит на это для вас. И не понесет носящая ношу другой. Потом к Господу вашему ваше обращение. И Он возвестит вам то, что вы делаете. Он ведь знает про то, что в груди!", "sura": "Az-Zumar"}, "15:39": {"ru": "Сказал он: \"Господи мой! За то, что Ты сбил меня, я украшу им то, что на земле, и собью их всех,", "sura": "Al-Hijr"}, "34:14": {"ru": "Когда же Мы обрекли его на смерть, указало на смерть его только животное земли, которое подъело посох. А когда он упал, уразумели джинны, что если бы они знали тайное, то не оказались бы в унизительном наказании.", "sura": "Saba"}, "2:224": {"ru": "И не делайте Аллаха предметом ваших клятв, что вы благочестивы и богобоязненны и упорядочиваете среди людей. Поистине, Аллах - слышащий, знающий!", "sura": "Al-Baqara"}, "16:94": {"ru": "Не обращайте же своих клятв в обман между собой, чтобы не поскользнулась ваша нога, после того как стояла твердо, а то вы испробуете зло от того, что уклонились от пути Аллаха, и вам - великое наказание.", "sura": "An-Nahl"}, "8:13": {"ru": "Это - за то, что они откололись от Аллаха и Его посланника... ведь Аллах силен в наказании!", "sura": "Al-Anfaal"}, "66:9": {"ru": "О, пророк, борись с неверными и лицемерами и будь жесток к ним! Их убежище - геенна, и скверно это возвращение!", "sura": "At-Tahrim"}, "61:11": {"ru": "Вы веруете в Аллаха и Его посланника, боретесь на пути Аллаха своим имуществом и своими душами. Это лучше для вас, если вы знаете!", "sura": "As-Saff"}, "33:27": {"ru": "И Он дал вам в наследие их землю, их жилища, их достояние и землю, которую вы не попирали. Аллах над всякой вещью мощен!", "sura": "Al-Ahzaab"}, "4:29": {"ru": "О вы, которые уверовали! Не пожирайте имуществ ваших между собой попусту, если это только не торговля по взаимному согласию между вами. И не убивайте самих себя. Поистине, Аллах к вам милосерд!", "sura": "An-Nisaa"}, "17:33": {"ru": "И не убивайте душу, которую запретил Аллах, иначе, как по праву. А если кто был убит несправедливо, то Мы его близкому дали власть, но пусть он не излишествует в убиении. Поистине, ему оказана помощь.", "sura": "Al-Israa"}, "6:151": {"ru": "Скажи: \"Приходите, Я прочитаю то, что запретил вам ваш Господь: чтобы вы не придавали Ему ничего в сотоварищи; к родителям - добродеяние; не убивайте ваших детей от бедности - Мы прокормим их и вас; не приближайтесь к мерзостям, к явным из них и тайным; не убивайте душу, которую запретил Аллах, иначе как по праву. Это завещал Он вам, - может быть, вы уразумеете!", "sura": "Al-An'aam"}, "17:31": {"ru": "И не убивайте ваших детей из боязни обеднения: Мы пропитаем их и вас; поистине, убивать их - великий грех!", "sura": "Al-Israa"}, "3:185": {"ru": "Всякая душа вкушает смерть, и вам сполна будут даны ваши награды в день воскресения. И кто будет удален от огня и введен в рай, тот получил успех. А ближайшая жизнь - только пользование обольщением.", "sura": "Aal-i-Imraan"}, "8:70": {"ru": "О пророк! Скажи тем, в руках которых пленные: \"Если Аллах узнает про добро в ваших сердцах, Он дарует вам лучшее, чем то, что взято у вас, и простит вам: Аллах прощающ, милосерд!\"", "sura": "Al-Anfaal"}, "5:34": {"ru": "кроме тех, которые обратились прежде, чем вы получили власть над ними. Знайте же, что Аллах - прощающий, милосердный!", "sura": "Al-Maaida"}, "5:39": {"ru": "А кто обратится после своей несправедливости и исправит, то Аллах обратится к нему. Поистине, Аллах - прощающий, милосердный!", "sura": "Al-Maaida"}, "41:34": {"ru": "Не равны доброе и злое. Отклоняй же тем, что лучше, и вот - тот, с которым у тебя вражда, точно он горячий друг.", "sura": "Fussilat"}, "2:7": {"ru": "Наложил печать Аллах на сердца их и на слух, а на взорах их - завеса. Для них - великое наказание!", "sura": "Al-Baqara"}, "11:107": {"ru": "вечно пребывая там, - пока длятся небеса и земля, если только не пожелает твой Господь, - ведь твой Господь - исполнитель того, что Он желает!", "sura": "Hud"}, "4:169": {"ru": "разве только путем геенны, - вечно пребывающими там навсегда! Ведь это для Аллаха - легко.", "sura": "An-Nisaa"}, "39:68": {"ru": "И протрубят в трубу и поражены будут, как молнией, те, кто в небесах, и те, кто на земле, кроме тех, кого пожелает Аллах. Потом протрубят вторично, и вот - они стоя смотрят.", "sura": "Az-Zumar"}, "74:31": {"ru": "Сделали Мы властителями огня только ангелов и сделали число их только испытанием для тех, которые не веруют, чтобы удостоверились те, кому дана книга, и усилили те, которые веруют, веру. И не сомневались те, кому дана книга, и верующие. И сказали те, в сердцах которых болезнь, и неверующие: \"Что такое хотел Аллах этим, как притчей?\" Так вводит в заблуждение Аллах, кого хочет, и ведет прямым путем, кого хочет, и никто не знает воинств Господа твоего, кроме Него, а это - лишь напоминание людям.", "sura": "Al-Muddaththir"}, "2:286": {"ru": "Не возлагает Аллах на душу ничего, кроме возможного для нее. Ей - то, что она приобрела, и против нее - то, что она приобрела для себя. \"Господи наш! Не взыщи с нас, если мы забыли или погрешили. Господи наш! Не возлагай на нас тяготу, как Ты возложил на тех, кто был раньше нас. Господи наш! Не возлагай также на нас то, что нам невмочь. Избавь нас, прости нам, и помилуй нас! Ты - наш владыка, помоги же нам против народа неверного!\"", "sura": "Al-Baqara"}, "41:46": {"ru": "Кто творил благое, то для самого себя, а кто творил злое, тоже против себя, и твой Господь не обидчик для рабов.", "sura": "Fussilat"}, "4:128": {"ru": "И если женщина боится от своего мужа суровости или уклонения, то нет греха на них, чтобы они устроили между собой согласие. Ведь согласие - лучше. При душах постоянно пребывает скупость. А если вы будете благодетельны и богобоязненны, то, поистине, Аллах сведущ в том, что вы делаете!", "sura": "An-Nisaa"}, "24:30": {"ru": "Скажи верующим, пускай они потупляют свои взоры и берегут свои члены; это - чище для них. Поистине, Аллах сведущ в том, что они делают!", "sura": "An-Noor"}, "5:73": {"ru": "Не веровали те, которые говорили: \"Ведь Аллах - третий из трех\", - тогда как нет другого божества, кроме единого Бога. А если они не удержатся от того, что говорят, то коснется тех из них, которые не уверовали, мучительное наказание.", "sura": "Al-Maaida"}, "5:69": {"ru": "Поистине, те, которые уверовали и которые исповедуют иудейство, и сабии, и христиане, - кто уверовал в Аллаха и последний день и творил благое, - нет страха над ними, и не будут они печальны!", "sura": "Al-Maaida"}, "5:68": {"ru": "Скажи: \"О люди писания! Вы ни на чем не держитесь, пока не установите прямо Торы и Евангелия и того, что низведено вам от вашего Господа\". Но у многих из них низведенное тебе от твоего Господа увеличивает только заблуждение и неверие. Не горюй же о людях неверных!", "sura": "Al-Maaida"}, "10:94": {"ru": "Если же ты в сомнении о том, что Мы ниспослали тебе, то спроси тех, которые читают писание до тебя. Пришла к тебе истина от Твоего Господа; не будь же из колеблющихся!", "sura": "Yunus"}, "16:43": {"ru": "Мы и до тебя посылали только людей, которым внушали, - спросите же людей напоминания, если вы сами не знаете, -", "sura": "An-Nahl"}, "9:61": {"ru": "Среди них есть и такие, которые причиняют обиду пророку и говорят: \"Он - ухо\". Скажи: \"Ухо блага для вас!\" Он верует в Аллаха и верит верующим, и милость - тем из вас, которые уверовали; а тем, которые причиняют обиду посланнику Аллаха, - им - наказание болезненное.", "sura": "At-Tawba"}, "23:96": {"ru": "Отклоняй зло тем, что лучше; Мы вернее знаем, что они описывают.", "sura": "Al-Muminoon"}, "16:91": {"ru": "Верно выполняйте договор с Аллахом, когда его заключили, и не нарушайте клятв после их закрепления: вы сделали Аллаха поручителем за вас. Поистине, Аллах знает то, что вы творите!", "sura": "An-Nahl"}, "42:52": {"ru": "И так Мы внушили тебе духу от Нашего веления: ты не знал, что такое книга и вера, но Мы сделали его светом, которым Мы ведем кого угодно из Наших рабов, и ты ведешь на прямой путь,", "sura": "Ash-Shura"}, "17:93": {"ru": "или будет у тебя дом из золотых украшений, или ты поднимаешься на небо. Но не уверуем мы и в твое поднятие, пока ты не спустишь нам книгу, которую мы прочитаем\". Скажи: \"Хвала Господу моему! Разве я только не человек - посланник?\"", "sura": "Al-Israa"}, "18:110": {"ru": "Скажи: \"Я ведь - человек, подобный вам; ниспослано мне откровение о том, что бог ваш - Бог единый. И кто надеется встретить своего Господа, пусть творит дело благое и в поклонении Господу своему не присоединяет к Нему никого\".", "sura": "Al-Kahf"}, "3:179": {"ru": "Аллах не таков, чтобы оставить верующих в том состоянии, как вы, до того, как Он отличит мерзкого от хорошего. И не таков Аллах, чтобы ознакомить вас с сокровенным, но Аллах избирает из Своих посланников, кого хочет, Веруйте же в Аллаха и Его посланников, а если уверуете и будете бояться, то вам - великая награда!", "sura": "Aal-i-Imraan"}, "27:65": {"ru": "Скажи: \"Не знает тот, кто в небесах и на земле, скрытого, кроме Аллаха, и не знают они, когда будут воскрешены!\"", "sura": "An-Naml"}, "10:38": {"ru": "Может быть, они скажут: \"Измыслил он его\". Скажи: \"Приведите же суру, подобную ему, и призывайте, кого вы можете, помимо Аллаха, если вы правдивы!\"", "sura": "Yunus"}, "25:5": {"ru": "И сказали они: \"Сказки первых! Он приказал записать их для себя, и читаются они ему утром и вечером\".", "sura": "Al-Furqaan"}, "6:109": {"ru": "И поклялись они Аллахом - важнейшей из их клятв: если придет к ним знамение, они обязательно уверуют в него. Скажи: \"Знамения - у Аллаха, но как вы узнаете, что, когда они придут, они не уверуют?\"", "sura": "Al-An'aam"}, "61:2-3": {"ru": "(2) О вы, которые уверовали! Почему вы говорите то, чего не делаете? (3) Велика ненависть у Аллаха за то, что вы говорите то, чего не делаете.", "sura": "As-Saff"}, "25:59": {"ru": "который сотворил небеса, и землю, и то, что между ними, в шесть дней; потом утвердился на троне - Милосердный, спроси о Нем сведущего!", "sura": "Al-Furqaan"}, "39:42": {"ru": "Аллах приемлет души в момент их смерти, а ту, которая не умерла, во сне; схватывает ту, для которой решил смерть, и отправляет другую до названного срока. Поистине, в этом - знамение для людей, которые размышляют!", "sura": "Az-Zumar"}, "2:131": {"ru": "Вот сказал ему его Господь: \"Предайся!\" Он сказал: \"Я предался Господу миров!\"", "sura": "Al-Baqara"}, "4:33": {"ru": "Каждому Мы сделали наследников в том, что оставили родители и близкие, а те, с которыми ваши клятвы укрепили договор, - давайте им их долю. Поистине, Аллах - всякой вещи свидетель!", "sura": "An-Nisaa"}, "7:171": {"ru": "И вот вытянули Мы гору над ними, точно она туча, и думали они, что она падет на них. Возьмите то, что Мы привели к вам, с силой и вспоминайте, что там, - может быть, вы будете богобоязненны!", "sura": "Al-A'raaf"}, "21:96": {"ru": "пока не будут открыты Йаджудж и Маджудж, и они устремятся с каждой возвышенности.", "sura": "Al-Anbiyaa"}, "39:43": {"ru": "Разве они взяли помимо Аллаха заступников? Скажи: \"Даже если бы они не владели ничем и не разумели?\"", "sura": "Az-Zumar"}, "9:72": {"ru": "Обещал Аллах верующим мужчинам и женщинам сады, где внизу текут реки, - для вечного пребывания там, - и благие жилища в садах вечности. А благоволение Аллаха - больше; это - великая удача!", "sura": "At-Tawba"}, "43:70": {"ru": "Войдите в рай, вы и ваши жены, будете ублажены!", "sura": "Az-Zukhruf"}, "36:56": {"ru": "Они и их супруги в тени возлежат на ложах.", "sura": "Yaseen"}, "37:47": {"ru": "Нет в нем буйства, и не будут они им изнурены.", "sura": "As-Saaffaat"}, "56:19": {"ru": "от него не страдают головной болью и ослаблением -", "sura": "Al-Waaqia"}, "5:110": {"ru": "Вот скажет Аллах: \"О Иса, сын Марйам! Вспомни милость Мою тебе и твоей родительнице, как Я подкрепил тебя духом святым. Ты говорил с людьми в колыбели и взрослым. И вот научил Я тебя писанию, мудрости, Торе, Евангелию, и вот ты делал из глины подобие птиц с Моего дозволения и дул на них, и становились они птицами с Моего дозволения, и ты изводил мертвых с Моего дозволения. И вот Я удержал сынов Исраила от тебя, когда ты пришел к ним с ясными знамениями. И сказали те, которые не веровали из них: \"Это - только очевидное колдовство!\"", "sura": "Al-Maaida"}};
const TOP = {"blocks": [{"h": "Как читать эту страницу", "p": ["Это сводка анализа по тексту Корана (перевод Крачковского, без хадисов и позднейших комментариев). Каждый пункт ведёт на карточку с дословным текстом и разбором.", "Метки силы: «сильный» — два аята прямо противоречат друг другу либо утверждение проверяемо и неверно по самому тексту; «средний» — расхождение есть, но его снимает толкование, которого в тексте нет; «слабый» — вывод зависит от перевода или допущения. На этой странице собраны только пункты, которые держатся на самом тексте."]}, {"h": "1. Внутренние противоречия: проверка по критерию самого Корана", "p": ["В 4:82 Коран сам предлагает критерий проверки: «если бы он был не от Аллаха, то они нашли бы там много противоречий». По этому критерию оценены места ниже."], "items": [{"t": "«Всё от Аллаха» (4:78) и «дурное — от самого себя» (4:79)", "x": "Два подряд идущих аята приписывают происхождение зла разным причинам. Это наиболее прямое противоречие в одном месте текста.", "l": [["contradictions", "4:78", "сильный"]]}, {"t": "«Нет принуждения в религии» (2:256) и приказы воевать (9:5, 9:29, 8:39)", "x": "Принцип свободы веры и приказы убивать или воевать до подчинения стоят в одном тексте. Классическая традиция снимает конфликт доктриной отмены, то есть сама признаёт, что аяты расходятся.", "l": [["contradictions", "2:256", "сильный"], ["violence", "9:5", "сильный"]]}, {"t": "Судьба людей иных религий: 2:62, 5:69 и 3:85", "x": "2:62 обещает награду верующим из иудеев, христиан и сабиев без условия принять ислам, а 3:85 говорит, что ничего, кроме ислама, принято не будет.", "l": [["contradictions", "2:62", "сильный"], ["others", "3:85", "сильный"]]}, {"t": "Отступник: 2:217 и 4:89", "x": "В 2:217 отступнику угрожает кара в будущей жизни, в 4:89 велено убивать «отвернувшихся». Две нормы о том же предмете.", "l": [["apostasy", "2:217", "средний"], ["violence", "4:89", "средний"]]}, {"t": "Арифметика наследства (4:11, 4:12, 4:176)", "x": "Доли, заданные текстом, в ряде случаев в сумме превышают единицу (например, 1/2 + 2/3 = 7/6). Это проверяемый расчёт по самому тексту; юристы решают его уменьшением долей, а такого правила в Коране нет.", "l": [["contradictions", "4:11", "сильный"]]}, {"t": "Свобода воли и предопределение (18:29, 14:4, 2:7, 6:35, 11:119)", "x": "Текст призывает верить как к выбору («кто хочет — пусть верует»), угрожает за неверие адом и в то же время говорит, что Бог запечатывает сердца, сводит с пути, кого хочет, и что, если бы Он пожелал, повёл бы всех. Согласования в тексте нет.", "l": [["hell", "18:29", "средний"], ["fate", "2:6-7", "средний"], ["omni", "6:35", "средний"]]}, {"t": "Ясность Корана (3:7) и охрана текста (15:9)", "x": "Коран называет себя ясным и объясняющим всё, но в 3:7 признаёт неясные места, толкование которых знает только Бог; обещает охрану текста, но допускает замену и стирание аятов (2:106, 13:39).", "l": [["origin", "3:7", "средний"], ["origin", "15:9", "средний"], ["abrogation", "13:39", "средний"]]}, {"t": "Многоженство при условии справедливости (4:3) и 4:129", "x": "Условие справедливости между жёнами в 4:129 названо недостижимым, то есть условие разрешения, по тексту, невыполнимо.", "l": [["women", "4:3", "средний"], ["family", "4:129", "средний"]]}], "after": "Общий вывод по блоку: тексту присущи расхождения, которые он сам не разрешает. Выбор «действующего» аята остаётся за толкователем; доктрина отмены, на которую опираются, сама основана на 2:106 и спорит с 6:115 («нет изменителя словам Его»)."}, {"h": "2. Призывы к насилию и жестокие нормы", "p": ["Рассмотрены места, где приказ или наказание сформулированы в самом аяте. Часть аятов контекстно привязана к войнам VII века, а часть сформулирована безусловно; именно вторая группа важна для оценки."], "items": [{"t": "Приказ убивать многобожников, пока они не примут ислам (9:5)", "x": "Единственное условие пощады — принятие ислама (молитва и закят). Повторяется принцип 8:39: воевать, пока «религия вся» не станет Аллаха.", "l": [["violence", "9:5", "сильный"], ["violence", "8:39", "средний"]]}, {"t": "Война против людей Писания до уплаты откупа в состоянии «униженности» (9:29)", "x": "Основание — иная вера, нападение в аяте не названо условием.", "l": [["violence", "9:29", "средний"]]}, {"t": "Убийство «отвернувшихся» (4:89) и «лицемеров» (9:73, 33:61)", "x": "Объектом насилия становятся люди внутри общины, по признаку, который невозможно проверить: сам Коран говорит Пророку, что он не знает лицемеров (9:101).", "l": [["violence", "4:89", "средний"], ["violence", "9:73", "средний"], ["violence", "33:61", "средний"]]}, {"t": "Божественное одобрение убийства и увечий в бою (8:12, 47:4, 8:17, 33:26)", "x": "Удары «по шеям» и «по пальцам», убийство в бою приписано Богу, истребление мужчин и пленение остальных названо делом Бога.", "l": [["violence", "8:12", "средний"], ["violence", "8:17", "средний"], ["violence", "33:26", "средний"]]}, {"t": "Награда за смерть в бою и добыча (4:74, 9:111, 2:154)", "x": "Бой оформлен как сделка: рай в обмен на жизнь; погибшие «живы». Это система мотивации к насилию обещанием вечной награды.", "l": [["jihad", "4:74", "средний"], ["violence", "9:111", "средний"], ["jihad", "2:154", "средний"]]}, {"t": "Телесные наказания и отсечение (5:33, 5:38, 24:2)", "x": "Распятие, отсечение рук и ног, сто плетей при запрете жалости, отсечение руки за кражу без различия размера.", "l": [["punish", "5:33", "средний"], ["punish", "5:38", "средний"], ["punish", "24:2", "средний"]]}, {"t": "Физические мучения в аду (4:56, 22:19-21, 73:12-13)", "x": "Бесконечная кара за конечную жизнь описана подробно, цель названа: «страшить».", "l": [["hell", "4:56", "средний"], ["hell", "73:12-13", "средний"]]}], "after": "Общий вывод по блоку: в тексте есть как ограничивающие аяты (2:190, 8:61, 60:8), так и безусловные приказы без указания на нападение (9:5, 9:29, 9:123). Согласующего правила, какой из них применять, в самом тексте нет."}, {"h": "3. Права человека: сопоставление с Всеобщей декларацией прав человека (1948)", "p": ["Сопоставление делается по тексту аятов. Оно показывает, где нормы текста, взятые буквально, расходятся с принципами декларации; как их применяют сегодня верующие и государства, зависит от толкования и вне предмета этого доклада."], "items": [{"t": "Свобода религии и её смены (ст. 18)", "x": "Приказ убивать «отвернувшихся» (4:89), вечное проклятие отступникам (3:86-87), приравнивание «лицемеров» к врагам (9:73). Против этого стоят 2:256 и 2:217 (кара только в будущей жизни).", "l": [["violence", "4:89", "средний"], ["apostasy", "3:86-87", "средний"], ["apostasy", "2:217", "средний"]]}, {"t": "Равенство независимо от религии (ст. 1, 2, 7)", "x": "Неверные названы «худшими животными» (8:55) и «наихудшими тварями» (98:6), «нечистыми» (9:28); людям Писания положено платить откуп в «униженности» (9:29).", "l": [["others", "8:55", "средний"], ["others", "98:6", "средний"], ["others", "9:28", "средний"], ["violence", "9:29", "средний"]]}, {"t": "Равенство мужчин и женщин (ст. 2, 7, 16)", "x": "Доля женщины в наследстве вдвое меньше (4:11), свидетельство двух женщин равно одному мужчине (2:282), разрешены удары жене (4:34), многоженство (4:3), развод по воле мужа (2:229), срок ожидания только для вдов (2:234).", "l": [["women", "4:34", "средний"], ["women", "2:282", "средний"], ["women", "4:11", "средний"], ["women", "2:229", "средний"], ["women", "2:234", "средний"]]}, {"t": "Брак по свободному согласию, детство (ст. 16)", "x": "Срок ожидания после развода установлен и для тех, «у которых ещё не было месячных» (65:4), то есть предполагается возможность брака с девочкой до зрелости.", "l": [["women", "65:4", "средний"]]}, {"t": "Запрет рабства (ст. 4)", "x": "Рабство не отменено: рабыни приравнены к законным партнёршам (23:5-6), люди названы добычей (8:69), рабство принято как данность (4:25, 4:92, 16:75). Освобождение поощряется, но не требуется.", "l": [["slavery", "23:5-6", "средний"], ["slavery", "8:69", "средний"], [
