رَاءِ", "type": "Meccan", "ar": "وَقُرْءَانًۭا فَرَقْنَٰهُ لِتَقْرَأَهُۥ عَلَى ٱلنَّاسِ عَلَىٰ مُكْثٍۢ وَنَزَّلْنَٰهُ تَنزِيلًۭا ﴿106﴾", "ru": "И Коран Мы разделили, чтобы читал ты его людям с выдержкой, и ниспослали Мы его ниспосланием."}], "n": "Что сказано: «Месяц Рамадан, в который ниспослан был Коран» (2:185); «Мы ниспослали его в ночь могущества» (97:1); «Мы ниспослали его в ночь благословенную» (44:3). Но: ⟦Неверные говорят: Почему не ниспослан ему Коран за один раз? Так — чтобы укрепить им твоё сердце, и Мы читали его по порядку⟧ (25:32); «Коран Мы разделили, чтобы читал ты его людям с выдержкой» (17:106).\nВ чём проблема: в одних аятах Коран ниспослан целиком в одну ночь, в других — по частям на протяжении времени. Традиция объясняет: сначала целиком на нижнее небо, потом по частям; но в тексте этого нет. Если Коран был ниспослан сразу, зачем в 25:32 объяснять, почему не «за один раз»?", "c": null, "x": [], "t": "Когда и как ниспослан Коран", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Коран ниспослан целиком в одну ночь и постепенно. Объяснение традиции вне текста."}, {"refs": ["4:11", "4:12", "4:176"], "parts": [{"ref": "4:11", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يُوصِيكُمُ ٱللَّهُ فِىٓ أَوْلَٰدِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ ٱلْأُنثَيَيْنِ ۚ فَإِن كُنَّ نِسَآءًۭ فَوْقَ ٱثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ ۖ وَإِن كَانَتْ وَٰحِدَةًۭ فَلَهَا ٱلنِّصْفُ ۚ وَلِأَبَوَيْهِ لِكُلِّ وَٰحِدٍۢ مِّنْهُمَا ٱلسُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُۥ وَلَدٌۭ ۚ فَإِن لَّمْ يَكُن لَّهُۥ وَلَدٌۭ وَوَرِثَهُۥٓ أَبَوَاهُ فَلِأُمِّهِ ٱلثُّلُثُ ۚ فَإِن كَانَ لَهُۥٓ إِخْوَةٌۭ فَلِأُمِّهِ ٱلسُّدُسُ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصِى بِهَآ أَوْ دَيْنٍ ۗ ءَابَآؤُكُمْ وَأَبْنَآؤُكُمْ لَا تَدْرُونَ أَيُّهُمْ أَقْرَبُ لَكُمْ نَفْعًۭا ۚ فَرِيضَةًۭ مِّنَ ٱللَّهِ ۗ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿11﴾", "ru": "Завещает вам Аллах относительно ваших детей: сыну - долю, подобную доле двух дочерей. А если они (дети)- женщины, числом больше двух, то им - две трети того, что он оставил, а если одна, то ей - половина. А родителям его, каждому из двух - одна шестая того, что он оставил, если у него есть ребенок. А если у него нет ребенка и ему наследуют его родители, то матери - одна треть. А если есть у него братья, то матери - одна шестая после завещанного, которой он завещает, или долга. Родители ваши или ваши сыновья - вы не знаете, кто из них ближе вам по пользе, как установлено Аллахом. Поистине, Аллах знающ, мудр!"}, {"ref": "4:12", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "۞ وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَٰجُكُمْ إِن لَّمْ يَكُن لَّهُنَّ وَلَدٌۭ ۚ فَإِن كَانَ لَهُنَّ وَلَدٌۭ فَلَكُمُ ٱلرُّبُعُ مِمَّا تَرَكْنَ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصِينَ بِهَآ أَوْ دَيْنٍۢ ۚ وَلَهُنَّ ٱلرُّبُعُ مِمَّا تَرَكْتُمْ إِن لَّمْ يَكُن لَّكُمْ وَلَدٌۭ ۚ فَإِن كَانَ لَكُمْ وَلَدٌۭ فَلَهُنَّ ٱلثُّمُنُ مِمَّا تَرَكْتُم ۚ مِّنۢ بَعْدِ وَصِيَّةٍۢ تُوصُونَ بِهَآ أَوْ دَيْنٍۢ ۗ وَإِن كَانَ رَجُلٌۭ يُورَثُ كَلَٰلَةً أَوِ ٱمْرَأَةٌۭ وَلَهُۥٓ أَخٌ أَوْ أُخْتٌۭ فَلِكُلِّ وَٰحِدٍۢ مِّنْهُمَا ٱلسُّدُسُ ۚ فَإِن كَانُوٓا۟ أَكْثَرَ مِن ذَٰلِكَ فَهُمْ شُرَكَآءُ فِى ٱلثُّلُثِ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصَىٰ بِهَآ أَوْ دَيْنٍ غَيْرَ مُضَآرٍّۢ ۚ وَصِيَّةًۭ مِّنَ ٱللَّهِ ۗ وَٱللَّهُ عَلِيمٌ حَلِيمٌۭ ﴿12﴾", "ru": "И вам - половина того, что оставили ваши супруги, если у них нет ребенка. А если у них есть ребенок, то вам - четверть того, что они оставили после завещанного, которое они завещают, или долга. А им - четверть того, что оставили вы, если у вас нет ребенка. А если у вас есть ребенок, то им - одна восьмая того, что оставили вы после завещанного, которое вы завещаете, или долга. А если мужчина бывает наследником по боковой линии, или женщина, и у него есть брат или сестра, то каждому из них обоих - одна шестая. А если их больше этого, то они - соучастники в трети после завещанного, которое он завещает, или долга, не причиняя вреда, по завету от Аллаха. Поистине, Аллах - знающий, кроткий!"}, {"ref": "4:176", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَسْتَفْتُونَكَ قُلِ ٱللَّهُ يُفْتِيكُمْ فِى ٱلْكَلَٰلَةِ ۚ إِنِ ٱمْرُؤٌا۟ هَلَكَ لَيْسَ لَهُۥ وَلَدٌۭ وَلَهُۥٓ أُخْتٌۭ فَلَهَا نِصْفُ مَا تَرَكَ ۚ وَهُوَ يَرِثُهَآ إِن لَّمْ يَكُن لَّهَا وَلَدٌۭ ۚ فَإِن كَانَتَا ٱثْنَتَيْنِ فَلَهُمَا ٱلثُّلُثَانِ مِمَّا تَرَكَ ۚ وَإِن كَانُوٓا۟ إِخْوَةًۭ رِّجَالًۭا وَنِسَآءًۭ فَلِلذَّكَرِ مِثْلُ حَظِّ ٱلْأُنثَيَيْنِ ۗ يُبَيِّنُ ٱللَّهُ لَكُمْ أَن تَضِلُّوا۟ ۗ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌۢ ﴿176﴾", "ru": "У тебя спрашивают решения. Скажи: \"Аллах дает вам решение о боковой линии. Если человек погибнет и нет у него ребенка, а есть у него сестра, то ей - половина того. что он оставил, и он наследует после нее, если у нее нет ребенка. А если их - две, то им обеим - две трети того, что он оставил. А если они - братья, мужчины или женщины, то мужскому полу столько же, сколько доля двух женщин\". Разъясняет вам Аллах, чтобы вы не заблудились. А Аллах о всякой вещи знающ!"}], "n": "Что сказано: В 4:11 двум дочерям — две трети, родителям — каждому по шестой части; в 4:12 мужу — половина, жене — четверть или восьмая; в 4:176 двум сёстрам — две трети.\nВ чём проблема: в ряде случаев доли в сумме превышают единицу. Пример 1: умерла бездетная женщина, оставила мужа и двух сестёр: 1/2 (4:12) + 2/3 (4:176) = 7/6. Пример 2: умер мужчина, оставил жену, двух дочерей и обоих родителей: 1/8 + 2/3 + 1/6 + 1/6 = 9/8. Юристам пришлось придумать правило пропорционального уменьшения долей (⟦аул⟧). Критики: Бог, которому всё известно, дал доли, которые невозможно выполнить буквально.\nКак отвечают верующие: аяты рассчитаны на типичные случаи, остальное решают юристы.", "c": null, "x": ["4:33"], "t": "Арифметика наследства", "at": "внутреннее противоречие", "pw": "сильный", "cl": "Вывод: прямое противоречие внутри текста, вопреки 4:82, где Коран утверждает, что противоречий в нём нет. Арифметика наследства: доли 4:12 и 4:176 в сумме превышают единицу (например, 1/2 + 2/3 = 7/6). Это проверяемый расчёт по самому тексту; юристы решают его уменьшением долей (аул)."}, {"refs": ["51:56", "7:179", "11:119"], "parts": [{"ref": "51:56", "sura": "Adh-Dhaariyat", "sura_ar": "سُورَةُ الذَّارِيَاتِ", "type": "Meccan", "ar": "وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ ﴿56﴾", "ru": "Я ведь создал джиннов и людей только, чтобы они Мне поклонялись."}, {"ref": "7:179", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيرًۭا مِّنَ ٱلْجِنِّ وَٱلْإِنسِ ۖ لَهُمْ قُلُوبٌۭ لَّا يَفْقَهُونَ بِهَا وَلَهُمْ أَعْيُنٌۭ لَّا يُبْصِرُونَ بِهَا وَلَهُمْ ءَاذَانٌۭ لَّا يَسْمَعُونَ بِهَآ ۚ أُو۟لَٰٓئِكَ كَٱلْأَنْعَٰمِ بَلْ هُمْ أَضَلُّ ۚ أُو۟لَٰٓئِكَ هُمُ ٱلْغَٰفِلُونَ ﴿179﴾", "ru": "Мы сотворили для геенны много джиннов и людей: у них сердца, которыми они не понимают, глаза, которыми они не видят, уши, которыми не слышат. Они - как скоты, даже более заблудшие. Они - находящиеся в невнимательности."}, {"ref": "11:119", "sura": "Hud", "sura_ar": "سُورَةُ هُودٍ", "type": "Meccan", "ar": "إِلَّا مَن رَّحِمَ رَبُّكَ ۚ وَلِذَٰلِكَ خَلَقَهُمْ ۗ وَتَمَّتْ كَلِمَةُ رَبِّكَ لَأَمْلَأَنَّ جَهَنَّمَ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ أَجْمَعِينَ ﴿119﴾", "ru": "кроме тех, кого помиловал твой Господь. Для этого Он их создал. и исполнилось речение Господа твоего: \"Наполню Я геенну духами и людьми вместе\"."}], "n": "Что сказано: ⟦Я создал джиннов и людей только для того, чтобы они Мне поклонялись⟧ (51:56); но «Мы сотворили для геенны много джиннов и людей» (7:179); «для этого Он их создал» (11:119, о разногласии и наполнении геенны).\nВ чём проблема: цель творения названа как поклонение, и тут же как ад. Если цель — поклонение, то множество людей создано без шанса достичь цели (см. ⟦Предопределение⟧); если цель — ад, то 51:56 неверно.\nКак отвечают верующие: верующие: 11:119 — о разнице между верующими и неверующими, а «для этого» относится к милости.", "c": null, "x": ["32:13", "18:29"], "t": "Для чего созданы люди", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Цель творения — поклонение (51:56), а в 11:119 «для этого Он их создал» — для ада. Внутреннее напряжение по предопределению."}, {"refs": ["16:99", "15:42", "3:155"], "parts": [{"ref": "16:99", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "إِنَّهُۥ لَيْسَ لَهُۥ سُلْطَٰنٌ عَلَى ٱلَّذِينَ ءَامَنُوا۟ وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ ﴿99﴾", "ru": "Поистине, нет у него власти над теми, которые уверовали и полагаются на своего Господа."}, {"ref": "15:42", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "إِنَّ عِبَادِى لَيْسَ لَكَ عَلَيْهِمْ سُلْطَٰنٌ إِلَّا مَنِ ٱتَّبَعَكَ مِنَ ٱلْغَاوِينَ ﴿42﴾", "ru": "Поистине, рабы Мои - нет для тебя над ними власти, кроме тех из заблудших, кто последовал за тобой,"}, {"ref": "3:155", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ تَوَلَّوْا۟ مِنكُمْ يَوْمَ ٱلْتَقَى ٱلْجَمْعَانِ إِنَّمَا ٱسْتَزَلَّهُمُ ٱلشَّيْطَٰنُ بِبَعْضِ مَا كَسَبُوا۟ ۖ وَلَقَدْ عَفَا ٱللَّهُ عَنْهُمْ ۗ إِنَّ ٱللَّهَ غَفُورٌ حَلِيمٌۭ ﴿155﴾", "ru": "Поистине, те из вас, которые отвернулись, в тот день, когда встретились два отряда, - их заставил споткнуться сатана чем-то, что они приобрели. Аллах уже простил их, - ведь Аллах - прощающий, кроткий!"}], "n": "Что сказано: «Нет у него власти над теми, которые уверовали» (16:99); «рабы Мои — нет для тебя над ними власти, кроме тех из заблудших, кто последовал за тобой» (15:42). Но верующие, отвернувшиеся в день встречи двух отрядов, — «их заставил споткнуться сатана чем-то, что они приобрели» (3:155).\nВ чём проблема: сатана не имеет власти над верующими, но заставил их споткнуться. Верующие отвечают, что в 3:155 причина — «то, что они приобрели» (собственные поступки), то есть сатана действовал через их слабость. Но это значит, что формулировка ⟦нет власти⟧ нуждается в оговорке.", "c": null, "x": [], "t": "Есть ли у сатаны власть над верующими", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. «У сатаны нет власти над верующими», но верующие споткнулись. Объясняется 3:155."}], "summary": ["Самые сильные: 4:78-79, 2:256 и 9:5, 41:9-12 и 79:27-30, 3:7, 51:56 и 11:119.", "Слабые: три слова для змеи (лексика), «дни» Бога.", "Арифметика наследства (4:11) — проверяемый расчёт."]}, {"id": "abrogation", "title": "Отмена аятов (насх)", "icon": "↺", "group": "Пророк, Коран и текст", "intro": "Коран сам говорит, что Бог заменяет одни аяты другими (2:106, 16:101, 13:39, 87:6-7). Ниже — пары аятов, где предписания меняются: часть этих изменений происходит внутри соседних аятов. Вопрос критиков — почему Всеведущий меняет собственные слова и как это согласуется с 6:115 «нет изменяющего слова Его».", "verses": [{"n": "Что сказано: «Всякий раз, когда мы отменяем стих или заставляем его забыть, мы приводим лучший, чем он, или похожий на него».\nВ чём проблема: Бог признаёт, что заменяет аяты. Вопрос: почему всеведущий сначала приказывает одно, а потом другое, и как это согласуется с 6:115 (⟦нет изменителя словам Его⟧). ⟦Заставляет забыть⟧ — Бог заставляет Пророка забыть часть откровения.\nКак отвечают верующие: изменения связаны с развитием общины.", "c": null, "x": ["6:115", "87:6-7"], "refs": ["2:106"], "parts": [{"ref": "2:106", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "۞ مَا نَنسَخْ مِنْ ءَايَةٍ أَوْ نُنسِهَا نَأْتِ بِخَيْرٍۢ مِّنْهَآ أَوْ مِثْلِهَآ ۗ أَلَمْ تَعْلَمْ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ ﴿106﴾", "ru": "Всякий раз, когда мы отменяем стих или заставляем его забыть, мы приводим лучший, чем он, или похожий на него. Разве ты не знаешь, что Аллах над любой вещью мощен?"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Бог признаёт замену аятов, а 6:115 говорит, что слова не меняются. Расхождение внутри доктрины об отмене."}, {"n": "Что сказано: «А когда Мы заменяем одно знамение другим, — ведь Аллах лучше знает, что Он ниспосылает, — они говорят: Ты — только измыслитель!»\nВ чём проблема: Коран признаёт, что современники обвиняли его в изменчивости: если слова Бога меняются, это похоже на выдумку. Ответ дан лишь «Аллах лучше знает».", "c": null, "x": ["2:106"], "refs": ["16:101"], "parts": [{"ref": "16:101", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَإِذَا بَدَّلْنَآ ءَايَةًۭ مَّكَانَ ءَايَةٍۢ ۙ وَٱللَّهُ أَعْلَمُ بِمَا يُنَزِّلُ قَالُوٓا۟ إِنَّمَآ أَنتَ مُفْتَرٍۭ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ ﴿101﴾", "ru": "А когда Мы заменяем одно знамение другим, - ведь Аллах лучше знает, что Он ниспосылает, - они говорят: \"Ты - только измыслитель!\" Да, большинство их не знает!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Обвинение в изменчивости; ответ только «Аллах лучше знает»."}, {"refs": ["13:39", "17:86", "87:6-7"], "parts": [{"ref": "13:39", "sura": "Ar-Ra'd", "sura_ar": "سُورَةُ الرَّعۡدِ", "type": "Medinan", "ar": "يَمْحُوا۟ ٱللَّهُ مَا يَشَآءُ وَيُثْبِتُ ۖ وَعِندَهُۥٓ أُمُّ ٱلْكِتَٰبِ ﴿39﴾", "ru": "Стирает Аллах, что желает, и утверждает; у Него - мать книги."}, {"ref": "17:86", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "وَلَئِن شِئْنَا لَنَذْهَبَنَّ بِٱلَّذِىٓ أَوْحَيْنَآ إِلَيْكَ ثُمَّ لَا تَجِدُ لَكَ بِهِۦ عَلَيْنَا وَكِيلًا ﴿86﴾", "ru": "Если бы Мы пожелали, Мы, конечно, унесли бы то, что открыли тебе, а потом ты бы не нашел для себя в этом против Нас покровителя,"}, {"ref": "87:6-7", "sura": "Al-A'laa", "sura_ar": "سُورَةُ الأَعۡلَىٰ", "type": "Meccan", "ar": "سَنُقْرِئُكَ فَلَا تَنسَىٰٓ ﴿6﴾ إِلَّا مَا شَآءَ ٱللَّهُ ۚ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ ﴿7﴾", "ru": "(6) Мы дадим прочесть тебе, и ты не забудешь, (7) если не пожелает чего-нибудь Аллах, - ведь, поистине, Он знает явное и то, что скрыто!"}], "n": "Что сказано: «Стирает Аллах, что желает, и утверждает» (13:39); ⟦Если бы Мы пожелали, Мы унесли бы то, что открыли тебе⟧ (17:86); «Мы дадим прочесть тебе, и ты не забудешь, если не пожелает чего-нибудь Аллах» (87:6-7).\nВ чём проблема: откровение может быть стёрто, унесено или забыто Пророком по воле Бога. Значит, текст не обязательно сохраняется неизменным — что спорит с 15:9 (⟦Мы его охраняем⟧) и 6:115.", "c": null, "x": ["15:9", "6:115"], "t": "Бог стирает, уносит или заставляет забыть", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Стирает, что желает» спорит с 15:9 «Мы его охраняем»."}, {"refs": ["2:180", "4:11"], "parts": [{"ref": "2:180", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "كُتِبَ عَلَيْكُمْ إِذَا حَضَرَ أَحَدَكُمُ ٱلْمَوْتُ إِن تَرَكَ خَيْرًا ٱلْوَصِيَّةُ لِلْوَٰلِدَيْنِ وَٱلْأَقْرَبِينَ بِٱلْمَعْرُوفِ ۖ حَقًّا عَلَى ٱلْمُتَّقِينَ ﴿180﴾", "ru": "Предписано вам, когда предстанет к кому-нибудь из вас смерть, если он оставляет добро, завещание для родителей и близких по обычаю, как обязательство для верующих."}, {"ref": "4:11", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يُوصِيكُمُ ٱللَّهُ فِىٓ أَوْلَٰدِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ ٱلْأُنثَيَيْنِ ۚ فَإِن كُنَّ نِسَآءًۭ فَوْقَ ٱثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ ۖ وَإِن كَانَتْ وَٰحِدَةًۭ فَلَهَا ٱلنِّصْفُ ۚ وَلِأَبَوَيْهِ لِكُلِّ وَٰحِدٍۢ مِّنْهُمَا ٱلسُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُۥ وَلَدٌۭ ۚ فَإِن لَّمْ يَكُن لَّهُۥ وَلَدٌۭ وَوَرِثَهُۥٓ أَبَوَاهُ فَلِأُمِّهِ ٱلثُّلُثُ ۚ فَإِن كَانَ لَهُۥٓ إِخْوَةٌۭ فَلِأُمِّهِ ٱلسُّدُسُ ۚ مِنۢ بَعْدِ وَصِيَّةٍۢ يُوصِى بِهَآ أَوْ دَيْنٍ ۗ ءَابَآؤُكُمْ وَأَبْنَآؤُكُمْ لَا تَدْرُونَ أَيُّهُمْ أَقْرَبُ لَكُمْ نَفْعًۭا ۚ فَرِيضَةًۭ مِّنَ ٱللَّهِ ۗ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا ﴿11﴾", "ru": "Завещает вам Аллах относительно ваших детей: сыну - долю, подобную доле двух дочерей. А если они (дети)- женщины, числом больше двух, то им - две трети того, что он оставил, а если одна, то ей - половина. А родителям его, каждому из двух - одна шестая того, что он оставил, если у него есть ребенок. А если у него нет ребенка и ему наследуют его родители, то матери - одна треть. А если есть у него братья, то матери - одна шестая после завещанного, которой он завещает, или долга. Родители ваши или ваши сыновья - вы не знаете, кто из них ближе вам по пользе, как установлено Аллахом. Поистине, Аллах знающ, мудр!"}], "n": "Что сказано: ⟦Предписано вам, когда предстанет к кому-нибудь из вас смерть, завещание для родителей и близких⟧ (2:180); потом доли родителей и детей установлены Богом (4:11).\nВ чём проблема: если доли фиксированы, свободное завещание теряет смысл; традиция считает 2:180 отменённым 4:11-12. В обоих случаях Бог ⟦изменил⟧ предписание.", "c": null, "x": ["4:12"], "t": "Завещание или доли наследства", "at": "зависит от перевода или толкования", "pw": "средний", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. Отмена завещания долями наследства — вывод традиции, текст отмену не называет."}, {"refs": ["2:234", "2:240"], "parts": [{"ref": "2:234", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱلَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجًۭا يَتَرَبَّصْنَ بِأَنفُسِهِنَّ أَرْبَعَةَ أَشْهُرٍۢ وَعَشْرًۭا ۖ فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَلَا جُنَاحَ عَلَيْكُمْ فِيمَا فَعَلْنَ فِىٓ أَنفُسِهِنَّ بِٱلْمَعْرُوفِ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌۭ ﴿234﴾", "ru": "А те из вас, что упокоятся и оставят жен, - они выжидают сами с собой четыре месяца и десять. А когда они достигнут своего предела, то нет греха над вами в том, что они будут делать сами с собой согласно обычаю. Поистине, Аллах - сведущ в том, что вы делаете!"}, {"ref": "2:240", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱلَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجًۭا وَصِيَّةًۭ لِّأَزْوَٰجِهِم مَّتَٰعًا إِلَى ٱلْحَوْلِ غَيْرَ إِخْرَاجٍۢ ۚ فَإِنْ خَرَجْنَ فَلَا جُنَاحَ عَلَيْكُمْ فِى مَا فَعَلْنَ فِىٓ أَنفُسِهِنَّ مِن مَّعْرُوفٍۢ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌۭ ﴿240﴾", "ru": "А те из вас, которые упокоятся и оставят жен, то завещание для их жен - пользование до года без понуждения уйти. А если они выйдут, то нет греха на вас в том, что они сделают сами с собой согласно принятому. Поистине, Аллах - великий, мудрый!"}], "n": "Что сказано: Вдовы ждут ⟦четыре месяца и десять дней⟧ (2:234); «завещание для их жён — пользование до года без понуждения уйти» (2:240).\nВ чём проблема: два разных срока в одной суре. Традиция считает, что 2:240 отменён 2:234, хотя по тексту 2:240 идёт позже: порядок аятов в Коране не совпадает с порядком откровения; аят, стоящий позже, отменён тем, что стоит раньше.", "c": null, "x": [], "t": "Срок вдовы: четыре месяца или год", "at": "зависит от перевода или толкования", "pw": "средний", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. Порядок аятов не совпадает с порядком откровения; отмена — вывод традиции."}, {"refs": ["16:67", "2:219", "4:43", "5:90-91"], "parts": [{"ref": "16:67", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَمِن ثَمَرَٰتِ ٱلنَّخِيلِ وَٱلْأَعْنَٰبِ تَتَّخِذُونَ مِنْهُ سَكَرًۭا وَرِزْقًا حَسَنًا ۗ إِنَّ فِى ذَٰلِكَ لَءَايَةًۭ لِّقَوْمٍۢ يَعْقِلُونَ ﴿67﴾", "ru": "И из плодов пальм и лоз вы берете себе напиток пьянящий и хороший удел. Поистине, в этом - знамение для людей разумных!"}, {"ref": "2:219", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "۞ يَسْـَٔلُونَكَ عَنِ ٱلْخَمْرِ وَٱلْمَيْسِرِ ۖ قُلْ فِيهِمَآ إِثْمٌۭ كَبِيرٌۭ وَمَنَٰفِعُ لِلنَّاسِ وَإِثْمُهُمَآ أَكْبَرُ مِن نَّفْعِهِمَا ۗ وَيَسْـَٔلُونَكَ مَاذَا يُنفِقُونَ قُلِ ٱلْعَفْوَ ۗ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمُ ٱلْءَايَٰتِ لَعَلَّكُمْ تَتَفَكَّرُونَ ﴿219﴾", "ru": "Они спрашивают тебя о вине и майсире. Скажи: \"В них обоих - великий грех и некая польза для людей, но грех их - больше пользы\". И спрашивают они тебя: что им расходовать? Скажи: \"Остаток\". Так разъясняет Аллах вам знамения, - может быть, вы подумаете"}, {"ref": "4:43", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَقْرَبُوا۟ ٱلصَّلَوٰةَ وَأَنتُمْ سُكَٰرَىٰ حَتَّىٰ تَعْلَمُوا۟ مَا تَقُولُونَ وَلَا جُنُبًا إِلَّا عَابِرِى سَبِيلٍ حَتَّىٰ تَغْتَسِلُوا۟ ۚ وَإِن كُنتُم مَّرْضَىٰٓ أَوْ عَلَىٰ سَفَرٍ أَوْ جَآءَ أَحَدٌۭ مِّنكُم مِّنَ ٱلْغَآئِطِ أَوْ لَٰمَسْتُمُ ٱلنِّسَآءَ فَلَمْ تَجِدُوا۟ مَآءًۭ فَتَيَمَّمُوا۟ صَعِيدًۭا طَيِّبًۭا فَٱمْسَحُوا۟ بِوُجُوهِكُمْ وَأَيْدِيكُمْ ۗ إِنَّ ٱللَّهَ كَانَ عَفُوًّا غَفُورًا ﴿43﴾", "ru": "О вы, которые уверовали! Не приближайтесь к молитве, когда вы пьяны, пока не будете понимать, что вы говорите, или оскверненными - кроме как будучи путешественниками в дороге - пока не омоетесь. А если вы больны или в путешествии, или кто-нибудь из вас пришел из нужника, или вы прикасались к женщинам и не нашли воды, то омывайтесь чистым песком и обтирайте ваши лица и руки. Поистине, Аллах извиняющий, прощающий!"}, {"ref": "5:90-91", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِنَّمَا ٱلْخَمْرُ وَٱلْمَيْسِرُ وَٱلْأَنصَابُ وَٱلْأَزْلَٰمُ رِجْسٌۭ مِّنْ عَمَلِ ٱلشَّيْطَٰنِ فَٱجْتَنِبُوهُ لَعَلَّكُمْ تُفْلِحُونَ ﴿90﴾ إِنَّمَا يُرِيدُ ٱلشَّيْطَٰنُ أَن يُوقِعَ بَيْنَكُمُ ٱلْعَدَٰوَةَ وَٱلْبَغْضَآءَ فِى ٱلْخَمْرِ وَٱلْمَيْسِرِ وَيَصُدَّكُمْ عَن ذِكْرِ ٱللَّهِ وَعَنِ ٱلصَّلَوٰةِ ۖ فَهَلْ أَنتُم مُّنتَهُونَ ﴿91﴾", "ru": "(90) О вы, которые уверовали! Вино, майсир, жертвенники, стрелы - мерзость из деяния сатаны. Сторонитесь же этого, - может быть, вы окажетесь счастливыми! (91) Сатана желает заронить среди вас вражду и ненависть вином и майсиром и отклонить вас от поминания Аллаха и молитвы. Удержитесь ли вы?"}], "n": "Что сказано: ⟦Из плодов пальм и лоз вы берёте напиток пьянящий и хороший удел⟧ (16:67); ⟦в них (вине и майсире) — великий грех и некая польза для людей, но грех их — больше пользы⟧ (2:219); «не приближайтесь к молитве, когда вы пьяны» (4:43); «вино, майсир, жертвенники, стрелы — мерзость из деяния сатаны. Сторонитесь же этого» (5:90).\nВ чём проблема: четыре аята дают четыре разных отношения к вину: нейтральное (16:67), ⟦грех и польза⟧ (2:219), запрет на время молитвы (4:43), полный запрет (5:90-91). Бог сначала разрешает то, что потом называет ⟦мерзостью из деяния сатаны⟧. Верующие: мудрая постепенность; критики: ранее разрешена ⟦скверна⟧.", "c": null, "x": ["47:15"], "t": "Постепенный запрет вина", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Постепенный запрет вина: норма менялась."}, {"refs": ["8:61", "47:35"], "parts": [{"ref": "8:61", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "۞ وَإِن جَنَحُوا۟ لِلسَّلْمِ فَٱجْنَحْ لَهَا وَتَوَكَّلْ عَلَى ٱللَّهِ ۚ إِنَّهُۥ هُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ ﴿61﴾", "ru": "А если они склонятся к миру, то склонись и ты к нему и полагайся на Аллаха: ведь Он - слышащий, знающий!"}, {"ref": "47:35", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "فَلَا تَهِنُوا۟ وَتَدْعُوٓا۟ إِلَى ٱلسَّلْمِ وَأَنتُمُ ٱلْأَعْلَوْنَ وَٱللَّهُ مَعَكُمْ وَلَن يَتِرَكُمْ أَعْمَٰلَكُمْ ﴿35﴾", "ru": "Не слабейте и не призывайте к миру, раз вы выше; Аллах - с вами, и не ослабит Он ваших деяний."}], "n": "Что сказано: ⟦Если они склонятся к миру, склонись и ты к нему⟧ (8:61); «Не слабейте и не призывайте к миру, раз вы выше» (47:35).\nВ чём проблема: прямо противоположные указания о мире. Классические комментаторы считали, что 47:35 (или 9:5) отменяют 8:61; другие — что 8:61 относится к слабому положению мусульман, а 47:35 — к сильному (тогда правило зависит от силы, а не от принципа).", "c": null, "x": ["9:5"], "t": "Мир или война", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Приказ о мире против 47:35. Решение зависит от толкования."}, {"refs": ["58:12", "58:13"], "parts": [{"ref": "58:12", "sura": "Al-Mujaadila", "sura_ar": "سُورَةُ المُجَادلَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا نَٰجَيْتُمُ ٱلرَّسُولَ فَقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَةًۭ ۚ ذَٰلِكَ خَيْرٌۭ لَّكُمْ وَأَطْهَرُ ۚ فَإِن لَّمْ تَجِدُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌ ﴿12﴾", "ru": "О вы, которые уверовали! Когда беседуете втайне с посланником, то выдвиньте перед вашей беседой милостыню. Это лучше для вас и чище. А если не найдете... то Аллах - прощающий, милосердный!"}, {"ref": "58:13", "sura": "Al-Mujaadila", "sura_ar": "سُورَةُ المُجَادلَةِ", "type": "Medinan", "ar": "ءَأَشْفَقْتُمْ أَن تُقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَٰتٍۢ ۚ فَإِذْ لَمْ تَفْعَلُوا۟ وَتَابَ ٱللَّهُ عَلَيْكُمْ فَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ ۚ وَٱللَّهُ خَبِيرٌۢ بِمَا تَعْمَلُونَ ﴿13﴾", "ru": "Разве вы боитесь до вашей беседы выдвинуть милостыни? Если же вы этого не сделали и Аллах обратился к вам, то выстаивайте молитву, и давайте очищение, и повинуйтесь Аллаху и Его посланнику. А Аллах сведущ в том, что вы делаете!"}], "n": "Что сказано: «Когда беседуете втайне с посланником, то выдвиньте перед вашей беседой милостыню» (58:12); ⟦Разве вы боитесь выдвинуть милостыни? Если же вы этого не сделали и Аллах обратился к вам, то выстаивайте молитву⟧ (58:13).\nВ чём проблема: правило введено и отменено в соседних аятах: Бог тут же признаёт, что люди ⟦побоялись⟧, и отменяет. Это наглядный пример ⟦насх⟧: правило не успели исполнить. Заметьте и «Аллах обратился к вам» — Бог меняет решение.", "c": null, "x": ["2:106"], "t": "Милостыня перед беседой с Пророком — и её отмена", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Правило введено и отменено в соседних аятах."}, {"refs": ["73:2-4", "73:20"], "parts": [{"ref": "73:2-4", "sura": "Al-Muzzammil", "sura_ar": "سُورَةُ المُزَّمِّلِ", "type": "Meccan", "ar": "قُمِ ٱلَّيْلَ إِلَّا قَلِيلًۭا ﴿2﴾ نِّصْفَهُۥٓ أَوِ ٱنقُصْ مِنْهُ قَلِيلًا ﴿3﴾ أَوْ زِدْ عَلَيْهِ وَرَتِّلِ ٱلْقُرْءَانَ تَرْتِيلًا ﴿4﴾", "ru": "(2) Простаивай ночь, если не немного, - (3) половину ее, или убавь от этого немного, (4) или прибавь к этому и читай Коран чтением."}, {"ref": "73:20", "sura": "Al-Muzzammil", "sura_ar": "سُورَةُ المُزَّمِّلِ", "type": "Meccan", "ar": "۞ إِنَّ رَبَّكَ يَعْلَمُ أَنَّكَ تَقُومُ أَدْنَىٰ مِن ثُلُثَىِ ٱلَّيْلِ وَنِصْفَهُۥ وَثُلُثَهُۥ وَطَآئِفَةٌۭ مِّنَ ٱلَّذِينَ مَعَكَ ۚ وَٱللَّهُ يُقَدِّرُ ٱلَّيْلَ وَٱلنَّهَارَ ۚ عَلِمَ أَن لَّن تُحْصُوهُ فَتَابَ عَلَيْكُمْ ۖ فَٱقْرَءُوا۟ مَا تَيَسَّرَ مِنَ ٱلْقُرْءَانِ ۚ عَلِمَ أَن سَيَكُونُ مِنكُم مَّرْضَىٰ ۙ وَءَاخَرُونَ يَضْرِبُونَ فِى ٱلْأَرْضِ يَبْتَغُونَ مِن فَضْلِ ٱللَّهِ ۙ وَءَاخَرُونَ يُقَٰتِلُونَ فِى سَبِيلِ ٱللَّهِ ۖ فَٱقْرَءُوا۟ مَا تَيَسَّرَ مِنْهُ ۚ وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَأَقْرِضُوا۟ ٱللَّهَ قَرْضًا حَسَنًۭا ۚ وَمَا تُقَدِّمُوا۟ لِأَنفُسِكُم مِّنْ خَيْرٍۢ تَجِدُوهُ عِندَ ٱللَّهِ هُوَ خَيْرًۭا وَأَعْظَمَ أَجْرًۭا ۚ وَٱسْتَغْفِرُوا۟ ٱللَّهَ ۖ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۢ ﴿20﴾", "ru": "Поистине, Господь твой знает, что ты простаиваешь меньше, чем две трети ночи, и половину ее и треть; и люди из тех, что с тобою. И Аллах размеряет ночь и день. Знает Он, что вы не учтете этого, и обратился Он к вам. Читайте же, что легко вам из Корана. Знает Он, что будут из вас больные и другие, которые ударяют землю, выискивая милости Аллаха, и другие, которые сражаются на пути Аллаха. Читайте же, что легко вам из него, и простаивайте молитву, и приносите очистительную подать, и одолжайте Аллаху хороший заем. Что вы уготоваете вперед из добра для самих себя, найдете это у Аллаха лучшим и большим по награде, и просите прощения у Аллаха. Поистине, Аллах - прощающ, милостив!"}], "n": "Что сказано: «Простаивай ночь, если не немного: половину её, или убавь от этого немного, или прибавь» (73:2-4); ⟦Господь твой знает, что ты простаиваешь меньше двух третей ночи… читайте, что вам легко⟧ (73:20).\nВ чём проблема: в одной суре норма названа, потом снижена: Бог «знает», что людям трудно. Но Он знал это и раньше (всеведение). Это тот же приём, что в 8:65-66.", "c": null, "x": ["8:65-66"], "t": "Ночная молитва — норма снижена", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Норма снижена; Бог «знает», что людям трудно."}], "summary": ["Бог признаёт замену аятов (2:106), а 6:115 говорит, что слова не меняются.", "Что именно отменено — вывод традиции, текст его не называет."]}, {"id": "history", "title": "Библейская и историческая путаница", "icon": "📜", "group": "Пророк, Коран и текст", "intro": "Места, где Коран называет персонажей, места и события так, что они плохо согласуются с известной историей или с книгами, которые он «подтверждает» (Тора, Евангелие). Мусульманские апологеты обычно отвечают, что речь идёт об однофамильцах или образных выражениях.", "verses": [{"refs": ["19:28", "66:12", "3:35-36"], "parts": [{"ref": "19:28", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "يَٰٓأُخْتَ هَٰرُونَ مَا كَانَ أَبُوكِ ٱمْرَأَ سَوْءٍۢ وَمَا كَانَتْ أُمُّكِ بَغِيًّۭا ﴿28﴾", "ru": "О сестра Харуна, не был отец твой дурным человеком, и мать твоя не была распутницей\"."}, {"ref": "66:12", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "وَمَرْيَمَ ٱبْنَتَ عِمْرَٰنَ ٱلَّتِىٓ أَحْصَنَتْ فَرْجَهَا فَنَفَخْنَا فِيهِ مِن رُّوحِنَا وَصَدَّقَتْ بِكَلِمَٰتِ رَبِّهَا وَكُتُبِهِۦ وَكَانَتْ مِنَ ٱلْقَٰنِتِينَ ﴿12﴾", "ru": "...И Марйам, дочь Имрана, которая сберегла свои члены, и Мы вдунули в нее от Нашего духа. И она сочла истиной слова ее Господа и Его писания и была из числа благочестивых."}, {"ref": "3:35-36", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "إِذْ قَالَتِ ٱمْرَأَتُ عِمْرَٰنَ رَبِّ إِنِّى نَذَرْتُ لَكَ مَا فِى بَطْنِى مُحَرَّرًۭا فَتَقَبَّلْ مِنِّىٓ ۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ ﴿35﴾ فَلَمَّا وَضَعَتْهَا قَالَتْ رَبِّ إِنِّى وَضَعْتُهَآ أُنثَىٰ وَٱللَّهُ أَعْلَمُ بِمَا وَضَعَتْ وَلَيْسَ ٱلذَّكَرُ كَٱلْأُنثَىٰ ۖ وَإِنِّى سَمَّيْتُهَا مَرْيَمَ وَإِنِّىٓ أُعِيذُهَا بِكَ وَذُرِّيَّتَهَا مِنَ ٱلشَّيْطَٰنِ ٱلرَّجِيمِ ﴿36﴾", "ru": "(35) Вот сказала жена Имрана: \"Господи! Я обетовала Тебе то, что у меня в утробе, освобожденным (для Тебя). Прими же от меня, - ведь Ты - слышащий, знающий\". (36) И когда она сложила ее, то сказала: \"Господи! Вот, я сложила ее - женского пола\". - А Аллах лучше знал, что она сложила, - ведь мужской пол не то, что женский. - \"И я назвала ее Марйам, и вот - я отдаю Тебе ее и ее потомство под защиту от сатаны, побиваемого камнями\"."}], "n": "Что сказано: Мариам, мать Исы, названа ⟦сестрой Харуна⟧ (19:28), ⟦дочерью Имрана⟧ (66:12), а её мать — ⟦женой Имрана⟧ (3:35).\nВ чём проблема: Харун (Аарон) и Имран (Амрам в Библии) — брат и отец Моисея, жившие на тысячу с лишним лет раньше Марии. В Библии сестра Моисея и Аарона — Мириам (Мариам). Коран либо смешивает двух женщин с одним именем, либо использует ⟦сестра/дочь⟧ в переносном смысле.\nКак отвечают верующие: Харун — другой человек, или «сестра» — ⟦потомок⟧.", "c": null, "x": [], "t": "Мариам: «сестра Харуна» и «дочь Имрана»", "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Мария названа «сестрой Харуна» и «дочерью Имрана»; Харун и Имран жили много раньше. Верующие понимают как «из рода Харуна». Критики указывают на смешение."}, {"refs": ["28:38", "28:8", "40:36-37"], "parts": [{"ref": "28:38", "sura": "Al-Qasas", "sura_ar": "سُورَةُ القَصَصِ", "type": "Meccan", "ar": "وَقَالَ فِرْعَوْنُ يَٰٓأَيُّهَا ٱلْمَلَأُ مَا عَلِمْتُ لَكُم مِّنْ إِلَٰهٍ غَيْرِى فَأَوْقِدْ لِى يَٰهَٰمَٰنُ عَلَى ٱلطِّينِ فَٱجْعَل لِّى صَرْحًۭا لَّعَلِّىٓ أَطَّلِعُ إِلَىٰٓ إِلَٰهِ مُوسَىٰ وَإِنِّى لَأَظُنُّهُۥ مِنَ ٱلْكَٰذِبِينَ ﴿38﴾", "ru": "И сказал Фираун: \"О знать, я не знаю для вас другого бога, кроме меня. Разожги мне, Хаман, огонь над глиной и устрой башню: может быть, я поднимусь к богу Мусы. Я ведь думаю, что он - лжец\"."}, {"ref": "28:8", "sura": "Al-Qasas", "sura_ar": "سُورَةُ القَصَصِ", "type": "Meccan", "ar": "فَٱلْتَقَطَهُۥٓ ءَالُ فِرْعَوْنَ لِيَكُونَ لَهُمْ عَدُوًّۭا وَحَزَنًا ۗ إِنَّ فِرْعَوْنَ وَهَٰمَٰنَ وَجُنُودَهُمَا كَانُوا۟ خَٰطِـِٔينَ ﴿8﴾", "ru": "И подобрала его семья Фирауна, чтобы он оказался для них врагом и скорбью. Поистине, Фираун, и Хаман, и их войска были грешниками!"}, {"ref": "40:36-37", "sura": "Ghafir", "sura_ar": "سُورَةُ غَافِرٍ", "type": "Meccan", "ar": "وَقَالَ فِرْعَوْنُ يَٰهَٰمَٰنُ ٱبْنِ لِى صَرْحًۭا لَّعَلِّىٓ أَبْلُغُ ٱلْأَسْبَٰبَ ﴿36﴾ أَسْبَٰبَ ٱلسَّمَٰوَٰتِ فَأَطَّلِعَ إِلَىٰٓ إِلَٰهِ مُوسَىٰ وَإِنِّى لَأَظُنُّهُۥ كَٰذِبًۭا ۚ وَكَذَٰلِكَ زُيِّنَ لِفِرْعَوْنَ سُوٓءُ عَمَلِهِۦ وَصُدَّ عَنِ ٱلسَّبِيلِ ۚ وَمَا كَيْدُ فِرْعَوْنَ إِلَّا فِى تَبَابٍۢ ﴿37﴾", "ru": "(36) И сказал Фираун: \"О Хаман, выстрой мне башню, может быть, я дойду до путей - (37) путей небеса и поднимусь к богу Мусы; я ведь думаю, что он лжец\". Так разукрашено было Фирауну зло его деяния и сведен он с пути; и вся кознь Фирауна только в гибели!"}], "n": "Что сказано: Фараон говорит: «Разожги мне, Хаман, огонь над глиной и устрой башню» (28:38; 40:36-37); ⟦Фираун, Хаман и их войска были грешниками⟧ (28:8).\nВ чём проблема: в Библии Аман (Хаман) — вельможа персидского царя Ахашвероша, книга Есфирь, на много веков позже Моисея. Коран ставит его министром Фараона. Башня, на которую хочет подняться Фараон, перекликается с рассказом о Вавилонской башне.\nКак отвечают верующие: Хаман — египетское имя или титул.", "c": null, "x": [], "t": "Хаман при Фараоне", "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Хаман назван министром Фараона, а в Библии он вельможа персидского царя (книга Есфирь). Критики указывают на анахронизм; верующие видят совпадение имени."}, {"n": "Что сказано: ⟦Мы испытали твой народ после тебя, и их сбил с пути самирит… Так он сделал им тельца⟧.\nВ чём проблема: виновником золотого тельца назван ⟦ас-Самири⟧ (самаритянин). Самаритяне как народ возникли много веков после Моисея.\nКак отвечают верующие: Самири — человек из рода/племени Сомара, имя не обязательно этническое.", "c": "Апологеты: Самири — человек из рода/племени, имя не обязательно этническое.", "x": [], "refs": ["20:85-87"], "parts": [{"ref": "20:85-87", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "قَالَ فَإِنَّا قَدْ فَتَنَّا قَوْمَكَ مِنۢ بَعْدِكَ وَأَضَلَّهُمُ ٱلسَّامِرِىُّ ﴿85﴾ فَرَجَعَ مُوسَىٰٓ إِلَىٰ قَوْمِهِۦ غَضْبَٰنَ أَسِفًۭا ۚ قَالَ يَٰقَوْمِ أَلَمْ يَعِدْكُمْ رَبُّكُمْ وَعْدًا حَسَنًا ۚ أَفَطَالَ عَلَيْكُمُ ٱلْعَهْدُ أَمْ أَرَدتُّمْ أَن يَحِلَّ عَلَيْكُمْ غَضَبٌۭ مِّن رَّبِّكُمْ فَأَخْلَفْتُم مَّوْعِدِى ﴿86﴾ قَالُوا۟ مَآ أَخْلَفْنَا مَوْعِدَكَ بِمَلْكِنَا وَلَٰكِنَّا حُمِّلْنَآ أَوْزَارًۭا مِّن زِينَةِ ٱلْقَوْمِ فَقَذَفْنَٰهَا فَكَذَٰلِكَ أَلْقَى ٱلسَّامِرِىُّ ﴿87﴾", "ru": "(85) Сказал Он: \"Мы испытали твой народ после тебя, и их сбил с пути самирит\". (86) И вернулся Муса к своему народу гневным, печальным. Он сказал: \"О народ мой! Разве не обещал вам Господь ваш прекрасного обещания; разве долгим для вас показался завет, или вы пожелали, чтобы вас постиг гнев от вашего Господа, и вы нарушили обещание мне?\" (87) Они сказали: \"Не нарушили мы обещания тебе своей властью; нам было приказано принести ноши из украшений народа, и мы из ввергли; также вверг и самирит\";"}], "t": null, "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. «Самири» связывают с самаритянами, которые возникли позже."}, {"n": "Что сказано: ⟦Иудеи сказали: Узайр — сын Аллаха. И христиане сказали: Мессия — сын Аллаха⟧.\nВ чём проблема: нет свидетельств иудейской секты с таким учением; о христианах — упрощение учения о Сыне Божьем. См. 5:17, 5:116.", "c": "Апологеты указывают на отдельные группы в Аравии; доказательств нет.", "x": ["5:116", "5:17"], "refs": ["9:30"], "parts": [{"ref": "9:30", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "وَقَالَتِ ٱلْيَهُودُ عُزَيْرٌ ٱبْنُ ٱللَّهِ وَقَالَتِ ٱلنَّصَٰرَى ٱلْمَسِيحُ ٱبْنُ ٱللَّهِ ۖ ذَٰلِكَ قَوْلُهُم بِأَفْوَٰهِهِمْ ۖ يُضَٰهِـُٔونَ قَوْلَ ٱلَّذِينَ كَفَرُوا۟ مِن قَبْلُ ۚ قَٰتَلَهُمُ ٱللَّهُ ۚ أَنَّىٰ يُؤْفَكُونَ ﴿30﴾", "ru": "И сказали иудеи: \"Узайр - сын Аллаха\". И сказали христиане: \"Мессия - сын Аллаха\". Эти слова в их устах похожи на слова тех, которые не веровали раньше. Пусть поразит их Аллах! До чего они отвращены!"}], "t": null, "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Нет известной иудейской группы с таким учением. Критики указывают; верующие говорят о частных группах."}, {"n": "Что сказано: «И вот сказал Аллах: О Иса, сын Марйам! Разве ты сказал людям: Примите меня и мою мать двумя богами кроме Аллаха?»\nВ чём проблема: Троица описана как Бог, Иисус и Мария. В христианском учении Троица — Отец, Сын и Святой Дух; Мария — не член Троицы. Это либо неточность, либо описание конкретной (маргинальной) группы.", "c": "В христианском учении Троица — Отец, Сын и Святой Дух.", "x": ["5:73", "4:171"], "refs": ["5:116"], "parts": [{"ref": "5:116", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ ٱللَّهُ يَٰعِيسَى ٱبْنَ مَرْيَمَ ءَأَنتَ قُلْتَ لِلنَّاسِ ٱتَّخِذُونِى وَأُمِّىَ إِلَٰهَيْنِ مِن دُونِ ٱللَّهِ ۖ قَالَ سُبْحَٰنَكَ مَا يَكُونُ لِىٓ أَنْ أَقُولَ مَا لَيْسَ لِى بِحَقٍّ ۚ إِن كُنتُ قُلْتُهُۥ فَقَدْ عَلِمْتَهُۥ ۚ تَعْلَمُ مَا فِى نَفْسِى وَلَآ أَعْلَمُ مَا فِى نَفْسِكَ ۚ إِنَّكَ أَنتَ عَلَّٰمُ ٱلْغُيُوبِ ﴿116﴾", "ru": "И вот сказал Аллах: \"О Иса, сын Марйам! Разве ты сказал людям: \"Примите меня и мою мать двумя богами кроме Аллаха?\" Он сказал: \"Хвала Тебе! Как можно мне говорить, что мне не по праву? Если я говорил, Ты это знаешь. Ты знаешь то. что у меня в душе, а я не знаю того, что у Тебя в душе: ведь Ты - ведающий скрытое."}], "t": null, "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Троица описана как Бог, Иисус и Мария. Критики указывают на неточность."}, {"n": "Что сказано: ⟦Ибрахим не был ни иудеем, ни христианином, а был он ханифом предавшимся (в других переводах — мусульманином) и не был из многобожников⟧.\nВ чём проблема: слово ⟦ислам⟧ применено к эпохе до иудаизма, христианства и ислама; в 22:78 Бог ⟦назвал вас мусульманами раньше⟧. Если ⟦мусульман⟧ было достаточно уже с Авраама, зачем 3:85 (⟦ислам — единственная принимаемая религия⟧)? См. раздел ⟦Кто такой мусульманин⟧.", "c": null, "x": ["22:78", "3:85"], "refs": ["3:67"], "parts": [{"ref": "3:67", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "مَا كَانَ إِبْرَٰهِيمُ يَهُودِيًّۭا وَلَا نَصْرَانِيًّۭا وَلَٰكِن كَانَ حَنِيفًۭا مُّسْلِمًۭا وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ ﴿67﴾", "ru": "Ибрахим не был ни иудеем, ни христианином, а был он ханифом предавшимся и не был из многобожников."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Ислам» применён к эпохе до Мухаммада; но слово шире (3:19)."}, {"n": "Что сказано: «Вот сказал Ибрахим отцу своему Азару: Неужели ты идолов превращаешь в богов?»\nВ чём проблема: в Библии отца Авраама зовут Терах (Тарах). Коран называет его «Азар». Объяснения разные (другое имя, прозвище, дядя), но расхождение налицо.", "c": null, "x": [], "refs": ["6:74"], "parts": [{"ref": "6:74", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "۞ وَإِذْ قَالَ إِبْرَٰهِيمُ لِأَبِيهِ ءَازَرَ أَتَتَّخِذُ أَصْنَامًا ءَالِهَةً ۖ إِنِّىٓ أَرَىٰكَ وَقَوْمَكَ فِى ضَلَٰلٍۢ مُّبِينٍۢ ﴿74﴾", "ru": "Вот сказал Ибрахим отцу своему Азару: \"Неужели ты идолов превращаешь в богов? Я вижу, что ты и твой народ - в явном заблуждении\"."}], "t": null, "at": "расходится с историей или Библией", "pw": "слабый", "cl": "Вывод: возможное расхождение с историческими данными, подтверждений недостаточно. «Азар» вместо Тераха; верующие предлагают объяснения."}, {"refs": ["2:127", "14:37", "3:96"], "parts": [{"ref": "2:127", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ يَرْفَعُ إِبْرَٰهِۦمُ ٱلْقَوَاعِدَ مِنَ ٱلْبَيْتِ وَإِسْمَٰعِيلُ رَبَّنَا تَقَبَّلْ مِنَّآ ۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ ﴿127﴾", "ru": "И вот, Ибрахим воздвигает основы дома, и Исмаил: \"Господи наш! Прими от нас, ведь Ты, поистине - слышащий, знающий!"}, {"ref": "14:37", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "رَّبَّنَآ إِنِّىٓ أَسْكَنتُ مِن ذُرِّيَّتِى بِوَادٍ غَيْرِ ذِى زَرْعٍ عِندَ بَيْتِكَ ٱلْمُحَرَّمِ رَبَّنَا لِيُقِيمُوا۟ ٱلصَّلَوٰةَ فَٱجْعَلْ أَفْـِٔدَةًۭ مِّنَ ٱلنَّاسِ تَهْوِىٓ إِلَيْهِمْ وَٱرْزُقْهُم مِّنَ ٱلثَّمَرَٰتِ لَعَلَّهُمْ يَشْكُرُونَ ﴿37﴾", "ru": "Господи, я поселил из моего потомства в долине, не имеющей злаков, у Твоего дома священного. Господи наш! Пусть они выстаивают молитву, и сделай сердца людей склоняющимися к ним и отдели их плодами, - может быть, они будут благодарны!"}, {"ref": "3:96", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "إِنَّ أَوَّلَ بَيْتٍۢ وُضِعَ لِلنَّاسِ لَلَّذِى بِبَكَّةَ مُبَارَكًۭا وَهُدًۭى لِّلْعَٰلَمِينَ ﴿96﴾", "ru": "Поистине, первый дом, который установлен для людей, - тот, который в Бекке, - и в руководство для миров!"}], "n": "Что сказано: Ибрахим и Исмаил ⟦воздвигают основы дома⟧ (2:127); «Я поселил из моего потомства в долине, не имеющей злаков, у Твоего дома священного» (14:37); «первый дом, который установлен для людей, — тот, который в Бекке» (3:96).\nВ чём проблема: в Библии Агарь и Измаил поселяются в пустыне Фаран (Быт 21:21), а не в Мекке; об основании Каабы Авраамом в Библии не сказано. Внешних подтверждений нет; в самом Коране нет подробностей и даты.", "c": null, "x": [], "t": "Авраам в Мекке", "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Основание Каабы Авраамом в Библии не упомянуто, внешних подтверждений нет. Формулировать осторожно."}, {"n": "Что сказано: ⟦Они последовали за тем, что читали шайтаны в царстве Сулаймана. Сулайман не был неверным, но шайтаны были неверными, обучая людей колдовству и тому, что было ниспослано двум ангелам в Вавилоне — Харуту и Маруту⟧.\nВ чём проблема: два ангела учат людей колдовству, чтобы разлучать мужа с женой, — этого нет в Библии. Критики сопоставляют с преданием о падших ангелах; а 66:6 говорит, что ангелы не ослушиваются.", "c": null, "x": ["66:6"], "refs": ["2:102"], "parts": [{"ref": "2:102", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱتَّبَعُوا۟ مَا تَتْلُوا۟ ٱلشَّيَٰطِينُ عَلَىٰ مُلْكِ سُلَيْمَٰنَ ۖ وَمَا كَفَرَ سُلَيْمَٰنُ وَلَٰكِنَّ ٱلشَّيَٰطِينَ كَفَرُوا۟ يُعَلِّمُونَ ٱلنَّاسَ ٱلسِّحْرَ وَمَآ أُنزِلَ عَلَى ٱلْمَلَكَيْنِ بِبَابِلَ هَٰرُوتَ وَمَٰرُوتَ ۚ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّىٰ يَقُولَآ إِنَّمَا نَحْنُ فِتْنَةٌۭ فَلَا تَكْفُرْ ۖ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِۦ بَيْنَ ٱلْمَرْءِ وَزَوْجِهِۦ ۚ وَمَا هُم بِضَآرِّينَ بِهِۦ مِنْ أَحَدٍ إِلَّا بِإِذْنِ ٱللَّهِ ۚ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ ۚ وَلَقَدْ عَلِمُوا۟ لَمَنِ ٱشْتَرَىٰهُ مَا لَهُۥ فِى ٱلْءَاخِرَةِ مِنْ خَلَٰقٍۢ ۚ وَلَبِئْسَ مَا شَرَوْا۟ بِهِۦٓ أَنفُسَهُمْ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ ﴿102﴾", "ru": "и они последовали за тем, что читали шайтаны, в царство Сулаймана. Сулайман не был неверным, но шайтаны были неверными, обучая людей колдовству и тому, что было ниспослано обоим ангелам в Вавилоне, Харуту и Маруту. Но они оба не обучали никого, пока не говорили: \"Мы - искушение, не будь же неверным!\" И те научались от них, чем разлучать мужа от жены, - но они не вредили этим никому иначе, как с дозволения Аллаха. И обучались они тому, что им вредило и не приносило пользы, и они знали, что тот, кто приобретал это, - нет ему доли в будущей жизни. Плохо то, что они покупали за свои души, - если бы они это знали!"}], "t": null, "at": "расходится с историей или Библией", "pw": "слабый", "cl": "Вывод: возможное расхождение с историческими данными, подтверждений недостаточно. Два ангела учат колдовству; в Библии такого нет."}, {"n": "Что сказано: «Мы взяли договор с вас и воздвигли над вами гору: Возьмите то, что Мы даровали вам, с силой» (так же 2:93; 7:171: ⟦вытянули Мы гору над ними, точно она туча, и думали они, что она падёт на них⟧).\nВ чём проблема: завет принят под угрозой, что гора упадёт: это принуждение к вере. В Библии такого эпизода нет (народ у подножия горы Синай, Исх 19). Спорит с 2:256 ⟦нет принуждения в религии⟧.", "c": null, "x": ["7:171", "2:256"], "refs": ["2:63"], "parts": [{"ref": "2:63", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ أَخَذْنَا مِيثَٰقَكُمْ وَرَفَعْنَا فَوْقَكُمُ ٱلطُّورَ خُذُوا۟ مَآ ءَاتَيْنَٰكُم بِقُوَّةٍۢ وَٱذْكُرُوا۟ مَا فِيهِ لَعَلَّكُمْ تَتَّقُونَ ﴿63﴾", "ru": "И вот, Мы взяли договор с вас и воздвигли над вами гору: \"Возьмите то, что Мы даровали вам, с силой и помните то, что там, - может быть, вы будете богобоязненны!\""}], "t": null, "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Гора над головами израильтян; в Библии такого эпизода нет."}, {"refs": ["61:6", "7:157"], "parts": [{"ref": "61:6", "sura": "As-Saff", "sura_ar": "سُورَةُ الصَّفِّ", "type": "Medinan", "ar": "وَإِذْ قَالَ عِيسَى ٱبْنُ مَرْيَمَ يَٰبَنِىٓ إِسْرَٰٓءِيلَ إِنِّى رَسُولُ ٱللَّهِ إِلَيْكُم مُّصَدِّقًۭا لِّمَا بَيْنَ يَدَىَّ مِنَ ٱلتَّوْرَىٰةِ وَمُبَشِّرًۢا بِرَسُولٍۢ يَأْتِى مِنۢ بَعْدِى ٱسْمُهُۥٓ أَحْمَدُ ۖ فَلَمَّا جَآءَهُم بِٱلْبَيِّنَٰتِ قَالُوا۟ هَٰذَا سِحْرٌۭ مُّبِينٌۭ ﴿6﴾", "ru": "И вот сказал Иса, сын Марйам: \"О сыны Исраила! Я - посланник Аллаха к вам, подтверждающий истинность того, что ниспослано до меня в Торе, и благовествующий о посланнике, который придет после меня, имя которому будет Ахмад\". Когда же он пришел с ясными знамениями, то они сказали: \"Это - явное колдовство!\""}, {"ref": "7:157", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "ٱلَّذِينَ يَتَّبِعُونَ ٱلرَّسُولَ ٱلنَّبِىَّ ٱلْأُمِّىَّ ٱلَّذِى يَجِدُونَهُۥ مَكْتُوبًا عِندَهُمْ فِى ٱلتَّوْرَىٰةِ وَٱلْإِنجِيلِ يَأْمُرُهُم بِٱلْمَعْرُوفِ وَيَنْهَىٰهُمْ عَنِ ٱلْمُنكَرِ وَيُحِلُّ لَهُمُ ٱلطَّيِّبَٰتِ وَيُحَرِّمُ عَلَيْهِمُ ٱلْخَبَٰٓئِثَ وَيَضَعُ عَنْهُمْ إِصْرَهُمْ وَٱلْأَغْلَٰلَ ٱلَّتِى كَانَتْ عَلَيْهِمْ ۚ فَٱلَّذِينَ ءَامَنُوا۟ بِهِۦ وَعَزَّرُوهُ وَنَصَرُوهُ وَٱتَّبَعُوا۟ ٱلنُّورَ ٱلَّذِىٓ أُنزِلَ مَعَهُۥٓ ۙ أُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ ﴿157﴾", "ru": "которые следуют за посланником, пророком, простецом, которого они находят записанным у них в Торе и Евангелии, который побуждает их к доброму и удерживает от неодобряемого, разрешает им блага и запрещает им мерзости, снимает с них бремя и оковы, которые были на них, - вот те, которые уверовали в него, и поддерживали его, и помогали ему, и последовали за светом, который ниспослан с ним, это - те, которые имеют успех!\""}], "n": "Что сказано: Иса говорит: ⟦Я — посланник Аллаха к вам, подтверждающий то, что было до меня из Торы, и благовествующий о посланнике, который придёт после меня, имя которого — Ахмад⟧ (61:6); ⟦те, которые следуют за посланником, неграмотным пророком, которого они находят у себя записанным в Торе и Евангелии⟧ (7:157).\nВ чём проблема: заявлено, что Тора и Евангелие содержат указание на Мухаммада. Проверка: имени «Ахмад» и такого пророчества в известных текстах Торы и Евангелий нет. Мусульмане отвечают, что отрывки изменены (2:79), но тогда возникает противоречие с 5:68 и 10:94, где Коран отсылает к этим книгам как к подлинным.", "c": null, "x": ["2:79", "5:68", "10:94"], "t": "Пророчества о Мухаммаде в прежних писаниях", "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Пророчество об «Ахмаде» в прежних писаниях не находят. Верующие говорят о повреждённых текстах."}], "summary": ["Самые заметные: Хаман (28:38), «сестра Харуна» (19:28), пророчество об Ахмаде (61:6).", "Везде у верующих есть ответ; формулируйте осторожно: «критики указывают».", "Без внешних источников выводы остаются предположением."]}, {"id": "cosmos", "title": "Космос и Земля", "icon": "☄", "group": "Природа, наука и сверхъестественное", "intro": "Утверждения о небе, Земле, Солнце, Луне и звёздах, которые не соответствуют современным данным или близки к картине мира VII века. Апологеты читают их как метафоры; критики — как буквальные утверждения.", "verses": [{"refs": ["18:86", "18:90"], "parts": [{"ref": "18:86", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَا بَلَغَ مَغْرِبَ ٱلشَّمْسِ وَجَدَهَا تَغْرُبُ فِى عَيْنٍ حَمِئَةٍۢ وَوَجَدَ عِندَهَا قَوْمًۭا ۗ قُلْنَا يَٰذَا ٱلْقَرْنَيْنِ إِمَّآ أَن تُعَذِّبَ وَإِمَّآ أَن تَتَّخِذَ فِيهِمْ حُسْنًۭا ﴿86﴾", "ru": "А когда он дошел до заката солнца, то увидел, что оно закатывается в источник зловонный, и нашел около него людей. Мы сказали: \"О Зу-л-карнайн, либо ты накажешь, либо устроишь для них милость\"."}, {"ref": "18:90", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَا بَلَغَ مَطْلِعَ ٱلشَّمْسِ وَجَدَهَا تَطْلُعُ عَلَىٰ قَوْمٍۢ لَّمْ نَجْعَل لَّهُم مِّن دُونِهَا سِتْرًۭا ﴿90﴾", "ru": "А когда дошел он до восхода солнца, то нашел, что оно восходит над людьми, для которых Мы не сделали от него никакой завесы."}], "n": "Что сказано: Зу-л-Карнайн ⟦дошёл до заката солнца и увидел, что оно закатывается в источник зловонный⟧ (в других переводах — ⟦тёмный⟧, ⟦горячий⟧) (18:86); ⟦дошёл до восхода солнца — оно восходит над людьми, для которых Мы не сделали от него покрова⟧ (18:90).\nВ чём проблема: Солнце не «закатывается» в источник и не имеет ⟦места⟧ заката, где можно оказаться. Аят говорит не ⟦ему показалось⟧, а ⟦увидел/нашёл⟧. В 18:93 он доходит ⟦между двумя горами⟧ — край мира. Картина — плоская земля с краями.\nКак отвечают верующие: описание с точки зрения путника; другой перевод: ⟦закатывается в тёмное море⟧.", "c": null, "x": ["18:93-96"], "t": "Место заката и восхода Солнца", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. Солнце «заходит в источник». Критики видят картину плоской земли; верующие говорят, что ему «показалось»."}, {"refs": ["36:38", "36:40", "21:33"], "parts": [{"ref": "36:38", "sura": "Yaseen", "sura_ar": "سُورَةُ يسٓ", "type": "Meccan", "ar": "وَٱلشَّمْسُ تَجْرِى لِمُسْتَقَرٍّۢ لَّهَا ۚ ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ ﴿38﴾", "ru": "И солнце течет к местопребыванию своему. Таково установление Славного, Мудрого!"}, {"ref": "36:40", "sura": "Yaseen", "sura_ar": "سُورَةُ يسٓ", "type": "Meccan", "ar": "لَا ٱلشَّمْسُ يَنۢبَغِى لَهَآ أَن تُدْرِكَ ٱلْقَمَرَ وَلَا ٱلَّيْلُ سَابِقُ ٱلنَّهَارِ ۚ وَكُلٌّۭ فِى فَلَكٍۢ يَسْبَحُونَ ﴿40﴾", "ru": "Солнцу не надлежит догонять месяц, и ночь не опередит день, и каждый плавает по своду."}, {"ref": "21:33", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "وَهُوَ ٱلَّذِى خَلَقَ ٱلَّيْلَ وَٱلنَّهَارَ وَٱلشَّمْسَ وَٱلْقَمَرَ ۖ كُلٌّۭ فِى فَلَكٍۢ يَسْبَحُونَ ﴿33﴾", "ru": "Он - тот, который создал ночь и день, и солнце и месяц. Все по своду плавают."}], "n": "Что сказано: «Солнце течёт к местопребыванию своему» (36:38); «Солнцу не надлежит догонять месяц, и ночь не опередит день; и каждый плавает по своду» (36:40); ⟦Он создал ночь и день, солнце и месяц; все по своду плавают⟧ (21:33).\nВ чём проблема: Солнце и Луна «плавают» по своду как одно семейство тел: это суточное движение по небосводу. Солнце не ⟦течёт к месту пребывания⟧: оно не останавливается. Апологеты: движение Солнца в Галактике; слово ⟦мустакарр⟧ — место или срок. Критики: схема геоцентрическая.", "c": null, "x": [], "t": "Солнце «течёт к месту пребывания»", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. «Течёт к месту пребывания». Спор о значении слова."}, {"refs": ["67:5", "37:6-10", "15:17-18", "72:8-9"], "parts": [{"ref": "67:5", "sura": "Al-Mulk", "sura_ar": "سُورَةُ المُلۡكِ", "type": "Meccan", "ar": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ ﴿5﴾", "ru": "Мы украсили уже небо ближайшее светильниками, и сделали их побиением для дияволов, и уготовали им наказание огня."}, {"ref": "37:6-10", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "إِنَّا زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِزِينَةٍ ٱلْكَوَاكِبِ ﴿6﴾ وَحِفْظًۭا مِّن كُلِّ شَيْطَٰنٍۢ مَّارِدٍۢ ﴿7﴾ لَّا يَسَّمَّعُونَ إِلَى ٱلْمَلَإِ ٱلْأَعْلَىٰ وَيُقْذَفُونَ مِن كُلِّ جَانِبٍۢ ﴿8﴾ دُحُورًۭا ۖ وَلَهُمْ عَذَابٌۭ وَاصِبٌ ﴿9﴾ إِلَّا مَنْ خَطِفَ ٱلْخَطْفَةَ فَأَتْبَعَهُۥ شِهَابٌۭ ثَاقِبٌۭ ﴿10﴾", "ru": "(6) Мы ведь украсили небо ближайшее украшением звезд (7) и для охраны от всякого шайтана мятежного. (8) Они не прислушиваются к верховному совету и поражаются со всех сторон (9) для отогнания, и для них - наказание мучительное. (10) кроме тех, кто урвет схватку, и преследует его поражающий светоч."}, {"ref": "15:17-18", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "وَحَفِظْنَٰهَا مِن كُلِّ شَيْطَٰنٍۢ رَّجِيمٍ ﴿17﴾ إِلَّا مَنِ ٱسْتَرَقَ ٱلسَّمْعَ فَأَتْبَعَهُۥ شِهَابٌۭ مُّبِينٌۭ ﴿18﴾", "ru": "(17) И охранили Мы их от всякого сатаны, побиваемого камнями. (18) А если кто украдкой подслушает, то следует за ним ясный светоч."}, {"ref": "72:8-9", "sura": "Al-Jinn", "sura_ar": "سُورَةُ الجِنِّ", "type": "Meccan", "ar": "وَأَنَّا لَمَسْنَا ٱلسَّمَآءَ فَوَجَدْنَٰهَا مُلِئَتْ حَرَسًۭا شَدِيدًۭا وَشُهُبًۭا ﴿8﴾ وَأَنَّا كُنَّا نَقْعُدُ مِنْهَا مَقَٰعِدَ لِلسَّمْعِ ۖ فَمَن يَسْتَمِعِ ٱلْءَانَ يَجِدْ لَهُۥ شِهَابًۭا رَّصَدًۭا ﴿9﴾", "ru": "(8) И мы коснулись неба и нашли, что оно наполнено стражами могучими и светочами. (9) И мы сидели около него на седалищах, чтобы слушать, но кто прислушивается теперь, тот находит для себя подстерегающий светоч."}], "n": "Что сказано: Звёзды — ⟦светильники⟧ и ⟦побиение для дьяволов⟧ (67:5); небо ⟦охраняется⟧ от мятежных дьяволов, и подслушавшего ⟦настигает пронзающее пламя⟧ (37:6-10); ⟦явный метеор⟧ (15:18); джинны: ⟦Мы находили небо наполненным суровой стражей и метеорами⟧ (72:8).\nВ чём проблема: метеоры — космические частицы, сгорающие в атмосфере; они не связаны с ⟦подслушиванием⟧ дьяволов. ⟦Звёзды⟧ названы снарядами, хотя звёзды — огромные тела за пределами Солнечной системы. Апологеты: образное описание; критики: прямое причинное объяснение метеоров, которого не существует.", "c": null, "x": [], "t": "Метеоры — «снаряды» против подслушивающих джиннов", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. Звёзды как снаряды против подслушивающих. Апологеты читают как образ."}, {"refs": ["71:15-16", "10:5", "25:61", "78:13"], "parts": [{"ref": "71:15-16", "sura": "Nooh", "sura_ar": "سُورَةُ نُوحٍ", "type": "Meccan", "ar": "أَلَمْ تَرَوْا۟ كَيْفَ خَلَقَ ٱللَّهُ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ﴿15﴾ وَجَعَلَ ٱلْقَمَرَ فِيهِنَّ نُورًۭا وَجَعَلَ ٱلشَّمْسَ سِرَاجًۭا ﴿16﴾", "ru": "(15) Разве вы не видите, как сотворил Аллах семь небес рядами? (16) И сделал месяц на них светом, а солнце сделал светильником."}, {"ref": "10:5", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "هُوَ ٱلَّذِى جَعَلَ ٱلشَّمْسَ ضِيَآءًۭ وَٱلْقَمَرَ نُورًۭا وَقَدَّرَهُۥ مَنَازِلَ لِتَعْلَمُوا۟ عَدَدَ ٱلسِّنِينَ وَٱلْحِسَابَ ۚ مَا خَلَقَ ٱللَّهُ ذَٰلِكَ إِلَّا بِٱلْحَقِّ ۚ يُفَصِّلُ ٱلْءَايَٰتِ لِقَوْمٍۢ يَعْلَمُونَ ﴿5﴾", "ru": "Он - тот, который сделал солнце сиянием, а месяц - светом и распределил его по стоянкам, чтобы вы знали число годов и счисление. Аллах сотворил это только по истине, распределяя знамения для людей знающих."}, {"ref": "25:61", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "تَبَارَكَ ٱلَّذِى جَعَلَ فِى ٱلسَّمَآءِ بُرُوجًۭا وَجَعَلَ فِيهَا سِرَٰجًۭا وَقَمَرًۭا مُّنِيرًۭا ﴿61﴾", "ru": "Благословен тот, который устроил в небе созвездия и устроил там светильник и сияющий месяц."}, {"ref": "78:13", "sura": "An-Naba", "sura_ar": "سُورَةُ النَّبَإِ", "type": "Meccan", "ar": "وَجَعَلْنَا سِرَاجًۭا وَهَّاجًۭا ﴿13﴾", "ru": "и сделали пылающий светильник,"}], "n": "Что сказано: ⟦Луна в них — свет, а Солнце — светильник⟧ (71:16); Солнце — «сияние», Луна — «свет» (10:5); «светильник и сияющий месяц» (25:61); Солнце — «пылающий светильник» (78:13); небеса — ⟦ярусами⟧ (71:15).\nВ чём проблема: Луна названа «светом» (нур) наравне с Солнцем; фактически она светит отражённым светом. Апологеты: ⟦нур⟧ не исключает отражённый свет, а Солнце названо иначе (⟦сирадж⟧ — лампа), что различает источники. Критики: в тексте нет слова об отражении; а ⟦небеса ярусами⟧ — картина многослойного неба.", "c": null, "x": [], "t": "Свет Луны и Солнца", "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. Луна названа «светом». Слово не исключает отражённый свет."}, {"n": "Что сказано: ⟦Аллах — тот, кто сотворил семь небес и из земли — подобное им⟧.\nВ чём проблема: «семь небес» (ярусами, 71:15; 67:3) и ⟦из земли — подобное им⟧ понимается как семь земель/слоёв. Ни семи небес как ярусов, ни семи земель нет в космологии: число «семь» условно.\nКак отвечают верующие: «семь» — ⟦много⟧ или слои атмосферы.", "c": null, "x": ["71:15-16"], "refs": ["65:12"], "parts": [{"ref": "65:12", "sura": "At-Talaaq", "sura_ar": "سُورَةُ الطَّلَاقِ", "type": "Medinan", "ar": "ٱللَّهُ ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ وَمِنَ ٱلْأَرْضِ مِثْلَهُنَّ يَتَنَزَّلُ ٱلْأَمْرُ بَيْنَهُنَّ لِتَعْلَمُوٓا۟ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ وَأَنَّ ٱللَّهَ قَدْ أَحَاطَ بِكُلِّ شَىْءٍ عِلْمًۢا ﴿12﴾", "ru": "Аллах - тот, кто сотворил семь небес и из земли столько же. Нисходит повеление между ними, чтобы вы знали, что Аллах над всем мощен и что Аллах все объемлет знанием."}], "t": null, "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. «Семь небес» и земли «подобное им». Апологеты говорят, что число условно."}, {"refs": ["16:15", "31:10", "21:31"], "parts": [{"ref": "16:15", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَأَلْقَىٰ فِى ٱلْأَرْضِ رَوَٰسِىَ أَن تَمِيدَ بِكُمْ وَأَنْهَٰرًۭا وَسُبُلًۭا لَّعَلَّكُمْ تَهْتَدُونَ ﴿15﴾", "ru": "И бросил Он на землю прочно стоящие, чтобы она не колебалась с вами, и реки , и пути, - может быть, вы пойдете по прямой дороге! -"}, {"ref": "31:10", "sura": "Luqman", "sura_ar": "سُورَةُ لُقۡمَانَ", "type": "Meccan", "ar": "خَلَقَ ٱلسَّمَٰوَٰتِ بِغَيْرِ عَمَدٍۢ تَرَوْنَهَا ۖ وَأَلْقَىٰ فِى ٱلْأَرْضِ رَوَٰسِىَ أَن تَمِيدَ بِكُمْ وَبَثَّ فِيهَا مِن كُلِّ دَآبَّةٍۢ ۚ وَأَنزَلْنَا مِنَ ٱلسَّمَآءِ مَآءًۭ فَأَنۢبَتْنَا فِيهَا مِن كُلِّ زَوْجٍۢ كَرِيمٍ ﴿10﴾", "ru": "Он сотворил небеса без опоры, которую бы вы видели, и бросил на землю прочно стоящие, чтобы она не колебалась с вами, и рассеял там всяких животных, и низвели Мы с неба воду и взрастили на ней всякую благородную пару."}, {"ref": "21:31", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "وَجَعَلْنَا فِى ٱلْأَرْضِ رَوَٰسِىَ أَن تَمِيدَ بِهِمْ وَجَعَلْنَا فِيهَا فِجَاجًۭا سُبُلًۭا لَّعَلَّهُمْ يَهْتَدُونَ ﴿31﴾", "ru": "И Мы устроили на земле прочно стоящие, чтобы она не колебалась с ними. И устроили там расщелины дорогами, - может быть, они пойдут правым путем!"}], "n": "Что сказано: ⟦Он поставил на земле горы, чтобы она не колебалась с вами⟧ (16:15; 31:10; так же 21:31).\nВ чём проблема: сказано, что горы существуют, чтобы земля «не колебалась». Геология говорит иначе: землетрясения происходят чаще всего в горных поясах, а горы сами возникают от движения плит; горы не ⟦закрепляют⟧ землю. Апологеты: ⟦корни гор⟧ стабилизируют кору (в аяте этого нет). Критики: аят читается буквально.", "c": null, "x": [], "t": "Горы — чтобы земля не колебалась", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. «Чтобы земля не колебалась»; геологи указывают на иную роль гор."}, {"refs": ["21:32", "22:65", "13:2"], "parts": [{"ref": "21:32", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "وَجَعَلْنَا ٱلسَّمَآءَ سَقْفًۭا مَّحْفُوظًۭا ۖ وَهُمْ عَنْ ءَايَٰتِهَا مُعْرِضُونَ ﴿32﴾", "ru": "И Мы устроили небо крышей охраняемой, а они от знамений его отвращаются."}, {"ref": "22:65", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "أَلَمْ تَرَ أَنَّ ٱللَّهَ سَخَّرَ لَكُم مَّا فِى ٱلْأَرْضِ وَٱلْفُلْكَ تَجْرِى فِى ٱلْبَحْرِ بِأَمْرِهِۦ وَيُمْسِكُ ٱلسَّمَآءَ أَن تَقَعَ عَلَى ٱلْأَرْضِ إِلَّا بِإِذْنِهِۦٓ ۗ إِنَّ ٱللَّهَ بِٱلنَّاسِ لَرَءُوفٌۭ رَّحِيمٌۭ ﴿65﴾", "ru": "Разве ты не видел, что Аллах подчинил вам то, что на земле, и корабль, который течет по морю с Его повеления? И Он держит небо, чтобы оно не упало на землю иначе, как с Его дозволения. Поистине, Аллах к людям кроток, милостив!"}, {"ref": "13:2", "sura": "Ar-Ra'd", "sura_ar": "سُورَةُ الرَّعۡدِ", "type": "Medinan", "ar": "ٱللَّهُ ٱلَّذِى رَفَعَ ٱلسَّمَٰوَٰتِ بِغَيْرِ عَمَدٍۢ تَرَوْنَهَا ۖ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۖ وَسَخَّرَ ٱلشَّمْسَ وَٱلْقَمَرَ ۖ كُلٌّۭ يَجْرِى لِأَجَلٍۢ مُّسَمًّۭى ۚ يُدَبِّرُ ٱلْأَمْرَ يُفَصِّلُ ٱلْءَايَٰتِ لَعَلَّكُم بِلِقَآءِ رَبِّكُمْ تُوقِنُونَ ﴿2﴾", "ru": "Аллах - тот, кто воздвиг небеса без опор, которые бы видели, потом утвердился на троне и подчинил солнце и луну: все течет до определенного предела. Он управляет (Своим) делом, устанавливает ясно знамения, - может быть, вы уверитесь во встрече с вашим Господом!"}], "n": "Что сказано: Небо — ⟦охраняемая крыша⟧ (21:32); Бог ⟦удерживает небо, чтобы оно не упало на землю, кроме как с Его разрешения⟧ (22:65); небеса подняты ⟦без видимых вам столбов⟧ (13:2).\nВ чём проблема: небо описано как твёрдый свод, который мог бы рухнуть без Божьей поддержки, а столбы лишь ⟦невидимы⟧. В космосе твёрдого неба нет; атмосфера не может ⟦упасть⟧. Апологеты: «небо» = атмосфера, ⟦не упасть⟧ = метеориты сгорают. Критики: слова ⟦столбы⟧ и ⟦крыша⟧ говорят о куполе.", "c": null, "x": [], "t": "Небо — «охраняемая крыша», которая могла бы упасть", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. «Охраняемая крыша». Апологеты читают как атмосферу."}, {"n": "Что сказано: Зу-л-Карнайн дошёл между двумя горами, нашёл людей, ⟦почти не понимавших слов⟧, которые просят защиты от Йаджуджа и Маджуджа, и построил стену из кусков железа, залив ⟦расплавленной медью⟧.\nВ чём проблема: такой стены (железо и медь) не найдено; рассказ перекликается с легендами об Александре Македонском. Имя Зу-л-Карнайн (⟦двурогий⟧) в Коране не раскрыто, мусульмане отождествляют его по-разному.", "c": null, "x": ["21:96"], "refs": ["18:93-96"], "parts": [{"ref": "18:93-96", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَا بَلَغَ بَيْنَ ٱلسَّدَّيْنِ وَجَدَ مِن دُونِهِمَا قَوْمًۭا لَّا يَكَادُونَ يَفْقَهُونَ قَوْلًۭا ﴿93﴾ قَالُوا۟ يَٰذَا ٱلْقَرْنَيْنِ إِنَّ يَأْجُوجَ وَمَأْجُوجَ مُفْسِدُونَ فِى ٱلْأَرْضِ فَهَلْ نَجْعَلُ لَكَ خَرْجًا عَلَىٰٓ أَن تَجْعَلَ بَيْنَنَا وَبَيْنَهُمْ سَدًّۭا ﴿94﴾ قَالَ مَا مَكَّنِّى فِيهِ رَبِّى خَيْرٌۭ فَأَعِينُونِى بِقُوَّةٍ أَجْعَلْ بَيْنَكُمْ وَبَيْنَهُمْ رَدْمًا ﴿95﴾ ءَاتُونِى زُبَرَ ٱلْحَدِيدِ ۖ حَتَّىٰٓ إِذَا سَاوَىٰ بَيْنَ ٱلصَّدَفَيْنِ قَالَ ٱنفُخُوا۟ ۖ حَتَّىٰٓ إِذَا جَعَلَهُۥ نَارًۭا قَالَ ءَاتُونِىٓ أُفْرِغْ عَلَيْهِ قِطْرًۭا ﴿96﴾", "ru": "(93) А когда достиг до места между двумя преградами, то нашел перед ними народ, который едва мог понимать речь. (94) Они сказали: \"О Зу-л-карнайн, ведь Йаджудж и Маджудж распространяют нечестие по земле; не установить ли нам для тебя подать, чтобы ты устроил между нами и ними плотину?\" (95) Он сказал: \"То, в чем укрепил меня мой Господь, лучше; помогите же мне силой, я устрою между вами и ними преграду. (96) Принесите мне кусков железа\". А когда он сравнял между двумя склонами, сказал: \"Раздувайте!\" А когда он превратил его в огонь, сказал: \"Принесите мне, я вылью на это расплавленный металл\"."}], "t": null, "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Железо-медная стена не найдена."}, {"refs": ["2:22", "20:53", "71:19", "78:6-7", "88:17-20", "50:7"], "parts": [{"ref": "2:22", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ فِرَٰشًۭا وَٱلسَّمَآءَ بِنَآءًۭ وَأَنزَلَ مِنَ ٱلسَّمَآءِ مَآءًۭ فَأَخْرَجَ بِهِۦ مِنَ ٱلثَّمَرَٰتِ رِزْقًۭا لَّكُمْ ۖ فَلَا تَجْعَلُوا۟ لِلَّهِ أَندَادًۭا وَأَنتُمْ تَعْلَمُونَ ﴿22﴾", "ru": "который землю сделал для вас ковром, а небо - зданием, и низвел с неба воду, и вывел ею плоды пропитанием для вас. Не предавайте же Аллаху равных, в то время как вы знаете!"}, {"ref": "20:53", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ مَهْدًۭا وَسَلَكَ لَكُمْ فِيهَا سُبُلًۭا وَأَنزَلَ مِنَ ٱلسَّمَآءِ مَآءًۭ فَأَخْرَجْنَا بِهِۦٓ أَزْوَٰجًۭا مِّن نَّبَاتٍۢ شَتَّىٰ ﴿53﴾", "ru": "Он, который сделал для вас землю равниной, и провел для вас в ней дороги, и низвел с неба воду, и вывели Мы благодаря ей пары разных растений."}, {"ref": "71:19", "sura": "Nooh", "sura_ar": "سُورَةُ نُوحٍ", "type": "Meccan", "ar": "وَٱللَّهُ جَعَلَ لَكُمُ ٱلْأَرْضَ بِسَاطًۭا ﴿19﴾", "ru": "Аллах сделал для вас землю подстилкой,"}, {"ref": "78:6-7", "sura": "An-Naba", "sura_ar": "سُورَةُ النَّبَإِ", "type": "Meccan", "ar": "أَلَمْ نَجْعَلِ ٱلْأَرْضَ مِهَٰدًۭا ﴿6﴾ وَٱلْجِبَالَ أَوْتَادًۭا ﴿7﴾", "ru": "(6) Разве Мы не сделали землю подстилкой (7) и горы - опорами;"}, {"ref": "88:17-20", "sura": "Al-Ghaashiya", "sura_ar": "سُورَةُ الغَاشِيَةِ", "type": "Meccan", "ar": "أَفَلَا يَنظُرُونَ إِلَى ٱلْإِبِلِ كَيْفَ خُلِقَتْ ﴿17﴾ وَإِلَى ٱلسَّمَآءِ كَيْفَ رُفِعَتْ ﴿18﴾ وَإِلَى ٱلْجِبَالِ كَيْفَ نُصِبَتْ ﴿19﴾ وَإِلَى ٱلْأَرْضِ كَيْفَ سُطِحَتْ ﴿20﴾", "ru": "(17) Разве они не посмотрят на верблюдов, как они созданы, (18) и на небо, как оно возвышено, (19) и на горы, как они водружены, (20) и на землю, как она распростерта."}, {"ref": "50:7", "sura": "Qaaf", "sura_ar": "سُورَةُ قٓ", "type": "Meccan", "ar": "وَٱلْأَرْضَ مَدَدْنَٰهَا وَأَلْقَيْنَا فِيهَا رَوَٰسِىَ وَأَنۢبَتْنَا فِيهَا مِن كُلِّ زَوْجٍۭ بَهِيجٍۢ ﴿7﴾", "ru": "И землю Мы распростерли и устроили на ней прочно стоящие и произрастили на ней всякие красивые пары"}], "n": "Что сказано: Бог сделал землю «ковром» (2:22), ⟦равниной/ложем⟧ (20:53), «подстилкой» (71:19), «распростёр» (50:7; 88:20); горы — ⟦колья/опоры⟧ (78:7).\nВ чём проблема: набор образов описывает землю как плоскую поверхность, раскинутую под небом-куполом, с горами-кольями (как палатка). Нигде в Коране земля не названа шаром; слово «распростёр» повторяется неоднократно. Апологеты: «распростёр» — ⟦сделал пригодной для жизни⟧, образ ковра — не о форме Земли. Критики: образ плоской земли со сводом соответствует картине мира VII века.", "c": null, "x": [], "t": "Земля — «ковёр», «ложе», «распростёртая»", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. «Ковёр» и «ложе» понимают как приспособленную для жизни землю."}, {"n": "Что сказано: «Разве не видели те, которые не веровали, что небеса и земля были соединены, а Мы их разделили и сделали из воды всякую вещь живую?»\nВ чём проблема: небеса и земля «были соединены» — по апологетам, ⟦Большой взрыв⟧. Но в Коране нет подробностей, а ⟦из воды всякая живая вещь⟧ — неточно: живое содержит воду, но не создано «из воды» (ср. 15:26, 3:59 — глина/прах).", "c": "Апологеты видят здесь ⟦Большой взрыв⟧; критики — расплывчатое описание.", "x": ["24:45", "15:26"], "refs": ["21:30"], "parts": [{"ref": "21:30", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "أَوَلَمْ يَرَ ٱلَّذِينَ كَفَرُوٓا۟ أَنَّ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ كَانَتَا رَتْقًۭا فَفَتَقْنَٰهُمَا ۖ وَجَعَلْنَا مِنَ ٱلْمَآءِ كُلَّ شَىْءٍ حَىٍّ ۖ أَفَلَا يُؤْمِنُونَ ﴿30﴾", "ru": "Разве не видели те, которые не веровали, что небеса и земля были соединены, а Мы их разделили и сделали из воды всякую вещь живую. Неужели они не уверуют?"}], "t": null, "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. Параллель с Большим взрывом — допущение."}, {"n": "Что сказано: ⟦Разве ты не видишь, что Аллах гонит облака, потом соединяет их, потом превращает в тучу… и низводит Он с неба с гор, что в нём, град⟧.\nВ чём проблема: в небе описаны «горы» (джибал), из которых падает град. В небе нет гор. Апологеты: «горы» = облака, похожие на горы; критики: в оригинале ⟦с гор, что в нём (в небе)⟧.", "c": null, "x": [], "refs": ["24:43"], "parts": [{"ref": "24:43", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "أَلَمْ تَرَ أَنَّ ٱللَّهَ يُزْجِى سَحَابًۭا ثُمَّ يُؤَلِّفُ بَيْنَهُۥ ثُمَّ يَجْعَلُهُۥ رُكَامًۭا فَتَرَى ٱلْوَدْقَ يَخْرُجُ مِنْ خِلَٰلِهِۦ وَيُنَزِّلُ مِنَ ٱلسَّمَآءِ مِن جِبَالٍۢ فِيهَا مِنۢ بَرَدٍۢ فَيُصِيبُ بِهِۦ مَن يَشَآءُ وَيَصْرِفُهُۥ عَن مَّن يَشَآءُ ۖ يَكَادُ سَنَا بَرْقِهِۦ يَذْهَبُ بِٱلْأَبْصَٰرِ ﴿43﴾", "ru": "Разве ты не видишь, что Аллах гонит облака, потом соединяет их, потом превращает в тучу, и ты видишь, как из расщелин ее выходит ливень. И низводит Он с неба горы, в которых град, и поражает им, кого желает, и отклоняет, от кого пожелает. Блеск молнии Его готов унести зрение."}], "t": null, "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. «Горы» в небе: облака или буквально."}, {"n": "Что сказано: ⟦Он — тот, который показывает вам молнию для страха и надежды… И гром прославляет Его хвалой, и ангелы — от страха перед Ним⟧.\nВ чём проблема: гром (звук от электрического разряда) описан как существо, славящее Бога; религиозное объяснение заменяет физическое. Апологеты: поэтический образ.", "c": null, "x": [], "refs": ["13:12-13"], "parts": [{"ref": "13:12-13", "sura": "Ar-Ra'd", "sura_ar": "سُورَةُ الرَّعۡدِ", "type": "Medinan", "ar": "هُوَ ٱلَّذِى يُرِيكُمُ ٱلْبَرْقَ خَوْفًۭا وَطَمَعًۭا وَيُنشِئُ ٱلسَّحَابَ ٱلثِّقَالَ ﴿12﴾ وَيُسَبِّحُ ٱلرَّعْدُ بِحَمْدِهِۦ وَٱلْمَلَٰٓئِكَةُ مِنْ خِيفَتِهِۦ وَيُرْسِلُ ٱلصَّوَٰعِقَ فَيُصِيبُ بِهَا مَن يَشَآءُ وَهُمْ يُجَٰدِلُونَ فِى ٱللَّهِ وَهُوَ شَدِيدُ ٱلْمِحَالِ ﴿13﴾", "ru": "(12) Он - тот, который показывает вам молнию для страха и надежды. Он выращивает облака тяжелые. (13) И гром прославляет Его хвалой, и ангелы - от страха пред Ним. Он посылает молнии и поражает ими тех, кого пожелает, когда они препираются об Аллахе, - ведь Он силен в бое!"}], "t": null, "at": "расходится с наукой", "pw": "слабый", "cl": "Вывод: сопоставление с наукой возможно только при выборе одного из прочтений; текст само прочтение не указывает. Гром славит Бога: образ."}, {"n": "Что сказано: «Приблизился час, и раскололся месяц!»\nВ чём проблема: речь о расколе Луны. Если событие было, оно должно было быть видно всей ночной стороне Земли и отмечено другими наблюдателями; независимых записей нет. Часть толкователей понимает аят как будущее (на Страшном суде), несмотря на прошедшую форму глагола. Так аят либо неверен, либо понимается иначе.", "c": "Нет астрономических свидетельств раскола Луны.", "x": [], "refs": ["54:1"], "parts": [{"ref": "54:1", "sura": "Al-Qamar", "sura_ar": "سُورَةُ القَمَرِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱقْتَرَبَتِ ٱلسَّاعَةُ وَٱنشَقَّ ٱلْقَمَرُ ﴿1﴾", "ru": "Приблизился час, и раскололся месяц!"}], "t": null, "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. Раскол Луны: прошлое или будущее событие. Вывод зависит от прочтения."}, {"refs": ["32:4", "50:38"], "parts": [{"ref": "32:4", "sura": "As-Sajda", "sura_ar": "سُورَةُ السَّجۡدَةِ", "type": "Meccan", "ar": "ٱللَّهُ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ وَمَا بَيْنَهُمَا فِى سِتَّةِ أَيَّامٍۢ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۖ مَا لَكُم مِّن دُونِهِۦ مِن وَلِىٍّۢ وَلَا شَفِيعٍ ۚ أَفَلَا تَتَذَكَّرُونَ ﴿4﴾", "ru": "Аллах - тот , который сотворил небеса и землю и то, что между ними, в шесть дней, потом утвердился на троне. Нет у вас помимо Него защитника и заступника. Разве вы не вспомните?"}, {"ref": "50:38", "sura": "Qaaf", "sura_ar": "سُورَةُ قٓ", "type": "Meccan", "ar": "وَلَقَدْ خَلَقْنَا ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ وَمَا بَيْنَهُمَا فِى سِتَّةِ أَيَّامٍۢ وَمَا مَسَّنَا مِن لُّغُوبٍۢ ﴿38﴾", "ru": "И сотворили Мы небеса, и землю, и то, что между ними, в шесть дней, и не коснулась нас усталость."}], "n": "Что сказано: Небеса и земля созданы ⟦в шесть дней, потом Он утвердился на троне⟧ (32:4; так же 7:54, 25:59); «и не коснулась Нас усталость» (50:38).\nВ чём проблема: (1) Вселенной около 13,8 млрд лет, Земле — 4,5 млрд: шесть «дней» плохо совмещаются. Апологеты: ⟦день⟧ = эпоха (70:4 — пятьдесят тысяч лет; 32:5 — тысяча). (2) Схема ⟦шесть дней, потом трон⟧ повторяет библейскую (Быт 1–2:2), а ⟦усталость не коснулась⟧ отвечает библейскому ⟦седьмому дню отдыха⟧. (3) 41:9-12 даёт сумму в восемь дней.", "c": null, "x": ["7:54", "41:9-12", "70:4"], "t": "Шесть дней творения", "at": "расходится с наукой", "pw": "средний", "cl": "Вывод: при буквальном чтении утверждение расходится с современными данными; для сохранения согласия с наукой необходимо образное чтение, которое текст не обозначает. Шесть дней и возраст Вселенной. Апологеты понимают «день» как эпоху."}], "summary": ["Часть аятов читается как буквальная картина мира (небо-свод, земля-ковёр).", "Апологеты предлагают образное чтение; текст не определяет, какое верно.", "Сильных доводов мало: чаще спор о толковании."]}, {"id": "bio", "title": "Человек и живая природа", "icon": "🧬", "group": "Природа, наука и сверхъестественное", "intro": "Утверждения о возникновении человека, о развитии эмбриона и о животных. Одни считаются апологетами «научными чудесами», другие критики называют наивными. Сравнение с науками стоит проводить по специальной литературе.", "verses": [{"refs": ["22:5", "23:12-14", "39:6", "32:7-9", "77:20-23"], "parts": [{"ref": "22:5", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّاسُ إِن كُنتُمْ فِى رَيْبٍۢ مِّنَ ٱلْبَعْثِ فَإِنَّا خَلَقْنَٰكُم مِّن تُرَابٍۢ ثُمَّ مِن نُّطْفَةٍۢ ثُمَّ مِنْ عَلَقَةٍۢ ثُمَّ مِن مُّضْغَةٍۢ مُّخَلَّقَةٍۢ وَغَيْرِ مُخَلَّقَةٍۢ لِّنُبَيِّنَ لَكُمْ ۚ وَنُقِرُّ فِى ٱلْأَرْحَامِ مَا نَشَآءُ إِلَىٰٓ أَجَلٍۢ مُّسَمًّۭى ثُمَّ نُخْرِجُكُمْ طِفْلًۭا ثُمَّ لِتَبْلُغُوٓا۟ أَشُدَّكُمْ ۖ وَمِنكُم مَّن يُتَوَفَّىٰ وَمِنكُم مَّن يُرَدُّ إِلَىٰٓ أَرْذَلِ ٱلْعُمُرِ لِكَيْلَا يَعْلَمَ مِنۢ بَعْدِ عِلْمٍۢ شَيْـًۭٔا ۚ وَتَرَى ٱلْأَرْضَ هَامِدَةًۭ فَإِذَآ أَنزَلْنَا عَلَيْهَا ٱلْمَآءَ ٱهْتَزَّتْ وَرَبَتْ وَأَنۢبَتَتْ مِن كُلِّ زَوْجٍۭ بَهِيجٍۢ ﴿5﴾", "ru": "О люди! Если вы в сомнении о воскрешении, то ведь Мы создали вас из праха, потом из капли, потом из сгустка крови, потом из куска мяса, сформованного или бесформенного, чтобы разъяснить вам (это). И помещаем и в утробах, насколько захотим, до определенного срока. Потом выводим вас младенцем, потом - чтобы вы достигли вашей зрелости. Среди вас есть тот, кто упокояется, и среди вас есть тот, кто возвращается к жалчайшей жизни, чтобы не знать после знания ничего. И видишь ты землю бесплодной, а когда Мы низводим на нее воду, она приходит в движение и разбухает и выращивает всякие прекрасные пары."}, {"ref": "23:12-14", "sura": "Al-Muminoon", "sura_ar": "سُورَةُ المُؤۡمِنُونَ", "type": "Meccan", "ar": "وَلَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ مِن سُلَٰلَةٍۢ مِّن طِينٍۢ ﴿12﴾ ثُمَّ جَعَلْنَٰهُ نُطْفَةًۭ فِى قَرَارٍۢ مَّكِينٍۢ ﴿13﴾ ثُمَّ خَلَقْنَا ٱلنُّطْفَةَ عَلَقَةًۭ فَخَلَقْنَا ٱلْعَلَقَةَ مُضْغَةًۭ فَخَلَقْنَا ٱلْمُضْغَةَ عِظَٰمًۭا فَكَسَوْنَا ٱلْعِظَٰمَ لَحْمًۭا ثُمَّ أَنشَأْنَٰهُ خَلْقًا ءَاخَرَ ۚ فَتَبَارَكَ ٱللَّهُ أَحْسَنُ ٱلْخَٰلِقِينَ ﴿14﴾", "ru": "(12) Мы уже создали человека из эссенции глины, (13) потом поместили Мы его каплей в надежном месте, (14) потом создали из капли сгусток крови, и создали из сгустка крови кусок мяса, создали из этого куска кости и облекли кости мясом, потом Мы вырастили его в другом творении, - благословен же Аллах, лучший из творцов!"}, {"ref": "39:6", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "خَلَقَكُم مِّن نَّفْسٍۢ وَٰحِدَةٍۢ ثُمَّ جَعَلَ مِنْهَا زَوْجَهَا وَأَنزَلَ لَكُم مِّنَ ٱلْأَنْعَٰمِ ثَمَٰنِيَةَ أَزْوَٰجٍۢ ۚ يَخْلُقُكُمْ فِى بُطُونِ أُمَّهَٰتِكُمْ خَلْقًۭا مِّنۢ بَعْدِ خَلْقٍۢ فِى ظُلُمَٰتٍۢ ثَلَٰثٍۢ ۚ ذَٰلِكُمُ ٱللَّهُ رَبُّكُمْ لَهُ ٱلْمُلْكُ ۖ لَآ إِلَٰهَ إِلَّا هُوَ ۖ فَأَنَّىٰ تُصْرَفُونَ ﴿6﴾", "ru": "Он сотворил вас из единой души, потом сделал из нее пару и ниспослал вам из животных восемь парами. Он творит вас в утробах ваших матерей, одним творением после другого в трех мраках. Это (для вас) - Аллах, ваш Господь; Ему принадлежит власть, нет божества, кроме Него; до чего же вы отвращены!"}, {"ref": "32:7-9", "sura": "As-Sajda", "sura_ar": "سُورَةُ السَّجۡدَةِ", "type": "Meccan", "ar": "ٱلَّذِىٓ أَحْسَنَ كُلَّ شَىْءٍ خَلَقَهُۥ ۖ وَبَدَأَ خَلْقَ ٱلْإِنسَٰنِ مِن طِينٍۢ ﴿7﴾ ثُمَّ جَعَلَ نَسْلَهُۥ مِن سُلَٰلَةٍۢ مِّن مَّآءٍۢ مَّهِينٍۢ ﴿8﴾ ثُمَّ سَوَّىٰهُ وَنَفَخَ فِيهِ مِن رُّوحِهِۦ ۖ وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَٰرَ وَٱلْأَفْـِٔدَةَ ۚ قَلِيلًۭا مَّا تَشْكُرُونَ ﴿9﴾", "ru": "(7) который прекрасно сделал в
