", "ru": "И вот, Ибрахим воздвигает основы дома, и Исмаил: \"Господи наш! Прими от нас, ведь Ты, поистине - слышащий, знающий!", "n": "Ибрахим и Исмаил возводят основания дома (Каабы) в Мекке.", "c": null}, {"ref": "14:37", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "رَّبَّنَآ إِنِّىٓ أَسْكَنتُ مِن ذُرِّيَّتِى بِوَادٍ غَيْرِ ذِى زَرْعٍ عِندَ بَيْتِكَ ٱلْمُحَرَّمِ رَبَّنَا لِيُقِيمُوا۟ ٱلصَّلَوٰةَ فَٱجْعَلْ أَفْـِٔدَةًۭ مِّنَ ٱلنَّاسِ تَهْوِىٓ إِلَيْهِمْ وَٱرْزُقْهُم مِّنَ ٱلثَّمَرَٰتِ لَعَلَّهُمْ يَشْكُرُونَ ﴿37﴾", "ru": "Господи, я поселил из моего потомства в долине, не имеющей злаков, у Твоего дома священного. Господи наш! Пусть они выстаивают молитву, и сделай сердца людей склоняющимися к ним и отдели их плодами, - может быть, они будут благодарны!", "n": "Ибрахим: «Я поселил из моего потомства в долине, не имеющей злаков, у Твоего дома священного».", "c": "Нет ни библейских, ни археологических свидетельств о пребывании Авраама в Мекке."}, {"ref": "3:96", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "إِنَّ أَوَّلَ بَيْتٍۢ وُضِعَ لِلنَّاسِ لَلَّذِى بِبَكَّةَ مُبَارَكًۭا وَهُدًۭى لِّلْعَٰلَمِينَ ﴿96﴾", "ru": "Поистине, первый дом, который установлен для людей, - тот, который в Бекке, - и в руководство для миров!", "n": null, "c": null}, {"ref": "2:102", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱتَّبَعُوا۟ مَا تَتْلُوا۟ ٱلشَّيَٰطِينُ عَلَىٰ مُلْكِ سُلَيْمَٰنَ ۖ وَمَا كَفَرَ سُلَيْمَٰنُ وَلَٰكِنَّ ٱلشَّيَٰطِينَ كَفَرُوا۟ يُعَلِّمُونَ ٱلنَّاسَ ٱلسِّحْرَ وَمَآ أُنزِلَ عَلَى ٱلْمَلَكَيْنِ بِبَابِلَ هَٰرُوتَ وَمَٰرُوتَ ۚ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّىٰ يَقُولَآ إِنَّمَا نَحْنُ فِتْنَةٌۭ فَلَا تَكْفُرْ ۖ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِۦ بَيْنَ ٱلْمَرْءِ وَزَوْجِهِۦ ۚ وَمَا هُم بِضَآرِّينَ بِهِۦ مِنْ أَحَدٍ إِلَّا بِإِذْنِ ٱللَّهِ ۚ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ ۚ وَلَقَدْ عَلِمُوا۟ لَمَنِ ٱشْتَرَىٰهُ مَا لَهُۥ فِى ٱلْءَاخِرَةِ مِنْ خَلَٰقٍۢ ۚ وَلَبِئْسَ مَا شَرَوْا۟ بِهِۦٓ أَنفُسَهُمْ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ ﴿102﴾", "ru": "и они последовали за тем, что читали шайтаны, в царство Сулаймана. Сулайман не был неверным, но шайтаны были неверными, обучая людей колдовству и тому, что было ниспослано обоим ангелам в Вавилоне, Харуту и Маруту. Но они оба не обучали никого, пока не говорили: \"Мы - искушение, не будь же неверным!\" И те научались от них, чем разлучать мужа от жены, - но они не вредили этим никому иначе, как с дозволения Аллаха. И обучались они тому, что им вредило и не приносило пользы, и они знали, что тот, кто приобретал это, - нет ему доли в будущей жизни. Плохо то, что они покупали за свои души, - если бы они это знали!", "n": "В Вавилоне ангелы Харут и Марут учат людей колдовству; Сулейман не был неверным. Библия о колдовских действиях Соломона не говорит.", "c": null}, {"ref": "2:63", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ أَخَذْنَا مِيثَٰقَكُمْ وَرَفَعْنَا فَوْقَكُمُ ٱلطُّورَ خُذُوا۟ مَآ ءَاتَيْنَٰكُم بِقُوَّةٍۢ وَٱذْكُرُوا۟ مَا فِيهِ لَعَلَّكُمْ تَتَّقُونَ ﴿63﴾", "ru": "И вот, Мы взяли договор с вас и воздвигли над вами гору: \"Возьмите то, что Мы даровали вам, с силой и помните то, что там, - может быть, вы будете богобоязненны!\"", "n": "«Мы взяли договор с вас и воздвигли над вами гору» — Бог поднял над израильтянами гору (так же 2:93, 7:171).", "c": null}]}, {"id": "cosmos", "title": "Космос и Земля", "icon": "☄", "group": "Природа, наука и сверхъестественное", "intro": "Утверждения о небе, Земле, Солнце, Луне и звёздах, которые не соответствуют современным данным или близки к картине мира VII века. Апологеты читают их как метафоры; критики — как буквальные утверждения.", "verses": [{"ref": "18:86", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَا بَلَغَ مَغْرِبَ ٱلشَّمْسِ وَجَدَهَا تَغْرُبُ فِى عَيْنٍ حَمِئَةٍۢ وَوَجَدَ عِندَهَا قَوْمًۭا ۗ قُلْنَا يَٰذَا ٱلْقَرْنَيْنِ إِمَّآ أَن تُعَذِّبَ وَإِمَّآ أَن تَتَّخِذَ فِيهِمْ حُسْنًۭا ﴿86﴾", "ru": "А когда он дошел до заката солнца, то увидел, что оно закатывается в источник зловонный, и нашел около него людей. Мы сказали: \"О Зу-л-карнайн, либо ты накажешь, либо устроишь для них милость\".", "n": "Зу-л-Карнайн дошёл до места заката солнца и увидел, что оно «закатывается в источник зловонный» (в других переводах — тёмный, грязный).", "c": "Апологеты: описание с точки зрения наблюдателя; критики отмечают, что текст говорит не кажется, а нашёл, что оно заходит."}, {"ref": "18:90", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَا بَلَغَ مَطْلِعَ ٱلشَّمْسِ وَجَدَهَا تَطْلُعُ عَلَىٰ قَوْمٍۢ لَّمْ نَجْعَل لَّهُم مِّن دُونِهَا سِتْرًۭا ﴿90﴾", "ru": "А когда дошел он до восхода солнца, то нашел, что оно восходит над людьми, для которых Мы не сделали от него никакой завесы.", "n": "Дошёл до места восхода солнца — оно восходит над людьми, для которых Мы не сделали от него покрова.", "c": null}, {"ref": "36:38", "sura": "Yaseen", "sura_ar": "سُورَةُ يسٓ", "type": "Meccan", "ar": "وَٱلشَّمْسُ تَجْرِى لِمُسْتَقَرٍّۢ لَّهَا ۚ ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ ﴿38﴾", "ru": "И солнце течет к местопребыванию своему. Таково установление Славного, Мудрого!", "n": "Солнце течёт к месту своего пребывания.", "c": "Классические комментаторы понимали местопребывание как место остановки на небосводе; современные — как конечную точку движения."}, {"ref": "67:5", "sura": "Al-Mulk", "sura_ar": "سُورَةُ المُلۡكِ", "type": "Meccan", "ar": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ ﴿5﴾", "ru": "Мы украсили уже небо ближайшее светильниками, и сделали их побиением для дияволов, и уготовали им наказание огня.", "n": "Звёзды названы «светильниками» и снарядами для шайтанов.", "c": "Классические комментаторы видят здесь метеоры, которыми забрасывают подслушивающих джиннов."}, {"ref": "37:6-10", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "إِنَّا زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِزِينَةٍ ٱلْكَوَاكِبِ ﴿6﴾ وَحِفْظًۭا مِّن كُلِّ شَيْطَٰنٍۢ مَّارِدٍۢ ﴿7﴾ لَّا يَسَّمَّعُونَ إِلَى ٱلْمَلَإِ ٱلْأَعْلَىٰ وَيُقْذَفُونَ مِن كُلِّ جَانِبٍۢ ﴿8﴾ دُحُورًۭا ۖ وَلَهُمْ عَذَابٌۭ وَاصِبٌ ﴿9﴾ إِلَّا مَنْ خَطِفَ ٱلْخَطْفَةَ فَأَتْبَعَهُۥ شِهَابٌۭ ثَاقِبٌۭ ﴿10﴾", "ru": "(6) Мы ведь украсили небо ближайшее украшением звезд (7) и для охраны от всякого шайтана мятежного. (8) Они не прислушиваются к верховному совету и поражаются со всех сторон (9) для отогнания, и для них - наказание мучительное. (10) кроме тех, кто урвет схватку, и преследует его поражающий светоч.", "n": "Небо украшено звёздами и охраняется от мятежных шайтанов; тот, кто попытается подслушать, будет настигнут пронзающим пламенем (метеором).", "c": null}, {"ref": "15:17-18", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "وَحَفِظْنَٰهَا مِن كُلِّ شَيْطَٰنٍۢ رَّجِيمٍ ﴿17﴾ إِلَّا مَنِ ٱسْتَرَقَ ٱلسَّمْعَ فَأَتْبَعَهُۥ شِهَابٌۭ مُّبِينٌۭ ﴿18﴾", "ru": "(17) И охранили Мы их от всякого сатаны, побиваемого камнями. (18) А если кто украдкой подслушает, то следует за ним ясный светоч.", "n": "Небо охраняется от побиваемого шайтана; подслушавшего настигнет явный метеор — в тексте космические явления объясняются как оружие против джиннов.", "c": null}, {"ref": "71:15-16", "sura": "Nooh", "sura_ar": "سُورَةُ نُوحٍ", "type": "Meccan", "ar": "أَلَمْ تَرَوْا۟ كَيْفَ خَلَقَ ٱللَّهُ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ﴿15﴾ وَجَعَلَ ٱلْقَمَرَ فِيهِنَّ نُورًۭا وَجَعَلَ ٱلشَّمْسَ سِرَاجًۭا ﴿16﴾", "ru": "(15) Разве вы не видите, как сотворил Аллах семь небес рядами? (16) И сделал месяц на них светом, а солнце сделал светильником.", "n": "Семь небес ярусами; Луна — «свет», а Солнце — «светильник» (сирадж). Луна лишь отражает свет Солнца, собственного света не имеет.", "c": null}, {"ref": "65:12", "sura": "At-Talaaq", "sura_ar": "سُورَةُ الطَّلَاقِ", "type": "Medinan", "ar": "ٱللَّهُ ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ وَمِنَ ٱلْأَرْضِ مِثْلَهُنَّ يَتَنَزَّلُ ٱلْأَمْرُ بَيْنَهُنَّ لِتَعْلَمُوٓا۟ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ وَأَنَّ ٱللَّهَ قَدْ أَحَاطَ بِكُلِّ شَىْءٍ عِلْمًۢا ﴿12﴾", "ru": "Аллах - тот, кто сотворил семь небес и из земли столько же. Нисходит повеление между ними, чтобы вы знали, что Аллах над всем мощен и что Аллах все объемлет знанием.", "n": "Аллах — тот, кто сотворил семь небес и из земли — подобное им.", "c": null}, {"ref": "16:15", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَأَلْقَىٰ فِى ٱلْأَرْضِ رَوَٰسِىَ أَن تَمِيدَ بِكُمْ وَأَنْهَٰرًۭا وَسُبُلًۭا لَّعَلَّكُمْ تَهْتَدُونَ ﴿15﴾", "ru": "И бросил Он на землю прочно стоящие, чтобы она не колебалась с вами, и реки , и пути, - может быть, вы пойдете по прямой дороге! -", "n": "Он поставил на земле незыблемые горы, чтобы она не колебалась с вами.", "c": null}, {"ref": "31:10", "sura": "Luqman", "sura_ar": "سُورَةُ لُقۡمَانَ", "type": "Meccan", "ar": "خَلَقَ ٱلسَّمَٰوَٰتِ بِغَيْرِ عَمَدٍۢ تَرَوْنَهَا ۖ وَأَلْقَىٰ فِى ٱلْأَرْضِ رَوَٰسِىَ أَن تَمِيدَ بِكُمْ وَبَثَّ فِيهَا مِن كُلِّ دَآبَّةٍۢ ۚ وَأَنزَلْنَا مِنَ ٱلسَّمَآءِ مَآءًۭ فَأَنۢبَتْنَا فِيهَا مِن كُلِّ زَوْجٍۢ كَرِيمٍ ﴿10﴾", "ru": "Он сотворил небеса без опоры, которую бы вы видели, и бросил на землю прочно стоящие, чтобы она не колебалась с вами, и рассеял там всяких животных, и низвели Мы с неба воду и взрастили на ней всякую благородную пару.", "n": "Горы брошены на землю, чтобы она не качалась с вами.", "c": null}, {"ref": "21:32", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "وَجَعَلْنَا ٱلسَّمَآءَ سَقْفًۭا مَّحْفُوظًۭا ۖ وَهُمْ عَنْ ءَايَٰتِهَا مُعْرِضُونَ ﴿32﴾", "ru": "И Мы устроили небо крышей охраняемой, а они от знамений его отвращаются.", "n": "Небо — охраняемая крыша.", "c": null}, {"ref": "22:65", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "أَلَمْ تَرَ أَنَّ ٱللَّهَ سَخَّرَ لَكُم مَّا فِى ٱلْأَرْضِ وَٱلْفُلْكَ تَجْرِى فِى ٱلْبَحْرِ بِأَمْرِهِۦ وَيُمْسِكُ ٱلسَّمَآءَ أَن تَقَعَ عَلَى ٱلْأَرْضِ إِلَّا بِإِذْنِهِۦٓ ۗ إِنَّ ٱللَّهَ بِٱلنَّاسِ لَرَءُوفٌۭ رَّحِيمٌۭ ﴿65﴾", "ru": "Разве ты не видел, что Аллах подчинил вам то, что на земле, и корабль, который течет по морю с Его повеления? И Он держит небо, чтобы оно не упало на землю иначе, как с Его дозволения. Поистине, Аллах к людям кроток, милостив!", "n": "Бог удерживает небо, чтобы оно не упало на землю, кроме как с Его разрешения.", "c": null}, {"ref": "13:2", "sura": "Ar-Ra'd", "sura_ar": "سُورَةُ الرَّعۡدِ", "type": "Medinan", "ar": "ٱللَّهُ ٱلَّذِى رَفَعَ ٱلسَّمَٰوَٰتِ بِغَيْرِ عَمَدٍۢ تَرَوْنَهَا ۖ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۖ وَسَخَّرَ ٱلشَّمْسَ وَٱلْقَمَرَ ۖ كُلٌّۭ يَجْرِى لِأَجَلٍۢ مُّسَمًّۭى ۚ يُدَبِّرُ ٱلْأَمْرَ يُفَصِّلُ ٱلْءَايَٰتِ لَعَلَّكُم بِلِقَآءِ رَبِّكُمْ تُوقِنُونَ ﴿2﴾", "ru": "Аллах - тот, кто воздвиг небеса без опор, которые бы видели, потом утвердился на троне и подчинил солнце и луну: все течет до определенного предела. Он управляет (Своим) делом, устанавливает ясно знамения, - может быть, вы уверитесь во встрече с вашим Господом!", "n": "Небеса подняты без видимых вам столбов.", "c": null}, {"ref": "18:93-96", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَا بَلَغَ بَيْنَ ٱلسَّدَّيْنِ وَجَدَ مِن دُونِهِمَا قَوْمًۭا لَّا يَكَادُونَ يَفْقَهُونَ قَوْلًۭا ﴿93﴾ قَالُوا۟ يَٰذَا ٱلْقَرْنَيْنِ إِنَّ يَأْجُوجَ وَمَأْجُوجَ مُفْسِدُونَ فِى ٱلْأَرْضِ فَهَلْ نَجْعَلُ لَكَ خَرْجًا عَلَىٰٓ أَن تَجْعَلَ بَيْنَنَا وَبَيْنَهُمْ سَدًّۭا ﴿94﴾ قَالَ مَا مَكَّنِّى فِيهِ رَبِّى خَيْرٌۭ فَأَعِينُونِى بِقُوَّةٍ أَجْعَلْ بَيْنَكُمْ وَبَيْنَهُمْ رَدْمًا ﴿95﴾ ءَاتُونِى زُبَرَ ٱلْحَدِيدِ ۖ حَتَّىٰٓ إِذَا سَاوَىٰ بَيْنَ ٱلصَّدَفَيْنِ قَالَ ٱنفُخُوا۟ ۖ حَتَّىٰٓ إِذَا جَعَلَهُۥ نَارًۭا قَالَ ءَاتُونِىٓ أُفْرِغْ عَلَيْهِ قِطْرًۭا ﴿96﴾", "ru": "(93) А когда достиг до места между двумя преградами, то нашел перед ними народ, который едва мог понимать речь. (94) Они сказали: \"О Зу-л-карнайн, ведь Йаджудж и Маджудж распространяют нечестие по земле; не установить ли нам для тебя подать, чтобы ты устроил между нами и ними плотину?\" (95) Он сказал: \"То, в чем укрепил меня мой Господь, лучше; помогите же мне силой, я устрою между вами и ними преграду. (96) Принесите мне кусков железа\". А когда он сравнял между двумя склонами, сказал: \"Раздувайте!\" А когда он превратил его в огонь, сказал: \"Принесите мне, я вылью на это расплавленный металл\".", "n": "Зу-л-Карнайн нашёл людей, почти не понимающих слов, и построил стену из железных кусков, залив её расплавленной медью, от Йаджуджа и Маджуджа (Гога и Магога); такой стены не найдено.", "c": null}, {"ref": "2:22", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ فِرَٰشًۭا وَٱلسَّمَآءَ بِنَآءًۭ وَأَنزَلَ مِنَ ٱلسَّمَآءِ مَآءًۭ فَأَخْرَجَ بِهِۦ مِنَ ٱلثَّمَرَٰتِ رِزْقًۭا لَّكُمْ ۖ فَلَا تَجْعَلُوا۟ لِلَّهِ أَندَادًۭا وَأَنتُمْ تَعْلَمُونَ ﴿22﴾", "ru": "который землю сделал для вас ковром, а небо - зданием, и низвел с неба воду, и вывел ею плоды пропитанием для вас. Не предавайте же Аллаху равных, в то время как вы знаете!", "n": "Земля — ложе, небо — строение.", "c": null}, {"ref": "20:53", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ مَهْدًۭا وَسَلَكَ لَكُمْ فِيهَا سُبُلًۭا وَأَنزَلَ مِنَ ٱلسَّمَآءِ مَآءًۭ فَأَخْرَجْنَا بِهِۦٓ أَزْوَٰجًۭا مِّن نَّبَاتٍۢ شَتَّىٰ ﴿53﴾", "ru": "Он, который сделал для вас землю равниной, и провел для вас в ней дороги, и низвел с неба воду, и вывели Мы благодаря ей пары разных растений.", "n": "Он сделал для вас землю ложем.", "c": null}, {"ref": "71:19", "sura": "Nooh", "sura_ar": "سُورَةُ نُوحٍ", "type": "Meccan", "ar": "وَٱللَّهُ جَعَلَ لَكُمُ ٱلْأَرْضَ بِسَاطًۭا ﴿19﴾", "ru": "Аллах сделал для вас землю подстилкой,", "n": "Аллах сделал для вас землю подстилкой (ковром).", "c": null}, {"ref": "78:6-7", "sura": "An-Naba", "sura_ar": "سُورَةُ النَّبَإِ", "type": "Meccan", "ar": "أَلَمْ نَجْعَلِ ٱلْأَرْضَ مِهَٰدًۭا ﴿6﴾ وَٱلْجِبَالَ أَوْتَادًۭا ﴿7﴾", "ru": "(6) Разве Мы не сделали землю подстилкой (7) и горы - опорами;", "n": "Разве Мы не сделали землю ложем и горы — кольями?", "c": null}, {"ref": "88:17-20", "sura": "Al-Ghaashiya", "sura_ar": "سُورَةُ الغَاشِيَةِ", "type": "Meccan", "ar": "أَفَلَا يَنظُرُونَ إِلَى ٱلْإِبِلِ كَيْفَ خُلِقَتْ ﴿17﴾ وَإِلَى ٱلسَّمَآءِ كَيْفَ رُفِعَتْ ﴿18﴾ وَإِلَى ٱلْجِبَالِ كَيْفَ نُصِبَتْ ﴿19﴾ وَإِلَى ٱلْأَرْضِ كَيْفَ سُطِحَتْ ﴿20﴾", "ru": "(17) Разве они не посмотрят на верблюдов, как они созданы, (18) и на небо, как оно возвышено, (19) и на горы, как они водружены, (20) и на землю, как она распростерта.", "n": "Не смотрят ли они на верблюда, как он создан; на небо, как оно поднято; на горы, как они поставлены; на землю, как она распростёрта?", "c": null}, {"ref": "50:7", "sura": "Qaaf", "sura_ar": "سُورَةُ قٓ", "type": "Meccan", "ar": "وَٱلْأَرْضَ مَدَدْنَٰهَا وَأَلْقَيْنَا فِيهَا رَوَٰسِىَ وَأَنۢبَتْنَا فِيهَا مِن كُلِّ زَوْجٍۭ بَهِيجٍۢ ﴿7﴾", "ru": "И землю Мы распростерли и устроили на ней прочно стоящие и произрастили на ней всякие красивые пары", "n": "Землю Мы распростёрли и бросили на неё прочно стоящие горы.", "c": null}, {"ref": "21:30", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "أَوَلَمْ يَرَ ٱلَّذِينَ كَفَرُوٓا۟ أَنَّ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ كَانَتَا رَتْقًۭا فَفَتَقْنَٰهُمَا ۖ وَجَعَلْنَا مِنَ ٱلْمَآءِ كُلَّ شَىْءٍ حَىٍّ ۖ أَفَلَا يُؤْمِنُونَ ﴿30﴾", "ru": "Разве не видели те, которые не веровали, что небеса и земля были соединены, а Мы их разделили и сделали из воды всякую вещь живую. Неужели они не уверуют?", "n": "Небеса и земля были слитыми, и Мы их разделили; из воды Мы сделали всё живое.", "c": "Апологеты видят здесь Большой взрыв; критики — расплывчатое описание."}, {"ref": "21:33", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "وَهُوَ ٱلَّذِى خَلَقَ ٱلَّيْلَ وَٱلنَّهَارَ وَٱلشَّمْسَ وَٱلْقَمَرَ ۖ كُلٌّۭ فِى فَلَكٍۢ يَسْبَحُونَ ﴿33﴾", "ru": "Он - тот, который создал ночь и день, и солнце и месяц. Все по своду плавают.", "n": "Бог создал ночь, день, солнце и луну: каждый плывёт по орбите.", "c": null}, {"ref": "24:43", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "أَلَمْ تَرَ أَنَّ ٱللَّهَ يُزْجِى سَحَابًۭا ثُمَّ يُؤَلِّفُ بَيْنَهُۥ ثُمَّ يَجْعَلُهُۥ رُكَامًۭا فَتَرَى ٱلْوَدْقَ يَخْرُجُ مِنْ خِلَٰلِهِۦ وَيُنَزِّلُ مِنَ ٱلسَّمَآءِ مِن جِبَالٍۢ فِيهَا مِنۢ بَرَدٍۢ فَيُصِيبُ بِهِۦ مَن يَشَآءُ وَيَصْرِفُهُۥ عَن مَّن يَشَآءُ ۖ يَكَادُ سَنَا بَرْقِهِۦ يَذْهَبُ بِٱلْأَبْصَٰرِ ﴿43﴾", "ru": "Разве ты не видишь, что Аллах гонит облака, потом соединяет их, потом превращает в тучу, и ты видишь, как из расщелин ее выходит ливень. И низводит Он с неба горы, в которых град, и поражает им, кого желает, и отклоняет, от кого пожелает. Блеск молнии Его готов унести зрение.", "n": "Бог гонит облако и низводит с неба с гор, что в нём, град — в небе описаны «горы» из града.", "c": null}, {"ref": "13:12-13", "sura": "Ar-Ra'd", "sura_ar": "سُورَةُ الرَّعۡدِ", "type": "Medinan", "ar": "هُوَ ٱلَّذِى يُرِيكُمُ ٱلْبَرْقَ خَوْفًۭا وَطَمَعًۭا وَيُنشِئُ ٱلسَّحَابَ ٱلثِّقَالَ ﴿12﴾ وَيُسَبِّحُ ٱلرَّعْدُ بِحَمْدِهِۦ وَٱلْمَلَٰٓئِكَةُ مِنْ خِيفَتِهِۦ وَيُرْسِلُ ٱلصَّوَٰعِقَ فَيُصِيبُ بِهَا مَن يَشَآءُ وَهُمْ يُجَٰدِلُونَ فِى ٱللَّهِ وَهُوَ شَدِيدُ ٱلْمِحَالِ ﴿13﴾", "ru": "(12) Он - тот, который показывает вам молнию для страха и надежды. Он выращивает облака тяжелые. (13) И гром прославляет Его хвалой, и ангелы - от страха пред Ним. Он посылает молнии и поражает ими тех, кого пожелает, когда они препираются об Аллахе, - ведь Он силен в бое!", "n": "Гром славит Его хвалой, и ангелы — от страха перед Ним.", "c": null}, {"ref": "78:13", "sura": "An-Naba", "sura_ar": "سُورَةُ النَّبَإِ", "type": "Meccan", "ar": "وَجَعَلْنَا سِرَاجًۭا وَهَّاجًۭا ﴿13﴾", "ru": "и сделали пылающий светильник,", "n": "Солнце названо светильником пылающим (сирадж ваххадж).", "c": null}, {"ref": "25:61", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "تَبَارَكَ ٱلَّذِى جَعَلَ فِى ٱلسَّمَآءِ بُرُوجًۭا وَجَعَلَ فِيهَا سِرَٰجًۭا وَقَمَرًۭا مُّنِيرًۭا ﴿61﴾", "ru": "Благословен тот, который устроил в небе созвездия и устроил там светильник и сияющий месяц.", "n": "Благословен Тот, кто поместил в небе башни и положил там светильник и светящую луну.", "c": null}, {"ref": "10:5", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "هُوَ ٱلَّذِى جَعَلَ ٱلشَّمْسَ ضِيَآءًۭ وَٱلْقَمَرَ نُورًۭا وَقَدَّرَهُۥ مَنَازِلَ لِتَعْلَمُوا۟ عَدَدَ ٱلسِّنِينَ وَٱلْحِسَابَ ۚ مَا خَلَقَ ٱللَّهُ ذَٰلِكَ إِلَّا بِٱلْحَقِّ ۚ يُفَصِّلُ ٱلْءَايَٰتِ لِقَوْمٍۢ يَعْلَمُونَ ﴿5﴾", "ru": "Он - тот, который сделал солнце сиянием, а месяц - светом и распределил его по стоянкам, чтобы вы знали число годов и счисление. Аллах сотворил это только по истине, распределяя знамения для людей знающих.", "n": "Он сделал солнце сиянием, а луну светом.", "c": null}, {"ref": "54:1", "sura": "Al-Qamar", "sura_ar": "سُورَةُ القَمَرِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱقْتَرَبَتِ ٱلسَّاعَةُ وَٱنشَقَّ ٱلْقَمَرُ ﴿1﴾", "ru": "Приблизился час, и раскололся месяц!", "n": "Приблизился час, и раскололась луна.", "c": "Нет астрономических свидетельств раскола Луны."}, {"ref": "17:44", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "تُسَبِّحُ لَهُ ٱلسَّمَٰوَٰتُ ٱلسَّبْعُ وَٱلْأَرْضُ وَمَن فِيهِنَّ ۚ وَإِن مِّن شَىْءٍ إِلَّا يُسَبِّحُ بِحَمْدِهِۦ وَلَٰكِن لَّا تَفْقَهُونَ تَسْبِيحَهُمْ ۗ إِنَّهُۥ كَانَ حَلِيمًا غَفُورًۭا ﴿44﴾", "ru": "Прославляют Его семь небес, и земля, и те, кто на ней. Нет ничего, что бы не прославляло Его хвалой, но вы не понимаете прославления их. Поистине, Он - кроткий, прощающий!", "n": "Славят Его семь небес, и земля, и те, кто в них; нет ничего, что не славило бы Его хвалой.", "c": null}, {"ref": "32:4", "sura": "As-Sajda", "sura_ar": "سُورَةُ السَّجۡدَةِ", "type": "Meccan", "ar": "ٱللَّهُ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ وَمَا بَيْنَهُمَا فِى سِتَّةِ أَيَّامٍۢ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۖ مَا لَكُم مِّن دُونِهِۦ مِن وَلِىٍّۢ وَلَا شَفِيعٍ ۚ أَفَلَا تَتَذَكَّرُونَ ﴿4﴾", "ru": "Аллах - тот , который сотворил небеса и землю и то, что между ними, в шесть дней, потом утвердился на троне. Нет у вас помимо Него защитника и заступника. Разве вы не вспомните?", "n": "Небеса, земля и то, что между ними, созданы в шесть дней, потом Он утвердился на троне.", "c": null}, {"ref": "50:38", "sura": "Qaaf", "sura_ar": "سُورَةُ قٓ", "type": "Meccan", "ar": "وَلَقَدْ خَلَقْنَا ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ وَمَا بَيْنَهُمَا فِى سِتَّةِ أَيَّامٍۢ وَمَا مَسَّنَا مِن لُّغُوبٍۢ ﴿38﴾", "ru": "И сотворили Мы небеса, и землю, и то, что между ними, в шесть дней, и не коснулась нас усталость.", "n": "Мы сотворили небеса и землю в шесть дней, и не коснулась Нас усталость.", "c": "Повторяет библейскую схему шести дней; поправка об усталости адресована седьмому дню в Библии."}]}, {"id": "bio", "title": "Человек и живая природа", "icon": "🧬", "group": "Природа, наука и сверхъестественное", "intro": "Утверждения о возникновении человека, о развитии эмбриона и о животных. Одни считаются апологетами «научными чудесами», другие критики называют наивными. Сравнение с науками стоит проводить по специальной литературе.", "verses": [{"ref": "22:5", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّاسُ إِن كُنتُمْ فِى رَيْبٍۢ مِّنَ ٱلْبَعْثِ فَإِنَّا خَلَقْنَٰكُم مِّن تُرَابٍۢ ثُمَّ مِن نُّطْفَةٍۢ ثُمَّ مِنْ عَلَقَةٍۢ ثُمَّ مِن مُّضْغَةٍۢ مُّخَلَّقَةٍۢ وَغَيْرِ مُخَلَّقَةٍۢ لِّنُبَيِّنَ لَكُمْ ۚ وَنُقِرُّ فِى ٱلْأَرْحَامِ مَا نَشَآءُ إِلَىٰٓ أَجَلٍۢ مُّسَمًّۭى ثُمَّ نُخْرِجُكُمْ طِفْلًۭا ثُمَّ لِتَبْلُغُوٓا۟ أَشُدَّكُمْ ۖ وَمِنكُم مَّن يُتَوَفَّىٰ وَمِنكُم مَّن يُرَدُّ إِلَىٰٓ أَرْذَلِ ٱلْعُمُرِ لِكَيْلَا يَعْلَمَ مِنۢ بَعْدِ عِلْمٍۢ شَيْـًۭٔا ۚ وَتَرَى ٱلْأَرْضَ هَامِدَةًۭ فَإِذَآ أَنزَلْنَا عَلَيْهَا ٱلْمَآءَ ٱهْتَزَّتْ وَرَبَتْ وَأَنۢبَتَتْ مِن كُلِّ زَوْجٍۭ بَهِيجٍۢ ﴿5﴾", "ru": "О люди! Если вы в сомнении о воскрешении, то ведь Мы создали вас из праха, потом из капли, потом из сгустка крови, потом из куска мяса, сформованного или бесформенного, чтобы разъяснить вам (это). И помещаем и в утробах, насколько захотим, до определенного срока. Потом выводим вас младенцем, потом - чтобы вы достигли вашей зрелости. Среди вас есть тот, кто упокояется, и среди вас есть тот, кто возвращается к жалчайшей жизни, чтобы не знать после знания ничего. И видишь ты землю бесплодной, а когда Мы низводим на нее воду, она приходит в движение и разбухает и выращивает всякие прекрасные пары.", "n": "Человек создан из праха, потом из капли, из сгустка, из куска — оформленного и неоформленного.", "c": null}, {"ref": "23:12-14", "sura": "Al-Muminoon", "sura_ar": "سُورَةُ المُؤۡمِنُونَ", "type": "Meccan", "ar": "وَلَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ مِن سُلَٰلَةٍۢ مِّن طِينٍۢ ﴿12﴾ ثُمَّ جَعَلْنَٰهُ نُطْفَةًۭ فِى قَرَارٍۢ مَّكِينٍۢ ﴿13﴾ ثُمَّ خَلَقْنَا ٱلنُّطْفَةَ عَلَقَةًۭ فَخَلَقْنَا ٱلْعَلَقَةَ مُضْغَةًۭ فَخَلَقْنَا ٱلْمُضْغَةَ عِظَٰمًۭا فَكَسَوْنَا ٱلْعِظَٰمَ لَحْمًۭا ثُمَّ أَنشَأْنَٰهُ خَلْقًا ءَاخَرَ ۚ فَتَبَارَكَ ٱللَّهُ أَحْسَنُ ٱلْخَٰلِقِينَ ﴿14﴾", "ru": "(12) Мы уже создали человека из эссенции глины, (13) потом поместили Мы его каплей в надежном месте, (14) потом создали из капли сгусток крови, и создали из сгустка крови кусок мяса, создали из этого куска кости и облекли кости мясом, потом Мы вырастили его в другом творении, - благословен же Аллах, лучший из творцов!", "n": "Из глины — капля — сгусток — кусок; Мы создали кусок костями, и одели кости мясом: кости появляются раньше мышц; эмбриология показывает одновременное развитие.", "c": "Апологеты видят в аяте научно точное описание; критики — следование представлениям Галена."}, {"ref": "32:7-9", "sura": "As-Sajda", "sura_ar": "سُورَةُ السَّجۡدَةِ", "type": "Meccan", "ar": "ٱلَّذِىٓ أَحْسَنَ كُلَّ شَىْءٍ خَلَقَهُۥ ۖ وَبَدَأَ خَلْقَ ٱلْإِنسَٰنِ مِن طِينٍۢ ﴿7﴾ ثُمَّ جَعَلَ نَسْلَهُۥ مِن سُلَٰلَةٍۢ مِّن مَّآءٍۢ مَّهِينٍۢ ﴿8﴾ ثُمَّ سَوَّىٰهُ وَنَفَخَ فِيهِ مِن رُّوحِهِۦ ۖ وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَٰرَ وَٱلْأَفْـِٔدَةَ ۚ قَلِيلًۭا مَّا تَشْكُرُونَ ﴿9﴾", "ru": "(7) который прекрасно сделал всякую вещь, которую сотворил, и начал творение человека из глины, (8) потом сделал потомство его из капли жалкой воды, (9) потом выровнял его и вдул в него от Своего духа и устроил вам слух, зрение и сердца. Мало вы благодарны!", "n": "Человек сотворён из глины, потом потомство — из вытяжки из презренной воды.", "c": null}, {"ref": "77:20-23", "sura": "Al-Mursalaat", "sura_ar": "سُورَةُ المُرۡسَلَاتِ", "type": "Meccan", "ar": "أَلَمْ نَخْلُقكُّم مِّن مَّآءٍۢ مَّهِينٍۢ ﴿20﴾ فَجَعَلْنَٰهُ فِى قَرَارٍۢ مَّكِينٍ ﴿21﴾ إِلَىٰ قَدَرٍۢ مَّعْلُومٍۢ ﴿22﴾ فَقَدَرْنَا فَنِعْمَ ٱلْقَٰدِرُونَ ﴿23﴾", "ru": "(20) Разве Мы не создали вас из воды ничтожной (21) и поместили ее в прочном месте (22) до известного срока? (23) Мы распределили, и как прекрасны распределяющие!", "n": "Разве Мы не создали вас из воды презренной и не поместили её в надёжное место?", "c": null}, {"ref": "39:6", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "خَلَقَكُم مِّن نَّفْسٍۢ وَٰحِدَةٍۢ ثُمَّ جَعَلَ مِنْهَا زَوْجَهَا وَأَنزَلَ لَكُم مِّنَ ٱلْأَنْعَٰمِ ثَمَٰنِيَةَ أَزْوَٰجٍۢ ۚ يَخْلُقُكُمْ فِى بُطُونِ أُمَّهَٰتِكُمْ خَلْقًۭا مِّنۢ بَعْدِ خَلْقٍۢ فِى ظُلُمَٰتٍۢ ثَلَٰثٍۢ ۚ ذَٰلِكُمُ ٱللَّهُ رَبُّكُمْ لَهُ ٱلْمُلْكُ ۖ لَآ إِلَٰهَ إِلَّا هُوَ ۖ فَأَنَّىٰ تُصْرَفُونَ ﴿6﴾", "ru": "Он сотворил вас из единой души, потом сделал из нее пару и ниспослал вам из животных восемь парами. Он творит вас в утробах ваших матерей, одним творением после другого в трех мраках. Это (для вас) - Аллах, ваш Господь; Ему принадлежит власть, нет божества, кроме Него; до чего же вы отвращены!", "n": "Бог создаёт вас в утробах матерей «в трёх мраках»; для людей Он низвёл восемь пар скота.", "c": null}, {"ref": "16:66", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَإِنَّ لَكُمْ فِى ٱلْأَنْعَٰمِ لَعِبْرَةًۭ ۖ نُّسْقِيكُم مِّمَّا فِى بُطُونِهِۦ مِنۢ بَيْنِ فَرْثٍۢ وَدَمٍۢ لَّبَنًا خَالِصًۭا سَآئِغًۭا لِّلشَّٰرِبِينَ ﴿66﴾", "ru": "Для вас и в (вашем) скоте - назидание. Мы поим вас из того, что у них в желудках между калом и кровью молоком чистым, приятным для пьющих.", "n": "В скоте — поучение: из того, что в чреве, между содержимым кишечника и кровью, Мы поим вас чистым молоком.", "c": "Апологеты видят точную физиологию; критики — неверное описание образования молока."}, {"ref": "16:68-69", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَأَوْحَىٰ رَبُّكَ إِلَى ٱلنَّحْلِ أَنِ ٱتَّخِذِى مِنَ ٱلْجِبَالِ بُيُوتًۭا وَمِنَ ٱلشَّجَرِ وَمِمَّا يَعْرِشُونَ ﴿68﴾ ثُمَّ كُلِى مِن كُلِّ ٱلثَّمَرَٰتِ فَٱسْلُكِى سُبُلَ رَبِّكِ ذُلُلًۭا ۚ يَخْرُجُ مِنۢ بُطُونِهَا شَرَابٌۭ مُّخْتَلِفٌ أَلْوَٰنُهُۥ فِيهِ شِفَآءٌۭ لِّلنَّاسِ ۗ إِنَّ فِى ذَٰلِكَ لَءَايَةًۭ لِّقَوْمٍۢ يَتَفَكَّرُونَ ﴿69﴾", "ru": "(68) И внушил Господь твой пчеле: \"Устраивай в горах дома, и на деревьях и в том, что они строят; (69) потом питайся всякими плодами и ходи по путям Господа твоего со смирением\". Выходит из внутренностей их питье разного цвета, в котором лечение для людей. Поистине, в этом - знамение для людей, которые размышляют!", "n": "Бог внушил пчеле строить жилища; из чрева пчёл выходит питьё разных цветов, в нём исцеление для людей.", "c": null}, {"ref": "6:38", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ وَلَا طَٰٓئِرٍۢ يَطِيرُ بِجَنَاحَيْهِ إِلَّآ أُمَمٌ أَمْثَالُكُم ۚ مَّا فَرَّطْنَا فِى ٱلْكِتَٰبِ مِن شَىْءٍۢ ۚ ثُمَّ إِلَىٰ رَبِّهِمْ يُحْشَرُونَ ﴿38﴾", "ru": "Нет животного на земле и птицы, летающей на крыльях, которые не были бы общинами, подобными вам. Мы не упустили в книге ничего, потом к вашему Господу они будут собраны.", "n": "Нет животного на земле и птицы, летающей на двух крыльях, которые не были бы общинами, подобными вам.", "c": null}, {"ref": "27:18-19", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "حَتَّىٰٓ إِذَآ أَتَوْا۟ عَلَىٰ وَادِ ٱلنَّمْلِ قَالَتْ نَمْلَةٌۭ يَٰٓأَيُّهَا ٱلنَّمْلُ ٱدْخُلُوا۟ مَسَٰكِنَكُمْ لَا يَحْطِمَنَّكُمْ سُلَيْمَٰنُ وَجُنُودُهُۥ وَهُمْ لَا يَشْعُرُونَ ﴿18﴾ فَتَبَسَّمَ ضَاحِكًۭا مِّن قَوْلِهَا وَقَالَ رَبِّ أَوْزِعْنِىٓ أَنْ أَشْكُرَ نِعْمَتَكَ ٱلَّتِىٓ أَنْعَمْتَ عَلَىَّ وَعَلَىٰ وَٰلِدَىَّ وَأَنْ أَعْمَلَ صَٰلِحًۭا تَرْضَىٰهُ وَأَدْخِلْنِى بِرَحْمَتِكَ فِى عِبَادِكَ ٱلصَّٰلِحِينَ ﴿19﴾", "ru": "(18) А когда они дошли до муравьиной долины, одна муравьиха сказала: \"О муравьи, войдите в ваше жилье, пусть не растопчет вас Сулайман и его войска, не замечая этого\". (19) Он улыбнулся, засмеявшись от ее слов, и сказал: \"Господи, внуши мне быть благодарным за Твою милость, которую Ты ниспослал мне и моим родителям, и чтобы я делал благо, которое Тебе угодно, и введи меня Твоей милостью в число рабов Твоих праведных!\"", "n": "Муравей разговаривает с другими муравьями, предупреждая о войске Сулеймана; Сулейман улыбнулся, смеясь над её словами.", "c": null}, {"ref": "27:20-24", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "وَتَفَقَّدَ ٱلطَّيْرَ فَقَالَ مَا لِىَ لَآ أَرَى ٱلْهُدْهُدَ أَمْ كَانَ مِنَ ٱلْغَآئِبِينَ ﴿20﴾ لَأُعَذِّبَنَّهُۥ عَذَابًۭا شَدِيدًا أَوْ لَأَا۟ذْبَحَنَّهُۥٓ أَوْ لَيَأْتِيَنِّى بِسُلْطَٰنٍۢ مُّبِينٍۢ ﴿21﴾ فَمَكَثَ غَيْرَ بَعِيدٍۢ فَقَالَ أَحَطتُ بِمَا لَمْ تُحِطْ بِهِۦ وَجِئْتُكَ مِن سَبَإٍۭ بِنَبَإٍۢ يَقِينٍ ﴿22﴾ إِنِّى وَجَدتُّ ٱمْرَأَةًۭ تَمْلِكُهُمْ وَأُوتِيَتْ مِن كُلِّ شَىْءٍۢ وَلَهَا عَرْشٌ عَظِيمٌۭ ﴿23﴾ وَجَدتُّهَا وَقَوْمَهَا يَسْجُدُونَ لِلشَّمْسِ مِن دُونِ ٱللَّهِ وَزَيَّنَ لَهُمُ ٱلشَّيْطَٰنُ أَعْمَٰلَهُمْ فَصَدَّهُمْ عَنِ ٱلسَّبِيلِ فَهُمْ لَا يَهْتَدُونَ ﴿24﴾", "ru": "(20) И он стал разыскивать птиц и сказал: \"Почему это я не вижу удода? Или он отсутствует? (21) Я накажу его наказанием сильным, или убью его, или он придет ко мне с явной властью\". (22) Тот пробыл недолго и сказал: \"Я узнал то, чего ты не знаешь, и пришел к тебе от Сабы с верным известием. (23) Я нашел женщину, которая ими правит, и даровано ей все, и у нее великий трон. (24) Я нашел, что она и ее народ поклоняются солнцу вместо Аллаха, и сатана разукрасил им их деяния и отвратил их с пути, и они не идут прямо, -", "n": "Удод отлучается от Сулеймана и приносит вести о царице Сабы, поклоняющейся солнцу.", "c": null}, {"ref": "86:6-7", "sura": "At-Taariq", "sura_ar": "سُورَةُ الطَّارِقِ", "type": "Meccan", "ar": "خُلِقَ مِن مَّآءٍۢ دَافِقٍۢ ﴿6﴾ يَخْرُجُ مِنۢ بَيْنِ ٱلصُّلْبِ وَٱلتَّرَآئِبِ ﴿7﴾", "ru": "(6) Создан из воды изливающейся. (7) Выходит она из хребта и грудных костей.", "n": "Человек создан из воды изливающейся, выходящей из хребта и грудных костей.", "c": "Апологеты предлагают толкования с эмбриональным происхождением половых желёз; но текст прямо говорит о хребте и рёбрах."}, {"ref": "29:14", "sura": "Al-Ankaboot", "sura_ar": "سُورَةُ العَنكَبُوتِ", "type": "Meccan", "ar": "وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِۦ فَلَبِثَ فِيهِمْ أَلْفَ سَنَةٍ إِلَّا خَمْسِينَ عَامًۭا فَأَخَذَهُمُ ٱلطُّوفَانُ وَهُمْ ظَٰلِمُونَ ﴿14﴾", "ru": "Мы посылали уже Нуха к его народу, и он пребывал среди них тысячу лет без пятидесяти годов и постиг их потоп, а были они неправедными.", "n": "Нух жил среди своего народа «тысячу лет без пятидесяти».", "c": null}, {"ref": "24:45", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "وَٱللَّهُ خَلَقَ كُلَّ دَآبَّةٍۢ مِّن مَّآءٍۢ ۖ فَمِنْهُم مَّن يَمْشِى عَلَىٰ بَطْنِهِۦ وَمِنْهُم مَّن يَمْشِى عَلَىٰ رِجْلَيْنِ وَمِنْهُم مَّن يَمْشِى عَلَىٰٓ أَرْبَعٍۢ ۚ يَخْلُقُ ٱللَّهُ مَا يَشَآءُ ۚ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿45﴾", "ru": "Аллах сотворил всякое животное из воды. Из них есть такие, что ходят на животе, и есть из них такие, что ходят на двух ногах, и есть из них такие, что ходят на четырех. Творит Аллах, что пожелает. Ведь Аллах над всякой вещью мощен!", "n": "Аллах сотворил каждое животное из воды.", "c": null}, {"ref": "18:25", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَلَبِثُوا۟ فِى كَهْفِهِمْ ثَلَٰثَ مِا۟ئَةٍۢ سِنِينَ وَٱزْدَادُوا۟ تِسْعًۭا ﴿25﴾", "ru": "И оставались они в пещере своей триста лет и прибавили еще девять.", "n": "Спутники пещеры пробыли в своей пещере триста лет и ещё прибавили девять — сон длиной в 309 лет.", "c": null}]}, {"id": "eschat", "title": "Конец света и воскрешение", "icon": "⏳", "group": "Природа, наука и сверхъестественное", "intro": "Описание конца света и воскрешения, связанные с космологией аятов. Критики отмечают, что в них солнце, звёзды и горы ведут себя так, как это было бы возможно только в рамках древней картины мира.", "verses": [{"ref": "81:1-14", "sura": "At-Takwir", "sura_ar": "سُورَةُ التَّكۡوِيرِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ إِذَا ٱلشَّمْسُ كُوِّرَتْ ﴿1﴾ وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتْ ﴿2﴾ وَإِذَا ٱلْجِبَالُ سُيِّرَتْ ﴿3﴾ وَإِذَا ٱلْعِشَارُ عُطِّلَتْ ﴿4﴾ وَإِذَا ٱلْوُحُوشُ حُشِرَتْ ﴿5﴾ وَإِذَا ٱلْبِحَارُ سُجِّرَتْ ﴿6﴾ وَإِذَا ٱلنُّفُوسُ زُوِّجَتْ ﴿7﴾ وَإِذَا ٱلْمَوْءُۥدَةُ سُئِلَتْ ﴿8﴾ بِأَىِّ ذَنۢبٍۢ قُتِلَتْ ﴿9﴾ وَإِذَا ٱلصُّحُفُ نُشِرَتْ ﴿10﴾ وَإِذَا ٱلسَّمَآءُ كُشِطَتْ ﴿11﴾ وَإِذَا ٱلْجَحِيمُ سُعِّرَتْ ﴿12﴾ وَإِذَا ٱلْجَنَّةُ أُزْلِفَتْ ﴿13﴾ عَلِمَتْ نَفْسٌۭ مَّآ أَحْضَرَتْ ﴿14﴾", "ru": "(1) Когда солнце будет скручено, (2) и когда звезды облетят. (3) и когда горы сдвинутся с мест. (4) и когда десять месяцев беременные верблюдицы будут без присмотра, (5) и когда животные соберутся. (6) и когда моря перельются, (7) и когда души соединятся, (8) и когда зарытая живьем будет спрошена, (9) за какой грех она была убита, (10) и когда свитки развернутся, (11) и когда небо будет сдернуто. (12) и когда ад будет разожжен, (13) и когда рай будет приближен, - (14) узнает душа, что она приготовила.", "n": "«Когда солнце будет скручено, и когда звёзды облетят, и когда горы сдвинутся с мест… и когда небо будет сдёрнуто… узнает душа, что она приготовила».", "c": null}, {"ref": "21:104", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "يَوْمَ نَطْوِى ٱلسَّمَآءَ كَطَىِّ ٱلسِّجِلِّ لِلْكُتُبِ ۚ كَمَا بَدَأْنَآ أَوَّلَ خَلْقٍۢ نُّعِيدُهُۥ ۚ وَعْدًا عَلَيْنَآ ۚ إِنَّا كُنَّا فَٰعِلِينَ ﴿104﴾", "ru": "В тот день, когда Мы скрутим небо, как писец свертывает свитки; как Мы создали первое творение, так Мы его повторим по обещанию от Нас. Поистине, Мы действуем!", "n": null, "c": null}, {"ref": "39:67", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "وَمَا قَدَرُوا۟ ٱللَّهَ حَقَّ قَدْرِهِۦ وَٱلْأَرْضُ جَمِيعًۭا قَبْضَتُهُۥ يَوْمَ ٱلْقِيَٰمَةِ وَٱلسَّمَٰوَٰتُ مَطْوِيَّٰتٌۢ بِيَمِينِهِۦ ۚ سُبْحَٰنَهُۥ وَتَعَٰلَىٰ عَمَّا يُشْرِكُونَ ﴿67﴾", "ru": "И не ценили они Аллаха истинной ценой, а земля вся в Его руке в день воскресения, и небеса скручены Его десницей. Хвала Ему, и превыше Он того, что они придают Ему в соучастники!", "n": null, "c": null}, {"ref": "27:82", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "۞ وَإِذَا وَقَعَ ٱلْقَوْلُ عَلَيْهِمْ أَخْرَجْنَا لَهُمْ دَآبَّةًۭ مِّنَ ٱلْأَرْضِ تُكَلِّمُهُمْ أَنَّ ٱلنَّاسَ كَانُوا۟ بِـَٔايَٰتِنَا لَا يُوقِنُونَ ﴿82﴾", "ru": "А когда падет на них слово, Мы выведем им животное из земли, которое заговорит с ними - люди, которые не были убеждены в Наших знамениях.", "n": "Когда осуществится слово над ними, Мы выведем для них из земли животное, которое будет говорить с ними.", "c": null}, {"ref": "18:99", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "۞ وَتَرَكْنَا بَعْضَهُمْ يَوْمَئِذٍۢ يَمُوجُ فِى بَعْضٍۢ ۖ وَنُفِخَ فِى ٱلصُّورِ فَجَمَعْنَٰهُمْ جَمْعًۭا ﴿99﴾", "ru": "И оставим Мы их тогда препираться друг с другом и подуют в трубу, и соберем Мы их воедино.", "n": "В конце времён Мы оставим одних из них волноваться, как волны, друг на друга и затрубят в рог.", "c": null}, {"ref": "69:13-18", "sura": "Al-Haaqqa", "sura_ar": "سُورَةُ الحَاقَّةِ", "type": "Meccan", "ar": "فَإِذَا نُفِخَ فِى ٱلصُّورِ نَفْخَةٌۭ وَٰحِدَةٌۭ ﴿13﴾ وَحُمِلَتِ ٱلْأَرْضُ وَٱلْجِبَالُ فَدُكَّتَا دَكَّةًۭ وَٰحِدَةًۭ ﴿14﴾ فَيَوْمَئِذٍۢ وَقَعَتِ ٱلْوَاقِعَةُ ﴿15﴾ وَٱنشَقَّتِ ٱلسَّمَآءُ فَهِىَ يَوْمَئِذٍۢ وَاهِيَةٌۭ ﴿16﴾ وَٱلْمَلَكُ عَلَىٰٓ أَرْجَآئِهَا ۚ وَيَحْمِلُ عَرْشَ رَبِّكَ فَوْقَهُمْ يَوْمَئِذٍۢ ثَمَٰنِيَةٌۭ ﴿17﴾ يَوْمَئِذٍۢ تُعْرَضُونَ لَا تَخْفَىٰ مِنكُمْ خَافِيَةٌۭ ﴿18﴾", "ru": "(13) И когда дунут в трубу единым дуновением, (14) и спасена будет земля и горы, и раздроблены единым дроблением, - (15) вот в тот день падет падающее, (16) и небо расколется, и будет оно в тот день слабым. (17) И ангелы по краям его, и понесут трон Господа твоего над ними в тот день восемь. (18) В тот день вы будете выставлены, и не утаится у вас тайное.", "n": "Когда затрубят в рог один раз, и земля и горы будут подняты и разбиты одним ударом… в тот день вы будете представлены.", "c": null}, {"ref": "39:68", "sura": "Az-Zumar", "sura_ar": "سُورَةُ الزُّمَرِ", "type": "Meccan", "ar": "وَنُفِخَ فِى ٱلصُّورِ فَصَعِقَ مَن فِى ٱلسَّمَٰوَٰتِ وَمَن فِى ٱلْأَرْضِ إِلَّا مَن شَآءَ ٱللَّهُ ۖ ثُمَّ نُفِخَ فِيهِ أُخْرَىٰ فَإِذَا هُمْ قِيَامٌۭ يَنظُرُونَ ﴿68﴾", "ru": "И протрубят в трубу и поражены будут, как молнией, те, кто в небесах, и те, кто на земле, кроме тех, кого пожелает Аллах. Потом протрубят вторично, и вот - они стоя смотрят.", "n": null, "c": null}, {"ref": "44:10-11", "sura": "Ad-Dukhaan", "sura_ar": "سُورَةُ الدُّخَانِ", "type": "Meccan", "ar": "فَٱرْتَقِبْ يَوْمَ تَأْتِى ٱلسَّمَآءُ بِدُخَانٍۢ مُّبِينٍۢ ﴿10﴾ يَغْشَى ٱلنَّاسَ ۖ هَٰذَا عَذَابٌ أَلِيمٌۭ ﴿11﴾", "ru": "(10) Подожди же дня, когда небо изведет явный дым. (11) Он покроет людей; это - мучительное наказание!", "n": "Жди дня, когда небо принесёт явный дым, окутывающий людей.", "c": null}, {"ref": "50:22", "sura": "Qaaf", "sura_ar": "سُورَةُ قٓ", "type": "Meccan", "ar": "لَّقَدْ كُنتَ فِى غَفْلَةٍۢ مِّنْ هَٰذَا فَكَشَفْنَا عَنكَ غِطَآءَكَ فَبَصَرُكَ ٱلْيَوْمَ حَدِيدٌۭ ﴿22﴾", "ru": "Был ты в небрежении об этом, и Мы сняли с тебя твой покров, и взор твой сегодня остр.", "n": "Мы сняли с тебя твою завесу, и твой взор сегодня остр — о воскрешении.", "c": null}]}, {"id": "paradise", "title": "Рай: награды праведников", "icon": "🌴", "group": "Природа, наука и сверхъестественное", "intro": "Описания рая: реки вина, юноши-прислужники и девы — «хури» и «сверстницы». Критики указывают на мужское обращение и на то, что для женщин праведных описания награды нет; апологеты — на духовные награды рая (например 9:72, 57:21).", "verses": [{"ref": "2:25", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَبَشِّرِ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمْ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ ۖ كُلَّمَا رُزِقُوا۟ مِنْهَا مِن ثَمَرَةٍۢ رِّزْقًۭا ۙ قَالُوا۟ هَٰذَا ٱلَّذِى رُزِقْنَا مِن قَبْلُ ۖ وَأُتُوا۟ بِهِۦ مُتَشَٰبِهًۭا ۖ وَلَهُمْ فِيهَآ أَزْوَٰجٌۭ مُّطَهَّرَةٌۭ ۖ وَهُمْ فِيهَا خَٰلِدُونَ ﴿25﴾", "ru": "И обрадуй тех, которые уверовали и творили благое, что для них - сады, где внизу текут реки. Всякий раз, как им даются в удел оттуда какие-нибудь плоды, они говорят: \"Это - то, что было даровано нам раньше\", - тогда как им доставлено только сходное. Для них там - супруги чистые, и они там будут пребывать вечно.", "n": "Праведным в раю — чистые супруги.", "c": null}, {"ref": "37:41-49", "sura": "As-Saaffaat", "sura_ar": "سُورَةُ الصَّافَّاتِ", "type": "Meccan", "ar": "أُو۟لَٰٓئِكَ لَهُمْ رِزْقٌۭ مَّعْلُومٌۭ ﴿41﴾ فَوَٰكِهُ ۖ وَهُم مُّكْرَمُونَ ﴿42﴾ فِى جَنَّٰتِ ٱلنَّعِيمِ ﴿43﴾ عَلَىٰ سُرُرٍۢ مُّتَقَٰبِلِينَ ﴿44﴾ يُطَافُ عَلَيْهِم بِكَأْسٍۢ مِّن مَّعِينٍۭ ﴿45﴾ بَيْضَآءَ لَذَّةٍۢ لِّلشَّٰرِبِينَ ﴿46﴾ لَا فِيهَا غَوْلٌۭ وَلَا هُمْ عَنْهَا يُنزَفُونَ ﴿47﴾ وَعِندَهُمْ قَٰصِرَٰتُ ٱلطَّرْفِ عِينٌۭ ﴿48﴾ كَأَنَّهُنَّ بَيْضٌۭ مَّكْنُونٌۭ ﴿49﴾", "ru": "(41) Для тех - определенный надел - (42) плоды, и они будут в почете (43) в садах благоденствия, (44) на ложах друг против друга. (45) Будет обходить их с чашей из источника (46) прозрачного, услады для пьющих. (47) Нет в нем буйства, и не будут они им изнурены. (48) У них есть потупившие взоры, глазастые, (49) точно охраняемые яйца.", "n": "Для избранных — «определённый надел»; «у них есть потупившие взоры, глазастые, точно охраняемые яйца».", "c": null}, {"ref": "38:52", "sura": "Saad", "sura_ar": "سُورَةُ صٓ", "type": "Meccan", "ar": "۞ وَعِندَهُمْ قَٰصِرَٰتُ ٱلطَّرْفِ أَتْرَابٌ ﴿52﴾", "ru": "И у них есть с потупленными взорами, ровесницы.", "n": null, "c": null}, {"ref": "44:51-55", "sura": "Ad-Dukhaan", "sura_ar": "سُورَةُ الدُّخَانِ", "type": "Meccan", "ar": "إِنَّ ٱلْمُتَّقِينَ فِى مَقَامٍ أَمِينٍۢ ﴿51﴾ فِى جَنَّٰتٍۢ وَعُيُونٍۢ ﴿52﴾ يَلْبَسُونَ مِن سُندُسٍۢ وَإِسْتَبْرَقٍۢ مُّتَقَٰبِلِينَ ﴿53﴾ كَذَٰلِكَ وَزَوَّجْنَٰهُم بِحُورٍ عِينٍۢ ﴿54﴾ يَدْعُونَ فِيهَا بِكُلِّ فَٰكِهَةٍ ءَامِنِينَ ﴿55﴾", "ru": "(51) Поистине, богобоязненные - в месте надежном, (52) среди садов и источников, (53) облекаются они в атлас и парчу, друг против друга. (54) Так! И сопрягли Мы их с черноглазыми, большеокими. (55) Требуют они там всякие плоды в безопасности.", "n": "«Сопрягли Мы их с черноглазыми, большеокими»; там требуют они всякие плоды в безопасности.", "c": null}, {"ref": "47:15", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "مَّثَلُ ٱلْجَنَّةِ ٱلَّتِى وُعِدَ ٱلْمُتَّقُونَ ۖ فِيهَآ أَنْهَٰرٌۭ مِّن مَّآءٍ غَيْرِ ءَاسِنٍۢ وَأَنْهَٰرٌۭ مِّن لَّبَنٍۢ لَّمْ يَتَغَيَّرْ طَعْمُهُۥ وَأَنْهَٰرٌۭ مِّنْ خَمْرٍۢ لَّذَّةٍۢ لِّلشَّٰرِبِينَ وَأَنْهَٰرٌۭ مِّنْ عَسَلٍۢ مُّصَفًّۭى ۖ وَلَهُمْ فِيهَا مِن كُلِّ ٱلثَّمَرَٰتِ وَمَغْفِرَةٌۭ مِّن رَّبِّهِمْ ۖ كَمَنْ هُوَ خَٰلِدٌۭ فِى ٱلنَّارِ وَسُقُوا۟ مَآءً حَمِيمًۭا فَقَطَّعَ أَمْعَآءَهُمْ ﴿15﴾", "ru": "Образ сада, который обещан богобоязненным: там - реки из воды не портящейся и реки из молока, вкус которого не меняется, и реки из вина, приятного для пьющих, и реки из меду очищенного. И для них там всякие плоды и прощение от их Господа. ...Как тот, кто вечно пребывает в огне и кого поят кипящей водой, и она рассекает их внутренности.", "n": "В раю — реки воды, молока, «вина, приятного для пьющих» и мёда.", "c": "Вино запрещено в этом мире (5:90), но в раю допустимо и приятно."}, {"ref": "52:20-24", "sura": "At-Tur", "sura_ar": "سُورَةُ الطُّورِ", "type": "Meccan", "ar": "مُتَّكِـِٔينَ عَلَىٰ سُرُرٍۢ مَّصْفُوفَةٍۢ ۖ وَزَوَّجْنَٰهُم بِحُورٍ عِينٍۢ ﴿20﴾ وَٱلَّذِينَ ءَامَنُوا۟ وَٱتَّبَعَتْهُمْ ذُرِّيَّتُهُم بِإِيمَٰنٍ أَلْحَقْنَا بِهِمْ ذُرِّيَّتَهُمْ وَمَآ أَلَتْنَٰهُم مِّنْ عَمَلِهِم مِّن شَىْءٍۢ ۚ كُلُّ ٱمْرِئٍۭ بِمَا كَسَبَ رَهِينٌۭ ﴿21﴾ وَأَمْدَدْنَٰهُم بِفَٰكِهَةٍۢ وَلَحْمٍۢ مِّمَّا يَشْتَهُونَ ﴿22﴾ يَتَنَٰزَعُونَ فِيهَا كَأْسًۭا لَّا لَغْوٌۭ فِيهَا وَلَا تَأْثِيمٌۭ ﴿23﴾ ۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌۭ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌۭ مَّكْنُونٌۭ ﴿24﴾", "ru": "(20) возлежа на ложах, расставленных рядами. И Мы сочетаем их с черноглазыми, большеокими. (21) А те, которые уверовали и последовало за ними их потомство в вере, - Мы приведем к ним потомство их и не сбавим из дел их ничего. Всякий человек того, что он приобрел, заложник. (22) И снабдим Мы их плодами и мясом из того, что они пожелают. (23) Они передают одни другим кубок, - нет пустословья там и побуждения к греху. (24) И обходят их юноши, точно они сокровенный жемчуг.", "n": "Облокотившись на ложа в рядах, «Мы сочетаем их с черноглазыми, большеокими»; вокруг обходят «юноши, точно они сокровенный жемчуг».", "c": null}, {"ref": "55:56", "sura": "Ar-Rahmaan", "sura_ar": "سُورَةُ الرَّحۡمَٰن", "type": "Medinan", "ar": "فِيهِنَّ قَٰصِرَٰتُ ٱلطَّرْفِ لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ ﴿56﴾", "ru": "Там скромноокие, которых не коснулся до них ни человек, ни джинн.", "n": "В садах — «скромноокие, которых не коснулся до них ни человек, ни джинн».", "c": null}, {"ref": "55:70-74", "sura": "Ar-Rahmaan", "sura_ar": "سُورَةُ الرَّحۡمَٰن", "type": "Medinan", "ar": "فِيهِنَّ خَيْرَٰتٌ حِسَانٌۭ ﴿70﴾ فَبِأَىِّ ءَالَآءِ رَبِّكُمَا تُكَذِّبَانِ ﴿71﴾ حُورٌۭ مَّقْصُورَٰتٌۭ فِى ٱلْخِيَامِ ﴿72﴾ فَبِأَىِّ ءَالَآءِ رَبِّكُمَا تُكَذِّبَانِ ﴿73﴾ لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ ﴿74﴾", "ru": "(70) В них - добротные, прекрасные, - (71) Какое же из благодеяний Господа вашего вы сочтете ложным? - (72) черноокие, скрытые в шатрах, - (73) Какое же из благодеяний Господа вашего вы сочтете ложным? (74) Не коснулся их до них ни человек, ни джинны, -", "n": "«В них — добротные, прекрасные… черноокие, скрытые в шатрах» (55:70-72).", "c": null}, {"ref": "56:17-26", "sura": "Al-Waaqia", "sura_ar": "سُورَةُ الوَاقِعَةِ", "type": "Meccan", "ar": "يَطُوفُ عَلَيْهِمْ وِلْدَٰنٌۭ مُّخَلَّدُونَ ﴿17﴾ بِأَكْوَابٍۢ وَأَبَارِيقَ وَكَأْسٍۢ مِّن مَّعِينٍۢ ﴿18﴾ لَّا يُصَدَّعُونَ عَنْهَا وَلَا يُنزِفُونَ ﴿19﴾ وَفَٰكِهَةٍۢ مِّمَّا يَتَخَيَّرُونَ ﴿20﴾ وَلَحْمِ طَيْرٍۢ مِّمَّا يَشْتَهُونَ ﴿21﴾ وَحُورٌ عِينٌۭ ﴿22﴾ كَأَمْثَٰلِ ٱللُّؤْلُؤِ ٱلْمَكْنُونِ ﴿23﴾ جَزَآءًۢ بِمَا كَانُوا۟ يَعْمَلُونَ ﴿24﴾ لَا يَسْمَعُونَ فِيهَا لَغْوًۭا وَلَا تَأْثِيمًا ﴿25﴾ إِلَّا قِيلًۭا سَلَٰمًۭا سَلَٰمًۭا ﴿26﴾", "ru": "(17) Обходят их мальчики вечно юные (18) с чашами, сосудами и кубками из текущего источника - (19) от него не страдают головной болью и ослаблением - (20) и плодами из тех, что они выберут, (21) и мясом птиц из тех, что пожелают. (22) А черноокие, большеглазые, (23) подобные жемчугу хранимому - (24) в воздаяние за то, что они делали. (25) Не услышат они там пустословия и укоров в грехе, (26) а лишь слова: \"Мир, мир!\"", "n": "Вокруг праведных обходят «мальчики вечно юные» с кубками, вино без головной боли и опьянения; «черноокие, большеглазые, подобные жемчугу хранимому».", "c": null}, {"ref": "56:35-38", "sura": "Al-Waaqia", "sura_ar": "سُورَةُ الوَاقِعَةِ", "type": "Meccan", "ar": "إِنَّآ أَنشَأْنَٰهُنَّ إِنشَآءًۭ ﴿35﴾ فَجَعَلْنَٰهُنَّ أَبْكَارًا ﴿36﴾ عُرُبًا أَتْرَابًۭا ﴿37﴾ لِّأَصْحَٰبِ ٱلْيَمِينِ ﴿38﴾", "ru": "(35) Мы ведь создали их творением (36) и сделали их девственницами, (37) мужа любящими, сверстницами (38) для владык правой стороны.", "n": null, "c": null}, {"ref": "76:19", "sura": "Al-Insaan", "sura_ar": "سُورَةُ الإِنسَانِ", "type": "Medinan", "ar": "۞ وَيَطُوفُ عَلَيْهِمْ وِلْدَٰنٌۭ مُّخَلَّدُونَ إِذَا رَأَيْتَهُمْ حَسِبْتَهُمْ لُؤْلُؤًۭا مَّنثُورًۭا ﴿19﴾", "ru": "И обходят их отроки вечные, - когда увидишь их, сочтешь за рассыпанный жемчуг.", "n": null, "c": null}, {"ref": "78:31-33", "sura": "An-Naba", "sura_ar": "سُورَةُ النَّبَإِ", "type": "Meccan", "ar": "إِنَّ لِلْمُتَّقِينَ مَفَازًا ﴿31﴾ حَدَآئِقَ وَأَعْنَٰبًۭا ﴿32﴾ وَكَوَاعِبَ أَتْرَابًۭا ﴿33﴾", "ru": "(31) Ведь для богобоязненных есть место спасения (32) сады и виноградники, (33) и полногрудые сверстницы,", "n": "Для богобоязненных — «сады и виноградники, и полногрудые сверстницы».", "c": null}]}, {"id": "odd", "title": "Странные и сомнительные утверждения", "icon": "?", "group": "Природа, наука и сверхъестественное", "intro": "Места, которые критики называют нелепыми, наивными или легендарными. Чаще всего это чудеса, пересказы древних историй и образы, которые трудно понять буквально.", "verses": [{"ref": "2:67-73", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِۦٓ إِنَّ ٱللَّهَ يَأْمُرُكُمْ أَن تَذْبَحُوا۟ بَقَرَةًۭ ۖ قَالُوٓا۟ أَتَتَّخِذُنَا هُزُوًۭا ۖ قَالَ أَعُوذُ بِٱللَّهِ أَنْ أَكُونَ مِنَ ٱلْجَٰهِلِينَ ﴿67﴾ قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا هِىَ ۚ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌۭ لَّا فَارِضٌۭ وَلَا بِكْرٌ عَوَانٌۢ بَيْنَ ذَٰلِكَ ۖ فَٱفْعَلُوا۟ مَا تُؤْمَرُونَ ﴿68﴾ قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا لَوْنُهَا ۚ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌۭ صَفْرَآءُ فَاقِعٌۭ لَّوْنُهَا تَسُرُّ ٱلنَّٰظِرِينَ ﴿69﴾ قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا هِىَ إِنَّ ٱلْبَقَرَ تَشَٰبَهَ عَلَيْنَا وَإِنَّآ إِن شَآءَ ٱللَّهُ لَمُهْتَدُونَ ﴿70﴾ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌۭ لَّا ذَلُولٌۭ تُثِيرُ ٱلْأَرْضَ وَلَا تَسْقِى ٱلْحَرْثَ مُسَلَّمَةٌۭ لَّا شِيَةَ فِيهَا ۚ قَالُوا۟ ٱلْـَٰٔنَ جِئْتَ بِٱلْحَقِّ ۚ فَذَبَحُوهَا وَمَا كَادُوا۟ يَفْعَلُونَ ﴿71﴾ وَإِذْ قَتَلْتُمْ نَفْسًۭا فَٱدَّٰرَْٰٔتُمْ فِيهَا ۖ وَٱللَّهُ مُخْرِجٌۭ مَّا كُنتُمْ تَكْتُمُونَ ﴿72﴾ فَقُلْنَا ٱضْرِبُوهُ بِبَعْضِهَا ۚ كَذَٰلِكَ يُحْىِ ٱللَّهُ ٱلْمَوْتَىٰ وَيُرِيكُمْ ءَايَٰتِهِۦ لَعَلَّكُمْ تَعْقِلُونَ ﴿73﴾", "ru": "(67) И вот сказал Муса своему народу: \"Вот, Аллах приказывает вам заколоть корову\". Они сказали: \"Не обращаешь ли ты нас в насмешку?\" Он сказал: \"К Аллаху я прибегаю, чтобы не оказаться глупцом!\". (68) Они сказали: \"Призови для нас твоего Господа, чтобы Он разъяснил нам, какова она\". Он сказал: \"Вот, Он говорит: \"Она - корова, не старая и не телка, средняя по возрасту между этим\". Делайте же то, что вам приказано!\" (69) Они сказали: \"Призови для нас твоего Господа, чтобы Он разъяснил нам, каков ее цвет\". Он сказал: \"Вот, Он говорит: \"Она - корова желтая, светел цвет ее, радует она смотрящих\"\". (70) Они сказали: \"Призови для нас твоего Господа, чтобы Он разъяснил нам, какова она: ведь коровы похожи для нас одна на другую, и мы будем, если пожелает Аллах, на верном пути\". (71) Он сказал: \"Вот, Он говорит: \"Она - корова не укрощенная, которая пашет землю, и не орошает пашню, она сохранена в целости, нет отметины на ней\". Они сказали: \"Теперь ты доставил истину\". И они закололи ее, хотя готовы были не сделать этого. (72) И вот вы убили душу и препирались о ней, а Аллах изводит то, что вы скрывали. (73) И Мы сказали: \"Ударьте его чем-нибудь от нее\". Так оживляет Аллах мертвых и показывает вам Его знамения, - может быть, вы уразумеете!", "n": "Приказ зарезать корову и ударить убитого её куском, чтобы он ожил и назвал убийцу; в рассказе много споров о масти и возрасте коровы.", "c": null}, {"ref": "2:259", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "أَوْ كَٱلَّذِى مَرَّ عَلَىٰ قَرْيَةٍۢ وَهِىَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا قَالَ أَنَّىٰ يُحْىِۦ هَٰذِهِ ٱللَّهُ بَعْدَ مَوْتِهَا ۖ فَأَمَاتَهُ ٱللَّهُ مِا۟ئَةَ عَامٍۢ ثُمَّ بَعَثَهُۥ ۖ قَالَ كَمْ لَبِثْتَ ۖ قَالَ لَبِثْتُ يَوْمًا أَوْ بَعْضَ يَوْمٍۢ ۖ قَالَ بَل لَّبِثْتَ مِا۟ئَةَ عَامٍۢ فَٱنظُرْ إِلَىٰ طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْ ۖ وَٱنظُرْ إِلَىٰ حِمَارِكَ وَلِنَجْعَلَكَ ءَايَةًۭ لِّلنَّاسِ ۖ وَٱنظُرْ إِلَى ٱلْعِظَامِ كَيْفَ نُنشِزُهَا ثُمَّ نَكْسُوهَا لَحْمًۭا ۚ فَلَمَّا تَبَيَّنَ لَهُۥ قَالَ أَعْلَمُ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿259﴾", "ru": "Или как тот, кто проходил мимо селения, а оно было разрушено до оснований. Он сказал: \"Как оживит это Аллах, после того как оно умерло?\" И умертвил его Аллах на сто лет, потом воскресил. Он сказал: \"Сколько ты пробыл?\" Тот сказал: \"Пробыл я день или часть дня\". Он сказал: \"Нет, ты пробыл сто лет! И посмотри на твою пищу и питье, оно не испортилось. И посмотри на своего осла - для того, чтобы Нам сделать тебя знамением для людей, - посмотри на кости, как мы их поднимаем, а потом одеваем мясом\". И когда стало ему ясно, он сказал: \"Я знаю, что Аллах мощен над всякой вещью!\"", "n": "Человека Бог умертвил на сто лет и воскресил; его осёл за это время истлел, а еда не испортилась.", "c": null}, {"ref": "2:260", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ إِبْرَٰهِۦمُ رَبِّ أَرِنِى كَيْفَ تُحْىِ ٱلْمَوْتَىٰ ۖ قَالَ أَوَلَمْ تُؤْمِن ۖ قَالَ بَلَىٰ وَلَٰكِن لِّيَطْمَئِنَّ قَلْبِى ۖ قَالَ فَخُذْ أَرْبَعَةًۭ مِّنَ ٱلطَّيْرِ فَصُرْهُنَّ إِلَيْكَ ثُمَّ ٱجْعَلْ عَلَىٰ كُلِّ جَبَلٍۢ مِّنْهُنَّ جُزْءًۭا ثُمَّ ٱدْعُهُنَّ يَأْتِينَكَ سَعْيًۭا ۚ وَٱعْلَمْ أَنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌۭ ﴿260﴾", "ru": "И вот сказал Ибрахим: \"Господи! Покажи мне, как Ты оживляешь мертвых\". Он сказал: \"А разве ты не уверовал?\" Тот сказал: \"Да! Но чтобы сердце мое успокоилось\". Сказал Он: \"Возьми же четырех птиц, собери их к себе, потом помести на каждой горе по части их, а потом позови их: они явятся к тебе стремительно, и знай, что Аллах велик и мудр!\"", "n": "Ибрахим просит показать воскрешение: берёт четырёх птиц, рассекает их, части кладёт на горы, и птицы прилетают живыми.", "c": null}, {"ref": "105:3-5", "sura": "Al-Fil", "sura_ar": "سُورَةُ الفِيلِ", "type": "Meccan", "ar": "وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ ﴿3﴾ تَرْمِيهِم بِحِجَارَةٍۢ مِّن سِجِّيلٍۢ ﴿4﴾ فَجَعَلَهُمْ كَعَصْفٍۢ مَّأْكُولٍۭ ﴿5﴾", "ru": "(3) И послал Он на них птиц стаями? (4) Бросали они в них камни из обожженной глины. (5) И сделал Он их точно нива со съеденными зернами.", "n": "Птицы стаями бросали в войско слона камни из обожжённой глины и сделали их «точно нива со съеденными зёрнами».", "c": null}, {"ref": "74:30-31", "sura": "Al-Muddaththir", "sura_ar": "سُورَةُ المُدَّثِّرِ", "type": "Meccan", "ar": "عَلَيْهَا تِسْعَةَ عَشَرَ ﴿30﴾ وَمَا جَعَلْنَآ أَصْحَٰبَ ٱلنَّارِ إِلَّا مَلَٰٓئِكَةًۭ ۙ وَمَا جَعَلْنَا عِدَّتَهُمْ إِلَّا فِتْنَةًۭ لِّلَّذِينَ كَفَرُوا۟ لِيَسْتَيْقِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ وَيَزْدَادَ ٱلَّذِينَ ءَامَنُوٓا۟ إِيمَٰنًۭا ۙ وَلَا يَرْتَابَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ وَٱلْمُؤْمِنُونَ ۙ وَلِيَقُولَ ٱلَّذِينَ فِى قُلُوبِهِم مَّرَضٌۭ وَٱلْكَٰفِرُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلًۭا ۚ كَذَٰلِكَ يُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَمَا يَعْلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَ ۚ وَمَا هِىَ إِلَّا ذِكْرَىٰ لِلْبَشَرِ ﴿31﴾", "ru": "(30) Над ним - девятнадцать. (31) Сделали Мы властителями огня только ангелов и сделали число их только испытанием для тех, которые не веруют, чтобы удостоверились те, кому дана книга, и усилили те, которые веруют, веру. И не сомневались те, кому дана книга, и верующие. И сказали те, в сердцах которых болезнь, и неверующие: \"Что такое хотел Аллах этим, как притчей?\" Так вводит в заблуждение Аллах, кого хочет, и ведет прямым путем, кого хочет, и никто не знает воинств Господа твоего, кроме Него, а это - лишь напоминание людям.", "n": "Над Саккар — девятнадцать (стражей); число названо искушением для неверных.", "c": null}, {"ref": "18:18", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَتَحْسَبُهُمْ أَيْقَاظًۭا وَهُمْ رُقُودٌۭ ۚ وَنُقَلِّبُهُمْ ذَاتَ ٱلْيَمِينِ وَذَاتَ ٱلشِّمَالِ ۖ وَكَلْبُهُم بَٰسِطٌۭ ذِرَاعَيْهِ بِٱلْوَصِيدِ ۚ لَوِ ٱطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًۭا وَلَمُلِئْتَ مِنْهُمْ رُعْبًۭا ﴿18﴾", "ru": "Ты думаешь, что они бодрствуют, а они спят, и Мы ворочаем их направо и налево, и собака их растянула лапы на порог; если бы ты усмотрел их, то обратился бы от них бегом и переполнился бы от них страхом.", "n": "Спутники пещеры спят с открытыми глазами, их переворачивают с боку на бок, а собака лежит на пороге, вытянув передние лапы.", "c": null}, {"ref": "18:22", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "سَيَقُولُونَ ثَلَٰثَةٌۭ رَّابِعُهُمْ كَلْبُهُمْ وَيَقُولُونَ خَمْسَةٌۭ سَادِسُهُمْ كَلْبُهُمْ رَجْمًۢا بِٱلْغَيْبِ ۖ وَيَقُولُونَ سَبْعَةٌۭ وَثَامِنُهُمْ كَلْبُهُمْ ۚ قُل رَّبِّىٓ أَعْلَمُ بِعِدَّتِهِم مَّا يَعْلَمُهُمْ إِلَّا قَلِيلٌۭ ۗ فَلَا تُمَارِ فِيهِمْ إِلَّا مِرَآءًۭ ظَٰهِرًۭا وَلَا تَسْتَفْتِ فِيهِم مِّنْهُمْ أَحَدًۭا ﴿22﴾", "ru": "Скажут они: \"Трое, а четвертый у них - пес\", - и скажут: \"Пять, а шестой - пес\". Скажи: \"Господь мой лучше знает число их. Знают его только немногие\". Не спорь же с ними иначе, как в явном споре, и не спрашивай о них никого из них.", "n": "Спор о числе спутников и их собаки: трое, четвёртый — их собака… семеро, восьмой — их собака.", "c": null}, {"ref": "2:26", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "۞ إِنَّ ٱللَّهَ لَا يَسْتَحْىِۦٓ أَن يَضْرِبَ مَثَلًۭا مَّا بَعُوضَةًۭ فَمَا فَوْقَهَا ۚ فَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ فَيَعْلَمُونَ أَنَّهُ ٱلْحَقُّ مِن رَّبِّهِمْ ۖ وَأَمَّا ٱلَّذِينَ كَفَرُوا۟ فَيَقُولُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلًۭا ۘ يُضِلُّ بِهِۦ كَثِيرًۭا وَيَهْدِى بِهِۦ كَثِيرًۭا ۚ وَمَا يُضِلُّ بِهِۦٓ إِلَّا ٱلْفَٰسِقِينَ ﴿26﴾", "ru": "Поистине, Аллах не смущается приводить некоей притчей комара и то, что больше этого. А те, которые веровали, знают, что это - истина от их Господа. Те же, которые неверны, скажут: \"Что желает Аллах этим, как притчей?\" Он вводит этим в заблуждение многих и ведет прямым путем многих. Но сбивает Он этим только распутных,", "n": "Бог не стыдится привести в пример комара и то, что выше него.", "c": null}, {"ref": "5:31", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "فَبَعَثَ ٱللَّهُ غُرَابًۭا يَبْحَثُ فِى ٱلْأَرْضِ لِيُرِيَهُۥ كَيْفَ يُوَٰرِى سَوْءَةَ أَخِيهِ ۚ قَالَ يَٰوَيْلَتَىٰٓ أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هَٰذَا ٱلْغُرَابِ فَأُوَٰرِىَ سَوْءَةَ أَخِى ۖ فَأَصْبَحَ مِنَ ٱلنَّٰدِمِينَ ﴿31﴾", "ru": "И послал Аллах ворона, который разрывал землю, чтобы показать ему, как скрывать скверну его брата. Он сказал: \"Горе мне! Я не в состоянии быть подобным этому ворону и скрыть скверну моего брата\". И оказался он в числе раскаявшихся.", "n": "Бог посылает ворона, который роет землю, чтобы показать, как скрыть тело брата.", "c": null}, {"ref": "3:49", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَرَسُولًا إِلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنِّى قَدْ جِئْتُكُم بِـَٔايَةٍۢ مِّن رَّبِّكُمْ ۖ أَنِّىٓ أَخْلُقُ لَكُم مِّنَ ٱلطِّينِ كَهَيْـَٔةِ ٱلطَّيْرِ فَأَنفُخُ فِيهِ فَيَكُونُ طَيْرًۢا بِإِذْنِ ٱللَّهِ ۖ وَأُبْرِئُ ٱلْأَكْمَهَ وَٱلْأَبْرَصَ وَأُحْىِ ٱلْمَوْتَىٰ بِإِذْنِ ٱللَّهِ ۖ وَأُنَبِّئُكُم بِمَا تَأْكُلُونَ وَمَا تَدَّخِرُونَ فِى بُيُوتِكُمْ ۚ إِنَّ فِى ذَٰلِكَ لَءَايَةًۭ لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ ﴿49﴾", "ru": "и сделает посланником к сынам Исраила\". - \"Я пришел к вам со знамением от вашего Господа. Я сотворю вам из глины по образу птицы и подую в нее, и станет это птицей по изволению Аллаха. Я исцелю слепого прокаженного и оживлю мертвых с дозволения Аллаха. Я сообщу вам, что вы едите и что сохраняете в ваших домах. Поистине, в этом - знамение для вас, если вы верующие!", "n": "Иса создаёт из глины подобие птицы, дует на неё, и она становится птицей по дозволению Аллаха.", "c": "Рассказ похож на апокрифическое Евангелие детства Фомы, которого в Новом Завете нет."}, {"ref": "7:176", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "وَلَوْ شِئْنَا لَرَفَعْنَٰهُ بِهَا وَلَٰكِنَّهُۥٓ أَخْلَدَ إِلَى ٱلْأَرْضِ وَٱتَّبَعَ هَوَىٰهُ ۚ فَمَثَلُهُۥ كَمَثَلِ ٱلْكَلْبِ إِن تَحْمِلْ عَلَيْهِ يَلْهَثْ أَوْ تَتْرُكْهُ يَلْهَث ۚ ذَّٰلِكَ مَثَلُ ٱلْقَوْمِ ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا ۚ فَٱقْصُصِ ٱلْقَصَصَ لَعَلَّهُمْ يَتَفَكَّرُونَ ﴿176﴾", "ru": "А если бы Мы пожелали, то возвысили бы его имя. Но он приник к земле и последовал за своей страстью и подобен он собаке: если бросишься на нее, высовывает язык и, если оставишь ее, высовывает. Это - притча о людях, которые считали ложью Наши знамения. Рассказывай же рассказом, - может быть, они размыслят!", "n": "Притча о человеке, подобном собаке: если ты нападёшь на неё — она высунет язык, и если оставишь — высунет язык.", "c": null}, {"ref": "68:10-13", "sura": "Al-Qalam", "sura_ar": "سُورَةُ القَلَمِ", "type": "Meccan", "ar": "وَلَا تُطِعْ كُلَّ حَلَّافٍۢ مَّهِينٍ ﴿10﴾ هَمَّازٍۢ مَّشَّآءٍۭ بِنَمِيمٍۢ ﴿11﴾ مَّنَّاعٍۢ لِّلْخَيْرِ مُعْتَدٍ أَثِيمٍ ﴿12﴾ عُتُلٍّۭ بَعْدَ ذَٰلِكَ زَنِيمٍ ﴿13﴾", "ru": "(10) Не повинуйся же всякому любителю клятв, презренному, (11) хулителю, бродящему со сплетнями, (12) препятствующему добру, врагу, грешнику, (13) грубому, после этого безродному,", "n": "Эпитеты для неверного: клятвопреступник, презренный, клеветник… жестокий, и после этого безродный.", "c": null}, {"ref": "96:15-16", "sura": "Al-Alaq", "sura_ar": "سُورَةُ العَلَقِ", "type": "Meccan", "ar": "كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًۢا بِٱلنَّاصِيَةِ ﴿15﴾ نَاصِيَةٍۢ كَٰذِبَةٍ خَاطِئَةٍۢ ﴿16﴾", "ru": "(15) Так нет! Если он не удержится, Мы схватим его за хохол - (16) хохол лживый, грешный.", "n": "Угроза: «схватим его за хохол — хохол лживый, грешный».", "c": null}, {"ref": "19:23-26", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "فَأَجَآءَهَا ٱلْمَخَاضُ إِلَىٰ جِذْعِ ٱلنَّخْلَةِ قَالَتْ يَٰلَيْتَنِى مِتُّ قَبْلَ هَٰذَا وَكُنتُ نَسْيًۭا مَّنسِيًّۭا ﴿23﴾ فَنَادَىٰهَا مِن تَحْتِهَآ أَلَّا تَحْزَنِى قَدْ جَعَلَ رَبُّكِ تَحْتَكِ سَرِيًّۭا ﴿24﴾ وَهُزِّىٓ إِلَيْكِ بِجِذْعِ ٱلنَّخْلَةِ تُسَٰقِطْ عَلَيْكِ رُطَبًۭا جَنِيًّۭا ﴿25﴾ فَكُلِى وَٱشْرَبِى وَقَرِّى عَيْنًۭا ۖ فَإِمَّا تَرَيِنَّ مِنَ ٱلْبَشَرِ أَحَدًۭا فَقُولِىٓ إِنِّى نَذَرْتُ لِلرَّحْمَٰنِ صَوْمًۭا فَلَنْ أُكَلِّمَ ٱلْيَوْمَ إِنسِيًّۭا ﴿26﴾", "ru": "(23) И привели ее муки к стволу пальмы. Сказала она: \"О если бы я умерла раньше этого и была забытою, забвенною!\" (24) И воззвал Он к ней из-под нее: \"Не печалься: Господь твой сделал под тобой ручей. (25) И потряси над собой ствол пальмы, она уронит к тебе свежие, спелые. (26) Ешь, и пей, и прохлади глаза! А если ты увидишь кого из людей, то скажи: \"Я дала Милостивому обет поста и не буду говорить сегодня с человеком\".", "n": "Мариам в родовых муках: «потряси над собой ствол пальмы, она уронит к тебе свежие, спелые» (плоды).", "c": null}, {"ref": "19:29-30", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "فَأَشَارَتْ إِلَيْهِ ۖ قَالُوا۟ كَيْفَ نُكَلِّمُ مَن كَانَ فِى ٱلْمَهْدِ صَبِيًّۭا ﴿29﴾ قَالَ إِنِّى عَبْدُ ٱللَّهِ ءَاتَىٰنِىَ ٱلْكِتَٰبَ وَجَعَلَنِى نَبِيًّۭا ﴿30﴾", "ru": "(29) А она указала на него. Они сказали: \"Как мы можем говорить с тем, кто ребенок в колыбели?\" (30) Он сказал: \"Я - раб Аллаха, Он дал мне писание и сделал меня пророком.", "n": "Младенец Иса в колыбели говорит: Я — раб Аллаха; Он даровал мне писание и сделал меня пророком (также 3:46, 5:110).", "c": null}, {"ref": "21:69", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "قُلْنَا يَٰنَارُ كُونِى بَرْدًۭا وَسَلَٰمًا عَلَىٰٓ إِبْرَٰهِيمَ ﴿69﴾", "ru": "Мы сказали: \"О огонь, будь прохладой и миром для Ибрахима!\"", "n": "Бог велит огню: О огонь, будь прохладой и безопасностью для Ибрахима!", "c": null}, {"ref": "12:96", "sura": "Yusuf", "sura_ar": "سُورَةُ يُوسُفَ", "type": "Meccan", "ar": "فَلَمَّآ أَن جَآءَ ٱلْبَشِيرُ أَلْقَىٰهُ عَلَىٰ وَجْهِهِۦ فَٱرْتَدَّ بَصِيرًۭا ۖ قَالَ أَلَمْ أَقُل لَّكُمْ إِنِّىٓ أَعْلَمُ مِنَ ٱللَّهِ مَا لَا تَعْلَمُونَ ﴿96﴾", "ru": "Когда же пришел вестник, он набросил ее на его лицо, и тот стал снова зрячим. Он сказал: \"Разве я не говорил вам, что знаю от Аллаха то, чего вы не знаете?\"", "n": "Йусуфа кафтан, наброшенный на лицо Йакуба, возвращает ему зрение.", "c": null}, {"ref": "38:41-42", "sura": "Saad", "sura_ar": "سُورَةُ صٓ", "type": "Meccan", "ar": "وَٱذْكُرْ عَبْدَنَآ أَيُّوبَ إِذْ نَادَىٰ رَبَّهُۥٓ أَنِّى مَسَّنِىَ ٱلشَّيْطَٰنُ بِنُصْبٍۢ وَعَذَابٍ ﴿41﴾ ٱرْكُضْ بِرِجْلِكَ ۖ هَٰذَا مُغْتَسَلٌۢ بَارِدٌۭ وَشَرَابٌۭ ﴿42﴾", "ru": "(41) И вспомни раба Нашего Аййуба. Вот воззвал он к Господу своему: \"Коснулся меня сатана страданием и наказанием!\" - (42) \"Ударь своей ногой! Вот омовение холодное и питье\".", "n": "Аййуб: Сатана коснулся меня бедой и мучением; ответ: Ударь ногой — вот прохладная вода для омовения и питья.", "c": null}]}, {"id": "superstition", "title": "Джинны, магия и суеверия", "icon": "✦", "group": "Природа, наука и сверхъестественное", "intro": "Аяты о сверхъестественных существах и колдовстве, воспринимаемые в исламской традиции буквально.", "verses": [{"ref": "113:4", "sura": "Al-Falaq", "sura_ar": "سُورَةُ الفَلَقِ", "type": "Meccan", "ar": "وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ ﴿4﴾", "ru": "от зла дующих на узлы,", "n": "«От зла дующих на узлы» — традиционно понимается как женщин-колдуний; сама сура колдовство как реальность не отрицает.", "c": null}, {"ref": "72:8-9", "sura": "Al-Jinn", "sura_ar": "سُورَةُ الجِنِّ", "type": "Meccan", "ar": "وَأَنَّا لَمَسْنَا ٱلسَّمَآءَ فَوَجَدْنَٰهَا مُلِئَتْ حَرَسًۭا شَدِيدًۭا وَشُهُبًۭا ﴿8﴾ وَأَنَّا كُنَّا نَقْعُدُ مِنْهَا مَقَٰعِدَ لِلسَّمْعِ ۖ فَمَن يَسْتَمِعِ ٱلْءَانَ يَجِدْ لَهُۥ شِهَابًۭا رَّصَدًۭا ﴿9﴾", "ru": "(8) И мы коснулись неба и нашли, что оно наполнено стражами могучими и светочами. (9) И мы сидели около него на седалищах, чтобы слушать, но кто прислушивается теперь, тот находит для себя подстерегающий светоч.", "n": "Джинны рассказывают: небо наполнено суровой стражей и метеорами, места для подслушивания теперь недоступны.", "c": null}, {"ref": "34:12-14", "sura": "Saba", "sura_ar": "سُورَةُ سَبَإٍ", "type": "Meccan", "ar": "وَلِسُلَيْمَٰنَ ٱلرِّيحَ غُدُوُّهَا شَهْرٌۭ وَرَوَاحُهَا شَهْرٌۭ ۖ وَأَسَلْنَا لَهُۥ عَيْنَ ٱلْقِطْرِ ۖ وَمِنَ ٱلْجِنِّ مَن يَعْمَلُ بَيْنَ يَدَيْهِ بِإِذْنِ رَبِّهِۦ ۖ وَمَن يَزِغْ مِنْهُمْ عَنْ أَمْرِنَا نُذِقْهُ مِنْ عَذَابِ ٱلسَّعِيرِ ﴿12﴾ يَعْمَلُونَ لَهُۥ مَا يَشَآءُ مِن مَّحَٰرِيبَ وَتَمَٰثِيلَ وَجِفَانٍۢ كَٱلْجَوَابِ وَقُدُورٍۢ رَّاسِيَٰتٍ ۚ ٱعْمَلُوٓا۟ ءَالَ دَاوُۥدَ شُكْرًۭا ۚ وَقَلِيلٌۭ مِّنْ عِبَادِىَ ٱلشَّكُورُ ﴿13﴾ فَلَمَّا قَضَيْنَا عَلَيْهِ ٱلْمَوْتَ مَا دَلَّهُمْ عَلَىٰ مَوْتِهِۦٓ إِلَّا دَآبَّةُ ٱلْأَرْضِ تَأْكُلُ مِنسَأَتَهُۥ ۖ فَلَمَّا خَرَّ تَبَيَّنَتِ ٱلْجِنُّ أَن لَّوْ كَانُوا۟ يَعْلَمُونَ ٱلْغَيْبَ مَا لَبِثُوا۟ فِى ٱلْعَذَابِ ٱلْمُهِينِ ﴿14﴾", "ru": "(12) А Сулайману - ветер... утренний путь его - месяц, и вечерний путь его - месяц. Источили Мы для него ключ меди. А из джиннов - такие, что работают пред ним по повелению его Господа; кто же из них уклонится от Нашего повеления, тому Мы дадим попробовать наказание огня. (13) Делают они ему, что он пожелает, из алтарей, изображений, чаш, как цистерны, и котлов прочных. Сотворите, род Дауда, благодарность! Но немногие из Моих рабов благодарны! (14) Когда же Мы обрекли его на смерть, указало на смерть его только животное земли, которое подъело посох. А когда он упал, уразумели джинны, что если бы они знали тайное, то не оказались бы в унизительном наказании.", "n": "Ветер и джинны подчинены Сулейману (Соломону); джинны не знали о его смерти, пока червь не подточил посох, и продолжали работать на мёртвого царя.", "c": null}, {"ref": "38:36-38", "sura": "Saad", "sura_ar": "سُورَةُ صٓ", "type": "Meccan", "ar": "فَسَخَّرْنَا لَهُ ٱلرِّيحَ تَجْرِى بِأَمْرِهِۦ رُخَآءً حَيْثُ أَصَابَ ﴿36﴾ وَٱلشَّيَٰطِينَ كُلَّ بَنَّآءٍۢ وَغَوَّاصٍۢ ﴿37﴾ وَءَاخَرِينَ مُقَرَّنِينَ فِى ٱلْأَصْفَادِ ﴿38﴾", "ru": "(36) И подчинили Мы ему ветер, который течет, по его повелению, легким, куда он пожелает, - (37) и шайтанов, всякого строителя и водолаза, (38) и других, соединенных в цепях.", "n": "Шайтаны подчинены Сулейману: все строители и ныряльщики и другие, скованные цепями.", "c": null}, {"ref": "21:81", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "وَلِسُلَيْمَٰنَ ٱلرِّيحَ عَاصِفَةًۭ تَجْرِى بِأَمْرِهِۦٓ إِلَى ٱلْأَرْضِ ٱلَّتِى بَٰرَكْنَا فِيهَا ۚ وَكُنَّا بِكُلِّ شَىْءٍ عَٰلِمِينَ ﴿81﴾", "ru": "А Сулайману - ветер, когда он, дуя, устремляется по его повелению в землю, которую Мы благословили, и Мы знали про все.", "n": "Для Сулеймана — бурный ветер, дующий по его приказу.", "c": null}, {"ref": "15:27", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "وَٱلْجَآنَّ خَلَقْنَٰهُ مِن قَبْلُ مِن نَّارِ ٱلسَّمُومِ ﴿27﴾", "ru": "И гениев Мы сотворили раньше из огня знойного.", "n": "Джинны созданы раньше из жара огня.", "c": null}, {"ref": "55:15", "sura": "Ar-Rahmaan", "sura_ar": "سُورَةُ الرَّحۡمَٰن", "type": "Medinan", "ar": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ ﴿15﴾", "ru": "и сотворил джиннов из чистого огня.", "n": "Джинн создан из смеси бездымного огня.", "c": null}, {"ref": "2:275", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱلَّذِينَ يَأْكُلُونَ ٱلرِّبَوٰا۟ لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ ٱلَّذِى يَتَخَبَّطُهُ ٱلشَّيْطَٰنُ مِنَ ٱلْمَسِّ ۚ ذَٰلِكَ بِأَنَّهُمْ قَالُوٓا۟ إِنَّمَا ٱلْبَيْعُ مِثْلُ ٱلرِّبَوٰا۟ ۗ وَأَحَلَّ ٱللَّهُ ٱلْبَيْعَ وَحَرَّمَ ٱلرِّبَوٰا۟ ۚ فَمَن جَآءَهُۥ مَوْعِظَةٌۭ مِّن رَّبِّهِۦ فَٱنتَهَىٰ فَلَهُۥ مَا سَلَفَ وَأَمْرُهُۥٓ إِلَى ٱللَّهِ ۖ وَمَنْ عَادَ فَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَٰلِدُونَ ﴿275﴾", "ru": "Те, которые пожирают рост, восстанут только такими же, как восстанет тот, кого повергает сатана своим прикосновением. Это - за то, что они говорили: \"Ведь торговля - то же , что рост\". А Аллах разрешил торговлю и запретил рост. К кому приходит увещание от его Господа и он удержится, тому (прощено), что предшествовало: дело его принадлежит Аллаху; а кто повторит, те - обитатели огня, они в нем вечно пребывают!", "n": "Берущие рост встанут, как встаёт тот, кого шайтан поразил своим прикосновением и свёл с ума.", "c": null}, {"ref": "114:1-6", "sura": "An-Naas", "sura_ar": "سُورَةُ النَّاسِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ ﴿1﴾ مَلِكِ ٱلنَّاسِ ﴿2﴾ إِلَٰهِ ٱلنَّاسِ ﴿3﴾ مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ ﴿4﴾ ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ ﴿5﴾ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ ﴿6﴾", "ru": "(1) Скажи: \"Прибегаю к Господу людей, (2) царю людей, (3) Богу людей, (4) от зла наущателя скрывающегося, (5) который наущает груди людей, (6) от джиннов и людей!\"", "n": "«Скажи: Прибегаю к Господу людей… от зла наущателя скрывающегося, который наущает груди людей, от джиннов и людей».", "c": null}, {"ref": "72:1-2", "sura": "Al-Jinn", "sura_ar": "سُورَةُ الجِنِّ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أُوحِىَ إِلَىَّ أَنَّهُ ٱسْتَمَعَ نَفَرٌۭ مِّنَ ٱلْجِنِّ فَقَالُوٓا۟ إِنَّا سَمِعْنَا قُرْءَانًا عَجَبًۭا ﴿1﴾ يَهْدِىٓ إِلَى ٱلرُّشْدِ فَـَٔامَنَّا بِهِۦ ۖ وَلَن نُّشْرِكَ بِرَبِّنَآ أَحَدًۭا ﴿2﴾", "ru": "(1) Скажи: \"Открыто мне, что слушал сонм джиннов, и сказали они: \"Поистине, слышали мы Коран дивный! (2) Он ведет к прямому пути. И уверовали мы в него, и никогда не предадим мы нашему Господу никого.", "n": "Прислушалась группа из джиннов, и они сказали: мы слышали удивительный Коран — джинны, ставшие мусульманами.", "c": null}, {"ref": "46:29-32", "sura": "Al-Ahqaf", "sura_ar": "سُورَةُ الأَحۡقَافِ", "type": "Meccan", "ar": "وَإِذْ صَرَفْنَآ إِلَيْكَ نَفَرًۭا مِّنَ ٱلْجِنِّ يَسْتَمِعُونَ ٱلْقُرْءَانَ فَلَمَّا حَضَرُوهُ قَالُوٓا۟ أَنصِتُوا۟ ۖ فَلَمَّا قُضِىَ وَلَّوْا۟ إِلَىٰ قَوْمِهِم مُّنذِرِينَ ﴿29﴾ قَالُوا۟ يَٰقَوْمَنَآ إِنَّا سَمِعْنَا كِتَٰبًا أُنزِلَ مِنۢ بَعْدِ مُوسَىٰ مُصَدِّقًۭا لِّمَا بَيْنَ يَدَيْهِ يَهْدِىٓ إِلَى ٱلْحَقِّ وَإِلَىٰ طَرِيقٍۢ مُّسْتَقِيمٍۢ ﴿30﴾ يَٰقَوْمَنَآ أَجِيبُوا۟ دَاعِىَ ٱللَّهِ وَءَامِنُوا۟ بِهِۦ يَغْفِرْ لَكُم مِّن ذُنُوبِكُمْ وَيُجِرْكُم مِّنْ عَذَابٍ أَلِيمٍۢ ﴿31﴾ وَمَن لَّا يُجِبْ دَاعِىَ ٱللَّهِ فَلَيْسَ بِمُعْجِزٍۢ فِى ٱلْأَرْضِ وَلَيْسَ لَهُۥ مِن دُونِهِۦٓ أَوْلِيَآءُ ۚ أُو۟لَٰٓئِكَ فِى ضَلَٰلٍۢ مُّبِينٍ ﴿32﴾", "ru": "(29) Вот, Мы направили к тебе толпу из джиннов, чтобы они выслушали Коран. Когда же они явились к этому, они сказали: \"Внимайте!\" Когда было завершено, они обратились к своему народу с увещанием. (30) Они сказали: \"О народ наш! Мы слышали книгу, ниспосланную после Мусы, подтверждающую истинность того, что ниспослано до него; она ведет к истине и прямому пути. (31) О народ наш! Отвечайте призывающему Аллаха и уверуйте в Него: Он простит вам ваши грехи и защити вас от наказания мучительного. (32) А кто не ответит призывающему Аллаха, тот не избавится от Него на земле, и нет ему помимо Него защитников. Эти - в явном заблуждении!\"", "n": "Джинны слушали Коран и призывали свой народ ответить призывающему к Аллаху.", "c": null}, {"ref": "7:27", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "يَٰبَنِىٓ ءَادَمَ لَا يَفْتِنَنَّكُمُ ٱلشَّيْطَٰنُ كَمَآ أَخْرَجَ أَبَوَيْكُم مِّنَ ٱلْجَنَّةِ يَنزِعُ عَنْهُمَا لِبَاسَهُمَا لِيُرِيَهُمَا سَوْءَٰتِهِمَآ ۗ إِنَّهُۥ يَرَىٰكُمْ هُوَ وَقَبِيلُهُۥ مِنْ حَيْثُ لَا تَرَوْنَهُمْ ۗ إِنَّا جَعَلْنَا ٱلشَّيَٰطِينَ أَوْلِيَآءَ لِلَّذِينَ لَا يُؤْمِنُونَ ﴿27﴾", "ru": "О сыны Адама! Пусть сатана не искусит вас, как он извел ваших родителей из рая, совлекши с них одежду, чтобы показать им их мерзость. Ведь он видит вас - он и его сонм - оттуда, откуда вы их не видите. Поистине, Мы сделали шайтанов покровителями тех, которые не веруют!", "n": "Сатана и его род видят вас оттуда, откуда вы их не видите.", "c": null}, {"ref": "27:38-40", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "قَالَ يَٰٓأَيُّهَا ٱلْمَلَؤُا۟ أَيُّكُمْ يَأْتِينِى بِعَرْشِهَا قَبْلَ أَن يَأْتُونِى مُسْلِمِينَ ﴿38﴾ قَالَ عِفْرِيتٌۭ مِّنَ ٱلْجِنِّ أَنَا۠ ءَاتِيكَ بِهِۦ قَبْلَ أَن تَقُومَ مِن مَّقَامِكَ ۖ وَإِنِّى عَلَيْهِ لَقَوِىٌّ أَمِينٌۭ ﴿39﴾ قَالَ ٱلَّذِى عِندَهُۥ عِلْمٌۭ مِّنَ ٱلْكِتَٰبِ أَنَا۠ ءَاتِيكَ بِهِۦ قَبْلَ أَن يَرْتَدَّ إِلَيْكَ طَرْفُكَ ۚ فَلَمَّا رَءَاهُ مُسْتَقِرًّا عِندَهُۥ قَالَ هَٰذَا مِن فَضْلِ رَبِّى لِيَبْلُوَنِىٓ ءَأَشْكُرُ أَمْ أَكْفُرُ ۖ وَمَن شَكَرَ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِۦ ۖ وَمَن كَفَرَ فَإِنَّ رَبِّى غَنِىٌّۭ كَرِيمٌۭ ﴿40﴾", "ru": "(38) Он сказал: \"О знать, кто из вас придет ко мне с ее троном, прежде чем они придут ко мне покорными?\" (39) Сказал Ифрит из джиннов: \"Я приду к тебе с ним, прежде чем ты встанешь со своего места; я ведь для этого силен и верен\". (40) Сказал тот, у которого было знание из книги: \"Я приду к тебе с ним, прежде чем вернется к тебе твой взор\". Когда же он увидел его утвердившимся у себя, то сказал: \"Это - из милости Господа моего, чтобы испытать меня - буду ли я благодарен или неверен. Кто благодарен, тот благодарен для самого себя, а кто неверен - Господь мой богат, милостив\".", "n": "Ифрит из джиннов обещает принести трон царицы Сабы до того, как Сулейман встанет с места; тот, у кого было знание из писания, приносит его прежде, чем сомкнётся твой взор.", "c": null}]}];
const $ = s => document.querySelector(s);
const total = DATA.reduce((a,s)=>a+s.verses.length,0);
const esc = t => (t||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let cur = "home", q = "";

const GROUPS = [...new Set(DATA.map(s=>s.group))];
function navBtn(i){return `<button data-id="${i.id}" class="${i.id===cur&&q.length<2?"on":""}"><span class="ic">${i.icon}</span><span>${i.title}</span><span class="ct">${i.n}</span></button>`}
function buildNav(){
  let h = navBtn({id:"home",icon:"⌂",title:"Начало и методика",n:total});
  GROUPS.forEach(g=>{
    h += `<div class="gh">${g}</div>` + DATA.filter(s=>s.group===g).map(s=>navBtn({id:s.id,icon:s.icon,title:s.title,n:s.verses.length})).join("");
  });
  $("#nav").innerHTML = h;
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.id));
}

function hl(t){
  const e = esc(t);
  if(q.length<2) return e;
  const re = new RegExp("("+esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return e.replace(re,"<mark>$1</mark>");
}

function card(v, secTitle){
  const [s,a]=v.ref.split(":");
  return `<article class="card">
  <div class="ref"><span class="r">Сура ${s}, аят ${a}</span><span class="s">${v.sura} · ${v.sura_ar}</span>
  <span class="tag">${v.type==="Meccan"?"Мекканская":"Мединская"}${secTitle?" · "+esc(secTitle):""}</span>
  <button class="copy" data-copy="${v.ref}">копировать</button></div>
  <div class="ar" lang="ar">${v.ar}</div>
  <blockquote class="ru" style="margin-left:0">${hl(v.ru)}</blockquote>
  ${v.n?`<p class="n"><b>В чём вопрос</b>${hl(v.n)}</p>`:""}
  ${v.c?`<p class="c"><b>Контекст / традиционное объяснение</b>${hl(v.c)}</p>`:""}
  </article>`;
}

function home(){
  return `<h2>Критический доклад о Коране</h2>
  <p class="intro">Сборник аятов, сгруппированных по темам: насилие и жестокость, положение женщин, рабство, отношение к иноверцам, внутренние противоречия, особое положение Пророка, утверждения, расходящиеся с наукой. В каждом фрагменте — дословный текст (арабский оригинал и русский перевод) и краткий комментарий. Всего ${total} фрагментов в ${DATA.length} разделах.</p>
  ${GROUPS.map(g=>`<h3 class="gtitle">${g}</h3><div class="grid">${DATA.filter(s=>s.group===g).map(s=>`<div class="tile" data-id="${s.id}"><div class="big">${s.icon}</div><div class="t">${s.title}</div><div class="k">${s.verses.length} фрагментов</div></div>`).join("")}</div>`).join("")}
  <div class="note"><h3>Источник текстов</h3>Только Коран, без хадисов и других источников. Арабский текст — по Усмановскому списку (Tanzil), русский — перевод И. Ю. Крачковского (в общественном достоянии). Тексты загружены автоматически из открытой базы alquran.cloud, а не набраны вручную; нумерация аятов общепринятая. Если аят в сборке приведён диапазоном (например, 22:19-21), номера внутри текста указаны в скобках.</div>
  <div class="note"><h3>Как читать</h3><ul>
  <li><b>Рамка с курсивом</b> — дословный перевод аята.</li>
  <li><b>В чём вопрос</b> — суть претензии критиков к данному месту. Всё, что в кавычках «…», — дословная цитата из того же перевода; пересказ дан без кавычек.</li>
  <li><b>Контекст / традиционное объяснение</b> — как этот аят объясняют сами мусульманские богословы и что сказано в соседних аятах. Блок можно отключить в меню слева.</li>
  <li>Переводы отличаются: у Кулиева, Османова, Пороховой и др. формулировки иные. Для серьёзной работы сверяйте аяты по нескольким переводам.</li></ul></div>
  <div class="note"><h3>Что важно учитывать</h3><ul>
  <li>Многие аяты связаны с войнами VII века; в тексте не всегда есть оговорка об обстоятельствах, и именно это обсуждают богословы.</li>
  <li>Исламская традиция использует доктрину отмены (насх) и науку тафсира (комментарий). Критику стоит сопоставлять с ними, чтобы её нельзя было отвести как «вырванную из контекста».</li>
  <li>Апологеты толкуют антинаучные утверждения как метафоры; критики — что текст говорит буквально. Оба прочтения приведены.</li>
  <li>Один и тот же аят может встречаться в нескольких разделах, если он относится к нескольким темам.</li></ul></div>`;
}

function pager(id){
  const ids=["home",...DATA.map(s=>s.id)], i=ids.indexOf(id);
  const t=x=>x==="home"?"Начало":DATA.find(s=>s.id===x).title;
  return `<div class="pager">${i>0?`<button data-id="${ids[i-1]}">← ${t(ids[i-1])}</button>`:"<span></span>"}${i<ids.length-1?`<button data-id="${ids[i+1]}">${t(ids[i+1])} →</button>`:""}</div>`;
}
function section(s){
  return `<h2>${s.icon} ${s.title}</h2><p class="intro">${esc(s.intro)}</p>${s.verses.map(v=>card(v)).join("")}${pager(s.id)}`;
}
function searchResults(){
  const ql=q.toLowerCase(); let out="",n=0;
  DATA.forEach(s=>s.verses.forEach(v=>{
    if((v.ru+" "+(v.n||"")+" "+(v.c||"")+" "+v.ref).toLowerCase().includes(ql)){out+=card(v,s.title);n++;}
  }));
  return `<h2>Поиск: «${esc(q)}»</h2><p class="intro">Найдено фрагментов: ${n}</p>${out||"<p>Ничего не найдено.</p>"}`;
}

function render(){
  const m=$("#main");
  const body = q.length>=2 ? searchResults() : (cur==="home"?home():section(DATA.find(s=>s.id===cur)));
  m.innerHTML = `<input class="search" id="q" placeholder="Поиск по всем аятам и комментариям (например: убивайте, женщины, солнце)…" value="${esc(q).replace(/"/g,"&quot;")}">`+body;
  const inp=$("#q");
  inp.oninput=e=>{q=e.target.value.trim();render();const i=$("#q");i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  m.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>go(b.dataset.id));
  m.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
    const v=DATA.flatMap(s=>s.verses).find(x=>x.ref===b.dataset.copy);
    navigator.clipboard.writeText("Коран "+v.ref+" — "+v.ru);b.textContent="скопировано";setTimeout(()=>b.textContent="копировать",1200)});
  buildNav();
}
function go(id){cur=id;q="";location.hash=id;render();window.scrollTo(0,0);$("#side").classList.remove("open")}

$("#tAr").onchange=e=>document.body.classList.toggle("hide-ar",!e.target.checked);
$("#tC").onchange=e=>document.body.classList.toggle("hide-c",!e.target.checked);
$("#tTheme").onchange=e=>document.documentElement.dataset.theme=e.target.checked?"dark":"";
$("#menu").onclick=()=>$("#side").classList.toggle("open");
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==cur&&(h==="home"||DATA.some(s=>s.id===h))){cur=h;q="";render()}});
{const h=location.hash.slice(1);if(h&&DATA.some(s=>s.id===h))cur=h}
render();
</script>
</body>
</html>
