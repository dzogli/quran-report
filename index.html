 слова образно (рука = власть), другие — ⟦буквально, но без вопроса «как⟧ (бела кейф»). Критики: либо у Бога есть тело (антропоморфизм), либо слова не буквальны — тогда нужно объяснить, какие аяты буквальны, а какие нет. Сам текст эти разграничения не проводит.", "c": null, "x": ["6:103", "75:22-23"], "t": "«Нет ничего подобного Ему» — и при этом у Него руки, лик, глаза и голень", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Нет ничего подобного Ему» стоит рядом с описанием рук, лица и глаз Бога. Это напряжение внутри текста (4:82), но снимается образным чтением; слабость в том, что текст не говорит, какие места образные."}, {"refs": ["3:142", "47:31", "2:143", "18:12", "2:187"], "parts": [{"ref": "3:142", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "أَمْ حَسِبْتُمْ أَن تَدْخُلُوا۟ ٱلْجَنَّةَ وَلَمَّا يَعْلَمِ ٱللَّهُ ٱلَّذِينَ جَٰهَدُوا۟ مِنكُمْ وَيَعْلَمَ ٱلصَّٰبِرِينَ ﴿142﴾", "ru": "Или вы думали, что войдете в рай, когда Аллах еще не узнал тех, которые усердствовали из вас, и узнал терпеливых?"}, {"ref": "47:31", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "وَلَنَبْلُوَنَّكُمْ حَتَّىٰ نَعْلَمَ ٱلْمُجَٰهِدِينَ مِنكُمْ وَٱلصَّٰبِرِينَ وَنَبْلُوَا۟ أَخْبَارَكُمْ ﴿31﴾", "ru": "И Мы испытываем вас, чтобы узнать среди вас усердствующих и терпеливых, и испытаем сообщения о вас."}, {"ref": "2:143", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَكَذَٰلِكَ جَعَلْنَٰكُمْ أُمَّةًۭ وَسَطًۭا لِّتَكُونُوا۟ شُهَدَآءَ عَلَى ٱلنَّاسِ وَيَكُونَ ٱلرَّسُولُ عَلَيْكُمْ شَهِيدًۭا ۗ وَمَا جَعَلْنَا ٱلْقِبْلَةَ ٱلَّتِى كُنتَ عَلَيْهَآ إِلَّا لِنَعْلَمَ مَن يَتَّبِعُ ٱلرَّسُولَ مِمَّن يَنقَلِبُ عَلَىٰ عَقِبَيْهِ ۚ وَإِن كَانَتْ لَكَبِيرَةً إِلَّا عَلَى ٱلَّذِينَ هَدَى ٱللَّهُ ۗ وَمَا كَانَ ٱللَّهُ لِيُضِيعَ إِيمَٰنَكُمْ ۚ إِنَّ ٱللَّهَ بِٱلنَّاسِ لَرَءُوفٌۭ رَّحِيمٌۭ ﴿143﴾", "ru": "И так Мы сделали вас общиной посредствующей, чтобы вы были свидетелями относительно людей и чтобы посланник был свидетелем относительно вас. И Мы сделали киблу, которой ты держался, только для того, чтобы Нам узнать, кто следует за посланником среди обращающихся вспять. И это - трудно, за исключением тех, кого повел Аллах правым путем: ведь Аллах не таков, чтобы губить вашу веру! Поистине, Аллах с людьми кроток, милосерд!"}, {"ref": "18:12", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "ثُمَّ بَعَثْنَٰهُمْ لِنَعْلَمَ أَىُّ ٱلْحِزْبَيْنِ أَحْصَىٰ لِمَا لَبِثُوٓا۟ أَمَدًۭا ﴿12﴾", "ru": "Потом Мы воскресили их, чтобы узнать, какая из партий лучше сочтет предел того, что они пробыли."}, {"ref": "2:187", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "أُحِلَّ لَكُمْ لَيْلَةَ ٱلصِّيَامِ ٱلرَّفَثُ إِلَىٰ نِسَآئِكُمْ ۚ هُنَّ لِبَاسٌۭ لَّكُمْ وَأَنتُمْ لِبَاسٌۭ لَّهُنَّ ۗ عَلِمَ ٱللَّهُ أَنَّكُمْ كُنتُمْ تَخْتَانُونَ أَنفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنكُمْ ۖ فَٱلْـَٰٔنَ بَٰشِرُوهُنَّ وَٱبْتَغُوا۟ مَا كَتَبَ ٱللَّهُ لَكُمْ ۚ وَكُلُوا۟ وَٱشْرَبُوا۟ حَتَّىٰ يَتَبَيَّنَ لَكُمُ ٱلْخَيْطُ ٱلْأَبْيَضُ مِنَ ٱلْخَيْطِ ٱلْأَسْوَدِ مِنَ ٱلْفَجْرِ ۖ ثُمَّ أَتِمُّوا۟ ٱلصِّيَامَ إِلَى ٱلَّيْلِ ۚ وَلَا تُبَٰشِرُوهُنَّ وَأَنتُمْ عَٰكِفُونَ فِى ٱلْمَسَٰجِدِ ۗ تِلْكَ حُدُودُ ٱللَّهِ فَلَا تَقْرَبُوهَا ۗ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَّقُونَ ﴿187﴾", "ru": "Разрешается вам в ночь поста приближение к вашим женам: они - одеяние для вас, а вы - одеяние для них. Узнал Аллах, что вы обманываете самих себя, и обратился к вам и простил вас. А теперь прикасайтесь к ним и ищите того, что предписал Аллах. Ешьте и пейте, пока не станет различаться перед вами белая нитка и черная нитка на заре, потом выполняйте пост до ночи. И не прикасайтесь к ним, знамения людям, - может быть, они будут богобоязненны!"}], "n": "Что сказано: «Или вы думали, что войдёте в рай, когда Аллах ещё не узнал тех, которые усердствовали из вас?» (3:142); «Мы испытываем вас, чтобы узнать среди вас усердствующих» (47:31); кибла изменена, «чтобы Нам узнать, кто следует за посланником» (2:143); «Мы воскресили их, чтобы узнать, какая из партий лучше сочтёт предел» (18:12); «Узнал Аллах, что вы обманываете самих себя» (2:187).\nВ чём проблема: слова ⟦пока Аллах не узнал⟧ и «чтобы Нам узнать» означают, что Бог приобретает знание после событий. Это противоречит всеведению: ⟦у Него ключи тайного; знает их только Он⟧ (6:59); Он знает всё в небесах и на земле. Традиционный ответ: «узнать» значит ⟦сделать известным (проявить)⟧, но тогда слово нужно читать не буквально — а в тексте об этом нет оговорки.", "c": null, "x": ["6:59"], "t": "Бог «узнаёт» после того, как человек поступил", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. «Пока Аллах не узнал» при буквальном чтении значит, что Бог узнаёт после события, а это расходится со всезнанием (6:59). Верующие читают «узнать» как «проявить»."}], "summary": ["У Бога описаны руки, лик, глаза; рядом «нет ничего подобного Ему» (42:11).", "Противоречие снимается образным чтением, но текст не говорит, какие места образные.", "«Узнавание» Богом после события (3:142) читается и как «проявить»."]}, {"id": "omni", "title": "Всемогущество и всезнание Бога", "icon": "⚡", "group": "Основы: вера, обряды и голос текста", "intro": "Важная оговорка: прямого аята «Аллах не всемогущ» или «Аллах не всеведущ» в Коране нет, и утверждать обратное на докладе нельзя. Наоборот, текст многократно заявляет и всемогущество («Аллах над всякой вещью мощен»), и всезнание. Поэтому все претензии в этом разделе относятся не к явным заявлениям, а к внутренним напряжениям: слова, которые при буквальном чтении предполагают ограничение (Бог «забыл», «облегчил, зная слабость», просит «заём»), и «если бы Аллах пожелал, повёл бы всех», рядом с угрозами тем, кого не повёл. В каждой карточке указано, что утверждает сам текст, а что добавляет критик. Блок про Бога, который «узнаёт» после события (3:142, 47:31), уже есть в разделе «Образ Бога»; он здесь не повторяется, на него даны ссылки. Раздел помещён в группу «Основы» (это вопрос о свойствах Бога, а не о насилии); связь с насилием есть только у карточки про «если бы пожелал» и с темой предопределения (раздел «Предопределение»).", "verses": [{"refs": ["2:117", "40:68", "2:20", "35:44", "5:17", "85:16"], "parts": [{"ref": "2:117", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "بَدِيعُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَإِذَا قَضَىٰٓ أَمْرًۭا فَإِنَّمَا يَقُولُ لَهُۥ كُن فَيَكُونُ ﴿117﴾", "ru": "Он - творец небес и земли, а когда Он решит какое-нибудь дело, то только говорит ему: \"Будь!\" - и оно бывает."}, {"ref": "40:68", "sura": "Ghafir", "sura_ar": "سُورَةُ غَافِرٍ", "type": "Meccan", "ar": "هُوَ ٱلَّذِى يُحْىِۦ وَيُمِيتُ ۖ فَإِذَا قَضَىٰٓ أَمْرًۭا فَإِنَّمَا يَقُولُ لَهُۥ كُن فَيَكُونُ ﴿68﴾", "ru": "Он - тот, который оживляет и умерщвляет, а когда решит какое-нибудь дело, то только скажет ему: \"Будь!\" - и оно бывает."}, {"ref": "2:20", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "يَكَادُ ٱلْبَرْقُ يَخْطَفُ أَبْصَٰرَهُمْ ۖ كُلَّمَآ أَضَآءَ لَهُم مَّشَوْا۟ فِيهِ وَإِذَآ أَظْلَمَ عَلَيْهِمْ قَامُوا۟ ۚ وَلَوْ شَآءَ ٱللَّهُ لَذَهَبَ بِسَمْعِهِمْ وَأَبْصَٰرِهِمْ ۚ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿20﴾", "ru": "Молния готова отнять их зрения; как только она им осветит, они идут при ней. А когда окажется над ними мрак, они стоят. А если бы Аллах пожелал, то унес бы их слух и зрение: ведь Аллах над всякой вещью мощен!"}, {"ref": "35:44", "sura": "Faatir", "sura_ar": "سُورَةُ فَاطِرٍ", "type": "Meccan", "ar": "أَوَلَمْ يَسِيرُوا۟ فِى ٱلْأَرْضِ فَيَنظُرُوا۟ كَيْفَ كَانَ عَٰقِبَةُ ٱلَّذِينَ مِن قَبْلِهِمْ وَكَانُوٓا۟ أَشَدَّ مِنْهُمْ قُوَّةًۭ ۚ وَمَا كَانَ ٱللَّهُ لِيُعْجِزَهُۥ مِن شَىْءٍۢ فِى ٱلسَّمَٰوَٰتِ وَلَا فِى ٱلْأَرْضِ ۚ إِنَّهُۥ كَانَ عَلِيمًۭا قَدِيرًۭا ﴿44﴾", "ru": "Разве они не ходили по земле и не видели, каков был конец тех, кто был до них? Были они мощнее их силой, но Аллаха ничто не может ослабить ни на небесах, ни на земле. Он - знающий, мощный!"}, {"ref": "5:17", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "لَّقَدْ كَفَرَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ هُوَ ٱلْمَسِيحُ ٱبْنُ مَرْيَمَ ۚ قُلْ فَمَن يَمْلِكُ مِنَ ٱللَّهِ شَيْـًٔا إِنْ أَرَادَ أَن يُهْلِكَ ٱلْمَسِيحَ ٱبْنَ مَرْيَمَ وَأُمَّهُۥ وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ۗ وَلِلَّهِ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا ۚ يَخْلُقُ مَا يَشَآءُ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿17﴾", "ru": "Не веруют те, которые говорят, что Аллах - это Мессия, сын Марйам. Скажи: \"Кто же властен чем-нибудь у Аллаха, если Он захочет погубить Мессию, сына Марйам, и его мать, и тех, кто на земле, всех?\" Аллаху принадлежит власть над небесами и землей и тем, что между ними. Он творит то, что желает: ведь Аллах над всякой вещью властен!"}, {"ref": "85:16", "sura": "Al-Burooj", "sura_ar": "سُورَةُ البُرُوجِ", "type": "Meccan", "ar": "فَعَّالٌۭ لِّمَا يُرِيدُ ﴿16﴾", "ru": "совершитель того, что пожелает."}], "n": "Что сказано: «Он — творец небес и земли, а когда Он решит какое-нибудь дело, то только говорит ему: «Будь!» — и оно бывает» (2:117; почти так же 40:68). «Аллах над всякой вещью мощен» (2:20). «Аллаха ничто не может ослабить ни на небесах, ни на земле» (35:44). «Он творит то, что желает» (5:17). Бог — «совершитель того, что пожелает» (85:16).\nВ чём проблема: это не претензия, а точка отсчёта. Текст утверждает неограниченное всемогущество, а аята с обратным утверждением в нём нет. Любой довод ⟦Коран говорит, что Бог ограничен⟧ требует вывода из косвенных мест (см. следующие карточки раздела), поэтому такой вывод опирается на косвенные места; верующие объясняют их образной речью. Единственное, что здесь можно честно поставить в вопрос, — как неограниченное всемогущество согласуется с запретами, которые Бог сам себе ставит (например, 6:12: Он ⟦предначертал для самого Себя милость⟧), и с тем, что множество людей остаётся без веры по Его же воле (следующие карточки).\nКак отвечают верующие: это классическое понимание всемогущества как воли без принуждения извне: Бог не ⟦ограничен⟧, а сам определил порядок. Самоограничение не отрицает силы.", "c": null, "x": ["3:142", "47:31", "6:149"], "t": "Что Коран прямо утверждает: всемогущество", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Это не претензия, а фон: Коран прямо утверждает всемогущество, и аята о его отрицании нет. Так и следует говорить на докладе."}, {"refs": ["9:67", "7:51", "45:34", "32:14", "19:64", "20:52"], "parts": [{"ref": "9:67", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "ٱلْمُنَٰفِقُونَ وَٱلْمُنَٰفِقَٰتُ بَعْضُهُم مِّنۢ بَعْضٍۢ ۚ يَأْمُرُونَ بِٱلْمُنكَرِ وَيَنْهَوْنَ عَنِ ٱلْمَعْرُوفِ وَيَقْبِضُونَ أَيْدِيَهُمْ ۚ نَسُوا۟ ٱللَّهَ فَنَسِيَهُمْ ۗ إِنَّ ٱلْمُنَٰفِقِينَ هُمُ ٱلْفَٰسِقُونَ ﴿67﴾", "ru": "Лицемеры и лицемерки - одни от других: они внушают неодобряемое, и удерживают от признаваемого, и зажимают свои руки. Забыли они Аллаха, и забыл Аллах про них. Поистине, лицемеры, они - распутники!"}, {"ref": "7:51", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "ٱلَّذِينَ ٱتَّخَذُوا۟ دِينَهُمْ لَهْوًۭا وَلَعِبًۭا وَغَرَّتْهُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا ۚ فَٱلْيَوْمَ نَنسَىٰهُمْ كَمَا نَسُوا۟ لِقَآءَ يَوْمِهِمْ هَٰذَا وَمَا كَانُوا۟ بِـَٔايَٰتِنَا يَجْحَدُونَ ﴿51﴾", "ru": "тех, которые свою религию обратили в потеху и забаву, и обольстила их эта ближняя жизнь: сегодня забудем Мы их, как и они забыли про встречу с этим днем и то, что они отрицали Наши знамения!"}, {"ref": "45:34", "sura": "Al-Jaathiya", "sura_ar": "سُورَةُ الجَاثِيَةِ", "type": "Meccan", "ar": "وَقِيلَ ٱلْيَوْمَ نَنسَىٰكُمْ كَمَا نَسِيتُمْ لِقَآءَ يَوْمِكُمْ هَٰذَا وَمَأْوَىٰكُمُ ٱلنَّارُ وَمَا لَكُم مِّن نَّٰصِرِينَ ﴿34﴾", "ru": "И сказано было: \"В этот день забудем Мы вас, как вы забыли про встречу с этим днем; убежище для вас - огонь, и нет вам помощников."}, {"ref": "32:14", "sura": "As-Sajda", "sura_ar": "سُورَةُ السَّجۡدَةِ", "type": "Meccan", "ar": "فَذُوقُوا۟ بِمَا نَسِيتُمْ لِقَآءَ يَوْمِكُمْ هَٰذَآ إِنَّا نَسِينَٰكُمْ ۖ وَذُوقُوا۟ عَذَابَ ٱلْخُلْدِ بِمَا كُنتُمْ تَعْمَلُونَ ﴿14﴾", "ru": "Вкусите же за то, что вы забыли про встречу этого вашего дня! Мы вас забыли, и вкусите наказание вечности за то, что вы творили!"}, {"ref": "19:64", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "وَمَا نَتَنَزَّلُ إِلَّا بِأَمْرِ رَبِّكَ ۖ لَهُۥ مَا بَيْنَ أَيْدِينَا وَمَا خَلْفَنَا وَمَا بَيْنَ ذَٰلِكَ ۚ وَمَا كَانَ رَبُّكَ نَسِيًّۭا ﴿64﴾", "ru": "Нисходим мы только по повелению Господа твоего, Ему принадлежит то, что пред нами и что позади нас и что между этим. Господь твой не забывчив!"}, {"ref": "20:52", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "قَالَ عِلْمُهَا عِندَ رَبِّى فِى كِتَٰبٍۢ ۖ لَّا يَضِلُّ رَبِّى وَلَا يَنسَى ﴿52﴾", "ru": "Он сказал: \"Знание про них у Господа моего в книге, не заблуждается Господь мой и не забывает\"."}], "n": "Что сказано: «Забыли они Аллаха, и забыл Аллах про них» (9:67). «Сегодня забудем Мы их, как и они забыли про встречу с этим днём» (7:51). «В этот день забудем Мы вас» (45:34). «Мы вас забыли» (32:14). И рядом: «Господь твой не забывчив» (19:64); «не заблуждается Господь мой и не забывает» (20:52).\nВ чём проблема: в двух группах аятов стоит один и тот же корень: в одних Бог «забыл», в других «не забывает». Если читать слово в одном и том же значении (⟦утратить из памяти⟧), аяты противоречат друг другу и всезнанию. Но значение в первой группе другое: из самой конструкции видно, что имеется в виду не потеря памяти, а ⟦оставить, не заботиться⟧. В 7:51 и 45:34 «забудем Мы их, как и они забыли про встречу» зеркально: человек ⟦забыл про встречу⟧ — то есть пренебрёг ею, а не потерял из памяти. Поэтому вопрос сводится к значению слова, а оно в тексте не оговорено. Критик вправе лишь заметить, что Коран не оговаривает, в каком смысле употреблён глагол, и что тот же глагол в 20:52 означает именно утрату знания.\nКак отвечают верующие: богословы единодушны: «забыл» в 9:67 и в других местах — ⟦оставил без милости⟧; в 19:64 и 20:52 — отрицание потери знания.", "c": null, "x": ["3:142", "6:59"], "t": "Бог «забывает» — и Бог «не забывает»", "at": "зависит от перевода или толкования", "pw": "слабый", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. Корень «забыть» стоит и в «Бог забыл» (9:67), и в «Бог не забывает» (20:52). Но в первом случае слово значит «оставил», так что противоречия нет."}, {"refs": ["2:245", "57:11", "64:17", "47:38", "3:97"], "parts": [{"ref": "2:245", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "مَّن ذَا ٱلَّذِى يُقْرِضُ ٱللَّهَ قَرْضًا حَسَنًۭا فَيُضَٰعِفَهُۥ لَهُۥٓ أَضْعَافًۭا كَثِيرَةًۭ ۚ وَٱللَّهُ يَقْبِضُ وَيَبْصُۜطُ وَإِلَيْهِ تُرْجَعُونَ ﴿245﴾", "ru": "Кто даст Аллаху хороший заем, дабы Он увеличил ему во много раз? Аллах сжимает и щедро дает и к Нему вы будете возвращены!"}, {"ref": "57:11", "sura": "Al-Hadid", "sura_ar": "سُورَةُ الحَدِيدِ", "type": "Medinan", "ar": "مَّن ذَا ٱلَّذِى يُقْرِضُ ٱللَّهَ قَرْضًا حَسَنًۭا فَيُضَٰعِفَهُۥ لَهُۥ وَلَهُۥٓ أَجْرٌۭ كَرِيمٌۭ ﴿11﴾", "ru": "Кто даст Аллаху хороший заем, чтобы Он удвоил ему и была бы ему благородная награда?"}, {"ref": "64:17", "sura": "At-Taghaabun", "sura_ar": "سُورَةُ التَّغَابُنِ", "type": "Medinan", "ar": "إِن تُقْرِضُوا۟ ٱللَّهَ قَرْضًا حَسَنًۭا يُضَٰعِفْهُ لَكُمْ وَيَغْفِرْ لَكُمْ ۚ وَٱللَّهُ شَكُورٌ حَلِيمٌ ﴿17﴾", "ru": "Если дадите Аллаху хороший заем, Он удвоит вам и простит вас. Аллах - благодарен, кроток,"}, {"ref": "47:38", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "هَٰٓأَنتُمْ هَٰٓؤُلَآءِ تُدْعَوْنَ لِتُنفِقُوا۟ فِى سَبِيلِ ٱللَّهِ فَمِنكُم مَّن يَبْخَلُ ۖ وَمَن يَبْخَلْ فَإِنَّمَا يَبْخَلُ عَن نَّفْسِهِۦ ۚ وَٱللَّهُ ٱلْغَنِىُّ وَأَنتُمُ ٱلْفُقَرَآءُ ۚ وَإِن تَتَوَلَّوْا۟ يَسْتَبْدِلْ قَوْمًا غَيْرَكُمْ ثُمَّ لَا يَكُونُوٓا۟ أَمْثَٰلَكُم ﴿38﴾", "ru": "Вот вы - те, кого зовут, чтобы расходовать на пути Аллаха. А среди вас есть такие, что скупятся. И кто скупится, тот скупится в отношении самого себя. Поистине, Аллах богат, а вы бедны! А если вы отвернетесь, то Он заменит другим народом, и потом они не будут вам подобны."}, {"ref": "3:97", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "فِيهِ ءَايَٰتٌۢ بَيِّنَٰتٌۭ مَّقَامُ إِبْرَٰهِيمَ ۖ وَمَن دَخَلَهُۥ كَانَ ءَامِنًۭا ۗ وَلِلَّهِ عَلَى ٱلنَّاسِ حِجُّ ٱلْبَيْتِ مَنِ ٱسْتَطَاعَ إِلَيْهِ سَبِيلًۭا ۚ وَمَن كَفَرَ فَإِنَّ ٱللَّهَ غَنِىٌّ عَنِ ٱلْعَٰلَمِينَ ﴿97﴾", "ru": "Там - ясные знамения для людей - место Ибрахима, и тот, кто вошел в него, безопасен. А у Аллаха - на людях обязательство хаджа к дому, - для тех, кто в состоянии совершить путь к нему. А кто не верует... то ведь Аллах - богат, превыше миров!\""}], "n": "Что сказано: «Кто даст Аллаху хороший заём, дабы Он увеличил ему во много раз?» (2:245; также 57:11, 64:17). И рядом: «Поистине, Аллах богат, а вы бедны!» (47:38); «Аллах — богат, превыше миров» (3:97).\nВ чём проблема: кредитор просит у должника то, что и так принадлежит ему: Коран сам говорит, что ⟦Аллаху принадлежит то, что в небесах и на земле⟧ (в 2:284 и 3:189). Если буквально, Бог нуждается в деньгах верующих; но тот же текст говорит, что Он «богат» и ⟦не нуждается⟧. Однако слово «заём» тут явно образное: обещание, что отданное вернётся умноженным, а в 47:38 тут же сказано, что скупость вредит самому скупому. Поэтому это скорее вопрос стиля, чем противоречие. Верующие понимают это как образ; в самом тексте нет утверждения, что Бог действительно получает выгоду.\nКак отвечают верующие: «заём» — риторика, чтобы побудить к милостыне и дать уверенность, что она не пропадёт; Бог ничего не получает.", "c": null, "x": ["2:263", "39:7"], "t": "«Дайте Аллаху заём» — а Аллах «богат»", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Бог просит «заём», хотя «богат» (47:38). Но «заём» — образ щедрости, а не нужда Бога."}, {"refs": ["7:14-17", "15:36-40", "38:79-83", "17:62-65"], "parts": [{"ref": "7:14-17", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "قَالَ أَنظِرْنِىٓ إِلَىٰ يَوْمِ يُبْعَثُونَ ﴿14﴾ قَالَ إِنَّكَ مِنَ ٱلْمُنظَرِينَ ﴿15﴾ قَالَ فَبِمَآ أَغْوَيْتَنِى لَأَقْعُدَنَّ لَهُمْ صِرَٰطَكَ ٱلْمُسْتَقِيمَ ﴿16﴾ ثُمَّ لَءَاتِيَنَّهُم مِّنۢ بَيْنِ أَيْدِيهِمْ وَمِنْ خَلْفِهِمْ وَعَنْ أَيْمَٰنِهِمْ وَعَن شَمَآئِلِهِمْ ۖ وَلَا تَجِدُ أَكْثَرَهُمْ شَٰكِرِينَ ﴿17﴾", "ru": "(14) Он сказал: \"Дай мне отсрочку до дня, когда они будут воскрешены\". (15) Он сказал: \"Ты - среди получивших отсрочку\". (16) Он сказал: \"За то, что Ты сбил меня, я засяду против них на Твоем прямом пути. (17) Потом я приду к ним и спереди, и сзади, и справа, и слева, и Ты не найдешь большинства их благодарными\"."}, {"ref": "15:36-40", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "قَالَ رَبِّ فَأَنظِرْنِىٓ إِلَىٰ يَوْمِ يُبْعَثُونَ ﴿36﴾ قَالَ فَإِنَّكَ مِنَ ٱلْمُنظَرِينَ ﴿37﴾ إِلَىٰ يَوْمِ ٱلْوَقْتِ ٱلْمَعْلُومِ ﴿38﴾ قَالَ رَبِّ بِمَآ أَغْوَيْتَنِى لَأُزَيِّنَنَّ لَهُمْ فِى ٱلْأَرْضِ وَلَأُغْوِيَنَّهُمْ أَجْمَعِينَ ﴿39﴾ إِلَّا عِبَادَكَ مِنْهُمُ ٱلْمُخْلَصِينَ ﴿40﴾", "ru": "(36) Сказал он: \"Господи мой! Отсрочь же мне до дня, когда они будут воскрешены\". (37) Сказал Он: \"Поистине, ты - из тех, кому будет отсрочено (38) до дня назначенного времени\". (39) Сказал он: \"Господи мой! За то, что Ты сбил меня, я украшу им то, что на земле, и собью их всех, (40) кроме рабов Твоих из них, чистых\"."}, {"ref": "38:79-83", "sura": "Saad", "sura_ar": "سُورَةُ صٓ", "type": "Meccan", "ar": "قَالَ رَبِّ فَأَنظِرْنِىٓ إِلَىٰ يَوْمِ يُبْعَثُونَ ﴿79﴾ قَالَ فَإِنَّكَ مِنَ ٱلْمُنظَرِينَ ﴿80﴾ إِلَىٰ يَوْمِ ٱلْوَقْتِ ٱلْمَعْلُومِ ﴿81﴾ قَالَ فَبِعِزَّتِكَ لَأُغْوِيَنَّهُمْ أَجْمَعِينَ ﴿82﴾ إِلَّا عِبَادَكَ مِنْهُمُ ٱلْمُخْلَصِينَ ﴿83﴾", "ru": "(79) Он сказал: \"Господи, отсрочь меня до дня, когда они будут воскрешены!\" (80) Он сказал: \"Поистине, ты из тех, кому отсрочено (81) до дня определенного срока!\" (82) Он сказал: \"Клянусь же Твоим величием, я соблазняю из всех, (83) кроме рабов Твоих среди них чистых!\""}, {"ref": "17:62-65", "sura": "Al-Israa", "sura_ar": "سُورَةُ الإِسۡرَاءِ", "type": "Meccan", "ar": "قَالَ أَرَءَيْتَكَ هَٰذَا ٱلَّذِى كَرَّمْتَ عَلَىَّ لَئِنْ أَخَّرْتَنِ إِلَىٰ يَوْمِ ٱلْقِيَٰمَةِ لَأَحْتَنِكَنَّ ذُرِّيَّتَهُۥٓ إِلَّا قَلِيلًۭا ﴿62﴾ قَالَ ٱذْهَبْ فَمَن تَبِعَكَ مِنْهُمْ فَإِنَّ جَهَنَّمَ جَزَآؤُكُمْ جَزَآءًۭ مَّوْفُورًۭا ﴿63﴾ وَٱسْتَفْزِزْ مَنِ ٱسْتَطَعْتَ مِنْهُم بِصَوْتِكَ وَأَجْلِبْ عَلَيْهِم بِخَيْلِكَ وَرَجِلِكَ وَشَارِكْهُمْ فِى ٱلْأَمْوَٰلِ وَٱلْأَوْلَٰدِ وَعِدْهُمْ ۚ وَمَا يَعِدُهُمُ ٱلشَّيْطَٰنُ إِلَّا غُرُورًا ﴿64﴾ إِنَّ عِبَادِى لَيْسَ لَكَ عَلَيْهِمْ سُلْطَٰنٌۭ ۚ وَكَفَىٰ بِرَبِّكَ وَكِيلًۭا ﴿65﴾", "ru": "(62) Сказал он: \"Видишь ли Ты: это - тот, кого Ты почтил предо мною? Если Ты отсрочишь мне до дня воскресения, я погублю его потомство, кроме немногих\". (63) Сказал Он: \"Уходи! А кто последует за тобой из них, то, поистине, геенна - ваше наказание, наказание полное! (64) Соблазняй, кого ты можешь из них, твоим голосом и собирай против них твою конницу и пехоту, участвуй с ними в их богатствах и детях и обещай им, - поистине, обещает сатана только для обмана! (65) Нет, поистине, у тебя власти над Моими рабами, - и довольно в твоем Господе блюстителя!\""}], "n": "Что сказано: Иблис просит: «Дай мне отсрочку до дня, когда они будут воскрешены». Бог отвечает: «Ты — среди получивших отсрочку» (7:14-15; так же 15:36-38 и 38:79-81). Иблис при этом объявляет цель: «За то, что Ты сбил меня, я засяду против них на Твоём прямом пути» (7:16); «я украшу им то, что на земле, и собью их всех» (15:39). В 17:64 Бог добавляет: «Соблазняй, кого ты можешь из них».\nВ чём проблема: (1) Бог даёт отсрочку тому, кто открыто объявил, что будет сбивать людей, то есть сознательно оставляет в мире соблазнителя. (2) Иблис говорит «Ты сбил меня», и Бог в тексте этого не оспаривает (это слова Иблиса, но ответ на них не опровергает их). (3) В 17:64 разрешение соблазнять дано прямо. Это ставит вопрос об ответственности: если Бог всемогущ и всеведущ, то зло в мире присутствует по Его разрешению. Но это общий ⟦вопрос о зле⟧, а не противоречие внутри текста, и в 17:65 дано пояснение: «у тебя власти над Моими рабами». Поэтому аргумент относится к этическим и богословским, а не к текстовым.\nКак отвечают верующие: отсрочка — часть испытания свободного выбора: без возможности соблазна не было бы заслуги; Иблис не имеет власти принудить (17:65).", "c": null, "x": ["18:29", "15:39", "2:34"], "t": "Бог даёт Иблису отсрочку, зная, что тот сделает", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Бог даёт отсрочку Иблису, который прямо объявил, что будет сбивать людей. Это вопрос о происхождении зла; текст на него не отвечает полностью (17:65 говорит лишь, что над «рабами» у Иблиса нет власти)."}, {"refs": ["6:35", "6:107", "6:149", "13:31", "10:99", "16:93"], "parts": [{"ref": "6:35", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَإِن كَانَ كَبُرَ عَلَيْكَ إِعْرَاضُهُمْ فَإِنِ ٱسْتَطَعْتَ أَن تَبْتَغِىَ نَفَقًۭا فِى ٱلْأَرْضِ أَوْ سُلَّمًۭا فِى ٱلسَّمَآءِ فَتَأْتِيَهُم بِـَٔايَةٍۢ ۚ وَلَوْ شَآءَ ٱللَّهُ لَجَمَعَهُمْ عَلَى ٱلْهُدَىٰ ۚ فَلَا تَكُونَنَّ مِنَ ٱلْجَٰهِلِينَ ﴿35﴾", "ru": "А если тягостно для тебя их отвращение, то если бы ты мог отыскать расселину или лестницу на небо и пришел бы к ним со знамением! Если бы пожелал Аллах, то Он собрал бы их на прямом пути; не будь же невеждой!"}, {"ref": "6:107", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "وَلَوْ شَآءَ ٱللَّهُ مَآ أَشْرَكُوا۟ ۗ وَمَا جَعَلْنَٰكَ عَلَيْهِمْ حَفِيظًۭا ۖ وَمَآ أَنتَ عَلَيْهِم بِوَكِيلٍۢ ﴿107﴾", "ru": "Если бы захотел Аллах, они не придавали бы Ему сотоварищей. Мы не делали тебя хранителем их. И ты над ними не надсмотрщик."}, {"ref": "6:149", "sura": "Al-An'aam", "sura_ar": "سُورَةُ الأَنۡعَامِ", "type": "Meccan", "ar": "قُلْ فَلِلَّهِ ٱلْحُجَّةُ ٱلْبَٰلِغَةُ ۖ فَلَوْ شَآءَ لَهَدَىٰكُمْ أَجْمَعِينَ ﴿149﴾", "ru": "Скажи: \"У Аллаха - убедительное доказательство. Если бы Он хотел, то всех бы вывел на прямой путь\"."}, {"ref": "13:31", "sura": "Ar-Ra'd", "sura_ar": "سُورَةُ الرَّعۡدِ", "type": "Medinan", "ar": "وَلَوْ أَنَّ قُرْءَانًۭا سُيِّرَتْ بِهِ ٱلْجِبَالُ أَوْ قُطِّعَتْ بِهِ ٱلْأَرْضُ أَوْ كُلِّمَ بِهِ ٱلْمَوْتَىٰ ۗ بَل لِّلَّهِ ٱلْأَمْرُ جَمِيعًا ۗ أَفَلَمْ يَا۟يْـَٔسِ ٱلَّذِينَ ءَامَنُوٓا۟ أَن لَّوْ يَشَآءُ ٱللَّهُ لَهَدَى ٱلنَّاسَ جَمِيعًۭا ۗ وَلَا يَزَالُ ٱلَّذِينَ كَفَرُوا۟ تُصِيبُهُم بِمَا صَنَعُوا۟ قَارِعَةٌ أَوْ تَحُلُّ قَرِيبًۭا مِّن دَارِهِمْ حَتَّىٰ يَأْتِىَ وَعْدُ ٱللَّهِ ۚ إِنَّ ٱللَّهَ لَا يُخْلِفُ ٱلْمِيعَادَ ﴿31﴾", "ru": "И если бы Кораном двигались горы, или рассекалась земля, или говорили бы мертвые... Да, Аллаху принадлежит вся власть! Разве не отчаиваются те, которые уверовали, что если бы Аллах пожелал, то повел бы прямым путем всех людей. И не перестает поражать удар тех, которые не веровали, за то, что они совершали, или остановится он близко от их жилищ, пока не придет обещание Аллаха; поистине, Аллах не меняет времени обещания!"}, {"ref": "10:99", "sura": "Yunus", "sura_ar": "سُورَةُ يُونُسَ", "type": "Meccan", "ar": "وَلَوْ شَآءَ رَبُّكَ لَءَامَنَ مَن فِى ٱلْأَرْضِ كُلُّهُمْ جَمِيعًا ۚ أَفَأَنتَ تُكْرِهُ ٱلنَّاسَ حَتَّىٰ يَكُونُوا۟ مُؤْمِنِينَ ﴿99﴾", "ru": "А если бы пожелал твой Господь, тогда уверовали бы все, кто на земле, целиком. Разве ж ты вынудишь людей к тому, что они станут верующими?"}, {"ref": "16:93", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "وَلَوْ شَآءَ ٱللَّهُ لَجَعَلَكُمْ أُمَّةًۭ وَٰحِدَةًۭ وَلَٰكِن يُضِلُّ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَلَتُسْـَٔلُنَّ عَمَّا كُنتُمْ تَعْمَلُونَ ﴿93﴾", "ru": "А если бы Аллах пожелал, Он сделал бы вас одним народом. Однако, Он сбивает, кого хочет, и ведет прямым путем, кого хочет, и будете вы спрошены о том, что творили."}], "n": "Что сказано: «Если бы пожелал Аллах, то Он собрал бы их на прямом пути» (6:35). «Если бы Он хотел, то всех бы вывел на прямой путь» (6:149). «если бы Аллах пожелал, то повёл бы прямым путём всех людей» (13:31). «А если бы пожелал твой Господь, тогда уверовали бы все, кто на земле, целиком» (10:99). «А если бы Аллах пожелал, Он сделал бы вас одним народом. Однако Он сбивает, кого хочет» (16:93).\nВ чём проблема: текст прямо говорит: то, что люди не уверовали, — следствие того, что Бог этого не пожелал. А рядом: угроза огнём тем, кто не уверовал (например, 18:29; 4:56), и призывы к вере как свободному выбору. Это одно из главных мест всего Корана по вопросу о свободе воли. Два слоя: (1) факт, явно названный в тексте: Бог мог бы сделать всех верующими, но не пожелал; (2) вывод критика: тогда наказание несправедливо. Второй шаг требует допущения (что ответственность невозможна без возможности другого исхода), и его оспаривают не только верующие, но и философы. Но в самом тексте есть и напряжение с 39:7: ⟦не соблаговолит Он Своих рабов на неверие⟧, где неверие названо тем, чего Бог не одобряет, хотя допускает. Ответ верующих: различие ⟦желает⟧ (допускает) и ⟦одобряет⟧ (любит).\nКак отвечают верующие: в классическом богословии различают Божью волю ⟦допускающую⟧ и ⟦одобряющую⟧: Бог допускает неверие, но не одобряет. 10:99 тут же показывает, что вера не может быть вынужденной.", "c": null, "x": ["18:29", "2:26", "14:4", "7:178-179", "39:7"], "t": "«Если бы Аллах пожелал, повёл бы всех прямым путём»", "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Текст прямо говорит: Бог мог бы повести всех, но не пожелал (6:149, 10:99). При этом он угрожает неверным адом. Это явное напряжение со свободой выбора (18:29); верующие различают «желание» и «одобрение» (39:7)."}, {"refs": ["8:66", "58:13"], "parts": [{"ref": "8:66", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "ٱلْـَٰٔنَ خَفَّفَ ٱللَّهُ عَنكُمْ وَعَلِمَ أَنَّ فِيكُمْ ضَعْفًۭا ۚ فَإِن يَكُن مِّنكُم مِّا۟ئَةٌۭ صَابِرَةٌۭ يَغْلِبُوا۟ مِا۟ئَتَيْنِ ۚ وَإِن يَكُن مِّنكُمْ أَلْفٌۭ يَغْلِبُوٓا۟ أَلْفَيْنِ بِإِذْنِ ٱللَّهِ ۗ وَٱللَّهُ مَعَ ٱلصَّٰبِرِينَ ﴿66﴾", "ru": "Ныне облегчил вам Аллах; Он знает, что у вас есть слабость. А если будет среди вас сотня терпеливая, то они победят двести, а если будет среди вас тысяча, то они победят две тысячи с дозволения Аллаха: ведь Аллах - с терпеливыми!"}, {"ref": "58:13", "sura": "Al-Mujaadila", "sura_ar": "سُورَةُ المُجَادلَةِ", "type": "Medinan", "ar": "ءَأَشْفَقْتُمْ أَن تُقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَٰتٍۢ ۚ فَإِذْ لَمْ تَفْعَلُوا۟ وَتَابَ ٱللَّهُ عَلَيْكُمْ فَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ ۚ وَٱللَّهُ خَبِيرٌۢ بِمَا تَعْمَلُونَ ﴿13﴾", "ru": "Разве вы боитесь до вашей беседы выдвинуть милостыни? Если же вы этого не сделали и Аллах обратился к вам, то выстаивайте молитву, и давайте очищение, и повинуйтесь Аллаху и Его посланнику. А Аллах сведущ в том, что вы делаете!"}], "n": "Что сказано: После того как в 8:65 верующим велено, чтобы двадцать терпеливых побеждали двести, в 8:66 сказано: «Ныне облегчил вам Аллах; Он знает, что у вас есть слабость». В 58:13: «Если же вы этого не сделали и Аллах обратился к вам, то выстаивайте молитву».\nВ чём проблема: слово «ныне» и последовательность ⟦приказал — облегчил⟧ читаются как изменение решения после того, как выяснилась слабость людей. Если Бог знал слабость заранее (а в 6:59 сказано, что Он знает всё, вплоть до ⟦листа⟧), то первое правило можно было сразу дать мягче. При этом слово «знает» стоит в настоящем времени, и в тексте нет слов ⟦узнал только что⟧. Верующие отвечают, что поэтапность — часть замысла, а смягчение — милость. Более жёсткая формулировка (⟦Бог узнаёт⟧) уместна не здесь, а в 3:142 и 47:31 (раздел ⟦Образ Бога⟧). Тема отмены норм разобрана отдельно: см. раздел ⟦Отмена аятов (насх)⟧.\nКак отвечают верующие: постепенное смягчение — милость; Бог знал о слабости, а «ныне» относится к моменту, когда она стала проявляться.", "c": null, "x": ["8:65-66", "58:12", "73:2-4", "2:106", "3:142"], "t": "Бог «облегчил, зная слабость» и «обратился» к людям", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. «Ныне облегчил, зная слабость» читается как изменение решения, но слово «знает» стоит в настоящем времени. Прямой ошибки нет."}, {"refs": ["2:30", "2:32", "72:26-27"], "parts": [{"ref": "2:30", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ رَبُّكَ لِلْمَلَٰٓئِكَةِ إِنِّى جَاعِلٌۭ فِى ٱلْأَرْضِ خَلِيفَةًۭ ۖ قَالُوٓا۟ أَتَجْعَلُ فِيهَا مَن يُفْسِدُ فِيهَا وَيَسْفِكُ ٱلدِّمَآءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ ۖ قَالَ إِنِّىٓ أَعْلَمُ مَا لَا تَعْلَمُونَ ﴿30﴾", "ru": "И вот, сказал Господь твой ангелам: \"Я установлю на земле наместника\". Они сказали: \"Разве Ты установишь на ней того, кто будет там производить нечестие и проливать кровь, а мы возносим хвалу Тебе и святим Тебя?\" Он сказал: \"Поистине, Я знаю то, чего вы не знаете!\""}, {"ref": "2:32", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "قَالُوا۟ سُبْحَٰنَكَ لَا عِلْمَ لَنَآ إِلَّا مَا عَلَّمْتَنَآ ۖ إِنَّكَ أَنتَ ٱلْعَلِيمُ ٱلْحَكِيمُ ﴿32﴾", "ru": "Они сказали: \"Хвала Тебе! Мы знаем только то, чему Ты нас научил. Поистине, Ты - знающий, мудрый!\""}, {"ref": "72:26-27", "sura": "Al-Jinn", "sura_ar": "سُورَةُ الجِنِّ", "type": "Meccan", "ar": "عَٰلِمُ ٱلْغَيْبِ فَلَا يُظْهِرُ عَلَىٰ غَيْبِهِۦٓ أَحَدًا ﴿26﴾ إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا ﴿27﴾", "ru": "(26) ведающий сокровенное; и не даст Он узнать сокровенное у Него никому, (27) кроме тех, к кому Он соблаговолил как к посланнику, и тогда Он ведет пред ним и позади его наблюдателя,"}], "n": "Что сказано: Бог говорит ангелам: «Я установлю на земле наместника». Они отвечают: «Разве Ты установишь на ней того, кто будет там производить нечестие и проливать кровь?» Бог: «Поистине, Я знаю то, чего вы не знаете» (2:30). Позже ангелы признают: «Мы знаем только то, чему Ты нас научил» (2:32). А в 72:26-27 сказано: Бог «не даст Он узнать сокровенное у Него никому, кроме тех, к кому Он соблаговолил как к посланнику».\nВ чём проблема: ангелы заранее называют, что будет делать создание, которого ещё нет. То есть они либо знают будущее (сокровенное), либо делают вывод из чего-то известного; в тексте об этом не сказано. В 2:32 они признают, что знают лишь то, чему научены; в 72:26-27 знание сокровенного закреплено за Богом и ⟦посланниками⟧. Прямого противоречия нет: можно считать, что их научили. Но Бог не опровергает их прогноз, а отвечает лишь «Я знаю то, чего вы не знаете». Вывод критика: Бог сознательно создаёт существо, которое, как заранее известно, будет проливать кровь. Это вариант ⟦вопроса о зле⟧, в самом тексте он не сформулирован.\nКак отвечают верующие: ангелы говорят не о знании будущего, а о предположении, основанном на прежних творениях; Бог отвечает, что у Него есть мудрость, неизвестная им.", "c": null, "x": ["34:14", "7:188", "6:59"], "t": "Ангелы знают будущее людей: «будет проливать кровь»", "at": "внутреннее противоречие", "pw": "слабый", "cl": "Вывод: фиксируется неполнота или двусмысленность текста. Ангелы заранее говорят, что человек будет проливать кровь, хотя в 2:32 признают, что знают только то, чему научены. Текст не говорит, откуда у них эта мысль, и это не разъяснено: можно считать, что это предположение."}], "summary": ["Прямого аята «Бог не всемогущ» в Коране нет; утверждается обратное.", "Все претензии — это внутренние напряжения, а не явные заявления.", "Самое весомое: «если бы Он захотел, повёл бы всех» рядом с угрозами (6:149, 18:29).", "Слабые: «забыл», «заём», «облегчил, зная слабость»."]}, {"id": "oaths", "title": "Клятвы Бога", "icon": "✎", "group": "Основы: вера, обряды и голос текста", "intro": "Бог в Коране часто клянётся — звёздами, смоковницей, временем, жизнью Пророка и Самим Собой. Это нетипичная для священной книги черта; вопрос — зачем нужна клятва тому, чьё слово по определению истинно, и как это согласуется с самим Кораном.", "verses": [{"refs": ["15:72", "16:63", "51:23", "70:40", "56:75-76", "36:2", "38:1", "50:1"], "parts": [{"ref": "15:72", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "لَعَمْرُكَ إِنَّهُمْ لَفِى سَكْرَتِهِمْ يَعْمَهُونَ ﴿72﴾", "ru": "Клянусь твоей жизнью! Ведь они в своем опьянении скитаются слепо."}, {"ref": "16:63", "sura": "An-Nahl", "sura_ar": "سُورَةُ النَّحۡلِ", "type": "Meccan", "ar": "تَٱللَّهِ لَقَدْ أَرْسَلْنَآ إِلَىٰٓ أُمَمٍۢ مِّن قَبْلِكَ فَزَيَّنَ لَهُمُ ٱلشَّيْطَٰنُ أَعْمَٰلَهُمْ فَهُوَ وَلِيُّهُمُ ٱلْيَوْمَ وَلَهُمْ عَذَابٌ أَلِيمٌۭ ﴿63﴾", "ru": "Клянусь Аллахом, Мы посылали к народам до тебя, и сатана разукрасил им их деяния. Он их защитник сегодня, и им - наказание мучительное!"}, {"ref": "51:23", "sura": "Adh-Dhaariyat", "sura_ar": "سُورَةُ الذَّارِيَاتِ", "type": "Meccan", "ar": "فَوَرَبِّ ٱلسَّمَآءِ وَٱلْأَرْضِ إِنَّهُۥ لَحَقٌّۭ مِّثْلَ مَآ أَنَّكُمْ تَنطِقُونَ ﴿23﴾", "ru": "Клянусь же Господом небес и земли, ведь это - истина, как то, что вы действительно говорите!"}, {"ref": "70:40", "sura": "Al-Ma'aarij", "sura_ar": "سُورَةُ المَعَارِجِ", "type": "Meccan", "ar": "فَلَآ أُقْسِمُ بِرَبِّ ٱلْمَشَٰرِقِ وَٱلْمَغَٰرِبِ إِنَّا لَقَٰدِرُونَ ﴿40﴾", "ru": "И нет! Клянусь Господом востоков и западов, Мы ведь можем"}, {"ref": "56:75-76", "sura": "Al-Waaqia", "sura_ar": "سُورَةُ الوَاقِعَةِ", "type": "Meccan", "ar": "۞ فَلَآ أُقْسِمُ بِمَوَٰقِعِ ٱلنُّجُومِ ﴿75﴾ وَإِنَّهُۥ لَقَسَمٌۭ لَّوْ تَعْلَمُونَ عَظِيمٌ ﴿76﴾", "ru": "(75) Но нет, клянусь местом заката звезд! (76) А ведь это - клятва, если бы вы знали, великая."}, {"ref": "36:2", "sura": "Yaseen", "sura_ar": "سُورَةُ يسٓ", "type": "Meccan", "ar": "وَٱلْقُرْءَانِ ٱلْحَكِيمِ ﴿2﴾", "ru": "Клянусь Кораном мудрым!"}, {"ref": "38:1", "sura": "Saad", "sura_ar": "سُورَةُ صٓ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ صٓ ۚ وَٱلْقُرْءَانِ ذِى ٱلذِّكْرِ ﴿1﴾", "ru": "Сад. Клянусь Кораном, содержащим напоминание!"}, {"ref": "50:1", "sura": "Qaaf", "sura_ar": "سُورَةُ قٓ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قٓ ۚ وَٱلْقُرْءَانِ ٱلْمَجِيدِ ﴿1﴾", "ru": "Каф. Клянусь Кораном славным!"}], "n": "Что сказано: «Клянусь твоей жизнью! Ведь они в своём опьянении скитаются слепо» (15:72); «Клянусь Аллахом, Мы посылали к народам до тебя» (16:63); «Клянусь же Господом небес и земли, ведь это — истина» (51:23); «клянусь Господом востоков и западов» (70:40); «клянусь местом заката звёзд» (56:75); «Клянусь Кораном мудрым!» (36:2); «Сад. Клянусь Кораном, содержащим напоминание!» (38:1); «Каф. Клянусь Кораном славным!» (50:1).\nВ чём проблема: (1) Клятва нужна, когда слову не верят; Бог, чьё слово истинно по определению, в клятве не нуждается. (2) Бог клянётся созданным — жизнью Пророка, звёздами, Кораном. Но в 2:224 верующим сказано: ⟦Не делайте Аллаха предметом ваших клятв⟧. (3) В 16:94 клятвы названы средством обмана (⟦не обращайте клятв в обман между собой⟧). Апологеты: клятвы — риторический приём арабской речи и знак величия вещей.", "c": null, "x": ["2:224", "16:94"], "t": "Бог клянётся Пророком, Самим Собой, звёздами и Кораном", "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Бог клянётся созданным (жизнью Пророка, звёздами), а верующим в 2:224 не велено делать Его предметом клятв. Это разное положение Бога и человека, но вопрос «зачем клятва тому, чьё слово истинно» в тексте остаётся без ответа."}, {"refs": ["51:1-4", "52:1-6", "53:1", "77:1-6", "79:1-5", "85:1-3", "89:1-5", "91:1-8", "92:1-3", "93:1-2", "95:1-3", "100:1-5", "103:1-3"], "parts": [{"ref": "51:1-4", "sura": "Adh-Dhaariyat", "sura_ar": "سُورَةُ الذَّارِيَاتِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلذَّٰرِيَٰتِ ذَرْوًۭا ﴿1﴾ فَٱلْحَٰمِلَٰتِ وِقْرًۭا ﴿2﴾ فَٱلْجَٰرِيَٰتِ يُسْرًۭا ﴿3﴾ فَٱلْمُقَسِّمَٰتِ أَمْرًا ﴿4﴾", "ru": "(1) Клянусь рассеивающими милосердного! (2) и несущими ношу, (3) и текущими с легкостью, (4) и разделяющими повеления!"}, {"ref": "52:1-6", "sura": "At-Tur", "sura_ar": "سُورَةُ الطُّورِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلطُّورِ ﴿1﴾ وَكِتَٰبٍۢ مَّسْطُورٍۢ ﴿2﴾ فِى رَقٍّۢ مَّنشُورٍۢ ﴿3﴾ وَٱلْبَيْتِ ٱلْمَعْمُورِ ﴿4﴾ وَٱلسَّقْفِ ٱلْمَرْفُوعِ ﴿5﴾ وَٱلْبَحْرِ ٱلْمَسْجُورِ ﴿6﴾", "ru": "(1) Клянусь горой, (2) и книгой, начертанной (3) на свитке развернутом, (4) и домом посещаемым, (5) и кровлей вознесенной, (6) и морем вздутым -"}, {"ref": "53:1", "sura": "An-Najm", "sura_ar": "سُورَةُ النَّجۡمِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلنَّجْمِ إِذَا هَوَىٰ ﴿1﴾", "ru": "Клянусь звездой, когда она закатывается!"}, {"ref": "77:1-6", "sura": "Al-Mursalaat", "sura_ar": "سُورَةُ المُرۡسَلَاتِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلْمُرْسَلَٰتِ عُرْفًۭا ﴿1﴾ فَٱلْعَٰصِفَٰتِ عَصْفًۭا ﴿2﴾ وَٱلنَّٰشِرَٰتِ نَشْرًۭا ﴿3﴾ فَٱلْفَٰرِقَٰتِ فَرْقًۭا ﴿4﴾ فَٱلْمُلْقِيَٰتِ ذِكْرًا ﴿5﴾ عُذْرًا أَوْ نُذْرًا ﴿6﴾", "ru": "(1) Клянусь посылаемыми поочередно, (2) и веющими сильно, (3) и распространяющими бурно, (4) и различающими твердо, (5) и передающими напоминание, (6) извинение или внушение!"}, {"ref": "79:1-5", "sura": "An-Naazi'aat", "sura_ar": "سُورَةُ النَّازِعَاتِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلنَّٰزِعَٰتِ غَرْقًۭا ﴿1﴾ وَٱلنَّٰشِطَٰتِ نَشْطًۭا ﴿2﴾ وَٱلسَّٰبِحَٰتِ سَبْحًۭا ﴿3﴾ فَٱلسَّٰبِقَٰتِ سَبْقًۭا ﴿4﴾ فَٱلْمُدَبِّرَٰتِ أَمْرًۭا ﴿5﴾", "ru": "(1) Клянусь вырывающими с силой, (2) извлекающими стремительно, (3) плавающими плавно, (4) опережающими быстро (5) и распространяющими приказ!"}, {"ref": "85:1-3", "sura": "Al-Burooj", "sura_ar": "سُورَةُ البُرُوجِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلسَّمَآءِ ذَاتِ ٱلْبُرُوجِ ﴿1﴾ وَٱلْيَوْمِ ٱلْمَوْعُودِ ﴿2﴾ وَشَاهِدٍۢ وَمَشْهُودٍۢ ﴿3﴾", "ru": "(1) Клянусь небом - обладателем башен, (2) и днем обещанным, (3) и свидетелем, и тем, о ком он свидетельствует!"}, {"ref": "89:1-5", "sura": "Al-Fajr", "sura_ar": "سُورَةُ الفَجۡرِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلْفَجْرِ ﴿1﴾ وَلَيَالٍ عَشْرٍۢ ﴿2﴾ وَٱلشَّفْعِ وَٱلْوَتْرِ ﴿3﴾ وَٱلَّيْلِ إِذَا يَسْرِ ﴿4﴾ هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ ﴿5﴾", "ru": "(1) Клянусь зарею, (2) и десятью ночами, (3) и четом и нечетом, (4) и ночью, когда она движется! (5) Разве в этом - не клятва рассудительного?"}, {"ref": "91:1-8", "sura": "Ash-Shams", "sura_ar": "سُورَةُ الشَّمۡسِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلشَّمْسِ وَضُحَىٰهَا ﴿1﴾ وَٱلْقَمَرِ إِذَا تَلَىٰهَا ﴿2﴾ وَٱلنَّهَارِ إِذَا جَلَّىٰهَا ﴿3﴾ وَٱلَّيْلِ إِذَا يَغْشَىٰهَا ﴿4﴾ وَٱلسَّمَآءِ وَمَا بَنَىٰهَا ﴿5﴾ وَٱلْأَرْضِ وَمَا طَحَىٰهَا ﴿6﴾ وَنَفْسٍۢ وَمَا سَوَّىٰهَا ﴿7﴾ فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَىٰهَا ﴿8﴾", "ru": "(1) Клянусь солнцем и его сиянием, (2) и месяцем, когда он за ним следует, (3) и днем, когда он его обнаруживает, (4) и ночью, когда она его покрывает, (5) и небом, и тем, что его построило, (6) и землей, и тем, что ее распростерло, (7) и всякой душой, и тем, что ее устроило (8) и внушило ей распущенность ее и богобоязненность!"}, {"ref": "92:1-3", "sura": "Al-Lail", "sura_ar": "سُورَةُ اللَّيۡلِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلَّيْلِ إِذَا يَغْشَىٰ ﴿1﴾ وَٱلنَّهَارِ إِذَا تَجَلَّىٰ ﴿2﴾ وَمَا خَلَقَ ٱلذَّكَرَ وَٱلْأُنثَىٰٓ ﴿3﴾", "ru": "(1) Клянусь ночью, когда она покрывает, (2) и днем, когда он засиял, (3) и тем, что создало мужчину и женщину, -"}, {"ref": "93:1-2", "sura": "Ad-Dhuhaa", "sura_ar": "سُورَةُ الضُّحَىٰ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلضُّحَىٰ ﴿1﴾ وَٱلَّيْلِ إِذَا سَجَىٰ ﴿2﴾", "ru": "(1) Клянусь утром (2) и ночью, когда она густеет!"}, {"ref": "95:1-3", "sura": "At-Tin", "sura_ar": "سُورَةُ التِّينِ", "type": "Meccan", "ar": "بِّسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلتِّينِ وَٱلزَّيْتُونِ ﴿1﴾ وَطُورِ سِينِينَ ﴿2﴾ وَهَٰذَا ٱلْبَلَدِ ٱلْأَمِينِ ﴿3﴾", "ru": "(1) Клянусь смоковницей и маслиной, (2) и горою Синаем, (3) и этим городом безопасным!"}, {"ref": "100:1-5", "sura": "Al-Aadiyaat", "sura_ar": "سُورَةُ العَادِيَاتِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلْعَٰدِيَٰتِ ضَبْحًۭا ﴿1﴾ فَٱلْمُورِيَٰتِ قَدْحًۭا ﴿2﴾ فَٱلْمُغِيرَٰتِ صُبْحًۭا ﴿3﴾ فَأَثَرْنَ بِهِۦ نَقْعًۭا ﴿4﴾ فَوَسَطْنَ بِهِۦ جَمْعًا ﴿5﴾", "ru": "(1) Клянусь мчащимися, задыхаясь, (2) и выбивающими искры, (3) и нападающими на заре... (4) И они подняли там пыль, (5) и ворвались там толпой..."}, {"ref": "103:1-3", "sura": "Al-Asr", "sura_ar": "سُورَةُ العَصۡرِ", "type": "Meccan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ وَٱلْعَصْرِ ﴿1﴾ إِنَّ ٱلْإِنسَٰنَ لَفِى خُسْرٍ ﴿2﴾ إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَتَوَاصَوْا۟ بِٱلْحَقِّ وَتَوَاصَوْا۟ بِٱلصَّبْرِ ﴿3﴾", "ru": "(1) Клянусь предвечерним временем, (2) поистине, человек ведь в убытке, (3) кроме тех, которые уверовали, и творили добрые дела, и заповедали между собой истину, и заповедали между собой терпение!"}], "n": "Что сказано: Бог клянётся: «рассеивающими» (51:1), горой (52:1), звездой (53:1), «посылаемыми» (77:1), «вырывающими» (79:1), небом с созвездиями (85:1), зарёй и десятью ночами (89:1-2), солнцем, луной, днём, ночью, небом, землёй (91:1-6), ночью и днём (92:1-2), утром и ночью (93:1-2), смоковницей, маслиной, горой Синай (95:1-3), мчащимися скакунами (100:1), временем (103:1).\nВ чём проблема: Бог клянётся огромным числом созданных вещей. У большинства клятв неясен предмет: что значит «рассеивающими» и «посылаемыми» — не названо в тексте, и толкователи предлагают разные варианты (ветры, ангелы, облака). Для критиков это показывает, что часть клятв остаётся без смысла. Кроме того, клясться чем-либо, кроме Аллаха, считается нарушением единобожия; в Коране же Бог клянётся тварями. Мусульманские богословы: ⟦Богу можно, людям нельзя⟧.", "c": null, "x": ["2:224"], "t": "Клятвы тварями в коротких сурах", "at": "зависит от перевода или толкования", "pw": "слабый", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. Предметы клятв неясны в самом тексте («рассеивающие», «несущие»). Это вопрос перевода и толкования, а не противоречие."}], "summary": ["Клятвы Бога созданными вещами — наблюдение о стиле.", "Вопрос о том, зачем Богу клятва, поставлен, но однозначного ответа в тексте нет."]}, {"id": "violence", "title": "Война и насилие против неверных", "icon": "⚔", "group": "Насилие и жестокость", "intro": "Аяты, которые содержат прямые призывы убивать, сражаться и устрашать противников. Большинство относится к мединскому периоду (после 622 г.), когда община Мухаммада вела военные действия. Обратите внимание на формулы, не привязанные к конкретному событию в самом тексте («где бы ни нашли», «пока не исчезнет смута»).", "verses": [{"n": "Что сказано: ⟦Убивайте их, где встретите, и изгоняйте их оттуда, откуда они изгнали вас: ведь соблазн (фитна) — хуже, чем убиение⟧.\nВ чём проблема: приказ убивать дан без привязки к конкретному сражению. Ключевое слово ⟦фитна⟧ (⟦соблазн, смута⟧): если оно означает ⟦неверие вообще⟧ — убийство оправдано за неверие; если ⟦преследование верующих⟧ — это оборона. Сам текст оставляет обе возможности, а в 2:193 и 8:39 та же ⟦фитна⟧ должна исчезнуть, пока вся религия не будет Аллаха.\nКак отвечают верующие: рядом стоят ограничения: 2:190 (сражаться только с теми, кто сражается) и 2:192 (если прекратят — Бог прощает).", "c": "Контекст — конфликт с курайшитами; соседние аяты 2:190 и 2:192–193 ограничивают: сражаться с теми, кто сражается.", "x": ["2:190", "2:192", "2:193", "2:256", "9:5"], "refs": ["2:191"], "parts": [{"ref": "2:191", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْ وَأَخْرِجُوهُم مِّنْ حَيْثُ أَخْرَجُوكُمْ ۚ وَٱلْفِتْنَةُ أَشَدُّ مِنَ ٱلْقَتْلِ ۚ وَلَا تُقَٰتِلُوهُمْ عِندَ ٱلْمَسْجِدِ ٱلْحَرَامِ حَتَّىٰ يُقَٰتِلُوكُمْ فِيهِ ۖ فَإِن قَٰتَلُوكُمْ فَٱقْتُلُوهُمْ ۗ كَذَٰلِكَ جَزَآءُ ٱلْكَٰفِرِينَ ﴿191﴾", "ru": "И убивайте их, где встретите, и изгоняйте их оттуда, откуда они изгнали вас: ведь соблазн - хуже, чем убиение! И не сражайтесь с ними у запретной мечети, пока они не станут сражаться там с вами. Если же они будут сражаться с вами, то убивайте их: таково воздаяние неверных!"}], "t": null, "at": "зависит от перевода или толкования", "pw": "средний", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. Приказ убивать «где найдёте» зависит от значения слова «фитна»: преследование или неверие вообще. Текст допускает оба прочтения; вывод зависит от толкования."}, {"n": "Что сказано: ⟦Предписано вам сражение, хотя оно вам ненавистно. Может быть, вы ненавидите то, что для вас благо⟧.\nВ чём проблема: война названа обязанностью (тем же словом «предписано», что и пост в 2:183), а нежелание воевать объявлено ошибкой самих верующих. В аяте нет условия обороны. Толкователи расходятся, относится ли это ко всем верующим всегда или только к конкретному походу — а на этот аят ссылаются как на общий закон.\nКак отвечают верующие: апологеты связывают его с положением общины в Медине, куда верующих изгнали.", "c": "Многие толкователи относят к конкретной обороне общины; другие видят в нём общий принцип джихада.", "x": ["2:183", "9:41", "4:95"], "refs": ["2:216"], "parts": [{"ref": "2:216", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "كُتِبَ عَلَيْكُمُ ٱلْقِتَالُ وَهُوَ كُرْهٌۭ لَّكُمْ ۖ وَعَسَىٰٓ أَن تَكْرَهُوا۟ شَيْـًۭٔا وَهُوَ خَيْرٌۭ لَّكُمْ ۖ وَعَسَىٰٓ أَن تُحِبُّوا۟ شَيْـًۭٔا وَهُوَ شَرٌّۭ لَّكُمْ ۗ وَٱللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ ﴿216﴾", "ru": "Предписано вам сражение, а оно ненавистно для вас. И может быть, вы ненавидите что-нибудь, а оно для вас благо, и может быть, вы любите что-нибудь, а оно для вас зло, - поистине, Аллах знает, а вы не знаете!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Война названа обязанностью без условия обороны, хотя в 2:190 условие есть. Расхождение возникает только если читать аяты порознь."}, {"n": "Что сказано: Бог внушает ангелам: ⟦Я — с вами, укрепите верующих! Я брошу в сердца неверных страх; бейте же их по шеям, бейте их по всем пальцам!⟧\nВ чём проблема: Бог лично описывает и одобряет увечья: удар ⟦по шее⟧ (обезглавливание) и ⟦по пальцам⟧ (калечение). Причина назван страх и неверие, а не конкретное нападение. В 47:4 тот же приказ дан самим верующим: «по шеям».\nКак отвечают верующие: аят описывает битву при Бадре (первая крупная битва верующих с мекканцами).", "c": "Описание битвы при Бадре (624 г.).", "x": ["47:4", "8:13"], "refs": ["8:12"], "parts": [{"ref": "8:12", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "إِذْ يُوحِى رَبُّكَ إِلَى ٱلْمَلَٰٓئِكَةِ أَنِّى مَعَكُمْ فَثَبِّتُوا۟ ٱلَّذِينَ ءَامَنُوا۟ ۚ سَأُلْقِى فِى قُلُوبِ ٱلَّذِينَ كَفَرُوا۟ ٱلرُّعْبَ فَٱضْرِبُوا۟ فَوْقَ ٱلْأَعْنَاقِ وَٱضْرِبُوا۟ مِنْهُمْ كُلَّ بَنَانٍۢ ﴿12﴾", "ru": "Вот внушил Господь твой ангелам: \"Я - с вами, укрепите тех, которые уверовали! Я брошу в сердца тех, которые не веровали, страх; бейте же их по шеям, бейте их по всем пальцам!\""}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Бог лично описывает удар по шее и пальцам. В контексте это сражение, поэтому довод держится на том, считать ли аят общей нормой или описанием боя."}, {"n": "Что сказано: ⟦И сражайтесь с ними, пока не будет искушения, и религия вся будет принадлежать Аллаху. А если они удержатся — то ведь Аллах видит то, что они делают⟧.\nВ чём проблема: цель войны — чтобы «религия вся» принадлежала Аллаху. Из текста неясно, чего именно они должны ⟦удержаться⟧: нападения или неверия. Дословный повтор — 2:193. Спорит с 2:256 и 109:6. Классическое право использовало эту формулу для обоснования наступательной войны.\nКак отвечают верующие: апологеты: ⟦искушение⟧ — это преследование верующих.", "c": "Часть толкователей понимает ⟦смуту⟧ (фитна) как гонения на мусульман; классическое право использовало аят как основание наступательного джихада.", "x": ["2:193", "2:256", "109:6", "9:29"], "refs": ["8:39"], "parts": [{"ref": "8:39", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَقَٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌۭ وَيَكُونَ ٱلدِّينُ كُلُّهُۥ لِلَّهِ ۚ فَإِنِ ٱنتَهَوْا۟ فَإِنَّ ٱللَّهَ بِمَا يَعْمَلُونَ بَصِيرٌۭ ﴿39﴾", "ru": "И сражайтесь с ними, пока не будет искушения, и религия вся будет принадлежать Аллаху\". А если они удержатся... ведь Аллах видит то, что они делают!"}], "t": null, "at": "зависит от перевода или толкования", "pw": "средний", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. Войну приказано вести, пока «религия вся будет Аллаха»; условие остановки «если удержатся» не говорит, от чего: нападения или неверия. Двусмысленность самого текста."}, {"n": "Что сказано: ⟦Приготовьте для них, сколько можете, силы и конницы; ими вы устрашите врага Аллаха, и вашего врага, и других, помимо них; вы их не знаете, Аллах знает их⟧.\nВ чём проблема: цель военной подготовки названа ⟦устрашить⟧ — причём и тех, ⟦кого вы не знаете⟧, то есть ещё не врагов. Это приказ запугивать потенциальных противников, а не только защищаться от напавших.\nКак отвечают верующие: апологеты: сила нужна для сдерживания (чтобы не нападали).", "c": null, "x": ["8:12", "9:123"], "refs": ["8:60"], "parts": [{"ref": "8:60", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "وَأَعِدُّوا۟ لَهُم مَّا ٱسْتَطَعْتُم مِّن قُوَّةٍۢ وَمِن رِّبَاطِ ٱلْخَيْلِ تُرْهِبُونَ بِهِۦ عَدُوَّ ٱللَّهِ وَعَدُوَّكُمْ وَءَاخَرِينَ مِن دُونِهِمْ لَا تَعْلَمُونَهُمُ ٱللَّهُ يَعْلَمُهُمْ ۚ وَمَا تُنفِقُوا۟ مِن شَىْءٍۢ فِى سَبِيلِ ٱللَّهِ يُوَفَّ إِلَيْكُمْ وَأَنتُمْ لَا تُظْلَمُونَ ﴿60﴾", "ru": "И приготовьте для них, сколько можете, силы и отрядов конницы; ими вы устрашите врага Аллаха, и вашего врага, и других, помимо них; вы их не знаете, Аллах знает их. И что бы вы ни издержали на пути Аллаха, будет полностью возмещено вам, и вы не будете обижены."}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Приказано «устрашить» и тех, «кого вы не знаете». Можно читать как сдерживание."}, {"n": "Что сказано: «А когда кончатся месяцы запретные, то избивайте многобожников, где их найдёте, захватывайте их, осаждайте, устраивайте засаду против них во всяком скрытом месте! Если они обратились и выполняли молитву и давали очищение, то освободите им дорогу: ведь Аллах — прощающий, милосердный!»\nВ чём проблема: так называемый ⟦аят меча⟧. (1) Приказ убивать без привязки к конкретному нападению. (2) Единственное условие пощады — принять ислам (молитва и закят). (3) Классические комментаторы считали, что он отменил множество мягких аятов (например 2:256, 109:6, 8:61). Ограничения даны рядом: 9:4 (договорников, не нарушивших союз, не трогать) и 9:6 (просящему убежища дать убежище).\nКак отвечают верующие: апологеты связывают аят с конкретным нарушением договоров мекканскими племенами.", "c": "Апологеты указывают на 9:4 и 9:6 (договорники не затрагиваются, просящим защиты — убежище) и на конкретное нарушение договоров арабскими племенами.", "x": ["2:256", "109:6", "9:4", "9:6", "9:11", "2:106"], "refs": ["9:5"], "parts": [{"ref": "9:5", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "فَإِذَا ٱنسَلَخَ ٱلْأَشْهُرُ ٱلْحُرُمُ فَٱقْتُلُوا۟ ٱلْمُشْرِكِينَ حَيْثُ وَجَدتُّمُوهُمْ وَخُذُوهُمْ وَٱحْصُرُوهُمْ وَٱقْعُدُوا۟ لَهُمْ كُلَّ مَرْصَدٍۢ ۚ فَإِن تَابُوا۟ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَءَاتَوُا۟ ٱلزَّكَوٰةَ فَخَلُّوا۟ سَبِيلَهُمْ ۚ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ ﴿5﴾", "ru": "А когда кончатся месяцы запретные, то избивайте многобожников, где их найдете, захватывайте их, осаждайте, устраивайте засаду против них во всяком скрытом месте! Если они обратились и выполняли молитву и давали очищение, то освободите им дорогу: ведь Аллах - прощающий, милосердный!"}], "t": null, "at": "внутреннее противоречие", "pw": "сильный", "cl": "Вывод: прямое противоречие внутри текста, вопреки 4:82, где Коран утверждает, что противоречий в нём нет. Приказ убивать многобожников, где бы ни нашли, с единственным условием пощады: молитва и закят. Это место явно расходится с 2:256 и 109:6; традиция сама решает это отменой, то есть признаёт конфликт."}, {"n": "Что сказано: «Сражайтесь с теми, кто не верует в Аллаха и в последний день, не запрещает того, что запретил Аллах и Его посланник, и не подчиняется религии истинной — из тех, которым ниспослано писание, пока они не дадут откупа своей рукой, будучи униженными».\nВ чём проблема: воевать нужно с христианами и иудеями только потому, что они ⟦не подчиняются религии истинной⟧; нападение с их стороны не названо условием. Мир достигается платой («откуп», джизья) и состоянием ⟦униженности⟧. Спорит с 2:256 и с 29:46, где велено спорить с людьми Писания ⟦лучшим способом⟧.\nКак отвечают верующие: классическое право: налог в обмен на защиту и право сохранять веру.", "c": "Классическое право: налог в обмен на защиту и право сохранять веру; формулировка об ⟦унижении⟧ трактовалась по-разному.", "x": ["2:256", "29:46", "9:5", "8:39"], "refs": ["9:29"], "parts": [{"ref": "9:29", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "قَٰتِلُوا۟ ٱلَّذِينَ لَا يُؤْمِنُونَ بِٱللَّهِ وَلَا بِٱلْيَوْمِ ٱلْءَاخِرِ وَلَا يُحَرِّمُونَ مَا حَرَّمَ ٱللَّهُ وَرَسُولُهُۥ وَلَا يَدِينُونَ دِينَ ٱلْحَقِّ مِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ حَتَّىٰ يُعْطُوا۟ ٱلْجِزْيَةَ عَن يَدٍۢ وَهُمْ صَٰغِرُونَ ﴿29﴾", "ru": "Сражайтесь с теми, кто не верует в Аллаха и в последний день, не запрещает того, что запретил Аллах и Его посланник, и не подчиняется религии истинной - из тех, которым ниспослано писание, пока они не дадут откупа своей рукой, будучи униженными."}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Воевать с людьми Писания, пока не заплатят откуп «униженными», без условия нападения. Расходится с 2:256; верующие отвечают, что речь о конкретной войне."}, {"n": "Что сказано: ⟦О пророк! Борись с неверными и лицемерами и будь суров к ним. Их убежище — геенна⟧ (то же в 66:9).\nВ чём проблема: приказ ⟦быть суровым⟧ адресован не только воюющим неверным, но и «лицемерам» — людям, внешне исповедующим ислам. Наказание в аду объявлено заранее. Спорит с 109:6 (⟦вам ваша религия, мне — моя⟧), 50:45 (⟦ты не принудитель⟧) и 2:256.", "c": null, "x": ["66:9", "109:6", "50:45", "2:256"], "refs": ["9:73"], "parts": [{"ref": "9:73", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ جَٰهِدِ ٱلْكُفَّارَ وَٱلْمُنَٰفِقِينَ وَٱغْلُظْ عَلَيْهِمْ ۚ وَمَأْوَىٰهُمْ جَهَنَّمُ ۖ وَبِئْسَ ٱلْمَصِيرُ ﴿73﴾", "ru": "О пророк! Борись с неверными и лицемерами и будь жесток к ним. Их убежище - геенна, и скверно это возвращение!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Суровость приказана и к «лицемерам» (людям, внешне исповедующим ислам). Расходится с 50:45 и 2:256; довод заметный, но аят вырван из контекста конкретных событий."}, {"n": "Что сказано: ⟦О вы, которые уверовали! Сражайтесь с теми неверными, которые рядом с вами, и пусть найдут они в вас суровость⟧.\nВ чём проблема: это принцип ⟦ближайших врагов⟧: воевать по очереди со всеми соседями-неверными, не только с напавшими. Слово «суровость» — приказ быть жёстким. В аяте нет условия, что они напали.", "c": "Контекст — расширение границ и подавление соседних племён.", "x": ["9:36", "8:39"], "refs": ["9:123"], "parts": [{"ref": "9:123", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ قَٰتِلُوا۟ ٱلَّذِينَ يَلُونَكُم مِّنَ ٱلْكُفَّارِ وَلْيَجِدُوا۟ فِيكُمْ غِلْظَةًۭ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ مَعَ ٱلْمُتَّقِينَ ﴿123﴾", "ru": "О вы, которые уверовали! Сражайтесь с теми из неверных, которые близки к вам. И пусть они найдут в вас суровость. И знайте, что Аллах - с богобоязненными!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Приказ воевать с «ближайшими» неверными без указания нападения. Вывод зависит от прочтения контекста."}, {"n": "Что сказано: ⟦Когда вы встретите тех, которые не веровали, то — удар по шеям, а когда вы одолеете их, то крепите узы. Затем либо милость, либо выкуп⟧.\nВ чём проблема: прямое указание бить ⟦по шеям⟧ (рубить головы) в бою и брать пленных, которых можно отпустить или обменять на выкуп. В 8:67-68, наоборот, Бог упрекает Пророка за то, что вместо ⟦избиения⟧ взяли выкуп. Аяты расходятся.", "c": "Описание правил войны в раннем мединском обществе.", "x": ["8:12", "8:67-68"], "refs": ["47:4"], "parts": [{"ref": "47:4", "sura": "Muhammad", "sura_ar": "سُورَةُ مُحَمَّدٍ", "type": "Medinan", "ar": "فَإِذَا لَقِيتُمُ ٱلَّذِينَ كَفَرُوا۟ فَضَرْبَ ٱلرِّقَابِ حَتَّىٰٓ إِذَآ أَثْخَنتُمُوهُمْ فَشُدُّوا۟ ٱلْوَثَاقَ فَإِمَّا مَنًّۢا بَعْدُ وَإِمَّا فِدَآءً حَتَّىٰ تَضَعَ ٱلْحَرْبُ أَوْزَارَهَا ۚ ذَٰلِكَ وَلَوْ يَشَآءُ ٱللَّهُ لَٱنتَصَرَ مِنْهُمْ وَلَٰكِن لِّيَبْلُوَا۟ بَعْضَكُم بِبَعْضٍۢ ۗ وَٱلَّذِينَ قُتِلُوا۟ فِى سَبِيلِ ٱللَّهِ فَلَن يُضِلَّ أَعْمَٰلَهُمْ ﴿4﴾", "ru": "А когда вы встретите тех, которые не уверовали, то - удар мечом по шее; а когда произведете великое избиение их, то укрепляйте узы. Либо милость потом, либо выкуп, пока война не сложит своих нош. Так! А если бы пожелал Аллах, Он помог бы Себе против них, но (это для того,) чтобы одних испытать другими. А у тех, которые убиты на пути Аллаха, - никогда Он не собьет с пути их деяний:"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. «Бейте по шеям» — обычный язык боя. Довод сильнее лишь вместе с аятами, где причина не названа."}, {"n": "Что сказано: О тех, кто хотел бы, чтобы вы стали неверными: ⟦Не берите из них друзей, пока не выселятся на пути Аллаха; если же они отвратятся, то хватайте их и убивайте, где бы ни нашли⟧.\nВ чём проблема: приказ убивать ⟦отвернувшихся⟧. На этом аяте основана позиция классического права о казни за смену веры. Но в Коране о судьбе отступника в 2:217 и 3:86-90 говорится лишь о наказании в будущей жизни, а свобода выбора провозглашена в 2:256, 10:99, 18:29. Ограничение дано в 4:90 (не трогать тех, кто ⟦связан договором⟧ или ⟦не хочет воевать⟧).\nКак отвечают верующие: многие современные богословы относят аят только к тем, кто ушёл к врагам и воевал.", "c": "Классическое право на основании этого аята предписывает казнь за вероотступничество; современные богословы спорят о границах (отступники-предатели против обычных отступников).", "x": ["4:90", "2:217", "2:256", "10:99", "18:29"], "refs": ["4:89"], "parts": [{"ref": "4:89", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَدُّوا۟ لَوْ تَكْفُرُونَ كَمَا كَفَرُوا۟ فَتَكُونُونَ سَوَآءًۭ ۖ فَلَا تَتَّخِذُوا۟ مِنْهُمْ أَوْلِيَآءَ حَتَّىٰ يُهَاجِرُوا۟ فِى سَبِيلِ ٱللَّهِ ۚ فَإِن تَوَلَّوْا۟ فَخُذُوهُمْ وَٱقْتُلُوهُمْ حَيْثُ وَجَدتُّمُوهُمْ ۖ وَلَا تَتَّخِذُوا۟ مِنْهُمْ وَلِيًّۭا وَلَا نَصِيرًا ﴿89﴾", "ru": "Они хотели бы, чтобы вы оказались неверными, как были неверными они, и вы бы оказались одинаковыми. Не берите же из них друзей, пока не выселятся по пути Аллаха; если же они отвратятся, то схватывайте их и убивайте, где бы ни нашли их. И не берите из них ни друзей, ни помощников,"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Приказ убивать «отвернувшихся» расходится с 2:217, где отступнику угрожает лишь наказание в будущей жизни. Две позиции в одном тексте (4:82); верующие ссылаются на контекст."}, {"n": "Что сказано: О ⟦лицемерах⟧ и тех, у кого болезнь в сердцах: ⟦проклятые, где бы их ни нашли, будут схвачены и убиты безжалостно⟧.\nВ чём проблема: смертный приговор ⟦лицемерам⟧ — людям, внутреннее состояние которых трудно доказать; в 9:101 Бог говорит Пророку: ⟦Ты их не знаешь, Мы их знаем⟧.", "c": null, "x": ["9:101", "4:145"], "refs": ["33:61"], "parts": [{"ref": "33:61", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "مَّلْعُونِينَ ۖ أَيْنَمَا ثُقِفُوٓا۟ أُخِذُوا۟ وَقُتِّلُوا۟ تَقْتِيلًۭا ﴿61﴾", "ru": "проклятыми. Где они не будут встречены, они будут схвачены и перебиты избиением,"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Приговор «лицемерам», хотя Пророк их не знает (9:101). Довод вытекает из текста, но аят связан с конкретными событиями."}, {"n": "Что сказано: ⟦Аллах купил у верующих их души и достояние за то, что им — рай. Они сражаются на пути Аллаха, убивают и бывают убиты, согласно обещанию от Него истинному в Торе, Евангелии и Коране⟧.\nВ чём проблема: (1) Война описана как торговая сделка: жизнь и убийство — в обмен на рай. (2) Заявлено, что это ⟦обещание⟧ есть в Торе и Евангелии. Такое обещание в Евангелиях найти нельзя — это проверяемое утверждение, которое не подтверждается.", "c": null, "x": ["4:74", "61:10-13"], "refs": ["9:111"], "parts": [{"ref": "9:111", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "۞ إِنَّ ٱللَّهَ ٱشْتَرَىٰ مِنَ ٱلْمُؤْمِنِينَ أَنفُسَهُمْ وَأَمْوَٰلَهُم بِأَنَّ لَهُمُ ٱلْجَنَّةَ ۚ يُقَٰتِلُونَ فِى سَبِيلِ ٱللَّهِ فَيَقْتُلُونَ وَيُقْتَلُونَ ۖ وَعْدًا عَلَيْهِ حَقًّۭا فِى ٱلتَّوْرَىٰةِ وَٱلْإِنجِيلِ وَٱلْقُرْءَانِ ۚ وَمَنْ أَوْفَىٰ بِعَهْدِهِۦ مِنَ ٱللَّهِ ۚ فَٱسْتَبْشِرُوا۟ بِبَيْعِكُمُ ٱلَّذِى بَايَعْتُم بِهِۦ ۚ وَذَٰلِكَ هُوَ ٱلْفَوْزُ ٱلْعَظِيمُ ﴿111﴾", "ru": "Поистине, Аллах купил у верующих их души и их достояние за то, что им - рай! Они сражаются на пути Аллаха, убивают и бывают убиты, согласно обещанию от Него истинному в Торе, Евангелии и Коране. Кто же более верен в своем завете, чем Аллах? Радуйтесь же своей торговле, которую вы заключили с Ним! Это ведь - великий успех!"}], "t": null, "at": "расходится с историей или Библией", "pw": "средний", "cl": "Вывод: критики указывают на расхождение с библейскими или историческими данными; верующие предлагают другое объяснение. Заявлено, что обещание рая за бой есть в Торе и Евангелии. В Евангелиях такого обещания не находят. Формулировать: «критики указывают, что в Евангелиях его нет»."}, {"n": "Что сказано: ⟦Сражайтесь с ними, пока не будет больше искушения, а религия вся будет принадлежать Аллаху. А если они удержатся, то нет вражды, кроме как к неправедным⟧.\nВ чём проблема: цель войны — чтобы ⟦религия вся⟧ принадлежала Аллаху; условие остановки — ⟦если удержатся⟧. Из текста неясно, чего именно они должны удержаться: нападения или неверия. Дословный повтор — 8:39. Спорит с 2:256 и 109:6.", "c": null, "x": ["8:39", "2:256", "109:6"], "refs": ["2:193"], "parts": [{"ref": "2:193", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَقَٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌۭ وَيَكُونَ ٱلدِّينُ لِلَّهِ ۖ فَإِنِ ٱنتَهَوْا۟ فَلَا عُدْوَٰنَ إِلَّا عَلَى ٱلظَّٰلِمِينَ ﴿193﴾", "ru": "И сражайтесь с ними, пока не будет больше искушения, а (вся) религия будет принадлежать Аллаху. А если они удержатся, то нет вражды, кроме как к неправедным!"}], "t": null, "at": "зависит от перевода или толкования", "pw": "средний", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. Дословный повтор 8:39 с тем же вопросом: удержаться от нападения или от неверия."}, {"n": "Что сказано: «Те, которые уверовали, сражаются на пути Аллаха, а те, которые не веруют, сражаются на пути тагута. Сражайтесь же с друзьями сатаны; ведь козни сатаны слабы!»\nВ чём проблема: мир делится на два лагеря по вере, неверных названо «друзьями сатаны» и приказано с ними воевать. Религиозное различие превращено в военное: не названо, что они нападали.", "c": null, "x": ["4:89", "8:39"], "refs": ["4:76"], "parts": [{"ref": "4:76", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "ٱلَّذِينَ ءَامَنُوا۟ يُقَٰتِلُونَ فِى سَبِيلِ ٱللَّهِ ۖ وَٱلَّذِينَ كَفَرُوا۟ يُقَٰتِلُونَ فِى سَبِيلِ ٱلطَّٰغُوتِ فَقَٰتِلُوٓا۟ أَوْلِيَآءَ ٱلشَّيْطَٰنِ ۖ إِنَّ كَيْدَ ٱلشَّيْطَٰنِ كَانَ ضَعِيفًا ﴿76﴾", "ru": "Те, которые уверовали, сражаются на пути Аллаха, а те, которые не веруют, сражаются на пути тагута. Сражайтесь же с друзьями сатаны; ведь козни сатаны слабы!"}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Мир разделён на «друзей Бога» и «друзей сатаны» с приказом воевать. Нападение не названо условием."}, {"n": "Что сказано: О других людях, которые «не отойдут от вас, и не предложат вам мира, и не удержат своих рук»: «то берите их и избивайте, где бы ни встречали вы их».\nВ чём проблема: приказ убивать тех, кто не предложил мира и не ⟦удержал рук⟧. Рядом 4:90 говорит, что трогать нельзя тех, кто ⟦связан союзом⟧ или ⟦не хочет воевать⟧, и тех, кто предложил мир. Критерий — предлагают ли они мир; а на практике — вопрос, кто это определяет.", "c": null, "x": ["4:90", "4:94"], "refs": ["4:91"], "parts": [{"ref": "4:91", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "سَتَجِدُونَ ءَاخَرِينَ يُرِيدُونَ أَن يَأْمَنُوكُمْ وَيَأْمَنُوا۟ قَوْمَهُمْ كُلَّ مَا رُدُّوٓا۟ إِلَى ٱلْفِتْنَةِ أُرْكِسُوا۟ فِيهَا ۚ فَإِن لَّمْ يَعْتَزِلُوكُمْ وَيُلْقُوٓا۟ إِلَيْكُمُ ٱلسَّلَمَ وَيَكُفُّوٓا۟ أَيْدِيَهُمْ فَخُذُوهُمْ وَٱقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْ ۚ وَأُو۟لَٰٓئِكُمْ جَعَلْنَا لَكُمْ عَلَيْهِمْ سُلْطَٰنًۭا مُّبِينًۭا ﴿91﴾", "ru": "Вы найдете других, которые захотят быть верными вам и верными своему народу. Всякий раз как их повернут к мятежу, они будут ввергнуты туда. И если они не отойдут от вас, и не предложат вам мира, и не удержат своих рук, то берите их и избивайте, где бы ни встречали вы их. Над этими Мы дали вам явную власть!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Приказ убивать тех, кто не предложил мира; рядом 4:90 защищает предложивших мир. Вывод зависит от того, читать ли два аята вместе."}, {"n": "Что сказано: «Не вы их убивали, но Аллах убивал их; и не ты бросил, когда бросил, но Аллах бросил».\nВ чём проблема: убийство в бою приписано Богу. Это снимает вопрос о личной ответственности воина; но тогда неясно, почему убийство, совершённое неверным, осуждается. Это та же проблема, что в разделе ⟦Предопределение⟧: действие человека оказывается действием Бога.", "c": null, "x": ["9:14"], "refs": ["8:17"], "parts": [{"ref": "8:17", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "فَلَمْ تَقْتُلُوهُمْ وَلَٰكِنَّ ٱللَّهَ قَتَلَهُمْ ۚ وَمَا رَمَيْتَ إِذْ رَمَيْتَ وَلَٰكِنَّ ٱللَّهَ رَمَىٰ ۚ وَلِيُبْلِىَ ٱلْمُؤْمِنِينَ مِنْهُ بَلَآءً حَسَنًا ۚ إِنَّ ٱللَّهَ سَمِيعٌ عَلِيمٌۭ ﴿17﴾", "ru": "Не вы их убивали, но Аллах убивал их, и не ты бросил, когда бросил, но Аллах бросил, чтобы испытать верующих хорошим испытанием от Него. Поистине, Аллах - слышащий, сведущий!"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Убийство в бою приписано Богу. Тогда неясно, почему убийство, совершённое неверным, осуждается; вопрос ответственности, а не явное противоречие."}, {"n": "Что сказано: «Если ты застанешь их в битве, то прогони ими тех, которые позади них — может быть, они вспомнят».\nВ чём проблема: одних врагов нужно разгромить так, чтобы напугать остальных. Это принцип устрашения через жестокость к части, а не наказания по вине.", "c": null, "x": ["8:60"], "refs": ["8:57"], "parts": [{"ref": "8:57", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "فَإِمَّا تَثْقَفَنَّهُمْ فِى ٱلْحَرْبِ فَشَرِّدْ بِهِم مَّنْ خَلْفَهُمْ لَعَلَّهُمْ يَذَّكَّرُونَ ﴿57﴾", "ru": "Если ты застанешь их в битве, то прогони ими тех, которые позади них, - может быть, они вспомнят!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Одних врагов нужно разгромить, чтобы напугать остальных. Принцип устрашения, но аят о конкретной ситуации."}, {"n": "Что сказано: ⟦Сражайтесь с ними: накажет их Аллах вашими руками, опозорит их, поможет вам против них и исцелит груди верующих⟧.\nВ чём проблема: среди целей войны названо ⟦исцеление груди верующих⟧ — то есть удовлетворение чувства мести. Убийство подано как лекарство от душевной боли, а не как необходимость обороны.", "c": null, "x": ["8:17"], "refs": ["9:14"], "parts": [{"ref": "9:14", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "قَٰتِلُوهُمْ يُعَذِّبْهُمُ ٱللَّهُ بِأَيْدِيكُمْ وَيُخْزِهِمْ وَيَنصُرْكُمْ عَلَيْهِمْ وَيَشْفِ صُدُورَ قَوْمٍۢ مُّؤْمِنِينَ ﴿14﴾", "ru": "Сражайтесь с ними, - накажет их Аллах вашими руками, и опозорит их, и поможет вам против них, и исцелит грудь у людей верующих,"}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Убийство подано как «исцеление груди верующих». Образ, а не норма."}, {"n": "Что сказано: «Сражайтесь все с многобожниками, как они все сражаются с вами. И знайте, что Аллах — с богобоязненными!»\nВ чём проблема: приказ воевать со всей категорией людей («все с многобожниками»), без указания на конкретное нападение; формула «как они все сражаются с вами» подразумевает ответ, но на практике её используют как общее правило.", "c": null, "x": ["9:5", "2:191"], "refs": ["9:36"], "parts": [{"ref": "9:36", "sura": "At-Tawba", "sura_ar": "سُورَةُ التَّوۡبَةِ", "type": "Medinan", "ar": "إِنَّ عِدَّةَ ٱلشُّهُورِ عِندَ ٱللَّهِ ٱثْنَا عَشَرَ شَهْرًۭا فِى كِتَٰبِ ٱللَّهِ يَوْمَ خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ مِنْهَآ أَرْبَعَةٌ حُرُمٌۭ ۚ ذَٰلِكَ ٱلدِّينُ ٱلْقَيِّمُ ۚ فَلَا تَظْلِمُوا۟ فِيهِنَّ أَنفُسَكُمْ ۚ وَقَٰتِلُوا۟ ٱلْمُشْرِكِينَ كَآفَّةًۭ كَمَا يُقَٰتِلُونَكُمْ كَآفَّةًۭ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ مَعَ ٱلْمُتَّقِينَ ﴿36﴾", "ru": "Поистине, число месяцев у Аллаха - двенадцать месяцев в писании Аллаха в тот день, как Он сотворил небеса и землю. Из них - четыре запретных, это - стойкая религия: не причиняйте же в них зла самим себе и сражайтесь все с многобожниками, как они все сражаются с вами. И знайте, что Аллах - с богобоязненными!"}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Воевать «со всеми многобожниками», как они воюют «со всеми вами»: в тексте есть и условие, и общее правило, поэтому вывод зависит от толкования."}, {"n": "Что сказано: «Дозволено тем, с которыми сражаются, за то, что они обижены… Поистине, Аллах может помочь им».\nВ чём проблема: этот аят чаще всего приводят как доказательство, что война в исламе — только оборонительная. Но причина названа лишь здесь (и в 22:40: ⟦изгнаны из своих жилищ без права⟧). В 9:5, 9:29, 9:36, 8:39, 9:123 приказы воевать даны без условия ⟦если напали⟧. В Коране есть и ⟦оборонительные⟧, и ⟦безусловные⟧ аяты; школы выбирают, какие считать главными.", "c": null, "x": ["9:5", "9:29", "9:36", "8:39"], "refs": ["22:39"], "parts": [{"ref": "22:39", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "أُذِنَ لِلَّذِينَ يُقَٰتَلُونَ بِأَنَّهُمْ ظُلِمُوا۟ ۚ وَإِنَّ ٱللَّهَ عَلَىٰ نَصْرِهِمْ لَقَدِيرٌ ﴿39﴾", "ru": "Дозволено тем, с которыми сражаются, за то, что они обижены... Поистине, Аллах может помочь им, -"}], "t": null, "at": "внутреннее противоречие", "pw": "средний", "cl": "Вывод: расхождение между аятами внутри текста; сам текст его не разрешает, согласование даёт только толкование. Аят о разрешении обороны — главный довод верующих, что война только оборонительная. Но в 9:5, 9:29 условие обороны не названо; зависит от того, как соотносить аяты."}, {"n": "Что сказано: «Не повинуйся же неверным и борись с ними этим великой борьбой!»\nВ чём проблема: ⟦борьба⟧ (джихад) здесь понимается как убеждение Кораном (в аяте указано «этим» — то есть словом). В мединских аятах (9:41, 61:11) тот же корень относится к борьбе ⟦имуществом и душой⟧ (то есть боем). Смысл слова меняется.", "c": null, "x": ["9:41", "61:11"], "refs": ["25:52"], "parts": [{"ref": "25:52", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "فَلَا تُطِعِ ٱلْكَٰفِرِينَ وَجَٰهِدْهُم بِهِۦ جِهَادًۭا كَبِيرًۭا ﴿52﴾", "ru": "Не повинуйся же неверным и борись с ними этим великой борьбой!"}], "t": null, "at": "зависит от перевода или толкования", "pw": "слабый", "cl": "Вывод: смысл зависит от перевода или толкования слова; текст сам его не определяет. «Борись этим» в 25:52 — слово, а в мединских аятах тот же корень — бой. Это вопрос значения слова, не противоречие."}, {"n": "Что сказано: О ⟦людях Писания⟧, помогавших врагам: ⟦Он вывел их из укреплений и вверг в их сердца страх; одну часть вы перебьёте и возьмёте в плен другую часть⟧ (33:26); затем: ⟦Он дал вам в наследие их землю, их жилища и достояние⟧ (33:27).\nВ чём проблема: массовое убийство одних и пленение других представлено как дело Бога, а имущество побеждённых — как ⟦наследие⟧ верующих. Племя в тексте не названо; сам аят — прямое одобрение истребления взрослых мужчин и захвата остальных.", "c": null, "x": ["33:27"], "refs": ["33:26"], "parts": [{"ref": "33:26", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "وَأَنزَلَ ٱلَّذِينَ ظَٰهَرُوهُم مِّنْ أَهْلِ ٱلْكِتَٰبِ مِن صَيَاصِيهِمْ وَقَذَفَ فِى قُلُوبِهِمُ ٱلرُّعْبَ فَرِيقًۭا تَقْتُلُونَ وَتَأْسِرُونَ فَرِيقًۭا ﴿26﴾", "ru": "И вывел Он тех из людей писания, которые помогли им, из их укреплений и вверг в их сердца страх; одну часть вы перебьете и возьмете в плен другую часть."}], "t": null, "at": "этическая претензия", "pw": "средний", "cl": "Вывод: этическая претензия: положение текста вызывает вопрос о совместимости с современными представлениями о справедливости и правах человека. Истребление взрослых мужчин и захват остальных представлены как дело Бога. Племя не названо; довод опирается на общий смысл аята."}, {"n": "Что сказано: ⟦Что вы срубили из пальм или оставили стоящим на своих корнях — то по соизволению Аллаха и чтобы Он посрамил нечестивых⟧.\nВ чём проблема: вырубка пальм (имущество и пропитание) врагов объявлена дозволенной Богом как способ ⟦посрамить⟧. В аяте нет оговорок о защите деревьев и мирных жителей.", "c": null, "x": [], "refs": ["59:5"], "parts": [{"ref": "59:5", "sura": "Al-Hashr", "sura_ar": "سُورَةُ الحَشۡرِ", "type": "Medinan", "ar": "مَا قَطَعْتُم مِّن لِّينَةٍ أَوْ تَرَكْتُمُوهَا قَآئِمَةً عَلَىٰٓ أُصُولِهَا فَبِإِذْنِ ٱللَّهِ وَلِيُخْزِىَ ٱلْفَٰسِقِينَ ﴿5﴾", "ru": "Что вы ссекли из пальм или оставили стоящим на своих корнях, - то по соизволению Аллаха и чтобы Он посрамил нечестивых."}], "t": null, "at": "этическая претензия", "pw": "слабый", "cl": "Вывод: этическое замечание; формулировка не однозначна. Вырубка пальм названа дозволенной. Частный случай."}, {"n": "Что сказано: Муса говорит народу после поклонения тельцу: ⟦Обратитесь к вашему Творцу и убейте самих себя; это лучше для вас пред вашим Творцом. И Он обратился к вам⟧.\nВ чём проблема: форма покаяния — убийство соплеменников (в тексте не сказано, кто кого убивал; обычно понимают, что невиновные убивали виновных). Бог после этого «обратился» (принял раскаяние), то есть приказ представлен как образец. Но Коран сам запрещает убийство: ⟦не убивайте самих себя⟧ (4:29) и ⟦не убивайте душу, которую запретил Аллах⟧ (17:33).", "c": null, "x": ["4:29", "17:33"], "refs": ["2:54"], "parts": [{"ref": "2:54", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِۦ يَٰقَوْمِ إِنَّكُمْ ظَلَمْتُمْ أَنفُسَكُم بِٱتِّخَاذِكُمُ ٱلْعِجْلَ فَتُوبُوٓا۟ إِلَىٰ بَارِئِكُمْ فَٱقْتُلُوٓا۟ أَنفُسَكُمْ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ عِندَ بَارِئِكُمْ فَتَابَ عَلَيْكُمْ ۚ إِنَّهُۥ هُوَ ٱلتَّوَّابُ ٱلرَّحِيمُ ﴿54﴾", "ru": "И вот сказал Муса своему народу: \"О народ мой! Вы самим себе причинили несправедливость, взяв себе тельца. Обратитесь же к вашему Творцу и убейте самих себя; это - лучше для вас пред вашим Творцом. И Он обратился к вам: ведь Он - обращающийся, милосердный!\""}], "t": null, "at": "этическая претензия", "pw": "ср
