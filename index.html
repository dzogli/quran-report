дчиненные Его власти. О да! Ему принадлежит и создание и власть. Благословен Аллах, Господь миров!", "n": "Бог создал небеса и землю «за шесть дней».", "c": null}, {"ref": "79:27-30", "sura": "An-Naazi'aat", "sura_ar": "سُورَةُ النَّازِعَاتِ", "type": "Meccan", "ar": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا ﴿27﴾ رَفَعَ سَمْكَهَا فَسَوَّىٰهَا ﴿28﴾ وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَىٰهَا ﴿29﴾ وَٱلْأَرْضَ بَعْدَ ذَٰلِكَ دَحَىٰهَآ ﴿30﴾", "ru": "(27) Вы ли труднее для создания или небо? Он его построил, (28) воздвиг свод его и устроил, (29) омрачил ночь его и вывел зарю, (30) и землю после этого распростер,", "n": "Небо создано первым, а землю Бог «после этого распростёр» — порядок обратный 41:9–12, где земля создана раньше неба.", "c": null}, {"ref": "70:4", "sura": "Al-Ma'aarij", "sura_ar": "سُورَةُ المَعَارِجِ", "type": "Meccan", "ar": "تَعْرُجُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ إِلَيْهِ فِى يَوْمٍۢ كَانَ مِقْدَارُهُۥ خَمْسِينَ أَلْفَ سَنَةٍۢ ﴿4﴾", "ru": "Восходят ангелы и дух к Нему в день, величина которого пятьдесят тысяч лет.", "n": "День, длина которого — «пятьдесят тысяч лет».", "c": null}, {"ref": "32:5", "sura": "As-Sajda", "sura_ar": "سُورَةُ السَّجۡدَةِ", "type": "Meccan", "ar": "يُدَبِّرُ ٱلْأَمْرَ مِنَ ٱلسَّمَآءِ إِلَى ٱلْأَرْضِ ثُمَّ يَعْرُجُ إِلَيْهِ فِى يَوْمٍۢ كَانَ مِقْدَارُهُۥٓ أَلْفَ سَنَةٍۢ مِّمَّا تَعُدُّونَ ﴿5﴾", "ru": "Он распределяет Свое повеление с неба на землю, потом оно восходит к Нему в некий день, протяжение которого - тысяча лет, как вы считаете.", "n": "В другом месте День Суда равен «тысяче лет».", "c": null}, {"ref": "22:47", "sura": "Al-Hajj", "sura_ar": "سُورَةُ الحَجِّ", "type": "Medinan", "ar": "وَيَسْتَعْجِلُونَكَ بِٱلْعَذَابِ وَلَن يُخْلِفَ ٱللَّهُ وَعْدَهُۥ ۚ وَإِنَّ يَوْمًا عِندَ رَبِّكَ كَأَلْفِ سَنَةٍۢ مِّمَّا تَعُدُّونَ ﴿47﴾", "ru": "Они торопят тебя с наказанием, но Аллах не изменит Своего обещания, и, поистине, день у твоего Господа, как тысяча лет из тех, что вы считаете!", "n": "Ещё одна версия: «один день у Господа твоего как тысяча лет по вашему счёту».", "c": null}, {"ref": "19:28", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "يَٰٓأُخْتَ هَٰرُونَ مَا كَانَ أَبُوكِ ٱمْرَأَ سَوْءٍۢ وَمَا كَانَتْ أُمُّكِ بَغِيًّۭا ﴿28﴾", "ru": "О сестра Харуна, не был отец твой дурным человеком, и мать твоя не была распутницей\".", "n": "Мариам (мать Исы) названа «сестрой Харуна» — Харун (Аарон) жил за много веков до неё.", "c": "Апологеты: образное «сестра» как «потомок» или другой человек по имени Харун; но Мариам, сестра Аарона и Моисея, упоминается в Библии."}, {"ref": "66:12", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "وَمَرْيَمَ ٱبْنَتَ عِمْرَٰنَ ٱلَّتِىٓ أَحْصَنَتْ فَرْجَهَا فَنَفَخْنَا فِيهِ مِن رُّوحِنَا وَصَدَّقَتْ بِكَلِمَٰتِ رَبِّهَا وَكُتُبِهِۦ وَكَانَتْ مِنَ ٱلْقَٰنِتِينَ ﴿12﴾", "ru": "...И Марйам, дочь Имрана, которая сберегла свои члены, и Мы вдунули в нее от Нашего духа. И она сочла истиной слова ее Господа и Его писания и была из числа благочестивых.", "n": "Мариам названа «дочерью Имрана» — как и мать Моисея и Аарона (Амрам).", "c": null}, {"ref": "28:38", "sura": "Al-Qasas", "sura_ar": "سُورَةُ القَصَصِ", "type": "Meccan", "ar": "وَقَالَ فِرْعَوْنُ يَٰٓأَيُّهَا ٱلْمَلَأُ مَا عَلِمْتُ لَكُم مِّنْ إِلَٰهٍ غَيْرِى فَأَوْقِدْ لِى يَٰهَٰمَٰنُ عَلَى ٱلطِّينِ فَٱجْعَل لِّى صَرْحًۭا لَّعَلِّىٓ أَطَّلِعُ إِلَىٰٓ إِلَٰهِ مُوسَىٰ وَإِنِّى لَأَظُنُّهُۥ مِنَ ٱلْكَٰذِبِينَ ﴿38﴾", "ru": "И сказал Фираун: \"О знать, я не знаю для вас другого бога, кроме меня. Разожги мне, Хаман, огонь над глиной и устрой башню: может быть, я поднимусь к богу Мусы. Я ведь думаю, что он - лжец\".", "n": "Фараон обращается к «Хаману» — в Библии Аман — министр персидского царя Артаксеркса (книга Есфирь), жившего через ~800 лет.", "c": null}, {"ref": "20:85-87", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "قَالَ فَإِنَّا قَدْ فَتَنَّا قَوْمَكَ مِنۢ بَعْدِكَ وَأَضَلَّهُمُ ٱلسَّامِرِىُّ ﴿85﴾ فَرَجَعَ مُوسَىٰٓ إِلَىٰ قَوْمِهِۦ غَضْبَٰنَ أَسِفًۭا ۚ قَالَ يَٰقَوْمِ أَلَمْ يَعِدْكُمْ رَبُّكُمْ وَعْدًا حَسَنًا ۚ أَفَطَالَ عَلَيْكُمُ ٱلْعَهْدُ أَمْ أَرَدتُّمْ أَن يَحِلَّ عَلَيْكُمْ غَضَبٌۭ مِّن رَّبِّكُمْ فَأَخْلَفْتُم مَّوْعِدِى ﴿86﴾ قَالُوا۟ مَآ أَخْلَفْنَا مَوْعِدَكَ بِمَلْكِنَا وَلَٰكِنَّا حُمِّلْنَآ أَوْزَارًۭا مِّن زِينَةِ ٱلْقَوْمِ فَقَذَفْنَٰهَا فَكَذَٰلِكَ أَلْقَى ٱلسَّامِرِىُّ ﴿87﴾", "ru": "(85) Сказал Он: \"Мы испытали твой народ после тебя, и их сбил с пути самирит\". (86) И вернулся Муса к своему народу гневным, печальным. Он сказал: \"О народ мой! Разве не обещал вам Господь ваш прекрасного обещания; разве долгим для вас показался завет, или вы пожелали, чтобы вас постиг гнев от вашего Господа, и вы нарушили обещание мне?\" (87) Они сказали: \"Не нарушили мы обещания тебе своей властью; нам было приказано принести ноши из украшений народа, и мы из ввергли; также вверг и самирит\";", "n": "В истории с золотым тельцом виновник — «ас-Самири» (самаритянин); самаритяне как народ возникли много веков после исхода из Египта.", "c": "Апологеты: Самири — человек из рода/племени, имя не обязательно этническое."}, {"ref": "5:116", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ ٱللَّهُ يَٰعِيسَى ٱبْنَ مَرْيَمَ ءَأَنتَ قُلْتَ لِلنَّاسِ ٱتَّخِذُونِى وَأُمِّىَ إِلَٰهَيْنِ مِن دُونِ ٱللَّهِ ۖ قَالَ سُبْحَٰنَكَ مَا يَكُونُ لِىٓ أَنْ أَقُولَ مَا لَيْسَ لِى بِحَقٍّ ۚ إِن كُنتُ قُلْتُهُۥ فَقَدْ عَلِمْتَهُۥ ۚ تَعْلَمُ مَا فِى نَفْسِى وَلَآ أَعْلَمُ مَا فِى نَفْسِكَ ۚ إِنَّكَ أَنتَ عَلَّٰمُ ٱلْغُيُوبِ ﴿116﴾", "ru": "И вот сказал Аллах: \"О Иса, сын Марйам! Разве ты сказал людям: \"Примите меня и мою мать двумя богами кроме Аллаха?\" Он сказал: \"Хвала Тебе! Как можно мне говорить, что мне не по праву? Если я говорил, Ты это знаешь. Ты знаешь то. что у меня в душе, а я не знаю того, что у Тебя в душе: ведь Ты - ведающий скрытое.", "n": "Бог спрашивает Ису: «Говорил ли ты людям: примите меня и мою мать как двух богов?» — христианская Троица понимается как Отец, Иса и Мария.", "c": "В христианском учении Троица — Отец, Сын и Святой Дух."}, {"ref": "7:107", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "فَأَلْقَىٰ عَصَاهُ فَإِذَا هِىَ ثُعْبَانٌۭ مُّبِينٌۭ ﴿107﴾", "ru": "И бросил он свой жезл, и вот, это - явно змей.", "n": "Посох Мусы превратился в «явного змея» (су‘бан).", "c": null}, {"ref": "20:20", "sura": "Taa-Haa", "sura_ar": "سُورَةُ طه", "type": "Meccan", "ar": "فَأَلْقَىٰهَا فَإِذَا هِىَ حَيَّةٌۭ تَسْعَىٰ ﴿20﴾", "ru": "И бросил он его. И вот - это змея, которая ползет.", "n": "В другом рассказе посох превратился в «ползущую змею» (хайя).", "c": null}, {"ref": "27:10", "sura": "An-Naml", "sura_ar": "سُورَةُ النَّمۡلِ", "type": "Meccan", "ar": "وَأَلْقِ عَصَاكَ ۚ فَلَمَّا رَءَاهَا تَهْتَزُّ كَأَنَّهَا جَآنٌّۭ وَلَّىٰ مُدْبِرًۭا وَلَمْ يُعَقِّبْ ۚ يَٰمُوسَىٰ لَا تَخَفْ إِنِّى لَا يَخَافُ لَدَىَّ ٱلْمُرْسَلُونَ ﴿10﴾", "ru": "И брось свою палку!\" Когда же он увидел, что она извивается, как змея, обратился вспять и не возвратился. \"О Муса, не бойся, ведь не боятся у Меня посланные, -", "n": "В третьем — посох «извивался, как будто он — джинн (джанн)».", "c": null}, {"ref": "4:78", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "أَيْنَمَا تَكُونُوا۟ يُدْرِككُّمُ ٱلْمَوْتُ وَلَوْ كُنتُمْ فِى بُرُوجٍۢ مُّشَيَّدَةٍۢ ۗ وَإِن تُصِبْهُمْ حَسَنَةٌۭ يَقُولُوا۟ هَٰذِهِۦ مِنْ عِندِ ٱللَّهِ ۖ وَإِن تُصِبْهُمْ سَيِّئَةٌۭ يَقُولُوا۟ هَٰذِهِۦ مِنْ عِندِكَ ۚ قُلْ كُلٌّۭ مِّنْ عِندِ ٱللَّهِ ۖ فَمَالِ هَٰٓؤُلَآءِ ٱلْقَوْمِ لَا يَكَادُونَ يَفْقَهُونَ حَدِيثًۭا ﴿78﴾", "ru": "Где бы вы ни были, захватит вас смерть, если бы вы были даже в воздвигнутых башнях. И если постигнет их хорошее, они говорят: \"Это - от Аллаха\", а когда постигнет их дурное, они говорят: \"Это - от тебя\". Скажи: \"Все - от Аллаха\". Почему же эти люди никак не могут понять рассказа?", "n": "«Всё — от Аллаха» (и хорошее, и плохое).", "c": null}, {"ref": "4:79", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "مَّآ أَصَابَكَ مِنْ حَسَنَةٍۢ فَمِنَ ٱللَّهِ ۖ وَمَآ أَصَابَكَ مِن سَيِّئَةٍۢ فَمِن نَّفْسِكَ ۚ وَأَرْسَلْنَٰكَ لِلنَّاسِ رَسُولًۭا ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا ﴿79﴾", "ru": "Что постигло тебя из хорошего, то - от Аллаха, а что постигло из дурного, то - от самого себя. Мы послали тебя к людям посланником. и довольно Аллаха как свидетеля!", "n": "В соседнем аяте: хорошее — от Аллаха, а плохое — от самого человека. Два аята разных по смыслу; традиция пытается их согласовать.", "c": null}, {"ref": "14:4", "sura": "Ibrahim", "sura_ar": "سُورَةُ إِبۡرَاهِيمَ", "type": "Meccan", "ar": "وَمَآ أَرْسَلْنَا مِن رَّسُولٍ إِلَّا بِلِسَانِ قَوْمِهِۦ لِيُبَيِّنَ لَهُمْ ۖ فَيُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ ﴿4﴾", "ru": "Мы отправляли посланников только с языком их народа, чтобы они разъясняли им. Аллах сводит с пути, кого пожелает, и ведет, кого желает. Он - великий, мудрый!", "n": "Аллах «вводит в заблуждение, кого пожелает, и ведёт прямым путём, кого пожелает».", "c": null}, {"ref": "18:29", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَقُلِ ٱلْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَآءَ فَلْيُؤْمِن وَمَن شَآءَ فَلْيَكْفُرْ ۚ إِنَّآ أَعْتَدْنَا لِلظَّٰلِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا ۚ وَإِن يَسْتَغِيثُوا۟ يُغَاثُوا۟ بِمَآءٍۢ كَٱلْمُهْلِ يَشْوِى ٱلْوُجُوهَ ۚ بِئْسَ ٱلشَّرَابُ وَسَآءَتْ مُرْتَفَقًا ﴿29﴾", "ru": "И скажи: \"Истина - от вашего Господа: кто хочет, пусть верует, а кто хочет, пусть не верует\". Мы приготовили несправедливым огонь, навес которого окружит их; а если они воззовут о помощи, им помогут водой, подобной расплавленному металлу, которая опаляет лица. Скверно питье, и плохо убежище!", "n": "«Скажи: истина — от вашего Господа; кто хочет — пусть верует, а кто хочет — пусть не верует» — свобода выбора против предопределения.", "c": null}, {"ref": "15:26", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "وَلَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ مِن صَلْصَٰلٍۢ مِّنْ حَمَإٍۢ مَّسْنُونٍۢ ﴿26﴾", "ru": "И Мы сотворили уже человека из звучащей, из глины, облеченной в форму.", "n": "Человек создан «из звонкой глины, из чёрного ила».", "c": null}, {"ref": "3:59", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "إِنَّ مَثَلَ عِيسَىٰ عِندَ ٱللَّهِ كَمَثَلِ ءَادَمَ ۖ خَلَقَهُۥ مِن تُرَابٍۢ ثُمَّ قَالَ لَهُۥ كُن فَيَكُونُ ﴿59﴾", "ru": "Поистине, Иса пред Аллахом подобен Адаму: Он создал его из праха, потом сказал ему: \"Будь!\" - и он стал.", "n": "Адам создан «из праха».", "c": null}, {"ref": "25:54", "sura": "Al-Furqaan", "sura_ar": "سُورَةُ الفُرۡقَانِ", "type": "Meccan", "ar": "وَهُوَ ٱلَّذِى خَلَقَ مِنَ ٱلْمَآءِ بَشَرًۭا فَجَعَلَهُۥ نَسَبًۭا وَصِهْرًۭا ۗ وَكَانَ رَبُّكَ قَدِيرًۭا ﴿54﴾", "ru": "И Он - тот, который создал из воды человека и сделал ему родство мужское и женское. Господь твой - могуч!", "n": "Человек создан «из воды».", "c": null}, {"ref": "96:2", "sura": "Al-Alaq", "sura_ar": "سُورَةُ العَلَقِ", "type": "Meccan", "ar": "خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ ﴿2﴾", "ru": "сотворил человека из сгустка.", "n": "Человек создан «из сгустка».", "c": "Апологеты: это разные стадии; критики: источники разные в разных местах."}, {"ref": "2:34", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ ٱسْجُدُوا۟ لِءَادَمَ فَسَجَدُوٓا۟ إِلَّآ إِبْلِيسَ أَبَىٰ وَٱسْتَكْبَرَ وَكَانَ مِنَ ٱلْكَٰفِرِينَ ﴿34﴾", "ru": "И вот, сказали Мы ангелам: \"Поклонитесь Адаму!\" И поклонились они, кроме Иблиса. Он отказался и превознесся и оказался неверующим.", "n": "Ангелам сказано поклониться Адаму; все поклонились, «кроме Иблиса».", "c": null}, {"ref": "18:50", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ ٱسْجُدُوا۟ لِءَادَمَ فَسَجَدُوٓا۟ إِلَّآ إِبْلِيسَ كَانَ مِنَ ٱلْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِۦٓ ۗ أَفَتَتَّخِذُونَهُۥ وَذُرِّيَّتَهُۥٓ أَوْلِيَآءَ مِن دُونِى وَهُمْ لَكُمْ عَدُوٌّۢ ۚ بِئْسَ لِلظَّٰلِمِينَ بَدَلًۭا ﴿50﴾", "ru": "И вот Мы сказали ангелам: \"Поклонитесь Адаму!\" И поклонились они, кроме Иблиса. Был он из джиннов и совратился с пути Господа своего. Неужели вы возьмете его и его потомство защитниками вместо Меня. Они для вас - враги. Плоха для несправедливых замена!", "n": "Иблис назван «одним из джиннов» — при том, что приказ был дан ангелам, а в 66:6 говорится, что ангелы не ослушиваются Аллаха.", "c": null}, {"ref": "4:157", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "وَقَوْلِهِمْ إِنَّا قَتَلْنَا ٱلْمَسِيحَ عِيسَى ٱبْنَ مَرْيَمَ رَسُولَ ٱللَّهِ وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَٰكِن شُبِّهَ لَهُمْ ۚ وَإِنَّ ٱلَّذِينَ ٱخْتَلَفُوا۟ فِيهِ لَفِى شَكٍّۢ مِّنْهُ ۚ مَا لَهُم بِهِۦ مِنْ عِلْمٍ إِلَّا ٱتِّبَاعَ ٱلظَّنِّ ۚ وَمَا قَتَلُوهُ يَقِينًۢا ﴿157﴾", "ru": "и за их слова: \"Мы ведь убили Мессию, Ису, сына Марйам, посланника Аллаха\" (а они не убили его и не распяли, но это только представилось им; и, поистине, те, которые разногласят об этом, - в сомнении о нем; нет у них об этом никакого знания, кроме следования за предложением. Они не убивали его, - наверное,", "n": "Про Ису: «они не убили его и не распяли», а «им это показалось».", "c": null}, {"ref": "19:33", "sura": "Maryam", "sura_ar": "سُورَةُ مَرۡيَمَ", "type": "Meccan", "ar": "وَٱلسَّلَٰمُ عَلَىَّ يَوْمَ وُلِدتُّ وَيَوْمَ أَمُوتُ وَيَوْمَ أُبْعَثُ حَيًّۭا ﴿33﴾", "ru": "И мир мне в тот день, как я родился, и в день, что умру, и в день, когда буду воскрешен живым!\"", "n": "Иса говорит: «И мир мне в день, как я родился, и в день, как умру, и в день, как буду воскрешён».", "c": "Традиция: умрёт в конце времён."}]}, {"id": "muhammad", "title": "Особые права Пророка", "icon": "☪", "intro": "Аяты, в которых Бог напрямую решает личные вопросы Мухаммада и закрепляет за ним привилегии, недоступные остальным мусульманам.", "verses": [{"ref": "33:37", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "وَإِذْ تَقُولُ لِلَّذِىٓ أَنْعَمَ ٱللَّهُ عَلَيْهِ وَأَنْعَمْتَ عَلَيْهِ أَمْسِكْ عَلَيْكَ زَوْجَكَ وَٱتَّقِ ٱللَّهَ وَتُخْفِى فِى نَفْسِكَ مَا ٱللَّهُ مُبْدِيهِ وَتَخْشَى ٱلنَّاسَ وَٱللَّهُ أَحَقُّ أَن تَخْشَىٰهُ ۖ فَلَمَّا قَضَىٰ زَيْدٌۭ مِّنْهَا وَطَرًۭا زَوَّجْنَٰكَهَا لِكَىْ لَا يَكُونَ عَلَى ٱلْمُؤْمِنِينَ حَرَجٌۭ فِىٓ أَزْوَٰجِ أَدْعِيَآئِهِمْ إِذَا قَضَوْا۟ مِنْهُنَّ وَطَرًۭا ۚ وَكَانَ أَمْرُ ٱللَّهِ مَفْعُولًۭا ﴿37﴾", "ru": "И вот ты говорил тому, кого облагодетельствовал Аллах и кого ты облагодетельствовал: \"Удержи при себе свою жену и побойся Аллаха!\" И ты скрывал в своей душе то, что обнаруживал Аллах и боялся людей, а между тем Аллаха следует больше бояться. Когда же Зайд удовлетворил свое желание по отношению к ней, Мы женили тебя на ней, чтобы для верующих не было стеснения с женами их приемышей, когда они удовлетворят свои желания. Дело Аллаха свершается!", "n": "История с Зайнаб: она была женой приёмного сына Мухаммада Зайда; после развода Бог сам «женил» её на Пророке, чтобы устранить «вину» перед верующими.", "c": "Традиционно — отмена обычая усыновления; критики видят в аяте удобное «откровение» по личному вопросу."}, {"ref": "33:50", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ إِنَّآ أَحْلَلْنَا لَكَ أَزْوَٰجَكَ ٱلَّٰتِىٓ ءَاتَيْتَ أُجُورَهُنَّ وَمَا مَلَكَتْ يَمِينُكَ مِمَّآ أَفَآءَ ٱللَّهُ عَلَيْكَ وَبَنَاتِ عَمِّكَ وَبَنَاتِ عَمَّٰتِكَ وَبَنَاتِ خَالِكَ وَبَنَاتِ خَٰلَٰتِكَ ٱلَّٰتِى هَاجَرْنَ مَعَكَ وَٱمْرَأَةًۭ مُّؤْمِنَةً إِن وَهَبَتْ نَفْسَهَا لِلنَّبِىِّ إِنْ أَرَادَ ٱلنَّبِىُّ أَن يَسْتَنكِحَهَا خَالِصَةًۭ لَّكَ مِن دُونِ ٱلْمُؤْمِنِينَ ۗ قَدْ عَلِمْنَا مَا فَرَضْنَا عَلَيْهِمْ فِىٓ أَزْوَٰجِهِمْ وَمَا مَلَكَتْ أَيْمَٰنُهُمْ لِكَيْلَا يَكُونَ عَلَيْكَ حَرَجٌۭ ۗ وَكَانَ ٱللَّهُ غَفُورًۭا رَّحِيمًۭا ﴿50﴾", "ru": "О пророк, Мы разрешили тебе твоими женами тех, которым ты дал их награду, и тех, которыми овладела твоя десница из того, что даровал Аллах тебе в добычу, и дочерей твоего дяди со стороны отца, и дочерей твоих теток со стороны отца, и дочерей твоего дяди со стороны матери, и дочерей твоих теток со стороны матери, которые выселились вместе с тобой, и верующую женщину, если она отдала самое себя пророку, если пророк пожелает жениться на ней, - исключительно для тебя, помимо верующих. Мы знаем, что Мы установили для них относительно их жен и того, чем овладели десницы их, для того. чтобы не было на тебе стеснения. Аллах - прощающ. милосерд!", "n": "Пророку дозволено то, чего нет у остальных: сверх четырёх жён — любое число, «женщина, отдавшая себя Пророку», — «только для тебя, не для остальных верующих».", "c": null}, {"ref": "33:53", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَدْخُلُوا۟ بُيُوتَ ٱلنَّبِىِّ إِلَّآ أَن يُؤْذَنَ لَكُمْ إِلَىٰ طَعَامٍ غَيْرَ نَٰظِرِينَ إِنَىٰهُ وَلَٰكِنْ إِذَا دُعِيتُمْ فَٱدْخُلُوا۟ فَإِذَا طَعِمْتُمْ فَٱنتَشِرُوا۟ وَلَا مُسْتَـْٔنِسِينَ لِحَدِيثٍ ۚ إِنَّ ذَٰلِكُمْ كَانَ يُؤْذِى ٱلنَّبِىَّ فَيَسْتَحْىِۦ مِنكُمْ ۖ وَٱللَّهُ لَا يَسْتَحْىِۦ مِنَ ٱلْحَقِّ ۚ وَإِذَا سَأَلْتُمُوهُنَّ مَتَٰعًۭا فَسْـَٔلُوهُنَّ مِن وَرَآءِ حِجَابٍۢ ۚ ذَٰلِكُمْ أَطْهَرُ لِقُلُوبِكُمْ وَقُلُوبِهِنَّ ۚ وَمَا كَانَ لَكُمْ أَن تُؤْذُوا۟ رَسُولَ ٱللَّهِ وَلَآ أَن تَنكِحُوٓا۟ أَزْوَٰجَهُۥ مِنۢ بَعْدِهِۦٓ أَبَدًا ۚ إِنَّ ذَٰلِكُمْ كَانَ عِندَ ٱللَّهِ عَظِيمًا ﴿53﴾", "ru": "О те, которые уверовали! Не входите в дома пророка, если только не будет разрешена вам еда, не дожидаясь ее времени. Но когда вас позовут, то входите, а когда покушаете, то расходитесь, не вступая дружески в беседу. Это с вашей стороны удручает пророка, но он стыдится вас, а Аллах не стыдится истины. А когда просите их о какой-нибудь утвари, то просите их через завесу. Это вам чище для ваших сердец и их сердец. Не следует вам удручать посланника Аллаха и никогда не жениться на его женах после него. Это с вашей стороны велико у Аллаха.", "n": "Верующим запрещено входить в дома Пророка без приглашения, задерживаться, а жениться на его вдовах — «никогда».", "c": null}, {"ref": "66:1", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ ﴿1﴾", "ru": "О, пророк, почему ты запрещаешь то, что разрешил тебе Аллах, домогаясь расположения своих жен? А Аллах - прощающий, милостивый!", "n": "«О Пророк! Почему ты запрещаешь то, что Аллах дозволил тебе, стремясь угодить своим жёнам?» — Бог вмешивается в семейную ссору.", "c": null}, {"ref": "49:2", "sura": "Al-Hujuraat", "sura_ar": "سُورَةُ الحُجُرَاتِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَرْفَعُوٓا۟ أَصْوَٰتَكُمْ فَوْقَ صَوْتِ ٱلنَّبِىِّ وَلَا تَجْهَرُوا۟ لَهُۥ بِٱلْقَوْلِ كَجَهْرِ بَعْضِكُمْ لِبَعْضٍ أَن تَحْبَطَ أَعْمَٰلُكُمْ وَأَنتُمْ لَا تَشْعُرُونَ ﴿2﴾", "ru": "О вы, которые уверовали! Не поднимайте своих голосов выше голоса пророка и не обращайтесь к нему громко с речью, как обращаетесь друг к другу, чтобы не оказались тщетными ваши дела, а вы и не знаете.", "n": "Нельзя повышать голос над голосом Пророка: «иначе ваши деяния пропадут, а вы и не заметите».", "c": null}, {"ref": "33:36", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "وَمَا كَانَ لِمُؤْمِنٍۢ وَلَا مُؤْمِنَةٍ إِذَا قَضَى ٱللَّهُ وَرَسُولُهُۥٓ أَمْرًا أَن يَكُونَ لَهُمُ ٱلْخِيَرَةُ مِنْ أَمْرِهِمْ ۗ وَمَن يَعْصِ ٱللَّهَ وَرَسُولَهُۥ فَقَدْ ضَلَّ ضَلَٰلًۭا مُّبِينًۭا ﴿36﴾", "ru": "Не бывает ни для верующего, ни для верующей, когда решил Аллах и Его посланник дело, выбора в их деле. А кто не слушается Аллаха и Его посланника, тот попал в явное заблуждение.", "n": "Верующий не вправе иметь выбор, когда Бог и Его посланник решили дело.", "c": null}, {"ref": "33:28", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلنَّبِىُّ قُل لِّأَزْوَٰجِكَ إِن كُنتُنَّ تُرِدْنَ ٱلْحَيَوٰةَ ٱلدُّنْيَا وَزِينَتَهَا فَتَعَالَيْنَ أُمَتِّعْكُنَّ وَأُسَرِّحْكُنَّ سَرَاحًۭا جَمِيلًۭا ﴿28﴾", "ru": "О пророк, скажи твоим женам: \"Если вы желаете ближней жизни и ее прикрас, то приходите: я дам вам насладиться и отпущу вас прекрасным способом.", "n": "Пророку приказано предложить жёнам выбор: мирская жизнь или Аллах; обидевшиеся жёны могут быть отпущены. Следом (33:30) угроза — за явный проступок наказание жёнам Пророка удвоено.", "c": null}, {"ref": "33:56", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "إِنَّ ٱللَّهَ وَمَلَٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِىِّ ۚ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ صَلُّوا۟ عَلَيْهِ وَسَلِّمُوا۟ تَسْلِيمًا ﴿56﴾", "ru": "Поистине, Аллах и его ангелы благословляют пророка! О вы, которые уверовали! Совершайте молитвы над ними и приветствуйте приветствием.", "n": "«Аллах и Его ангелы благословляют Пророка; о вы, которые уверовали, благословляйте его». Бог приказывает верующим славить человека.", "c": null}, {"ref": "33:57", "sura": "Al-Ahzaab", "sura_ar": "سُورَةُ الأَحۡزَابِ", "type": "Medinan", "ar": "إِنَّ ٱلَّذِينَ يُؤْذُونَ ٱللَّهَ وَرَسُولَهُۥ لَعَنَهُمُ ٱللَّهُ فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ وَأَعَدَّ لَهُمْ عَذَابًۭا مُّهِينًۭا ﴿57﴾", "ru": "Поистине, те, которые причиняют обиду Аллаху и Его посланнику, - проклял их Аллах в жизни здешней и будущей и приготовил им наказание унизительное.", "n": "Тех, кто «обижает Аллаха и Его посланника», проклянёт Аллах в этом мире и в будущем, и им — унизительное мучение.", "c": null}, {"ref": "66:3-5", "sura": "At-Tahrim", "sura_ar": "سُورَةُ التَّحۡرِيمِ", "type": "Medinan", "ar": "وَإِذْ أَسَرَّ ٱلنَّبِىُّ إِلَىٰ بَعْضِ أَزْوَٰجِهِۦ حَدِيثًۭا فَلَمَّا نَبَّأَتْ بِهِۦ وَأَظْهَرَهُ ٱللَّهُ عَلَيْهِ عَرَّفَ بَعْضَهُۥ وَأَعْرَضَ عَنۢ بَعْضٍۢ ۖ فَلَمَّا نَبَّأَهَا بِهِۦ قَالَتْ مَنْ أَنۢبَأَكَ هَٰذَا ۖ قَالَ نَبَّأَنِىَ ٱلْعَلِيمُ ٱلْخَبِيرُ ﴿3﴾ إِن تَتُوبَآ إِلَى ٱللَّهِ فَقَدْ صَغَتْ قُلُوبُكُمَا ۖ وَإِن تَظَٰهَرَا عَلَيْهِ فَإِنَّ ٱللَّهَ هُوَ مَوْلَىٰهُ وَجِبْرِيلُ وَصَٰلِحُ ٱلْمُؤْمِنِينَ ۖ وَٱلْمَلَٰٓئِكَةُ بَعْدَ ذَٰلِكَ ظَهِيرٌ ﴿4﴾ عَسَىٰ رَبُّهُۥٓ إِن طَلَّقَكُنَّ أَن يُبْدِلَهُۥٓ أَزْوَٰجًا خَيْرًۭا مِّنكُنَّ مُسْلِمَٰتٍۢ مُّؤْمِنَٰتٍۢ قَٰنِتَٰتٍۢ تَٰٓئِبَٰتٍ عَٰبِدَٰتٍۢ سَٰٓئِحَٰتٍۢ ثَيِّبَٰتٍۢ وَأَبْكَارًۭا ﴿5﴾", "ru": "(3) И вот Пророк сообщил втайне какой-то из своих жен новость. А когда она передала это и Аллах ему открыл, то часть он сообщил, а от части уклонился. А когда он сообщил ей про это, она сказала: \"Кто сообщил тебе это?\" Он сказал: \"Сообщил мне знающий, ведающий\". (4) Если вы обе обратитесь к Аллаху... , ведь склонились ваши сердца. А если открыто будете противиться ему... , то ведь Аллах - его защитник, и Джибрил, и праведный из верующих, и ангелы после этого - помощники. (5) Может быть, его Господь, если он даст вам развод, заменит ему женами лучшими, чем вы - предавшимися, верующими, благочестивыми, обращающимися, поклоняющимися, паломничающими, вдовами и девицами.", "n": "Пророк по секрету сказал одной из жён; она разболтала; Бог раскрыл ему; угроза жёнам: «Если он разведётся с вами, Господь заменит вас лучшими женами» — вмешательство Бога в семейную ссору.", "c": null}, {"ref": "8:1", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَسْـَٔلُونَكَ عَنِ ٱلْأَنفَالِ ۖ قُلِ ٱلْأَنفَالُ لِلَّهِ وَٱلرَّسُولِ ۖ فَٱتَّقُوا۟ ٱللَّهَ وَأَصْلِحُوا۟ ذَاتَ بَيْنِكُمْ ۖ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥٓ إِن كُنتُم مُّؤْمِنِينَ ﴿1﴾", "ru": "Они спрашивают тебя о добыче. Скажи: \"Добыча принадлежит Аллаху и посланнику; бойтесь же Аллаха, упорядочите между собой и повинуйтесь Аллаху и Его посланнику, если вы веруете!\"", "n": "Военная добыча принадлежит Аллаху и посланнику.", "c": null}, {"ref": "8:41", "sura": "Al-Anfaal", "sura_ar": "سُورَةُ الأَنفَالِ", "type": "Medinan", "ar": "۞ وَٱعْلَمُوٓا۟ أَنَّمَا غَنِمْتُم مِّن شَىْءٍۢ فَأَنَّ لِلَّهِ خُمُسَهُۥ وَلِلرَّسُولِ وَلِذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ إِن كُنتُمْ ءَامَنتُم بِٱللَّهِ وَمَآ أَنزَلْنَا عَلَىٰ عَبْدِنَا يَوْمَ ٱلْفُرْقَانِ يَوْمَ ٱلْتَقَى ٱلْجَمْعَانِ ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ ﴿41﴾", "ru": "И знайте, что если вы взяли что-либо в добычу, то Аллаху - пятая часть, и посланнику, и родственникам, и сиротам, и бедным, и путнику, если вы уверовали в Аллаха и в то, что Мы низвели Нашему рабу в день различения, в день, когда встретились два сборища. Поистине, Аллах мощен над всякой вещью!", "n": "Пятая часть добычи — Аллаху, посланнику, его родственникам, сиротам, беднякам и путникам.", "c": null}, {"ref": "59:6-7", "sura": "Al-Hashr", "sura_ar": "سُورَةُ الحَشۡرِ", "type": "Medinan", "ar": "وَمَآ أَفَآءَ ٱللَّهُ عَلَىٰ رَسُولِهِۦ مِنْهُمْ فَمَآ أَوْجَفْتُمْ عَلَيْهِ مِنْ خَيْلٍۢ وَلَا رِكَابٍۢ وَلَٰكِنَّ ٱللَّهَ يُسَلِّطُ رُسُلَهُۥ عَلَىٰ مَن يَشَآءُ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿6﴾ مَّآ أَفَآءَ ٱللَّهُ عَلَىٰ رَسُولِهِۦ مِنْ أَهْلِ ٱلْقُرَىٰ فَلِلَّهِ وَلِلرَّسُولِ وَلِذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ كَىْ لَا يَكُونَ دُولَةًۢ بَيْنَ ٱلْأَغْنِيَآءِ مِنكُمْ ۚ وَمَآ ءَاتَىٰكُمُ ٱلرَّسُولُ فَخُذُوهُ وَمَا نَهَىٰكُمْ عَنْهُ فَٱنتَهُوا۟ ۚ وَٱتَّقُوا۟ ٱللَّهَ ۖ إِنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ ﴿7﴾", "ru": "(6) И что дал Аллах в добычу о них Своему посланнику, для этого не приходилось вам гнать ни коней, ни верблюдов, но Аллах дает власть Своим посланникам, над кем хочет. Аллах мощен над каждой вещью! (7) Что дал Аллах в добычу посланнику Своему от обитателей селений, - то принадлежит Аллаху, и посланнику, и близким, и сиротам, и бедным, и путнику, чтобы не оказалось это распределением между богатыми у вас. И что даровал вам посланник, то берите, а что он вам запретил, от того удержитесь. И бойтесь Аллаха, ведь Аллах силен наказанием!", "n": "Имущество, взятое без боя («фай»), распоряжается посланник: оно принадлежит Аллаху, посланнику и ближним.", "c": null}, {"ref": "58:12", "sura": "Al-Mujaadila", "sura_ar": "سُورَةُ المُجَادلَةِ", "type": "Medinan", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا نَٰجَيْتُمُ ٱلرَّسُولَ فَقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَةًۭ ۚ ذَٰلِكَ خَيْرٌۭ لَّكُمْ وَأَطْهَرُ ۚ فَإِن لَّمْ تَجِدُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌ ﴿12﴾", "ru": "О вы, которые уверовали! Когда беседуете втайне с посланником, то выдвиньте перед вашей беседой милостыню. Это лучше для вас и чище. А если не найдете... то Аллах - прощающий, милосердный!", "n": "Перед тайной беседой с Пророком — обязательная милостыня.", "c": null}, {"ref": "24:63", "sura": "An-Noor", "sura_ar": "سُورَةُ النُّورِ", "type": "Medinan", "ar": "لَّا تَجْعَلُوا۟ دُعَآءَ ٱلرَّسُولِ بَيْنَكُمْ كَدُعَآءِ بَعْضِكُم بَعْضًۭا ۚ قَدْ يَعْلَمُ ٱللَّهُ ٱلَّذِينَ يَتَسَلَّلُونَ مِنكُمْ لِوَاذًۭا ۚ فَلْيَحْذَرِ ٱلَّذِينَ يُخَالِفُونَ عَنْ أَمْرِهِۦٓ أَن تُصِيبَهُمْ فِتْنَةٌ أَوْ يُصِيبَهُمْ عَذَابٌ أَلِيمٌ ﴿63﴾", "ru": "Не делайте обращения к посланнику среди вас такими же, как обращение вас друг к другу. Аллах знает тех из вас, которые пробираются, ища убежища. Пусть берегутся те, которые нарушают Его приказ, чтобы их не постигло испытание или не постигло их наказание мучительное!", "n": "Не обращайтесь к посланнику так, как друг к другу.", "c": null}, {"ref": "4:65", "sura": "An-Nisaa", "sura_ar": "سُورَةُ النِّسَاءِ", "type": "Medinan", "ar": "فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّىٰ يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لَا يَجِدُوا۟ فِىٓ أَنفُسِهِمْ حَرَجًۭا مِّمَّا قَضَيْتَ وَيُسَلِّمُوا۟ تَسْلِيمًۭا ﴿65﴾", "ru": "Но нет - клянусь твоим Господом! - не уверуют они, пока не сделают тебя судьей в том, что запутано между ними. Потом не найдут они в самих себе затруднения о том, что ты решил, и подчинятся полностью.", "n": "Они не уверуют, пока не сделают его судьёй в своих спорах и не примут его решение без стеснения.", "c": null}]}, {"id": "odd", "title": "Странные и сомнительные утверждения", "icon": "?", "intro": "Места, которые критики называют нелепыми, наивными или легендарными. Чаще всего это чудеса, пересказы древних историй и образы, которые трудно понять буквально.", "verses": [{"ref": "2:67-73", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِۦٓ إِنَّ ٱللَّهَ يَأْمُرُكُمْ أَن تَذْبَحُوا۟ بَقَرَةًۭ ۖ قَالُوٓا۟ أَتَتَّخِذُنَا هُزُوًۭا ۖ قَالَ أَعُوذُ بِٱللَّهِ أَنْ أَكُونَ مِنَ ٱلْجَٰهِلِينَ ﴿67﴾ قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا هِىَ ۚ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌۭ لَّا فَارِضٌۭ وَلَا بِكْرٌ عَوَانٌۢ بَيْنَ ذَٰلِكَ ۖ فَٱفْعَلُوا۟ مَا تُؤْمَرُونَ ﴿68﴾ قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا لَوْنُهَا ۚ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌۭ صَفْرَآءُ فَاقِعٌۭ لَّوْنُهَا تَسُرُّ ٱلنَّٰظِرِينَ ﴿69﴾ قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا هِىَ إِنَّ ٱلْبَقَرَ تَشَٰبَهَ عَلَيْنَا وَإِنَّآ إِن شَآءَ ٱللَّهُ لَمُهْتَدُونَ ﴿70﴾ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌۭ لَّا ذَلُولٌۭ تُثِيرُ ٱلْأَرْضَ وَلَا تَسْقِى ٱلْحَرْثَ مُسَلَّمَةٌۭ لَّا شِيَةَ فِيهَا ۚ قَالُوا۟ ٱلْـَٰٔنَ جِئْتَ بِٱلْحَقِّ ۚ فَذَبَحُوهَا وَمَا كَادُوا۟ يَفْعَلُونَ ﴿71﴾ وَإِذْ قَتَلْتُمْ نَفْسًۭا فَٱدَّٰرَْٰٔتُمْ فِيهَا ۖ وَٱللَّهُ مُخْرِجٌۭ مَّا كُنتُمْ تَكْتُمُونَ ﴿72﴾ فَقُلْنَا ٱضْرِبُوهُ بِبَعْضِهَا ۚ كَذَٰلِكَ يُحْىِ ٱللَّهُ ٱلْمَوْتَىٰ وَيُرِيكُمْ ءَايَٰتِهِۦ لَعَلَّكُمْ تَعْقِلُونَ ﴿73﴾", "ru": "(67) И вот сказал Муса своему народу: \"Вот, Аллах приказывает вам заколоть корову\". Они сказали: \"Не обращаешь ли ты нас в насмешку?\" Он сказал: \"К Аллаху я прибегаю, чтобы не оказаться глупцом!\". (68) Они сказали: \"Призови для нас твоего Господа, чтобы Он разъяснил нам, какова она\". Он сказал: \"Вот, Он говорит: \"Она - корова, не старая и не телка, средняя по возрасту между этим\". Делайте же то, что вам приказано!\" (69) Они сказали: \"Призови для нас твоего Господа, чтобы Он разъяснил нам, каков ее цвет\". Он сказал: \"Вот, Он говорит: \"Она - корова желтая, светел цвет ее, радует она смотрящих\"\". (70) Они сказали: \"Призови для нас твоего Господа, чтобы Он разъяснил нам, какова она: ведь коровы похожи для нас одна на другую, и мы будем, если пожелает Аллах, на верном пути\". (71) Он сказал: \"Вот, Он говорит: \"Она - корова не укрощенная, которая пашет землю, и не орошает пашню, она сохранена в целости, нет отметины на ней\". Они сказали: \"Теперь ты доставил истину\". И они закололи ее, хотя готовы были не сделать этого. (72) И вот вы убили душу и препирались о ней, а Аллах изводит то, что вы скрывали. (73) И Мы сказали: \"Ударьте его чем-нибудь от нее\". Так оживляет Аллах мертвых и показывает вам Его знамения, - может быть, вы уразумеете!", "n": "Приказ зарезать корову и ударить убитого её куском, чтобы он ожил и назвал убийцу; в рассказе много споров о масти и возрасте коровы.", "c": null}, {"ref": "2:259", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "أَوْ كَٱلَّذِى مَرَّ عَلَىٰ قَرْيَةٍۢ وَهِىَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا قَالَ أَنَّىٰ يُحْىِۦ هَٰذِهِ ٱللَّهُ بَعْدَ مَوْتِهَا ۖ فَأَمَاتَهُ ٱللَّهُ مِا۟ئَةَ عَامٍۢ ثُمَّ بَعَثَهُۥ ۖ قَالَ كَمْ لَبِثْتَ ۖ قَالَ لَبِثْتُ يَوْمًا أَوْ بَعْضَ يَوْمٍۢ ۖ قَالَ بَل لَّبِثْتَ مِا۟ئَةَ عَامٍۢ فَٱنظُرْ إِلَىٰ طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْ ۖ وَٱنظُرْ إِلَىٰ حِمَارِكَ وَلِنَجْعَلَكَ ءَايَةًۭ لِّلنَّاسِ ۖ وَٱنظُرْ إِلَى ٱلْعِظَامِ كَيْفَ نُنشِزُهَا ثُمَّ نَكْسُوهَا لَحْمًۭا ۚ فَلَمَّا تَبَيَّنَ لَهُۥ قَالَ أَعْلَمُ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ ﴿259﴾", "ru": "Или как тот, кто проходил мимо селения, а оно было разрушено до оснований. Он сказал: \"Как оживит это Аллах, после того как оно умерло?\" И умертвил его Аллах на сто лет, потом воскресил. Он сказал: \"Сколько ты пробыл?\" Тот сказал: \"Пробыл я день или часть дня\". Он сказал: \"Нет, ты пробыл сто лет! И посмотри на твою пищу и питье, оно не испортилось. И посмотри на своего осла - для того, чтобы Нам сделать тебя знамением для людей, - посмотри на кости, как мы их поднимаем, а потом одеваем мясом\". И когда стало ему ясно, он сказал: \"Я знаю, что Аллах мощен над всякой вещью!\"", "n": "Человека Бог умертвил на сто лет и воскресил; его осёл за это время истлел, а еда не испортилась.", "c": null}, {"ref": "2:260", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَإِذْ قَالَ إِبْرَٰهِۦمُ رَبِّ أَرِنِى كَيْفَ تُحْىِ ٱلْمَوْتَىٰ ۖ قَالَ أَوَلَمْ تُؤْمِن ۖ قَالَ بَلَىٰ وَلَٰكِن لِّيَطْمَئِنَّ قَلْبِى ۖ قَالَ فَخُذْ أَرْبَعَةًۭ مِّنَ ٱلطَّيْرِ فَصُرْهُنَّ إِلَيْكَ ثُمَّ ٱجْعَلْ عَلَىٰ كُلِّ جَبَلٍۢ مِّنْهُنَّ جُزْءًۭا ثُمَّ ٱدْعُهُنَّ يَأْتِينَكَ سَعْيًۭا ۚ وَٱعْلَمْ أَنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌۭ ﴿260﴾", "ru": "И вот сказал Ибрахим: \"Господи! Покажи мне, как Ты оживляешь мертвых\". Он сказал: \"А разве ты не уверовал?\" Тот сказал: \"Да! Но чтобы сердце мое успокоилось\". Сказал Он: \"Возьми же четырех птиц, собери их к себе, потом помести на каждой горе по части их, а потом позови их: они явятся к тебе стремительно, и знай, что Аллах велик и мудр!\"", "n": "Ибрахим просит показать воскрешение: берёт четырёх птиц, рассекает их, части кладёт на горы, и птицы прилетают живыми.", "c": null}, {"ref": "105:3-5", "sura": "Al-Fil", "sura_ar": "سُورَةُ الفِيلِ", "type": "Meccan", "ar": "وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ ﴿3﴾ تَرْمِيهِم بِحِجَارَةٍۢ مِّن سِجِّيلٍۢ ﴿4﴾ فَجَعَلَهُمْ كَعَصْفٍۢ مَّأْكُولٍۭ ﴿5﴾", "ru": "(3) И послал Он на них птиц стаями? (4) Бросали они в них камни из обожженной глины. (5) И сделал Он их точно нива со съеденными зернами.", "n": "Птицы стаями бросали в войско слона камни из обожжённой глины и сделали их «точно нива со съеденными зёрнами».", "c": null}, {"ref": "74:30-31", "sura": "Al-Muddaththir", "sura_ar": "سُورَةُ المُدَّثِّرِ", "type": "Meccan", "ar": "عَلَيْهَا تِسْعَةَ عَشَرَ ﴿30﴾ وَمَا جَعَلْنَآ أَصْحَٰبَ ٱلنَّارِ إِلَّا مَلَٰٓئِكَةًۭ ۙ وَمَا جَعَلْنَا عِدَّتَهُمْ إِلَّا فِتْنَةًۭ لِّلَّذِينَ كَفَرُوا۟ لِيَسْتَيْقِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ وَيَزْدَادَ ٱلَّذِينَ ءَامَنُوٓا۟ إِيمَٰنًۭا ۙ وَلَا يَرْتَابَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ وَٱلْمُؤْمِنُونَ ۙ وَلِيَقُولَ ٱلَّذِينَ فِى قُلُوبِهِم مَّرَضٌۭ وَٱلْكَٰفِرُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلًۭا ۚ كَذَٰلِكَ يُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَمَا يَعْلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَ ۚ وَمَا هِىَ إِلَّا ذِكْرَىٰ لِلْبَشَرِ ﴿31﴾", "ru": "(30) Над ним - девятнадцать. (31) Сделали Мы властителями огня только ангелов и сделали число их только испытанием для тех, которые не веруют, чтобы удостоверились те, кому дана книга, и усилили те, которые веруют, веру. И не сомневались те, кому дана книга, и верующие. И сказали те, в сердцах которых болезнь, и неверующие: \"Что такое хотел Аллах этим, как притчей?\" Так вводит в заблуждение Аллах, кого хочет, и ведет прямым путем, кого хочет, и никто не знает воинств Господа твоего, кроме Него, а это - лишь напоминание людям.", "n": "«Над Саккар — девятнадцать» (стражей); число названо «искушением для неверных».", "c": null}, {"ref": "18:18", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "وَتَحْسَبُهُمْ أَيْقَاظًۭا وَهُمْ رُقُودٌۭ ۚ وَنُقَلِّبُهُمْ ذَاتَ ٱلْيَمِينِ وَذَاتَ ٱلشِّمَالِ ۖ وَكَلْبُهُم بَٰسِطٌۭ ذِرَاعَيْهِ بِٱلْوَصِيدِ ۚ لَوِ ٱطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًۭا وَلَمُلِئْتَ مِنْهُمْ رُعْبًۭا ﴿18﴾", "ru": "Ты думаешь, что они бодрствуют, а они спят, и Мы ворочаем их направо и налево, и собака их растянула лапы на порог; если бы ты усмотрел их, то обратился бы от них бегом и переполнился бы от них страхом.", "n": "Спутники пещеры спят с открытыми глазами, их переворачивают с боку на бок, а собака лежит на пороге, вытянув передние лапы.", "c": null}, {"ref": "18:22", "sura": "Al-Kahf", "sura_ar": "سُورَةُ الكَهۡفِ", "type": "Meccan", "ar": "سَيَقُولُونَ ثَلَٰثَةٌۭ رَّابِعُهُمْ كَلْبُهُمْ وَيَقُولُونَ خَمْسَةٌۭ سَادِسُهُمْ كَلْبُهُمْ رَجْمًۢا بِٱلْغَيْبِ ۖ وَيَقُولُونَ سَبْعَةٌۭ وَثَامِنُهُمْ كَلْبُهُمْ ۚ قُل رَّبِّىٓ أَعْلَمُ بِعِدَّتِهِم مَّا يَعْلَمُهُمْ إِلَّا قَلِيلٌۭ ۗ فَلَا تُمَارِ فِيهِمْ إِلَّا مِرَآءًۭ ظَٰهِرًۭا وَلَا تَسْتَفْتِ فِيهِم مِّنْهُمْ أَحَدًۭا ﴿22﴾", "ru": "Скажут они: \"Трое, а четвертый у них - пес\", - и скажут: \"Пять, а шестой - пес\". Скажи: \"Господь мой лучше знает число их. Знают его только немногие\". Не спорь же с ними иначе, как в явном споре, и не спрашивай о них никого из них.", "n": "Спор о числе спутников и их собаки: «трое, четвёртый — их собака… семеро, восьмой — их собака».", "c": null}, {"ref": "2:26", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "۞ إِنَّ ٱللَّهَ لَا يَسْتَحْىِۦٓ أَن يَضْرِبَ مَثَلًۭا مَّا بَعُوضَةًۭ فَمَا فَوْقَهَا ۚ فَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ فَيَعْلَمُونَ أَنَّهُ ٱلْحَقُّ مِن رَّبِّهِمْ ۖ وَأَمَّا ٱلَّذِينَ كَفَرُوا۟ فَيَقُولُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلًۭا ۘ يُضِلُّ بِهِۦ كَثِيرًۭا وَيَهْدِى بِهِۦ كَثِيرًۭا ۚ وَمَا يُضِلُّ بِهِۦٓ إِلَّا ٱلْفَٰسِقِينَ ﴿26﴾", "ru": "Поистине, Аллах не смущается приводить некоей притчей комара и то, что больше этого. А те, которые веровали, знают, что это - истина от их Господа. Те же, которые неверны, скажут: \"Что желает Аллах этим, как притчей?\" Он вводит этим в заблуждение многих и ведет прямым путем многих. Но сбивает Он этим только распутных,", "n": "Бог «не стыдится привести в пример комара и то, что выше него».", "c": null}, {"ref": "5:31", "sura": "Al-Maaida", "sura_ar": "سُورَةُ المَائـِدَةِ", "type": "Medinan", "ar": "فَبَعَثَ ٱللَّهُ غُرَابًۭا يَبْحَثُ فِى ٱلْأَرْضِ لِيُرِيَهُۥ كَيْفَ يُوَٰرِى سَوْءَةَ أَخِيهِ ۚ قَالَ يَٰوَيْلَتَىٰٓ أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هَٰذَا ٱلْغُرَابِ فَأُوَٰرِىَ سَوْءَةَ أَخِى ۖ فَأَصْبَحَ مِنَ ٱلنَّٰدِمِينَ ﴿31﴾", "ru": "И послал Аллах ворона, который разрывал землю, чтобы показать ему, как скрывать скверну его брата. Он сказал: \"Горе мне! Я не в состоянии быть подобным этому ворону и скрыть скверну моего брата\". И оказался он в числе раскаявшихся.", "n": "Бог посылает ворона, который роет землю, чтобы показать, как скрыть тело брата.", "c": null}, {"ref": "3:49", "sura": "Aal-i-Imraan", "sura_ar": "سُورَةُ آلِ عِمۡرَانَ", "type": "Medinan", "ar": "وَرَسُولًا إِلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنِّى قَدْ جِئْتُكُم بِـَٔايَةٍۢ مِّن رَّبِّكُمْ ۖ أَنِّىٓ أَخْلُقُ لَكُم مِّنَ ٱلطِّينِ كَهَيْـَٔةِ ٱلطَّيْرِ فَأَنفُخُ فِيهِ فَيَكُونُ طَيْرًۢا بِإِذْنِ ٱللَّهِ ۖ وَأُبْرِئُ ٱلْأَكْمَهَ وَٱلْأَبْرَصَ وَأُحْىِ ٱلْمَوْتَىٰ بِإِذْنِ ٱللَّهِ ۖ وَأُنَبِّئُكُم بِمَا تَأْكُلُونَ وَمَا تَدَّخِرُونَ فِى بُيُوتِكُمْ ۚ إِنَّ فِى ذَٰلِكَ لَءَايَةًۭ لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ ﴿49﴾", "ru": "и сделает посланником к сынам Исраила\". - \"Я пришел к вам со знамением от вашего Господа. Я сотворю вам из глины по образу птицы и подую в нее, и станет это птицей по изволению Аллаха. Я исцелю слепого прокаженного и оживлю мертвых с дозволения Аллаха. Я сообщу вам, что вы едите и что сохраняете в ваших домах. Поистине, в этом - знамение для вас, если вы верующие!", "n": "Иса «создаёт из глины подобие птицы, дует на неё, и она становится птицей по дозволению Аллаха».", "c": "Рассказ похож на апокрифическое Евангелие детства Фомы, которого в Новом Завете нет."}, {"ref": "7:176", "sura": "Al-A'raaf", "sura_ar": "سُورَةُ الأَعۡرَافِ", "type": "Meccan", "ar": "وَلَوْ شِئْنَا لَرَفَعْنَٰهُ بِهَا وَلَٰكِنَّهُۥٓ أَخْلَدَ إِلَى ٱلْأَرْضِ وَٱتَّبَعَ هَوَىٰهُ ۚ فَمَثَلُهُۥ كَمَثَلِ ٱلْكَلْبِ إِن تَحْمِلْ عَلَيْهِ يَلْهَثْ أَوْ تَتْرُكْهُ يَلْهَث ۚ ذَّٰلِكَ مَثَلُ ٱلْقَوْمِ ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا ۚ فَٱقْصُصِ ٱلْقَصَصَ لَعَلَّهُمْ يَتَفَكَّرُونَ ﴿176﴾", "ru": "А если бы Мы пожелали, то возвысили бы его имя. Но он приник к земле и последовал за своей страстью и подобен он собаке: если бросишься на нее, высовывает язык и, если оставишь ее, высовывает. Это - притча о людях, которые считали ложью Наши знамения. Рассказывай же рассказом, - может быть, они размыслят!", "n": "Притча о человеке, подобном собаке: «если ты нападёшь на неё — она высунет язык, и если оставишь — высунет язык».", "c": null}, {"ref": "68:10-13", "sura": "Al-Qalam", "sura_ar": "سُورَةُ القَلَمِ", "type": "Meccan", "ar": "وَلَا تُطِعْ كُلَّ حَلَّافٍۢ مَّهِينٍ ﴿10﴾ هَمَّازٍۢ مَّشَّآءٍۭ بِنَمِيمٍۢ ﴿11﴾ مَّنَّاعٍۢ لِّلْخَيْرِ مُعْتَدٍ أَثِيمٍ ﴿12﴾ عُتُلٍّۭ بَعْدَ ذَٰلِكَ زَنِيمٍ ﴿13﴾", "ru": "(10) Не повинуйся же всякому любителю клятв, презренному, (11) хулителю, бродящему со сплетнями, (12) препятствующему добру, врагу, грешнику, (13) грубому, после этого безродному,", "n": "Эпитеты для неверного: клятвопреступник, презренный, клеветник… жестокий, и «после этого безродный».", "c": null}, {"ref": "96:15-16", "sura": "Al-Alaq", "sura_ar": "سُورَةُ العَلَقِ", "type": "Meccan", "ar": "كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًۢا بِٱلنَّاصِيَةِ ﴿15﴾ نَاصِيَةٍۢ كَٰذِبَةٍ خَاطِئَةٍۢ ﴿16﴾", "ru": "(15) Так нет! Если он не удержится, Мы схватим его за хохол - (16) хохол лживый, грешный.", "n": "Угроза: «схватим его за хохол — хохол лживый, грешный».", "c": null}, {"ref": "56:35-38", "sura": "Al-Waaqia", "sura_ar": "سُورَةُ الوَاقِعَةِ", "type": "Meccan", "ar": "إِنَّآ أَنشَأْنَٰهُنَّ إِنشَآءًۭ ﴿35﴾ فَجَعَلْنَٰهُنَّ أَبْكَارًا ﴿36﴾ عُرُبًا أَتْرَابًۭا ﴿37﴾ لِّأَصْحَٰبِ ٱلْيَمِينِ ﴿38﴾", "ru": "(35) Мы ведь создали их творением (36) и сделали их девственницами, (37) мужа любящими, сверстницами (38) для владык правой стороны.", "n": "Райская награда включает девственниц-«сверстниц» для праведников.", "c": null}, {"ref": "55:70-74", "sura": "Ar-Rahmaan", "sura_ar": "سُورَةُ الرَّحۡمَٰن", "type": "Medinan", "ar": "فِيهِنَّ خَيْرَٰتٌ حِسَانٌۭ ﴿70﴾ فَبِأَىِّ ءَالَآءِ رَبِّكُمَا تُكَذِّبَانِ ﴿71﴾ حُورٌۭ مَّقْصُورَٰتٌۭ فِى ٱلْخِيَامِ ﴿72﴾ فَبِأَىِّ ءَالَآءِ رَبِّكُمَا تُكَذِّبَانِ ﴿73﴾ لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ ﴿74﴾", "ru": "(70) В них - добротные, прекрасные, - (71) Какое же из благодеяний Господа вашего вы сочтете ложным? - (72) черноокие, скрытые в шатрах, - (73) Какое же из благодеяний Господа вашего вы сочтете ложным? (74) Не коснулся их до них ни человек, ни джинны, -", "n": "В райских садах — «благие, красивые» девы, «заключённые в шатрах», нетронутые ни людьми, ни джиннами.", "c": null}, {"ref": "78:31-33", "sura": "An-Naba", "sura_ar": "سُورَةُ النَّبَإِ", "type": "Meccan", "ar": "إِنَّ لِلْمُتَّقِينَ مَفَازًا ﴿31﴾ حَدَآئِقَ وَأَعْنَٰبًۭا ﴿32﴾ وَكَوَاعِبَ أَتْرَابًۭا ﴿33﴾", "ru": "(31) Ведь для богобоязненных есть место спасения (32) сады и виноградники, (33) и полногрудые сверстницы,", "n": "Для богобоязненных — сады, виноградники и девы-сверстницы (в ряде переводов — «с округлыми грудями»).", "c": null}]}, {"id": "superstition", "title": "Джинны, магия и суеверия", "icon": "✦", "intro": "Аяты о сверхъестественных существах и колдовстве, воспринимаемые в исламской традиции буквально.", "verses": [{"ref": "113:4", "sura": "Al-Falaq", "sura_ar": "سُورَةُ الفَلَقِ", "type": "Meccan", "ar": "وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ ﴿4﴾", "ru": "от зла дующих на узлы,", "n": "«От зла дующих на узлы» — традиционно женщин-колдуний; хадис связывает аят с порчей, наведённой на Мухаммада.", "c": null}, {"ref": "72:8-9", "sura": "Al-Jinn", "sura_ar": "سُورَةُ الجِنِّ", "type": "Meccan", "ar": "وَأَنَّا لَمَسْنَا ٱلسَّمَآءَ فَوَجَدْنَٰهَا مُلِئَتْ حَرَسًۭا شَدِيدًۭا وَشُهُبًۭا ﴿8﴾ وَأَنَّا كُنَّا نَقْعُدُ مِنْهَا مَقَٰعِدَ لِلسَّمْعِ ۖ فَمَن يَسْتَمِعِ ٱلْءَانَ يَجِدْ لَهُۥ شِهَابًۭا رَّصَدًۭا ﴿9﴾", "ru": "(8) И мы коснулись неба и нашли, что оно наполнено стражами могучими и светочами. (9) И мы сидели около него на седалищах, чтобы слушать, но кто прислушивается теперь, тот находит для себя подстерегающий светоч.", "n": "Джинны рассказывают: небо «наполнено суровой стражей и метеорами», места для подслушивания теперь недоступны.", "c": null}, {"ref": "2:102", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "وَٱتَّبَعُوا۟ مَا تَتْلُوا۟ ٱلشَّيَٰطِينُ عَلَىٰ مُلْكِ سُلَيْمَٰنَ ۖ وَمَا كَفَرَ سُلَيْمَٰنُ وَلَٰكِنَّ ٱلشَّيَٰطِينَ كَفَرُوا۟ يُعَلِّمُونَ ٱلنَّاسَ ٱلسِّحْرَ وَمَآ أُنزِلَ عَلَى ٱلْمَلَكَيْنِ بِبَابِلَ هَٰرُوتَ وَمَٰرُوتَ ۚ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّىٰ يَقُولَآ إِنَّمَا نَحْنُ فِتْنَةٌۭ فَلَا تَكْفُرْ ۖ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِۦ بَيْنَ ٱلْمَرْءِ وَزَوْجِهِۦ ۚ وَمَا هُم بِضَآرِّينَ بِهِۦ مِنْ أَحَدٍ إِلَّا بِإِذْنِ ٱللَّهِ ۚ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ ۚ وَلَقَدْ عَلِمُوا۟ لَمَنِ ٱشْتَرَىٰهُ مَا لَهُۥ فِى ٱلْءَاخِرَةِ مِنْ خَلَٰقٍۢ ۚ وَلَبِئْسَ مَا شَرَوْا۟ بِهِۦٓ أَنفُسَهُمْ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ ﴿102﴾", "ru": "и они последовали за тем, что читали шайтаны, в царство Сулаймана. Сулайман не был неверным, но шайтаны были неверными, обучая людей колдовству и тому, что было ниспослано обоим ангелам в Вавилоне, Харуту и Маруту. Но они оба не обучали никого, пока не говорили: \"Мы - искушение, не будь же неверным!\" И те научались от них, чем разлучать мужа от жены, - но они не вредили этим никому иначе, как с дозволения Аллаха. И обучались они тому, что им вредило и не приносило пользы, и они знали, что тот, кто приобретал это, - нет ему доли в будущей жизни. Плохо то, что они покупали за свои души, - если бы они это знали!", "n": "Сулейман не был неверным, а шайтаны — были; они учили людей колдовству; ангелы Харут и Марут в Вавилоне учили «тому, чем разлучают мужа с женой».", "c": null}, {"ref": "34:12-14", "sura": "Saba", "sura_ar": "سُورَةُ سَبَإٍ", "type": "Meccan", "ar": "وَلِسُلَيْمَٰنَ ٱلرِّيحَ غُدُوُّهَا شَهْرٌۭ وَرَوَاحُهَا شَهْرٌۭ ۖ وَأَسَلْنَا لَهُۥ عَيْنَ ٱلْقِطْرِ ۖ وَمِنَ ٱلْجِنِّ مَن يَعْمَلُ بَيْنَ يَدَيْهِ بِإِذْنِ رَبِّهِۦ ۖ وَمَن يَزِغْ مِنْهُمْ عَنْ أَمْرِنَا نُذِقْهُ مِنْ عَذَابِ ٱلسَّعِيرِ ﴿12﴾ يَعْمَلُونَ لَهُۥ مَا يَشَآءُ مِن مَّحَٰرِيبَ وَتَمَٰثِيلَ وَجِفَانٍۢ كَٱلْجَوَابِ وَقُدُورٍۢ رَّاسِيَٰتٍ ۚ ٱعْمَلُوٓا۟ ءَالَ دَاوُۥدَ شُكْرًۭا ۚ وَقَلِيلٌۭ مِّنْ عِبَادِىَ ٱلشَّكُورُ ﴿13﴾ فَلَمَّا قَضَيْنَا عَلَيْهِ ٱلْمَوْتَ مَا دَلَّهُمْ عَلَىٰ مَوْتِهِۦٓ إِلَّا دَآبَّةُ ٱلْأَرْضِ تَأْكُلُ مِنسَأَتَهُۥ ۖ فَلَمَّا خَرَّ تَبَيَّنَتِ ٱلْجِنُّ أَن لَّوْ كَانُوا۟ يَعْلَمُونَ ٱلْغَيْبَ مَا لَبِثُوا۟ فِى ٱلْعَذَابِ ٱلْمُهِينِ ﴿14﴾", "ru": "(12) А Сулайману - ветер... утренний путь его - месяц, и вечерний путь его - месяц. Источили Мы для него ключ меди. А из джиннов - такие, что работают пред ним по повелению его Господа; кто же из них уклонится от Нашего повеления, тому Мы дадим попробовать наказание огня. (13) Делают они ему, что он пожелает, из алтарей, изображений, чаш, как цистерны, и котлов прочных. Сотворите, род Дауда, благодарность! Но немногие из Моих рабов благодарны! (14) Когда же Мы обрекли его на смерть, указало на смерть его только животное земли, которое подъело посох. А когда он упал, уразумели джинны, что если бы они знали тайное, то не оказались бы в унизительном наказании.", "n": "Ветер и джинны подчинены Сулейману (Соломону); джинны не знали о его смерти, пока червь не подточил посох, и «продолжали работать на мёртвого царя».", "c": null}, {"ref": "38:36-38", "sura": "Saad", "sura_ar": "سُورَةُ صٓ", "type": "Meccan", "ar": "فَسَخَّرْنَا لَهُ ٱلرِّيحَ تَجْرِى بِأَمْرِهِۦ رُخَآءً حَيْثُ أَصَابَ ﴿36﴾ وَٱلشَّيَٰطِينَ كُلَّ بَنَّآءٍۢ وَغَوَّاصٍۢ ﴿37﴾ وَءَاخَرِينَ مُقَرَّنِينَ فِى ٱلْأَصْفَادِ ﴿38﴾", "ru": "(36) И подчинили Мы ему ветер, который течет, по его повелению, легким, куда он пожелает, - (37) и шайтанов, всякого строителя и водолаза, (38) и других, соединенных в цепях.", "n": "Шайтаны подчинены Сулейману: «все строители и ныряльщики» и другие, «скованные цепями».", "c": null}, {"ref": "21:81", "sura": "Al-Anbiyaa", "sura_ar": "سُورَةُ الأَنبِيَاءِ", "type": "Meccan", "ar": "وَلِسُلَيْمَٰنَ ٱلرِّيحَ عَاصِفَةًۭ تَجْرِى بِأَمْرِهِۦٓ إِلَى ٱلْأَرْضِ ٱلَّتِى بَٰرَكْنَا فِيهَا ۚ وَكُنَّا بِكُلِّ شَىْءٍ عَٰلِمِينَ ﴿81﴾", "ru": "А Сулайману - ветер, когда он, дуя, устремляется по его повелению в землю, которую Мы благословили, и Мы знали про все.", "n": "Для Сулеймана — бурный ветер, дующий по его приказу.", "c": null}, {"ref": "15:27", "sura": "Al-Hijr", "sura_ar": "سُورَةُ الحِجۡرِ", "type": "Meccan", "ar": "وَٱلْجَآنَّ خَلَقْنَٰهُ مِن قَبْلُ مِن نَّارِ ٱلسَّمُومِ ﴿27﴾", "ru": "И гениев Мы сотворили раньше из огня знойного.", "n": "Джинны созданы «раньше из жара огня».", "c": null}, {"ref": "55:15", "sura": "Ar-Rahmaan", "sura_ar": "سُورَةُ الرَّحۡمَٰن", "type": "Medinan", "ar": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ ﴿15﴾", "ru": "и сотворил джиннов из чистого огня.", "n": "Джинн создан «из смеси бездымного огня».", "c": null}, {"ref": "2:275", "sura": "Al-Baqara", "sura_ar": "سُورَةُ البَقَرَةِ", "type": "Medinan", "ar": "ٱلَّذِينَ يَأْكُلُونَ ٱلرِّبَوٰا۟ لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ ٱلَّذِى يَتَخَبَّطُهُ ٱلشَّيْطَٰنُ مِنَ ٱلْمَسِّ ۚ ذَٰلِكَ بِأَنَّهُمْ قَالُوٓا۟ إِنَّمَا ٱلْبَيْعُ مِثْلُ ٱلرِّبَوٰا۟ ۗ وَأَحَلَّ ٱللَّهُ ٱلْبَيْعَ وَحَرَّمَ ٱلرِّبَوٰا۟ ۚ فَمَن جَآءَهُۥ مَوْعِظَةٌۭ مِّن رَّبِّهِۦ فَٱنتَهَىٰ فَلَهُۥ مَا سَلَفَ وَأَمْرُهُۥٓ إِلَى ٱللَّهِ ۖ وَمَنْ عَادَ فَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَٰلِدُونَ ﴿275﴾", "ru": "Те, которые пожирают рост, восстанут только такими же, как восстанет тот, кого повергает сатана своим прикосновением. Это - за то, что они говорили: \"Ведь торговля - то же , что рост\". А Аллах разрешил торговлю и запретил рост. К кому приходит увещание от его Господа и он удержится, тому (прощено), что предшествовало: дело его принадлежит Аллаху; а кто повторит, те - обитатели огня, они в нем вечно пребывают!", "n": "Берущие рост «встанут, как встаёт тот, кого шайтан поразил своим прикосновением и свёл с ума».", "c": null}]}];
const $ = s => document.querySelector(s);
const total = DATA.reduce((a,s)=>a+s.verses.length,0);
const esc = t => (t||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let cur = "home", q = "";

function buildNav(){
  const items = [{id:"home",icon:"⌂",title:"Начало и методика",n:total},...DATA.map(s=>({id:s.id,icon:s.icon,title:s.title,n:s.verses.length}))];
  $("#nav").innerHTML = items.map(i=>`<button data-id="${i.id}" class="${i.id===cur&&q.length<2?"on":""}"><span class="ic">${i.icon}</span><span>${i.title}</span><span class="ct">${i.n}</span></button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.id));
}

function hl(t){
  const e = esc(t);
  if(q.length<2) return e;
  const re = new RegExp("("+esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return e.replace(re,"<mark>$1</mark>");
}

function card(v, secTitle){
  const [s,a]=v.ref.split(":");
  return `<article class="card">
  <div class="ref"><span class="r">Сура ${s}, аят ${a}</span><span class="s">${v.sura} · ${v.sura_ar}</span>
  <span class="tag">${v.type==="Meccan"?"Мекканская":"Мединская"}${secTitle?" · "+esc(secTitle):""}</span>
  <button class="copy" data-copy="${v.ref}">копировать</button></div>
  <div class="ar" lang="ar">${v.ar}</div>
  <blockquote class="ru" style="margin-left:0">${hl(v.ru)}</blockquote>
  ${v.n?`<p class="n"><b>В чём вопрос</b>${hl(v.n)}</p>`:""}
  ${v.c?`<p class="c"><b>Контекст / традиционное объяснение</b>${hl(v.c)}</p>`:""}
  </article>`;
}

function home(){
  return `<h2>Критический доклад о Коране</h2>
  <p class="intro">Сборник аятов, сгруппированных по темам, с дословным текстом (арабский оригинал и русский перевод) и краткими комментариями. Всего ${total} фрагментов в ${DATA.length} разделах.</p>
  <div class="grid">${DATA.map(s=>`<div class="tile" data-id="${s.id}"><div class="big">${s.icon}</div><div class="t">${s.title}</div><div class="k">${s.verses.length} фрагментов</div></div>`).join("")}</div>
  <div class="note"><h3>Источник текстов</h3>Арабский текст — по Усмановскому списку (Tanzil), русский — перевод И. Ю. Крачковского (в общественном достоянии). Тексты загружены автоматически из открытой базы alquran.cloud, а не набраны вручную; нумерация аятов общепринятая.</div>
  <div class="note"><h3>Как читать</h3><ul>
  <li><b>В чём вопрос</b> — суть претензии критиков к данному месту.</li>
  <li><b>Контекст / традиционное объяснение</b> — обстоятельства ниспослания и то, как этот аят объясняют сами мусульманские богословы. Блок можно отключить в меню слева.</li>
  <li>Переводы отличаются: у Кулиева, Османова, Пороховой и др. формулировки иные. Для серьёзной работы сверяйте аяты по нескольким переводам.</li></ul></div>
  <div class="note"><h3>Что важно учитывать</h3><ul>
  <li>Многие аяты мединского периода связаны с войнами VII века; в тексте не всегда есть оговорка об обстоятельствах, и именно это обсуждают богословы.</li>
  <li>Исламская традиция использует доктрину отмены (насх) и науку тафсира (комментарий). Критику стоит сопоставлять с ними, чтобы её нельзя было отвести как «вырванную из контекста».</li>
  <li>Апологеты толкуют антинаучные утверждения как метафоры; критики — что текст говорит буквально. Оба прочтения приведены.</li></ul></div>`;
}

function pager(id){
  const ids=["home",...DATA.map(s=>s.id)], i=ids.indexOf(id);
  const t=x=>x==="home"?"Начало":DATA.find(s=>s.id===x).title;
  return `<div class="pager">${i>0?`<button data-id="${ids[i-1]}">← ${t(ids[i-1])}</button>`:"<span></span>"}${i<ids.length-1?`<button data-id="${ids[i+1]}">${t(ids[i+1])} →</button>`:""}</div>`;
}
function section(s){
  return `<h2>${s.icon} ${s.title}</h2><p class="intro">${esc(s.intro)}</p>${s.verses.map(v=>card(v)).join("")}${pager(s.id)}`;
}
function searchResults(){
  const ql=q.toLowerCase(); let out="",n=0;
  DATA.forEach(s=>s.verses.forEach(v=>{
    if((v.ru+" "+(v.n||"")+" "+(v.c||"")+" "+v.ref).toLowerCase().includes(ql)){out+=card(v,s.title);n++;}
  }));
  return `<h2>Поиск: «${esc(q)}»</h2><p class="intro">Найдено фрагментов: ${n}</p>${out||"<p>Ничего не найдено.</p>"}`;
}

function render(){
  const m=$("#main");
  const body = q.length>=2 ? searchResults() : (cur==="home"?home():section(DATA.find(s=>s.id===cur)));
  m.innerHTML = `<input class="search" id="q" placeholder="Поиск по всем аятам и комментариям (например: убивайте, женщины, солнце)…" value="${esc(q).replace(/"/g,"&quot;")}">`+body;
  const inp=$("#q");
  inp.oninput=e=>{q=e.target.value.trim();render();const i=$("#q");i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  m.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>go(b.dataset.id));
  m.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
    const v=DATA.flatMap(s=>s.verses).find(x=>x.ref===b.dataset.copy);
    navigator.clipboard.writeText("Коран "+v.ref+" — "+v.ru);b.textContent="скопировано";setTimeout(()=>b.textContent="копировать",1200)});
  buildNav();
}
function go(id){cur=id;q="";location.hash=id;render();window.scrollTo(0,0);$("#side").classList.remove("open")}

$("#tAr").onchange=e=>document.body.classList.toggle("hide-ar",!e.target.checked);
$("#tC").onchange=e=>document.body.classList.toggle("hide-c",!e.target.checked);
$("#tTheme").onchange=e=>document.documentElement.dataset.theme=e.target.checked?"dark":"";
$("#menu").onclick=()=>$("#side").classList.toggle("open");
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==cur&&(h==="home"||DATA.some(s=>s.id===h))){cur=h;q="";render()}});
{const h=location.hash.slice(1);if(h&&DATA.some(s=>s.id===h))cur=h}
render();
</script>
</body>
</html>
